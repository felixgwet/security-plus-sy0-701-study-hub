<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security+ SY0-701 — Analytics</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; color: #e8eaf0; background: #0d1117; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: #9aa4b2; margin-bottom: 24px; }
  .sub a { color: #7fb0ff; text-decoration: none; }
  h2 { font-size: 18px; margin: 36px 0 14px; border-bottom: 1px solid #2d333b; padding-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .card { background: #161b22; border: 1px solid #2d333b; border-radius: 12px; padding: 18px 20px; }
  .card .k { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #9aa4b2; margin-bottom: 6px; }
  .card .v { font-size: 26px; font-weight: 700; }
  .card .s { font-size: 13px; color: #9aa4b2; margin-top: 4px; }
  .verdict-big { font-size: 22px; font-weight: 700; margin: 6px 0 2px; }
  .ready { color: #3fb950; } .likely { color: #7ee787; } .borderline { color: #d29922; } .notyet { color: #f85149; }
  .bar-track { background: #21262e; border-radius: 999px; height: 12px; overflow: hidden; margin-top: 10px; position: relative; }
  .bar-fill { height: 100%; border-radius: 999px; background: #3fb950; transition: width .4s; }
  .pass-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #d29922; }
  .scale-labels { display: flex; justify-content: space-between; font-size: 12px; color: #9aa4b2; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #21262e; }
  thead th { color: #9aa4b2; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tbody tr:hover { background: #161b22; }
  .num { color: #6e7681; width: 40px; }
  .pctcell { width: 220px; }
  .mini-track { background: #21262e; border-radius: 999px; height: 8px; overflow: hidden; }
  .mini-fill { height: 100%; }
  .strong { color: #3fb950; } .ok { color: #d29922; } .weak { color: #f85149; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid #30363d; color: #9aa4b2; margin-left: 6px; }
  a { color: #7fb0ff; text-decoration: none; } a:hover { text-decoration: underline; }
  .links a { margin-right: 10px; font-size: 13px; }
  .rec { background: #161b22; border: 1px solid #2d333b; border-left: 3px solid #d29922; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; font-size: 14px; line-height: 1.55; }
  .empty { text-align: center; padding: 60px 20px; background: #161b22; border: 1px solid #2d333b; border-radius: 12px; }
  .empty p { color: #9aa4b2; margin: 8px 0 18px; }
  .btn { display: inline-block; padding: 10px 22px; border-radius: 8px; border: none; background: #238636; color: #fff; font-size: 14px; cursor: pointer; text-decoration: none; }
  .btn.ghost { background: transparent; border: 1px solid #30363d; color: #9aa4b2; }
  .btn:hover { filter: brightness(1.1); text-decoration: none; }
  .muted { color: #9aa4b2; font-size: 13px; }
  .trend-bar { display: inline-block; width: 90px; height: 10px; background: #21262e; border-radius: 4px; overflow: hidden; vertical-align: middle; margin-right: 8px; }
  .trend-fill { height: 100%; }
  /* readiness chart + drilldown */
  .chart { display: flex; align-items: flex-end; gap: 10px; height: 190px; padding: 14px 10px 4px; position: relative; border-bottom: 1px solid #2d333b; }
  .chart-pass { position: absolute; left: 10px; right: 10px; border-top: 2px dashed #d29922; z-index: 1; }
  .chart-pass span { position: absolute; right: 0; top: -18px; font-size: 11px; color: #d29922; }
  .chart-col { flex: 1; max-width: 64px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; z-index: 2; }
  .chart-bar { width: 100%; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, #58a6ff, #2f6fce); min-height: 3px; }
  .chart-bar.latest { background: linear-gradient(180deg, #f0883e, #e36414); box-shadow: 0 0 14px rgba(240,136,62,.4); }
  .chart-bar.failed { background: linear-gradient(180deg, #f85149, #a7221d); }
  .chart-val { font-size: 11px; font-weight: 700; margin-bottom: 4px; }
  .chart-lbl { font-size: 10px; color: #9aa4b2; margin-top: 6px; white-space: nowrap; }
  details.att { background: #161b22; border: 1px solid #2d333b; border-radius: 10px; margin-bottom: 8px; }
  details.att summary { cursor: pointer; padding: 12px 16px; font-size: 14px; list-style: none; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  details.att summary::-webkit-details-marker { display: none; }
  details.att summary:hover { background: #161b22; }
  details.att .caret { color: #6e7681; font-size: 12px; }
  details.att[open] .caret { transform: rotate(90deg); }
  .att-body { padding: 4px 18px 14px 34px; }
  .att-row { display: grid; grid-template-columns: minmax(140px,220px) 1fr 90px; gap: 10px; align-items: center; padding: 4px 0; font-size: 13px; }
  .delta-up { color: #3fb950; } .delta-down { color: #f85149; } .delta-flat { color: #9aa4b2; }
</style>
<style id="iphone-optimizations">
/* iPhone / touch optimizations */
html { -webkit-text-size-adjust: 100%; }
body { -webkit-tap-highlight-color: rgba(88,166,255,.25); }
button, .btn, .opt, .pal-btn, input, select, textarea { min-height: 44px; font-size: 16px; }
.q-text, .screen p { overflow-wrap: break-word; }
@media (max-width: 640px) {
  .container, .wrap { padding-left: 12px; padding-right: 12px; }
  .screen { padding: 24px 16px; }
  .exam-facts { flex-wrap: wrap; }
  .card { padding: 16px; }
}
</style>
<style id="colorful-theme">
/* ===== colorful theme override (inject-color.js) ===== */
body { background-image:
  radial-gradient(900px 420px at 85% -8%, rgba(240,136,62,.10), transparent 60%),
  radial-gradient(700px 380px at -5% 108%, rgba(88,166,255,.08), transparent 60%),
  radial-gradient(500px 300px at 50% 50%, rgba(227,75,169,.04), transparent 70%);
  background-attachment: fixed; }
h1 { background: linear-gradient(90deg, #f0883e 0%, #e34ba9 55%, #58a6ff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.badge { background: linear-gradient(90deg, rgba(240,136,62,.20), rgba(88,166,255,.14)) !important;
  border: 1px solid rgba(240,136,62,.45) !important; color: #ffd9b3 !important; }
.btn { background: linear-gradient(135deg, #f0883e, #e36414) !important;
  border: none !important; box-shadow: 0 3px 14px rgba(240,136,62,.35); }
.btn:hover { filter: brightness(1.12); box-shadow: 0 5px 20px rgba(240,136,62,.55); }
.btn.ghost { background: rgba(240,136,62,.10) !important; border: 1px solid rgba(240,136,62,.5) !important;
  box-shadow: none; color: #ffb26b !important; }
a { color: #7fb0ff; }
.fact b { background: linear-gradient(90deg, #f0883e, #e34ba9); -webkit-background-clip: text;
  background-clip: text; color: transparent; }
.score-big { background: linear-gradient(90deg, #f0883e, #e34ba9, #58a6ff);
  -webkit-background-clip: text; background-clip: text; color: transparent !important; }
.verdict { text-shadow: 0 0 22px rgba(240,136,62,.35); }
.tile, .q-card, .card { border-color: #303a4a; transition: border-color .15s, transform .15s; }
.tile:hover, .q-card:hover { border-color: #f0883e !important; }
.option.selected, .opt.selected, .pal-btn.answered { border-color: #f0883e !important;
  background: linear-gradient(135deg, rgba(240,136,62,.22), rgba(227,75,169,.14)) !important; }
.pal-btn.flagged { border-color: #e34ba9 !important; }
::selection { background: rgba(240,136,62,.4); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #0d1117; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #f0883e, #e34ba9); border-radius: 5px; }
table tbody tr:hover { background: rgba(240,136,62,.06) !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Security+ SY0-701 — Analytics</h1>
  <div class="sub"><a href="library.html">&larr; Back to library</a> · results from every full exam, mega exam, and section final you finish</div>
  <div id="app"><div class="empty"><p>Loading…</p></div></div>
</div>

<script>
const KEY = 'secplus_results_v1';
const SECTIONS = [
  {num:0,slug:'exam-tips'},{num:1,slug:'security-fundamentals'},{num:2,slug:'threat-actors'},{num:3,slug:'physical-security'},
  {num:4,slug:'social-engineering'},{num:5,slug:'malware'},{num:6,slug:'data-protection'},
  {num:7,slug:'cryptographic-solutions'},{num:8,slug:'risk-management'},{num:9,slug:'third-party-vendor-risks'},
  {num:10,slug:'governance-and-compliance'},{num:11,slug:'asset-and-change-management'},{num:12,slug:'audits-and-assessments'},
  {num:13,slug:'cyber-resilience'},{num:14,slug:'security-architecture'},{num:15,slug:'security-infrastructure'},
  {num:16,slug:'identity-and-access-management'},{num:17,slug:'vulnerabilities-and-attacks'},{num:18,slug:'malicious-activity'},
  {num:19,slug:'hardening'},{num:20,slug:'security-techniques'},{num:21,slug:'vulnerability-management'},
  {num:22,slug:'alerting-and-monitoring'},{num:23,slug:'incident-response'},{num:24,slug:'investigating-an-incident'},
  {num:25,slug:'automation-and-orchestration'},{num:26,slug:'security-awareness'},{num:27,slug:'exam-readiness'},
  {num:28,slug:'conclusion'}
];
const NOTES_OVERRIDE = { 'cyber-resilience': 'cyber-resilience-and-redundancy-study-notes.html' };
// Official exam domains (Objectives v5.0) mapped to this pack's sections
const DOMAINS = [
  ['1.0 General Security Concepts', 12, ['security-fundamentals','asset-and-change-management','cryptographic-solutions']],
  ['2.0 Threats, Vulnerabilities & Mitigations', 22, ['threat-actors','physical-security','social-engineering','malware','vulnerabilities-and-attacks','malicious-activity','hardening']],
  ['3.0 Security Architecture', 18, ['data-protection','security-architecture','security-infrastructure','identity-and-access-management']],
  ['4.0 Security Operations', 28, ['security-techniques','vulnerability-management','alerting-and-monitoring','incident-response','investigating-an-incident','automation-and-orchestration']],
  ['5.0 Security Program Management & Oversight', 20, ['risk-management','third-party-vendor-risks','governance-and-compliance','audits-and-assessments','cyber-resilience','security-awareness']],
];
function domainOf(slug){
  for (const [name,,slugs] of DOMAINS) if (slugs.includes(slug)) return name;
  return 'Cross-domain (course wrap-up)';
}
function titleize(s){ const small=new Set(['and','of','the','for','in','a','an','to']); return s.split('-').map((w,i)=> i>0&&small.has(w) ? w : w[0].toUpperCase()+w.slice(1)).join(' '); }
function pct(x){ return Math.round(x*100); }
function load(){
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ return []; }
}
function scaledOf(p){ return Math.round(100 + 800*p); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function fmtLeft(s){
  if (s == null) return '—';
  const m = Math.floor(s/60), ss = Math.floor(s%60);
  return m + ':' + String(ss).padStart(2,'0');
}

/* ---------- backup & restore ---------- */
const BACKUP_KEYS = ['secplus_results_v1', 'secplus_cards_v1', 'secplus_review_v1'];
function exportBackup(){
  const data = {};
  BACKUP_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v) { try { data[k] = JSON.parse(v); } catch(e){} } });
  const payload = { app: 'security-plus-sy0-701', kind: 'study-backup', version: 1, exportedAt: new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'security-plus-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function validAttempt(a){
  return a && typeof a.exam === 'string' && typeof a.file === 'string'
    && isFinite(+a.points) && isFinite(+a.total) && (+a.total) > 0
    && (a.pct == null ? (a.pct = (+a.points)/(+a.total)) : isFinite(+a.pct));
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); } catch(e){ return importStatus('That file is not valid JSON.', false); }
    // accept a full backup object {data:{...}} or a bare results array
    const data = (parsed && parsed.data) ? parsed.data
               : Array.isArray(parsed) ? { secplus_results_v1: parsed }
               : null;
    if (!data) return importStatus('Unrecognized backup format.', false);
    let added = 0, merged = 0;
    // results: merge by exam+date so re-importing never duplicates
    const incoming = Array.isArray(data.secplus_results_v1) ? data.secplus_results_v1.filter(validAttempt) : [];
    if (incoming.length){
      const cur = load();
      const seen = new Set(cur.map(a => a.exam + '|' + a.date));
      incoming.forEach(a => {
        const k = a.exam + '|' + a.date;
        if (seen.has(k)) merged++;
        else { cur.push(a); seen.add(k); added++; }
      });
      localStorage.setItem(KEY, JSON.stringify(cur));
    }
    // card & notes-review progress: shallow-merge per deck/topic
    ['secplus_cards_v1', 'secplus_review_v1'].forEach(k => {
      if (!data[k] || typeof data[k] !== 'object') return;
      let cur = {};
      try { cur = JSON.parse(localStorage.getItem(k) || '{}'); } catch(e){}
      Object.entries(data[k]).forEach(([deck, st]) => { cur[deck] = Object.assign({}, cur[deck] || {}, st); });
      localStorage.setItem(k, JSON.stringify(cur));
    });
    importStatus('Imported ' + added + ' new attempt' + (added === 1 ? '' : 's') + (merged ? ' (' + merged + ' already present)' : '') + '. Reloading…', true);
    setTimeout(() => location.reload(), 1200);
  };
  reader.onerror = () => importStatus('Could not read that file.', false);
  reader.readAsText(file);
}
function importStatus(msg, ok){
  let el = document.getElementById('import-status');
  if (!el) return;
  el.textContent = msg;
  el.style.color = ok ? '#3fb950' : '#f85149';
}
function wireBackupUI(root){
  const exp = root.querySelector('[data-export]');
  if (exp) exp.addEventListener('click', exportBackup);
  const inp = root.querySelector('[data-import-input]');
  const btn = root.querySelector('[data-import]');
  if (inp && btn) btn.addEventListener('click', () => inp.click());
  if (inp) inp.addEventListener('change', () => { if (inp.files && inp.files[0]) importBackup(inp.files[0]); });
}
const backupBar = `<div style="margin-top:36px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <button class="btn ghost" data-export>Export backup</button>
    <button class="btn ghost" data-import>Import backup</button>
    <input type="file" data-import-input accept="application/json,.json" style="display:none">
    <span id="import-status" class="muted" style="width:100%"></span>
    <button class="btn ghost" data-clear>Clear all data</button>
  </div>`;

const attempts = load().sort((a,b)=>new Date(a.date)-new Date(b.date));
const app = document.getElementById('app');

if (!attempts.length) {
  app.innerHTML = `<div class="empty">
    <h2 style="border:none;margin:0">No exam data yet</h2>
    <p>Finish any timed exam (CompTIA-style full exam, mega exam, or section final)<br>and your results will appear here — strengths, weaknesses, readiness, predicted score.</p>
    <a class="btn" href="exam-simulator/SY0-701-comptia-full-exam-1-foundations.html">Take CompTIA-Style Exam 1 (Foundations)</a>
  </div>
  <h2>Backup &amp; restore</h2>
  <p class="muted" style="margin-top:-6px">Your history is stored only in this browser. Export a backup file after each study session and import it on your phone or another device — or to recover after a browser reset.</p>` + backupBar;
  wireBackupUI(app.parentElement);
  const clr = document.querySelector('[data-clear]');
  if (clr) clr.addEventListener('click', () => { if (confirm('Delete all tracked results?')) { localStorage.removeItem(KEY); location.reload(); } });
} else {
  // recency-weighted performance
  let wsum=0, w=0;
  attempts.forEach((a,i)=>{ const wi=i+1; wsum+=wi*a.pct; w+=wi; });
  const wpct = wsum/w;
  const scaled = scaledOf(wpct);
  const passed = scaled >= 750;

  let tier, tclass, tlabel;
  if (wpct >= 0.85)      { tier='Exam-ready';           tclass='ready';      tlabel='You are ready — book the exam.'; }
  else if (wpct >= 0.8125){ tier='Likely to pass';       tclass='likely';    tlabel='On track — polish the weak sections below.'; }
  else if (wpct >= 0.72) { tier='Borderline';            tclass='borderline'; tlabel='Close, but below the 750 pass line. Focused study on weaknesses could tip you over.'; }
  else if (wpct >= 0.60) { tier='Not yet';               tclass='notyet';    tlabel='Below passing level right now. Work the plan below and re-test.'; }
  else                   { tier='Early stages';          tclass='notyet';    tlabel='Build fundamentals first — start with the topic quizzes in weak sections.'; }

  const best = Math.max(...attempts.map(a=>a.pct));
  const avg = attempts.reduce((s,a)=>s+a.pct,0)/attempts.length;
  const last = attempts[attempts.length-1];

  // per-section aggregation
  const secAgg = {};
  attempts.forEach(a=>{
    Object.entries(a.sections||{}).forEach(([slug,v])=>{
      if(!secAgg[slug]) secAgg[slug]={c:0,t:0};
      secAgg[slug].c+=v.c; secAgg[slug].t+=v.t;
    });
  });
  const secRows = Object.entries(secAgg).map(([slug,v])=>({slug, pct:v.c/v.t, t:v.t}))
    .filter(r=>r.slug!=='mixed').sort((a,b)=>b.pct-a.pct);
  const strengths = secRows.filter(r=>r.t>=3 && r.pct>=0.8).slice(0,5);
  const weaknesses = secRows.slice(-5).reverse().filter(r=>r.pct<0.85);

  function secLinks(slug){
    const meta = SECTIONS.find(s=>s.slug===slug);
    const notes = NOTES_OVERRIDE[slug] || (slug+'-study-notes.html');
    let h = `<a href="exam-simulator/${slug}-quiz.html">Quiz</a>`;
    h += `<a href="exam-simulator/${encodeURIComponent(notes)}">Notes</a>`;
    if (meta) { const nn = meta.num === 0 ? '00' : String(meta.num); h += `<a href="exam-simulator/SY0-701-exam-simulator-${nn}-${slug}.html">Simulator</a>`; }
    h += `<a href="exam-simulator/SY0-701-final-exam-${slug}.html">Final</a>`;
    return h;
  }
  function barColor(p){ return p>=0.85 ? '#3fb950' : p>=0.7 ? '#d29922' : '#f85149'; }
  function clsOf(p){ return p>=0.85 ? 'strong' : p>=0.7 ? 'ok' : 'weak'; }
  function labelOf(p){ return p>=0.85 ? 'Strong' : p>=0.7 ? 'Developing' : 'Weak'; }

  // predicted band
  const lo = Math.max(100, scaledOf(wpct) - 25), hi = Math.min(900, scaledOf(wpct) + 25);
  let plabel;
  if (wpct>=0.875) plabel='Very likely to pass';
  else if (wpct>=0.8125) plabel='More likely than not to pass';
  else if (wpct>=0.75) plabel='A coin flip around the pass line';
  else if (wpct>=0.65) plabel='Unlikely to pass';
  else plabel='Very unlikely to pass';

  let html = '';

  // readiness card
  html += `<div class="card" style="margin-bottom:14px">
    <div class="k">Exam readiness — weighted by recency, ${attempts.length} attempt${attempts.length>1?'s':''}</div>
    <div class="verdict-big ${tclass}">${tier} · predicted score ≈ ${scaled} / 900</div>
    <div class="muted">If you sat the real SY0-701 today, based on your tracked performance you'd most likely land in the <b style="color:var(--text)">${lo}–${hi}</b> band (pass mark 750) — ${plabel}.</div>
    <div class="bar-track"><div class="bar-fill" style="width:${((scaled-100)/800*100).toFixed(1)}%;background:${barColor(wpct)}"></div><div class="pass-mark" style="left:${((750-100)/800*100).toFixed(1)}%"></div></div>
    <div class="scale-labels"><span>100</span><span style="color:var(--gold)">750 pass</span><span>900</span></div>
    <div style="margin-top:10px" class="muted">${tlabel}</div>
  </div>`;

  // stats
  html += `<div class="grid">
    <div class="card"><div class="k">Latest</div><div class="v">${pct(last.pct)}%</div><div class="s">${scaledOf(last.pct)} / 900 · ${fmtDate(last.date)}</div></div>
    <div class="card"><div class="k">Average</div><div class="v">${pct(avg)}%</div><div class="s">${attempts.length} exam${attempts.length>1?'s':''} taken</div></div>
    <div class="card"><div class="k">Best</div><div class="v">${pct(best)}%</div><div class="s">${scaledOf(best)} / 900</div></div>
    <div class="card"><div class="k">Pass mark</div><div class="v">≈ 81%</div><div class="s">750 of 900 scaled</div></div>
  </div>`;

  // attempts history
  html += `<h2>Attempt history</h2><table><thead><tr><th>When</th><th>Exam</th><th>Score</th><th>Trend</th><th>Scaled</th><th>Verdict</th><th>Time left</th></tr></thead><tbody>`;
  attempts.slice().reverse().forEach(a=>{
    const s = scaledOf(a.pct), p = a.pct>=1; // unused guard
    html += `<tr>
      <td class="muted">${fmtDate(a.date)}</td>
      <td><a href="exam-simulator/${encodeURIComponent(a.file)}">${a.exam.replace('CompTIA Security+ SY0-701 · ','').replace(' — CompTIA Security+ SY0-701','')}</a></td>
      <td>${pct(a.pct)}% <span class="muted">(${(+a.points).toFixed(1)}/${a.total})</span></td>
      <td class="pctcell"><span class="trend-bar"><span class="trend-fill" style="display:block;width:${pct(a.pct)}%;background:${barColor(a.pct)}"></span></span></td>
      <td>${s}</td>
      <td class="${s>=750?'strong':'weak'}">${s>=750?'PASS':'Below'}</td>
      <td class="muted">${fmtLeft(a.timeLeft)}</td>
    </tr>`;
  });
  html += `</tbody></table>`;

  // readiness trend chart
  html += `<h2>Readiness trend</h2>`;
  if (attempts.length > 1) {
    const chartH = 150;
    const passY = chartH * (1 - (750 - 100) / 800);
    html += `<div class="card"><div class="chart">`;
    html += `<div class="chart-pass" style="bottom:${(passY + 14).toFixed(0)}px"><span>750 pass</span></div>`;
    attempts.forEach((a, i) => {
      const s = scaledOf(a.pct);
      const h = Math.max(3, chartH * (s - 100) / 800);
      const cls = i === attempts.length - 1 ? 'chart-bar latest' : (s >= 750 ? 'chart-bar' : 'chart-bar failed');
      html += `<div class="chart-col" title="${a.exam} — ${s}/900 on ${fmtDate(a.date)}">
        <div class="chart-val">${s}</div>
        <div class="${cls}" style="height:${h.toFixed(0)}px"></div>
        <div class="chart-lbl">#${i + 1} · ${new Date(a.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</div>
      </div>`;
    });
    html += `</div><div class="muted" style="margin-top:8px">Scaled score (100–900) per attempt, oldest to newest. ${passed ? 'You are above the pass line — the goal now is holding it under harder exams.' : 'Climb above the dashed 750 line consistently before booking the real exam.'}</div></div>`;
  } else {
    html += `<p class="muted">Finish a second exam and your readiness trend will chart here.</p>`;
  }

  // consistency, momentum, pacing, distance to pass
  const pcts = attempts.map(a => a.pct);
  const variance = pcts.reduce((s, p) => s + (p - avg) * (p - avg), 0) / pcts.length;
  const stddev = Math.sqrt(variance);
  const spread = Math.max(...pcts) - Math.min(...pcts);
  const prev = attempts.length > 1 ? attempts[attempts.length - 2] : attempts[0];
  const mom = last.pct - prev.pct;
  const timed = attempts.filter(a => a.timeLeft != null);
  const avgLeft = timed.length ? timed.reduce((s, a) => s + a.timeLeft, 0) / timed.length : null;
  const squeaked = timed.filter(a => a.timeLeft !== null && a.timeLeft < 60).length;
  const lastScaled = scaledOf(last.pct);
  const qNeeded = lastScaled >= 750 ? 0 : Math.max(1, Math.ceil((0.8125 - last.pct) * 90));
  html += `<div class="grid" style="margin-top:12px">
    <div class="card"><div class="k">Consistency</div><div class="v">&plusmn;${Math.round(stddev * 100)}<span style="font-size:14px">pp</span></div><div class="s">score spread ${Math.round(spread * 100)}pp best&harr;worst — ${stddev < 0.05 ? 'very consistent, scores you can trust' : stddev < 0.1 ? 'fairly consistent' : 'volatile — one good exam isn&rsquo;t proof yet'}</div></div>
    <div class="card"><div class="k">Momentum</div><div class="v ${mom >= 0 ? 'delta-up' : 'delta-down'}">${mom >= 0 ? '+' : ''}${Math.round(mom * 100)}<span style="font-size:14px">pp</span></div><div class="s">latest attempt vs the one before</div></div>
    <div class="card"><div class="k">Pacing</div><div class="v">${avgLeft == null ? '&mdash;' : fmtLeft(avgLeft)}</div><div class="s">${timed.length ? `average time left across ${timed.length} timed attempt${timed.length > 1 ? 's' : ''}${squeaked ? ` · ${squeaked} finished under 1:00 left` : ''}` : 'no timing data recorded'}</div></div>
    <div class="card"><div class="k">Distance to pass</div><div class="v">${lastScaled >= 750 ? '&check;' : '+' + qNeeded}</div><div class="s">${lastScaled >= 750 ? 'your latest attempt already clears the 750 line' : 'more correct answers needed on a 90-question exam, based on your latest attempt'}</div></div>
  </div>`;

  // domain coverage
  const domAgg = {};
  Object.entries(secAgg).forEach(([slug, v]) => {
    const d = domainOf(slug);
    if (!domAgg[d]) domAgg[d] = { c: 0, t: 0 };
    domAgg[d].c += v.c; domAgg[d].t += v.t;
  });
  html += `<h2>Domain coverage — official SY0-701 weighting</h2>`;
  if (Object.keys(domAgg).length) {
    html += `<table><thead><tr><th>Domain</th><th>Real exam weight</th><th>Your mastery</th><th>Level</th><th>Questions</th></tr></thead><tbody>`;
    DOMAINS.forEach(([name, weight]) => {
      const agg = domAgg[name];
      if (!agg) return;
      const p = agg.c / agg.t;
      html += `<tr><td>${name}</td><td class="muted">${weight}%</td><td class="pctcell"><span class="trend-bar" style="width:140px"><span class="trend-fill" style="display:block;width:${pct(p)}%;background:${barColor(p)}"></span></span> <b class="${clsOf(p)}">${pct(p)}%</b></td><td class="${clsOf(p)}">${labelOf(p)}</td><td class="muted">${agg.t}</td></tr>`;
    });
    if (domAgg['Cross-domain (course wrap-up)']) {
      const agg = domAgg['Cross-domain (course wrap-up)'];
      const p = agg.c / agg.t;
      html += `<tr><td>Cross-domain (exam tips &amp; course wrap-up)</td><td class="muted">&mdash;</td><td class="pctcell"><span class="trend-bar" style="width:140px"><span class="trend-fill" style="display:block;width:${pct(p)}%;background:${barColor(p)}"></span></span> <b class="${clsOf(p)}">${pct(p)}%</b></td><td class="${clsOf(p)}">${labelOf(p)}</td><td class="muted">${agg.t}</td></tr>`;
    }
    html += `</tbody></table>`;
  } else {
    html += `<p class="muted">No per-section data recorded yet — take a section final or full exam.</p>`;
  }

  // per-attempt drilldown
  html += `<h2>Attempt drilldown</h2><p class="muted" style="margin-top:-6px">Expand any attempt for its per-section breakdown — exactly where points were lost, worst section first.</p>`;
  attempts.slice().reverse().forEach((a) => {
    const s = scaledOf(a.pct);
    const secs = Object.entries(a.sections || {}).filter(([slug]) => slug !== 'mixed')
      .map(([slug, v]) => ({ slug, p: v.t ? v.c / v.t : 0, c: v.c, t: v.t }))
      .sort((x, y) => x.p - y.p);
    html += `<details class="att"><summary>
      <span class="caret">&#9654;</span>
      <b>${a.exam.replace('CompTIA Security+ SY0-701 · ', '')}</b>
      <span class="muted">${fmtDate(a.date)}</span>
      <span class="${s >= 750 ? 'strong' : 'weak'}">${pct(a.pct)}% &middot; ${s}/900 ${s >= 750 ? 'PASS' : 'below'}</span>
      <span class="muted">time left ${fmtLeft(a.timeLeft)}</span>
    </summary><div class="att-body">`;
    if (secs.length) {
      secs.forEach(r => {
        html += `<div class="att-row"><span>${titleize(r.slug)}</span><span class="mini-track"><span class="mini-fill" style="display:block;width:${pct(r.p)}%;background:${barColor(r.p)}"></span></span><span class="muted">${(+r.c).toFixed(1)}/${r.t}</span></div>`;
      });
    } else {
      html += `<div class="muted">No per-section data recorded for this attempt.</div>`;
    }
    html += `</div></details>`;
  });

  // strengths & weaknesses
  html += `<h2>Strengths &amp; weaknesses by section</h2>`;
  if (secRows.length){
    html += `<table><thead><tr><th>#</th><th>Section</th><th>Mastery</th><th>Level</th><th>Questions</th><th>Study</th></tr></thead><tbody>`;
    secRows.forEach(r=>{
      const meta = SECTIONS.find(s=>s.slug===r.slug);
      html += `<tr>
        <td class="num">${meta?meta.num:'—'}</td>
        <td>${titleize(r.slug)}</td>
        <td class="pctcell"><span class="trend-bar" style="width:140px"><span class="trend-fill" style="display:block;width:${pct(r.pct)}%;background:${barColor(r.pct)}"></span></span> <b class="${clsOf(r.pct)}">${pct(r.pct)}%</b></td>
        <td class="${clsOf(r.pct)}">${labelOf(r.pct)}</td>
        <td class="muted">${r.t}</td>
        <td class="links">${secLinks(r.slug)}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  } else {
    html += `<p class="muted">No per-section data yet.</p>`;
  }

  // what to work on
  const work = (weaknesses.length ? weaknesses : secRows.slice(-5).reverse()).filter(r=>r.pct<0.9).slice(0,5);
  html += `<h2>What to work on</h2>`;
  if (work.length){
    work.forEach((r,i)=>{
      const gap = Math.max(0, 0.85 - r.pct);
      const q = gap > 0.25 ? 'Start with the study notes, then the topic simulator, then retake the section final.'
              : gap > 0.10 ? 'Re-do the topic quiz, review the study notes, then retake the section final.'
              : 'One more pass over the study notes and a quiz should lock this in.';
      html += `<div class="rec"><b>${i+1}. ${titleize(r.slug)}</b> — scoring ${pct(r.pct)}% over ${r.t} question${r.t>1?'s':''}. ${q}
        <div class="muted" style="margin-top:4px">Estimated to close the gap: &asymp;${Math.max(1, Math.round((0.85 - r.pct) * 20))} h of focused study on this section.</div>
        <div class="links" style="margin-top:6px">${secLinks(r.slug)}</div></div>`;
    });
  } else {
    html += `<div class="rec">Nothing glaring — every tracked section is at or above 85%. Take CompTIA-Style Exam 3 (Expert) to confirm under harder conditions.</div>`;
  }

  // strengths callout
  if (strengths.length){
    html += `<h2>Strongest areas</h2><p class="muted" style="margin-top:-6px">` +
      strengths.map(r=>`<b class="strong">${titleize(r.slug)}</b> (${pct(r.pct)}%)`).join(' · ') +
      `</p>`;
  } else {
    html += `<h2>Strongest areas</h2><p class="muted" style="margin-top:-6px">No section is solidly above 80% yet — your strengths will surface as you take more exams.</p>`;
  }

  html += `<h2>Backup &amp; restore</h2>
    <p class="muted" style="margin-top:-6px">Your history is stored only in this browser. Export a backup file after each study session and import it on your phone or another device — or to recover after a browser reset.</p>` + backupBar;

  app.innerHTML = html;
  wireBackupUI(app);
  const clr = document.querySelector('[data-clear]');
  if (clr) clr.addEventListener('click', () => { if (confirm('Delete all tracked results?')) { localStorage.removeItem(KEY); location.reload(); } });
}
</script>
</body>
</html>
