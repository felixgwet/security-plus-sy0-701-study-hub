  <script>
    var DECKS = [{"label":"Section 4 · Social Engineering","cards":[{"id":"kfasra","q":"An attacker phones an employee, identifies himself with the CFO's name obtained from the website, and demands an urgent, confidential wire transfer before market close. Which two social engineering elements are combined in this attack?","a":"Impersonation (of an authority figure) and the urgency motivational trigger","why":"The attacker assumes a specific identity — the CFO, a high-authority figure — which is impersonation, and pressures the victim with a deadline, which is the urgency trigger. Authority-impersonation plus urgency is the classic wire-fraud recipe and a direct path into business email compromise territory.","multi":false},{"id":"1qz44zz","q":"A user receives an email: 'You won a new iPhone! Click to claim it within 4 hours or the offer expires.' Which key phishing indicator does the expiration deadline represent?","a":"Urgency","why":"Forcing the recipient to act immediately — before an offer 'expires' — is the urgency indicator. Urgency (and its cousin scarcity) exists to stop the victim from thinking; the other indicators weren't even needed for the trap to work.","multi":false},{"id":"b7ug5l","q":"Which statement correctly distinguishes phishing from spear phishing?","a":"Phishing is a mass, untargeted campaign (the wide net); spear phishing targets a researched, specific group with customized content and a higher success rate","why":"The course's test: a fake Bank of America email sent to 1M random Americans is phishing (most aren't customers); tailored emails to 500 customers stolen from a breach list is spear phishing. Targeting plus prior research is what makes spear phishing more convincing and more damaging.","multi":false},{"id":"olh3sz","q":"Attackers compromised a popular industry news site that the victim company's engineers visit daily, then loaded it with malware that infected visiting workstations. Which attack is this, and what makes it distinctive?","a":"Watering hole attack — passive, because the target is infected via a trusted third-party site without any direct contact from the attacker","why":"A watering hole attack compromises a site the targets are KNOWN to use and waits. It's passive: no email, call, or message from the attacker — the victims simply visit their habitual site and get compromised. The African-predator metaphor captures it.","multi":false},{"id":"brzk11","q":"An employee answers 'a few quick questions' from a caller about the office's printer and toner. Days later, overpriced toner arrives with an invoice citing the recorded conversation. Which scam is this?","a":"An invoice scam — a fake invoice for goods never properly ordered, anchored by a pretext call and the recorded 'yes'","why":"The invoice scam tricks organizations into paying for unordered supplies. The call sets the pretext and captures agreement; the shipment's bill is far above retail ($950 vs. ~$100/box) with no-refund terms backed by the recording. Any regularly consumed office product works.","multi":false},{"id":"1bphe9l","q":"An attacker registers 'paypa1.com' (digit one for the letter L) and clones the login page to capture credentials from mistyping users. What is this attack called?","a":"Typosquatting — a lookalike/doppelganger domain exploiting typographical errors, also called URL hijacking","why":"Typosquatting (URL hijacking/cyber-squatting) registers domains with common typos or character swaps to catch mistyped URLs. The fraudulent domains are called cousins, lookalikes, or doppelganger domains. Defenses include registering your own misspellings and domain-monitoring.","multi":false},{"id":"qryx75","q":"A Mac user receives a browser pop-up: 'CRITICAL: Your Windows system is infected — call this number immediately.' The user realizes it's fake without any security training. Why?","a":"The claim is technically impossible — Windows malware cannot infect macOS, exposing the alert as a hoax","why":"A hoax is a malicious deception spread to cause panic or action, often paired with phishing. The feasibility check gives it away: the user has no Windows machine, so the 'infection' cannot exist. Critical thinking and fact-checking are the prescribed defenses.","multi":false},{"id":"1eew9ho","q":"During a penetration test, a consultant strikes up a conversation about the Buffalo Bills with an employee wearing team gear, and within minutes the employee describes internal projects. Which motivational trigger does this demonstrate?","a":"Likability — rapport through a shared interest draws the victim into the attacker's sphere of influence","why":"Likability works because people talk freely with people they like and who share their interests. Social engineers deliberately build rapport — friendliness, flirting, sports chatter — because an open, trusting victim volunteers exactly what the attacker needs.","multi":false},{"id":"31uih4","q":"Which attack is defined as 'a coordinated effort to affect public perception or behavior toward a particular cause, individual, or group' — and can be either benign or malicious?","a":"An influence campaign","why":"Influence campaigns coordinate messaging to shape opinion or behavior — benign examples include public-health vaccination drives, malicious ones include nation-state election manipulation (typically nation-state or hacktivist actors, amplified by social media with little fact-checking).","multi":false},{"id":"25u7l","q":"In the course's toner-pretexting demonstration, what did the attacker do immediately AFTER learning the real printer model?","a":"Escalated: asked the receptionist to photograph the printer's touchscreen and read him the IP address","why":"Pretexting chains small disclosures into bigger ones. Once the receptionist 'corrected' the printer model, the attacker pivoted to the high-value target — the printer's IP address — by walking her through photographing the touchscreen. Even 'innocent' facts like models and IPs fuel later stages.","multi":false},{"id":"1jaixqs","q":"A company wants to harden staff against phishing. Per the course, which measure gives users practical, hands-on experience in spotting attacks?","a":"A simulated phishing campaign — training combined with realistic test emails, plus remedial training for anyone who clicks","why":"An anti-phishing campaign pairs awareness training with a simulated phishing exercise (run internally or by a contractor/SaaS like Phish Insight). Users who click get immediate remedial training, and campaigns should repeat continuously because threats evolve.","multi":false},{"id":"jdx8vz","q":"An attacker intercepts unencrypted network traffic between two employees to read their conversation. Which attack is this, and which defense does the course prescribe?","a":"Eavesdropping (an on-path/man-in-the-middle form) — use secure, encrypted communication channels and encrypt data in transit","why":"Eavesdropping is secretly listening — on phones, via wiretaps, by intercepting network traffic (an on-path/MITM attack). The defenses are encrypted communication channels, encryption of data transferred across the network, and keeping systems patched.","multi":false},{"id":"1htujiy","q":"Which of the following are on the course's list of the SIX motivational triggers? (Select THREE.)","a":"Authority;  Urgency;  Social proof","why":"The six triggers: authority, urgency, social proof, scarcity, likability, and fear. Encryption and MFA are security controls; load balancing is an availability mechanism — classic CompTIA distractors from other domains.","multi":true},{"id":"194ckh","q":"Which items are among the course's FIVE key indicators of a phishing email? (Select THREE.)","a":"A sense of urgency pushing immediate action;  An unusual request for sensitive information such as passwords;  A mismatched URL revealed by hovering over the link","why":"The five indicators: urgency, unusual requests (IT never asks for passwords; banks never ask for card numbers), mismatched URLs, suspicious sender addresses, and poor spelling/grammar. A genuine internal address, flawless writing, and a valid signature are the opposite of red flags.","multi":true},{"id":"1srx0vc","q":"Which defenses does the course recommend AGAINST brand impersonation? (Select THREE.)","a":"Educate users about the threat;  Use secure email gateways to filter phishing emails;  Monitor the brand's online presence to detect fraudulent activity quickly","why":"Brand impersonation defenses: user education, secure email gateways filtering fraudulent mail, and actively monitoring the brand's online presence (the fake Eli Lilly tweet cost billions before it was caught). Replying to phishers or exposing credentials helps the attacker; abandoning your own logo is absurd.","multi":true},{"id":"1ul30y2","q":"Which attacks does the course classify as forms of social engineering? (Select THREE.)","a":"Baiting;  Pretexting;  Shoulder surfing","why":"Baiting, pretexting, and shoulder surfing all manipulate or exploit humans (curiosity, trust, direct observation). SQL injection, brute force, and buffer overflows are technical attacks against systems — no human psychology required.","multi":true},{"id":"664hb4","q":"How does the course define social engineering?","a":"A manipulative strategy that exploits human psychology to gain unauthorized access to systems, data, or physical spaces","why":"Social engineering targets the human element — manipulating people into revealing confidential information or performing compromising actions, through written communication or face-to-face interaction, rather than using technical hacking techniques.","multi":false},{"id":"10d525k","q":"Why does the course call security awareness training the best defense against social engineering?","a":"Because the attacks target the human element — trained users recognize and respond to SE attempts correctly","why":"Social engineering exploits human psychology, not software flaws, so technical controls alone can't stop it. Regular security awareness training — how to recognize and respond to SE attacks — is crucial for both digital and physical security.","multi":false},{"id":"17uan6s","q":"Which two interaction channels does the course say social engineering includes?","a":"Written communication and face-to-face interaction","why":"Social engineering includes written communication (emails, texts, messages) as well as face-to-face interaction — the common factor is manipulating a person, not attacking a system directly.","multi":false},{"id":"6rirhh","q":"Which objectives does this section of the course map to?","a":"2.2 (threat vectors incl. social engineering) and 5.6 (security awareness practices)","why":"Section 05 covers Domain 2 Objective 2.2 — human-based attack vectors like phishing, vishing, smishing, impersonation, pretexting, and typosquatting — and Domain 5 Objective 5.6 — implementing security awareness practices like anti-phishing campaigns.","multi":false},{"id":"1kydp2g","q":"A caller claims to be from the IRS and says that if the victim doesn't pay a 'late fee' within 24 hours, agents will come to their house and arrest them. Which motivational trigger is being used?","a":"Authority","why":"The attacker is assuming governmental authority to command compliance — the victim obeys because they believe the demand comes from a position of power. (The arrest threat also stacks fear on top — triggers often combine.)","multi":false},{"id":"gyt5jc","q":"An attacker rushes up to a receptionist with a USB drive, saying a presentation is due to executives in five minutes and begging her to print the slides right now. Which trigger is this, and what procedure does it make her skip?","a":"Urgency — skipping the normal malware-scanning procedure for removable media","why":"Urgency creates time pressure that drives people to act without thinking. The 'five minutes' story pressures the receptionist to bypass the organization's normal procedure of scanning removable media for malware before connecting it.","multi":false},{"id":"134o7j3","q":"An attacker seeds a scam website by getting friends to post about it on social media, so victims visit because 'everyone else is using it.' Which trigger is this?","a":"Social proof","why":"Social proof is the tendency to look at others' actions and beliefs as a guide for your own. Likes, shares, and friends vouching for the scam site make people assume it's legitimate — marketers use the same psychology with reviews and enrollment numbers.","multi":false},{"id":"152wvzc","q":"A phishing email offers a $2,000 MacBook for $1,000 — 'but only for the first five people who buy.' Which trigger is at work?","a":"Scarcity","why":"Scarcity emphasizes limited availability — 'only five spots left' — to pressure quick decisions. It's often paired with urgency, but the defining element here is the limited quantity, not the clock.","multi":false},{"id":"107du3y","q":"A penetration tester wearing a rival team's jersey chats with an employee about last week's game, and soon the employee is casually describing internal projects. Which trigger did the tester exploit?","a":"Likability — building rapport through a shared interest to gain trust","why":"Likability works because people open up to people they like. Social engineers deliberately cultivate friendliness and common interests — sports talk, flirting, shared hobbies — to draw victims into their sphere of influence.","multi":false},{"id":"4agfux","q":"Ransomware that encrypts files and demands a $200 'fine' to decrypt them primarily plays on which trigger — often combined with which other?","a":"Fear, often combined with authority when the scammer poses as law enforcement","why":"Fear capitalizes on anxiety: 'if you don't do what I tell you, something bad will happen.' When the attacker impersonates the FBI or another agency, the scam stacks fear ON authority to become even more effective — triggers can overlap.","multi":false},{"id":"cw7aol","q":"What must an attacker typically do FIRST to make an impersonation attack believable, per the course?","a":"Collect information about the organization so the impersonation details earn the target's trust","why":"Specific details make lies believable: 'Mike from IT on the third floor, checking the workstation issues others reported' is far more convincing than an anonymous caller. Impersonation attacks are therefore usually preceded by information gathering about the organization.","multi":false},{"id":"ggxfx1","q":"What severe consequences does the course attribute to successful impersonation attacks?","a":"Unauthorized access to sensitive data, disruption of services, or even complete system takeover","why":"Impersonation can escalate all the way to a complete system takeover, plus data theft and service disruption. Mitigation is regular security awareness training so employees stay vigilant.","multi":false},{"id":"st685f","q":"In November 2020, a fake Twitter account impersonating which company tweeted that its product would be 'free' — crashing the real company's stock 4% in under 24 hours?","a":"Eli Lilly and Company","why":"The fake Eli Lilly account tweeted that insulin would be free; investors believed it and sold shares, wiping out billions in market capitalization within a day. It's the course's flagship brand-impersonation case — defense includes monitoring the brand's online presence.","multi":false},{"id":"u1kpam","q":"Why is a watering hole attack considered a PASSIVE attack?","a":"Because the threat actor never communicates directly with the target — malware is delivered through a trusted third-party site the target already visits","why":"The attacker compromises a website or service the target is known to use and waits — like a predator at a watering hole. The target comes to the site and gets attacked there, with no direct contact between attacker and victim. Defenses: patching, threat intelligence, advanced malware detection.","multi":false},{"id":"9gk2zo","q":"How does the course define pretexting?","a":"Creating a convincing fabricated scenario to manipulate a target into divulging information or performing compromising actions","why":"Pretexting = a fabricated scenario, often impersonating a trusted individual or authority figure (bank official, IT support, vendor) to gain trust and extract information or actions from the victim.","multi":false},{"id":"1ti9pui","q":"In the course's toner-call demonstration, why did the attacker deliberately GUESS the wrong printer brand?","a":"So the receptionist would 'correct' him with the real model — filling in the information he wanted","why":"Pretexting feeds the victim plausible-sounding 'facts' so the victim fills in the gaps with real information. By guessing a common brand (HP/Epson/Lexmark), the attacker got the receptionist to volunteer the actual model — then escalated to the printer's IP address.","multi":false},{"id":"1rlchn4","q":"The course's author's mother immediately knew the 'John from Microsoft, your Windows machine is infected' call was a pretext. Why?","a":"She uses an iMac — she doesn't have a Windows machine, so the claim was impossible","why":"The classic pretext claims your Windows PC is infected and 'calling out.' She ran an iMac, so the story was flatly impossible — technical impossibility is often the easiest way to spot a pretext. Training takeaway: never give out information over the phone.","multi":false},{"id":"jv4xco","q":"Which training message does the course give specifically for pretexting calls?","a":"Never give information out over the phone — even 'innocent' details like a printer model or IP address fuel a later stage of the attack","why":"Seemingly harmless details (printer model, IP address, org structure) are exactly what attackers chain into bigger attacks. The rule: don't give out information, and don't fill in the gaps for callers — in person or on the phone.","multi":false},{"id":"ec0zh0","q":"An attacker emails one million random Americans a fake Bank of America security alert. Per the course, this is:","a":"Phishing — a wide-net mass campaign; it would only be spear phishing if sent to a known list of that bank's customers","why":"The dividing line is targeting. Sending 1M random people a BoA-themed email is spray-and-pray phishing — most recipients aren't customers (the author, never a customer, spotted it instantly). Spear phishing would target a curated list, e.g., 500 customers whose bank's data was breached.","multi":false},{"id":"h3v9ob","q":"What makes whaling different from ordinary spear phishing?","a":"It targets high-profile individuals like CEOs and CFOs — whose authority can approve large fund transfers, rewarding much greater preparation and precision","why":"Whaling hunts the big fish: executives, board members, senior managers. They can authorize large transfers, so the payoff dwarfs ordinary phishing — but the attack takes far more preparation and effort. It's often step one in taking over an executive's account for follow-on attacks.","multi":false},{"id":"rqywt7","q":"Which statement BEST describes business email compromise (BEC)?","a":"A sophisticated attack that takes over or impersonates a legitimate internal email account — often an executive's — to trick finance/HR staff into wire transfers, payment redirections, or data disclosure","why":"BEC relies on the trust of a REAL internal account (compromised via social engineering or intrusion). The attacker impersonates a senior executive or trusted partner and targets employees in finance or HR. FBI IC3 reported a 14.5% increase and $2.7B in losses in one year.","multi":false},{"id":"18eu3ho","q":"Which pairing of phishing type and channel is correct?","a":"Vishing — voice/phone calls; Smishing — SMS text messages","why":"Vishing = voice phishing over the phone (attackers impersonate banks or government agencies; the course notes people are often easier to trick by phone than email). Smishing = SMS phishing via text messages with fraudulent links or phone numbers, usually baited with urgency.","multi":false},{"id":"1r1dnd5","q":"Which of the following is NOT one of the course's five key indicators of a phishing email?","a":"The email arriving outside business hours","why":"The five indicators: urgency, unusual requests (IT never asks for your password; banks never ask for card numbers), mismatched URLs (hover to reveal the real destination), suspicious sender addresses (display name vs. real address), and poor spelling/grammar. Delivery time is irrelevant.","multi":false},{"id":"1oru8sv","q":"A link in an email displays 'paypal.com/login' but hovering reveals 'paypal.hacked.xyz'. Which indicator is this, and what is the underlying trick?","a":"Mismatched URL — HTML display text can say anything while the underlying hyperlink points anywhere","why":"In HTML email, the visible text is just display text; the underlying URL can be set to anything. Hovering (or long-pressing) reveals the real destination. Brand-impersonation phishers exploit this constantly — an old trick users still fall for.","multi":false},{"id":"11tczgf","q":"According to the course, why do many phishing emails deliberately contain broken English and spelling errors?","a":"Poorly written emails weed out suspicious, well-trained users early — leaving only more gullible victims who are more profitable to exploit","why":"If phishing emails were flawless, everyone would fall for them and the attackers would be overwhelmed. Deliberate errors act as a filter: users who notice grammar mistakes self-select out, so the scammer's limited time goes only to the most gullible — though generative AI is eroding this indicator.","multi":false},{"id":"9jt20l","q":"A security team triages a reported phishing email. Which response sequence matches the course's guidance?","a":"Confirm it's phishing using the indicators, inform all users about the threat, remind them not to click links or provide info, investigate any users who clicked, and review/update countermeasures","why":"Triage = verify with the five indicators → broadcast a warning (others received it too) → remind staff not to click or provide information → investigate systems where the email was opened or links clicked → use the incident to update spam filters and training. Reporting channels include forwarding to phishing@yourdomain.com.","multi":false},{"id":"1gww2c6","q":"What two components make up an anti-phishing campaign per the course?","a":"User security awareness training plus a simulated phishing campaign run by an outside contractor or SaaS platform","why":"An anti-phishing campaign combines training with hands-on practice: a simulated phishing campaign (via contractor or SaaS like Trend Micro's free Phish Insight) gives users practical experience spotting and reporting attempts — with remedial training for anyone who clicks.","multi":false},{"id":"9oaed6","q":"In the course's Phish Insight demo, what was deliberately wrong with the spoofed sender 'invitations@linkedin.com' — and why?","a":"'LinkedIn' was missing a D and 'invitations' was misspelled — trained users should catch and flag it","why":"The demo sender was 'invitations@linkedin.com' with 'LinkedIn' missing a D plus a misspelled 'invitations' — deliberate flaws a trained user should catch. (A real attacker could spell it perfectly; the campaign teaches users to inspect senders and hover over links.)","multi":false},{"id":"1l2b9wi","q":"Hovering over the 'Accept' button in the demo's fake LinkedIn email revealed which real destination?","a":"websitefun.club — a site that merely looks like a LinkedIn page","why":"Every link in the fake invitation — Accept, View Profile, frequency settings — actually pointed to websitefun.club. The lesson for users: don't click links in email; open a new browser and navigate to the real site (linkedin.com) yourself.","multi":false},{"id":"1mwprb8","q":"When should remedial training be delivered in a simulated phishing campaign, per the course's options?","a":"Immediately when a user clicks (the 'when phished' option) or when the campaign ends","why":"Campaigns can deliver training the moment a user clicks ('when phished') or at campaign end. Immediate feedback connects the lesson to the mistake; campaigns can also run on schedules over weeks or months to measure improvement across a large organization.","multi":false},{"id":"10kheez","q":"How does the course distinguish fraud from theft?","a":"Fraud tricks the victim into handing over money or information; theft takes it directly without the victim's cooperation","why":"Fraud is wrongful or criminal deception for financial or personal gain — the victim is manipulated into voluntarily handing over valuables (information or money). That's why fraud is considered part of social engineering: the human is the attack vector.","multi":false},{"id":"1tjgy5","q":"Per the course (and CompTIA's preference), what is the difference between identity fraud and identity theft?","a":"Fraud = using the victim's identity assets (charging on their existing card); theft = fully assuming the victim's identity (using their SSN to get a job). CompTIA prefers 'identity fraud' as the combined term","why":"Charging purchases on a stolen card = identity FRAUD. Fully becoming the victim — e.g., a foreign national using your name, address, SSN, and birthdate to start a new job = identity THEFT. In practice the terms blur, and CompTIA uses 'identity fraud' to cover both.","multi":false},{"id":"16khaow","q":"Which sequence describes the classic toner invoice scam?","a":"Caller 'confirms' toner details (recording the employee's 'yes'), ships wildly overpriced toner, then bills with no refunds/exchanges and a recording of the agreement","why":"The invoice scam tricks a business into paying for something never properly ordered. The caller builds a pretext ('still using the HP LaserJet?'), the employee confirms, overpriced toner arrives (~$950 vs. ~$100 retail), and the invoice cites the recorded 'yes' and no-refund terms. Any regularly consumed supply works.","multi":false},{"id":"yaq7yk","q":"What is the technical variation of the invoice scam the course warns about?","a":"A PDF invoice attached to a spear-phishing email — embedded malicious code infects the billing employee's machine, often giving the attacker remote access","why":"The digital variant embeds malware in an invoice PDF sent via spear-phishing; opening it infects the billing department's computer (e.g., remote access trojan). Lesson: analyze emails from untrusted senders BEFORE opening attachments — especially invoice PDFs.","multi":false},{"id":"wmzsfm","q":"What is the difference between misinformation and disinformation?","a":"Misinformation is false information shared WITHOUT harmful intent (honest mistakes); disinformation is deliberately created and shared to deceive or mislead","why":"The distinction is INTENT. Misinformation spreads from honest mistakes (e.g., COVID-era claims that salt-water gargles or chlorine could kill the virus). Disinformation is a weapon: deliberately false content designed to manipulate opinion, spread discord, or undermine trust — e.g., Russian fake accounts in the 2016 US election.","multi":false},{"id":"1t7co6f","q":"Which example does the course give of a DISINFORMATION campaign?","a":"Russian state-sponsored operatives running fake Facebook and Twitter accounts to spread false information during the 2016 US presidential election","why":"US intelligence attributed the 2016 election influence operation to Russian state-sponsored operatives using fake social-media accounts to post divisive, false content — deliberate deception, i.e., disinformation. The COVID salt-water claim is the course's misinformation example (no harmful intent).","multi":false},{"id":"xeu613","q":"What lesson does the 2020 Twitter Bitcoin scam teach about influence campaigns?","a":"Influence campaigns aren't only political — hijacked accounts of Obama, Biden, Musk, and Gates promoted a 'double your Bitcoin' scam for pure financial gain","why":"In July 2020 attackers hijacked high-profile Twitter accounts and promised to double any Bitcoin sent to an address. Victims trusted the influential accounts and sent funds they never saw again — influence campaigns can target financial gain as readily as elections.","multi":false},{"id":"ohe7zr","q":"Which set does the course give as society-level mitigations against misinformation/disinformation?","a":"Media literacy, prioritizing fact-checking, transparency and accountability, and appropriate regulation","why":"The course's mitigation set: promote media literacy, prioritize fact-checking, ensure transparency and accountability, and consider appropriate regulation of online content, sponsored posts, and ads during elections and other events that rely on an informed public.","multi":false},{"id":"abjzv0","q":"An attacker manipulates DNS server settings so that typing a legitimate bank URL redirects users to a fraudulent lookalike site that harvests credentials. Which two attacks are combined here?","a":"Diversion theft (via DNS spoofing) and brand impersonation","why":"Diversion theft in the data realm means diverting traffic to fake websites to steal data — DNS spoofing redirects the URL, and the fake site relies on brand impersonation to look legitimate so victims type in usernames, passwords, and card details.","multi":false},{"id":"dketo5","q":"A Mac user sees a browser alert claiming 'Your Windows system is infected!' What does the course say this is — and what does the impossibility tell us?","a":"A hoax — Windows malware cannot affect macOS/Linux systems; the impossibility exposes the deception","why":"Hoaxes are malicious deceptions spread via social media/email/browser alerts, often paired with phishing or impersonation. A 'Windows virus' warning shown to a Mac user is technically impossible — checking claims for feasibility is the critical-thinking defense against hoaxes.","multi":false},{"id":"1092idi","q":"Which defenses does the course recommend against shoulder surfing in open-plan offices?","a":"Privacy screens on workstations and shields over keypads when PINs or passwords are entered","why":"Shoulder surfing is direct observation of confidential info — and attackers don't need to be close: high-powered or CCTV cameras can capture PINs from across the room, building, or city. Privacy screens and keypad shields protect the visual channel; situational awareness completes the defense.","multi":false},{"id":"1dpu6x5","q":"An attacker retrieves 'deleted' files from a system's recycle bin and old hard drives bought at auction. Which attack is this, and which defense set applies?","a":"Dumpster diving (physical and digital) — shred sensitive documents, enforce a clean desk policy, and securely overwrite deleted files on HDDs, SSDs, and cloud storage","why":"Dumpster diving is recovering valuable information from discarded material — paper documents, or digitally, the recycle bin and 'deleted' files that were never actually overwritten. Defenses: shredding, clean desk policies, and proper secure deletion/sanitization of storage.","multi":false},{"id":"3ddsyi","q":"A parking-lot USB drive labeled 'Confidential — Q4 Layoffs' is found by an employee who plugs it in to look. Which attack is this, and why is it effective?","a":"Baiting — curiosity lures victims into installing malware that can execute within seconds of connecting the device","why":"Baiting leaves malware-infected physical media where victims will find it; curiosity ('what's on this drive?') does the rest, and malware can install within seconds of connection. Defense: never use a USB device unless you know exactly where it came from and that it's safe.","multi":false},{"id":"17mgts0","q":"Per this lesson, why do INSIDER threats particularly favor piggybacking over tailgating?","a":"They convince an authorized employee to let them in, so THEIR badge is never recorded in the facility security log","why":"The lesson's new angle: insiders use piggybacking to enter an office or data center WITHOUT their own badge swipe appearing in the security log — the helpful employee's badge gets logged instead, hiding the insider's presence from the audit trail. (Tailgating = covert following without consent; piggybacking = the authorized person knowingly allows it.)","multi":false},{"id":"1a81hov","q":"Which two elements must coexist for an action to be social engineering rather than a technical attack?","a":"Manipulation of a person — exploiting human psychology to make them reveal information or take a compromising action","why":"Social engineering is a manipulative strategy that exploits human psychology to gain unauthorized access to systems, data, or physical spaces. The victim — not software — is the vector: they are persuaded to reveal confidential information or perform actions that compromise security.","multi":false},{"id":"1v0n80g","q":"An email claims to be from 'Amazon Customer Support' but hovering over the sender shows mr.weirdo578@yahoo.com. Which phishing indicator is this, and why is the display name misleading?","a":"Suspicious email address — the display name is just text; the real sending address hides behind it and must be checked","why":"The visible 'From' name is only a display label — the actual address (revealed by hovering or double-clicking) is what matters. A reputable brand sending from a random personal address, or an address missing the official domain, is one of the most common phishing tells. The course sees several daily.","multi":false},{"id":"1o1kqsr","q":"A social engineer befriends employees at a conference, is warm and funny all evening, and by dessert has collected details about the internal ticketing system. Which trigger carried this attack?","a":"Likability — people lower their guard and share information with people they like","why":"Likability is an attribute of being pleasant or agreeable so the victim responds better to persuasion. Social engineers deliberately cultivate charm and shared interests because friendly, likable people are trusted — angry or abrasive attackers repel victims instead.","multi":false},{"id":"1xbb96h","q":"Which statement about business email compromise is MOST accurate per the course?","a":"It takes over a legitimate internal email account (via social engineering or intrusion) so requests from 'the CFO' arrive from a real, trusted address — targeting finance and HR staff","why":"BEC's power is trust in a REAL account: attackers compromise an internal mailbox (or spoof it convincingly) and send wire-transfer or data requests that appear to come from a senior executive or trusted partner. Employees in finance and HR comply — the FBI IC3 logged $2.7B in BEC losses in a single year.","multi":false},{"id":"pc8ewf","q":"Which pairing is correct?","a":"Misinformation — false info shared WITHOUT harmful intent; disinformation — deliberately created and shared to deceive","why":"Intent is the dividing line. Misinformation spreads from honest mistakes (COVID-era salt-water and chlorine claims). Disinformation is manufactured deception — like state-sponsored fake accounts pushing false election content in 2016 — used to manipulate opinion, spread discord, and undermine trust.","multi":false},{"id":"s2qina","q":"An attacker buys 'diontraining.azure.com' as a hijacked subdomain and sends phishing mail from it — even though the real company uses AWS. Which technique is this an example of?","a":"Typosquatting via a hijacked subdomain of a trusted cloud provider","why":"Registering a subdomain under a trusted provider's primary domain (Diontraining.Azure.com) exploits the provider's credibility while having nothing to do with the real company — a typosquatting variant. Users who know the company uses AWS would immediately spot the impossibility.","multi":false},{"id":"1dcevhu","q":"Which defense does the course recommend specifically against digital (virtual) dumpster diving?","a":"Properly deleting and overwriting old files on storage volumes — HDDs, SSDs, and cloud-based storage","why":"Digital dumpster diving recovers 'deleted' data from recycle bins and inadequately erased media. The fix is secure deletion — overwriting old files on hard drives, solid-state drives, and cloud storage — while the paper-shredding and clean-desk policy address the physical variant.","multi":false},{"id":"1fbsjs8","q":"Why does the course say vishing can be MORE effective than email phishing?","a":"Most people are naturally friendly and easier to trick into sharing information in a live conversation than over email","why":"The course's observation: people tend to be friendly, and a skilled caller can build rapport, apply urgency, and answer objections in real time — manipulating victims into revealing banking or personal information that they would never type into a suspicious email.","multi":false},{"id":"3e2iz0","q":"An attacker wants the credit-card numbers stored in a billing database. Instead of hacking the database, she phones employees pretending to be from 'IT security,' asks them to 'verify' their card numbers for an audit, and several comply. This is BEST classified as:","a":"Pretexting — a fabricated audit scenario that manipulates victims into handing over the data voluntarily","why":"The fabricated 'security audit' pretext, delivered with authority, tricks employees into voluntarily revealing the exact data the attacker wanted — no technical attack on the database needed. This is the essence of social engineering: the human bypasses the control.","multi":false},{"id":"16pmtc6","q":"Which user behavior does the course recommend when a real-looking LinkedIn invitation arrives by email?","a":"Do not click email links — open a new browser and navigate to the known site (linkedin.com) directly","why":"The anti-phishing campaign lesson: clicking links is the trap. Instead, go to the site independently — if the connection request is real, it will be waiting there. This neutralizes mismatched URLs and credential-harvesting clones in one habit.","multi":false},{"id":"1j375ld","q":"Which statement about identity fraud versus identity theft matches the course (and CompTIA's preference)?","a":"Fraud = using the victim's identity assets such as their existing credit card; theft = fully assuming the identity (e.g., using someone's SSN to start a new job); CompTIA prefers the combined term 'identity fraud'","why":"Charging purchases on a stolen card = identity fraud; fully becoming the victim — working under their name and SSN = identity theft. Everyday language blurs them (identity theft is the popular term), but CompTIA's preferred umbrella term is identity fraud.","multi":false},{"id":"sn6f0m","q":"An employee finds a shiny USB drive in the elevator, plugs it in at their desk, and within seconds malware phones home. Which attack is this, and what training stops it?","a":"Baiting — never use a USB device or other media unless you know exactly where it came from and that it is safe","why":"Baiting lures victims with tempting planted media; curiosity ('what's on it?') is the trigger and malware can install in seconds of connection. The defense is user training: never connect found or unknown USB devices — and report them.","multi":false},{"id":"bykja1","q":"Which scenarios demonstrate the AUTHORITY trigger? (Select THREE.)","a":"A caller posing as an IRS agent demanding a late fee within 24 hours;  An attacker pretending to be an important client whose requests employees feel pressured to satisfy;  A fake manager directing a junior employee to 'fix' an account","why":"Authority = compliance with perceived power: government agents, executives/managers, and important clients all command obedience or deference. The likes-and-shares site is social proof, the five-buyer limit is scarcity, and the planted USB is baiting.","multi":true},{"id":"1hphk12","q":"Which items are components of the COURSE'S recommended phishing response/triage? (Select THREE.)","a":"Report suspicious messages per policy (e.g., forward to phishing@yourdomain.com);  Inform all users about the threat so others don't fall for the same email;  Review and update countermeasures such as spam filters and training after an incident","why":"The course's playbook: report promptly, analyze to confirm, broadcast a warning, investigate exposed systems, then improve defenses. Contacting the sender risks further engagement; punishing reporters suppresses future reports; waiting turns a contained incident into a breach.","multi":true},{"id":"5loh5d","q":"Which defenses work AGAINST typosquatting? (Select THREE.)","a":"Registering common misspellings of your own domain (e.g., owning acclade.com to protect accolade.com);  Using monitoring services that watch for similar domain registrations;  Security awareness training so users inspect URLs carefully","why":"The anti-typosquatting trio: own your own misspellings (and redirect them to the real site), monitor for newly registered lookalikes, and train users to read URLs character by character. Handing lookalikes to marketing, killing DNS, or hiding URLs behind shorteners all make the problem worse.","multi":true},{"id":"gm6lcn","q":"Which of these are FORMS OF IMPERSONATION according to the course? (Select THREE.)","a":"Brand impersonation;  Typosquatting;  Watering hole attacks","why":"The lesson's four impersonation forms: impersonation (of a person), brand impersonation, typosquatting (impersonating via lookalike domains), and watering hole attacks (impersonating a trusted site the target visits). Shoulder surfing and eavesdropping are separate SE attacks; brute force is technical.","multi":true},{"id":"1f14zdr","q":"Scenario: A finance clerk receives email #1, apparently from the CEO's real address, marked urgent and confidential: 'I'm in board meetings all day — wire $48,500 to this vendor account before 3 PM; don't call me, I'll explain tomorrow.' Which conclusion is BEST supported, and which single element most elevates the risk?","a":"It's a likely business email compromise — the message arrives from a trusted internal account, combines authority with urgency and secrecy, and asks for exactly what BEC attacks ask for","why":"BEC's signature: a compromised (or spoofed) internal executive account, an urgent confidential wire request to finance staff, and instructions that prevent verification ('don't call me'). The trusted sender address is the risk multiplier — it bypasses the 'stranger' suspicion that filters ordinary phishing.","multi":false},{"id":"1en8lt3","q":"Scenario: During a red-team engagement, a tester wearing a courier uniform waits at a badge door with a tall stack of parcels, saying she's late for a delivery and her badge 'isn't working today.' An employee badges her in. The tester then drops a labeled USB drive in the lobby. Which TWO attacks did the tester execute, in order?","a":"Piggybacking (the employee knowingly let her in — urgency doing the persuasion), then baiting","why":"The employee consciously chose to badge in the 'courier' — that's piggybacking, driven by the urgency trigger (hands full, late, badge broken). Leaving the found-media trap for curiosity is baiting. Tailgating would have required following without the employee's knowledge.","multi":false},{"id":"6iqkf5","q":"Scenario: A hospital's billing office receives a PDF invoice from a vendor they've never used, attached to a polite, grammatically perfect email. The course's guidance for THIS specific situation is:","a":"Analyze emails from untrusted or unknown senders before opening attachments — invoice PDFs can carry embedded malware such as a remote access trojan","why":"This is the technical invoice scam: a malicious PDF attached to a (spear-)phishing email; opening it can infect the billing machine and grant remote access. Generative AI has largely erased the grammar indicator, so sender trust and attachment discipline — not writing quality — must drive the decision.","multi":false},{"id":"1vywflb","q":"Scenario: A nation-state group creates thousands of fake social-media personas that spend months building follower networks, then simultaneously pushes false claims about voting procedures in the weeks before an election, seeding both honest reposts by deceived citizens and their own coordinated amplification. Which labels fit the reposts by deceived citizens and the operation itself, respectively?","a":"Misinformation (no harmful intent); a disinformation-driven influence campaign","why":"The deceived citizens share false info without intent to harm — misinformation. The coordinated, deliberate falsehoods from state operatives are disinformation, and the whole coordinated effort to shape public perception is an influence campaign. Intent separates the two terms, and the campaign is the umbrella.","multi":false},{"id":"1kgjxq3","q":"Scenario: Security awareness metrics show click rates falling after three campaign quarters, but REPEAT-clicker rates stay flat and one department's report-rate is near zero. Which interpretation BEST matches the course's philosophy on anti-phishing campaigns?","a":"Campaigns must be ongoing: repeat clickers need deeper remedial training, and a near-zero report rate signals users don't know reporting is expected — the goal is recognizing AND reporting, not just not-clicking","why":"The course stresses campaigns as an ongoing effort because threats evolve. Remedial training must be in-depth for users who repeatedly fall for simulations, and a healthy program measures reporting behavior too — users who spot but don't report leave the organization blind.","multi":false},{"id":"1qq2vsj","q":"LEAST effective: An organization wants to reduce success of vishing attacks against its help desk. Which control is the LEAST effective primary defense?","a":"Publishing the direct-dial numbers of senior executives on the public website","why":"Verification procedures, trigger-awareness training, and spoofing detection all raise the cost of vishing. Publishing executives' direct numbers gives attackers exactly the credible, targeted contact paths that make vishing and whaling calls more convincing — it feeds the pretext.","multi":false},{"id":"1bym1xe","q":"Scenario: An attacker wants engineers at a defense contractor to install malware. Instead of emailing them, she identifies a niche CAD-software forum the engineers all frequent, compromises it, and plants a poisoned software update. Which BEST explains why she chose this approach over spear phishing?","a":"A watering hole attack: it's passive — no message from the attacker that filters or users could scrutinize; the victims come to the trusted site and are compromised there","why":"The watering hole trades contact for patience: the attacker never sends anything, so there's no phish to detect — the target is compromised at a site they trust and choose to visit. It's the textbook passive alternative when targets are predictable and email defenses are strong.","multi":false},{"id":"1wx6kyt","q":"Scenario: An employee reports that after a phone call from 'Microsoft support,' a remote-access tool is running on her workstation. The caller knew her name, her manager's name, and referenced a recent (real) outage. Which factor made this pretext unusually convincing — and which course habit would have defeated it?","a":"Pre-attack research let the attacker weave real organizational details into the fabricated scenario; verifying identities through known, official channels instead of the call itself","why":"Impersonation quality scales with information: knowing names, managers, and a real outage makes the 'support call' pretext feel authentic. The universal defeat is out-of-band verification — call the help desk on its known number, never trust the channel the caller controls.","multi":false},{"id":"1upt1ve","q":"Scenario: HR receives an email from 'accolade.com' (with two c's) offering discounted certification exam vouchers 'for the first 20 registrants — register within 48 hours.' The REAL vendor is accolade.com (one c). Which combination does this email represent?","a":"Typosquatting plus scarcity and urgency triggers","why":"The lookalike domain (accolade vs. accolade) is typosquatting — a doppelganger domain with a single-character difference. The 'first 20 registrants' is scarcity, the 48-hour window is urgency, and the voucher lure impersonates the brand. Three exam topics stacked in one scenario.","multi":false},{"id":"m9zril","q":"BEST answer: A CISO must pick the FIRST line of defense against social engineering for a 5,000-employee company with strong email filtering already in place. Which investment does the course's philosophy prioritize?","a":"Ongoing security awareness training — because social engineering targets the human element and no technical filter removes the judgment moment","why":"The course is explicit: because SE attacks target human psychology, the best defense is regular security awareness training that teaches users to recognize and respond correctly — across email, phone, SMS, and in-person channels. Technical controls reduce volume; trained judgment catches what gets through.","multi":false},{"id":"qgryrt","q":"Scenario: A fraudster obtains a victim's name, SSN, and birthdate from a data broker breach and uses them to open credit cards and take a car loan as the victim. Per the course's precise terminology, this is BEST described as:","a":"Identity fraud (CompTIA's preferred umbrella term for unauthorized use of another's personal information) — 'full assumption' cases shade into identity theft, but CompTIA groups both under identity fraud","why":"Using a victim's personal information without authorization to commit crimes is identity fraud/theft territory: charging on existing cards = fraud; fully assuming the identity = theft. The terms are used interchangeably in practice, but CompTIA's preferred combined term is identity fraud.","multi":false},{"id":"9fws85","q":"Scenario: Employees in an open-plan office process customer PII at their desks. An auditor observes that screens are visible from the public walkway and that a contractor films the room with a phone from the lobby. Which control set addresses this, per the course?","a":"Privacy screens on workstations plus keypad shields, since modern cameras make shoulder surfing possible from across the room, building, or city","why":"Shoulder surfing needs no adjacent shoulder: high-powered and CCTV cameras harvest PINs and on-screen data from far away. The course's defenses are privacy screens, keypad shields when credentials are entered, and situational awareness — visibility controls, not network changes.","multi":false},{"id":"op9syg","q":"Scenario: An incident responder reviews a whaling attack that succeeded against a CFO. Which elements should the responder expect to find in the attack, per the course? (Select THREE.)","a":"Significant prior research and preparation tailored to the executive;  A lure exploiting the executive's authority or schedule (urgent, confidential, 'don't call me');  An end goal of credentials or fund transfers — or the executive's account itself, as a springboard into the organization","why":"Whaling = spear phishing aimed at executives: heavy research, personalized high-pressure lures, and payoffs via transfers, credential theft, or account takeover for follow-on attacks. Mass random mail is plain phishing; planted USBs are baiting; whaling is entirely social engineering.","multi":true},{"id":"9zjn06","q":"Which statements about watering hole attacks are TRUE per the course? (Select THREE.)","a":"They target a specific website or service the victim is known to use;  They are passive — the attacker does not communicate directly with the target;  Defenses include keeping systems updated, threat intelligence, and advanced malware detection","why":"Watering hole: compromise a site the targets habitually visit (predator at the river), wait passively for them to arrive, and deliver malware there. Defenses are patching, threat intelligence, and advanced malware prevention. No email is sent, organizations are prime targets, and typosquatting is a different technique.","multi":true},{"id":"12ksnni","q":"Which actions belong in a course-aligned anti-phishing PROGRAM (not just a one-off test)? (Select THREE.)","a":"Regular, ongoing simulated phishing campaigns;  In-depth remedial training for users who click the simulations;  Teaching the five key indicators (urgency, unusual requests, mismatched URLs, suspicious addresses, poor grammar)","why":"A program is continuous: repeated simulations (threats evolve), remedial depth-training for clickers, and indicator-based education. One-and-done testing decays, announced dates invalidate results, and testing only executives ignores that every user is an attack surface.","multi":true},{"id":"zyoctv","q":"Which scenarios pair the correct attack with the correct primary trigger? (Select THREE.)","a":"Fake IRS arrest threats — authority (with fear stacked on top);  'Only five units left at half price' — scarcity;  Friends' likes and shares drawing victims to a scam site — social proof","why":"IRS threats = authority (+fear). Limited quantity = scarcity. Likes/shares = social proof. Ransomware timers leverage FEAR (harm, not limited supply). Flirting/extraction = LIKABILITY. Deadline pressure on help desk = URGENCY. Each wrong pair swaps in a neighboring trigger — the classic distractor pattern.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
</div>
</body>
</html>
