  <script>
    var DECKS = [{"label":"Section 9 · Third Party Vendor Risks","cards":[{"id":"xtjjm8","q":"A defense agency requires that every microprocessor installed in its networks is manufactured securely and performs only its designated functions, with no deviation from a known-good baseline. Which measure is designed for this requirement?","a":"Trusted Foundry program","why":"The Trusted Foundry program serves entities with a minimal risk appetite (like the DoD): hardware must be authentic and microprocessors manufactured securely against a known-good baseline. The CHIPS Act funds domestic chip production; audit clauses and MSAs are contract tools, not manufacturing guarantees.","multi":false},{"id":"1pj7fu","q":"A counterfeiter takes an old network chip and repackages its contents so the device appears genuine. What is this technique called?","a":"Chip washing","why":"Chip washing = repackaging the contents of a microchip with a less expensive one or one containing embedded malware. Best case the device malfunctions; worst case it provides an always-on backdoor into the network.","multi":false},{"id":"q4qplc","q":"In 2021, threat actors gained access to a network monitoring vendor's build pipeline and reached thousands of the vendor's customers — including government agencies — at once. Which component made this mass compromise possible?","a":"The vendor's trusted software update system","why":"This is the SolarWinds pattern: infiltrating the Orion software update system let attackers distribute malware through a trusted channel to the vendor's entire client base — an indirect avenue that bypasses even robust defenses.","multi":false},{"id":"1epmmi4","q":"As part of the CHIPS and Science Act of 2022, what incentive applies to the cost of semiconductor manufacturing equipment?","a":"A 25% investment tax credit","why":"The CHIPS Act provides roughly $280B total: $39B in US manufacturing subsidies, a 25% investment tax credit for manufacturing-equipment costs, and $13B for research and workforce training.","multi":false},{"id":"byt8t","q":"Your company buys software from a third-party developer. Before deployment, your team attempts to exploit the software the same way a real attacker would. What is this assessment called?","a":"Penetration testing of the supplier","why":"Penetration testing the supplier's software means finding and exploiting vulnerabilities like an actual cyberattacker would — validating the vendor's security posture, because their risk becomes your risk once the software is in your network.","multi":false},{"id":"1igwqc0","q":"A firm contracts a data management company to handle customer data and wants the ability to periodically inspect the vendor's data handling, storage, and protection practices. What makes this possible?","a":"A right to audit clause in the contract","why":"The right to audit clause grants the organization the right to evaluate the vendor's internal processes and verify compliance with agreed standards — trust but verify. MOUs express intent, BPAs cover partnerships, and SOWs detail project work.","multi":false},{"id":"1pty5pk","q":"A data center housing critical information for multiple organizations is evaluated against global benchmarks by an external standards body with no stake in its operations. What kind of assessment is this?","a":"Independent assessment","why":"An independent assessment is conducted by a third-party entity with no stake in the vendor's operations (e.g., ISO validating against global standards) — neutral third-party validation that goes beyond a vendor's self-assessment.","multi":false},{"id":"1ymjx2b","q":"During vendor selection, a manager discovers that a senior evaluator holds a financial interest in one of the bidding vendors. What is the appropriate action?","a":"Require disclosure and exclude the conflicted party from the decision","why":"This is a conflict of interest — personal or financial relationships that could cloud judgment. Organizations should require disclosures of potential conflicts or exclude conflicted parties from the selection process.","multi":false},{"id":"mei1en","q":"An organization deletes all unsolicited vendor proposals and only accepts bids posted in response to its official requests for proposals. Which selection concept does this illustrate?","a":"Rules of engagement","why":"Rules of engagement dictate the terms of interaction with potential vendors — communication protocols, data sharing policies, and negotiation boundaries. Accepting bids only through posted RFPs is a rules-of-engagement policy.","multi":false},{"id":"cievi2","q":"Every quarter, an organization scores its packaging vendor's material quality, delivery timelines, and environmental impact against the objectives written into their agreement. What monitoring activity is this?","a":"Performance review","why":"Performance reviews are periodic evaluations of vendor deliverables against the agreed-upon standards and objectives outlined in the contract — the core of post-selection vendor monitoring.","multi":false},{"id":"fj9ywo","q":"An IT provider's contract states that server downtime will not exceed two hours per month, and the provider must pay penalties if it does. Which agreement contains this provision?","a":"Service Level Agreement (SLA)","why":"An SLA defines the standard of service a client can expect — here a downtime ceiling with penalties for deviation. NDAs cover confidentiality, MOUs express intent, and SOWs detail project deliverables.","multi":false},{"id":"150fai9","q":"Two organizations sign a document expressing their mutual intent to explore a future partnership, deliberately leaving exact details for later. Which document did they sign?","a":"Memorandum of Understanding (MOU)","why":"An MOU is less binding — a declaration of mutual intent laying out broad strokes without exact details. An MOA would be the formal version spelling out specific responsibilities and roles.","multi":false},{"id":"16conur","q":"Which of the following are the course's four recommended safeguards against supply chain attacks? (Select FOUR.)","a":"Vendor due diligence;  Regular monitoring and audits;  Education and collaboration;  Incorporating contractual safeguards","why":"The four mitigations: vendor due diligence (especially for vendors touching critical systems), regular monitoring and audits (early detection), education and collaboration (joint industry defense), and contractual safeguards (security clauses with legal repercussions). Price, reputation, and isolation are not substitutes.","multi":true},{"id":"1s02csz","q":"Which of the following are hardware-related supply chain risks described in the course? (Select THREE.)","a":"Counterfeit devices from secondary or aftermarket sources;  Chip washing — repackaged microchip contents;  Rootkits deliberately embedded by overseas suppliers","why":"The hardware risks: counterfeit/tampered devices from secondary markets, chip washing (repackaged chips with cheaper or malware-bearing contents), and pre-installed rootkits from overseas suppliers. Phishing and passwords are unrelated attack vectors.","multi":true},{"id":"1jj59yj","q":"A cloud-provider vendor questionnaire asks about which of the following? (Select FOUR.)","a":"Data redundancy measures;  Security protocols;  Uptime guarantees;  Disaster recovery plans","why":"Vendor questionnaires collect operational and security details — data redundancy, security protocols, uptime guarantees, disaster recovery — so vendors can be compared on standardized criteria. Menus, salaries, and decor are irrelevant.","multi":true},{"id":"1bpmo8q","q":"Which statements correctly distinguish an MOA from an MOU? (Select TWO.)","a":"An MOA is more formal and outlines specific responsibilities and roles;  An MOU is less binding and more a declaration of mutual intent","why":"MOA = formal, specific responsibilities and roles. MOU = less binding, declaration of mutual intent, broad strokes. The MOU-enforceability claim and the reversed descriptions are the classic traps.","multi":true},{"id":"c65tsp","q":"A router is composed of hundreds of components sourced from various suppliers. What is the primary security concern with this?","a":"Each component can be a vulnerability if tampered with or from an untrustworthy source","why":"Every component in a device is a potential vulnerability if it has been tampered with or comes from an untrustworthy supplier — which is why rigorous supply chain assessments are needed to trace hardware origins.","multi":false},{"id":"cni598","q":"Which program was implemented for entities with a minimal risk appetite, such as the Department of Defense, to ensure hardware authenticity and secure microprocessor manufacturing?","a":"Trusted Foundry","why":"The Trusted Foundry program ensures all hardware installed in low-risk-appetite networks (like the DoD's) is authentic and that microprocessors are manufactured securely against a known-good baseline.","multi":false},{"id":"1h7m14z","q":"Why is purchasing hardware from secondary or aftermarket sources considered risky?","a":"Devices may be counterfeit or tampered with, containing malware or enabling unauthorized access","why":"While budget-friendly, secondary/aftermarket sources carry a high risk of counterfeit or tampered devices whose code may include Trojans, allow remote access, or cause operational failures.","multi":false},{"id":"2zj8up","q":"Before installing purchased software on an enterprise network, what should be verified?","a":"It is properly licensed, authentic, free of known vulnerabilities, and scanned for malicious code","why":"Software should be checked for proper licensing and authenticity, confirmed free of known vulnerabilities or bugs, and scanned with antivirus/anti-malware before installation.","multi":false},{"id":"lq5qg6","q":"Why is assessing open-source software generally easier than assessing proprietary software?","a":"The entire source code can be reviewed","why":"With open-source software you can review the entire source code if needed. Proprietary software can't be source-reviewed, but you can still run antivirus scans and vulnerability assessments against it.","multi":false},{"id":"lwy1ik","q":"Which supply chain risk question is MOST specific to a managed service provider (MSP) offering software as a service?","a":"Are the MSP's cybersecurity protocols robust enough to protect your data, and will they support incident response after a breach?","why":"With SaaS/MSPs you entrust your data to an external party, so the key risks are whether they can maintain confidentiality and integrity, and whether they'll cooperate in incident response and forensics.","multi":false},{"id":"yt9qen","q":"Which statement best captures the core principle of supply chain risk?","a":"You are only as strong as the weakest link in the supply chain","why":"From hardware to services, every aspect of the supply chain must be assessed — an organization is only as strong as the weakest link in that chain.","multi":false},{"id":"1ja82cw","q":"What should organizations conduct to trace the origins of hardware and determine the integrity of components in enterprise networks?","a":"Rigorous supply chain assessments","why":"Rigorous supply chain assessments trace hardware origins and determine component integrity, because the origin of components defines the trustworthiness of the entire device.","multi":false},{"id":"1h9dw25","q":"Beyond cost, what factors should drive vendor selection?","a":"Due diligence, historical performance, and a commitment to security","why":"Vendor selection is not just cost efficiency — it must factor in due diligence, historical performance, and the vendor's commitment to security.","multi":false},{"id":"dta14u","q":"A counterfeit aftermarket switch contains modified code that gives an attacker persistent remote access. What category of supply chain risk is this?","a":"Hardware risk from secondary/aftermarket sources","why":"Counterfeit or tampered hardware from secondary/aftermarket sources can include Trojan malware or enable remote/unauthorized access — a hardware supply chain risk.","multi":false},{"id":"bisdml","q":"What is a supply chain attack?","a":"Targeting a weaker link in the supply chain to gain access to a primary target","why":"Instead of attacking a well-fortified entity directly, adversaries exploit vulnerabilities in suppliers and service providers to pave their way into the larger, more secure systems.","multi":false},{"id":"1buj895","q":"What is chip washing?","a":"Repackaging the contents of a microchip with a less expensive one or one containing embedded malware","why":"Chip washing involves repackaging a microchip's contents with a cheaper chip or one with embedded malware — the device may simply fail, or worse, provide an always-on backdoor.","multi":false},{"id":"j6q4hi","q":"What is the WORST-case outcome of installing a device with a counterfeit chip inside it?","a":"The chip provides an always-on backdoor into your network","why":"At best a counterfeit chip causes malfunctions and network failures; at worst it contains malicious functionality that turns your own network hardware into an always-on backdoor.","multi":false},{"id":"1m3wget","q":"Which concern arises because a significant portion of technology manufacturing happens overseas?","a":"Deliberate embedding of rootkits by suppliers, providing backdoor access once devices are active","why":"A worrying trend is suppliers deliberately embedding rootkits within devices — pre-installed malware tools providing backdoor network access once the devices are active.","multi":false},{"id":"4ae5zq","q":"In the 2021 SolarWinds incident, how did attackers compromise thousands of organizations?","a":"They infiltrated the SolarWinds Orion software update system and used it to distribute malware","why":"Cybercriminals infiltrated SolarWinds' Orion update system and distributed their malware through it to the company's wide range of clients, including governments worldwide.","multi":false},{"id":"1tdqhbm","q":"What was the strategic lesson of the SolarWinds attack?","a":"Attackers can use indirect avenues to bypass even robust defenses like those of the Department of Defense","why":"SolarWinds showed how adversaries exploit indirect avenues — a trusted software update — to bypass even the most robust security defenses.","multi":false},{"id":"7qllhg","q":"Which of these is NOT one of the four recommended ways to safeguard against supply chain attacks?","a":"Relying solely on vendor reputation","why":"The four mitigations are vendor due diligence, regular monitoring and audits, education and collaboration, and contractual safeguards — reputation alone is not a safeguard.","multi":false},{"id":"tx89xy","q":"What does the CHIPS Act of 2022 provide approximately $39 billion for?","a":"Subsidies for semiconductor manufacturing on US soil","why":"The CHIPS and Science Act provides roughly $280B total, including $39B in subsidies for US chip manufacturing, a 25% investment tax credit, and $13B for research and workforce training.","multi":false},{"id":"16owceo","q":"What was the primary goal of the CHIPS Act?","a":"Minimize supply chain risk by reducing US reliance on foreign-made semiconductors","why":"The CHIPS Act was designed to minimize supply chain risk by reducing reliance on foreign-made semiconductors and strengthening the domestic supply chain.","multi":false},{"id":"19gfoez","q":"How do contractual safeguards help defend against supply chain attacks?","a":"They require vendors to adhere to stipulated security standards with legal repercussions if they fail","why":"Contracts should include cybersecurity clauses ensuring vendors adhere to stipulated security standards, with legal repercussions if they don't meet the requirements.","multi":false},{"id":"1ob55zh","q":"A company provides processors, memory, and hard drives to a computer manufacturer. What type of third-party entity is this?","a":"Supplier","why":"Suppliers are involved in the production and delivery of products or parts of products — one provides processors, another memory, and so on.","multi":false},{"id":"c1t6n0","q":"Which entity would be classified as a managed service provider (MSP)?","a":"A cloud provider like AWS hired to manage your data infrastructure","why":"MSPs are hired to manage IT services on behalf of your company — cloud providers like AWS or Google Cloud managing vast data infrastructures are classic examples.","multi":false},{"id":"c8cti1","q":"What is the purpose of penetration testing a supplier's software?","a":"To simulate a real cyberattack and find exploitable vulnerabilities before they become your risk","why":"Penetration testing the software means attempting to find and exploit vulnerabilities just like an actual attacker would — validating that the vendor takes security seriously, since their risk becomes your risk.","multi":false},{"id":"ve45ul","q":"What does a right to audit clause in a vendor contract grant your organization?","a":"The right to evaluate the vendor's internal processes and verify compliance with agreed standards","why":"The right to audit clause grants the right to evaluate the vendor's internal processes and ensure compliance — e.g., periodically inspecting data handling, storage, and protection practices.","multi":false},{"id":"1n2l0al","q":"What is an internal audit in the context of vendor assessment?","a":"The vendor's self-assessment of its own practices against standards or requirements","why":"An internal audit is the vendor's self-assessment, evaluating their own practices against industry standards or organizational requirements — evidence of consistent internal audits signals commitment to security.","multi":false},{"id":"r4va12","q":"Why might an independent assessment be needed even when a vendor presents evidence of internal audits?","a":"Internal audits may lack rigor; a neutral third party validates compliance objectively","why":"Internal audits are commendable but sometimes insufficient due to lacking rigor — independent assessments by third parties with no stake (e.g., ISO) provide neutral validation.","multi":false},{"id":"16j3lrp","q":"What does a supply chain analysis focus on?","a":"Every link in the vendor's own supply chain — assessing security and reliability of each source","why":"A supply chain analysis dives deep into the vendor's entire supply chain, assessing each link's security and reliability — e.g., scrutinizing source locations for counterfeit or tampered parts risk.","multi":false},{"id":"fu70m7","q":"What is the guiding philosophy behind contract reviews, penetration tests, and audits of vendors?","a":"Trust but verify","why":"The right to audit isn't about a lack of trust but a method to ensure transparency — in cybersecurity, we always want to trust but verify.","multi":false},{"id":"1m4z85v","q":"What does due diligence in vendor selection involve?","a":"Vetting financial stability, operational history, client testimonials, and on-the-ground practices","why":"Due diligence is a rigorous evaluation beyond surface-level credentials — it vets financial stability, operational history, client testimonials, and even on-the-ground practices.","multi":false},{"id":"165hdx8","q":"A key decision maker has a personal tie to a vendor under consideration. What is this called, and how should it be handled?","a":"A conflict of interest — require disclosure or exclude the conflicted party from the decision","why":"A conflict of interest arises when personal or financial relationships could cloud judgment; organizations should require disclosures or exclude conflicted parties from vendor selection.","multi":false},{"id":"1o1og5v","q":"What is the main purpose of a vendor questionnaire?","a":"To compare vendors on a standardized set of criteria for fair, informed decisions","why":"Vendor questionnaires collect detailed responses (redundancy, security protocols, uptime, disaster recovery) enabling standardized comparison and fair, informed decision-making.","multi":false},{"id":"1sk9gpo","q":"What do rules of engagement define in vendor selection?","a":"The terms of interaction — communication protocols, data sharing policies, negotiation boundaries","why":"Rules of engagement are the guidelines dictating the terms of interaction with potential vendors, covering communication protocols, data sharing policies, and negotiation boundaries.","multi":false},{"id":"1opm2pj","q":"After selecting a vendor, what does ongoing monitoring primarily rely on?","a":"Performance reviews against the contract's standards and objectives","why":"Monitoring uses performance reviews — periodic evaluations of vendor deliverables against the agreed-upon standards and objectives outlined in the contract.","multi":false},{"id":"1khqpf1","q":"What are feedback loops in vendor monitoring?","a":"Two-way communication channels where the organization and vendor share feedback with each other","why":"Feedback loops are two-way communication channels where both sides share input — the org comments on product quality while the vendor offers procurement insights, enabling collaborative growth.","multi":false},{"id":"1v4cidz","q":"Which agreement defines the standard of service a client can expect, with penalties for deviation?","a":"Service Level Agreement (SLA)","why":"An SLA defines the standard of service — e.g., server downtime not exceeding two hours per month — and deviations result in penalties paid by the service provider.","multi":false},{"id":"1qhipnd","q":"Which agreement is more formal and outlines specific responsibilities and roles of the parties?","a":"Memorandum of Agreement (MOA)","why":"An MOA is the formal document spelling out who is responsible for what; an MOU is less binding and more a declaration of mutual intent.","multi":false},{"id":"15ays54","q":"Two organizations want to express intent to explore a future partnership without binding details. Which document fits?","a":"Memorandum of Understanding (MOU)","why":"An MOU expresses intent to explore a partnership and lays out broad strokes without exact details — it's less binding than an MOA.","multi":false},{"id":"1utke3o","q":"What is the role of a Master Service Agreement (MSA)?","a":"A blanket agreement covering general terms across multiple transactions, supplemented by work orders or SOWs","why":"An MSA acts as a blanket agreement covering general terms across multiple transactions, so parties don't draft a new contract per project — individual work orders or SOWs supplement it.","multi":false},{"id":"131bwku","q":"What does a Statement of Work (SOW) specify?","a":"Details for a particular project: deliverables, timeline, and milestones","why":"The SOW (sometimes Scope of Work) specifies project details — deliverables, timeline, milestones — while the MSA holds the broad payment terms and confidentiality clauses.","multi":false},{"id":"yr3dzx","q":"A startup shares proprietary technology details with a potential investor before any deal exists. Which agreement protects that information?","a":"Non-disclosure Agreement (NDA)","why":"An NDA is a commitment to privacy ensuring sensitive information shared during negotiations remains confidential — even if the investor passes on the opportunity.","multi":false},{"id":"uji4vk","q":"Which agreement covers profit sharing, decision-making structures, and exit strategies — and is also known as a Joint Venture agreement?","a":"Business Partnership Agreement (BPA)","why":"A BPA goes beyond a basic contract when two entities pool resources — outlining the partnership nature, profit sharing, decision-making, exit strategies, and IP ownership; it's also called a JV agreement.","multi":false},{"id":"azeth4","q":"Third-party vendor risk can affect which of the following?","a":"Integrity, data security, and overall business continuity","why":"Integrating external partners opens avenues for threats and vulnerabilities that can affect the organization's integrity, data security, and overall business continuity.","multi":false},{"id":"oo4gaw","q":"Which objectives does this section map to on the SY0-701 exam?","a":"OBJ 2.2 (threat vectors/attack surfaces), OBJ 2.3 (vulnerabilities), and OBJ 5.3 (third-party risk processes)","why":"Third-party vendor risk spans Domain 2 (OBJ 2.2 threat vectors/attack surfaces, OBJ 2.3 vulnerabilities) and Domain 5 (OBJ 5.3 third-party risk assessment and management processes).","multi":false},{"id":"co5os1","q":"Which of these is an example of a third-party vendor risk?","a":"An MSP with access to sensitive data but lacking rigorous cybersecurity protocols","why":"Third-party vendor risk includes a service provider like an MSP having access to sensitive data while lacking rigorous cybersecurity protocols, as well as hardware vulnerabilities and software backdoors.","multi":false},{"id":"nrj9f3","q":"What does collaboration with industry groups provide in the fight against supply chain attacks?","a":"A more holistic view and a joint defense strategy","why":"Education and collaboration keep the broader ecosystem informed about the latest threats and best practices, providing a holistic view and joint defense strategy.","multi":false},{"id":"a19u47","q":"Why is vendor monitoring still necessary after a vendor passes selection?","a":"Businesses evolve, market dynamics shift, and vendors change — monitoring confirms continued alignment","why":"Over time businesses evolve and vendors undergo changes; monitoring is the mechanism ensuring your chosen vendor still aligns with your organizational needs and standards.","multi":false},{"id":"1hoeyz8","q":"A data center housing critical information is evaluated against global benchmarks by ISO. What type of assessment is this?","a":"Independent assessment","why":"An independent body like ISO assessing a data center's practices against its global standards is an independent assessment — third-party validation by a neutral entity.","multi":false},{"id":"10sms9g","q":"An auditor tells a CISO: 'Your security is only as good as the least secure company you depend on.' Which principle is the auditor stating?","a":"The weakest link principle of supply chains","why":"In supply chain risk, an organization is only as strong as the weakest link in its supply chain — one compromised supplier can reverberate across every business that depends on it.","multi":false},{"id":"kkuhok","q":"Throughout the 2000s and 2010s, counterfeit versions of which vendor's routers and switches were commonly sold on the secondary market as a supply chain attack?","a":"Cisco","why":"Cisco routers and switches were frequent targets of counterfeit supply chain attacks on the secondary market during the 2000s–2010s — old chips were chip-washed into devices that looked genuine.","multi":false},{"id":"1m2qm8k","q":"A threat actor pre-installs malware inside devices during manufacturing overseas. Once the devices activate on the customer's network, the malware grants covert access. What are these pre-installed tools called?","a":"Rootkits","why":"A worrying trend is suppliers deliberately embedding rootkits within devices — pre-installed malware providing backdoor access to networks once the devices are active.","multi":false},{"id":"1qy5t7j","q":"Before rolling out third-party software, an admin runs the installer through the company's antivirus/anti-malware solution. What is this step checking for?","a":"That the software is free of malicious code","why":"Purchased software should be checked for proper licensing and authenticity, confirmed free of known vulnerabilities, and scanned with antivirus/anti-malware to ensure it's free of malicious code.","multi":false},{"id":"1xo8l1q","q":"Which type of organization is the Trusted Foundry program primarily designed to serve?","a":"Entities with a minimal risk appetite, such as the Department of Defense","why":"The Trusted Foundry program serves entities with a minimal risk appetite — the Department of Defense is the textbook example — ensuring hardware authenticity and secure microprocessor manufacturing.","multi":false},{"id":"s2i356","q":"An organization evaluating SaaS providers asks: 'If we suffer a breach, will this provider give us the support and cooperation needed for full incident response and forensics?' Which risk dimension is being evaluated?","a":"The provider's ability to support incident response and forensic investigation","why":"With service providers/MSPs, key risk questions are whether your data's confidentiality and integrity will be maintained, whether their security protocols are robust, and whether they'd support full-scale incident response and forensics after a breach.","multi":false},{"id":"k96ew2","q":"What is the overall purpose of a vendor assessment?","a":"To evaluate the security, reliability, and performance of external entities the organization relies on","why":"A vendor assessment evaluates the security, reliability, and performance of external entities you rely on — a weak link in one vendor can create widespread vulnerabilities and data breaches across multiple businesses.","multi":false},{"id":"1j1hv1c","q":"While performing due diligence on an 'eco-friendly packaging' vendor, which of the following goes beyond checking the certification and matches the course's guidance?","a":"Understanding their waste management practices, material sourcing policies, and overall environmental impact","why":"Due diligence goes beyond surface-level credentials: for eco-friendly packaging you'd examine waste management practices, material sourcing policies, and overall environmental impact — the on-the-ground reality behind the certification.","multi":false},{"id":"umhnv7","q":"Why do organizations use vendor questionnaires when comparing cloud providers?","a":"To compare all vendors on a standardized set of criteria for a fair, informed decision","why":"Questionnaires gather detailed responses (redundancy, security protocols, uptime guarantees, disaster recovery plans) that enable standardized comparison across vendors and a fair, informed selection process.","multi":false},{"id":"17np3g7","q":"An organization tells its vendor what it thinks of the vendor's product quality, and the vendor suggests improvements to the organization's procurement process. What monitoring mechanism is at work?","a":"Feedback loops","why":"Feedback loops are two-way communication channels where both the organization and vendor share feedback — they lead to collaborative growth and refinement when maintained effectively.","multi":false},{"id":"dnmjda","q":"A recurring client wants to avoid drafting a new contract for every project with the same service provider. Which agreement should anchor the relationship?","a":"Master Service Agreement (MSA)","why":"An MSA is a blanket agreement covering general terms across multiple transactions; individual work orders or Statements of Work supplement it per project. NDAs, SLAs, and BPAs serve different purposes.","multi":false},{"id":"8dubvk","q":"A startup must reveal proprietary technology details to a potential investor during talks, even though no deal may happen. Which agreement keeps those details from reaching competitors?","a":"Non-disclosure Agreement (NDA)","why":"An NDA is a commitment to privacy ensuring sensitive information shared during negotiations remains confidential — even if the investor passes on the opportunity, the technology details can't reach competitors.","multi":false},{"id":"15yjng2","q":"Which of the following are supply chain risk sources spanning hardware, software, and services, as described in the course? (Select FOUR.)","a":"Hardware components tampered with or from untrustworthy vendors;  Counterfeit or tampered devices from secondary market sources;  Software that is unlicensed, inauthentic, or full of known vulnerabilities;  An MSP with weak cybersecurity protocols holding access to your data","why":"The course's three risk lanes: hardware (tampered components, counterfeit aftermarket devices), software (unlicensed/inauthentic/vulnerable code needing AV scans), and services (MSPs/SaaS with weak protocols and your data in their hands). Strong passwords, patching, and backups are defensive strengths, not vendor risks.","multi":true},{"id":"13ebvuo","q":"Which elements instill confidence in a vendor's security posture during an assessment? (Select THREE.)","a":"Evidence of consistent, comprehensive internal audits;  A right to audit clause allowing you to inspect their practices;  Validation from an independent third-party assessment","why":"Confidence comes from evidence: the vendor's own internal audit discipline, your contractual right to audit (trust but verify), and neutral independent assessment. Brochures, low prices, and evasiveness prove nothing about security.","multi":true},{"id":"eb7gts","q":"According to the course, which checks should be performed on software before it is used in the enterprise network? (Select FOUR.)","a":"Confirm it is properly licensed;  Confirm it is authentic;  Confirm it is free of known vulnerabilities or bugs;  Scan it with antivirus/anti-malware","why":"Software checks per the course: properly licensed, authentic, free of known vulnerabilities/bugs, and scanned with antivirus/anti-malware. Open source additionally allows full source-code review. File size, advertising, and stock price are irrelevant.","multi":true},{"id":"ns70hd","q":"Which statements about rules of engagement in vendor selection are true? (Select TWO.)","a":"They dictate the terms of interaction between the organization and potential vendors;  They cover communication protocols, data sharing policies, and negotiation boundaries","why":"Rules of engagement are guidelines for interacting with potential vendors — communication protocols, data-sharing policies, negotiation boundaries (e.g., rejecting unsolicited proposals). They guide selection; they neither replace contracts nor restrict technical evaluation.","multi":true},{"id":"by9eq0","q":"A policy analyst argues that a single foreign semiconductor fab disruption could halt US production of cars, medical devices, and missile systems simultaneously. Which 2022 statute was passed specifically to address this exposure, and what was its mechanism?","a":"The CHIPS Act — funding domestic semiconductor research and manufacturing to reduce reliance on foreign chips","why":"The CHIPS and Science Act of 2022 (~$280B) funds US semiconductor research and manufacturing ($39B manufacturing subsidies, 25% equipment tax credit, $13B research/workforce) to minimize supply chain risk from reliance on foreign-made semiconductors. The other statutes are fabricated distractors.","multi":false},{"id":"x0efc5","q":"A laptop maker buys processors from one company, memory from another, and hard drives from a third. In supply chain terminology, these three companies are the laptop maker's:","a":"Suppliers","why":"Suppliers are involved in the production and delivery of products or PARTS of products — processors, memory, hard drives. Vendors provide goods/services (like Microsoft licensing software), MSPs manage IT services, and auditors assess.","multi":false},{"id":"dnl4rz","q":"An organization must decide between two SaaS CRM platforms. Both meet functional requirements, but they differ in security posture. According to the course, which organizational attribute should ultimately drive this decision?","a":"Risk appetite — including the potential ramifications of a data breach","why":"Choosing a service provider is a risk decision based on the organization's risk appetite and understanding the potential ramifications of a data breach — can the provider maintain confidentiality/integrity and support incident response if breached?","multi":false},{"id":"nq57k3","q":"A counterfeit chip in a purchased router has two possible outcomes described in the course. Which pair states them correctly?","a":"Best case: device malfunctions causing network failures; worst case: an always-on backdoor into the network","why":"Chip washing's best case is a device that doesn't work right — network failures or crashes. The worst case is malicious functionality providing an always-on backdoor, turning your own network hardware against you.","multi":false},{"id":"1rn2e43","q":"A vendor proudly presents twelve months of internal audit reports. The CISO still commissions an outside firm to validate the vendor's controls. Why is the CISO justified?","a":"Internal audits are self-assessments that may lack rigor; independent validation adds a neutral, unbiased layer","why":"Internal audits are the vendor's self-assessment — commendable, but sometimes insufficient due to lacking rigor or objectivity. Independent assessments by third parties with no stake provide neutral validation that minimizes exposure to risk.","multi":false},{"id":"w10e7m","q":"During selection of a penetration-testing vendor, the committee chair discloses they hold stock in one bidder. Which handling aligns with the course's conflict-of-interest guidance?","a":"Document the disclosure and exclude the chair from the decision-making process","why":"Conflicts of interest arise when personal or financial relationships could cloud judgment. The remedies are transparency — requiring disclosures — and excluding conflicted parties from the selection process.","multi":false},{"id":"hyqtz2","q":"A training company states it accepts no unsolicited proposals: vendors may only bid after the company posts a request for proposals, and cold pitches are deleted or marked as spam. Which concept from vendor selection does this exemplify?","a":"Rules of engagement governing vendor interactions","why":"This is a rules-of-engagement policy — guidelines dictating the terms of interaction with potential vendors, including communication protocols and negotiation boundaries. It keeps vendor interactions productive and within organizational standards.","multi":false},{"id":"13gf766","q":"Which statement correctly distinguishes performance reviews from feedback loops in vendor monitoring?","a":"Performance reviews score deliverables against contract standards; feedback loops are two-way communication channels for mutual input","why":"Performance reviews are periodic evaluations of deliverables against the agreed standards/objectives in the contract. Feedback loops are two-way channels where both sides share input — the org comments on quality while the vendor suggests procurement improvements.","multi":false},{"id":"1metyt8","q":"A managed IT provider misses its two-hour monthly downtime ceiling three months running, and the client receives compensation each time. Which agreement's terms produced that compensation?","a":"Service Level Agreement","why":"The SLA defines the standard of service — downtime not exceeding two hours per month — and deviations result in penalties paid by the service provider. MOUs express intent, NDAs protect confidentiality, SOWs detail project scope.","multi":false},{"id":"jviqw8","q":"Two companies collaborate on a joint marketing campaign. Their document spells out who creates content, who manages distribution channels, and who funds the campaign. Which document is this, and why?","a":"An MOA — it is the formal document outlining specific responsibilities and roles","why":"Specific role allocation (who does what, who pays) is the signature of an MOA — formal and specific. An MOU would only express broad intent; an NDA covers secrecy; an MSA is an umbrella for recurring transactions.","multi":false},{"id":"187xaz3","q":"Under an existing MSA between a client and a development firm, a new mobile app project begins. Which document will specify that project's deliverables, timeline, and milestones?","a":"A Statement of Work","why":"The MSA carries the broad terms (payment, confidentiality); each specific project is detailed in a Statement of Work (aka Scope of Work) — deliverables, timeline, milestones. That's the MSA + SOW pairing the course describes.","multi":false},{"id":"1cq8gid","q":"Two firms pool resources to launch a product jointly. Their written arrangement covers profit sharing, decision-making structures, ownership of newly created intellectual property, revenue distribution, and exit strategies. Which agreement is this?","a":"Business Partnership Agreement — also known as a Joint Venture agreement","why":"A BPA (aka JV agreement) goes beyond a basic contract when entities pool resources: partnership nature, profit sharing, decision-making structures, IP ownership, revenue distribution, and exit strategies. It's the most partnership-focused document in the set.","multi":false},{"id":"5mqe54","q":"Which activities are components of a thorough vendor assessment per the course? (Select FOUR.)","a":"Penetration testing the supplier's systems;  Verifying a right to audit clause in the contract;  Collecting evidence of the vendor's internal audits;  Performing a supply chain analysis of the vendor's own sources","why":"Vendor assessment includes simulated attacks (penetration testing), contractual verification rights (right to audit), the vendor's self-assessment evidence (internal audits), neutral validation (independent assessments), and a deep dive into the vendor's supply chain. Watermarking, load balancing, and translation are unrelated operations.","multi":true},{"id":"106onwt","q":"From a customer's perspective, which risks do MSPs — especially SaaS providers — introduce? (Select THREE.)","a":"Uncertainty about whether the provider's protocols can keep customer data confidential and intact;  Doubt about whether the provider would support incident response and forensics after a breach;  Dependence on the provider's overall cybersecurity posture","why":"MSPs/SaaS risks: can they maintain confidentiality and integrity of your data, are their security protocols robust enough, and would they cooperate in full-scale incident response or forensics. No provider eliminates breach risk — that claim is itself a red flag.","multi":true},{"id":"1ttimm8","q":"Which items does the course list as elements of due diligence in vendor selection? (Select FOUR.)","a":"Vetting the vendor's financial stability;  Reviewing the vendor's operational history;  Checking client testimonials;  Examining on-the-ground practices","why":"Due diligence goes beyond surface-level credentials: financial stability, operational history, client testimonials, and on-the-ground practices (e.g., actual waste management behind an 'eco-friendly' certification). Logos, parking, and org charts prove nothing about reliability.","multi":true},{"id":"1y88f9o","q":"Which agreements does the course present as supplements that fine-tune a business relationship beyond a basic contract? (Select FOUR.)","a":"Service Level Agreement;  Memorandum of Agreement / Memorandum of Understanding;  Master Service Agreement;  Non-disclosure Agreement","why":"The relationship toolkit beyond a basic contract: SLA (service standard), MOA/MOU (formal roles vs mutual intent), MSA (blanket terms across transactions), SOW (project specifics), NDA (confidentiality), and BPA (partnership). RFC, BIOS, and URL are technical terms, not agreements.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
</div>
