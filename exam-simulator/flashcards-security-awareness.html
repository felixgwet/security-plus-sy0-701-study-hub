<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #f0883e; --accent-dim: rgba(240,136,62,.14);
    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .topbar .grow { flex: 1; }
  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }
  h1 { font-size: 24px; margin: 10px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }
</style>

  <p class="sub">Tap the card to flip it, then grade yourself honestly &mdash; the deck remembers what you know and will prioritize your weak cards.</p>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span>cards</span></div>
    <div class="stat"><b id="stKnown" style="color:var(--green)">0</b><span>known</span></div>

  <script>
    var DECKS = [{"label":"Section 26 · Security Awareness","cards":[{"id":"1js8noj","q":"Which behavior best demonstrates an insider threat warning sign rather than ordinary conduct?","a":"A lifestyle far exceeding known income, unexplained by household earnings or reported windfalls","why":"Lifestyle incongruence is a classic insider red flag requiring discreet investigation.","multi":false},{"id":"1pt2xdz","q":"The PRIMARY reason password reuse is dangerous:","a":"Compromised credentials from one breached site unlock every other account using the same email/password pair","why":"One breach (Yahoo, Target) + reuse = attackers replay your credentials everywhere.","multi":false},{"id":"1u0w4lx","q":"The master password of a password manager is special because it:","a":"Encrypts the whole vault — forgetting it means losing all stored credentials","why":"The master password is the encryption key; strong and memorable — it's the only one you memorize.","multi":false},{"id":"19mbesx","q":"Shoulder surfing is best countered by:","a":"Privacy screen protectors and situational awareness in public spaces","why":"Filters and location discipline stop observers reading your screen.","multi":false},{"id":"1lgl2f4","q":"An attacker follows an employee through a secured door. The BEST preventive architectural control is:","a":"An access control vestibule allowing only one person at a time","why":"Vestibules (mantraps) physically defeat piggybacking/tailgating.","multi":false},{"id":"q9u1tr","q":"Finding a free charging cable at the airport, the safest action is:","a":"Use only your own cable/charger, since rigged cables carry malware in firmware","why":"Baiting evolved to malicious cables — never trust public charging accessories.","multi":false},{"id":"yenbuq","q":"OPSEC in daily practice means:","a":"Being discreet about schedules, deals, and routines even in casual conversation and social media","why":"Small innocent details aggregate into attack material — control the puzzle pieces.","multi":false},{"id":"dj6lx2","q":"Policies and handbooks should be treated as:","a":"Living guides reviewed at least annually, with staff trained on the why behind them","why":"Annual reviews, change summaries, and principle-based training keep them effective.","multi":false},{"id":"1rsvn8l","q":"The biggest ownership-related challenge with BYOD in remote work:","a":"The org cannot install or enforce security software without the employee's consent","why":"Ownership limits management control — company-issued/CYOD/COPE avoid this gap.","multi":false},{"id":"1ri27dp","q":"Building a security culture via organizational change management must begin:","a":"With executive leadership setting the tone and treating security as shared responsibility","why":"Tone-from-the-top is the OCM foundation — everyone from the C-suite to seasonal staff shares responsibility.","multi":false},{"id":"1qgzb45","q":"A no-blame incident-reporting culture primarily improves security by:","a":"Encouraging early reporting and honest input instead of hidden mistakes","why":"Fear suppresses reporting; blameless environments surface incidents while they're small.","multi":false},{"id":"1ihpvcq","q":"Simulated phishing campaigns with remedial training for clickers create:","a":"A proactive defense that closes human vulnerabilities before real attackers exploit them","why":"Test → remediate → retest converts the weakest link into a trained sensor.","multi":false},{"id":"17ar71w","q":"Select THREE insider-threat warning signs:","a":"Regularly arriving in an altered state;  Emotional distress (giving away possessions, depression);  Lifestyle incongruent with income","why":"Also financial struggles. Vacations and password managers are healthy behaviors.","multi":true},{"id":"172rlab","q":"Which THREE are valid remote/hybrid work security controls?","a":"VPN for encrypted connections;  MFA on access;  Company-issued devices with updated security software","why":"Also encryption + remote wipe, automated backups, secure collaboration tools, continuous training.","multi":true},{"id":"1d0ze0q","q":"Which THREE belong in an insider threat program?","a":"A culture encouraging reporting of suspicious activity;  Training to recognize warning signs;  Fair, confidential investigation processes","why":"Plus user activity monitoring balanced with privacy, and support policies (mental health, financial counseling).","multi":true},{"id":"1w45q0z","q":"Which THREE are eavesdropping countermeasures?","a":"Holding sensitive discussions in soundproofed/secure areas;  Being aware of smart devices in the room;  Avoiding confidential conversations in coffee shops","why":"Control the location and the devices around sensitive talks — everything else amplifies risk.","multi":true},{"id":"6d1g5p","q":"Security awareness is best defined as:","a":"Knowledge and understanding of potential security threats and the measures to mitigate them","why":"Awareness = people knowing threats and how to respond — the human layer of defense.","multi":false},{"id":"1aqbvdi","q":"The course states that one of the most significant vulnerabilities in enterprise networks remains:","a":"Human error","why":"Technical defenses are vital, but human error is a top vulnerability — hence awareness training.","multi":false},{"id":"6efwet","q":"An insider threat can originate from all of the following EXCEPT:","a":"Random external hackers with no inside knowledge","why":"Insiders are people with inside knowledge: employees (past/present), contractors, partners.","multi":false},{"id":"1ncr9qi","q":"Which is an example of a lifestyle incongruence red flag?","a":"An $80K sysadmin driving a $150K sports car and living in a $2M home","why":"Spending far beyond known income may indicate illicit income — verify discreetly (could be a spouse's income or reported windfall).","multi":false},{"id":"1dn5bvh","q":"Financial disclosure forms for clearance holders establish:","a":"A normal financial baseline so unexpected windfalls or spending can be evaluated","why":"A baseline lets investigators distinguish legitimate windfalls (inheritance, lottery — which must be reported) from suspicious income.","multi":false},{"id":"iusln","q":"An employee drowning in debt is a security concern mainly because:","a":"Financial pressure can make them susceptible to bribery or selling secrets to competitors","why":"Financial stress = coercion vulnerability; policies may offer financial counseling plus data-access monitoring.","multi":false},{"id":"bu3er0","q":"Repeatedly showing up to work in an altered state (drunk/hungover) is a concern because it:","a":"Signals possible personal problems, impaired judgment, and heightened coercion risk","why":"Substance issues correlate with poor decisions and vulnerability to nation-state recruitment — clearance holders get flagged.","multi":false},{"id":"rixj8g","q":"An employee giving away personal possessions and showing depression should be engaged:","a":"By management/HR with empathy and support, since distress reduces vigilance and increases exploitability","why":"Emotional distress → unintentional breaches + exploitation risk. Respond with support, not punishment.","multi":false},{"id":"185q66x","q":"User activity monitoring for insider threats looks for all of the following EXCEPT:","a":"An employee's favorite pizza toppings","why":"Monitoring targets data-access anomalies — balanced against employee privacy rights.","multi":false},{"id":"160c0qj","q":"The biggest danger of reusing passwords across websites is:","a":"One breached site exposes every account sharing that password — and usernames (your email) are usually identical everywhere","why":"Breach credentials get replayed across sites (Yahoo/Target-style); reuse = one breach, total compromise.","multi":false},{"id":"16zxv0i","q":"Why does the instructor prefer standalone third-party password managers over browser built-ins?","a":"They are more secure than managers built into browsers","why":"Browser-integrated managers are convenient but less secure; dedicated tools (Bitwarden, 1Password, Dashlane, LastPass) are preferred.","multi":false},{"id":"pn8oml","q":"In a password manager, the master password is critical because it:","a":"Encrypts the entire vault — lose it and all stored passwords are gone","why":"The master password is the encryption key; you memorize only this one — everything else is stored.","multi":false},{"id":"19zsj45","q":"A strong generated password per the Bitwarden demo was at least:","a":"14 characters with upper/lowercase, numbers, and special characters","why":"The demo generated 14+ char random passwords (or passphrases) per site — unique and unmemorizable, which is fine.","multi":false},{"id":"170p8yx","q":"Situational awareness means:","a":"Mindfulness of your surroundings, the actions you're asked to perform, and their potential negative consequences","why":"Awareness of environment + actions + consequences is the first line of defense against social engineering.","multi":false},{"id":"1cl8tt6","q":"The best defense against shoulder surfing includes:","a":"Privacy screen protectors and avoiding confidential work in public spaces","why":"Shoulder surfers read your screen over your shoulder — privacy filters and location discipline defeat them.","multi":false},{"id":"1fp6z3b","q":"Eavesdropping defenses include:","a":"Holding sensitive talks only in secure/soundproofed areas and being wary of smart devices that could record","why":"Smartphones/watches can be hijacked to record — control WHERE and around WHAT devices sensitive talks happen.","multi":false},{"id":"l5uygj","q":"Piggybacking/tailgating is best prevented by:","a":"Access control vestibules allowing one person at a time plus employee awareness at entry points","why":"Vestibules (mantraps) physically enforce single-person entry; awareness stops polite door-holding for strangers.","multi":false},{"id":"jris20","q":"A USB drive found in the parking lot is best handled by:","a":"Not connecting it to any computer — it's a classic baiting trap","why":"Baiting: attackers plant malware-laden USBs hoping curiosity wins. Never plug found media in.","multi":false},{"id":"1iy6rtz","q":"Malicious charging cables in public areas (airports, coffee shops) threaten users via:","a":"Malware in the cable firmware that infects connected phones","why":"Baiting evolved from USB drops to rigged cables — carry your own cable and charger.","multi":false},{"id":"1nv975i","q":"OPSEC (operational security) in a business context primarily means:","a":"Safeguarding routine details and sensitive data that adversaries could piece together into an attack narrative","why":"Military-origin concept: innocuous fragments (schedule, deals, social posts) assemble into exploitation leverage.","multi":false},{"id":"1ad40zp","q":"A caller claiming to be IT support demands immediate information to avoid 'legal consequences.' This pressure tactic aims to:","a":"Make you act quickly and bypass normal security procedures","why":"Urgency/fear bypasses careful thinking — vishing 101. Verify through official channels instead.","multi":false},{"id":"n3bmc","q":"The course recommends testing employees with simulated phishing attacks primarily to:","a":"Identify who needs remedial training so they don't fall for real attacks","why":"Simulations + remediation close the human gap proactively rather than reactively.","multi":false},{"id":"1f0rxoj","q":"A policy differs from a handbook in that a policy is:","a":"A set of principles/rules guiding decisions and ensuring compliance, while a handbook is a comprehensive reference guide","why":"Policy = rules for decisions; handbook = detailed procedures/best-practice reference (e.g. employee handbook).","multi":false},{"id":"px9j8f","q":"An organization prints sensitive documents only on pink paper, which must be cross-cut shredded. This is an example of:","a":"A data destruction policy defeating dumpster diving","why":"Color-coding + mandated shredding = policy-level defense against dumpster diving.","multi":false},{"id":"1eunn7m","q":"Policies and handbooks should be reviewed at least:","a":"Once per year","why":"Cybersecurity evolves — annual reviews with a one-page summary of significant changes for staff.","multi":false},{"id":"196hp41","q":"Training employees on the WHY behind policies matters most because:","a":"They may face situations the policy doesn't cover and must make sound judgment calls","why":"Policies are guides, not guardrails — understanding principles enables good decisions on novel situations.","multi":false},{"id":"141odo4","q":"Remote work differs from hybrid work in that hybrid:","a":"Blends traditional in-office work with remote work","why":"Remote = outside the office entirely; hybrid = part office, part remote.","multi":false},{"id":"1067h1q","q":"The FIRST-line technical control for protecting data in transit from remote workers is:","a":"A VPN providing encrypted end-to-end connections","why":"VPNs shield traffic on untrusted home/public networks from interception and modification.","multi":false},{"id":"c9d70n","q":"MFA for remote workers primarily protects against:","a":"Unauthorized access when login credentials are compromised","why":"Extra verification factors stop attackers even with valid credentials.","multi":false},{"id":"1o4oecx","q":"BYOD complicates remote-work security chiefly because:","a":"The organization doesn't own the device and can't enforce software installs without employee consent","why":"Ownership limits control — vs company-issued, CYOD, or COPE models where the org dictates security tooling.","multi":false},{"id":"pojnvc","q":"Selection criteria for remote collaboration tools should include:","a":"End-to-end encryption, robust admin controls, and compliance with international security standards","why":"Secure collaboration demands encryption, administration, and standards compliance.","multi":false},{"id":"1u3yrcr","q":"Organizational change management for security culture should begin:","a":"At the top, with executive leadership demonstrating commitment","why":"Leaders set the tone — security as shared corporate responsibility, not a mandated directive.","multi":false},{"id":"9zbcxl","q":"A culture where staff fear being blamed for reporting incidents is:","a":"Counterproductive — a no-blame environment that values reporting is the goal","why":"Blame suppresses reporting; encouragement + feedback loops surface issues early.","multi":false},{"id":"1vkcqt3","q":"Feedback loops in a security culture ensure:","a":"Insights from monitoring and reporting directly shape future actions — continuous learning","why":"Learn-and-adapt cycles keep the program effective against evolving threats.","multi":false},{"id":"11o6yls","q":"During an annual review cycle, which document should be updated so that staff know the specific rules for acceptable device use at work?","a":"The employee handbook","why":"Policies and handbooks codify expectations. An annual review cycle keeps policies current, and staff need to know what to expect — train the WHY, not just the rules.","multi":false},{"id":"1u5gxoq","q":"A caller claiming to be from the IT help desk insists your account will be locked in 10 minutes unless you read back the one-time passcode you just received. Which social-engineering tactic is in use?","a":"Vishing with manufactured urgency","why":"Voice + urgency is the classic vishing pattern. Manufactured pressure (\"10 minutes!\") short-circuits careful thinking — the correct response is to hang up and verify through a known channel.","multi":false},{"id":"1pxyftx","q":"Which of the following is a behavioral indicator (altered state) that may signal a potential insider threat?","a":"Sudden unexplained hostility or withdrawal from coworkers","why":"Insider threat warning signs include altered states, emotional distress, lifestyle incongruence, and financial struggles. They are indicators for support and monitoring, not automatic proof of wrongdoing.","multi":false},{"id":"119j437","q":"A company wants to discourage tailgating at the main entrance. Which control is MOST effective?","a":"An access control vestibule (mantrap) that admits one person at a time","why":"Access control vestibules physically enforce one-person-at-a-time entry, defeating both tailgating and piggybacking. Policies alone rarely change behavior at a door.","multi":false},{"id":"13u8mhm","q":"Why do security professionals generally recommend a dedicated third-party password manager over a browser’s built-in password vault?","a":"Dedicated managers are built around strong encryption with a single master password as the key, and are portable across browsers and devices","why":"The master password is the encryption key protecting your vault. Dedicated managers offer cross-platform portability and stronger, audited crypto than convenience-oriented browser storage. MFA is still needed.","multi":false},{"id":"1un03ci","q":"An employee works from a coffee shop and needs to review a file containing customer data. Which combination BEST protects the data in a remote/hybrid setting?","a":"VPN plus full-disk encryption on a company-managed device with MFA","why":"Remote work guidance: use a VPN on untrusted networks, use company-managed devices with encryption and remote wipe, require MFA, and keep automated backups running.","multi":false},{"id":"nm5zhj","q":"Which situation is MOST consistent with \"lifestyle incongruence\" as an insider threat indicator?","a":"An employee on a modest salary suddenly displays unexplained wealth far beyond their means","why":"Lifestyle incongruence means visible spending that does not match known income — a classic recruitment/exploitation red flag. Report through proper channels; investigations must remain fair and confidential.","multi":false},{"id":"ofc283","q":"What is the PRIMARY reason simulated phishing exercises should be paired with immediate remedial training for people who click?","a":"Clickers learn the correct response at the moment the lesson is most salient, changing future behavior","why":"Just-in-time remediation trains the correct action while the experience is fresh. Effective programs are educational, not punitive — a no-blame reporting culture gets faster, better reporting.","multi":false},{"id":"11us3xb","q":"Which practice BEST protects sensitive printouts from dumpster diving?","a":"Cross-cut shredding or a locked destruction bin per policy","why":"Dumpster diving recovers discarded documents and media. Shredding/destruction policies (sometimes called pink paper or clean desk policy) deny attackers free intelligence.","multi":false},{"id":"1tm0qkj","q":"When rolling out a \"culture of security,\" what does organizational change management (OCM) teach about sponsorship?","a":"Leadership must visibly champion the change for it to take root","why":"OCM starts at the top: leadership models the behavior, then the change moves through development, execution, and monitoring phases with feedback loops and open communication.","multi":false},{"id":"1uyw1h1","q":"A manager asks why the company forbids syncing work files to personal cloud accounts. Which answer captures the core risk?","a":"Company data leaves managed, encrypted, auditable control — a BYOD consent and data-leak problem","why":"Remote/hybrid risk: personal services bypass encryption, remote-wipe, and audit controls. Use approved collaboration tools with E2E encryption, admin controls, and standards compliance.","multi":false},{"id":"1gthj5g","q":"Which pairing of threat and mitigation is CORRECT?","a":"Shoulder surfing — privacy filters and situational awareness","why":"Shoulder surfing is defeated by privacy screens, screen positioning, and situational awareness. Eavesdropping is mitigated with secure meeting rooms and device policies; tailgating with mantraps and guards.","multi":false},{"id":"gbbzi7","q":"An employee finds a branded USB drive in the parking lot labeled \"Q4 Bonus Figures.\" What should training tell them to do?","a":"Turn it in to security/IT without plugging it in","why":"USB baiting preys on curiosity. The safe action is never to insert unknown media — report it. Social engineering works because it targets people, so awareness training is the key control.","multi":false},{"id":"xv6jj5","q":"A user activity monitoring (UAM) program is being designed. Which principle keeps it effective AND ethical?","a":"Transparent policy, proportionate scope, privacy respected, fair and confidential handling of findings","why":"UAM must balance detection of insider threats with employee privacy: clear notice, defined scope, confidential investigations, and due process build trust and keep the program defensible.","multi":false},{"id":"rg3g8d","q":"A help desk receives three reports in one week of the same convincing payroll-themed phishing email. What does this demonstrate working correctly?","a":"A culture where staff report suspicious messages quickly, enabling collective defense","why":"Fast, no-blame reporting is the goal of security awareness. One reported phish can protect the entire organization; feedback loops and encouragement sustain the behavior.","multi":false},{"id":"1f2ghr9","q":"Which is the BEST example of \"train the WHY\" in a security handbook rollout?","a":"\"Blocking external USB storage reduces the chance ransomware enters our network — here is the one-minute version of how.\"","why":"People follow rules they understand. Explaining the reasoning behind controls (the WHY) produces durable behavior change far better than bare mandates.","multi":false},{"id":"vmbva7","q":"What is situational awareness in a security context?","a":"Being conscious of your environment — who is around, what can be seen or heard — and adjusting behavior to protect information","why":"Situational awareness underpins defenses against shoulder surfing, eavesdropping, and tailgating: notice your surroundings before your information becomes someone else’s.","multi":false},{"id":"99b0rc","q":"During OCM’s monitoring phase after a security awareness rollout, what should leadership do with feedback?","a":"Use feedback loops to refine training, close gaps, and communicate progress back to staff","why":"OCM phases are development, execution, and monitoring. Feedback loops and open communication turn a one-time rollout into an improving program — and visible leadership keeps momentum.","multi":false},{"id":"xgdw62","q":"Which statement about password reuse is TRUE?","a":"One breached reused password unlocks every account that shares it — password managers exist to eliminate reuse","why":"Credential stuffing attacks exploit reuse at scale. Unique, long (14+ character) generated passwords per site, stored in a manager, is the standard answer.","multi":false},{"id":"17oq2y","q":"An organization wants staff to treat \"think before you click\" as a habit rather than a rule. Which approach is MOST effective?","a":"Ongoing micro-training, simulated phishing with just-in-time coaching, leadership modeling, and recognition of good reporting","why":"Habits form through repetition, relevance, and reinforcement — short ongoing training, realistic practice, positive reinforcement, and visible executive participation build a culture of security.","multi":false},{"id":"1s1embh","q":"A financial analyst who has been with the company for six years, earns $60,000, and has recently been overheard discussing large gambling debts, has begun arriving at odd hours and copying unusually large numbers of files. Taken together, which framework best describes these indicators?","a":"Potential insider threat indicators: financial struggles, altered schedule, and anomalous data access warranting a fair, confidential review","why":"Insider threat indicators include financial struggles, lifestyle changes, altered states, and unusual access patterns. Indicators justify investigation through proper channels — they are not proof of guilt.","multi":false},{"id":"1j6qy10","q":"Which of the following are established warning signs associated with potential insider threats? (Select THREE.)","a":"Emotional distress or altered behavior;  Financial struggles;  Lifestyle incongruence with known income","why":"The classic insider threat indicators are altered states, emotional distress, lifestyle incongruence, and financial struggles. The other options are normal workplace behavior.","multi":true},{"id":"16t3f2k","q":"An organization is standing up an insider threat program. Which elements should it include?","a":"A reporting culture where concerns can be raised without fear;  Training so staff recognize indicators;  Fair, confidential investigations with due process","why":"Effective insider threat programs combine a no-blame reporting culture, awareness training, and fair/confidential investigation procedures. Secret unfettered monitoring or public accusations destroy trust and create legal risk.","multi":true},{"id":"1m1o7j","q":"Which statement about password managers is MOST accurate?","a":"The master password acts as the encryption key for the vault, so it must be strong and memorable; generated 14+ character unique passwords eliminate reuse","why":"The master password is the encryption key — if lost, the vault is unrecoverable. Dedicated third-party managers are preferred over browser vaults, and MFA remains essential.","multi":false},{"id":"1t8agkr","q":"A hybrid worker connects from home, a coffee shop, and a client site during the week. Which baseline protections should the organization require? (Select THREE.)","a":"VPN on untrusted networks;  MFA on remote access;  Full-disk encryption with remote wipe on company devices","why":"Remote/hybrid baselines: VPN for untrusted networks, MFA everywhere, and managed encrypted devices with remote wipe. Personal storage and open Wi-Fi without controls are the risks being mitigated.","multi":true},{"id":"1tt0yrc","q":"A well-crafted simulated phishing campaign shows 18% of staff clicking. What is the BEST next step?","a":"Deliver immediate, just-in-time remedial training to clickers, track trends over time, and report improvement back to staff","why":"Just-in-time remediation at the moment of the mistake changes behavior. Programs should measure trend lines over time, stay educational rather than punitive, and communicate results to reinforce the culture.","multi":false},{"id":"177op3p","q":"What is the primary weakness that makes vishing effective even against trained staff?","a":"Manufactured urgency and authority pressure the victim to act before verifying","why":"Vishing leans on urgency, authority, and fear (\"your account locks in 10 minutes\"). The trained countermove is to hang up and verify through a known channel — never use the number the caller provides.","multi":false},{"id":"16w3fnn","q":"Which pairs correctly describe BYOD risks and their mitigations in a remote-work policy?","a":"Personal device holds company data -> require encryption, containerization, and consent-based remote wipe;  Personal device lost -> remote wipe capability limited to the managed container protects privacy","why":"BYOD’s core problem is consent and data leakage: mitigations include managed containers, encryption, and scoped remote wipe that respects personal privacy. It is not legally banned — it is governed by policy.","multi":true},{"id":"ixwle5","q":"A security handbook rollout tells staff \"Do not plug in personal devices\" but omits any explanation. Which improvement best aligns with awareness best practice?","a":"Explain WHY — e.g., unvetted USB devices are a top malware and data-exfiltration vector — so staff make good decisions in novel situations","why":"Train the WHY. Rules without reasoning collapse in edge cases; understanding the threat lets people generalize the policy to situations the handbook never anticipated.","multi":false},{"id":"1629y1","q":"Which is a privacy-respecting design principle for a user activity monitoring (UAM) program?","a":"Transparent notice, proportionate and purpose-limited scope, confidential handling of findings, and fair process","why":"UAM must detect insider threats without crushing trust: staff should know monitoring exists, its scope, and that investigations are confidential and fair. Overreach creates legal exposure and resentment.","multi":false},{"id":"1e4abcm","q":"Why do security teams recommend unique passwords of 14+ characters generated by a password manager?","a":"Length and uniqueness defeat both brute-force and credential-stuffing attacks, which exploit reused passwords","why":"Credential stuffing feeds breached reused passwords into other sites; long unique generated passwords break that chain. Managers store them encrypted — admins cannot read them.","multi":false},{"id":"cj3g0t","q":"Which statements about eavesdropping countermeasures in offices are TRUE? (Select TWO.)","a":"Sensitive conversations should move to designated secure rooms;  Smart devices (speakers, assistants) near meeting areas should be governed by policy","why":"Eavesdropping defenses include secure meeting rooms, device policies for smart gadgets, and awareness of who is within earshot. Layout and noise machines reduce but do not eliminate risk.","multi":true},{"id":"1rerqvs","q":"During the monitoring phase of a security awareness OCM program, which metric is the MOST meaningful indicator of culture change?","a":"Reporting rate and speed of suspicious emails rising while click rates fall over time","why":"Behavioral trend lines — faster reporting, fewer clicks — show real culture change. Artifacts like policy counts measure activity, not outcomes.","multi":false},{"id":"11uoono","q":"An employee on a video call in a café discusses a customer contract. A person at the next table repeatedly glances at the screen. Which immediate actions are appropriate? (Select TWO.)","a":"Lower screen brightness and reposition so the display faces away;  Move the conversation to a private location or reschedule","why":"Situational awareness in action: control the sightlines, relocate sensitive work. Physical confrontation is never the right move — disengage and protect the information.","multi":true},{"id":"1jj7yz5","q":"A company drafts a handbook requiring annual acknowledgment of security policies. Which additional element makes the acknowledgment MOST effective?","a":"Pairing the acknowledgment with scenario-based training that explains the reasoning behind each key policy","why":"Annual acknowledgment plus practical, reasoned training turns a compliance checkbox into retained understanding — the point of an annual review cycle is relevance, not ritual.","multi":false},{"id":"80qyas","q":"Which sequence BEST captures how leadership builds a sustainable culture of security?","a":"Champion visibly from the top -> develop the program -> execute with training and feedback loops -> monitor metrics and refine","why":"Culture change is OCM: visible leadership sponsorship, planned development, executed with open communication and feedback loops, and monitored with behavioral metrics over time.","multi":false}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>

    if (big) {
      var el = big;
      while (el && el !== document.body) {
        if (el.classList && el.classList.contains('hidden')) return false;
        el = el.parentElement;
      }
      return big.offsetParent !== null;
    }

    a.textContent = '\u2190 Back to Library';
    a.setAttribute('style', 'position:fixed;left:18px;bottom:18px;z-index:9999;' +
      'padding:11px 20px;border-radius:999px;font:600 14px/1 "Segoe UI",system-ui,sans-serif;' +
      'text-decoration:none;color:#fff;background:linear-gradient(135deg,#f0883e,#e36414);' +
      'box-shadow:0 4px 18px rgba(240,136,62,.45);border:1px solid rgba(255,255,255,.25);');
    document.body.appendChild(a);
  }
  setInterval(ensure, 400);
  if (document.readyState !== 'loading') ensure();

})();
