  <script>
    var DECKS = [{"label":"Section 11 · Asset and Change Management","cards":[{"id":"127vy92","q":"A manager needs ten laptops for new hires by Friday. The CFO says using the company credit card is fine for small urgent buys, but purchasing insists a formal document must authorize the spend and lock in quantity and price before any order is placed. Which procurement method fits purchasing's requirement?","a":"Purchase order","why":"A purchase order is the formal authorization document that specifies items, quantities, and prices before the purchase happens. A company credit card suits minor quick buys but does not provide that formal pre-authorization record; reimbursement happens after the fact; verbal approval leaves no audit trail.","multi":false},{"id":"5qzrio","q":"An organization wants employees to carry smartphones for work but also wants the strongest possible MDM control, full monitoring rights, and standardized security. Employees will be allowed light personal use. Which deployment model best fits, and what is its main drawback?","a":"COPE — drawback is high upfront cost and reduced employee privacy","why":"COPE (Corporate Owned, Personally Enabled) gives the organization full ownership, strongest MDM enforcement, and complete monitoring rights, with limited personal use permitted. The trade-offs: high upfront device costs and privacy tension, because the company can legally monitor a device employees also use personally.","multi":false},{"id":"1ojeekt","q":"A security team runs a network scan and discovers 14 laptops that appear in no inventory or procurement record. Which asset management activity produced this finding, and why does it matter?","a":"Enumeration — scanning counted devices the inventory missed, exposing shadow assets","why":"Enumeration is the scanning-based counting and identification of devices actually connected to the network. It matters because assets missing from inventory (shadow IT, forgotten purchases, personal devices) receive no patches, no monitoring, and no change control — exactly the devices attackers target.","multi":false},{"id":"m8n7w6","q":"During an audit, a company cannot produce any proof that 200 decommissioned drives were actually wiped before resale. The IT lead insists 'we always erase them.' Which disposal step was skipped?","a":"Obtaining certificates of destruction / maintaining the audit log of sanitization","why":"Without a certificate of destruction or equivalent audit-log entry, there is no proof sanitization occurred. The method used (overwrite, crypto erase) is irrelevant if you cannot demonstrate it happened — auditors require documentary evidence tied to each asset, not verbal assurance.","multi":false},{"id":"qftj1v","q":"A data center must sanitize 500 magnetic tape backups containing sensitive financial records, and the tapes will NOT be reused or resold. The team wants a fast method that does not require software access to the data. Which method fits, and what is the consequence?","a":"Degaussing — fast, but the tapes become permanently unusable","why":"Degaussing wipes magnetic media with a powerful field in seconds without needing software access — ideal for tapes. The exam-critical consequence: degaussing destroys the media's storage capability permanently, so it only fits when reuse/resale is not planned. One pass is for public data; Secure Erase is unreliable.","multi":false},{"id":"107nqus","q":"A company wants to sanitize and resell 300 encrypted SSDs as quickly as possible while keeping the drives functional. The CISO rejects 35-pass overwriting as too slow. Which method should be used, and roughly how long does it take?","a":"Cryptographic erase — destroy the encryption keys, roughly 30–60 seconds per drive","why":"Because the drives were always encrypted, cryptographic erase simply destroys the keys — all data becomes unreadable in about 30–60 seconds and the drive stays fully functional for resale. Degaussing doesn't work on SSDs (flash, not magnetic) and destroys magnetic media anyway; shredding eliminates resale value.","multi":false},{"id":"5n9nva","q":"An engineer has fully tested a change, drafted a backout plan, and scheduled a maintenance window. According to the change process, what must happen before implementation begins?","a":"Approval by the Change Advisory Board after its due diligence review","why":"CAB approval after due diligence is the gate between preparation and implementation. Testing and backout planning are part of good preparation, but no change proceeds without CAB sign-off — skipping it is an unauthorized change regardless of how well-prepared the technical work is.","multi":false},{"id":"161aqod","q":"In a change proposal, who is responsible for initiating the change, arguing for its value, and taking ownership of whether it succeeds?","a":"The change owner","why":"The change owner initiates and advocates for the change and is accountable for its success. Stakeholders have a vested interest but don't own it; the CAB reviews it; technicians implement it. Exam questions test whether you can distinguish these roles.","multi":false},{"id":"knn4xi","q":"An impact analysis for a database upgrade reveals five applications query that database nightly. Only two of them were mentioned in the original change request. Which technical-implications practice most directly prevents this surprise?","a":"Dependencies mapping","why":"Dependencies mapping identifies every system, application, and service that relies on the component being changed. With a current dependency map, all five applications would have appeared in the impact analysis before approval — the classic 'we changed X and unrelated Y broke' scenario the exam loves.","multi":false},{"id":"1t6q794","q":"A change fails at 2 a.m. during the maintenance window. The on-call engineer restores service in 20 minutes because the procedure for doing so had been written down before the change started. Which two change-management elements made this recovery possible?","a":"A backout plan and version control enabling reversion to the stable state","why":"The backout plan is the pre-documented revert procedure executed here, and version control of configurations/documentation makes reverting to the last stable state possible. Both must exist BEFORE the change — you cannot plan your escape after the fire starts.","multi":false},{"id":"4qxcvq","q":"Why do legacy applications demand extra caution during even routine changes like OS patching?","a":"They are fragile — built on outdated frameworks with hard-coded assumptions that break when the environment changes","why":"Legacy applications often rely on outdated frameworks, old protocols, or hard-coded paths and assumptions. An apparently unrelated change — a patch, a certificate update, a network tweak — can break them silently. They require dependency mapping, dedicated testing, and sometimes restricted activities around them.","multi":false},{"id":"hkh4zb","q":"After a firewall upgrade, a branch office can no longer reach the central inventory database. Investigation shows the upgrade reset a rule that had permitted the database's legacy port. Which change-management step should have caught this?","a":"Reviewing allow/deny lists and firewall rules as part of the change","why":"Any change touching a network enforcement point must include a review of allow/deny lists and firewall rules against existing application requirements. The upgrade changed filtering behavior; a rule review before implementation would have preserved the legacy port exception.","multi":false},{"id":"1djx9k4","q":"Which statements correctly describe the three mobile deployment models? (Select THREE.)","a":"BYOD: employee-owned device; weakest organizational control;  COPE: organization-owned with limited personal use; strongest control but privacy tension;  CYOD: organization-owned; employee chooses from an approved list; balances control and satisfaction","why":"BYOD = employee-owned, least control, hardest to secure. COPE = company-owned, personally enabled — strongest MDM/monitoring control, but the organization can see everything including light personal use. CYOD = company-owned from an approved list — 'company car' model balancing security with employee choice. Options 4 and 5 invert ownership.","multi":true},{"id":"l6pwha","q":"Which capabilities does MDM provide for managing mobile assets? (Select THREE.)","a":"Remote lock of a lost or stolen device;  Remote wipe of corporate data;  Mass push of apps, policies, and configurations to the whole fleet","why":"MDM's core capabilities are remote lock, remote wipe, and mass push of configurations/apps/policies — exactly what makes fleet-wide mobile security practical. Location features exist but 'automatic police pursuit' overstates it, and no tool guarantees prevention of all malware.","multi":true},{"id":"12iajyz","q":"Which statements about sanitization and disposal are TRUE according to the course? (Select FOUR.)","a":"NIST SP 800-88 covers media sanitization;  Degaussing destroys the media's storage ability, making it unusable afterward;  Cryptographic erase destroys encryption keys and is fast enough to keep drives resellable;  Shredding, pulverizing, melting, or incinerating suits secret/top-secret data","why":"All four are course facts: NIST SP 800-88 is the sanitization standard; degaussing permanently kills magnetic media; cryptographic erase (~30–60s) preserves resale value; top classifications demand physical destruction. Secure Erase is explicitly flawed (inconsistent implementations), and overwrite passes scale with classification (1/7/35), not a flat 35.","multi":true},{"id":"1sm1qf6","q":"Which items are genuine technical implications of changes called out in the course? (Select FOUR.)","a":"Reviewing allow/deny lists and firewall rules;  Respecting restricted activities such as rebooting a domain controller in business hours;  Accounting for data in transit and backlogs lost when critical servers restart;  Handling fragile legacy applications and mapping dependencies","why":"The four technical implications: allow/deny list and firewall rule reviews; restricted activities (DC restarts in business hours lose in-transit data and backlogs plus interrupt authentication); fragile legacy apps; and dependencies mapping. Diagram updates are part of documentation, not technical implications, and payment terms are procurement.","multi":true},{"id":"mgrbhe","q":"Which two exam objectives does the Asset and Change Management section map to?","a":"OBJ 1.3 and OBJ 4.1/4.2","why":"Asset and change management spans OBJ 1.3 (change management, part of business continuity and resilience) and OBJ 4.1/4.2 (asset and change management controls in security operations). Knowing the objective mapping helps you see how the exam weights these topics.","multi":false},{"id":"1s70h6z","q":"Why do asset management and change management appear together in one section?","a":"Because unmanaged assets and unmanaged changes are two of the biggest sources of organizational risk","why":"The course pairs them because they are deeply connected disciplines: you cannot protect what you do not know you have (asset management), and you cannot control risk if systems change without oversight (change management). Both are foundational operational security practices.","multi":false},{"id":"ikjocx","q":"What is the fundamental principle behind asset management?","a":"You cannot protect what you do not know you have","why":"'You cannot protect what you do not know you have' is the driving principle of asset management. An unknown laptop in a drawer, an unpatched server nobody owns, or a forgotten cloud storage bucket are all assets that exist outside your security controls — and attackers look for exactly those.","multi":false},{"id":"e0g5ku","q":"Which statement best describes the relationship between asset management and change management?","a":"Asset management provides the inventory that change management protects from unauthorized modification","why":"Asset management gives you the authoritative inventory of what exists; change management ensures modifications to those assets happen only through an approved, controlled process. Together they close the loop: know your assets, and control how they change.","multi":false},{"id":"1j4ds8r","q":"Which domain of security do asset and change management primarily fall under?","a":"Security operations and administration","why":"Asset and change management are day-to-day security operations and administration disciplines. They are not offensive testing, not development, and although physical assets exist, the discipline spans far beyond facility design.","multi":false},{"id":"1kd2tr6","q":"An attacker breaches a server that IT did not know existed. Which failure is this primarily an example of?","a":"Poor asset management","why":"A server nobody knew existed is an asset management failure — the device was never inventoried, assigned, classified, or monitored. Change management cannot protect an asset that is not in the inventory, which is why asset management comes first.","multi":false},{"id":"e36cuy","q":"What is the difference between acquisition and procurement?","a":"Acquisition is the act of obtaining goods or services; procurement is the entire process of sourcing and obtaining them","why":"Acquisition is the act of obtaining goods or services — the outcome. Procurement is the broader end-to-end process: identifying needs, evaluating options, selecting vendors, negotiating terms, and completing the acquisition. All acquisitions involve procurement, but procurement is the discipline, not the single act.","multi":false},{"id":"p6rpip","q":"An employee buys a $25 USB cable with their own money and submits a receipt for reimbursement. Which procurement method is this?","a":"Individual purchase with reimbursement","why":"This is an individual purchase with reimbursement — the employee pays out of pocket and gets paid back after submitting the receipt. It is appropriate for very small, one-off items but creates poor visibility for security teams because the asset enters the organization outside normal procurement channels.","multi":false},{"id":"1wxz0vj","q":"Which procurement method is best suited for minor, quick purchases such as office supplies?","a":"Company credit card","why":"A company credit card is designed for minor, quick purchases where the overhead of a purchase order is not justified. It provides a corporate record of the transaction (better than employee reimbursement) while keeping the process fast for low-value items.","multi":false},{"id":"18iggpo","q":"What is a purchase order (PO)?","a":"A formal authorization for a purchase that specifies items, quantities, and prices","why":"A purchase order is a formal document authorizing a purchase — it tells the vendor what to provide, in what quantity, at what price. Crucially, a PO is not a payment; it is an authorization. The payment happens later, often on net-15, net-30, or net-60 terms.","multi":false},{"id":"1y3rkgt","q":"What do the terms net 15, net 30, and net 60 refer to?","a":"Payment terms — the number of days after invoicing within which payment is due","why":"Net 15/30/60 are payment terms specifying how many days the buyer has to pay the invoice after it is issued. Net 60 gives the buyer two months of float, which is attractive for cash flow but vendors may price this flexibility into their rates.","multi":false},{"id":"452v5i","q":"A Navy organization must route a purchase through multiple approval layers before any vendor is contacted. What is this approval chain an example of?","a":"An acquisition approval process (e.g., ITPR)","why":"This is an acquisition approval process — the course cites the Navy's ITPR (Information Technology Purchase Request) as an example where purchases must pass through a defined chain of approvals before proceeding. Government and large organizations use such chains to control spending and ensure security review before acquisition.","multi":false},{"id":"1ueqzmc","q":"Why do security teams care about how assets are procured?","a":"Because assets acquired outside official channels bypass security review and inventory","why":"Assets that enter through shadow channels — an employee's personal purchase, an unvetted vendor, a free promotional device — bypass security review, compatibility testing, and inventory. That is why procurement policy and asset management must connect: every acquisition should flow into the asset inventory.","multi":false},{"id":"1a6yodp","q":"In a BYOD model, who owns the device?","a":"The employee","why":"BYOD (Bring Your Own Device) means the employee owns the device and uses it for work. This creates the biggest privacy and security tension of the three models: the organization needs to protect corporate data on a device it does not own or fully control.","multi":false},{"id":"pryt88","q":"What is the biggest security challenge of BYOD?","a":"Securing corporate data on a device the organization does not own or control","why":"The core BYOD problem is that corporate data lives on employee-owned hardware. The organization cannot simply wipe or inspect a personal device the way it can its own, and MDM control is harder to enforce — creating privacy, compliance, and data-leakage challenges.","multi":false},{"id":"ovmqnr","q":"Which mobile deployment model is described as the 'company car' model, where the organization buys the device but the employee picks it from an approved list?","a":"CYOD","why":"CYOD (Choose Your Own Device) is the company-car model: the organization pays for and owns the device, but the employee selects it from a pre-approved list. This balances organizational control with employee satisfaction — the company keeps security and MDM control, the employee gets a device they like.","multi":false},{"id":"qfepzj","q":"In COPE, what creates tension between the organization and employees?","a":"The organization owns the device and can monitor everything, raising privacy concerns for personal use","why":"COPE (Corporate Owned, Personally Enabled) lets employees use organization-owned devices for limited personal use. The tension: because the company owns the device, it can legally monitor everything — calls, location, apps — which employees may find invasive when they also use it personally.","multi":false},{"id":"1jjfxno","q":"What is a key financial characteristic of COPE compared to BYOD?","a":"COPE has higher upfront costs because the organization buys the devices","why":"With COPE the organization purchases the devices upfront, so initial costs are high compared to BYOD where employees supply their own hardware. Organizations choose COPE anyway to gain full control and standardized security.","multi":false},{"id":"jzsws2","q":"Which three factors should be considered when selecting a mobile deployment model?","a":"Cost, security, and user satisfaction","why":"The course's three decision factors for mobile deployment models are: cost (who pays for the devices), security (how much control does the organization get), and user satisfaction (will employees accept and use the model). Every model trades these off differently.","multi":false},{"id":"1n56t9t","q":"Which deployment model gives the organization the strongest security and MDM control?","a":"COPE","why":"COPE gives the organization full ownership and therefore the strongest control: complete MDM enforcement, monitoring, and remote management without privacy ambiguity. CYOD is a close second (organization-owned, but the approved-list approach is slightly less rigid). BYOD offers the least control.","multi":false},{"id":"1b1srio","q":"What two key activities happen when an asset is assigned to the organization?","a":"Assignment to a person/department and classification by value","why":"When an asset enters the organization it is assigned (given to a specific person or department, establishing accountability) and classified (typically by monetary value, which drives how much protection it receives). These two steps turn an anonymous purchase into a managed asset.","multi":false},{"id":"1qplp06","q":"What is the difference between asset monitoring and asset tracking?","a":"Monitoring means keeping an inventory of what you own; tracking means knowing the physical location of a device in real time","why":"Monitoring answers 'what do we own and what state is it in' — it is the ongoing inventory and status check. Tracking answers 'where is it right now' — GPS-level, real-time location. A company monitors its laptop inventory (present, patched, encrypted) and may track a high-value shipment in transit.","multi":false},{"id":"1x1xj3v","q":"What is asset enumeration?","a":"Using scanning techniques to count and identify devices connected to the network","why":"Enumeration is actively scanning the network to count and identify connected devices — discovering what is actually out there. It is a critical verification step because it finds assets that procurement and inventory records missed (shadow IT, forgotten devices, personal devices on the network).","multi":false},{"id":"13j9o8h","q":"How does MDM (Mobile Device Management) help with lost or stolen devices?","a":"It provides remote lock and remote wipe capabilities","why":"MDM enables remote lock (preventing access) and remote wipe (erasing corporate data) on lost or stolen devices. MDM can also push mass configuration and policy updates to entire fleets at once — which is why MDM is mandatory for managing mobile deployments.","multi":false},{"id":"foffw9","q":"Which capability lets an administrator push a security policy or application to thousands of mobile devices simultaneously?","a":"Mass push via MDM","why":"MDM's mass-push capability sends apps, configurations, and security policies to an entire device fleet at once. Without it, administrators would touch every device individually — impractical at scale and a common exam point about why MDM is essential.","multi":false},{"id":"zz7bo7","q":"Why does asset classification by value matter for security?","a":"It drives how much protection, monitoring, and control the asset receives","why":"Classification by monetary (or business) value lets the organization apply proportional controls: a $50,000 server gets encryption, tracking, monitoring, and careful change control, while a $5 mouse gets almost nothing. Value-based classification is how security budgets get allocated rationally.","multi":false},{"id":"xfqjcg","q":"Which NIST publication covers media sanitization and disposal?","a":"NIST SP 800-88","why":"NIST SP 800-88 ('Guidelines for Media Sanitization') is the standard for securely erasing and disposing of storage media. 800-53 is security controls, 800-63 is digital identity, and 800-115 is technical assessment — exam favorites as distractors.","multi":false},{"id":"1ayuy23","q":"How many overwrite passes does the course recommend for different data classifications?","a":"1 pass for public, 7 passes for sensitive, 35 passes for secret or top-secret data","why":"The course's guideline: 1 overwrite pass for public data, 7 passes for sensitive data, and 35 passes for secret or top-secret data. More passes make recovery progressively harder — modern drives usually need fewer passes than legacy guidelines suggest, but the exam teaches these numbers.","multi":false},{"id":"9agtem","q":"What is degaussing?","a":"Using a powerful magnetic field to erase data from magnetic media","why":"Degaussing uses a strong magnetic field to scramble the magnetic domains on hard drives and tapes, destroying the data. The catch the exam loves: degaussing permanently destroys the drive's storage capability — the media becomes unusable afterward, so it cannot be resold.","multi":false},{"id":"1l4sq8g","q":"Why is the 'Secure Erase' command considered flawed?","a":"Implementations are inconsistent and it does not work reliably on all drives","why":"Secure Erase is a firmware command meant to wipe a drive, but its implementations vary by manufacturer and it has proven unreliable — some drives report success while data remains. Because of this inconsistency, the course treats it as flawed and points to cryptographic erase as the better software method.","multi":false},{"id":"ian8w8","q":"What is cryptographic erase and why is it preferred for drives being resold?","a":"Encrypting the drive and then destroying the encryption keys — fast (30–60 seconds) and leaves the drive reusable","why":"If the drive was always encrypted, cryptographic erase simply destroys the encryption keys. All data becomes unreadable in about 30–60 seconds, and the drive remains fully functional — making it safe to resell. This is the fastest sanitization method that preserves the hardware's value.","multi":false},{"id":"8b0dc3","q":"Which disposal methods does the course list for secret and top-secret data?","a":"Shredding, pulverizing, melting, or incinerating","why":"For the highest classification levels, physical destruction is required: shredding, pulverizing, melting, or incinerating the media. No software method provides sufficient assurance for top-secret data because forensic recovery techniques keep improving.","multi":false},{"id":"1nrgr9l","q":"What does a certificate of destruction provide?","a":"Audit-log proof that a specific asset was properly sanitized or destroyed","why":"A certificate of destruction is documentary proof — part of the audit log — that a given asset was properly sanitized or destroyed, and often by whom and when. Auditors ask for these; without them you cannot prove disposal compliance, and skipped certification is a classic exam scenario.","multi":false},{"id":"1nmbxl9","q":"What is the correct order of the data lifecycle as taught in the course?","a":"Creation, processing, archiving, destruction","why":"The data lifecycle: (1) creation — data is generated or collected; (2) processing — it is used, transformed, and moved; (3) archiving — it is stored long-term, often for compliance; (4) destruction — it is securely disposed of at end of life. Each stage has different security requirements.","multi":false},{"id":"1v74i9n","q":"Why does the course warn that 'the more you store, the more you must secure'?","a":"Retained data accumulates and must be protected throughout its lifecycle — especially in archives","why":"Every byte you retain must be protected through creation, processing, archiving, and destruction. Organizations that hoard data accumulate an ever-growing security burden — archives in particular are often forgotten but remain fully subject to breaches and compliance requirements.","multi":false},{"id":"136b1lb","q":"What is the purpose of a Change Advisory Board (CAB)?","a":"To review proposed changes and perform due diligence before approval","why":"The CAB is the group that reviews proposed changes, performs due diligence (impact analysis, risk assessment), and decides whether a change is approved. It exists so no significant change happens without informed review by people who understand the technical and business consequences.","multi":false},{"id":"15s3kbk","q":"Who is the change owner?","a":"The person who initiates the change and advocates for it, taking responsibility for its success","why":"The change owner is the initiator and advocate — the person who proposes the change, argues for its value, and takes responsibility for seeing it through successfully. This is distinct from stakeholders (who are affected) and from implementers (who execute).","multi":false},{"id":"1etprgx","q":"Who are stakeholders in a change?","a":"Anyone with a vested interest in the change — technical teams, business units, and end users","why":"Stakeholders are anyone with a vested interest in the change: technical teams affected by implementation, business units that depend on the system, and end users who will experience the result. Each group may need to be consulted or informed depending on the change's impact.","multi":false},{"id":"97yeqd","q":"What is the difference between consulting and informing stakeholders?","a":"Consulting gathers input before the change; informing simply notifies them the change is happening","why":"Consulting means actively gathering stakeholder input before deciding or proceeding — used when stakeholders are significantly affected. Informing is one-way notification that a change is coming — used for low-impact changes. Choosing correctly is part of stakeholder analysis.","multi":false},{"id":"128473d","q":"What is the purpose of an impact analysis?","a":"To determine what effects a change will have on systems, users, and the business before it is approved","why":"Impact analysis predicts the consequences of a change: which systems interconnect, who is affected, what could break, and what downtime might result. It gives the CAB the information needed to approve, reject, or conditionally approve a change.","multi":false},{"id":"1djs9sm","q":"Which step of the change process does the CAB's due diligence belong to?","a":"The prepare/request stage, before any implementation","why":"CAB review and due diligence happen during preparation — before the change is approved and long before implementation. A change that skips CAB approval is an unauthorized change, one of the most dangerous events in an IT environment because its effects are unplanned and unmonitored.","multi":false},{"id":"12lyl1x","q":"What are the five steps of the change management process in order?","a":"Prepare, vision, implement, verify, document","why":"The five steps: (1) prepare — submit the request, justify it, run impact analysis; (2) vision — define what success looks like and how the change aligns with goals; (3) implement — execute the change; (4) verify — confirm it worked as intended; (5) document — record everything for the knowledge base.","multi":false},{"id":"1t2on2o","q":"What is a maintenance window?","a":"A scheduled period of reduced usage (e.g., Saturday midnight–4 a.m.) when changes are implemented to minimize disruption","why":"A maintenance window is a pre-agreed low-usage period — the course's example is Saturday from midnight to 4 a.m. — when changes and updates are implemented. Low usage means low business impact if something goes wrong, and users expect the disruption.","multi":false},{"id":"1qajvgt","q":"When are emergency changes appropriate?","a":"For critical security patches or fixes where waiting for the normal CAB cycle would leave the organization exposed","why":"Emergency changes bypass the normal approval timeline when the risk of waiting exceeds the risk of acting — typically for critical security patches on actively exploited vulnerabilities. They should still be documented and reviewed retroactively; they are not a license to skip process.","multi":false},{"id":"xkikh5","q":"What is a backout plan?","a":"A documented procedure for reverting a change if it fails or causes problems","why":"A backout plan is the pre-documented escape route: if the change fails, how do we restore the previous working state? Every change should have one before implementation. A change without a backout plan that fails can turn a minor update into a major outage.","multi":false},{"id":"1hmm16c","q":"Why are test results documented as part of the change process?","a":"To provide evidence the change works as intended and to support verification and future troubleshooting","why":"Documented test results prove the change does what it should — feeding the verification step — and become part of the knowledge base. When something breaks months later, prior test documentation is invaluable for diagnosing whether a past change is the cause.","multi":false},{"id":"1foju29","q":"What are SOPs (Standard Operating Procedures) in the context of change management?","a":"Documents describing the step-by-step processes for implementing changes consistently","why":"SOPs are the written, step-by-step procedures that ensure changes are implemented consistently every time, by anyone on the team. They reduce human error, support the implement step of the change process, and make outcomes predictable.","multi":false},{"id":"1fjdc41","q":"When upgrading a system, why must allow lists and deny lists (and firewall rules) be reviewed?","a":"Because the change may alter traffic patterns or requirements, making existing allow/deny rules wrong or blocking legitimate traffic","why":"Changes can shift what traffic is legitimate: a new port opened by an upgrade, an application moved to a new server, or an IP range changed. If allow/deny lists and firewall rules are not reviewed as part of the change, the upgrade can silently break services or open holes.","multi":false},{"id":"ck2ihk","q":"What are restricted activities in change management?","a":"Operations that must not be performed during certain times or on certain systems — e.g., rebooting a domain controller during business hours","why":"Restricted activities are operations constrained by time, system, or permission — the classic example being rebooting a domain controller during business hours, which would disrupt authentication for the whole organization. Change planning must respect these restrictions.","multi":false},{"id":"58k8j8","q":"Why is restarting domain controllers during business hours risky beyond simple downtime?","a":"Data in transit and queued/backlogged tasks can be lost, and authentication across the organization is interrupted","why":"A domain controller restart loses data in transit and any backlogged tasks waiting to process, on top of interrupting authentication for the entire domain. This is why restarts are restricted activities scheduled in maintenance windows — a favorite exam scenario.","multi":false},{"id":"1tdlc86","q":"Why do legacy applications require special care during changes?","a":"They are fragile — often built on outdated frameworks and can break when underlying systems change","why":"Legacy applications are often built on outdated frameworks with hard-coded assumptions about their environment. An OS patch, a database upgrade, or a network change can break them in unexpected ways. Dependencies must be mapped and changes tested carefully around legacy systems.","multi":false},{"id":"jrxup","q":"What is dependencies mapping and why does it matter before a change?","a":"Identifying which systems, applications, and services depend on the system being changed — so the full blast radius is understood","why":"Dependencies mapping identifies everything that relies on the system being changed. Changing a database may affect five applications nobody realized used it. Without dependency mapping, impact analysis is guesswork — and the exam loves the 'we changed X and unrelated Y broke' scenario.","multi":false},{"id":"p8dgss","q":"Which technical implication of change does the scenario describe: a firewall upgrade blocks the port a legacy payroll app has used for 15 years?","a":"Failure to review allow/deny lists and firewall rules as part of the change","why":"This is the allow/deny list and firewall rules implication: the change altered filtering behavior without reviewing the rules against existing application requirements. The fix is to include rule reviews in every change that touches network enforcement points.","multi":false},{"id":"thpcnm","q":"What is version control's key benefit in change documentation?","a":"It lets you track document revisions and revert to a stable prior version if needed","why":"Version control tracks every revision of documentation and configurations, so if a change produces undesired results you can revert to the last stable version. It also creates an audit trail of what changed, when, and by whom — essential for troubleshooting and compliance.","multi":false},{"id":"2lh8vi","q":"Why should network and system diagrams be updated after changes?","a":"Because outdated diagrams mislead troubleshooting, planning, and future impact analyses","why":"Diagrams that do not reflect reality are worse than no diagrams — engineers troubleshooting an outage or planning the next change will trust an inaccurate map and waste time or make wrong decisions. Updating diagrams is a mandatory part of the documentation step.","multi":false},{"id":"18c8gyu","q":"When a change produces undesired results, what documentation action does the course recommend?","a":"Revise the relevant policies and procedures so the same mistake is not repeated","why":"Undesired results are learning opportunities: the policies and procedures that allowed the bad change should be revised. This closes the feedback loop of change management — the process improves with every documented outcome, good or bad.","multi":false},{"id":"sn78is","q":"Why should changes be documented in ticketing systems?","a":"Tickets create a timeline and history that support troubleshooting, auditing, and knowledge transfer","why":"A ticket records who requested the change, why, what was done, when, and what happened — a searchable timeline. When an incident occurs six months later, the ticket history often reveals the cause immediately. It is the operational memory of the change process.","multi":false},{"id":"1sm6n18","q":"Which change documentation practice specifically prevents repeating a failed change?","a":"Documenting test results and lessons learned so future teams can see what failed and why","why":"Recording test results, failures, and lessons learned builds an organizational knowledge base. Without it, every team repeats the same failed experiments. The documentation step exists precisely so that the organization's knowledge compounds instead of resetting.","multi":false},{"id":"of70rc","q":"An organization allows BYOD phones to access corporate email. The security team struggles to enforce encryption and screen-lock policies because employees resist installing management software on their personal property. What is the root cause of this difficulty?","a":"The organization does not own the device, so enforcing MDM controls raises ownership and privacy objections","why":"BYOD's fundamental tension: the employee owns the hardware. The organization needs MDM to protect corporate data, but employees can refuse management of their own property, and heavy-handed control creates privacy backlash. Ownership — not technology — is the root cause; COPE/CYOD solve it by making the company the owner.","multi":false},{"id":"c4z2eg","q":"An accounts-payable clerk says, 'The purchase order is done, so the vendor has been paid.' What is wrong with this statement?","a":"A purchase order authorizes the purchase — it is not a payment; payment follows later per terms like net 30","why":"A PO is a pre-purchase authorization specifying what will be bought, in what quantity, at what price. Payment is a separate later step, typically after invoicing on net-15/30/60 terms. Treating a PO as payment is a classic procurement misunderstanding the exam tests.","multi":false},{"id":"mjlzdm","q":"Under a COPE deployment, an employee uses their work tablet for occasional personal browsing. The employer logs all web traffic on the device. The employee objects, but HR sides with the employer. Why?","a":"Because the organization owns the device and retains the right to monitor its own property, even when personal use is permitted","why":"In COPE the organization owns the device. Ownership carries the legal right to monitor it fully — even though 'personally enabled' use is allowed, that permission does not create a privacy zone on company property. This ownership-based monitoring right is exactly why COPE creates privacy tension that BYOD (employee-owned) does not.","multi":false},{"id":"1byj5h1","q":"A logistics company scans its network monthly, producing a count of connected devices compared against its inventory. A separate system provides live GPS positions of its delivery handhelds. Which statement is correct?","a":"The monthly scan is monitoring (inventory vs. records); the GPS system is tracking (real-time location)","why":"Monitoring = keeping an inventory and checking the state of what you own (the monthly enumeration vs. records). Tracking = knowing where something is in real time (GPS positions). Monitoring asks 'what do we have and is it OK'; tracking asks 'where is it right now.'","multi":false},{"id":"648m6q","q":"After a merger, a scan finds dozens of unauthorized devices on the new subsidiary's network — personal laptops, unregistered VMs, and old test boxes. Which asset management activity should have revealed these earlier, and at what cadence?","a":"Ongoing asset monitoring with periodic enumeration scans comparing discovered devices against the authorized inventory","why":"Continuous monitoring plus regular enumeration scanning compares what is actually on the network against the authorized inventory, surfacing unknown devices quickly. Relying on procurement records only catches formally purchased assets — never shadow IT — and annual checks leave up to a year of exposure.","multi":false},{"id":"1gotltg","q":"A records manager argues against deleting archived customer data that is seven years old and past its retention requirement. The CISO responds, 'The more you store, the more you must secure.' What is the CISO's point?","a":"Retained data remains in the lifecycle and must be protected at every stage — pointless retention is pointless risk","why":"Every stored byte stays inside the security perimeter and must be protected through archiving until destruction. Data kept beyond its retention requirement adds breach exposure and compliance scope with zero business value — secure disposal at end-of-life is part of the lifecycle, not an afterthought.","multi":false},{"id":"9ybz8r","q":"During CAB review, a proposed firewall replacement is sent back to the requester with a list of questions about which services will be affected. What is the board performing?","a":"Due diligence as part of impact analysis","why":"The CAB's questions about affected services are due diligence — the review-side work of an impact analysis, determining the change's blast radius before approval. A backout plan is the revert procedure; version control is documentation tooling; emergency change is a different approval path.","multi":false},{"id":"5ipp60","q":"A zero-day vulnerability is being actively exploited against the company's VPN appliance. The patch must deploy today, long before the next CAB meeting. How should this be handled within change management?","a":"Declare an emergency change: implement the critical patch now, with documentation and retroactive review afterward","why":"Emergency changes exist for exactly this case: a critical fix where waiting for the normal cycle is more dangerous than acting. The proper handling is an emergency change — expedited approval, implementation, and retroactive documentation/review. Silently patching without records is an unauthorized change, not an emergency one.","multi":false},{"id":"rdyj9b","q":"A new network administrator configures a switch by memory, differently from the last three deployments, and causes an outage. Which change documentation artifact would have prevented the inconsistency?","a":"Standard Operating Procedures (SOPs) describing the step-by-step configuration process","why":"SOPs are the step-by-step written procedures that make implementations consistent regardless of who performs them. With a switch-configuration SOP, the new admin would have followed the same documented steps as everyone else — preventing the 'works on my memory' outage.","multi":false},{"id":"n6e7sv","q":"An OS upgrade is planned for an application server. Before approving, the change owner asks the team to list every firewall rule and allow/deny entry involving that server. Which technical implication is being addressed?","a":"The need to review allow lists and deny lists when systems change","why":"Changes to a system can invalidate existing allow/deny entries — the upgrade may use new ports, services, or addresses. Reviewing the lists pre-change ensures legitimate traffic stays permitted and nothing unnecessary is exposed. This is one of the course's four named technical implications.","multi":false},{"id":"tvoy0q","q":"A completed change ticket reads: 'Change applied at 01:00, verified at 01:40, backout not needed, diagrams updated, stakeholders informed.' What is the primary purpose of keeping this ticket?","a":"To create a timeline and history supporting future troubleshooting, audits, and knowledge transfer","why":"Change tickets are the operational memory of the environment: a searchable record of what changed, when, by whom, with what verification. When an incident occurs months later, ticket history often reveals the cause in minutes instead of days — and auditors use them to prove changes were controlled.","multi":false},{"id":"1gfhpry","q":"Which sequence correctly orders the stages of the data lifecycle?","a":"Creation → processing → archiving → destruction","why":"Data is first created (generated/collected), then processed (used and transformed), then archived (stored long-term, often for compliance), and finally destroyed at end of life. Security controls must follow data through all four stages — destruction done right (per NIST SP 800-88) is the lifecycle's final control.","multi":false},{"id":"ae1pgc","q":"Which are legitimate procurement/purchasing methods from the course? (Select THREE.)","a":"Individual purchase with reimbursement;  Company credit card;  Purchase order","why":"The three purchasing methods: individual purchase with reimbursement (employee pays, submits receipt), company credit card (minor, quick purchases with a corporate record), and purchase order (formal pre-authorization of items/quantities/prices, paid later on net terms). Degaussing is disposal; enumeration is asset discovery — both distractors from neighboring lessons.","multi":true},{"id":"2s6ym2","q":"A laptop was reported lost at an airport. Which MDM capabilities directly mitigate the risk? (Select THREE.)","a":"Remote lock to prevent anyone accessing the device;  Remote wipe to erase corporate data on it;  Mass push of the updated security policy to all remaining devices","why":"MDM responds to a lost device with remote lock (access blocked) and remote wipe (data destroyed). Mass push is the fleet-wide policy capability that hardens all other devices against similar losses. Degaussing requires physical possession of magnetic media and is a disposal method — not a remote capability — and a PO is procurement, not mitigation.","multi":true},{"id":"1mr4jkc","q":"Which statements about data sanitization are accurate? (Select FOUR.)","a":"Overwrite pass counts scale with classification: about 1 for public, 7 for sensitive, 35 for secret;  Secure Erase is unreliable because implementations vary across manufacturers;  Cryptographic erase destroys keys and suits drives being resold;  Physical destruction (shredding, pulverizing, melting, incinerating) is required for top-secret data","why":"Four course facts: classification-scaled overwrite passes (1/7/35); Secure Erase's inconsistent implementations; crypto erase preserving resale value; and physical destruction for the highest classifications. Degaussing destroys storage capability (media unusable), and the certificate of destruction is exactly the audit evidence compliance requires — not optional.","multi":true},{"id":"1sx8h3e","q":"Which items belong in the 'technical implications of changes' lesson? (Select FOUR.)","a":"Mapping dependencies to understand the full blast radius of a change;  Reviewing allow/deny lists and firewall rules after changes to filtering systems;  Losing data in transit and backlogged tasks when critical servers restart;  Treating legacy applications as fragile and testing carefully around them","why":"The four technical implications are dependencies mapping, allow/deny list reviews, restart consequences (lost in-transit data and backlogs — especially on domain controllers), and legacy application fragility. Diagram updates belong to documentation; SOPs belong to process preparation — both real activities, but not the technical-implications lesson.","multi":true},{"id":"1uv2kqs","q":"A multinational is standardizing mobile devices for 5,000 staff. Requirements: organization pays; employees select devices they like; every device must be MDM-enrollable and monitored without privacy ambiguity; light personal use allowed. Which model satisfies ALL requirements, and why do the other two fail?","a":"CYOD — organization-owned from an approved MDM-enrollable list, balancing control, satisfaction, and unambiguous monitoring rights","why":"CYOD is the only model meeting all four constraints: the organization owns the devices (pays, monitors without ambiguity, MDM-enforced), yet employees choose from an approved list (satisfaction), and ownership permits personal-use policy. BYOD fails ownership/monitoring; classic COPE fails the choice requirement; option 4 misdefines CYOD as reimbursement, which is actually individual-purchase procurement.","multi":false},{"id":"1j545hy","q":"An auditor flags two findings: (1) several ex-employee laptops were resold with 'we wiped them' verbal assurance only, and (2) the wipe method was the firmware Secure Erase command. Which recommendation addresses BOTH findings?","a":"Use cryptographic erase on the encrypted drives and obtain certificates of destruction for each unit","why":"Finding 1 is a missing evidence problem — certificates of destruction provide per-unit audit proof. Finding 2 is a method problem — Secure Erase is unreliable due to inconsistent implementations, so switch to cryptographic erase (fast, effective on always-encrypted drives, keeps them resellable). Degaussing would destroy the laptops' resale value; one pass is insufficient; verbal assurance is never evidence.","multi":false},{"id":"11884aw","q":"During a Saturday 01:00 maintenance window, a change team patches a domain controller. The change owner objects: 'Impact analysis flagged this as a restricted activity.' The team lead replies, 'It's the maintenance window — restricted activities don't apply.' Who is right?","a":"The change owner — restricted activities constrain WHAT may be done regardless of WHEN; restarting a DC risks losing data in transit and backlogs even in a window","why":"Restricted activities are limits on the operation itself, not just its timing. A DC restart loses data in transit and queued backlogs whenever it happens; the window reduces user impact but not the data-loss risk the restriction exists to prevent. The change owner is right that the restriction stands — the correct path is mitigation (draining queues, syncing replication) or choosing a different approach, not assuming the window voids the restriction.","multi":false},{"id":"1dmt42u","q":"A failed database migration is restored in 15 minutes. Post-incident review praises two pre-change artifacts: one that defined exactly how to revert, and one that let the team roll documentation and configs back to the pre-change state. Which pair?","a":"Backout plan and version control","why":"The backout plan is the documented revert procedure itself; version control enables reverting configurations and documentation to the last stable revision. Impact analysis predicts consequences (doesn't restore anything); an SOP standardizes execution; a maintenance window only schedules timing. Procurement and disposal artifacts are irrelevant here.","multi":false},{"id":"1lmh2ds","q":"An organization with no change management suffers recurring outages: engineers 'improve' systems on Friday afternoons, nobody knows what changed, and rollbacks are improvised. Which single practice establishes the gate that prevents the Friday free-for-all?","a":"Requiring CAB approval before any change is implemented","why":"The missing control is the approval gate: no change proceeds without CAB review and sign-off. This single requirement forces impact analysis, scheduling, backout planning, and documentation BEFORE changes happen. SOPs written after outages don't prevent them; monitoring detects but doesn't authorize; longer windows don't create accountability.","multi":false},{"id":"9ioza1","q":"A security questionnaire asks: 'How do you ensure devices connected to the network are authorized?' The best answer combines which two activities?","a":"Maintaining an authoritative inventory (monitoring) and running enumeration scans to discover devices that inventory missed","why":"The defense is layered: an accurate inventory (asset monitoring) says what SHOULD be there, and enumeration scanning says what IS there — the gap between them is unauthorized/shadow devices. Procurement artifacts, physical destruction, and documentation practices cannot answer what is connected to the network right now.","multi":false},{"id":"1lpl3nn","q":"A hospital's change board rejects a request to upgrade a legacy lab system during flu season. The requester protests that the patch fixes a security vulnerability. What change-management concept BEST justifies the board's decision?","a":"Restricted activities — flu season is a restricted TIME for this fragile legacy system","why":"The timing and fragility make this a restricted-activity judgment: the legacy lab system is fragile, and peak season raises the cost of any failure astronomically. The board can require the change be deferred to a safer window, implemented with enhanced safeguards, or handled via compensating controls — the concept justifying timing restrictions on critical fragile systems is restricted activities.","multi":false},{"id":"25rpq7","q":"An employee buys a $400 monitor with a personal card, submits the receipt, and gets reimbursed. Six months later the monitor — holding sensitive cached customer data from a home project — is thrown in a dumpster. Root cause?","a":"Individual purchases bypass procurement, so the asset never entered inventory, was never assigned or classified, and never received end-of-life sanitization","why":"The reimbursement path let the asset enter the organization invisibly: no procurement record, no inventory entry, no assignment, no classification, and therefore no lifecycle management — including disposal. The exam's connective tissue is exactly this: procurement method determines whether asset management ever sees the device, and unseen devices are never sanitized.","multi":false},{"id":"1tjryel","q":"Which change documentation practice most directly prevents a KNOWN-BAD change from being repeated by a different team in another region?","a":"Recording the failed change, its test results, and lessons learned in the searchable ticket/knowledge base","why":"Institutional memory prevents repeat failures: the ticket system with documented test results and lessons learned lets the other region's team find the prior failure BEFORE attempting the same change. Diagrams show state, not outcomes; CAB approval of a retry doesn't transfer knowledge; longer windows change timing, not information.","multi":false},{"id":"iuk03e","q":"A company reselling decommissioned encrypted laptops wants the FASTEST sanitization that preserves full functionality and leaves per-unit evidence for auditors. Which method and evidence satisfy both?","a":"Cryptographic erase (destroy the keys) plus a certificate of destruction per unit","why":"Cryptographic erase completes in ~30–60 seconds per drive, leaves the laptop fully functional for resale, and is effective because the drives were always encrypted. Pair it with per-unit certificates of destruction for the audit evidence. 35 passes is slow overkill; degaussing destroys functionality; Secure Erase is unreliable; photos and verbal confirmations are not evidence.","multi":false},{"id":"2ljrf","q":"A firewall vendor releases an urgent update. The change owner files it as an emergency change. The CAB chair asks for the justification. Which justification is VALID for the emergency path?","a":"The vulnerability is being actively exploited and waiting for the next CAB cycle leaves the organization exposed","why":"Valid emergency-change justification is risk-based: active exploitation means the exposure grows every day the normal cycle waits. Convenience, preference, and contract dates are scheduling pressures, not security emergencies — they go through the standard process. Misusing the emergency path erodes the CAB's trust and defeats the control.","multi":false},{"id":"1kjxnd1","q":"Which scenario demonstrates the difference between CONSULTING and INFORMING stakeholders?","a":"Telling all staff about a rebranding (informing) versus gathering the finance team's input before changing the payroll system (consulting)","why":"Consulting = actively gathering input from affected parties BEFORE the change (finance depends on payroll — their input shapes the change). Informing = one-way notification of a low-impact change (a rebrand affects everyone mildly — no input needed, just notice). Option 2 reverses them; options 3 and 4 erase the distinction the exam tests.","multi":false},{"id":"ihruxc","q":"Which factors should an organization weigh when choosing between BYOD, COPE, and CYOD? (Select FOUR.)","a":"Cost — who pays for the devices upfront;  Security — how much MDM control and monitoring the organization can enforce;  User satisfaction — will employees accept and productively use the model;  Privacy — whose device is it, and what monitoring is legally and culturally acceptable","why":"The course names cost, security, and user satisfaction explicitly; privacy is the inherent fourth dimension across all three models (employee-owned BYOD = privacy-friendly but insecure; company-owned COPE/CYOD = controllable but monitored). Display preferences and branding are not model-selection criteria.","multi":true},{"id":"1o2ptk5","q":"Which statements correctly distinguish asset MONITORING from asset TRACKING? (Select THREE.)","a":"Monitoring maintains an inventory of organizational assets and their state;  Tracking provides real-time physical location of devices;  Enumeration scans support monitoring by revealing devices the inventory missed","why":"Monitoring = the inventory and state view (patched? encrypted? present?); tracking = real-time location (GPS); enumeration feeds monitoring by finding unknown devices. Options 4 and 5 swap the definitions — GPS is a tracking tool, and patch state is monitoring data.","multi":true},{"id":"1oxhnz4","q":"Which elements are REQUIRED parts of a well-managed change, per the course's change process? (Select FOUR.)","a":"An impact analysis presented for CAB review;  A maintenance window or scheduled implementation time;  A documented backout plan in case the change fails;  Post-change documentation updating tickets, diagrams, and policies","why":"The change process demands: preparation with impact analysis and CAB due diligence; scheduled implementation (maintenance window); a pre-defined backout plan; and the documentation step (tickets for history, diagrams for accuracy, policy revision for lessons learned). Degaussing certificates belong to asset disposal and net-60 to procurement — adjacent-section distractors.","multi":true},{"id":"sv3nyi","q":"A company discovers that a departed employee's laptop was donated to a school with customer data intact. Which failures contributed? (Select THREE.)","a":"The laptop was never entered into the asset inventory when acquired;  No sanitization per NIST SP 800-88 occurred before disposal;  No certificate of destruction was obtained, so the gap was invisible until the donation surfaced","why":"The organizational failures: off-channel acquisition kept the laptop out of inventory (so no lifecycle management existed); disposal skipped NIST SP 800-88 sanitization; and the absent certificate of destruction meant no evidence and no checkpoint caught it. The school's obligations and GPS are irrelevant to the company's control failures.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
</div>
<script id="back-lib-script">
(function () {
  if (window.__backBtnInit) return; window.__backBtnInit = true;
  function lib() { return "../library.html"; }
  function resultVisible() {
    var rs = document.getElementById('result-screen');
    if (rs && !rs.classList.contains('hidden') && rs.offsetParent !== null) return true;
    var big = document.querySelector('.score-big');
    if (big) {
      var el = big;
      while (el && el !== document.body) {
        if (el.classList && el.classList.contains('hidden')) return false;
        el = el.parentElement;
      }
      return big.offsetParent !== null;
    }
    return false;
  }
  function ensure() {
    if (!resultVisible() || document.getElementById('back-lib-btn')) return;
    var a = document.createElement('a');
    a.id = 'back-lib-btn';
    a.href = lib();
    a.textContent = '\u2190 Back to Library';
    a.setAttribute('style', 'position:fixed;left:18px;bottom:18px;z-index:9999;' +
      'padding:11px 20px;border-radius:999px;font:600 14px/1 "Segoe UI",system-ui,sans-serif;' +
      'text-decoration:none;color:#fff;background:linear-gradient(135deg,#f0883e,#e36414);' +
      'box-shadow:0 4px 18px rgba(240,136,62,.45);border:1px solid rgba(255,255,255,.25);');
    document.body.appendChild(a);
  }
  setInterval(ensure, 400);
  if (document.readyState !== 'loading') ensure();
  else document.addEventListener('DOMContentLoaded', ensure);
})();
</script>
