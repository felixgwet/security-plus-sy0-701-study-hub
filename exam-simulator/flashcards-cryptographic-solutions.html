  <script>
    var DECKS = [{"label":"Section 7 · Cryptographic Solutions","cards":[{"id":"18h2iql","q":"A security engineer must encrypt several terabytes of archived database backups. The solution must be strong and fast for bulk data. Which algorithm BEST fits the requirement?","a":"AES-256","why":"For bulk encryption at rest, symmetric AES-256 is both strong (256-bit key) and roughly 100–1,000x faster than equivalently secure asymmetric algorithms. RSA, ECC, and Diffie-Hellman are asymmetric tools for key exchange, signatures, and low-power devices — far too slow for encrypting terabytes.","multi":false},{"id":"hepf6p","q":"An auditor asks why the organization rotates its TLS session keys every 12 months even though no breach is suspected. Which rationale BEST matches the course's guidance?","a":"Even strong keys become vulnerable over time due to technology advances and prolonged exposure, so regular rotation mitigates the risk of unauthorized decryption","why":"Key length is directly proportional to security, but even the strongest key can become vulnerable over time as computing advances or through prolonged exposure. Regularly changing keys (annual TLS rotation; some clouds auto-rotate every 90 days) is a best practice that mitigates unauthorized-decryption risk.","multi":false},{"id":"1rxstai","q":"A small firm uses pure symmetric encryption. Six employees must all be able to exchange encrypted messages with every other employee. How many unique shared-secret key pairs are required?","a":"15","why":"Symmetric key distribution scales as n(n−1)/2: for 6 people that's 6×5/2 = 15 unique key pairs. This exploding distribution problem is exactly why asymmetric (public key) cryptography was adopted — it's also why hybrid systems exchange a symmetric key via asymmetric encryption.","multi":false},{"id":"17lhln2","q":"During the TLS handshake, the browser encrypts a freshly generated random key with the web server's public key before any bulk data flows. What is the PRIMARY reason for this asymmetric step?","a":"It securely delivers the shared secret key, solving symmetric key distribution so the session can then switch to fast symmetric encryption","why":"This is the hybrid approach: asymmetric encryption exists to solve the key distribution problem. The browser's random symmetric key is encrypted with the server's public key (only the server's private key can read it), then both sides switch to symmetric bulk encryption (AES) for speed.","multi":false},{"id":"zlt2pl","q":"An administrator is configuring an IPsec VPN tunnel and must let the two endpoints agree on a shared secret before the encrypted tunnel operates. Which asymmetric algorithm is designed for this task?","a":"Diffie-Hellman","why":"Diffie-Hellman is the asymmetric key-exchange algorithm, widely used when establishing VPN/IPsec tunnels so both sides can derive a shared symmetric secret. Because DH is susceptible to on-path attacks, it must be paired with authentication (password or certificate). SHA-256 is a hash; Blowfish is a symmetric block cipher.","multi":false},{"id":"1kicy3o","q":"A developer is building a mobile banking app for low-power handsets and needs public key operations with minimal battery and CPU cost. Which option gives equivalent security to a 2,048-bit RSA key with the smallest footprint?","a":"A 256-bit ECC key","why":"ECC is about 6x more efficient than RSA: a 256-bit ECC key provides security comparable to a 2,048-bit RSA key, making it the standard choice for mobile and low-power devices. ECDHE adds ephemeral (per-session) keys, and ECDSA is the US government's ECC signature scheme. The small RSA and RC4 options are simply weak.","multi":false},{"id":"1hpxw9v","q":"A finance director wants to send a contract electronically and prove in court that it could ONLY have come from her. Which mechanism achieves this?","a":"Encrypting the contract's hash digest with her own private key","why":"A digital signature — the file's hash encrypted with the sender's PRIVATE key — provides non-repudiation: only she holds that private key, so only she could have produced the signature. Encrypting with the recipient's public key gives confidentiality but not proof of origin, and TLS protects transit only.","multi":false},{"id":"15d1nms","q":"A user downloads a security patch from a vendor's site. Which step verifies the file was not corrupted or tampered with in transit?","a":"Comparing the file's locally computed hash digest against the digest published by the vendor","why":"Hashing provides integrity: the vendor publishes the file's message digest, the user hashes the downloaded copy, and matching digests prove no bit changed in transit (even one character would drastically change the hash). HTTPS protects the channel; antivirus looks for malware — neither proves the file matches the original byte-for-byte.","multi":false},{"id":"1usr7vt","q":"After a password-database leak, forensics finds every stored hash was unique even though many users shared the same password. Which defense was the database almost certainly using?","a":"Salting","why":"Salting adds random data to each password before hashing, so identical passwords yield different digests. This also defeats rainbow tables (precomputed reversal tables) because attackers would need a new table per salt. Key stretching helps too, but unique hashes for identical passwords is the signature of salts.","multi":false},{"id":"1ujg6j0","q":"An authentication protocol keeps being defeated by attackers who capture a valid login and replay it minutes later. Which cryptographic control MOST directly stops this?","a":"A nonce (number used once) added to each authentication exchange","why":"A nonce — a unique, often random number used once — makes every authentication exchange produce different hash data, so a captured exchange cannot be resubmitted. This directly defeats replay attacks. The other options address confidentiality or certificate status, not replay.","multi":false},{"id":"15ca78a","q":"A company laptop is lost. The security team is confident the encrypted drive cannot be unlocked because the decryption keys were sealed inside the machine's dedicated microcontroller rather than stored in the OS. Which component provided this protection?","a":"The TPM","why":"A TPM (Trusted Platform Module) is the dedicated microcontroller that secures hardware through integrated cryptographic keys — Windows BitLocker stores its drive-encryption keys there. An HSM is an enterprise appliance; a secure enclave protects biometrics on the SoC; a KMS manages key lifecycle centrally.","multi":false},{"id":"16qkg27","q":"A payment processor must generate and store the keys that encrypt millions of card transactions, satisfying strict regulatory demands for a tamper-proof environment. Which tool is the BEST fit?","a":"An HSM","why":"An HSM (Hardware Security Module) is a physical device that safeguards and manages digital keys and performs (accelerated) cryptographic operations inside a tamper-proof environment — the standard answer for mission-critical financial transactions and regulatory compliance. Even if the retailer's systems are breached, keys inside the HSM stay protected.","multi":false},{"id":"1gh4dt5","q":"Which of the following are ASYMMETRIC algorithms? (Select FOUR.)","a":"Diffie-Hellman;  RSA;  ECC;  ECDSA","why":"The asymmetric family: Diffie-Hellman (key exchange), RSA (key exchange/encryption/signatures), ECC (mobile/low-power), and ECDSA (the US government's ECC-based Digital Signature Algorithm). AES and Blowfish are symmetric ciphers; SHA-256 is a hash — cross-category distractors the exam loves.","multi":true},{"id":"y5gyse","q":"Which statements about hashing algorithms are TRUE per the course? (Select THREE.)","a":"MD5 produces a 128-bit digest;  SHA-1 produces a 160-bit digest;  SHA-2 includes SHA-224, SHA-256, SHA-384, and SHA-512","why":"MD5 = 128-bit (collision-prone, deprecated), SHA-1 = 160-bit, and SHA-2 is a family spanning 224–512 bits. Digests are always fixed-length regardless of input, hashing is one-way (never reversible), and RIPEMD-160 is explicitly an OPEN-source algorithm created as a SHA competitor.","multi":true},{"id":"ge898w","q":"Which items are contained in a typical X.509 digital certificate? (Select THREE.)","a":"The owner's name and organization;  The owner's public key;  The issuing CA's information and digital signature","why":"A digital certificate binds a public key to an identity: it carries owner info (name, organization, public key) and CA info (issuer name, digital signature, serial number, validity dates, version). Private keys are NEVER included — during a CSR the private key stays with the requester — and no passwords or root private keys are ever distributed.","multi":true},{"id":"u74wth","q":"Which techniques does the course list as obfuscation methods? (Select THREE.)","a":"Steganography;  Tokenization;  Data masking","why":"The three obfuscation techniques: steganography (hiding data's existence inside an ordinary file), tokenization (substituting tokens whose real values live in a secure vault), and data masking (disguising data while keeping it usable, e.g., showing only the last 4 digits). Salting and key stretching harden hashes; signing provides integrity/non-repudiation — none hide data.","multi":true},{"id":"145tslx","q":"In cryptography, where does the strength of an encryption implementation actually come from?","a":"The length and secrecy of the key","why":"All modern algorithms are publicly reviewed and open by design — security through obscurity is considered unreliable. Key length is directly proportional to security (256-bit is exponentially stronger than 128-bit, not just 2x), and the secrecy of the key is what keeps data confidential.","multi":false},{"id":"apq7fc","q":"Which statement about cryptographic keys is a best practice?","a":"Use long, strong keys and rotate them regularly","why":"Use long, strong keys (128-bit minimum for most uses; 256-bit for higher protection) and rotate them regularly — e.g., TLS keys rotated annually by policy or cloud keys auto-rotated every 90 days — to mitigate the risk of unauthorized decryption over time.","multi":false},{"id":"1n2bi36","q":"Data moving across the network or between RAM and the CPU is in which state?","a":"Data in transit","why":"Data in transit is data moving around — across the network or residing in memory (RAM) moving to/from the processor. Data at rest is inactive data on storage; data in use is data actively being changed inside the processor.","multi":false},{"id":"1tgisgl","q":"In the ROT13 example, what is the 'key'?","a":"The number 13 — how many places to rotate","why":"The algorithm (rotation) is public knowledge; the key is the specific piece of information that determines the output — in ROT13, knowing to move 13 places. The same principle holds for all modern ciphers: the key, not the algorithm, provides security.","multi":false},{"id":"rgk6ed","q":"The main weakness of symmetric key encryption at scale is:","a":"Distributing the shared secret key to everyone who needs it","why":"Symmetric encryption is 100–1,000x faster than asymmetric, but everyone who communicates needs a shared secret. For n people you need n(n−1)/2 key pairs (6 people = 15 keys) — an unmanageable distribution problem at scale.","multi":false},{"id":"6higba","q":"The real-world 'hybrid' approach to encryption works by:","a":"Using asymmetric encryption to exchange a symmetric session key for bulk data","why":"Asymmetric (public key) encryption solves the key distribution problem — it's used to securely exchange a randomly generated symmetric session key. Then both parties switch to fast symmetric encryption (e.g., AES) for the bulk of the transfer. This is exactly how HTTPS/TLS works.","multi":false},{"id":"utwyfu","q":"A stream cipher differs from a block cipher because it:","a":"Encrypts data one byte/bit at a time using a keystream and XOR","why":"A stream cipher encrypts bit by bit/byte at a time using a keystream generator combined with the plaintext via XOR — well suited to real-time audio/video streams. A block cipher processes fixed-size blocks and pads the final partial block; block ciphers are easier to implement in software and less susceptible to security problems.","multi":false},{"id":"1iu8sjo","q":"Which symmetric algorithm is the current de facto standard, chosen by NIST to replace DES and 3DES?","a":"AES (Rijndael)","why":"AES — the Advanced Encryption Standard, also known as the Rijndael cipher — won the NIST contest to replace DES/3DES. It uses 128, 192, or 256-bit keys, is the US government standard for sensitive-but-unclassified data, and is the strongest and most widely used symmetric algorithm.","multi":false},{"id":"9tobng","q":"DES uses a 64-bit key, but its effective key length is only:","a":"56 bits (8 bits are used for parity)","why":"DES's 64-bit key includes 8 parity bits, leaving 56 effective bits — far too weak against modern computing. DES breaks data into 64-bit blocks and runs 16 rounds of transposition and substitution.","multi":false},{"id":"150owka","q":"3DES strengthens DES by:","a":"Applying DES three times with three different keys (encrypt–decrypt–encrypt), effectively 112-bit","why":"3DES runs DES three times with three 56-bit keys — encrypt with key 1, decrypt with key 2 (which just scrambles further), encrypt with key 3 — creating an effective 112-bit key. It was a stopgap and is now deprecated in favor of AES.","multi":false},{"id":"1fkj8io","q":"Which of these symmetric algorithms is a STREAM cipher?","a":"RC4","why":"RC4 is the only stream cipher in this group — variable key size from 40 to 2,048 bits, used historically in SSL and WEP. All the others (DES, 3DES, IDEA, AES, Blowfish, Twofish, RC5, RC6) are block ciphers.","multi":false},{"id":"127tuyc","q":"To send a confidential message to Mary using asymmetric encryption, you encrypt it with:","a":"Mary's public key","why":"Encrypt with the RECEIVER's public key — only Mary's private key can decrypt it, so only she can read it. Even you, the sender, can't decrypt it back. (Encrypting with your own private key provides non-repudiation, not confidentiality — anyone can read it.)","multi":false},{"id":"15fy6dd","q":"Diffie-Hellman is primarily used for:","a":"Securely exchanging symmetric keys, such as when establishing VPN/IPsec tunnels","why":"Diffie-Hellman is an asymmetric algorithm built for key exchange — it lets two parties establish a shared secret over an insecure channel, e.g., before an IPsec VPN tunnel switches to symmetric encryption. It is susceptible to on-path (person-in-the-middle) attacks, so pair it with authentication (password or certificate).","multi":false},{"id":"1cd4uld","q":"RSA's security relies on the difficulty of:","a":"Factoring the product of two large prime numbers","why":"RSA (Rivest–Shamir–Adleman) relies on how hard it is to factor a large number back into its two prime factors. It supports 1,024–4,096-bit keys and is used for key exchange, encryption, and digital signatures — including the rotating 6-digit codes on MFA hardware tokens.","multi":false},{"id":"9oj4ai","q":"Why is ECC (Elliptic Curve Cryptography) favored on mobile devices?","a":"It delivers equivalent security to RSA with much smaller keys, needing less processing power","why":"ECC is about 6x more efficient than RSA: a 256-bit ECC key provides security comparable to a 2,048-bit RSA key. That means less processing and battery drain — ideal for phones, tablets, and other low-power devices. Variants include ECDH, ECDHE (ephemeral — a new key per session), and ECDSA (US government digital signatures).","multi":false},{"id":"1dff6aw","q":"Encrypting a hash digest with the sender's PRIVATE key produces:","a":"A digital signature providing integrity and non-repudiation","why":"A digital signature is created by hashing the message and encrypting that digest with the sender's private key. Anyone can decrypt it with the sender's public key to verify the hash matches — proving the message wasn't altered (integrity) and that only the sender could have signed it (non-repudiation).","multi":false},{"id":"6mf8ed","q":"Which statement about hashing is TRUE?","a":"It produces a fixed-length digest regardless of input size, and cannot be reversed","why":"Hashing is a one-way function: any input (one word or one million words) produces a fixed-length message digest — a digital fingerprint. There is no way to recover the original message from the digest, which is why hashing provides integrity, not confidentiality.","multi":false},{"id":"9mrhp4","q":"MD5 produces a hash of what size?","a":"128 bits","why":"MD5 creates a 128-bit hash value. Because only 128 bits of output exist, the number of unique values is limited and collisions are feasible — MD5 is no longer suitable for security certificates or signatures. SHA-1 is 160-bit; SHA-256 is 256-bit.","multi":false},{"id":"1n7a04a","q":"Code signing works by:","a":"Hashing the file and encrypting the digest with the developer's private key","why":"Code signing is a digital signature on software: the installer is hashed, and the hash is encrypted with the developer's private key (issued by Apple/Google after registration). App stores and users verify it to confirm the file hasn't been modified or corrupted since publication.","multi":false},{"id":"117lplr","q":"A pass-the-hash attack works by:","a":"Stealing a password's hash and reusing it directly to authenticate — without cracking it","why":"In a pass-the-hash attack the attacker steals the stored hash (via tools like Mimikatz) and simply replays it to authenticate — the hash is functionally equivalent to the password, so there's no need to reverse it. Defenses: patching, proper domain trusts, MFA, and least privilege.","multi":false},{"id":"g5ukhz","q":"The birthday attack gets its name from:","a":"The birthday paradox — the probability that two inputs share the same hash (a collision)","why":"The birthday paradox says that in a room of just 23 people there's a >50% chance two share a birthday (99% at 57). Applied to hashing, it means an attacker needs far fewer attempts than brute force to find two different messages with the same digest. Longer digests (SHA-256 over MD5) reduce this risk.","multi":false},{"id":"14xkvhn","q":"Adding random data to a password before hashing it is called:","a":"Salting","why":"Salting adds random data (the salt) to the password before the one-way hash, so identical passwords produce different hashes. This thwarts dictionary attacks, brute force attacks, and rainbow tables — the attacker would need to rebuild a rainbow table for every possible salt.","multi":false},{"id":"lqkks","q":"A nonce defends primarily against:","a":"Replay attacks","why":"A nonce ('number used once') is a unique, often random value added to the authentication process so that captured authentication data produces a different hash each time — stolen credentials can't be resubmitted. This directly defeats replay attacks.","multi":false},{"id":"7eq6h1","q":"The key difference between PKI and public key cryptography is:","a":"PKI is the entire system that creates and manages key pairs and certificates; public key cryptography is just the encrypt/decrypt process within it","why":"PKI is the full framework — hardware, software, policies, procedures, and people — built on asymmetric encryption to create, distribute, and manage key pairs and certificates. Public key cryptography is only the encryption/decryption piece inside that larger architecture.","multi":false},{"id":"1ria3m7","q":"Key escrow means:","a":"Storing cryptographic keys with a secure third party so they can be recovered if lost","why":"Key escrow stores keys with a trusted third party so encrypted data remains accessible if a key is lost (departing employee, lost private key) or for legal investigations. It is controversial: whoever holds the escrowed keys could decrypt vast amounts of data, so escrow access must be tightly regulated.","multi":false},{"id":"ojvlb8","q":"A digital certificate is best described as:","a":"A digitally signed electronic document that binds a public key to an identity","why":"A digital certificate (commonly X.509) binds a public key to a user, server, or device identity. It contains the owner's info (name, organization, public key) plus CA information. The identity can be a person, server, workstation, or other device.","multi":false},{"id":"16702kb","q":"Your company runs www.example.com, shop.example.com, and mail.example.com. The simplest way to cover all of them with one certificate is:","a":"A wildcard certificate for *.example.com","why":"A wildcard certificate lets all subdomains of the same root domain use one public key certificate — cheaper and easier to manage. The tradeoff: if the server is compromised and the certificate is revoked, ALL subdomains are affected until reissued.","multi":false},{"id":"qvtp44","q":"You need ONE certificate to cover two DIFFERENT root domains (example.com and example.net). You should use:","a":"The SAN (Subject Alternate Name) field","why":"Wildcard certificates only cover subdomains of a single root domain. For multiple distinct domains, you modify the SAN field in the certificate so one certificate supports both domains. Exam trap: same root domain → wildcard; different domains → SAN.","multi":false},{"id":"1154fft","q":"A self-signed certificate is appropriate when:","a":"Testing environments, closed systems, or non-production systems where trust is already established","why":"Self-signed certificates are signed by the entity itself rather than a trusted CA. They provide encryption but no third-party verification of identity, so browsers warn about them. They fit testing/dev/internal closed systems — not publicly-facing sites, where third-party CA certificates are preferred.","multi":false},{"id":"1rxz8o3","q":"During a Certificate Signing Request (CSR), what NEVER leaves the requester?","a":"The private key","why":"The CSR contains the entity's information (org name, domain, locality, country) and its PUBLIC key. The private key stays securely with the requester — sending it to the CA would destroy the confidentiality of the key pair.","multi":false},{"id":"14ydlht","q":"OCSP improves on the CRL approach by:","a":"Checking the revocation status of a single certificate by serial number — faster, but unencrypted","why":"The CRL is the CA's full list of every certificate ever revoked — slow to download and search. OCSP queries the status of one certificate by serial number, quickly and efficiently. The tradeoff: OCSP traffic is not encrypted, making it less secure.","multi":false},{"id":"gnfh1t","q":"If a root Certificate Authority is compromised, what happens?","a":"Every certificate ever issued by that CA must be revoked and reissued","why":"Everything in digital certificates comes down to the chain of trust. If the root CA is compromised, every certificate it ever issued is now considered compromised and must be revoked and reissued. This is especially critical for organizations running their own internal CA.","multi":false},{"id":"1tknce2","q":"Public key pinning defends against:","a":"Server impersonation and fraudulent certificates","why":"Public key pinning lets an HTTPS website present a set of trusted public keys in its HTTP header. If the browser doesn't receive a matching public key from the CA, it knows the site is being impersonated and alerts the user — resisting fraudulent certificates.","multi":false},{"id":"mlv5ct","q":"What makes a blockchain tamper-evident?","a":"Each block contains the hash of the previous block, plus a timestamp and its own transactions","why":"Each block stores the previous block's hash, a timestamp, and hashed transaction data (rolled up into a root hash). Alter any earlier block and every subsequent hash breaks, exposing the tampering. The ledger is shared and immutable across a decentralized peer-to-peer network.","multi":false},{"id":"jqvt41","q":"A smart contract is:","a":"Self-executing code whose terms are written into the code and run automatically when conditions are met","why":"Smart (digital) contracts are self-executing: the agreement's terms are written directly into code, and actions execute automatically when conditions are met — e.g., funds release to a seller when the buyer confirms receipt. Once deployed on the blockchain they cannot be altered, making them tamper-proof (popularized by Ethereum).","multi":false},{"id":"1o2fpxw","q":"A TPM (Trusted Platform Module) is:","a":"A dedicated microcontroller that secures hardware through integrated cryptographic keys — used by BitLocker","why":"A TPM is a dedicated microcontroller on the device that provides hardware-level security so digital secrets stay confidential and unaltered — like a personal vault. Windows BitLocker uses the TPM to secure its drive-encryption keys, adding protection against software-based attacks.","multi":false},{"id":"16b7zml","q":"An HSM (Hardware Security Module) differs from a TPM in that it is:","a":"A physical appliance that safeguards and manages keys in a tamper-proof environment, often for mission-critical financial transactions and compliance","why":"If a TPM is a personal vault, an HSM is a high-security bank vault: a physical device that generates, stores, and manages digital keys and performs accelerated cryptographic operations inside a tamper-proof environment. Organizations use HSMs to meet regulatory compliance for sensitive data like payment transactions.","multi":false},{"id":"5mwn6t","q":"The secure enclave in a smartphone protects biometric data by:","a":"Isolating a co-processor from the main CPU so the data is shielded even if the device is compromised","why":"A secure enclave is a co-processor integrated into the main processor but isolated from it — a fortress inside the device. Face ID/Touch ID and payment data are processed and stored there and never leave; even a fully compromised main processor cannot access the enclave's contents.","multi":false},{"id":"oroy8i","q":"Steganography differs from encryption because it:","a":"Hides the very existence of a message inside an ordinary file rather than making it unreadable","why":"Steganography ('covered writing') hides secret data within an ordinary non-secret file — a message inside a cat photo looks like just a cat photo. The goal isn't to prevent reading, but to prevent suspicion that hidden data exists. It is not true encryption and is often combined with encryption for extra layers.","multi":false},{"id":"1jg52rx","q":"A payment system stores a random string instead of your actual credit card number, mapping back to the real number only in a secured vault. This is:","a":"Tokenization","why":"Tokenization substitutes sensitive data elements with nonsensitive equivalents called tokens that have no exploitable meaning. The real data stays in a separate secure vault, so a breach exposes only useless tokens. This reduces PCI DSS compliance scope and is standard in payment systems.","multi":false},{"id":"1oidkxp","q":"A support agent can only see the last four digits of your credit card. This is an example of:","a":"Data masking (data obfuscation)","why":"Data masking disguises original data to protect sensitive information while keeping it recognizable and usable for a specific purpose — e.g., masking the first 12 digits of a card so staff can identify a payment with just the last 4, or masking the first five digits of an SSN. Test databases with fictional-but-realistic data work the same way.","multi":false},{"id":"cnj6yt","q":"A downgrade (version rollback) attack works by:","a":"Forcing a system to use a weaker or older protocol version than it supports, exploiting known flaws in the old version","why":"During the protocol handshake, the attacker manipulates version negotiation so both ends 'agree' on an older, insecure protocol they still support for backward compatibility. POODLE (Padding Oracle On Downgraded Legacy Encryption) famously forced connections back to SSL 3.0. Defenses: drop legacy protocols, use version-intolerance checks.","multi":false},{"id":"12ixapm","q":"A collision attack against hashing aims to:","a":"Find two different inputs that produce the same hash output","why":"A collision attack finds two different inputs with the same hash output. Researchers produced two different sequences hashing to the same MD5 digest, rendering MD5 unsuitable for certificates and signatures. The birthday paradox explains why collisions are found far sooner than brute force would suggest.","multi":false},{"id":"5deecd","q":"Quantum computing threatens current cryptography primarily because it can:","a":"Quickly factor large prime numbers and solve discrete logarithms — breaking asymmetric algorithms like RSA and ECC","why":"Asymmetric algorithms (RSA, ECC, DH) rely on hard math problems — factoring large primes — that quantum computers can solve rapidly. Symmetric crypto fares better: moving from AES-128 to AES-256 squares the brute-force work. Post-quantum candidates (NIST 2022): CRYSTALS-Kyber for encryption; CRYSTALS-Dilithium, FALCON, SPHINCS+ for signatures.","multi":false},{"id":"10qj242","q":"Bob receives an asymmetrically encrypted confidential message from Alice. Which key does Bob use to read it?","a":"Bob's own private key","why":"Alice encrypted the message with Bob's public key, so ONLY Bob's private key can decrypt it. This one-way property is the whole point: confidentiality is assured because no one else possesses Bob's private key.","multi":false},{"id":"wnobql","q":"A vendor needs to encrypt a live, real-time audio feed with minimal latency, encrypting data continuously as it flows. Which cipher type is the BEST fit?","a":"Stream cipher","why":"Stream ciphers encrypt data bit by bit / byte at a time using a keystream generator and XOR, making them ideal for continuous, real-time streams like audio and video. Block ciphers process fixed-size chunks (padding the last one); hashes aren't encryption; RSA is far too slow for a live feed.","multi":false},{"id":"1rk4ltg","q":"Why does a block cipher add padding to a short final chunk of data?","a":"To bring the final partial block up to the algorithm's fixed block size so it can be processed","why":"Block ciphers operate on fixed-length blocks (typically 64, 128, or 256 bits). If the message doesn't fill the last block, padding is added before encryption so the block can be processed. It has nothing to do with key length, salting, or speed.","multi":false},{"id":"vmtzlv","q":"An application must select the hashing algorithm with the LOWEST practical collision risk from this list. Which should it choose?","a":"SHA-256","why":"Collision risk shrinks as digest length grows: MD5 (128-bit) collisions are practical and demonstrated; SHA-1 (160-bit) is deprecated; SHA-256 gives a 256-bit digest space that makes collisions computationally infeasible for the foreseeable future. SHA-3 (224–512 bits, 120 rounds) is the even newer family.","multi":false},{"id":"u8tden","q":"To verify a received digital signature, the recipient uses:","a":"The sender's public key to decrypt the signature digest, then compares it to a fresh hash of the message","why":"The signature is the message digest encrypted with the sender's PRIVATE key, so anyone can decrypt it with the sender's public key. Matching the decrypted digest against a locally computed hash proves integrity; the fact that only the sender's private key could have created it gives non-repudiation.","multi":false},{"id":"vtj48x","q":"Which tool does the course name as automating the harvest of password hashes from Windows systems for pass-the-hash attacks?","a":"Mimikatz","why":"Mimikatz is the penetration tool cited for harvesting hashes and automating pass-the-hash attacks. Defenses: only trusted OSes on servers, proper domain trust configuration, fully patched workstations, MFA, and least privilege — one misconfigured or unpatched machine can expose the domain.","multi":false},{"id":"16xbpce","q":"A hardening baseline locks user accounts after three incorrect password attempts. What is the PRIMARY security benefit of this setting?","a":"It slows online password-guessing attacks by denying attackers unlimited attempts","why":"Limiting failed login attempts (e.g., lockout after 3 tries) directly deters attackers who try to keep guessing a user's credentials. It's painful for forgetful users, but it drastically increases security against online brute force and dictionary attacks.","multi":false},{"id":"1i29rx0","q":"In the chain of trust, what anchors trust for nearly every commercially issued certificate?","a":"A root CA whose certificate is already embedded in major browsers and operating systems","why":"The Root of Trust is typically a large third-party provider (Verisign, DigiCert, Google, Amazon, Cloudflare) whose root certificate ships pre-installed in browsers and OSs. Every certificate chains up to that trusted root — which is why a compromised root CA compromises every certificate beneath it.","multi":false},{"id":"5tztmc","q":"What is the main DISADVANTAGE of deploying one wildcard certificate across all of a company's subdomains?","a":"If the certificate must be revoked (e.g., server compromise), every subdomain that shares it is affected","why":"Wildcard certificates make management easy and cheaper — one cert covers *.example.com. The tradeoff: a compromise that forces revocation breaks TLS on ALL subdomains at once. Reissuing is quick, but availability across every subdomain is impacted until you do.","multi":false},{"id":"1thtxv5","q":"How does OCSP stapling improve the TLS handshake?","a":"The server pre-fetches its OCSP revocation record and includes it in the handshake, removing a real-time query to the CA","why":"Normally the browser must contact the CA at connection time to check revocation. With OCSP stapling (formerly the TLS Certificate Status Request extension), the certificate holder fetches its own OCSP record at intervals and staples it to the handshake — faster tunnel creation and one less live dependency on the CA.","multi":false},{"id":"zqp4ma","q":"An analyst suspects a harmless-looking image posted to social media carries a hidden payload. Which observation BEST supports the suspicion?","a":"An identically sized copy of the image produces a different hash, and the carrier's file size changed after 're-encoding'","why":"Steganography hides data inside ordinary files (e.g., subtly altering pixel colors) so the existence of the message stays concealed. The giveaway is technical: the carrier's contents changed — a different hash digest — and re-encoding often alters the file size. Visually the images look identical.","multi":false},{"id":"7t6kld","q":"An organization is planning its post-quantum signature strategy following the NIST selections. Which algorithm does NIST recommend as the PRIMARY post-quantum digital-signature choice?","a":"CRYSTALS-Dilithium","why":"From NIST's 2022 post-quantum selections: CRYSTALS-Kyber is for general encryption; CRYSTALS-Dilithium is the PRIMARY digital-signature algorithm, with FALCON and SPHINCS+ as alternates (SPHINCS+ is the hash-based option; the others are lattice-based). SHA-512 is a classical hash, not post-quantum.","multi":false},{"id":"1enb9fn","q":"Which of the following are SYMMETRIC BLOCK ciphers? (Select THREE.)","a":"AES;  Blowfish;  Twofish","why":"AES (128/192/256-bit keys), Blowfish (32–448-bit keys), and Twofish (128-bit blocks, up to 256-bit keys) are symmetric block ciphers — Blowfish and Twofish were released unpatented/open source. RC4 is a symmetric STREAM cipher, ECC is asymmetric, and MD5 is a hash — the classic category-confusion distractors.","multi":true},{"id":"euif0l","q":"Which techniques does the course recommend to increase hash security (especially for stored passwords)? (Select FOUR.)","a":"Key stretching;  Salting;  Using a nonce;  Limiting the number of failed login attempts","why":"The four hash-hardening techniques: key stretching (repeated hashing — used by WPA/WPA2/PGP), salting (random data per password — defeats rainbow tables), nonces (number used once — defeats replay), and account lockout limits (slow guessing). Short digests, public ledgers, and salt reuse all WEAKEN security.","multi":true},{"id":"1klpaal","q":"Which of the following are real certificate types or features discussed in the course? (Select FOUR.)","a":"Wildcard certificates;  Self-signed certificates;  Dual-sided certificates;  SAN (Subject Alternate Name) field","why":"All real: wildcards cover *.domain subdomains; self-signed certs are vouched by the entity itself (browser warning — for test/closed systems); dual-sided certs authenticate BOTH server and client (2x processing, high-security only); and the SAN field lets one certificate cover different root domains. The last three options are invented.","multi":true},{"id":"1621yq4","q":"Which statements about blockchain technology are TRUE per the course? (Select THREE.)","a":"It is a decentralized peer-to-peer network;  The ledger is immutable — recorded transactions cannot be altered;  Smart contracts are self-executing code whose terms are written into the code","why":"Blockchain = decentralized P2P network + immutable public ledger (each block chains to the previous block's hash) + smart contracts (self-executing code, tamper-proof once deployed — popularized by Ethereum). Trust comes from the math, not a central CA; AES is not required; supply chain, voting, and property transfers are non-currency uses.","multi":true},{"id":"1p01t04","q":"An architect must choose an algorithm to encrypt a 40 TB data warehouse. Which option is the LEAST appropriate choice for this bulk-encryption task?","a":"RSA-4096","why":"Asymmetric RSA is roughly 100–1,000x slower than equivalently secure symmetric ciphers — catastrophic for 40 TB. RSA's role is key exchange, signatures, and small-data protection. The symmetric options (AES-128/256, Twofish) are designed exactly for fast bulk encryption; AES-256 remains the gold standard.","multi":false},{"id":"79ni3w","q":"A legacy payment system still encrypts card records with 3DES. The security team must migrate to the NIST-selected successor that the US government uses for sensitive-but-unclassified data. Which algorithm is the required target?","a":"AES (Rijndael)","why":"NIST held an open contest to replace DES/3DES, and Rijndael — AES — won. AES supports 128/192/256-bit keys and is the federal standard for sensitive-but-unclassified information and the de facto symmetric standard worldwide. Re-running DES with tweaks, IDEA (a PGP-era also-ran), and the broken RC4 stream cipher are all dead ends.","multi":false},{"id":"1u6krze","q":"Two branch offices must agree on a shared secret across the untrusted internet before standing up an IPsec tunnel. An engineer worries an on-path attacker could intercept and alter the exchange. Which approach BEST meets the requirement?","a":"Use Diffie-Hellman for the key exchange and require certificate or password authentication during it","why":"Diffie-Hellman is built for exactly this — establishing a shared secret over an insecure channel (the core of IPsec VPN setup). But DH alone is susceptible to on-path/person-in-the-middle attacks, so authentication (password or digital certificate) must accompany the exchange. Reused or emailed keys defeat the purpose, and RSA-everything is impractically slow.","multi":false},{"id":"17ou1zb","q":"A company needs cryptographic proof of WHO sent a contract. Which mechanism is the LEAST effective at providing that proof?","a":"The shared symmetric key both parties hold","why":"Non-repudiation requires something ONLY the sender possesses. A shared symmetric key is held by both parties — either could have produced the message, so origin cannot be proven. Private-key signatures (RSA/ECDSA) with certificate-backed identity are the standard answer for provable origin.","multi":false},{"id":"1rflh6y","q":"Forensics shows an attacker never cracked a single password, yet authenticated to six servers using credentials sniffed from one unpatched workstation. Which technique BEST describes this attack?","a":"A pass-the-hash attack","why":"Pass-the-hash: the attacker harvests stored password hashes (tools like Mimikatz) and replays them directly to authenticate — the hash is functionally equivalent to the password, so cracking is unnecessary. One misconfigured or unpatched domain machine is enough. Defenses: patching, proper domain trusts, MFA, least privilege.","multi":false},{"id":"lofl22","q":"An app store rejects a developer's installer because it is unsigned. From the platform's perspective, what assurance does a valid code signature primarily provide?","a":"The file has not been modified or corrupted since the developer published it, and its origin is verifiable","why":"Code signing is a digital signature on software: the file is hashed and the digest is encrypted with the developer's private key (registered with Apple/Google). Users verify it to confirm integrity since publication and authentic origin. It says nothing about code quality and does not hide identity — quite the opposite.","multi":false},{"id":"1awnn66","q":"A tester browses to an internal training site and the browser warns the certificate is self-signed. Which statement BEST describes the situation?","a":"The traffic can still be encrypted, but no trusted third party has verified the server's identity","why":"Self-signed certificates provide encryption like any certificate — what's missing is third-party verification of identity, because the entity vouched for itself. Hence the browser warning. They're acceptable in testing/closed/non-production systems with established trust, but not for public-facing sites.","multi":false},{"id":"1l2e1dz","q":"An employee who encrypted years of sensitive project files with a personal PKI certificate resigns abruptly — and takes the private key. The files are unrecoverable. Which control would MOST directly have prevented this loss?","a":"Key escrow (with tightly regulated retrieval, e.g., two administrators present)","why":"Key escrow stores a secure copy of keys with a trusted third party precisely so encrypted data survives lost, corrupted, or departed-with keys — and to support legal investigations. Retrieval must be strongly regulated (separation of duties: two admins present) because whoever holds escrowed keys could decrypt everything.","multi":false},{"id":"198lixg","q":"A bank's API gateway must cryptographically verify BOTH the client application and the server to each other before any transaction flows. Which certificate approach is designed for this?","a":"Dual-sided (mutual) certificates","why":"Dual-sided certificates require both server and client to authenticate with certificates — mutual validation. It's stronger security at the cost of roughly twice the server processing, so it's reserved for high-security environments like banking APIs. Single-sided (normal HTTPS) authenticates only the server.","multi":false},{"id":"1f3bubx","q":"Developers need realistic-looking production data to test a new feature, but security forbids genuine customer records in non-production. Which technique BEST satisfies both needs?","a":"Data masking to produce a sanitized, realistic test dataset","why":"Data masking (data obfuscation) disguises original data while keeping it authentic-looking and usable for its purpose — fictional names, altered addresses — so test environments carry zero genuine records. Tokenization keeps real values retrievable via a vault (still real data somewhere); steganography hides data rather than sanitizing it.","multi":false},{"id":"e31ap9","q":"A grocery consortium wants every participant — farm, processor, shipper, store — to record handling events that NO participant can later alter, for food-safety tracing. Which solution BEST fits?","a":"A permissioned blockchain with an immutable public ledger","why":"A permissioned blockchain (IBM's push for commercial use) gives known participants a shared, immutable ledger: each block chains to the previous block's hash, so retroactive alteration breaks the chain and is immediately evident. Traceability from farm to store with tamper-proof records is its flagship supply-chain use case.","multi":false},{"id":"np7hg7","q":"A CISO is building a 10-year crypto-agility roadmap anticipating cryptographically relevant quantum computers. Which systems should be prioritized FIRST for post-quantum migration?","a":"The PKI: asymmetric key exchange and digital signatures (RSA/ECC certificates)","why":"Quantum computers break ASYMMETRIC algorithms — RSA, ECC, Diffie-Hellman — by rapidly factoring large primes / solving discrete logarithms. That guts PKI key exchange and signatures, the foundation of secure internet identity. Symmetric AES survives with longer keys (AES-256 squares the work); hashes and HMAC degrade more gradually.","multi":false},{"id":"zm775j","q":"Which of the following does the course classify under the hashing family? (Select FOUR.)","a":"MD5;  SHA-256 (SHA-2 family);  RIPEMD-160;  HMAC","why":"The hashing lesson covers MD5 (128-bit), the SHA family (SHA-1/2/3, e.g., SHA-256), RIPEMD (160/256/320-bit), and HMAC — a hash-based message authentication code paired with an underlying hash (HMAC-SHA256) for integrity plus authenticity. RSA and Diffie-Hellman are asymmetric; Blowfish is a symmetric cipher.","multi":true},{"id":"3bjh7h","q":"Which statements about digital certificates are TRUE? (Select THREE.)","a":"They bind a public key to an identity using the X.509 standard;  They are issued and digitally signed by a certificate authority;  They are validated by walking a chain of trust up to an embedded root CA","why":"Certificates are X.509 documents binding a public key to a person/server/device identity, issued and signed by a CA, and validated up a chain of trust anchored in root certificates pre-installed in browsers/OSs. Private keys are NEVER in certificates; self-signed certs lack third-party trust; and algorithms remain public — the key is the secret.","multi":true},{"id":"kfym0l","q":"Which statements about the course's encryption tools are TRUE? (Select FOUR.)","a":"A TPM is a dedicated microcontroller used by BitLocker to protect drive-encryption keys;  An HSM performs key operations inside a tamper-proof environment and is used for mission-critical financial transactions;  A KMS centrally manages the full key lifecycle from creation to destruction;  A secure enclave is a co-processor isolated from the main CPU for shielding sensitive data like biometrics","why":"All four tool descriptions are correct: TPM (endpoint microcontroller, BitLocker), HSM (tamper-proof enterprise crypto appliance, compliance/finance), KMS (centralized key lifecycle management), secure enclave (isolated co-processor — Face ID/Touch ID data never leaves the device). The three false statements describe the opposite of how each tool works.","multi":true},{"id":"1e8gg4l","q":"Which descriptions correctly pair a cryptographic attack with its mechanism? (Select FOUR.)","a":"Downgrade attack — forces a rollback to a weaker, older protocol version;  Collision attack — finds two different inputs producing the same hash output;  Birthday attack — uses probability theory to find hash collisions faster than brute force;  Pass-the-hash — reuses a stolen password hash to authenticate without cracking it","why":"The four real attacks: downgrade/version rollback (POODLE vs SSL 3.0), collision (two inputs, one digest — broke MD5), birthday (paradox math making collisions far more likely than intuition suggests), and pass-the-hash (replay stolen hashes, Mimikatz). Salting and key stretching are DEFENSES, and OCSP stapling is a defense for certificate revocation — classic inverted distractors.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
