<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #f0883e; --accent-dim: rgba(240,136,62,.14);
    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .topbar .grow { flex: 1; }
  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }
  h1 { font-size: 24px; margin: 10px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }
</style>

  <script>
    var DECKS = [{"label":"Section 25 · Automation and Orchestration","cards":[{"id":"62j4hs","q":"Which statement correctly distinguishes orchestration from automation?","a":"Orchestration coordinates and sequences multiple automated tasks toward a workflow; automation executes individual tasks","why":"Automation = autonomous single tasks; orchestration = the big picture sequencing them.","multi":false},{"id":"1v9ra11","q":"A documented checklist of steps to respond to a phishing click is a:","a":"Playbook","why":"Playbook = the checklist; an automated version with human checkpoints = runbook.","multi":false},{"id":"by481m","q":"A runbook that pauses at step 2 so an analyst can approve re-imaging demonstrates:","a":"Clearly defined human interaction points in an automated workflow","why":"Runbooks automate what can be automated and route decisions to humans.","multi":false},{"id":"182jlr0","q":"Considering whether automation creates a single point of failure leads organizations to implement:","a":"Redundancy, failover systems, and manual fallback processes","why":"Manual and redundant fallbacks keep the business running when automation fails.","multi":false},{"id":"13hb436","q":"An automation breaks after a SaaS vendor updates its platform. Which pre-deployment consideration would have prepared the team?","a":"Ongoing supportability — anticipating that APIs/webhooks change and need maintenance","why":"Supportability means in-house skills to adapt automations as interconnected systems evolve.","multi":false},{"id":"15b3hbs","q":"Which is the WORST candidate for automation?","a":"A one-time, 30-minute migration done every few years","why":"One-off/infrequent low-effort tasks don't repay the build cost — keep them manual.","multi":false},{"id":"1i53vhw","q":"Automating repetitive, mundane tasks improves retention primarily by:","a":"Reducing burnout and letting staff focus on strategic, meaningful work","why":"Job fulfillment rises when boring tasks are automated away — a cited retention benefit.","multi":false},{"id":"1qtoasg","q":"In the financial-institution example, orchestration contained a multi-account compromise in minutes by:","a":"Isolating affected accounts, collecting forensic data, and initiating a predefined playbook automatically","why":"Automated detection + orchestrated response = hours/days compressed to minutes.","multi":false},{"id":"55ar7g","q":"Automated ticket escalation triggers may include:","a":"Supervisor notification, reassignment to a higher-tier expert, and priority elevation","why":"Escalation rules watch priority/age/unresolved status and act accordingly.","multi":false},{"id":"8wmjef","q":"Resource provisioning verification and auditing primarily ensures:","a":"The automation succeeded and inventory/compliance records stay accurate","why":"Verify resources were granted correctly and audit allocations for inventory and compliance.","multi":false},{"id":"137v1v4","q":"Which security automation detects a configuration violation and automatically isolates an infected workstation?","a":"Guardrails","why":"Guardrails monitor continuously and take predefined corrective actions without human delay.","multi":false},{"id":"z6y294","q":"Scheduling non-continuous services to run only when needed reduces risk by:","a":"Shrinking the attack window — the service can only be attacked while running","why":"Off-when-unused services present fewer opportunities to attackers.","multi":false},{"id":"1fw3kvm","q":"Select THREE of the five 'when to automate/orchestrate' considerations:","a":"Complexity;  Cost;  Single points of failure","why":"Also technical debt and ongoing supportability.","multi":true},{"id":"1hcil5","q":"Which THREE are among the seven benefits of automation and orchestration?","a":"Enforcing security baselines consistently;  Scaling securely (e.g. dynamic cloud provisioning);  Acting as a workforce multiplier","why":"Also efficiency/time savings, standard configs, retention, faster reaction.","multi":true},{"id":"nvd1jp","q":"Which THREE steps belong to the automated ticket CREATION process?","a":"Monitoring incoming submissions and auto-generating tickets;  Categorizing and prioritizing per rules;  Notifying the relevant support team","why":"Creation: submit → generate → capture info → categorize → prioritize → notify. Escalation is a separate process.","multi":true},{"id":"1msf0iu","q":"Which THREE statements about continuous delivery vs continuous deployment are true?","a":"Both start with continuous integration;  Continuous delivery stops before production — go-live is manual;  Continuous deployment pushes to production automatically with no human intervention","why":"Rollback automation is a deployment feature; delivery's production push is a business decision.","multi":true},{"id":"1efevd9","q":"Automation is best defined as:","a":"Automatically executing tasks without manual intervention","why":"Automation = individual tasks run autonomously via software/scripts.","multi":false},{"id":"15l1m7d","q":"Orchestration differs from automation in that orchestration:","a":"Coordinates and sequences multiple automated tasks toward a broader outcome, managing order and dependencies","why":"Orchestration is the big picture: chaining automated tasks in the right order.","multi":false},{"id":"whi9m0","q":"SOAR stands for:","a":"Security Orchestration, Automation, and Response","why":"SOAR = Security Orchestration, Automation, and Response — think 'SIEM 2.0'.","multi":false},{"id":"1p824f4","q":"The course describes SOAR as 'SIEM 2.0' primarily because SOAR:","a":"Integrates with the SIEM to add orchestration, automated playbooks, and data enrichment for IR and threat hunting","why":"SIEM + SOAR = next-generation SIEM with automated response workflows.","multi":false},{"id":"12x9d7h","q":"A playbook is:","a":"A checklist of actions to detect and respond to a specific incident type","why":"Playbooks list the steps for handling a given incident (e.g. phishing click).","multi":false},{"id":"p00fni","q":"A runbook differs from a playbook in that a runbook is:","a":"An automated version of a playbook with clearly defined points for human analysis","why":"Runbooks automate playbook steps but pause at defined human decision points.","multi":false},{"id":"ojumh9","q":"Which factor asks: does the process warrant the time, money, and resources to automate?","a":"Complexity","why":"Somewhat-complex repetitive tasks give positive ROI; trivial one-offs don't.","multi":false},{"id":"q8aa78","q":"Nightly server backups are a good candidate for:","a":"Simple automation","why":"A single repetitive task = automation; multi-step IR workflows need orchestration.","multi":false},{"id":"93ujz2","q":"A single point of failure in automation is best mitigated by:","a":"Redundancy, failover mechanisms, and manual fallback processes","why":"If everything relies on automation, its failure stops the business — keep manual fallbacks.","multi":false},{"id":"1i0dwlv","q":"Technical debt refers to:","a":"The accumulated cost and complexity of suboptimal or hastily implemented solutions that must eventually be refactored","why":"Quick-and-dirty automation accumulates debt — schedule regular reviews and refactoring.","multi":false},{"id":"wtrupg","q":"An outsourced one-time automation build often stops working later chiefly because:","a":"APIs/webhooks change when vendors update or replace their systems","why":"Vendor system updates break API connections — ongoing in-house supportability is essential.","multi":false},{"id":"y7g99z","q":"The BEST automation candidates are processes that are:","a":"Repeatable and stable over time","why":"Repeatable, consistent processes yield the time/resource savings; variable tasks stay manual.","multi":false},{"id":"19rtf4r","q":"A task performed once every few years taking 30 minutes manually should usually be:","a":"Done manually — automation isn't worth it","why":"Low-frequency, low-effort tasks don't justify automation cost.","multi":false},{"id":"moo3d0","q":"Which is NOT one of the seven cited benefits of automation and orchestration?","a":"Guaranteed elimination of all breaches","why":"The seven: efficiency/time savings, baseline enforcement, standard configs, secure scaling, retention, faster reaction, workforce multiplier.","multi":false},{"id":"2yxz0k","q":"Automation improving employee retention works by:","a":"Removing mundane repetitive work so employees focus on strategic, fulfilling tasks — reducing burnout","why":"Happier staff doing meaningful work stay longer — a less-obvious but real benefit.","multi":false},{"id":"1ahrjln","q":"A 'workforce multiplier' means:","a":"A smaller team can manage and secure a larger, more complex infrastructure","why":"Automation augments staff capability; labor is the biggest expense, so this saves money over time.","multi":false},{"id":"51vx4p","q":"Automation enabling a breach to be contained 'within minutes instead of hours or days' demonstrates which benefit?","a":"Faster reaction times","why":"Automated detection + orchestrated response slashes reaction time — often the difference between a mitigated threat and a breach.","multi":false},{"id":"1da6jkv","q":"The six-step automated ticket creation process ends with:","a":"Sending an automated notification to the relevant support team/technician","why":"Submit → generate → capture info → categorize → assign priority → notify team.","multi":false},{"id":"11kfv9t","q":"Automated ticket escalation actions can include:","a":"Notifying a supervisor, reassigning to a higher-level expert, and raising priority","why":"Escalation automation triggers supervisor alerts, reassignment, and priority changes, then monitors to closure.","multi":false},{"id":"90hkxk","q":"Escalation criteria are defined based on:","a":"The nature of the issue, its urgency, and the service level agreement","why":"Issue type + urgency + SLA drive when a ticket escalates (e.g. 24/48-hour rules).","multi":false},{"id":"cb55zs","q":"User provisioning automation typically performs all of the following EXCEPT:","a":"Deciding the company's annual strategy","why":"User provisioning: collect info → create accounts → assign RBAC-based access → notify → keep synchronized.","multi":false},{"id":"k3gvnx","q":"The five resource-provisioning steps are:","a":"Requirements analysis, allocation, configuration/customization, verification and auditing, feedback","why":"Analyze needs → allocate/procure → configure for the role → verify + audit (inventory/compliance) → gather feedback.","multi":false},{"id":"1swrjuy","q":"When an employee is promoted or changes departments, provisioning automation should:","a":"Automatically synchronize their accounts and access permissions to reflect the change","why":"Continuous synchronization keeps access aligned with the current role — join/move/leave.","multi":false},{"id":"10us3v0","q":"Guardrails are best described as:","a":"Automated safety controls that prevent insecure configurations and auto-correct detected violations","why":"Guardrails enforce security policies automatically — alerts plus corrective action (revoke perms, reconfigure, isolate host).","multi":false},{"id":"1b10fg3","q":"In cloud environments, security groups function as:","a":"A virtual firewall controlling inbound/outbound traffic for instances","why":"Security groups define allowed traffic; automation assigns instances and adjusts rules dynamically.","multi":false},{"id":"12ct3w1","q":"Scheduling a rarely needed service to run only when required primarily:","a":"Reduces the window of opportunity for attacks","why":"A service can only be attacked while running — schedule off when unused.","multi":false},{"id":"4nt0mx","q":"Automated RBAC permissions management ensures:","a":"Rights are granted by role and updated automatically as users join, move, or leave","why":"Auto provisioning/deprovisioning by role prevents unauthorized access and stale permissions.","multi":false},{"id":"iau2hz","q":"Continuous Integration means developers:","a":"Merge code into a central repository multiple times per day, with automated builds and tests verifying each check-in","why":"CI = frequent merges + automated verification, catching integration problems early.","multi":false},{"id":"1wjhtgk","q":"The key difference between continuous delivery and continuous deployment:","a":"Delivery keeps production deployment as a MANUAL decision; deployment pushes to production automatically with no human intervention","why":"Both automate build/test; delivery stops before production (human go/no-go), deployment goes all the way automatically with rollback.","multi":false},{"id":"t6bm3m","q":"Release differs from deployment in that a release:","a":"Finalizes/prepares software and makes it available for installation, while deployment installs it into the target environment","why":"Release = 'ready and available'; deployment = 'installed and operational' in the environment.","multi":false},{"id":"y5bm4","q":"A critical safety feature of continuous deployment is:","a":"Automated rollback to the previous known state on failure","why":"Automated rollback maintains continuity when a deployment fails.","multi":false},{"id":"t55w3a","q":"Flickr releasing updates up to 10 times per day illustrates:","a":"The velocity possible with CI/CD automation","why":"High-velocity CI/CD enables many reliable releases per day.","multi":false},{"id":"vkx5rp","q":"An API is best defined as:","a":"A set of rules and protocols that lets one product/service talk to another in a controlled environment with a specific data format","why":"APIs enable controlled programmatic interconnection (the backbone of microservices).","multi":false},{"id":"xgm6wh","q":"REST APIs typically use which data format and style?","a":"JSON, stateless, standard HTTP methods","why":"REST = stateless architectural style over HTTP, usually JSON, lightweight.","multi":false},{"id":"1typt42","q":"SOAP differs from REST in that SOAP:","a":"Uses strict XML messages with header+body, offering more security features and transaction compliance","why":"SOAP = robust, secure, transaction-compliant — preferred for enterprise/regulated services.","multi":false},{"id":"1j92sg7","q":"The tool the course recommends for testing an API from the command line:","a":"cURL (e.g. curl --data ...)","why":"cURL ships with Linux/Mac and tests APIs over HTTP/HTTPS, returning responses (often JSON).","multi":false},{"id":"lxazik","q":"Dion Training's Udemy-to-Freshdesk ticket sync is an example of:","a":"An API integration between two SaaS products (Udemy API + Freshdesk API)","why":"Less than 150 lines of Python calling both vendors' APIs — integrations glue services together.","multi":false},{"id":"1bgsx0r","q":"Dion Training's path — manual voucher fulfillment → simple automation → full orchestration — best illustrates which consideration?","a":"Cost-benefit analysis evolving with scale","why":"They automated when it became cheaper than manual labor, then orchestrated as volume grew — cost-driven decisions.","multi":false},{"id":"13u649a","q":"Refactoring legacy automation code before a new orchestration project is an example of addressing:","a":"Technical debt","why":"Suboptimal legacy code that must be refactored = technical debt.","multi":false},{"id":"34xkvp","q":"The exam-worthy rule of thumb for automation candidates is tasks that are:","a":"Repeatable and stable","why":"Repeatable, consistent processes repay automation; variable one-offs don't.","multi":false},{"id":"1q4ldkh","q":"A guardrail detecting a deviation from security standards and reconfiguring the component automatically demonstrates:","a":"Automated baseline enforcement with self-correction","why":"Guardrails continuously monitor and auto-correct deviations — baseline enforcement in action.","multi":false},{"id":"1wn9mjv","q":"Automated RBAC that revokes a departing employee's access the same day primarily prevents:","a":"Unauthorized access from stale permissions","why":"Auto-deprovisioning on leave closes the orphan-account risk window.","multi":false},{"id":"8sakvo","q":"In CI, running automated tests immediately after each code merge provides:","a":"Early notification of integration problems so developers can fix them fast","why":"The feedback loop catches conflicts/errors within minutes of check-in.","multi":false},{"id":"1eiftzh","q":"Dion Training chose continuous delivery (not deployment) because:","a":"Production go-live timing is a business decision made by the CTO/COO","why":"Delivery = always deployable + manual production push for business control.","multi":false},{"id":"17s6q2v","q":"The Flickr example (10 releases/day) primarily shows:","a":"CI/CD enabling high-velocity, automated releases","why":"Extreme release frequency is only possible with CI/CD automation.","multi":false},{"id":"12dpnr4","q":"A key developer-culture change with CI/CD is:","a":"Developers take responsibility for their code running in production","why":"Collective responsibility: devs own deployment quality; ops improves the pipeline.","multi":false},{"id":"aofxdj","q":"REST is often preferred for web APIs because it is:","a":"Lightweight, stateless, uses standard HTTP and JSON","why":"REST's simplicity and JSON fit modern web integration with minimal modification.","multi":false},{"id":"cvyd21","q":"An enterprise payment service needing transaction compliance and robust security would likely choose:","a":"SOAP","why":"SOAP's strict XML structure, security features, and transaction compliance suit regulated enterprise services.","multi":false},{"id":"1ep1n3e","q":"The command to send test data to an API and inspect the JSON response, per the course:","a":"curl --data \"name=value\" https://api.example/post","why":"cURL transfers data over HTTP/HTTPS (and more) — the standard API test tool.","multi":false},{"id":"1yrbu2a","q":"Select THREE corrective actions guardrails can perform automatically:","a":"Revoking a user's permissions;  Reconfiguring an affected component;  Isolating an infected workstation","why":"Guardrails alert and self-correct: revoke, reconfigure, isolate.","multi":true},{"id":"dsl8yq","q":"Which THREE are valid escalation automation triggers?","a":"Ticket priority level;  Response time exceeding the SLA;  Unresolved status beyond the threshold","why":"Rules monitor priority, aging, and unresolved status to trigger escalation.","multi":true},{"id":"tqmtro","q":"Which THREE items can be provisioned by resource-provisioning automation?","a":"A workstation with role-specific software;  A company-issued smartphone;  Software licenses","why":"Physical and digital resources: hardware, devices, licenses, communication tools.","multi":true},{"id":"22x7hc","q":"Which THREE describe continuous DEPLOYMENT specifically?","a":"Code passing all pipeline stages is released with no human intervention;  Every change goes to production automatically after the build;  Automated rollback reverts failures to the previous known state","why":"Fully automated to production + rollback; manual go-live describes delivery instead.","multi":true},{"id":"1fqv7li","q":"Why does the course call SOAR 'SIEM 2.0'?","a":"It integrates with the SIEM and adds orchestration, automated playbooks/runbooks, and data enrichment — primarily for incident response","why":"SOAR layers orchestration/response on top of SIEM aggregation — the next evolution.","multi":false},{"id":"1q2sp6q","q":"Data enrichment in the SOAR context refers to:","a":"Enhancing SIEM data (e.g. threat intel context) so analysts get more actionable information","why":"SOAR correlates external data with SIEM events, making alerts more useful.","multi":false},{"id":"lmet3l","q":"With SOAR, responding to a VDI user's infected machine could be automated to:","a":"Delete the infected VM and automatically provision a clean replacement","why":"SOAR can provision/deprovision resources — swap infected VDI instances automatically via playbook.","multi":false},{"id":"1gp7me2","q":"The strongest argument to keep a manual process alongside fully orchestrated fulfillment is:","a":"If orchestration fails, the manual process prevents a single point of failure from stopping the business","why":"Redundancy + manual fallback = resilience when automation breaks.","multi":false},{"id":"x73l2g","q":"Which pairing of process and automation level is correct per the course?","a":"Multi-step malware IR (isolate, image, forensics, reimage, validate, reconnect) — orchestration of multiple automations","why":"Complex multi-system workflows need orchestration; simple repetitive tasks need plain automation.","multi":false},{"id":"1kw5syk","q":"A cost-benefit analysis for automation must include:","a":"Development, implementation, maintenance, hardware, software, personnel, and ongoing support","why":"All-in costs vs long-term savings drive the automation decision.","multi":false},{"id":"1gzyh3q","q":"Over time, automation tends to become CHEAPER while manual processes become MORE expensive because:","a":"Automation costs trend down while labor rates rise","why":"This economic trend is why the workforce-multiplier benefit compounds over time.","multi":false},{"id":"1c2m9wy","q":"A simulation shows incident containment dropping from days to minutes. Besides speed, which benefit combination does this demonstrate?","a":"Faster reaction times + workforce multiplier (smaller team, larger coverage)","why":"Rapid automated response both cuts reaction time and multiplies staff effectiveness.","multi":false},{"id":"1s4dl5r","q":"A designer receives a workstation with Adobe tools while a salesperson gets CRM access. This resource-provisioning step is:","a":"Configuration and customization to role","why":"Resources are configured per role needs after allocation.","multi":false},{"id":"dz7oi2","q":"Continuous integration's automated test stage most directly protects against:","a":"Integration defects from multiple developers merging frequently","why":"Frequent merges without automated testing would break builds — CI catches problems immediately.","multi":false},{"id":"69mw48","q":"Why does continuous DELIVERY give management 'a production-ready version at all times'?","a":"Automated build/test keep the codebase deployable while humans control the go-live timing","why":"Delivery = always-deployable artifact + manual production decision for business control.","multi":false},{"id":"1squ9ls","q":"In a microservice architecture, APIs let you:","a":"Call another service's functions instead of building everything yourself","why":"APIs compose third-party capabilities into your product (the lab-provider example).","multi":false},{"id":"1ia0q6z","q":"Select THREE characteristics of SOAP:","a":"Strict XML message format with header and body;  Additional security features;  Transaction compliance for enterprise/regulatory use","why":"SOAP = robust, secure, transactional; REST = lightweight, stateless, JSON.","multi":true},{"id":"8mkfqb","q":"Which THREE are automated guardrail/security-group capabilities cited in the course?","a":"Assigning cloud instances to security groups by function/location;  Dynamically adjusting security group rules as threats evolve;  Automatically isolating an infected workstation on violation","why":"Cloud guardrails + security groups auto-assign, adjust, and self-correct.","multi":true},{"id":"ulb6lh","q":"Which THREE statements about APIs in integrations are true?","a":"APIs let products talk in a controlled environment with a defined data format;  Cloud vendors expose provisioning/deprovisioning via APIs;  APIs enable calling third-party functions instead of building them (microservices)","why":"APIs are the glue of automation across SaaS, cloud, and microservices.","multi":true},{"id":"wvcv15","q":"Which THREE were listed as automation targets for security operations?","a":"Guardrails;  Security groups;  Service/permission enable-disable (RBAC) management","why":"The four security automation areas: guardrails, security groups, service access, permissions.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>

<script id="back-lib-script">
(function () {
  if (window.__backBtnInit) return; window.__backBtnInit = true;
  function lib() { return "../library.html"; }
  function resultVisible() {
    var rs = document.getElementById('result-screen');
    if (rs && !rs.classList.contains('hidden') && rs.offsetParent !== null) return true;
    var big = document.querySelector('.score-big');
    if (big) {
      var el = big;
      while (el && el !== document.body) {
        if (el.classList && el.classList.contains('hidden')) return false;
        el = el.parentElement;
      }
      return big.offsetParent !== null;
    }
    return false;
  }
  function ensure() {
    if (!resultVisible() || document.getElementById('back-lib-btn')) return;
    var a = document.createElement('a');
    a.id = 'back-lib-btn';
    a.href = lib();
    a.textContent = '\u2190 Back to Library';
    a.setAttribute('style', 'position:fixed;left:18px;bottom:18px;z-index:9999;' +
      'padding:11px 20px;border-radius:999px;font:600 14px/1 "Segoe UI",system-ui,sans-serif;' +
      'text-decoration:none;color:#fff;background:linear-gradient(135deg,#f0883e,#e36414);' +
      'box-shadow:0 4px 18px rgba(240,136,62,.45);border:1px solid rgba(255,255,255,.25);');
    document.body.appendChild(a);
  }
  setInterval(ensure, 400);
  if (document.readyState !== 'loading') ensure();
  else document.addEventListener('DOMContentLoaded', ensure);
})();
</script>
