  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }

  <script>
    var DECKS = [{"label":"Section 6 · Data Protection","cards":[{"id":"1dz6eos","q":"A CFO issues a mandate: 'All corporate balance sheets are to be labeled and protected as financial information, with controls X, Y, and Z.' Which data ownership role is the CFO acting in, and what does this illustrate?","a":"Data owner — a senior executive labeling the asset and mandating the controls everyone else must follow","why":"The data owner is a senior executive with ultimate responsibility for the asset's confidentiality, integrity, and availability. Their real job is labeling the asset and ensuring it's protected with appropriate controls — then everyone who creates that type of data follows those rules. It's not the file creator and not an IT role.","multi":false},{"id":"16a46kf","q":"A new CISO proposes classifying ALL organizational data as confidential to 'keep things simple.' Which response BEST reflects the course's teaching?","a":"That overclassifies the data: everything would need the highest level of protection, multiplying spend on personnel, access controls, and technical solutions for data that doesn't warrant it","why":"Overclassifying means protecting everything at a really high level, which costs a lot more money, time, and resources — additional personnel, access controls, and other technical solutions to buy and deploy. Proper classification matches protection levels (and spending) to each classification tier.","multi":false},{"id":"1rqi20p","q":"An online retailer decides exactly what customer data to collect, why, and how it will be stored and used; a hired analytics firm then processes that data under the retailer's instructions. A privacy breach occurs. Which entity is ultimately accountable, and can it shift that accountability?","a":"The retailer as data controller — it holds ultimate accountability for privacy breaches and CANNOT delegate that responsibility, even to the processor it hired","why":"The data controller decides the purposes and methods of data storage, collection, and usage and guarantees the legality of those processes. The controller holds ultimate accountability for any breach of privacy and cannot delegate it. The hired analytics firm is merely the data processor, working under the controller's direction.","multi":false},{"id":"10obfgr","q":"Two staff members handle financial data: one configures access controls, encryption, and backup/recovery on the servers; the other verifies the data is correctly labeled and classified with proper metadata, working under the data owner. Which pair of roles are these?","a":"Data custodian (server controls) and data steward (labeling/quality under the owner)","why":"The data custodian manages the systems where data assets are stored — a sysadmin enforcing access control, encryption, and backup/recovery per the owner's requirements. The data steward works for the data owner, focused on data quality and metadata — making sure the data actually gets labeled and classified the way policy dictates.","multi":false},{"id":"3y6dxf","q":"A sales rep's company laptop is stolen from a parked car — but it was fully shut down, and full disk encryption was enabled. What does the thief get?","a":"Nothing readable — with the system off, full disk encryption keeps the entire drive encrypted until the decryption key is entered at login","why":"Full disk encryption encrypts the entire hard drive: when the system is off, the data is encrypted; when the system is on and the user is logged in, the data is decrypted. A powered-off stolen laptop yields only ciphertext until the key is entered — achievable through the OS, third-party software, or the disk device itself.","multi":false},{"id":"c907ke","q":"Multiple users share one database, but each user group may view only certain FIELDS of a record. Which at-rest encryption approach is designed for this?","a":"Record encryption — encrypting specific fields within a database record, useful when users share a database but don't share view rights","why":"Record encryption encrypts specific fields within a database record — beneficial when multiple users access the same database but don't all have the same access and view rights, so some fields stay encrypted from some users. Database encryption, one level up, works at column, row, or table level.","multi":false},{"id":"keljwh","q":"A US-based SaaS company stores German citizens' data in a US data center. Which statement about its obligations is correct?","a":"Because the data belongs to EU citizens, GDPR applies regardless of the company's location, and the data remains subject to the laws of the nation where it was collected or processed","why":"Data sovereignty: information is subject to the laws of the nation within which it's collected or processed. Any organization dealing with EU citizens' data — regardless of its own location — must comply with GDPR, and the penalties for non-compliance are hefty. Cloud storage across borders is exactly what makes this a modern problem.","multi":false},{"id":"15o6hiy","q":"A US firm's entire workforce is in North and South America. To block attacks from regions where no employee can legitimately be, it bans logins originating from Asia and Africa. What is this technique called, and what else does it help with?","a":"Geographic restrictions (geofencing) — virtual boundaries on access by location, which also helps comply with data sovereignty laws","why":"Geographic restrictions, also known as geofencing, set up virtual boundaries to restrict data access based on geographic location. If all employees are in the Americas, login requests from Asia or Africa can simply be banned. The method also helps organizations comply with data sovereignty laws and blocks access from high-risk locations.","multi":false},{"id":"g93ym4","q":"Why does the course say hashing is the right technique for storing passwords?","a":"Because hashing produces a fixed-size value through a one-way function — even if the hash table is stolen, the original passwords cannot be reversed or decrypted","why":"Hashing converts data into a fixed-size numerical or alphanumeric hash value and, unlike encryption, is a one-way function — once data is hashed it cannot be reversed or decrypted. That's why it's used to store sensitive data like passwords (verification compares hashes) and to check file integrity. A stolen hash database doesn't expose reversible passwords.","multi":false},{"id":"1vtjcxy","q":"A retailer's point-of-sale system never stores actual credit card numbers — it stores random-looking substitutes, while the real numbers sit in a separate, tightly secured database. Which technique is in use, and where does the original data live?","a":"Tokenization; non-sensitive tokens replace the card numbers and reference the originals stored securely in a separate database","why":"Tokenization replaces sensitive data with non-sensitive substitutes called tokens; the original data is stored securely in a separate database, with the token serving as a reference. It's commonly used in payment processing systems to protect credit card information — a breach of the POS database exposes only useless tokens.","multi":false},{"id":"1p3qpah","q":"An agent installed on each company laptop watches for users copying sensitive files to USB drives and blocks the transfer or alerts an admin based on policy. Which DLP type is this, and which data state does it watch?","a":"Endpoint DLP; data in use — like an IDS/IPS focused on data, operating in detection or prevention mode","why":"Endpoint DLP is software installed on a workstation or laptop that monitors the data in use on that computer. File-transfer attempts are stopped or reported based on rules and policies — very much like an IDS or IPS, but focused on data. DLPs can be set to detection mode or prevention mode.","multi":false},{"id":"5q0jwh","q":"In the Google Workspace DLP demo, which action set was chosen for the 'Block SSNs' rule?","a":"Block the message in Google Chat and block external sharing of matching Drive files, with a custom user message and medium-severity alerting to the security dashboard","why":"For the SSN rule, Chat was configured to block the message (with a custom message telling the user their message may contain sensitive content), and Drive was configured to block external sharing of files containing SSNs — other options were warn, or disable download/print/copy for commenters and viewers. Alerting severity is a risk-based decision (the demo chose medium) reported to the security dashboard and alert center.","multi":false},{"id":"84nmvw","q":"Which of the following are genuine data ownership roles from the course? (Select THREE.)","a":"Data owner;  Data controller;  Data custodian","why":"The six real roles: data owner (senior executive, ultimate CIA responsibility), data controller (decides purposes/methods, cannot delegate accountability), data processor (hired by the controller), data steward (quality/metadata under the owner), data custodian (manages the systems), and data privacy officer (oversees PII/SPI/PHI compliance). 'Data encryptor' and the others are invented distractors.","multi":true},{"id":"1gyhvky","q":"Which techniques are on the course's list of methods used to SECURE data? (Select THREE.)","a":"Tokenization;  Segmentation;  Hashing","why":"The eight data-securing methods: geographic restrictions, encryption, hashing, masking, tokenization, obfuscation, segmentation, and permission restrictions. Pretexting, tailgating, and typosquatting are social-engineering attacks — classic cross-domain distractors.","multi":true},{"id":"1xloogr","q":"Which of the following are the course's four types of DLP systems? (Select FOUR.)","a":"Endpoint DLP;  Network DLP;  Storage DLP;  Cloud-based DLP","why":"The four DLP types: endpoint (software on the device watching data in use), network (perimeter solution focused on outbound data in transit), storage (server software watching data at rest, e.g., 2 a.m. bulk downloads), and cloud-based (SaaS integrated with cloud services like Google Drive). The last two options don't exist.","multi":true},{"id":"8k1xy2","q":"Which of the following are examples of REGULATED data as described in the course? (Select THREE.)","a":"Personal identification information (PII) such as names and Social Security numbers;  Health records (PHI) protected under HIPAA;  Credit card information governed by standards like PCI DSS","why":"Regulated data is information controlled by laws, regulations, or industry standards: PII (protected by privacy laws like GDPR), PHI (protected by HIPAA), and credit card data (PCI DSS). Public-facing brochures and catalogs are public data — the opposite of regulated.","multi":true},{"id":"1witkor","q":"How does the course define data protection?","a":"The process of safeguarding important information from corruption, compromise, or loss","why":"Data protection is the process of safeguarding important information from corruption, compromise, or loss. It spans a broad range of practices, technologies, and strategies designed to ensure the confidentiality, integrity, and availability of data.","multi":false},{"id":"lr7120","q":"Which five exam objectives does this section of the course cover?","a":"1.4, 3.3, 4.2, 4.4, and 5.1","why":"Data protection spans five objectives across four domains: 1.4 (appropriate cryptographic solutions), 3.3 (concepts and strategies to protect data), 4.2 (security implications of hardware, software, and data asset management), 4.4 (alerting and monitoring concepts), and 5.1 (elements of effective security governance).","multi":false},{"id":"1yn2ujz","q":"What is the course's one-line summary of what data loss prevention (DLP) does?","a":"It is a strategy for ensuring sensitive or critical information doesn't leave the organization, intentionally or unintentionally","why":"DLP is a strategy for ensuring sensitive or critical information doesn't leave your organization — intentionally or unintentionally — using tools and processes designed to detect potential data breaches or exfiltration techniques.","multi":false},{"id":"1t8dhlv","q":"What two factors determine a data classification, and who decides it?","a":"Value to the organization and sensitivity if disclosed; the data owner decides","why":"Data classification is based on the value to the organization and the sensitivity of the information if it's disclosed. The person who decides that classification level is the data owner — a senior executive, not the file creator and not IT.","multi":false},{"id":"une4oo","q":"A marketing company lists its four commercial classification levels from LOWEST to HIGHEST. Which list is correct?","a":"Public, sensitive, private, confidential","why":"Commercial businesses use four levels from lowest to highest: public (no impact if released — website content), sensitive (minimal impact — financial data), private (personal records, salary info — relates to an individual entity), confidential (trade secrets, IP, source code — serious business impact, NDA-required third parties).","multi":false},{"id":"1fjkjwu","q":"A service member's medical record — containing birthday, SSN, and diagnosis — is classified at which government level, and why?","a":"Sensitive but unclassified, because its release won't hurt national security but would impact the individual whose data it contains","why":"Sensitive but unclassified (SBU) covers medical records and personal files: releasing that Private Timmy had a strep infection won't affect the military at large, but it does affect Timmy. The government ladder: unclassified → SBU → confidential (seriously affect) → secret (seriously damage national security) → top secret (gravely damage).","multi":false},{"id":"7rbn6d","q":"Match the government classification to its harm level: military deployment plans versus weapon-system blueprints.","a":"Deployment plans = secret (could seriously damage national security); blueprints = top secret (could gravely damage national security)","why":"Secret data includes military deployment plans and defensive postures — disclosure could seriously DAMAGE national security. Top secret covers weapon system blueprints — disclosure could GRAVELY damage national security. (Government confidential, one rung lower, covers trade secrets that would seriously AFFECT the government.)","multi":false},{"id":"iyfk5m","q":"What does the course warn is the consequence of OVERCLASSIFYING data?","a":"Everything ends up protected at a really high level, costing much more money, time, and resources — extra personnel, access controls, and technical solutions","why":"Overclassifying means protecting everything at the highest level — which demands more money, time, and resources (additional personnel, access controls, and purchased technical solutions). Proper classification lets protection and spending scale with each level's sensitivity.","multi":false},{"id":"1vvp2i5","q":"Under which law can the public request a US government agency to hand over its releasable data?","a":"The Freedom of Information Act (FOIA)","why":"Unclassified government data generally can be released to the public — either directly or under the Freedom of Information Act. Submit a FOIA request and the agency must find the matching unclassified data and provide it. HIPAA covers health data, GDPR covers EU personal data, PCI DSS covers card data.","multi":false},{"id":"1isgtmj","q":"Which statement about the data owner is correct?","a":"The data owner is a senior executive with ultimate responsibility for the confidentiality, integrity, and availability of the information asset, who labels it and mandates its controls","why":"The data owner is a senior executive role — not the file creator — with ultimate responsibility for the asset's CIA. They decide things like 'balance sheets must be labeled and protected as financial information,' and everyone creating such data follows those rules.","multi":false},{"id":"rokohz","q":"Which role holds ultimate accountability for privacy breaches and CANNOT delegate that responsibility?","a":"The data controller","why":"The data controller decides the purposes and methods of data storage, collection, and usage, and guarantees the legality of those processes. The controller holds ultimate accountability for any breach of privacy and cannot delegate that responsibility — even when processors are hired to do the work.","multi":false},{"id":"10xco4c","q":"A payroll company is hired to run salary calculations for a retailer using the retailer's data, under the retailer's instructions. Which role is the payroll company?","a":"Data processor — a group or individual hired by the data controller to collect, store, or analyze data under the controller's direction","why":"A data processor is hired by the data controller to help with tasks like collecting, storing, or analyzing data, working under the controller's direction and instructions. The retailer stays the controller (and keeps the breach accountability); the payroll company is the processor.","multi":false},{"id":"1iznfyq","q":"A system administrator who enforces access controls, encryption, and backup/recovery measures on the systems where data lives is acting as:","a":"Data custodian — responsible for managing the systems on which data assets are stored, per the requirements set by the data owner","why":"The data custodian handles the management of the systems where data assets are stored. System administrators are the classic example: they enforce access control, encryption, and backup/recovery measures based on the requirements set forth by the data owner.","multi":false},{"id":"1mstuyo","q":"Per the course, why should the IT department NOT be the data owner?","a":"Because IT knows systems, not the data itself — owners must come from the business side (e.g., the accounting department's leader for accounting data) so classification decisions reflect real data context","why":"The course is explicit: making the CIO or IT department the data owner is the WRONG answer. IT knows systems — they should be data custodians. Owners should be business-side people who understand the data: the accounting leader for accounting data, the software design department for a dev firm, the CFO or finance department for financial data.","multi":false},{"id":"x9mgwy","q":"When a breach exposes customer data, which role is 'really on the hook' for the privacy of that data, and what else falls under them?","a":"The data privacy officer — who also ensures purpose limitations, consent, data minimization, sovereignty, and retention compliance","why":"The data privacy officer oversees all privacy-related data (PII, SPI, PHI) and is on the hook when a breach exposes user privacy. Their remit covers legal/regulatory compliance, purpose limitations, consent, data minimization, data sovereignty, and data retention — everything privacy-related in the section.","multi":false},{"id":"shsa7u","q":"Which pairing of data state and protection method is correct?","a":"Data at rest — encryption and ACLs; data in transit — tunneling protocols like SSL/TLS, VPNs, and IPsec; data in use — application-level encryption and access controls","why":"The course's summary: data at rest is protected using encryption and ACLs; data in transit via communication tunneling protocols (SSL/TLS, VPN, IPsec); data in use via encryption at the application level (plus access controls and secure enclaves). Each state needs specific measures.","multi":false},{"id":"qmwcgy","q":"Place the at-rest encryption methods in order from BROADEST to MOST GRANULAR: (1) record encryption, (2) file encryption, (3) full disk encryption, (4) volume encryption.","a":"3 → 4 → 2 → 1","why":"Broadest to most granular: full disk (the entire drive) → volume (a set of selected files/directories) → file (individual files) → record (specific FIELDS within a database record). Partition and database encryption sit in between — database at column/row/table level, record at field level.","multi":false},{"id":"bqssuo","q":"Why is full disk encryption particularly useful against physical theft?","a":"Because the entire hard drive is encrypted whenever the system is off — a stolen laptop yields ciphertext until the decryption key is entered at login","why":"Full disk encryption encrypts the entire hard drive: when the system is OFF the data is encrypted; when the system is on and the user is logged in, the data is decrypted. It's achieved through the OS, third-party software, or the disk device itself — so a powered-off stolen laptop exposes only ciphertext.","multi":false},{"id":"10zinu1","q":"An app needs to encrypt only the D: drive on a shared workstation because it holds sensitive project files, leaving other partitions untouched. Which method fits best?","a":"Partition encryption — encrypts specific partitions while leaving others unencrypted","why":"Partition encryption encrypts only specific partitions of a hard drive, leaving other partitions unencrypted — exactly the D:-drive scenario. Full disk would cover everything; record encryption targets database fields; hashing is one-way and not an at-rest storage-encryption method.","multi":false},{"id":"1wuwl92","q":"Which scenario describes data in use, and why is it hard to secure?","a":"Data being created, retrieved, updated, or deleted — it must be DECRYPTED to be processed, so techniques like application-level encryption, access controls, and secure enclaves are needed","why":"Data in use is actively being created, retrieved, updated, or deleted. It's challenging to protect precisely because the data must be decrypted to be processed. Defenses include application-level encryption, strict access controls, and secure enclaves — protected isolated environments where processing happens.","multi":false},{"id":"5ds5p8","q":"Which pairing of data type and definition is correct?","a":"PII — any information that can be used to identify an individual; PHI — health status, healthcare provision, or payment for healthcare linked to an individual","why":"PII (personal identifiable information) = anything identifying an individual: names, Social Security numbers, addresses. PHI (protected health information) = health status, provision of healthcare, or payment for healthcare linked to a specific individual — protected under HIPAA. PII is the broad identity category; PHI is the health-specific subset.","multi":false},{"id":"114hmig","q":"A company's secret manufacturing process, marketing strategies, proprietary software, and customer lists — information giving it a competitive edge — are BEST described as:","a":"Trade secrets — a type of confidential business information that provides a competitive edge and is protected by law","why":"Trade secrets are confidential business information providing a competitive edge — manufacturing processes, marketing strategies, proprietary software, customer lists. They're protected by law and unauthorized disclosure brings severe legal penalties. IP, by contrast, covers creations of the mind (inventions, artistic works, designs, symbols) protected by patents, copyrights, and trademarks.","multi":false},{"id":"2gwg7u","q":"Which data type is subject to the PCI DSS standard?","a":"Financial information such as sales records, invoices, tax documents, and bank statements","why":"Financial information — sales records, invoices, tax documents, bank statements — is frequently targeted for fraud and identity theft, and is usually subject to regulations like PCI DSS (Payment Card Industry Data Security Standard). Legal information is protected for client confidentiality and legal professional privilege; IP for creativity/innovation.","multi":false},{"id":"14q2qhp","q":"Which statement about non-human-readable data is correct?","a":"It is binary code or machine language — and it still needs protection because it can contain sensitive information","why":"Non-human-readable data requires a machine or software to interpret — binary code, machine language. While it's more challenging to interpret and manipulate, it STILL needs protection because it can contain sensitive information. Human-readable data (text documents, spreadsheets) can be understood directly by people.","multi":false},{"id":"1afx5re","q":"Which laws does the course pair with regulated data?","a":"GDPR in the European Union and HIPAA in the United States","why":"Regulated data is controlled by laws, regulations, or industry standards. The course's examples: GDPR (General Data Protection Regulation) in the EU and HIPAA (Health Insurance Portability and Accountability Act) in the US. Organizations handling regulated data must comply with specific security and privacy requirements.","multi":false},{"id":"b7k5ml","q":"What does data sovereignty mean?","a":"Digital information is subject to the laws of the country in which it is located, collected, or processed — so data must be managed, stored, and processed according to that country's laws","why":"Data sovereignty: information is subject to the laws and governance structures within the nation where it's collected or processed. A company must manage, store, and process data following that country's laws. Cloud computing made this critical because data centers sit in different parts of the world.","multi":false},{"id":"nn51o5","q":"Under GDPR, which organizations must comply, and when does an EU citizen's protection apply?","a":"Any organization dealing with data of EU citizens, regardless of its location; GDPR protections extend to EU citizens while they are within the EU/EEA borders","why":"GDPR grants individuals strong rights over their personal data, applies to ANY organization dealing with EU citizens' data regardless of where that organization is located, and non-compliance means hefty fines. The protection is territorial: it covers EU citizens while they're within the EU/EEA borders — once outside those regions, GDPR no longer protects them.","multi":false},{"id":"1c5wqw7","q":"Which countries does the course cite as having strict data sovereignty laws that REQUIRE data to be stored and processed within national borders?","a":"China and Russia","why":"China and Russia have strict data sovereignty laws requiring companies to store and process data within their national borders — a real challenge for multinationals operating in multiple jurisdictions and using cloud services. Knowing the physical locations of your data centers and cross-border data flows is crucial.","multi":false},{"id":"15ldhd8","q":"A US company with all employees in the Americas wants to reduce unauthorized access risk while complying with sovereignty laws. Which approach does the course's logic support?","a":"Use geographic restrictions (geofencing) — ban login requests from regions like Asia or Africa where employees can never legitimately be logging in from","why":"Geographic restrictions (geofencing) set virtual boundaries to restrict data access based on location: if all employees are in the Americas, ban login requests originating from Asia or Africa. This both prevents unauthorized access from high-risk locations and helps comply with data sovereignty laws.","multi":false},{"id":"1erxuvb","q":"Which statement correctly distinguishes hashing from encryption?","a":"Hashing converts data into a fixed-size hash value and is a one-way function that cannot be reversed or decrypted; encryption transforms plaintext into ciphertext that the decryption key can revert","why":"Hashing converts data into a fixed-size numerical/alphanumeric hash value and is ONE-WAY — once hashed, data cannot be reversed or decrypted. It's used to store passwords and verify file integrity. Encryption is reversible: plaintext becomes ciphertext with an algorithm and key, and the decryption key restores it.","multi":false},{"id":"7ct5kq","q":"A payment system replaces credit card numbers with non-sensitive substitutes while storing the real numbers in a separate secure database. Which technique is this, and what is the substitute called?","a":"Tokenization; the non-sensitive substitutes are called tokens, and they reference the original data","why":"Tokenization replaces sensitive data with non-sensitive substitutes called tokens; the original data is stored securely in a separate database, and the token serves as a reference to it. It's commonly used in payment processing to protect credit card information. Masking, by contrast, permanently replaces field content with placeholders — a one-way de-identification.","multi":false},{"id":"4ziigk","q":"A phone number stored as XXX-XXX-1234 keeps only the last four digits while preserving the field's format. Which technique is this, and which property does it have?","a":"Masking — replacing some or all of a field with placeholders; it is one-way (cannot be reversed) and is a method of de-identification that can retain partial data and the original format","why":"Masking replaces some or all of the data in a field with placeholders (like X) to conceal the original content. It can be done partially — keep the area code or last four digits — while maintaining the original format. Once data is masked it's a one-way process, making masking a method of de-identification.","multi":false},{"id":"1xrfb0a","q":"Which set contains ONLY methods the course lists for securing data?","a":"Geographic restrictions, encryption, hashing, masking, tokenization, obfuscation, segmentation, and permission restrictions","why":"The eight securing-data methods: geographic restrictions (geofencing), encryption, hashing, masking, tokenization, obfuscation, segmentation, and permission restrictions (ACL/RBAC). The other options are social-engineering attacks, insecure code practices, and malware delivery terms — cross-topic distractors.","multi":false},{"id":"1go71vx","q":"What does SEGMENTATION accomplish for data security?","a":"It divides the network into separate segments, each with its own security controls, so a criminal who gains one segment cannot move laterally to the rest — limiting breach damage","why":"Segmentation divides a network into separate segments, each with its own security controls. Even if a cybercriminal gains access to one segment, they cannot move laterally to other parts of the network — limiting the potential damage of a breach.","multi":false},{"id":"lea2so","q":"Which DLP type is installed directly on a workstation or laptop, monitors data in use, and can block a file transfer or alert an admin based on rules?","a":"Endpoint DLP — software on the endpoint that acts like an IDS/IPS focused on data, in detection or prevention mode","why":"Endpoint DLP is software installed on a workstation or laptop monitoring data in use. If someone tries a file transfer, it stops the transfer or alerts an admin based on rules and policies — very much like an IDS or IPS, but focused on data. DLPs can run in detection mode or prevention mode.","multi":false},{"id":"1kkcgr4","q":"Which DLP type sits at the network perimeter and concentrates on data in transit — especially things going OUT of the network?","a":"Network DLP — a software/hardware solution at the perimeter whose sole function is checking data entering and leaving the network","why":"Network DLP is placed at the perimeter of the network; its sole function is checking all data going into and out of the network, with special focus on outbound traffic — detecting data in transit that shouldn't be leaving the building. Endpoint watches the device, storage watches servers, cloud watches SaaS.","multi":false},{"id":"1cnfp0s","q":"At 2:00 a.m., an employee begins downloading large volumes of data from a data-center server. Which DLP type would catch this, and where does it live?","a":"Storage DLP — software installed on the server in the data center that inspects data at rest and flags access at times it shouldn't happen","why":"Storage DLP is software installed on servers in the data center that inspects data while it sits on the server (often because it's been encrypted or watermarked). Someone bulk-downloading data at 2 a.m. is probably against policy — and storage DLP catches it. Network DLP focuses on the perimeter flow, endpoint on the device itself.","multi":false},{"id":"exa77c","q":"Which statement about cloud-based DLP is correct?","a":"It is usually offered as a software-as-a-service solution that is part of your cloud service, protecting data stored inside those cloud services such as Google Drive","why":"Cloud-based DLP systems are usually offered as SaaS and integrated into the cloud service and storage you already use — protecting data when it's stored inside those cloud services (the course's example: Google Drive's DLP as part of Google's cloud offering). It complements rather than replaces endpoint and network DLP.","multi":false},{"id":"avgujk","q":"Why does the course say DLP became essential in the modern era?","a":"Because exfiltration scaled from stealing what a thief could carry, to laptops, external drives, pocket-sized thumb drives holding billions of documents, and finally cloud sync services where someone could upload everything and access it worldwide","why":"The course's exfiltration timeline: filing cabinets (steal only what you can carry) → laptops stolen from cars → external hard drives walked out the door → thumb drives holding billions of documents in a pocket → Dropbox/Google Drive, where an insider can upload everything the company has and reach it from anywhere. Data and IP are the currency of business, so DLP monitors data in use, in transit, and at rest.","multi":false},{"id":"1v9np84","q":"In the Google Workspace DLP demo, what is the purpose of setting a 'likely threshold' to high or very high for data types like SSNs or phone numbers?","a":"To avoid a flood of false positives — a very low threshold blocks lots of things that shouldn't be blocked, so high confidence is recommended for well-defined data types","why":"The threshold defines when actions (logging, alerting, notifying, blocking) start applying. A very low threshold produces a ton of false positives — lots of legitimate content gets flagged or blocked, creating work. For structured, well-defined types like Social Security or phone numbers, the instructor sets high or very high likelihood.","multi":false},{"id":"1xb0dg7","q":"Which sequence matches the course's rule-creation flow in Google Workspace Data Protection?","a":"Name/description → scope (who it applies to) → apps (Chat/Drive, with OCR for uploaded photos) → conditions (predefined data types, text string, regex, or word list) → likelihood threshold → per-app actions → alerting severity → set active","why":"The demo's wizard order: give the rule a name and description ('Block SSNs') → choose the scope (everyone, or specific groups like instructors only) → select apps (Google Chat messages/file uploads — OCR also scans uploaded photos like a picture of an SSN card — and Google Drive) → add conditions (predefined data types per country, text string, regex, or word list) → set the likelihood threshold → define per-app actions (warn/block/audit; block external sharing) → alerting level → review and set active.","multi":false},{"id":"1qsqufa","q":"A manager wants to make sure the codename 'Operation Neptune' never leaves the company. Which DLP condition type fits this best?","a":"A word list or text string match — enter the words 'Operation Neptune' and any message containing them gets flagged or blocked","why":"Conditions can match predefined data types (per-country lists like SSNs, passports, driver's licenses), a text string, a regular expression, or words from a word list. A codename like 'Operation Neptune' has no predefined type — you match it with a word list or text-string condition. OCR helps detect data inside uploaded images.","multi":false},{"id":"1ezhl49","q":"Where does the DLP functionality live inside Gmail, according to the demo?","a":"Under Gmail → Compliance → Content compliance, where you build an outbound rule with predefined content and actions like quarantining the message and notifying the sender","why":"Gmail's DLP lives separately: Apps → Google Workspace → Gmail → Compliance → Content compliance. The demo builds an OUTBOUND rule (they'll accept inbound SSNs but won't send them out), matches predefined US SSN content with a high confidence threshold, and quarantines the message — optionally notifying the sender that it wasn't sent.","multi":false},{"id":"h7b1er","q":"In the DLP demo tool, why did the bare number 123-45-6789 drop to 'unlikely/low' likelihood until the word 'SSN' was typed?","a":"DLP scoring uses context — a formatted nine-digit number alone could be any ID, but the surrounding keyword 'SSN' makes it very likely to be a Social Security number","why":"DLP engines don't just pattern-match — they weigh context. 'SSN 123-45-6789' scored very likely/high; remove the keyword and the same digits become a low/unlikely match (could be an employee ID, any identifier). Adding 'SSN' back raised it again. The demo also showed a malformed 'jason@diontraining' (no TLD) wasn't recognized as an email at all — context and format drive findings.","multi":false},{"id":"1nphivl","q":"A hospital's billing department stores a patient's diagnosis, treatment dates, and insurance payments alongside the patient's name. Which data type is this, and which law protects it?","a":"PHI — health status, provision of healthcare, or payment for healthcare linked to a specific individual, protected under HIPAA","why":"PHI is any information about health status, provision of healthcare, or payment for healthcare that can be linked to a specific individual — including any part of a patient's medical record or payment history. It's protected under HIPAA (the Health Insurance Portability and Accountability Act) in the United States. PII is the broader identity category (names, SSNs, addresses).","multi":false},{"id":"qu5ik6","q":"A student downloads a training company's course videos and re-posts them on his own website as his own content. Which data type has he misappropriated, and through which protection mechanism?","a":"Intellectual property — creations of the mind (inventions, literary and artistic works, designs, symbols) protected by laws like patents, copyrights, and trademarks; the courses are the company's IP","why":"Intellectual property refers to creations of the mind — inventions, literary and artistic works, designs, and symbols — protected by patents, copyrights, and trademarks to encourage innovation and creativity. The company's courses are its IP; unauthorized use can lead to legal action. Trade secrets, by contrast, are confidential business processes giving a competitive edge.","multi":false},{"id":"alnd90","q":"Which data type is the Payment Card Industry Data Security Standard (PCI DSS) most directly concerned with?","a":"Financial information such as transactions, invoices, and bank statements — including cardholder data","why":"Financial information — sales records, invoices, tax documents, bank statements — is often targeted by cyber criminals for fraud or identity theft, so it demands robust protection and is usually subject to regulations like PCI DSS. Legal information instead concerns proceedings, contracts, and compliance data under client confidentiality and legal professional privilege.","multi":false},{"id":"1m2gbze","q":"An auditor argues that compiled binaries on a server need no protection because 'nobody can read machine language anyway.' Which response matches the course?","a":"Non-human-readable data (binary code, machine language) still needs protection because it can contain sensitive information — it's just harder to interpret and manipulate","why":"Human-readable data (text documents, spreadsheets) can be understood directly by people; non-human-readable data (binary code, machine language) requires a machine or software to interpret. While it's more challenging to interpret and manipulate, it STILL needs protection because it can contain sensitive information.","multi":false},{"id":"l42lpp","q":"Which item belongs at the SENSITIVE BUT UNCLASSIFIED level of the government scheme?","a":"A service member's personal medical record — its release won't hurt national security but would impact the individual whose data it contains","why":"Sensitive but unclassified covers medical records, personal files, and similar items whose release won't hurt national security but would impact the people whose data is inside. Blueprints are top secret (gravely damage), deployment plans are secret (seriously damage national security), and press releases are unclassified.","multi":false},{"id":"12tydil","q":"Which pairing of government classification and disclosure harm is CORRECT?","a":"Secret — could seriously damage national security","why":"The escalation of harm language: confidential = could seriously AFFECT the government (e.g., trade secrets); secret = could seriously DAMAGE national security (deployment plans, defensive postures); top secret = could GRAVELY damage national security (weapon system blueprints). SBU harms only the individuals in the data.","multi":false},{"id":"18r19kr","q":"After a breach exposes customer names, SSNs, and health details, regulators ask which role is responsible for ensuring the company complied with privacy frameworks, consent, and data minimization. Which role do they mean?","a":"The data privacy officer — oversees PII, SPI, and PHI, ensures legal/regulatory compliance, purpose limitations, consent, minimization, sovereignty, and retention, and is on the hook for exposed user privacy","why":"The data privacy officer oversees all privacy-related data — PII, SPI, PHI — and is really on the hook when a breach expels user data, because what people care about is the privacy of that data. Their remit: legal and regulatory frameworks, purpose limitations, consent, data minimization, data sovereignty, and data retention.","multi":false},{"id":"syi3gf","q":"A CIO insists her IT team should be the data owners 'since they manage all the systems.' Per the course, what is wrong with this, and what role SHOULD IT play?","a":"IT knows systems, not the data itself; ownership belongs on the business side (e.g., the accounting department's leader for accounting data), while IT should serve as data custodians","why":"The course calls making the CIO or IT department the data owner the WRONG answer: IT personnel don't know the data well enough to classify it correctly — they know systems. Owners should be business-side people with data context (accounting leader for accounting data, software design department for a dev firm). IT's proper role is data custodian.","multi":false},{"id":"qgxr6i","q":"A remote employee on hotel Wi-Fi must access corporate email. Which protection set matches the course's guidance for data in transit?","a":"A VPN tunnel plus SSL/TLS — transport/communication encryption securing data as it moves across the untrusted network","why":"Data in transit (a.k.a. data in motion) is actively moving across networks and is vulnerable to interception en route. Transport/communication encryption methods secure it: SSL/TLS for web and email sessions, VPNs creating secure connections over less-secure networks like the internet, and IPsec authenticating and encrypting each IP packet. At-rest methods (disk encryption, masking, record encryption) don't protect moving data.","multi":false},{"id":"1stxe4r","q":"Why does the course call data in use the most OVERLOOKED and challenging state to secure?","a":"Because the data must be decrypted to be processed — it's exposed during creation, retrieval, updates, and deletion — requiring application-level encryption, access controls, and secure enclaves","why":"Data in use is being created, retrieved, updated, or deleted. It's often overlooked yet just as vulnerable as the other states — and securing it is challenging precisely because the data must be decrypted to be processed. Defenses include application-level encryption, strict access controls, and secure enclaves where processing happens in a protected, isolated environment.","multi":false},{"id":"zkld7c","q":"A test team needs realistic customer records in a non-production database, but real names and card numbers must never be recoverable. Which technique fits, and which property makes it suitable?","a":"Masking — replacing data with placeholders is one-way, preserving format and partial values (like an area code) while de-identifying the record","why":"Masking replaces some or all of a field with placeholders (like X) to conceal the original content, can keep partial data for analysis (e.g., a phone number's area code), and maintains the original format. Crucially, masking is a one-way process — it can't be reversed — making it a method of de-identification, ideal for test data that must never reveal real values.","multi":false},{"id":"1n09wbm","q":"Which sequence shows the course's 'evolution of data theft' that made DLP necessary?","a":"Paper in filing cabinets (steal only what you can carry) → laptops in cars → external hard drives → pocket-sized thumb drives holding billions of documents → cloud sync services where everything can be uploaded and accessed worldwide","why":"The course's timeline: data sat in filing cabinets (a thief could only take what they could carry); then laptops (stolen from cars); then external hard drives (walked out, but large and detectable); then thumb drives (billions of documents in a pocket); then Dropbox/Google Drive — terabytes of storage where an insider can upload everything the company has and reach it anywhere. Data and IP are the currency of business, so DLP watches data in use, in transit, and at rest.","multi":false},{"id":"zj9pio","q":"Which of the following are levels in the GOVERNMENT/MILITARY classification scheme? (Select THREE.)","a":"Secret;  Top secret;  Sensitive but unclassified","why":"The government ladder, lowest to highest: unclassified → sensitive but unclassified (SBU) → confidential → secret → top secret. 'Private' belongs to the COMMERCIAL scheme (public, sensitive, private, confidential) — the classic trap. The last two options are invented.","multi":true},{"id":"tylhjs","q":"Which are legitimate at-rest ENCRYPTION methods named in the course? (Select THREE.)","a":"Full disk encryption;  Database encryption (at column, row, or table level);  Record encryption (specific fields within a record)","why":"The at-rest encryption family: full disk, partition, file, volume, database (column/row/table), and record (field-level). SSL/TLS, IPsec, and VPNs are in-transit communication/tunneling protocols — the standard distractor set for this objective.","multi":true},{"id":"1b8wj50","q":"Which condition types can a DLP rule match on, per the Google Workspace demo? (Select THREE.)","a":"Predefined data types (e.g., U.S. Social Security number);  A regular expression;  Words from a word list (e.g., the codename 'Operation Neptune')","why":"The demo's condition options: match predefined data types (per-country lists — SSNs, passports, driver's licenses, tax IDs), create a text-string match, create a regular-expression match, or match words from a word list (perfect for codenames like 'Operation Neptune'). The biometric and environmental options are nonsense distractors.","multi":true},{"id":"18poerz","q":"Which statements about GDPR are TRUE per the course? (Select THREE.)","a":"It grants individuals strong rights over their personal data;  Any organization dealing with data of EU citizens must comply, regardless of the organization's location;  Non-compliance can result in hefty fines","why":"GDPR has stringent data-protection rules and grants individuals strong rights over personal data; ANY organization handling EU citizens' data must comply regardless of location; and non-compliance brings hefty fines. But its protection is territorial — it extends to EU citizens while they're within the EU/EEA borders, not worldwide forever.","multi":true},{"id":"k68047","q":"A laptop with full disk encryption is stolen from an airport checkpoint. Which condition determines whether the thief can read the data, and what is the BEST organizational takeaway?","a":"Whether the system was powered off — with the system off, FDE keeps the whole drive encrypted until the decryption key is entered; powered-on/logged-in machines expose decrypted data","why":"Full disk encryption encrypts the entire hard drive: off = encrypted, on and logged in = decrypted. So a powered-off stolen laptop yields only ciphertext, while a stolen logged-in machine may expose readable data. The BEST takeaway: shut systems down (not just sleep/lock) before travel, because FDE's protection hinges on the powered-off state.","multi":false},{"id":"q3em7l","q":"A multinational must satisfy EU data sovereignty expectations while blocking credential-stuffing logins from high-risk regions. Which single course technique addresses BOTH goals, and how?","a":"Geographic restrictions (geofencing) — virtual boundaries that restrict access by location, preventing logins from disallowed regions and helping comply with sovereignty laws","why":"Geographic restrictions (geofencing) set virtual boundaries to restrict data access based on geographic location. Banning logins from regions where employees can never legitimately be both prevents unauthorized access from high-risk locations AND helps the organization comply with data sovereignty laws — one technique, both goals.","multi":false},{"id":"428zxz","q":"Which of the following data-securing techniques is REVERSIBLE, unlike the others?","a":"Encryption — ciphertext can be reverted to plaintext by anyone holding the corresponding decryption key","why":"Encryption transforms readable plaintext into unreadable ciphertext using an algorithm and key — and only those with the corresponding decryption key can revert it. Hashing is a one-way function (cannot be reversed or decrypted), and masking is a one-way de-identification process. 'Reversible with the key' is the encryption giveaway.","multi":false},{"id":"10kqlyc","q":"A security engineer must protect a column of salary values inside a shared HR database where some auditors may see names but never salaries. Which at-rest method is MOST precise for this requirement?","a":"Record encryption — encrypting specific fields within a database record, so the salary field stays hidden from users who share the database but lack view rights","why":"Record encryption encrypts specific FIELDS within a database record — designed for exactly this: multiple users accessing the same database without the same view rights, so some fields stay encrypted from some users. Database encryption works at column/row/table level; record goes field-level for the finest granularity.","multi":false},{"id":"v58ws8","q":"A vendor processing data for a hospital causes a breach. The hospital insists the VENDOR is solely accountable because the vendor 'touched the data.' Per the course, which analysis is correct?","a":"The hospital, as data controller, holds ultimate accountability for privacy breaches and cannot delegate it — hiring a processor does not transfer that responsibility","why":"The data controller decides the purposes and methods of data storage, collection, and usage, and guarantees the legality of these processes. The controller holds ultimate accountability for any breach of privacy and CANNOT delegate this responsibility — even when a data processor it hired mishandles the data.","multi":false},{"id":"ssem87","q":"Which argument BEST justifies assigning data ownership to department leaders rather than the IT team?","a":"IT personnel know systems but not the data's business context; only the business side can classify data correctly and set meaningful protection rules — IT should act as custodians instead","why":"The course is explicit: making CIO/IT the data owner is the wrong answer because IT knows systems, not data. An IT person looking at accounting data can't classify it properly. Owners should come from the business side — accounting's leader for accounting data, the software design department for a dev firm, the CFO for financial data — with IT as custodians enforcing the owner's technical requirements.","multi":false},{"id":"3rag4m","q":"An EU citizen on a business trip to South America asks why her GDPR rights no longer seem to apply to her data processing. Which explanation matches the course?","a":"GDPR protections extend to EU citizens while they are within the EU/EEA borders; once outside those regions, they are no longer protected by GDPR","why":"The course is specific: GDPR protections extend to any EU citizen while they're within the EU or EEA borders. Once outside those regions, they're no longer protected by GDPR. Meanwhile, any ORGANIZATION dealing with EU citizens' data must comply with GDPR regardless of the organization's own location — the citizen's territorial protection and the organization's obligation are two different things.","multi":false},{"id":"rf5yfp","q":"A DLP appliance is placed at the network edge and flags an engineer uploading the customer database to a personal cloud account. Which DLP type caught this, and what is its focus?","a":"Network DLP; a perimeter solution whose sole function is checking data entering and leaving the network — with special focus on outbound traffic that shouldn't leave","why":"Network DLP is a software/hardware solution placed at the perimeter of the network. Its sole function is checking all data going into and out of the network, with a special focus on things going OUT — detecting data in transit that shouldn't be leaving the building. The engineer's upload is exactly the outbound exfiltration it exists to catch.","multi":false},{"id":"190a39u","q":"While tuning a DLP, an admin sets every rule's likelihood threshold to 'very low' to 'be safe.' What is the MOST likely operational result, per the course?","a":"A flood of false positives — lots of content blocked or flagged that shouldn't be, creating heavy review workload; the demo recommends high or very high thresholds for well-defined types like SSNs and phone numbers","why":"The likelihood threshold defines when actions (logging, alerting, notifying, blocking) start applying. Set it very low and 'you are going to get a ton of false positives and lots of things are going to be blocked that shouldn't be blocked.' For structured data types like Social Security numbers or phone numbers, the instructor recommends high or very high — sometimes medium — never very low.","multi":false},{"id":"1pg217m","q":"A company wants Gmail to hold outbound messages containing U.S. Social Security numbers for review while telling the sender what happened. Which configuration matches the demo?","a":"An outbound rule in Gmail → Compliance → Content compliance matching predefined U.S. SSN content with a high confidence threshold, whose action quarantines the message and notifies the sender","why":"Gmail DLP lives under Apps → Google Workspace → Gmail → Compliance → Content compliance. The demo built an OUTBOUND rule ('if somebody wants to send ME an inbound SSN, we'll accept it, but we're not going to be responsible for sending those out'), matched predefined US SSN content at a high threshold, and set the action to quarantine the message — optionally notifying the sender that the mail wasn't sent.","multi":false},{"id":"1f6b8cq","q":"Which statement is the LEAST accurate description of the data steward role?","a":"They are the senior executive ultimately responsible for the asset's confidentiality, integrity, and availability — that describes the data owner, not the steward","why":"The data steward works for the data owner, focuses on data quality and metadata, and makes sure data actually gets labeled and classified appropriately. Ultimate CIA responsibility belongs to the data OWNER — the senior executive. Options 1, 2, and 4 accurately describe the steward; option 3 describes the owner, making it the LEAST accurate description of the steward.","multi":false},{"id":"1gof6jm","q":"Which technique pairing is MISMATCHED?","a":"Tokenization — permanently replacing field content with placeholders in a one-way process","why":"That description belongs to MASKING. Tokenization replaces sensitive data with non-sensitive TOKENS while the original is stored securely in a separate database — the token is a reference, not a permanent placeholder. Geofencing, segmentation, and permission restrictions (ACL/RBAC) are all correctly matched.","multi":false},{"id":"fxsmfx","q":"Which of the following are among the course's SIX data ownership roles? (Select THREE.)","a":"Data owner;  Data steward;  Data privacy officer","why":"The six roles: data owner (senior executive), data controller (non-delegable accountability), data processor (hired hands), data steward (quality/labeling), data custodian (system managers/sysadmins), and data privacy officer (PII/SPI/PHI oversight). The last three options are invented titles designed to sound plausible.","multi":true},{"id":"m0s4j7","q":"Which statements about MASKING are TRUE? (Select THREE.)","a":"It replaces some or all of a field's data with placeholders such as X;  It can preserve partial data (like a phone number's area code) and the original field format;  It is a one-way process — once masked, it cannot be reversed, making it a method of de-identification","why":"Masking replaces field content with placeholders, can keep partial values and format (XXX-XXX-1234), and is one-way — a de-identification method. Options 4 and 5 describe tokenization and encryption respectively; option 6 describes transport security. Masking vs. tokenization vs. encryption is a favorite CompTIA distinction.","multi":true},{"id":"qqeaas","q":"Which facts about DATA SOVEREIGNTY are TRUE per the course? (Select THREE.)","a":"Information is subject to the laws of the nation where it is collected or processed;  China and Russia require companies to store and process data within their national borders;  Organizations must know the physical locations of their data centers and the flow of data across borders","why":"Sovereignty: data is subject to the laws of the nation where collected/processed; China and Russia mandate in-country storage and processing; and organizations must know their data centers' physical locations and cross-border flows, ensuring data is not illegally transferred from a privacy jurisdiction without consent. Cloud computing made sovereignty MORE complex, not less — and multinationals feel it most.","multi":true},{"id":"jopx8l","q":"Which actions were available when configuring the Google Workspace 'Block SSNs' DLP rule? (Select THREE.)","a":"Warn the user that their content may be sensitive;  Block the message or the external sharing of the file;  Audit — log the event and notify administrators","why":"For Google Chat, the demo's action choices were to warn the user, block the message, or audit (log it and tell system administrators). For Google Drive: block external sharing, warn on external sharing, or disable download/print/copy for commenters and viewers. Severity-based alerting to the security dashboard and alert center accompanied these. The confiscation/deletion/network options are absurd distractors.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
