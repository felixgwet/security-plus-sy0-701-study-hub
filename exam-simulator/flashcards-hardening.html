<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #f0883e; --accent-dim: rgba(240,136,62,.14);
    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }

  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }

  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }

  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }

  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }

  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }

  <script>
    var DECKS = [{"label":"Section 19 · Hardening","cards":[{"id":"1i81xaf","q":"An auditor finds a server where a malicious service was stopped two weeks ago, yet it is running again today. Which hardening action was skipped?","a":"The service was only stopped; its startup type was never changed to Disabled","why":"Stopping a service halts it only until reboot. To prevent recurrence, set the startup type to Disabled (services.msc) — the exam's favorite services trap.","multi":false},{"id":"zz2vc","q":"A company wants the strongest control over which programs run on its workstations, accepting higher administrative effort. Which approach fits?","a":"Application allowlisting — deny by default, permit only approved software","why":"Allowlisting is the most secure (everything blocked except approved apps) but must be updated with each app change. Blocklisting is easier but allows unknown new software.","multi":false},{"id":"1ffx5l3","q":"Which change BEST follows secure-defaults practice for a device that only serves encrypted web pages?","a":"Close port 80 (HTTP) so only port 443 (HTTPS) remains open","why":"Defaults open extra ports for compatibility (80+443, 22+23). If only HTTPS is needed, close the plaintext port — and never keep Telnet (23) available.","multi":false},{"id":"1r7v8dk","q":"A patch was released Monday for a critical remote code execution flaw. By Wednesday, attacks exploiting it are in the wild. What explains the rapid weaponization?","a":"Attackers reverse-engineered the patch to rediscover the vulnerability and built an exploit","why":"Released patches are reverse-engineered within days, producing exploits for unpatched systems. Hence hotfixes should be tested and deployed immediately.","multi":false},{"id":"m0qhyv","q":"An administrator plans to deploy a new patch to 12,000 endpoints. Which strategy limits the impact if the patch breaks applications?","a":"Use patch rings — small pilot groups first, expanding only after success","why":"Patch rings (10–20 machines, then 50–100 including admins/service desk, then 1,000–2,000, then all) contain failures to a tiny group and protect the service desk.","multi":false},{"id":"9u05jc","q":"In the AppLocker wizard, an admin wants to block a specific known malware sample that has a published digest. Which rule condition applies?","a":"File hash","why":"Hash rules match the file's digest regardless of name/location. Publisher rules trust signing certificates; path rules restrict folders (e.g., %WINDIR%Temp*).","multi":false},{"id":"12jhykn","q":"SELinux is set to Permissive mode. What is the security effect?","a":"Policies are logged but not enforced — useful for tuning before going Enforcing","why":"Permissive = enabled, violations recorded in the audit log, nothing blocked. Disabled = SELinux off (DAC only); Enforcing = policies applied.","multi":false},{"id":"oj2wzz","q":"Which SELinux policy is the default on Red Hat/CentOS, and what does it do?","a":"Targeted — only selected (targeted) processes run confined; everything else is unconfined","why":"Targeted confines only the processes you choose to protect. Strict enforces MAC on everything and is genuinely hard to configure.","multi":false},{"id":"1c9pq2f","q":"A hospital needs an operating system whose security controls are certified to a very high assurance level for a medical device. Which example and level fit?","a":"Integrity-178B — EAL6, used in military aircraft and medical/avionics embedded systems","why":"EAL6 requires rigorous, purpose-built evaluation — found in embedded systems like Integrity-178B (F-35, B-2, Airbus A380). Mainstream OS top out at EAL4/EAL4+.","multi":false},{"id":"h3o2lh","q":"Why does patch management support COMPLIANCE efforts?","a":"Auditors check how well known CVEs with available patches are actually patched","why":"A major compliance checkpoint is the effectiveness of patch management against known CVEs. It also adds security, uptime and features.","multi":false},{"id":"161c6rd","q":"Which encryption approach protects data on a stolen laptop even if the drive is moved to another machine?","a":"Full-disk encryption such as BitLocker or FileVault with a boot PIN/password/key","why":"FDE encrypts the whole drive; a PIN/password/key is required at boot, and the data stays encrypted if the drive is removed. Other levels protect narrower scopes.","multi":false},{"id":"1m6ja89","q":"An admin encrypts only the partition holding sensitive documents and leaves the OS partition unencrypted to reduce overhead. This is:","a":"Partition encryption (e.g., VeraCrypt on one partition)","why":"Partition encryption covers one partition only — a deliberate granularity/performance trade-off. FDE covers the entire device; volumes are containers; TDE covers whole databases.","multi":false},{"id":"w3p1rq","q":"Which THREE are elements of an effective patch management program? (Choose THREE.)","a":"Triage patches as urgent, important, or non-critical;  A lab or test environment to validate patches before production;  Detailed logs of patching activity for evaluation and monitoring","why":"The program covers tracking, automation, cloud resources, triage, lab testing, logging, firmware updates, emergency CAB-approved pushes, and periodic combined rollouts.","multi":true},{"id":"nqidbl","q":"Which TWO statements about mandatory vs. discretionary access control are correct? (Choose TWO.)","a":"In MAC, access is determined by administrator-defined policy and enforced by the OS;  In DAC, the object owner controls access (e.g., chown/chmod in Linux)","why":"MAC = system-enforced policy, even the data owner cannot override (SELinux, trusted OS). DAC = owner discretion. SELinux explicitly does NOT allow DAC.","multi":true},{"id":"1wxr8ds","q":"Which THREE pairs of insecure→secure service replacements are correct? (Choose THREE.)","a":"HTTP (80) → HTTPS (443);  SMTP (25) → SMTPS (587 or 465);  Telnet (23) → SSH (22)","why":"Hardening means shifting from plaintext protocols to encrypted ones. Downgrading to Telnet/HTTP or replacing SSH with Telnet moves the wrong direction.","multi":true},{"id":"a3tdxf","q":"Which TWO are SELinux contexts? (Choose TWO.)","a":"User context — which users can access an object;  Type context — the MAC label grouping objects with similar security requirements","why":"The three main contexts are User, Role, and Type (Type being most important), plus an optional Level for multi-level security.","multi":true},{"id":"uit52m","q":"A new SOHO router ships with admin/admin credentials. What is the FIRST hardening step?","a":"Change the default credentials immediately (and add MFA if supported)","why":"Default credentials are published in manuals and attacker lists. Change them immediately; use long/strong/unique passwords rotated ~90 days, plus MFA where available.","multi":false},{"id":"v0dolb","q":"Why should port 23 be closed on a hardened device?","a":"Telnet is completely insecure — all communications are unencrypted","why":"Port 23 = Telnet, which sends everything in plaintext. Use SSH (22) instead and close 23.","multi":false},{"id":"jd3516","q":"Which secure replacement for plaintext email submission should replace SMTP on port 25?","a":"SMTPS on port 587 or 465","why":"Shift services to encrypted versions: HTTP(80)→HTTPS(443), SMTP(25)→SMTPS(587/465).","multi":false},{"id":"1su7430","q":"Every open, active port on a system:","a":"Acts as a potential opening for an attacker and grows the attack surface","why":"Audit ports/protocols and disable unneeded ones; each open port is an entry point. Minimizing them reduces attack probability.","multi":false},{"id":"4mj0lw","q":"A device ships with both ports 80 and 443 open 'for compatibility.' If only secure web traffic is needed, what should be done?","a":"Close port 80 so only the encrypted HTTPS port 443 remains","why":"Manufacturers open extra ports for maximum compatibility; close the insecure port (80/HTTP) when only the secure one (443/HTTPS) is required.","multi":false},{"id":"14b8jv5","q":"Configuring a system to run only the essential applications and services a user needs is called:","a":"Least functionality","why":"Least functionality = restrict unneeded applications, services, ports and protocols to only what the user requires.","multi":false},{"id":"v376tk","q":"With application allowlisting:","a":"Only explicitly approved applications may run; everything else is blocked","why":"Allowlisting = deny by default; only listed apps run. It is the most secure approach (like an explicit allow ACL at the app level).","multi":false},{"id":"5bma6k","q":"Why do many companies choose blocklisting over allowlisting despite it being less secure?","a":"Allowlisting is harder to manage — every application update requires updating the list","why":"Allowlists must be updated for every app version change. Blocklists are easier but allow everything except listed items, so new malware runs until a rule is added.","multi":false},{"id":"19op1xn","q":"How are application allow/block lists deployed across a Windows domain?","a":"Through the Active Directory domain controller using group policies","why":"AD group policies centrally manage and deploy allow/block lists (e.g., AppLocker rules) to all domain machines.","multi":false},{"id":"1eqcpar","q":"An admin stops a malicious Windows service, but it restarts after reboot. What was missed?","a":"The startup type must be set to Disabled, not merely stopped","why":"Stopping only halts the service now; it still starts automatically at boot. Set startup type to Disabled in services.msc to kill it permanently.","multi":false},{"id":"1ki4ee6","q":"Which command stops the Windows Update service (wuauserv) from the command line?","a":"sc stop wuauserv or net stop wuauserv","why":"Windows: sc stop / net stop. Enterprises disable the service so patches are pushed by the patch-management system instead of Windows Update.","multi":false},{"id":"1foun9q","q":"On a Linux system, which command pair views running processes and then terminates a specific one?","a":"top then kill \u003cPID>","why":"top lists running processes (with PIDs); kill \u003cPID> terminates the chosen process. Also works on macOS.","multi":false},{"id":"12a4o0z","q":"A trusted operating system primarily enforces which access control model?","a":"Mandatory access control (MAC) enforced by the OS, which even the data owner cannot override","why":"TOS systems enforce MAC: access is decided by administrator-defined policy and enforced by the OS — not by the data owner's discretion (which is DAC).","multi":false},{"id":"1upirw1","q":"Integrity-178B — the OS used in F-16, F-22, F-35 and B-2 aircraft — is rated at which Common Criteria level?","a":"EAL6","why":"Integrity-178B is EAL6. Generic OS (Windows 7+, macOS 10.6+, many Linux) achieve EAL4/EAL4+; EAL6/7 require embedded, purpose-built systems.","multi":false},{"id":"1ve2qhi","q":"Why do trusted operating systems use microkernels?","a":"A microkernel minimizes the trusted computing base (TCB), shrinking the attack surface","why":"The TCB is everything critical to security that must be trusted. Minimizing it with a microkernel reduces vulnerabilities.","multi":false},{"id":"1sg2ts9","q":"SELinux carries which Common Criteria rating?","a":"EAL4+","why":"SELinux systems are rated EAL4+ — a methodically designed, tested, reviewed assurance level typical of mainstream OS.","multi":false},{"id":"j5jb95","q":"Which type of patch addresses a security issue and should be applied immediately after lab testing?","a":"A hotfix","why":"Hotfix = security patch, apply ASAP after testing. Updates add features (and can introduce new vulnerabilities); service packs bundle large numbers of hotfixes and updates.","multi":false},{"id":"19ppi6d","q":"What is a service pack?","a":"A bundle of hundreds or thousands of hotfixes and updates rolled into one installer","why":"Service packs (e.g., Windows XP SP3) consolidate all hotfixes/updates since the OS release into one installer.","multi":false},{"id":"wvshq7","q":"Why must patches be deployed quickly after release?","a":"Attackers reverse-engineer released patches within days to build exploits against unpatched systems","why":"Reverse engineering of patches yields working exploits in days. Most headline breaches trace back to a missing patch on an otherwise fixable system.","multi":false},{"id":"1nn6a2l","q":"What are the four steps of the patch management process, in order?","a":"Planning, testing, implementing, auditing","why":"Plan (track/verify/triage) → Test (in a lab, since patches can break unique configs) → Implement (manual or automated deployment) → Audit (verify installation).","multi":false},{"id":"3pye0p","q":"What is the purpose of 'patch rings'?","a":"To stage deployments to small groups first, limiting the blast radius if a patch breaks systems","why":"Rings: 10–20 machines, then 50–100 (admins/service desk), then 1,000–2,000, then the rest. Problems surface early on small groups instead of 10,000+ machines.","multi":false},{"id":"j4tkdq","q":"How should mobile devices receive patches in an enterprise?","a":"Through an MDM (Mobile Device Manager)","why":"MDM implements patching for mobile fleets, just as patch-management tools cover workstations, servers and cloud resources.","multi":false},{"id":"1cpy99j","q":"Why do large organizations disable the Windows Update service on endpoints?","a":"So patches are tested and distributed through a centrally managed update server instead of installing automatically","why":"Central update management lets the organization test patches before deployment — automatic endpoint updates bypass that control.","multi":false},{"id":"j4vq7n","q":"Which command opens the local Group Policy Editor on Windows?","a":"gpedit","why":"Run gpedit for the local Group Policy Editor; domain controllers offer an advanced version for domain-wide GPOs.","multi":false},{"id":"1or4yg4","q":"In AppLocker, which THREE rule conditions can an administrator use for allow/deny rules?","a":"Publisher, path, and file hash","why":"AppLocker rules key off publisher (block a compromised vendor's signed code), path (e.g., block %WINDIR%Temp*), and file hash (block a known malware digest).","multi":false},{"id":"qwp9e8","q":"What is baselining?","a":"Measuring changes to establish what normal is, so deviations can be identified and investigated","why":"Baselines define normal (e.g., typical Saturday traffic). A spike above baseline — like unusual exfiltration — gets investigated. Deviations are categorized as expected or issues.","multi":false},{"id":"1p0baj0","q":"SELinux was originally developed by which organization?","a":"The NSA","why":"SELinux (Security-Enhanced Linux) was created by the National Security Agency and ships by default on CentOS/Red Hat.","multi":false},{"id":"4hy5oo","q":"Which SELinux mode logs policy violations but does NOT enforce them?","a":"Permissive","why":"Permissive = enabled but not enforced — ideal for tuning policies before switching to Enforcing. Disabled turns SELinux off entirely (DAC only).","multi":false},{"id":"gbnba8","q":"What is the difference between a targeted and a strict SELinux policy?","a":"Targeted confines only selected (targeted) processes; strict enforces MAC on every subject and object","why":"Targeted (the RHEL/CentOS default) confines only targeted processes in a confined domain; strict applies MAC system-wide and is very hard to set up.","multi":false},{"id":"1htomn9","q":"Which SELinux context is considered the most important for fine-grained access control?","a":"Type","why":"The Type context is the label portion of MAC and groups objects with similar security requirements. Optional fourth context: Level (multi-level security).","multi":false},{"id":"vntvwf","q":"Which tool provides full-disk encryption on Windows?","a":"BitLocker","why":"BitLocker encrypts the entire Windows drive (PIN/password/key at boot); FileVault is the macOS equivalent. Hardware FDE also exists.","multi":false},{"id":"f3qme5","q":"Which encryption level uses VeraCrypt to create an encrypted container of a chosen size that can layer on top of full-disk encryption?","a":"Volume encryption","why":"Volume encryption creates a flexible encrypted container (VeraCrypt), often as a second layer over FDE. Partition encryption covers one whole partition; file encryption (GPG) covers individual files.","multi":false},{"id":"mtt52q","q":"SQL Server Transparent Data Encryption (TDE) is an example of which encryption level?","a":"Database-level","why":"TDE encrypts the entire database across storage devices/cloud with no application changes. Record-level encryption instead targets only sensitive rows/columns (e.g., credit cards, SSNs).","multi":false},{"id":"1yyxogd","q":"Which frameworks are commonly used as starting points when defining a secure baseline?","a":"ISO 27001 and NIST SP 800-53","why":"Baselines start from best practices, standards and compliance requirements such as ISO 27001 and NIST SP 800-53.","multi":false},{"id":"1yfhw0m","q":"In a Windows domain, which mechanism applies a secure baseline (password policy, user rights, audit settings) across all computers?","a":"Group Policy Objects (GPOs)","why":"GPOs enforce baseline policies domain-wide. In AWS, AWS Config plays the analogous role for cloud resources.","multi":false},{"id":"1jd1q5u","q":"What is the FIRST stage of building a secure baseline for a new laptop model?","a":"Assess the system/data/workflows/threats and build, secure, and scan a template machine","why":"Establish (assess + build template + scan + install role apps + rescan → image) → Deploy (GPOs/tools) → Maintain (lockdown, monitoring, updates, training).","multi":false},{"id":"skjrx8","q":"Which practice maintains a secure baseline over time?","a":"Continuous monitoring for deviation with alerts to the SOC, plus periodic reviews and user training","why":"Baselines are maintained by locking systems down, monitoring for deviations that trigger SOC remediation, periodic reviews against evolving threats, and user awareness.","multi":false},{"id":"owzhg7","q":"Why should old software versions (e.g., a previous year's video editor) be uninstalled after upgrading?","a":"Older versions keep their vulnerabilities and must either be patched or removed","why":"Every installed app adds code and must be managed/patched. Old versions left behind retain vulnerabilities — uninstalling eliminates them.","multi":false},{"id":"1xky5ro","q":"What is the security rationale for disabling unnecessary services?","a":"They consume resources and increase the attack surface, making the system more susceptible to attack","why":"Unneeded services consume resources, introduce vulnerabilities, and widen the attack surface. Disable anything not required.","multi":false},{"id":"b26sh6","q":"What is the PRIMARY security problem with default configurations as shipped by manufacturers?","a":"They are configured for easy setup and compatibility, not security — default passwords and extra open ports invite attack","why":"Factory settings favor quick deployment: known default credentials and unnecessarily open ports. Changing them is the first and most formidable line of defense.","multi":false},{"id":"f8wjxx","q":"Which action reduces the attack surface when only encrypted email submission is required?","a":"Disable plain SMTP on port 25 and move to SMTPS on 587/465","why":"Replace insecure protocols with their encrypted versions wherever available — the core of default-configuration hardening.","multi":false},{"id":"1jkpc1v","q":"A helpdesk report shows hundreds of unapproved games and tools installed across the fleet. Which preventive control directly stops this?","a":"Application allowlisting enforced through group policy","why":"Allowlisting permits only approved software and blocks everything else by default — deployed centrally via AD group policies.","multi":false},{"id":"1x517pi","q":"Which is the MAIN drawback of application allowlisting compared with blocklisting?","a":"Management overhead — every application update changes the code and must be reflected in the list","why":"Allowlists are the most secure option but demand constant upkeep as apps update. That is why many orgs settle for blocklists despite weaker protection.","multi":false},{"id":"1mtrys5","q":"Which tool would an administrator use to disable a service permanently on a Windows server?","a":"services.msc, setting the startup type to Disabled","why":"services.msc controls startup type (Manual/Automatic/Disabled). Stopping alone leaves it set to restart at boot.","multi":false},{"id":"xi6587","q":"Which pair correctly matches an OS to its full-disk encryption tool?","a":"Windows — BitLocker; macOS — FileVault","why":"BitLocker (Windows) and FileVault (macOS) are the built-in FDE tools; both demand a PIN/password/key at boot and protect removed drives.","multi":false},{"id":"1temajf","q":"What does a microkernel contribute to a trusted operating system?","a":"A minimized trusted computing base, reducing attack surface and vulnerability likelihood","why":"The TCB comprises everything that must be trusted to work correctly; shrinking it via microkernel architecture reduces what can fail or be exploited.","multi":false},{"id":"nawudu","q":"Why should updates (feature updates) be treated with more caution than hotfixes from a security perspective?","a":"Updates add new code and functionality, which can introduce new vulnerabilities requiring future hotfixes","why":"Hotfixes close security holes; updates add features — and new code can open new holes. Both go through testing, but their risk profiles differ.","multi":false},{"id":"dei2x","q":"In which phase of patch management would an organization deploy a pilot ring of 10–20 machines?","a":"Testing","why":"Pilot groups (patch rings) are the testing stage — proving the patch safe on small groups before mass implementation.","multi":false},{"id":"7ij9f9","q":"Which AWS service helps define and deploy secure configurations across cloud resources, analogous to GPOs in a Windows domain?","a":"AWS Config","why":"AWS Config defines/deploys secure baseline configurations for cloud resources, just as GPOs apply baselines across domain computers.","multi":false},{"id":"1oftj9n","q":"An admin wants SELinux to record what would be blocked WITHOUT breaking production apps while tuning policies. Which mode?","a":"Permissive","why":"Permissive logs violations without enforcing, letting you fine-tune profiles before flipping to Enforcing.","multi":false},{"id":"1wcyqti","q":"Which encryption level is MOST granular for protecting only credit-card and SSN columns in a customer database?","a":"Record-level (column) encryption","why":"Record-level encryption targets individual rows/columns — the finest granularity. TDE encrypts the whole database; FDE the whole disk.","multi":false},{"id":"wdi3yp","q":"Why is baselining important to security operations?","a":"It defines normal behavior so anomalies (like a Saturday traffic spike from data exfiltration) stand out for investigation","why":"Baselining measures change and establishes 'normal' — many breaches are found by investigating abnormal utilization patterns against the baseline.","multi":false},{"id":"19qvp4t","q":"Which statement about firmware management is TRUE?","a":"Switches and routers run firmware (e.g., Cisco IOS) that must be flashed/updated just like OS patching, with many CVEs published against it","why":"Network gear runs firmware with its own CVEs; centralized tools (Cisco UCS Manager, third-party device managers) handle firmware management at scale.","multi":false},{"id":"1jfmpco","q":"Which THREE items should be changed or closed when hardening a new device's default configuration? (Choose THREE.)","a":"The default administrative password;  Port 23 (Telnet);  Unneeded open ports such as unused HTTP/HTTPS duplicates","why":"Change default credentials, disable unneeded ports/protocols (close Telnet/23, drop unused 80), and prefer encrypted service versions. Contracts and warranties are not configurations.","multi":true},{"id":"1dakoiy","q":"Which THREE are benefits of a patch management program? (Choose THREE.)","a":"Fixing known vulnerabilities (security);  Increasing uptime by preventing resource exhaustion and crashes;  Supporting compliance against known CVEs","why":"Patch management delivers security, uptime, compliance, and features — but patches themselves can contain bugs, which is why testing exists.","multi":true},{"id":"5oicbv","q":"Which TWO correctly describe SELinux? (Choose TWO.)","a":"It implements mandatory access control in the Linux kernel;  It was created by the NSA and ships by default on CentOS/Red Hat","why":"SELinux = NSA-created MAC implementation for Linux; default context schemes on RHEL/CentOS alongside AppArmor. Permissive logs only; Enforcing blocks.","multi":true},{"id":"1d35y90","q":"Which TWO are methods of restricting applications on a system? (Choose TWO.)","a":"Allowlisting — only approved apps run;  Blocklisting — known-bad apps are prevented from running","why":"Allowlist (deny-by-default, most secure) and blocklist (allow-by-default, easier) are the two restriction models; domain GPOs deploy them centrally.","multi":true},{"id":"1cf5txt","q":"An enterprise manages 10,000 machines across four countries. Which combination BEST prevents unapproved software at scale while keeping management feasible?","a":"A secure baseline image plus application allowlisting rules pushed via Active Directory group policies (e.g., AppLocker)","why":"Baseline images standardize the starting state, and GPO-delivered AppLocker allowlists enforce only approved executables — centrally, at scale.","multi":false},{"id":"f68x69","q":"A security engineer must choose an SELinux mode for initial deployment on a production RHEL server. The team needs full protection immediately but wants violations recorded for tuning. Which configuration satisfies both?","a":"Enforcing mode with audit-log review of violations","why":"Enforcing applies the policies while the audit log captures violations for tuning. Permissive is the tuning phase; Strict is too complex for initial deployment; Disabled is no protection.","multi":false},{"id":"ebx2be","q":"Which statement about the Common Criteria EAL scale is TRUE?","a":"EAL7 is the highest assurance; mainstream OS reach EAL4/EAL4+, while EAL6+ is reserved for purpose-built embedded systems","why":"EAL1 (lowest) to EAL7 (highest). Integrity-178B = EAL6 (aircraft). Windows 7+, macOS 10.6+, SELinux = EAL4+ — costly to go higher.","multi":false},{"id":"fr3ucn","q":"An org needs to encrypt its SQL Server database spanning multiple storage arrays, with NO changes to the applications that use it. Which solution fits?","a":"Transparent Data Encryption (TDE) — database-level encryption handled by the database engine itself","why":"TDE encrypts the entire database transparently — the DB engine handles encryption/decryption, so applications need no changes. File tools can't span arrays.","multi":false},{"id":"kzpj3y","q":"During an incident, responders must stop a rogue service on a Linux server quickly from the terminal. Which sequence is correct?","a":"top to identify the PID, then kill \u003cPID>","why":"On Linux/macOS: top lists processes; kill \u003cPID> terminates the chosen one. (net stop/sc stop are the Windows equivalents.)","multi":false},{"id":"11sk9ql","q":"Why is a hotfix typically deployed faster than a regular update in a mature patch management program?","a":"Hotfixes close security holes that attackers reverse-engineer within days, so they are triaged as urgent and fast-tracked (with lab testing and CAB emergency approval where needed)","why":"Hotfix = security issue = urgent triage, expedited testing, and an emergency change path. Testing is never skipped; speed comes from prioritization.","multi":false},{"id":"1kpf4h7","q":"A baseline review shows users can still install software and modify configurations on their machines. Which maintenance practice closes this gap?","a":"Locking down systems so users cannot install software or change baseline configurations","why":"Maintaining a baseline includes locking systems down, continuous deviation monitoring with SOC alerts, periodic reviews, and user training.","multi":false},{"id":"1yoea08","q":"Which context-based permission scheme runs on SUSE/openSUSE as an alternative to SELinux, and what model do both implement?","a":"AppArmor — both implement MAC (mandatory access control)","why":"SELinux and AppArmor are the two Linux context-based MAC schemes. Linux's default scheme without them is DAC (owner-controlled chown/chmod).","multi":false},{"id":"laknuf","q":"A company's Saturday network baseline is normally near zero, but monitoring shows a huge spike this Saturday. What should happen per baselining practice?","a":"Treat it as a deviation, categorize it as expected or an issue, and investigate (such spikes have exposed data exfiltration)","why":"Baselining exists to flag abnormal patterns. Every deviation is categorized — acceptable/expected or an issue worth investigating.","multi":false},{"id":"1wscic3","q":"Which scenario BEST justifies choosing a trusted operating system over a mainstream one?","a":"A military avionics or medical device where integrity/confidentiality are critical and a certified, high-EAL, MAC-enforcing embedded OS is required","why":"TOS systems (EAL6/7, MAC, minimized TCB) serve environments where failure is catastrophic — aircraft, medical devices — at significant cost and design effort.","multi":false},{"id":"37wcec","q":"Which layered encryption design offers defense in depth for a laptop holding very sensitive data?","a":"Full-disk encryption (BitLocker) PLUS an encrypted VeraCrypt volume for the most sensitive files","why":"FDE protects the whole device if stolen; a volume container adds a second layer for the crown-jewel data. Granular choices balance security vs. the overhead encryption adds.","multi":false},{"id":"1xi7xox","q":"An auditor asks how the organization verifies that deployed patches actually installed. Which patch management step answers this?","a":"Auditing — scanning the network to confirm installation and find unexpected failures","why":"Auditing verifies post-deployment state: scanning shows whether patches are present and flags failures — typically via Endpoint Configuration Manager or third-party tools.","multi":false},{"id":"5ggb7o","q":"Which THREE statements about default configurations are correct? (Choose THREE.)","a":"Default credentials are publicly documented and must be changed immediately;  Devices ship with extra open ports for compatibility; unneeded ones should be closed;  Encrypted protocol versions should replace plaintext ones (HTTPS, SMTPS, SSH)","why":"Defaults favor convenience over security. The exam loves default-password and open-port scenarios; Telnet (plaintext) should always be replaced by SSH.","multi":true},{"id":"7y9r04","q":"Which THREE controls help harden a system against unauthorized code execution? (Choose THREE.)","a":"Application allowlisting via group policy;  Patch management keeping the OS and apps current;  Disabling unnecessary services","why":"Allowlisting blocks unapproved executables; patching closes known holes; disabling services shrinks the attack surface. Open ports, shared passwords, and permissive modes all weaken security.","multi":true},{"id":"1enzw3q","q":"Which TWO correctly pair an encryption level with a use case? (Choose TWO.)","a":"File-level (GPG) — encrypting a contract before emailing it;  Record-level — encrypting only the SSN column of a customer database","why":"GPG fits individual files; column-level fits selective DB fields. FDE protects whole drives (stolen laptops); TDE spans DB storage; volumes are containers.","multi":true},{"id":"1e2zegz","q":"Which TWO statements about SELinux policies and contexts are correct? (Choose TWO.)","a":"The Type context is the MAC label and the most important for fine-grained control;  Targeted policy (the RHEL/CentOS default) confines only selected processes","why":"User/Role/Type are the main contexts (Type most important; Level is optional MLS). Targeted is the default; violations are written to the audit log.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
