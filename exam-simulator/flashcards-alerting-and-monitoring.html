<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #f0883e; --accent-dim: rgba(240,136,62,.14);
    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .topbar .grow { flex: 1; }
  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }
  h1 { font-size: 24px; margin: 10px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }
</style>

  <div class="stats">

  <script>
    var DECKS = [{"label":"Section 22 · Alerting and Monitoring","cards":[{"id":"gtx8xh","q":"Which alert classification results when a real attack occurs but the monitoring system generates no alert?","a":"False negative","why":"Missed real threat = false negative — the most dangerous outcome.","multi":false},{"id":"1wu75c9","q":"Excessive false positives primarily cause:","a":"Alert fatigue among security personnel","why":"Noise from false positives exhausts analysts — hence the goal of minimizing them.","multi":false},{"id":"1rld0o6","q":"A baseline is best described as:","a":"Established metrics representing normal system behavior, used as a comparison reference","why":"Baselines define 'normal' so deviations can be spotted and investigated.","multi":false},{"id":"mm1xys","q":"New Relic and AppDynamics are tools for which monitoring type?","a":"Application performance monitoring","why":"They track application response times, error rates, and bottlenecks.","multi":false},{"id":"1e8l2yy","q":"A vulnerability scan determines what to flag by comparing systems against:","a":"The CVE database","why":"Scanners check the system's state against known vulnerabilities catalogued as CVEs.","multi":false},{"id":"8p7jbq","q":"An organization uses CIS-CAT to check systems against CIS Controls and PCI DSS. This is a:","a":"Configuration scan","why":"CIS-CAT evaluates configurations against benchmarks/compliance standards.","multi":false},{"id":"nw0lyw","q":"Fortify examining source code for SQL injection flaws without running the app is:","a":"Static code analysis","why":"Static analysis reviews non-running code; dynamic analysis (pentesting) complements it on running apps.","multi":false},{"id":"8vquom","q":"Under HIPAA, retained health data (including logs) must be kept for:","a":"6 years","why":"HIPAA mandates 6-year retention, often via cloud hot/cold archival storage.","multi":false},{"id":"1r52bup","q":"Patching a flagged vulnerability is remediation; confirming the fix with a follow-up scan is:","a":"Validation","why":"Validation proves remediation worked — e.g. rescanning the domain controller.","multi":false},{"id":"kdxsp3","q":"Adjusting alert thresholds so CPU spikes must persist 60 seconds before notifying is:","a":"Alert tuning","why":"Alert tuning reduces noise/false positives by changing trigger conditions.","multi":false},{"id":"1rwqk4k","q":"Which SNMP message is sent unsolicited from an agent to the manager?","a":"Trap","why":"Traps are asynchronous, unsolicited agent-to-manager event notifications.","multi":false},{"id":"eu5wja","q":"SNMP v1/v2 community strings such as 'public' and 'private' are risky because they:","a":"Are sent and stored in plaintext","why":"Community strings are plaintext shared secrets — trivially sniffed in v1/v2.","multi":false},{"id":"jsqzl1","q":"Select THREE security enhancements SNMP v3 adds over v1/v2:","a":"Integrity via message hashing;  Authentication of message sources;  Confidentiality via encryption","why":"v3 = integrity (hashing), authentication (source validation), confidentiality (DES originally, 3DES/AES on newer firmware).","multi":true},{"id":"w34g66","q":"Which THREE data sources commonly feed a SIEM?","a":"Antivirus detection logs;  DLP policy violation events;  Firewall allowed/blocked traffic logs","why":"AV, DLP, NIDS/NIPS, firewalls, and vulnerability scanners all ship logs/events to the SIEM.","multi":true},{"id":"6ocne8","q":"Which TWO statements about SIEM collection modes are correct?","a":"Agent-based provides real-time, detailed collection;  Agentless uses standard protocols like SNMP or WMI","why":"Agents give real-time detail at maintenance cost; agentless pulls via SNMP/WMI with less detail.","multi":true},{"id":"1yfscj5","q":"Which TWO are among the seven SIEM deployment considerations?","a":"Developing use cases that define threats;  Establishing a ticketing process","why":"Also: log relevant events, document scope, plan IR actions, threat hunting, evidence trail for auditors.","multi":true},{"id":"upow59","q":"An alert fires and correctly identifies a real threat. This is a:","a":"True positive","why":"Correct alert on a real issue = true positive.","multi":false},{"id":"xq2wo6","q":"The alert goal of 'maximize true positives while minimizing false positives' primarily helps prevent:","a":"Alert fatigue","why":"Too many false positives exhaust analysts — minimizing them avoids alert fatigue.","multi":false},{"id":"1b1zyd7","q":"A system fails to alert on a genuine attack in progress. This outcome is a:","a":"False negative — the system missed a real threat","why":"A missed real threat is a false negative — you are under attack and don't know it.","multi":false},{"id":"1f6zrn6","q":"A baseline in system monitoring is best defined as:","a":"Established metrics representing normal expected behavior, used as a reference point","why":"A baseline captures what 'normal' looks like so deviations can be investigated.","multi":false},{"id":"18ieqx1","q":"Which tool pair is associated with APPLICATION performance monitoring?","a":"New Relic and AppDynamics","why":"New Relic and AppDynamics track app response times, errors, and bottlenecks.","multi":false},{"id":"1r61ocu","q":"A consistently overloaded network switch identified through infrastructure monitoring most likely indicates:","a":"Need for additional network capacity or a config problem","why":"Sustained switch overload = capacity shortfall or configuration issue.","multi":false},{"id":"12ei4pz","q":"Collecting and consolidating log data from many sources into one central location is:","a":"Log aggregation","why":"Log aggregation centralizes logs for analysis, troubleshooting, and compliance.","multi":false},{"id":"14g6sgu","q":"A vulnerability scan compares a system's state against which database?","a":"The CVE database from MITRE","why":"Vulnerability scanning checks systems against known vulnerabilities catalogued as CVEs.","multi":false},{"id":"1yya5n1","q":"CIS-CAT is an example of a tool that performs:","a":"Configuration scanning against benchmarks like CIS Controls","why":"CIS-CAT evaluates system configurations against CIS benchmarks and compliance frameworks.","multi":false},{"id":"1psiyup","q":"Fortify and SonarQube are examples of:","a":"Static code analysis tools","why":"They statically analyze source code for vulnerabilities like SQL injection and XSS.","multi":false},{"id":"1bybw8h","q":"How long does HIPAA require healthcare data (including logs) to be retained?","a":"6 years","why":"HIPAA requires 6 years of data retention — often archived to cloud hot/cold storage.","multi":false},{"id":"1yaj8mg","q":"After patching a vulnerable domain controller, the analyst rescans it to confirm the threat is gone. The rescan step is called:","a":"Validation","why":"Remediation = fixing; validation = verifying the fix actually worked.","multi":false},{"id":"1k6g751","q":"Logically isolating a malware-suspected workstation from the network while investigating is:","a":"Quarantining","why":"Quarantining isolates the system to prevent the threat from spreading.","multi":false},{"id":"1nbdgkd","q":"An admin raises a CPU alert threshold and requires the spike to persist 60 seconds to cut noise. This is:","a":"Alert tuning","why":"Adjusting thresholds/conditions/delivery to reduce false positives = alert tuning.","multi":false},{"id":"1ntan7h","q":"In SNMP, which message type is sent asynchronously and unsolicited from agent to manager?","a":"Trap","why":"Traps are unsolicited agent-to-manager notifications of significant events, near real time.","multi":false},{"id":"1jsw0rz","q":"An SNMP manager sends a message to change a variable's value on an agent. This is a:","a":"Set request","why":"Set = manager-to-agent value change; Get = manager-to-agent retrieval.","multi":false},{"id":"1r72udm","q":"The MIB (management information base) is best described as:","a":"A hierarchical translation file storing OIDs that describe a device's management data","why":"The MIB catalogs OIDs in a hierarchical namespace so traps can send only the changes.","multi":false},{"id":"18ju3rl","q":"Which SNMP trap style sends only the OID changes, conserving bandwidth?","a":"Granular traps","why":"Granular traps reference unique OIDs stored in the MIB — no redundant data sent.","multi":false},{"id":"1xmze6g","q":"SNMP trap data stored as key-value pairs (e.g. SiteName: PR-Branch) is known as:","a":"Variable binding","why":"Variable bindings carry trap data as key-value pairs.","multi":false},{"id":"1jtskmt","q":"The default SNMP v1/v2 community strings 'public' and 'private' are a security risk because they:","a":"Are transmitted and stored in plaintext","why":"Community strings act as shared secrets but travel in plaintext in v1/v2 — trivially intercepted.","multi":false},{"id":"akffmm","q":"SNMP v3 improves over v1/v2 by adding which three security features?","a":"Integrity, authentication, confidentiality","why":"v3 adds message hashing (integrity), source validation (authentication), and encryption (confidentiality).","multi":false},{"id":"162ayrb","q":"The original encryption algorithm specified for SNMP v3 confidentiality, now considered weak, is:","a":"DES with a 56-bit key","why":"SNMP v3 originally used DES-56; newer firmware supports 3DES/AES.","multi":false},{"id":"1t0ol7a","q":"The main purpose of a SIEM is to:","a":"Aggregate and correlate logs from across the organization for real-time security analysis","why":"A SIEM centralizes logs and correlates events (e.g. impossible travel) to surface threats.","multi":false},{"id":"uxjm5c","q":"John logs in via VPN from Asia while his badge opens the NYC server room minutes later. A SIEM flags this because of:","a":"Correlation across disparate systems (impossible travel)","why":"Correlating VPN and physical access logs reveals impossible travel — a SIEM's core strength.","multi":false},{"id":"gnqfmu","q":"An agentless SIEM typically collects log data using which standard protocols?","a":"SNMP or WMI","why":"Agentless SIEMs pull logs via SNMP/WMI — no software installed on each host.","multi":false},{"id":"xqo8yk","q":"A key advantage of agent-based SIEM collection over agentless is:","a":"Real-time, more detailed data collection","why":"Agents enable near-real-time, detailed collection — at the cost of install/maintenance.","multi":false},{"id":"jsck6x","q":"Which SIEM deployment consideration involves defining exactly what counts as a threat?","a":"Developing use cases","why":"Use cases define what is and isn't considered a threat and what actions follow.","multi":false},{"id":"ywgqpi","q":"Scheduling regular threat hunting in a SIEM program helps:","a":"Catch bad actors who bypassed automated alerts","why":"Threat hunting proactively finds what alert rules missed.","multi":false},{"id":"3ohpte","q":"Splunk's proprietary search language is called:","a":"SPL (Search Processing Language)","why":"Splunk uses SPL; it also ships with templates, dashboards, and IR workflows.","multi":false},{"id":"v60tre","q":"In the ELK/Elastic Stack, which component performs log collection and normalization?","a":"Logstash","why":"Beats collect on endpoints, Logstash parses/normalizes, Elasticsearch stores/searches, Kibana visualizes.","multi":false},{"id":"1ptvwsl","q":"Which SIEM product, created by IBM, was covered in the course?","a":"QRadar","why":"QRadar is IBM's SIEM; ArcSight (compliance reporting), Splunk, and ELK are others.","multi":false},{"id":"brkq1j","q":"A NIDS differs from a NIPS in that a NIDS:","a":"Passively detects threats and generates alerts","why":"NIDS = passive detection + alerts; NIPS = proactive blocking.","multi":false},{"id":"1n6dd0d","q":"Firewall logs showing a single host probing ports 0–1023 on a web server most likely indicate:","a":"Port scan reconnaissance by a threat actor","why":"Sequential probing of well-known ports is classic reconnaissance visible in firewall logs.","multi":false},{"id":"1myjub3","q":"A DLP system flags an employee emailing a client list to a personal address. This data, sent to the SIEM, enables:","a":"Timely corrective action on a potential data leak","why":"DLP events in the SIEM alert teams to potential exfiltration so they can act quickly.","multi":false},{"id":"2gmide","q":"One workstation repeatedly reports malware infections to the SIEM. The BEST interpretation is:","a":"Possibly an isolated issue — or an indicator of a larger attack in progress","why":"Repeated detections on one host can signal an isolated infection or the start of a broader campaign — correlate across systems.","multi":false},{"id":"175i7g1","q":"SCAP was developed by which organization?","a":"NIST","why":"The Security Content Automation Protocol is a NIST framework of open standards.","multi":false},{"id":"164pyxx","q":"OVAL, a SCAP language, is used to:","a":"Describe system security states and query vulnerability information in an XML schema","why":"OVAL (Open Vulnerability and Assessment Language) standardizes describing and assessing system state.","multi":false},{"id":"109b2lo","q":"XCCDF's main contribution to SCAP is:","a":"Machine-readable configuration checklists/benchmarks","why":"XCCDF replaces 30–50 page manual hardening guides with machine-readable checklists.","multi":false},{"id":"126ubpe","q":"ARF, the Asset Reporting Format, is valued because it is:","a":"Vendor and technology neutral","why":"ARF expresses asset-report relationships in a vendor/technology-neutral XML model.","multi":false},{"id":"19d0bip","q":"CPE format 'cpe:/a:microsoft:office' — the 'a' in the part field means:","a":"Application (O=OS, A=application, H=hardware)","why":"CPE part field: o = OS, a = application, h = hardware.","multi":false},{"id":"vrqiy2","q":"CCE provides unique identifiers for:","a":"System configuration issues and best-practice statements","why":"CCE (Common Configuration Enumeration) identifies configuration checks/issues so tools can correlate them.","multi":false},{"id":"wq9csz","q":"Under CVSS 3.0, a score of 9.5 is rated:","a":"Critical","why":"9.0–10.0 = Critical; 7.0–8.9 = High; 4.0–6.9 = Medium; 0.1–3.9 = Low.","multi":false},{"id":"q2cm5k","q":"A CVSS score of 8.1 (High) is assigned to a vulnerability, but your network already disables the affected protocol. You should:","a":"Prioritize it lower — CVSS doesn't account for mitigations already in place","why":"CVSS measures inherent severity, not YOUR residual risk; existing mitigations lower real priority.","multi":false},{"id":"1pytrvi","q":"The main drawback of full packet capture compared to flow analysis is:","a":"Storage and processing cost — every packet's header AND payload is captured","why":"FPC captures everything — gigabytes daily even on a home network. Flow analysis records only metadata.","multi":false},{"id":"14rfyti","q":"NetFlow, originally developed by Cisco, became the industry standard known as:","a":"IPFIX (IP Flow Information Export)","why":"IPFIX is the IETF standard based on Cisco's NetFlow.","multi":false},{"id":"r3c88p","q":"Zeek is described as a hybrid tool because it:","a":"Samples traffic like NetFlow but logs full packet captures for traffic its filters flag as interesting","why":"Zeek gives flow-style metadata plus full PCAPs only for interesting sessions — best of both worlds.","multi":false},{"id":"1lmlo64","q":"MRTG builds traffic graphs for router interfaces by pulling data via:","a":"SNMP","why":"The Multi Router Traffic Grapher polls devices using SNMP.","multi":false},{"id":"14ap4ug","q":"A 'single pane of glass' primarily provides:","a":"A unified display consolidating data from many sources for monitoring and decisions","why":"SPOG consolidates logs, alerts, and reports into one unified management view.","multi":false},{"id":"15br3tg","q":"Which is NOT one of the five SPOG implementation steps?","a":"Randomize data formats to prevent attacks","why":"The 5 steps: requirements → integrate sources (APIs/webhooks/plugins/connectors) → customize UI → SOPs/documentation → continuously monitor and maintain.","multi":false},{"id":"1omls5x","q":"Because a single pane of glass centralizes all critical security data, special care must be taken to:","a":"Secure and properly configure it against unauthorized access","why":"It holds everything — so it must itself be locked down; step 5 includes securing it.","multi":false},{"id":"132yb3k","q":"Monitoring that uses software tools to automatically scan logs and traffic for malicious activity is:","a":"Automated monitoring","why":"Automated monitoring = software-driven; manual = human review.","multi":false},{"id":"1byoe39","q":"A server's CPU utilization sits far above its historical baseline for hours. The best action is to:","a":"Investigate the deviation as a potential issue or resource need","why":"Deviations from baseline indicate problems or capacity needs — investigate proactively.","multi":false},{"id":"p6vbe0","q":"SolarWinds and PRTG are most associated with which monitoring category?","a":"Infrastructure monitoring","why":"They monitor network devices, bandwidth, and infrastructure health.","multi":false},{"id":"2j9euo","q":"Aggregated logs help compliance efforts primarily by:","a":"Centralizing required log data so auditors can easily review it","why":"Regulations like GDPR/HIPAA require comprehensive logs — aggregation makes them audit-ready.","multi":false},{"id":"12hzq93","q":"Static code analysis tools like SonarQube primarily catch which class of issues?","a":"Vulnerabilities such as SQL injection, XSS, and bad variables in source code","why":"Static analyzers find code-level security flaws before deployment.","multi":false},{"id":"18fxeay","q":"Amazon S3 or Google Cloud Storage holding years of logs for future analysis illustrates:","a":"Archiving","why":"Archiving = long-term retention of logs/performance/incident data for analysis, audit, compliance.","multi":false},{"id":"1lhc35n","q":"Isolating an infected workstation from the network during an investigation is called:","a":"Quarantining","why":"Quarantining isolates the system/file to prevent threat spread while responders work.","multi":false},{"id":"1nk5557","q":"An SNMP Get request is sent:","a":"Manager to agent, to retrieve variable values","why":"Get = manager→agent retrieval; Set = manager→agent change; Trap = agent→manager unsolicited.","multi":false},{"id":"1qu91a8","q":"In granular SNMP traps, the unique object identifiers are stored and translated using the:","a":"MIB (management information base)","why":"The MIB holds OID details hierarchically, so traps only send changes — saving bandwidth.","multi":false},{"id":"16iak52","q":"SNMP v3 grouping components into entities with separate read/write authorizations improves:","a":"Security through granular access control","why":"v3 groups let you grant least-privilege SNMP access per entity.","multi":false},{"id":"b2chxt","q":"The famous SIEM 'impossible travel' scenario works by:","a":"Correlating a VPN login with a same-time physical badge entry in another country","why":"SIEM correlation across disparate systems (VPN + physical access) flags impossible simultaneous events.","multi":false},{"id":"1thv1os","q":"ArcSight was highlighted in the course particularly for:","a":"Compliance reporting for HIPAA, SOX, and PCI DSS","why":"ArcSight is a SIEM with strong compliance reporting; QRadar is IBM's offering.","multi":false},{"id":"11b2kkp","q":"Choose THREE of the seven SIEM deployment considerations from the course:","a":"Establish and document the scope of logged events;  Develop use cases defining what a threat is;  Plan incident response actions for given threats","why":"Also: log relevant events/filter noise, ticketing, threat hunting, evidence trail for auditors.","multi":true},{"id":"1nmau1a","q":"Which THREE tools generate data commonly consolidated within a SIEM?","a":"Antivirus software;  NIDS/NIPS;  Vulnerability scanners","why":"Plus DLP systems and firewalls — all feed logs/events/incident data to the SIEM.","multi":true},{"id":"18qaz22","q":"Which TWO correctly describe NIDS vs NIPS?","a":"NIDS passively detects and alerts;  NIPS proactively blocks threats","why":"Detection = passive alerting; Prevention = inline blocking.","multi":true},{"id":"1k6tvdu","q":"Which TWO statements about baselines are true?","a":"They represent normal expected behavior;  Deviations from baseline warrant investigation","why":"Baselines are reference points for normal behavior across systems, apps, and infrastructure.","multi":true},{"id":"17cvehl","q":"Security leadership wants to reduce analyst burnout caused by hundreds of low-value daily alerts. The BEST technical approach is:","a":"Tune alert thresholds/conditions and filter irrelevant data to cut false positives","why":"Alert tuning + filtering reduces false positives — the root cause of alert fatigue.","multi":false},{"id":"5qvzq4","q":"A NIPS differs from a NIDS primarily in that the NIPS:","a":"Sits inline and proactively blocks detected threats","why":"Prevention systems inline-block; detection systems passively alert.","multi":false},{"id":"itowuo","q":"Which log-aggregation benefit most directly supports INCIDENT INVESTIGATION?","a":"Correlating events across systems to pinpoint root cause","why":"Centralized logs let analysts correlate events across disparate systems to trace incidents.","multi":false},{"id":"1sj1gab","q":"An organization must prove to auditors that regulated activities are fully logged and retained. The compliance role most directly served by aggregation and archiving is:","a":"GDPR/HIPAA audit readiness","why":"GDPR/HIPAA demand comprehensive logging and retention (HIPAA: 6 years) — aggregation/archives feed audits.","multi":false},{"id":"1elr20j","q":"Which pairing of SNMP version and security is correct?","a":"v3 — integrity, authentication, and confidentiality","why":"Only v3 adds hashing (integrity), source validation (authentication), and encryption (confidentiality).","multi":false},{"id":"mwmsgo","q":"Devices that cannot run modern firmware may be limited to which weak SNMP v3 encryption?","a":"DES with a 56-bit key","why":"v3 originally specified DES-56; 3DES/AES require newer device firmware.","multi":false},{"id":"13e0c6r","q":"A flow collector reports an HTTPS session carried 2 GB overnight between a database server and an unknown external host. This finding from flow analysis suggests:","a":"Possible data exfiltration that warrants investigation (no content visible, only metadata)","why":"Flows show who/how much/what protocol — a large odd transfer pattern is an exfil indicator to investigate.","multi":false},{"id":"1cjpiff","q":"An analyst needs actual packet contents for a handful of suspicious sessions but cannot afford full-time full packet capture. The BEST tool is:","a":"Zeek — it samples flows and captures full PCAPs only for flagged traffic","why":"Zeek hybridizes flow sampling with targeted full captures, storing normalized JSON/tab-delimited logs.","multi":false},{"id":"10gymps","q":"MRTG graphs show a daily 2 a.m.–4 a.m. traffic spike on the firewall. The most reasonable FIRST step is to:","a":"Check whether scheduled offsite backups explain the spike before suspecting exfiltration","why":"Correlate the anomaly with known business activity (backups); if unexplained, dig deeper with sniffers/PCAPs.","multi":false},{"id":"1wscejm","q":"Which statement about CVSS is TRUE?","a":"It rates inherent severity 0–10 and maps to None/Low/Medium/High/Critical","why":"CVSS = inherent severity scoring (9.0–10.0 Critical). It does NOT account for your compensating controls.","multi":false},{"id":"h1zqai","q":"EternalBlue (CVE-2017-0144) was famous in 2017 because it:","a":"Powered the WannaCry ransomware via an SMBv1 flaw","why":"WannaCry spread via the SMBv1 flaw CVE-2017-0144 (CVSS 8.1 High); fix = patch or disable SMBv1.","multi":false},{"id":"jp2nc","q":"In the CPE name 'cpe:/o:redhat:enterprise_linux', the 'o' stands for:","a":"Operating system (o/a/h = OS/application/hardware)","why":"CPE part field: o=OS, a=application, h=hardware.","multi":false},{"id":"a4gj22","q":"Select THREE of the SCAP languages/enumerations and their correct roles:","a":"OVAL — describes system security state and queries vulnerability data;  XCCDF — machine-readable configuration checklists;  CPE — identifies platforms (hardware, OS, applications)","why":"Also ARF (asset reporting) and CCE (configuration identifiers) and CVE. MIB/MRTG belong to SNMP/flow analysis.","multi":true},{"id":"x8kuhl","q":"Which THREE benefits does a single pane of glass provide?","a":"Simplified management with a unified security view;  Efficiency via automation of repetitive tasks;  Easier compliance documentation and reporting","why":"SPOG also improves collaboration — but it prevents nothing by itself and sits on top of tools like SIEMs.","multi":true},{"id":"8p47dy","q":"Which TWO practices are part of 'alert response and remediation/validation'?","a":"Quarantining a suspected-malicious workstation;  Rescanning a patched domain controller to confirm the fix","why":"Response = investigate/escalate/procedure; remediation = fix; validation = prove it (rescan). Quarantine and rescan are textbook examples.","multi":true},{"id":"1grdid3","q":"Which TWO are valid reasons to filter irrelevant events from SIEM logging?","a":"Reduce noise so relevant events stand out;  Control storage/processing costs","why":"SIEM best practice: log relevant events and filter the rest — noise obscures threats and wastes resources.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
