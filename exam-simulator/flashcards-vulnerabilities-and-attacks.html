<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #f0883e; --accent-dim: rgba(240,136,62,.14);
    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .topbar .grow { flex: 1; }
  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }
  h1 { font-size: 24px; margin: 10px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }
</style>

  <h1>Section 17 · Vulnerabilities and Attacks — Flashcards</h1>

  <script>
    var DECKS = [{"label":"Section 17 · Vulnerabilities and Attacks","cards":[{"id":"15fit0z","q":"A review of WAF logs shows a login attempt whose password field contained: ' OR 7=7;-- Which attack should be recorded in the incident ticket?","a":"SQL injection","why":"An apostrophe escaping the string plus an always-true condition (7=7) joined with OR is the textbook SQLi signature. The value does not need to be 1=1 — any tautology works.","multi":false},{"id":"ns821d","q":"A security engineer sees a request URL containing: q=\u003cscript>alert(document.cookie)\u003c/script> What is the MOST specific classification of this attack?","a":"DOM-based XSS — the payload reads document.cookie, targeting the browser's Document Object Model","why":"Any document.* reference (document.cookie, document.write) in the payload means the code manipulates the DOM inside the browser — that is the exam's marker for DOM-based XSS.","multi":false},{"id":"1ycvpeo","q":"A victim is logged into their bank in one browser tab and opens an attacker's page in a second tab; seconds later the victim's bank email address has been changed. Which attack occurred?","a":"Cross-site request forgery (XSRF/CSRF)","why":"XSRF abuses the victim's already-authenticated session to perform an unwanted action (password/email change). XSS would run attacker code in the victim's browser instead.","multi":false},{"id":"4lj4ab","q":"Which mitigation directly prevents the password-change XSRF attack from succeeding?","a":"Requiring the user's current password to change the password","why":"Anti-CSRF user-specific form tokens are the developer-side fix; on the flow side, requiring the current password or 2FA on sensitive changes stops forged requests dead.","multi":false},{"id":"yalwq5","q":"An attacker's payload overwrites the return pointer on a program's stack and fills the buffer with non-operation instructions leading to shellcode. The NOP-filled region is called:","a":"A NOP slide","why":"A sled of NOP instructions lets execution slide down to the attacker's code regardless of the exact landing address. Overwriting the return pointer is smashing the stack.","multi":false},{"id":"15vn9mi","q":"Which Windows-introduced mitigation (Vista onward) makes stack-based buffer overflow exploits harder by randomizing where programs load in memory?","a":"ASLR — Address Space Layout Randomization","why":"ASLR randomizes memory addresses so the attacker can no longer predict the return pointer's target. Side-channel bypasses exist but are beyond SY0-701 scope.","multi":false},{"id":"zyamva","q":"A finance app verifies funds, then an attacker slips multiple transfers into the gap before the transfer executes. Which vulnerability class is this?","a":"Race condition — time-of-check/time-of-use","why":"TOC/TOU are two moments of one race condition: state is checked, then manipulated before it is used. Locks/mutexes serialize the access.","multi":false},{"id":"12u08cv","q":"The 2016 Dirty COW exploit is a well-known example of:","a":"A race condition in the Linux kernel's copy-on-write mechanism enabling privilege escalation","why":"Dirty COW raced copy-on-write to flip a read-only mapping to writable, and left nothing in the logs — which is what made race conditions so dangerous.","multi":false},{"id":"111xxqc","q":"To stop session prediction attacks against its web portal, a company should ensure session tokens are:","a":"Truly random, non-predictable, and one-time use per session","why":"Guessable tokens let attackers hijack authenticated sessions. Tokens must be genuinely random, reveal nothing about the client, and be single-use for the session's duration.","multi":false},{"id":"c96oz6","q":"An attacker with brief physical proximity copies a victim's full contact list and SMS history from an unlocked Bluetooth phone without any message appearing. This is:","a":"Bluesnarfing","why":"Bluesnarfing = unauthorized theft of data from the device. Bluejacking only sends messages; bluebugging takes control; bluesmack is a DoS flood.","multi":false},{"id":"7x00zm","q":"Which mobile device risk involves installing applications from sources outside the official app store, bypassing malware review?","a":"Sideloading","why":"Sideloading bypasses the store's screening. MDM policy should block it, along with detecting jailbreak/root and forcing VPN and patching.","multi":false},{"id":"rgouzu","q":"A newly discovered flaw in a popular VPN concentrator is being exploited in the wild, and the vendor has released no fix. Signature antivirus shows nothing. This scenario describes:","a":"A zero-day attack","why":"Zero-day = vendor has had zero days to patch; no signature exists yet, so detection must lean on behavior/heuristic or AI-driven analysis.","multi":false},{"id":"13784pj","q":"Which THREE are effective defenses against SQL injection? (Choose THREE.)","a":"Input validation and sanitization;  Deploying a web application firewall;  Parameterized queries/prepared statements","why":"Validate/sanitize all input, put a WAF in front of legacy apps, and use parameterized queries so input can never be parsed as SQL.","multi":true},{"id":"mmevy1","q":"Which TWO statements about cookies and session management are correct? (Choose TWO.)","a":"Session cookies are stored in memory and deleted when the browser closes;  Persistent cookies live in the browser cache until expiry or deletion","why":"Session = non-persistent/in-memory; persistent = cached with an expiry. Cookies carrying sensitive data must be encrypted, hijacking can occur via token prediction without clicks, and tokens must be random.","multi":true},{"id":"vcu9g7","q":"An organization must reduce OS-level vulnerabilities on its servers. Which THREE controls should it deploy? (Choose THREE.)","a":"A host-based intrusion prevention system (HIPS);  Verifying update signatures/hashes before installing;  Application allow-listing","why":"HIPS blocks host attack patterns, signature/hash verification stops malicious updates, and allow-listing blocks unauthorized executables. Defaults, no firewall, and shared accounts all increase risk.","multi":true},{"id":"1txduvi","q":"Which TWO are recognized Bluetooth attacks? (Choose TWO.)","a":"Blueborne — airborne worm-like spread between devices;  Bluebugging — taking control of device functions","why":"The real blue family: bluejacking (spam), bluesnarfing (data theft), bluebugging (control), bluesmack (DoS), Blueborne (airborne spread).","multi":true},{"id":"wqh77s","q":"A server was reimaged with a clean OS, but malware persists across reboots. Which hardware-level attack is most likely responsible?","a":"Firmware attack","why":"Malware embedded in firmware (BIOS/UEFI or device firmware) survives OS reinstallation.","multi":false},{"id":"atjod2","q":"Which systems can never receive security patches again and should be isolated or decommissioned?","a":"End-of-life/unsupported systems","why":"EOL/legacy/unsupported systems receive no patches, so their vulnerabilities are permanent. Isolate and segment them, then plan decommissioning.","multi":false},{"id":"oq6xs5","q":"Leaving a device on a known-vulnerable, unpatched firmware version is an example of which hardware vulnerability?","a":"Unpatched system","why":"Unpatched systems leave known CVEs open; patch management is the fix.","multi":false},{"id":"1l08ui7","q":"Default passwords and insecure out-of-box settings on network appliances are examples of:","a":"Misconfigurations","why":"Misconfigurations are insecure settings left in place; fix with configuration baselines/enforcement and hardening.","multi":false},{"id":"1tl9unq","q":"Which mitigation is BEST for protecting the rest of the network from a legacy device that must stay online but can no longer be patched?","a":"Isolate and segment the legacy device","why":"Isolation/segmentation (e.g., VLAN plus firewall rules) contains the risk of unpatched legacy gear.","multi":false},{"id":"16mby72","q":"An attacker sends unsolicited advertising messages to nearby Bluetooth phones. This is:","a":"Bluejacking","why":"Bluejacking = sending unsolicited messages to a Bluetooth device.","multi":false},{"id":"74utpe","q":"An attacker copies a victim's contacts and text messages from their phone over Bluetooth without consent. This is:","a":"Bluesnarfing","why":"Bluesnarfing = unauthorized reading/theft of data (contacts, call logs, texts) from the device.","multi":false},{"id":"rpjexv","q":"Which Bluetooth attack gives an attacker control over a device's functions, such as placing calls or sending texts?","a":"Bluebugging","why":"Bluebugging takes control of device functions; bluesnarfing only steals data.","multi":false},{"id":"1hy35x2","q":"An attacker floods a Bluetooth headset with traffic until it crashes and becomes unusable. This DoS attack is:","a":"Bluesmack","why":"Bluesmack is a DoS attack that floods and crashes the Bluetooth device.","multi":false},{"id":"zoq29j","q":"Which attack spreads malware between Bluetooth devices through the air within seconds, without pairing?","a":"Blueborne","why":"Blueborne is a worm-like airborne Bluetooth exploit that spreads in seconds with no pairing required.","multi":false},{"id":"6xynib","q":"Which is a Bluetooth BEST practice?","a":"Turn Bluetooth off when not in use and stay non-discoverable by default","why":"Disable BT when unused, default to non-discoverable, update firmware, pair only known devices, use unique PINs/passkeys.","multi":false},{"id":"f5mw26","q":"Installing an app from a third-party website instead of the official app store is called:","a":"Sideloading","why":"Sideloading bypasses the app store and its malware screening; MDM should block it.","multi":false},{"id":"1sl98zj","q":"An iOS phone with escalated privileges and blocked official updates has been:","a":"Jailbroken","why":"Jailbreaking (iOS) / rooting (Android) removes built-in protections and often prevents OTA updates.","multi":false},{"id":"1ni0brl","q":"Which connection should mobile users prefer over open public Wi-Fi for sensitive work?","a":"Cellular data or 802.1X-secured enterprise Wi-Fi","why":"Open Wi-Fi and unknown Bluetooth are insecure; use cellular or 802.1X-authenticated Wi-Fi.","multi":false},{"id":"1yor9va","q":"Which MDM capability detects a phone that has had its built-in security removed?","a":"Jailbreak/root detection","why":"MDM can detect jailbreak/root, enforce patching and baselines, block sideloading, and force VPN.","multi":false},{"id":"h6b54","q":"An attacker enters ' OR 1=1; into a login password field and gains access. What attack occurred?","a":"SQL injection","why":"Apostrophe + always-true condition (1=1) forces the SQL WHERE clause true via Boolean OR — the classic SQLi signature.","multi":false},{"id":"g2b117","q":"What is the BEST primary defense against SQL injection?","a":"Input validation and sanitization","why":"Validate/sanitize all user input so apostrophes and true-condition strings never reach the database.","multi":false},{"id":"e639m7","q":"A company cannot rewrite a vulnerable web app's code. What can it deploy in front of the app to filter SQLi attempts?","a":"A web application firewall (WAF)","why":"A WAF performs input validation/sanitization between clients and the web server even when the app can't be rewritten.","multi":false},{"id":"1hyfanr","q":"An attacker hides malicious SQL in a URL parameter, a cookie, a form field, and an HTTP header. These are all injection vectors for:","a":"SQL injection","why":"SQLi can be delivered via any input channel that reaches the query: URL params, forms, cookies, headers, POST data.","multi":false},{"id":"1g6oq9v","q":"You see log entries with nested entities labelled lol1 through lol9 that expand exponentially and consume server memory. This is:","a":"An XML bomb (billion laughs attack)","why":"Nested entity references that expand factorial-style (the billion laughs pattern) exhaust memory — a denial of service.","multi":false},{"id":"j1my35","q":"An XML document contains: \u003c!ENTITY xxe SYSTEM 'file:///etc/shadow'>. This is:","a":"An XXE (XML external entity) attack","why":"XXE embeds a request for a local resource — here trying to read the Linux /etc/shadow password-hash file.","multi":false},{"id":"wuykgx","q":"How do you tell XML apart from HTML/JavaScript in a code snippet?","a":"XML uses custom tags that say whatever the app defines, unlike HTML's fixed keywords","why":"XML tags are configurable per application; HTML uses fixed tags like img/href. Exam tip: clearly-XML snippet = XML vulnerability question.","multi":false},{"id":"1yxmgjw","q":"What defines a zero-day vulnerability?","a":"A vulnerability unknown to the vendor with no patch available","why":"Zero-day = the vendor has had zero days to fix it; no patch or signature exists yet.","multi":false},{"id":"1hwer52","q":"Why are signature-based antivirus tools ineffective against a brand-new zero-day exploit?","a":"No signature exists for it yet","why":"Signature AV matches known patterns; until a signature is created, a zero-day passes. Behavior/heuristic and AI detection are the fallback.","multi":false},{"id":"zzht05","q":"Zero-day exploits are typically:","a":"Expensive, stockpiled, and used against high-value targets","why":"Zero-days are costly and reserved for high-value targets, usually after generic malware has failed.","multi":false},{"id":"yi7ztm","q":"Which defense verifies that a software update is genuine before installation?","a":"Checking the update's digital signature or hash","why":"Malicious updates are an OS threat; verify signatures/hashes before installing. Other OS defenses: patching, HIPS, config management, encryption at rest, endpoint protection, host firewall, allow-listing.","multi":false},{"id":"vh2f26","q":"Which host-based control watches for and blocks attack patterns on an individual server?","a":"A host-based intrusion prevention system (HIPS)","why":"HIPS monitors and blocks malicious activity on the host itself.","multi":false},{"id":"bnu6wh","q":"Encrypting data stored on a laptop's drive protects against which OS-level threat?","a":"Data exfiltration from stolen devices","why":"Encryption at rest renders stolen data unreadable — one of the core OS vulnerability mitigations.","multi":false},{"id":"12g72me","q":"Restricting which executables may run on a server, blocking everything not explicitly approved, is called:","a":"Application allow-listing","why":"Allow-listing (application control) prevents unauthorized/malicious programs from executing.","multi":false},{"id":"1gtxwei","q":"Which statement best describes why an attacker uses an automated tool such as sqlmap?","a":"To discover injectable parameters and dump database contents automatically","why":"Tools automate finding vulnerable parameters, enumerating databases/tables/columns and dumping data — hence why input validation matters.","multi":false},{"id":"itb0f8","q":"In the demo, what did the attacker's web proxy (Burp Suite) capture that enabled the injection?","a":"The request's cookie/session data sent from the browser","why":"Intercepting the browser request captured cookies/session info reused to run automated SQLi against the vulnerable app.","multi":false},{"id":"1osp9ny","q":"An attacker posts a comment containing a script on a forum; every visitor's browser that loads the page runs it. This is:","a":"Persistent (stored) XSS","why":"Persistent XSS stores the malicious code in the site's database, so every user loading that content runs it.","multi":false},{"id":"1oo0bcx","q":"A crafted URL must be clicked by the victim and the attack executes only once. This XSS variant is:","a":"Reflected (non-persistent) XSS","why":"Reflected/non-persistent XSS fires only when the victim clicks the maliciously crafted link.","multi":false},{"id":"qqw589","q":"A log entry contains a payload referencing document.cookie inside a script. This indicates:","a":"A DOM-based XSS attack","why":"document.* references mean the payload manipulates the browser's Document Object Model — DOM-based XSS.","multi":false},{"id":"18xncg4","q":"What is the key difference between XSS and XSRF/CSRF?","a":"XSS runs attacker code in the victim's browser on a trusted site; XSRF tricks the victim's browser into performing an unwanted action","why":"XSS = code execution in the browser under the trusted site's context. XSRF = the victim's own authenticated session performs an action (e.g., password/email change) they never intended.","multi":false},{"id":"stnxyz","q":"Which defense is MOST effective against cross-site request forgery?","a":"User-specific anti-CSRF tokens in every form submission","why":"Anti-CSRF tokens bind forms to the specific user/session; also add randomness + 2FA to password resets and require the current password to change it.","multi":false},{"id":"5jmuv6","q":"Session hijacking via guessing a weak, predictable session token is specifically called:","a":"Session prediction","why":"Session prediction attacks guess non-random session tokens. Defend with truly random, non-predictable, one-time-use tokens.","multi":false},{"id":"fsjba7","q":"Which cookie type is stored in memory and deleted when the browser session ends?","a":"Session (non-persistent) cookie","why":"Session cookies live in memory only; persistent cookies sit in the browser cache until expiry or deletion. All cookies carrying sensitive data should be encrypted.","multi":false},{"id":"1wuqghn","q":"A buffer overflow attack aims to overwrite what, in order to redirect execution?","a":"The return address/pointer on the program's stack","why":"Overflowing the buffer overwrites adjacent stack memory, changing the return pointer so the program jumps to attacker code — smashing the stack.","multi":false},{"id":"u8nvya","q":"What is the purpose of a NOP slide in a buffer overflow exploit?","a":"It fills memory with no-operation instructions so the guessed return address slides down to the attacker's code","why":"A sled of NOP instructions makes the exact return address forgiving — execution slides down to the malicious code.","multi":false},{"id":"rgyves","q":"Which mitigation randomizes memory addresses of well-known programs so return pointers are hard to guess?","a":"ASLR (Address Space Layout Randomization)","why":"ASLR randomizes where programs load in memory (introduced with Windows Vista), defeating the fixed-address assumptions of stack smashing.","multi":false},{"id":"9wh4hf","q":"A bank app checks an account balance, but before the transfer executes, the attacker fires transfers that drain the account in the gap. This is a:","a":"Time-of-check/time-of-use (TOC/TOU) race condition","why":"TOC and TOU are two moments of the same race-condition vulnerability: state checked, then changed before the operation uses it.","multi":false},{"id":"1swd2yt","q":"The Dirty COW exploit abused a race condition in which Linux kernel mechanism to escalate privileges?","a":"Copy-on-write (COW) memory management","why":"Dirty COW (2016) raced the kernel's copy-on-write function to turn a read-only file mapping into a writable one, and left nothing in the logs.","multi":false},{"id":"nxasvw","q":"Which mechanism prevents race conditions by allowing only one thread into a code section at a time?","a":"Locks and mutexes (mutually exclusive flags)","why":"Mutexes/resource locks serialize access; poorly designed locks can cause a deadlock — a circular wait needing external intervention.","multi":false},{"id":"s4a0ej","q":"A code review finds that user-supplied data is concatenated directly into database queries. What is the single best fix?","a":"Switch to parameterized queries/prepared statements","why":"Parameterized queries separate code from data, so user input can never be parsed as SQL — stronger than any after-the-fact filter.","multi":false},{"id":"1kmbyfd","q":"Which XML attack attempts to read local files such as /etc/shadow by declaring an external entity?","a":"An XXE (XML external entity) attack","why":"XXE embeds a request for a local resource via SYSTEM identifiers. XML bombs instead consume memory through entity expansion.","multi":false},{"id":"ngyijw","q":"A web forum stores a hostile script in its database; every user viewing that thread executes it in their browser. This is which XSS type?","a":"Persistent (stored) XSS","why":"Stored/persistent XSS embeds the payload in the site's own database, so no link-click is required — everyone loading the content is hit.","multi":false},{"id":"q1m1w2","q":"Why is reflected XSS called non-persistent?","a":"The injected code is not stored — it executes once when the crafted link is clicked and then stops","why":"Reflected XSS lives only in the crafted request/URL; it is delivered once per click and is not saved anywhere on the server.","multi":false},{"id":"l5fhy8","q":"An attacker convinces a logged-in user to unknowingly submit a funds transfer using the user's own authenticated session. This best describes:","a":"Cross-site request forgery (XSRF/CSRF)","why":"The key signal is the victim's browser performing an action the victim never intended, riding on their existing authenticated session — the definition of CSRF.","multi":false},{"id":"1sjtyxz","q":"Which defensive measure should web developers add to all form submissions to combat CSRF?","a":"User-specific anti-CSRF tokens","why":"A per-user, per-session token that the attacker cannot know or forge makes forged cross-site requests fail validation.","multi":false},{"id":"7s4spw","q":"A security analyst notices tokens incrementing sequentially (1001, 1002, 1003) in session URLs. The most serious risk is:","a":"Session prediction and session hijacking","why":"Predictable tokens let an attacker guess the next valid session ID and take over authenticated sessions. Tokens must be truly random.","multi":false},{"id":"176zuqd","q":"Which cookie attribute situation is the MOST secure for sensitive sites?","a":"Cookies holding sensitive data are encrypted and protected","why":"Cookies can contain sensitive session data and must be encrypted/secured; persistent long-lived plaintext cookies widen the theft window.","multi":false},{"id":"g1lo1l","q":"Which statement about zero-day attacks is TRUE?","a":"They target vulnerabilities with no vendor patch, so signature-based detection is blind until a signature exists","why":"Zero-days are expensive and aimed at high-value targets after generic malware fails; behavioral/heuristic detection is the only pre-signature hope.","multi":false},{"id":"111lato","q":"A company wants to prevent unauthorized programs from running on its servers. Which technique blocks everything not explicitly approved?","a":"Application allow-listing","why":"Allow-listing (application control) only permits approved executables — a core OS-hardening defense alongside patching, HIPS, and encryption at rest.","multi":false},{"id":"19i9x2q","q":"Bluetooth is enabled and discoverable on a company phone all day in a public venue. Which attack is MOST likely enabled by this practice?","a":"Blueborne-style airborne compromise or unwanted pairing attempts","why":"Always-on discoverable Bluetooth invites pairing abuse and airborne attacks; best practice is off-when-unused, non-discoverable by default, and firmware updates.","multi":false},{"id":"1jktcpv","q":"A developer uses an eight-character buffer for phone numbers. A ten-digit entry writes two digits into the next buffer. This scenario illustrates:","a":"A buffer overflow","why":"Data exceeding the allocated buffer spills into adjacent memory — the buffer overflow concept behind stack smashing and remote code execution.","multi":false},{"id":"1qbkyky","q":"What is the function of a mutex in preventing race conditions?","a":"It acts as a mutually exclusive gatekeeper allowing only one thread into a code section at a time","why":"Mutexes and resource locks serialize access so concurrent threads cannot corrupt shared state. Poorly designed locks can cause deadlock.","multi":false},{"id":"5snz8","q":"Two processes each hold a lock the other needs, and neither can proceed without external intervention. This is:","a":"A deadlock — a circular dependency caused by competing locks","why":"Deadlock = circular wait between locks/mutexes. It is prevented by proper lock design and testing.","multi":false},{"id":"1lm7370","q":"Which THREE are injection-attack signatures an analyst should recognize? (Choose THREE.)","a":"Apostrophe followed by a tautology like 1=1 in input fields;  A script tag containing document.cookie in a request URL;  An XML snippet declaring a SYSTEM entity pointing at a local file","why":"Apostrophe+tautology = SQLi; script/document.* = XSS; SYSTEM local-file entity = XXE. Random tokens, TLS, and hashing are all healthy practices.","multi":true},{"id":"g1v94t","q":"Which THREE items belong to the family of Bluetooth best practices? (Choose THREE.)","a":"Turn Bluetooth off when not in use;  Set the device non-discoverable by default;  Pair only with known devices using a unique PIN/passkey","why":"Off-when-unused, non-discoverable default, known-device pairing with unique passkeys, updated firmware, and refusing unsolicited requests form the Bluetooth baseline.","multi":true},{"id":"tcuu9d","q":"Which TWO mobile threats should an MDM policy explicitly counter? (Choose TWO.)","a":"Sideloading of unvetted applications;  Jailbroken/rooted devices evading platform protections and updates","why":"MDM enforces baselines that block sideloading and detect jailbreak/root, plus patching and forced VPN. Official stores and recent hardware are not threats.","multi":true},{"id":"cia300","q":"Which TWO correctly pair a race-condition type with its description? (Choose TWO.)","a":"Time-of-check (TOC): the state is verified, then manipulated before the operation;  Time-of-evaluation (TOE): inputs manipulated while a decision/calculation is being made","why":"TOC and TOU are two moments of the SAME vulnerability; TOE concerns the evaluation window. Dirty COW is the copy-on-write race, and a NOP (not a mutex) does nothing.","multi":true},{"id":"q8r4lm","q":"An IDS alert shows a login POST whose body reads: username=admin'-- and password=x. The database logs confirm the query was cut short after the username. Which attack and primary prevention pair is correct?","a":"SQL injection — input validation plus parameterized queries","why":"The trailing apostrophe-comment sequence terminates the SQL string and comments out the password check — a SQLi variant. The apostrophe-plus-equals pattern family always points here; prevention is validation plus parameterization.","multi":false},{"id":"1qds28a","q":"A single captured URL contains BOTH an injected \u003cscript> payload AND a forged state-changing request riding an authenticated session. Why is classifying the primary attack tricky, and which pairing below is accurate?","a":"The script execution is XSS; the unauthorized state change abusing the session is XSRF/CSRF — two distinct attacks that can co-occur","why":"XSS = attacker code runs in the victim's browser; XSRF = the victim's browser performs an unintended action. They are separate vectors and may appear together.","multi":false},{"id":"2ott7u","q":"During a penetration test, an input field accepts 600 'A' characters followed by a 4-byte pointer that lands exactly on the saved return address. The exploit then appends hundreds of 0x90 bytes before the shellcode. The 0x90 region primarily exists to:","a":"Act as a NOP slide so the corrupted return address slides into the shellcode despite imperfect pointer prediction","why":"0x90 is the NOP instruction. The sled makes the exploit resilient: whatever address inside the sled the hijacked pointer lands on, execution flows into the shellcode.","multi":false},{"id":"1xjqhkp","q":"A vendor ships a firmware update for network switches, but the download mirror was compromised and the update carries a valid-looking filename. Which control MOST directly prevents installation of the tampered update?","a":"Verifying the update's digital signature or hash against the vendor's published value before installation","why":"Malicious/compromised updates are a listed OS-infrastructure threat; signature or hash verification against a trusted source is the direct countermeasure.","multi":false},{"id":"2915xo","q":"An application's session IDs are generated as MD5(username + login minute). An attacker logs in repeatedly, maps the pattern, and hijacks other users' sessions minutes later. The root cause and fix are:","a":"Session prediction — generate session tokens with a truly random, non-predictable algorithm, single-use per session","why":"Deterministic token generation makes IDs guessable — the definition of session prediction. True randomness plus one-time use per session removes the pattern.","multi":false},{"id":"1uix4cv","q":"A retail kiosk runs an OS the vendor stopped supporting in 2019, but regulations require it to remain operational for 18 more months. Which strategy BEST reduces risk without replacing it?","a":"Isolate and segment it on a dedicated network with strict firewall rules limiting it to only required traffic, and monitor it","why":"For unpatchable legacy gear the standard compensating control is isolation/segmentation plus micro-restricted traffic and monitoring, with a decommissioning plan.","multi":false},{"id":"17bg4fl","q":"Which pairing of attack to signature is CORRECT?","a":"XML bomb (billion laughs) — nested entity references expanding to consume gigabytes of memory","why":"The billion laughs/XML bomb expands nested entities factorial-style to exhaust memory. The XXE signature is a SYSTEM reference to a local file like /etc/shadow.","multi":false},{"id":"14gbsgo","q":"A mobile forensics team finds a corporate phone with a third-party app store installed, escalated privileges, and no security updates for 14 months. Which TWO findings represent the core mobile threats demonstrated?","a":"Sideloading and jailbreak/root with blocked updates","why":"Third-party store apps = sideloading; escalated privileges = jailbreak/root, which also blocks official OTA updates. MDM exists to detect and block exactly this.","multi":false},{"id":"wie2x3","q":"Why are race conditions such as Dirty COW considered especially insidious?","a":"They exploit timing windows, can escalate privileges, and may leave nothing in the system logs to alert defenders","why":"Dirty COW flipped read-only mappings to writable via the copy-on-write race for local privilege escalation, and its activity did not appear in logs — detection was the real problem.","multi":false},{"id":"1bycb0l","q":"A security architect must choose between (A) signature antivirus, (B) behavioral/heuristic detection with sandboxing, and (C) patching. Which statement is TRUE for zero-day malware seen before any vendor response?","a":"B offers the best pre-signature detection chance; C cannot help until a patch exists","why":"Zero-days have neither patch nor signature. Behavioral/AI-driven and sandbox analysis that watches what code DOES is the only realistic early defense.","multi":false},{"id":"1h7u3x4","q":"A web app stores its session cookies unencrypted and marks them persistent for 90 days on shared kiosks. Which improvement set BEST addresses the risk?","a":"Encrypt/secure cookies and shorten persistence, especially on shared devices","why":"Cookies can carry sensitive session data; they need encryption and careful persistence, and session (in-memory, non-persistent) cookies suit shared machines.","multi":false},{"id":"pgcjvf","q":"An attacker pairs with a victim's headset using the default PIN and plays audio prompts instructing the victim to visit a phishing site. The pairing abuse itself is best categorized as:","a":"An insecure-pairing Bluetooth weakness enabling on-path style manipulation","why":"Bluetooth risks include insecure pairing, device spoofing and on-path attacks. Best practices: unique PINs, non-discoverable default, refuse unsolicited requests, updated firmware.","multi":false},{"id":"1dgfnzt","q":"Which THREE statements accurately distinguish XSS from XSRF/CSRF? (Choose THREE.)","a":"XSS executes attacker-supplied script in the victim's browser under a trusted site's context;  XSRF causes the victim's browser to submit an unwanted action using the victim's authenticated session;  XSRF can hide inside tags like images and may not need a click","why":"XSS = code execution via the trusted site; XSRF = forged action riding session cookies, often via hidden tags. XSS does not require a prior session, and XSRF stores nothing.","multi":true},{"id":"1xj2on9","q":"Analysts hardening endpoints against OS vulnerabilities should deploy which THREE controls? (Choose THREE.)","a":"Patch management and verified (signed/hashed) updates;  Host-based IPS plus endpoint protection;  Encryption of data at rest and a host firewall","why":"The course's OS defense set: patching, HIPS, config management, encryption at rest, endpoint protection, host firewall, allow-listing, and update signature verification. Defaults, no allow-listing, and plaintext secrets are anti-controls.","multi":true},{"id":"lix6gi","q":"Which TWO are XML-specific attacks? (Choose TWO.)","a":"XML bomb (billion laughs) — exponential entity expansion exhausting memory;  XXE — external entity requesting a local file such as /etc/shadow","why":"The two XML exploits: billion laughs (DoS via expansion) and XXE (local file disclosure). Both are mitigated by input validation/sanitization and disabling unneeded entity processing.","multi":true},{"id":"1jax1gs","q":"Which TWO are recognized consequences of XSS? (Choose TWO.)","a":"Theft of protected session cookies from the victim;  Website defacement via injected HTML","why":"XSS outcomes include defacement, session-cookie theft, intercepting form data, and malware installation. It does not itself change DB permissions or touch Bluetooth/memory layout.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
