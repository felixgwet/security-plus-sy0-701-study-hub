<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dashboard · Security+ SY0-701 Study Hub</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="stats.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2d333f;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --green: #3fb950;
    --red: #f85149; --gold: #d29922;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 6px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .shield { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #1f6feb, #388bfd); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .brand h1 { font-size: 20px; line-height: 1.2; }
  .brand p { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .navbtns { display: flex; gap: 8px; }
  .navbtns a { background: var(--panel2); border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; font-size: 13px; color: var(--dim); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 18px 0 22px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
  .stat .v.g { color: var(--green); } .stat .v.b { color: var(--accent); } .stat .v.gold { color: var(--gold); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .panel h2 .tag { font-size: 10.5px; background: var(--panel2); border: 1px solid var(--border); color: var(--dim); padding: 3px 8px; border-radius: 20px; font-weight: 500; }

  .chartbox { position: relative; height: 240px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; }
  .pctbar { display: inline-block; min-width: 44px; text-align: right; font-weight: 600; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill.g { background: rgba(63,185,80,.15); color: var(--green); }
  .pill.r { background: rgba(248,81,73,.15); color: var(--red); }
  .pill.b { background: rgba(88,166,255,.15); color: var(--accent); }
  .empty { color: var(--dim); font-size: 13px; padding: 14px 4px; line-height: 1.6; }
  .scrollx { overflow-x: auto; }
  @media (max-width: 560px) {
    .brand h1 { font-size: 17px; }
    .stat .v { font-size: 20px; }
    th, td { padding: 8px 6px; font-size: 12px; }
  }
</style>
<style id="iphone-optimizations">
/* iPhone / touch optimizations */
html { -webkit-text-size-adjust: 100%; }
body { -webkit-tap-highlight-color: rgba(88,166,255,.25); }
button, .btn, .opt, .pal-btn, input, select, textarea { min-height: 44px; font-size: 16px; }
.q-text, .screen p { overflow-wrap: break-word; }
@media (max-width: 640px) {
  .container, .wrap { padding-left: 12px; padding-right: 12px; }
  .screen { padding: 24px 16px; }
  .exam-facts { flex-wrap: wrap; }
  .card { padding: 16px; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="shield">📊</div>
      <div>
        <h1>Security+ SY0-701 Study Hub</h1>
        <p>Progress &amp; analytics — stored privately on this device</p>
      </div>
    </div>
    <div class="navbtns"><a href="index.html">← Study</a></div>
  </header>

  <div class="cards" id="statcards"></div>

  <div class="panel">
    <h2>Score progression <span class="tag">all attempts, in order</span></h2>
    <div class="chartbox"><canvas id="chart"></canvas></div>
  </div>

  <div class="panel">
    <h2>Per-exam best &amp; latest</h2>
    <div class="scrollx" id="perexam"></div>
  </div>

  <div class="panel">
    <h2>Full attempt history <span class="tag" id="histcount"></span></h2>
    <div class="scrollx" id="history"></div>
  </div>

</div>

<script>
(function () {
  const attempts = SY0701_getAttempts();
  const s = SY0701_stats();

  const cards = document.getElementById('statcards');
  if (!s.count) {
    cards.innerHTML = '<div class="stat"><div class="v">0</div><div class="l">attempts yet</div></div>' +
      '<div class="stat"><div class="v b">—</div><div class="l">average</div></div>' +
      '<div class="stat"><div class="v g">—</div><div class="l">best</div></div>' +
      '<div class="stat"><div class="v gold">—</div><div class="l">mega-exam avg</div></div>';
  } else {
    cards.innerHTML =
      '<div class="stat"><div class="v">' + s.count + '</div><div class="l">attempts</div></div>' +
      '<div class="stat"><div class="v b">' + s.avg + '%</div><div class="l">average</div></div>' +
      '<div class="stat"><div class="v g">' + s.best + '%</div><div class="l">best score</div></div>' +
      '<div class="stat"><div class="v">' + (s.latest >= s.first ? '▲' : '▼') + ' ' + Math.abs(s.latest - s.first) + 'pt</div><div class="l">since first attempt</div></div>' +
      '<div class="stat"><div class="v gold">' + (s.megaAvg === null ? '—' : s.megaAvg + '%') + '</div><div class="l">mega-exam avg (' + s.megaCount + ' taken)</div></div>';
  }

  const ctx = document.getElementById('chart');
  if (attempts.length) {
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: attempts.map((a, i) => '#' + (i + 1)),
        datasets: [{
          label: 'Score %',
          data: attempts.map(a => a.pct),
          borderColor: '#58a6ff',
          backgroundColor: 'rgba(88,166,255,0.12)',
          fill: true, tension: 0.3, pointRadius: 4, pointBackgroundColor: '#58a6ff'
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          y: { min: 0, max: 100, ticks: { callback: v => v + '%', color: '#8b949e' }, grid: { color: '#21262d' } },
          x: { ticks: { color: '#8b949e' }, grid: { display: false } }
        },
        plugins: { legend: { display: false } }
      }
    });
  } else {
    ctx.parentElement.innerHTML = '<div class="empty">No attempts recorded yet. Take any quiz or exam from the <a href="index.html" style="color:var(--accent)">Study</a> tab — your results will appear here automatically.</div>';
  }

  const pe = document.getElementById('perexam');
  if (s.count) {
    const ids = Object.keys(s.bestPerExam);
    let html = '<table><tr><th>Exam</th><th>Attempts</th><th>Best</th><th>Latest</th></tr>';
    ids.forEach(id => {
      const att = attempts.filter(a => a.id === id);
      const t = att[att.length - 1].title.replace(/ · SY0-701.*$/, '').replace(/CompTIA Security\+ /, '');
      html += '<tr><td>' + SY0701_escape(t.length > 44 ? t.slice(0, 44) + '…' : t) + '</td>' +
        '<td class="num">' + att.length + '</td>' +
        '<td class="num">' + s.bestPerExam[id] + '%</td>' +
        '<td class="num">' + s.lastPerExam[id].pct + '%</td></tr>';
    });
    pe.innerHTML = html + '</table>';
  } else {
    pe.innerHTML = '<div class="empty">—</div>';
  }

  const hist = document.getElementById('history');
  document.getElementById('histcount').textContent = s.count + ' record' + (s.count === 1 ? '' : 's');
  if (s.count) {
    let html = '<table><tr><th>Date</th><th>Exam</th><th>Score</th><th>Result</th></tr>';
    attempts.slice().reverse().forEach(a => {
      const d = new Date(a.date);
      const ds = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' +
                 d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      const t = a.title.replace(/ · SY0-701.*$/, '').replace(/CompTIA Security\+ /, '');
      const res = a.scaled !== null && a.scaled !== undefined
        ? '<span class="pill ' + (a.passed ? 'g' : 'r') + '">' + a.scaled + ' / 900 ' + (a.passed ? 'PASS' : 'FAIL') + '</span>'
        : '<span class="pill b">' + a.correct + ' / ' + a.total + '</span>';
      html += '<tr><td class="num">' + ds + '</td><td>' + SY0701_escape(t.length > 40 ? t.slice(0, 40) + '…' : t) +
              '</td><td class="num"><span class="pctbar">' + a.pct + '%</span></td><td>' + res + '</td></tr>';
    });
    hist.innerHTML = html + '</table>';
  } else {
    hist.innerHTML = '<div class="empty">—</div>';
  }
})();
</script>
</body>
</html>
