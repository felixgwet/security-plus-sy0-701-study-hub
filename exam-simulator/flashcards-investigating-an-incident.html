<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #f0883e; --accent-dim: rgba(240,136,62,.14);
    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .topbar .grow { flex: 1; }
  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }
  h1 { font-size: 24px; margin: 10px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }
</style>

  <h1>Section 24 · Investigating an Incident — Flashcards</h1>
  <p class="sub">Tap the card to flip it, then grade yourself honestly &mdash; the deck remembers what you know and will prioritize your weak cards.</p>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span>cards</span></div>
    <div class="stat"><b id="stKnown" style="color:var(--green)">0</b><span>known</span></div>
    <div class="stat"><b id="stLearn" style="color:var(--gold)">0</b><span>learning</span></div>
    <div class="stat"><b id="stPos">0/0</b><span>position</span></div>

    <label class="chk"><input type="checkbox" id="shuffle"> Shuffle</label>

      <div class="card-face card-back"><span class="face-tag">Answer</span><div class="card-text" id="back"></div><div class="why" id="why"></div><span class="flip-hint">tap to flip back</span></div>
    </div>

    <div style="text-align:center;"><button class="btn" id="again">Go again</button></div>
  </div>
  <script>
    var DECKS = [{"label":"Section 24 · Investigating an Incident","cards":[{"id":"1f26445","q":"A web server log line reads: GET /login.php?user=' OR '1'='1' --. The attack type and best mitigation are:","a":"SQL injection; deploy a web application firewall with input sanitization","why":"'OR '1'='1' is the classic SQLi bypass string; a WAF between users and the database blocks it.","multi":false},{"id":"172obpw","q":"Which tool collects logs on Windows, Linux, AND Unix systems and is open source?","a":"NXLog","why":"NXLog is cross-platform and open source; rsyslog/syslog-ng are Linux/Unix-only, journald is systemd-only.","multi":false},{"id":"1wh7qra","q":"An organization is billed $10 per gigabyte of customer data transfer. Which flow standard feeds that billing system?","a":"IPFIX","why":"IPFIX standardizes flow export for measurement, accounting, and billing.","multi":false},{"id":"1jpl5a6","q":"sFlow conserves monitoring resources by:","a":"Sampling one packet out of every N (e.g. 1 of 100)","why":"Sampled Flow — statistical packet sampling gives visibility at a fraction of the cost.","multi":false},{"id":"1astgoi","q":"In an automated EDR report, a ransomware-footprint alert at 4:53 a.m. triggered automated actions. Which set matches the course example?","a":"User suspended, host isolated, backups initiated","why":"The playbook auto-suspended jdoe, isolated the file server, and started data backups.","multi":false},{"id":"1mpyvsg","q":"A vulnerability scan executive summary stating '50 of 100 machines lack a patch from five years ago' communicates primarily:","a":"A systemic patch management problem","why":"Executive summaries highlight themes — here, broken patch management, not individual CVEs.","multi":false},{"id":"c3ad93","q":"A packet capture shows 1000+ SYN packets from one source in 0.1 seconds and zero replies. The attack is:","a":"SYN flood DoS","why":"Single-source incomplete handshakes flooding a server = SYN flood DoS.","multi":false},{"id":"1as0u67","q":"A firewall log shows one external IP walking through destination ports 22, 80, 443, 8080 with incrementing source ports, all blocked. This represents:","a":"An external port scan blocked by the firewall","why":"Sequential probing of many services from one host = port scan; the firewall blocked each attempt.","multi":false},{"id":"8sydx6","q":"A WAF log URI contains '1 OR 1=1'. The status code most likely returned when the WAF blocks it is:","a":"403 Forbidden","why":"403 = understood but refused — the WAF's block response. 200 would mean it went through.","multi":false},{"id":"37t5qh","q":"An endpoint log chain: setup.exe runs → downloads update.bin → antivirus deactivates → malproc.exe spawns → registry modified → unusual outbound traffic. The stage-two file (update.bin) is:","a":"The downloaded payload that disables AV and deploys the real malware","why":"Stage 2 droppers carry the real payload — here disabling AV, spawning malproc.exe, enabling exfiltration.","multi":false},{"id":"1rh2bv7","q":"Login log shows attempts: puppy, baseball, cupcake — all failed, then lockout. This is a:","a":"Dictionary attack","why":"Common dictionary words (even leetspeak variants) = dictionary attack; incrementing PINs would be brute force.","multi":false},{"id":"acw7aa","q":"An IPS log lists six HIGH events. Five were 'blocked'; one data-exfiltration event was 'alerted.' Which gets investigated first?","a":"The alerted data exfiltration — it may have succeeded","why":"Blocked events were mitigated; the alerted exfiltration got through — determine what data was taken.","multi":false},{"id":"1hmad95","q":"Select THREE fields that identify metadata of a suspect file:","a":"MD5/SHA-256 checksum;  Creation/modification/access dates;  Owner and file path","why":"Metadata = name, size, type, dates, owner, checksum, path — data about the file, not its content.","multi":true},{"id":"zcp6hd","q":"Which THREE are exam-visible indicators of SQL injection in logs?","a":"OR '1'='1;  DROP TABLE users;  WAIT FOR DELAY (time-based)","why":"Also SELECT ... FROM sysusers. Recognizing these SQL tokens in URIs flags SQLi.","multi":true},{"id":"1w92u08","q":"Which THREE practices improve SIEM correlation quality?","a":"Normalizing timestamps to UTC;  Standardizing IP/hostname formats across sources;  Tuning sensor sensitivity to avoid overload","why":"Correlation dies with inconsistent formats/times and chokes on over-collection.","multi":true},{"id":"1swnkfn","q":"Which TWO statements about NetFlow vs full packet capture are true?","a":"NetFlow summarizes traffic metadata without payloads;  Full packet capture records every packet header and payload","why":"NetFlow = bandwidth/who/what-protocol summaries; FPC = complete contents at high storage cost.","multi":true},{"id":"19le42e","q":"A web server log shows a query string: laptops'; DROP TABLE users; --. This indicates:","a":"An SQL injection attack","why":"The apostrophe closes the string and DROP TABLE is injected SQL — classic SQL injection.","multi":false},{"id":"lurdfq","q":"The BEST mitigation for the SQL injection seen in web server logs is:","a":"A web application firewall performing input sanitization between users and the database","why":"A WAF detects and blocks SQLi patterns and sanitizes input before it reaches the database.","multi":false},{"id":"1h1dadr","q":"A SIEM analyst notices failed authentication attempts trending upward. This trend may indicate:","a":"A brute-force attack in progress","why":"Rising failed logins across the SIEM are a classic brute-force indicator.","multi":false},{"id":"1p1vwl6","q":"For SIEM correlation across systems, timestamps should be normalized to:","a":"UTC (Universal Time)","why":"Mixed time zones destroy correlation; standardize on UTC.","multi":false},{"id":"fomjj3","q":"Overly high SIEM sensor sensitivity risks:","a":"Overloading the SIEM with processing, bandwidth, and storage costs","why":"Logging everything floods the SIEM — tune sensitivity to balance visibility and cost.","multi":false},{"id":"wovkh8","q":"Which log collection tool is cross-platform (Linux, Unix, AND Windows) and open source?","a":"NXLog","why":"Rsyslog and Syslog-ng are Linux/Unix-only; NXLog runs on Windows too.","multi":false},{"id":"1hekwog","q":"On a Linux system, which command queries and displays logs from the journald logging service?","a":"journalctl","why":"journalctl is the command-line utility for journald (systemd's logging service).","multi":false},{"id":"1s64fej","q":"NetFlow differs from full packet capture in that NetFlow:","a":"Summarizes traffic metadata (origin, destination, volume) without contents","why":"NetFlow records metadata/summaries — it can't show which file crossed the wire.","multi":false},{"id":"wfntl7","q":"sFlow reduces monitoring data size by:","a":"Sampling — capturing one out of every N packets (e.g. 1 of 100)","why":"sFlow = Sampled Flow — statistically samples packets for monitoring.","multi":false},{"id":"1iwsryy","q":"IPFIX is most directly associated with:","a":"Exporting IP flow information for measurement, accounting, and billing","why":"IPFIX (IP Flow Information Export) standardizes flow export — e.g. billing per GB used.","multi":false},{"id":"1q7y0y5","q":"Metadata is best defined as:","a":"Data about data — e.g. call times, numbers, and durations without conversation content","why":"Metadata describes other data: who, when, how long — not the content itself.","multi":false},{"id":"thf3ad","q":"On a Splunk security dashboard, 'endpoint notables' jumping from ~100 to ~1000 in an hour suggests:","a":"Endpoints may be under attack and warrant drill-down investigation","why":"Trend spikes against baseline signal incidents — click to drill into the affected hosts.","multi":false},{"id":"15y8sa4","q":"Dashboard urgency levels, from lowest to highest, include:","a":"Unknown, informational, low, medium, high, critical","why":"Unknown → informational → low → medium → high → critical; goal = drive criticals to zero.","multi":false},{"id":"1gj5r22","q":"In the EDR report, a critical alert at 4:53 a.m. showed rapid file access matching known ransomware footprints. Automated playbook actions included:","a":"Suspending the user account, isolating the host, and initiating backups","why":"Automated response: suspend user, kick host off network/isolate, and start backup procedures.","multi":false},{"id":"4coyv1","q":"20+ failed admin logins in under 5 minutes on the domain controller from an INTERNAL IP suggests:","a":"An insider threat or a host already compromised via phishing/social engineering","why":"Internal-originated DC attacks mean the attacker is inside the perimeter.","multi":false},{"id":"l21mfa","q":"An informational alert shows FileZilla installed with a hash not matching a known-safe version. The BEST first step is to:","a":"Verify with the user whether they installed it (policy violation vs. compromised account)","why":"User confirmation distinguishes an acceptable-use violation from account compromise.","multi":false},{"id":"62ontl","q":"A scan flags a Linux server as missing Microsoft hotfix MS21-087. The analyst should:","a":"Treat it as a likely false positive and validate manually","why":"Platform-mismatched findings are classic false positives — validate before remediating.","multi":false},{"id":"1s0ljmu","q":"An unauthenticated RDP remote code execution flaw on desktops versus an authenticated RCE on the Exchange Server — which did the course call more severe per-host, and why?","a":"RDP — unauthenticated means anyone can exploit it, no credentials needed","why":"Unauthenticated attacks are reachable by anyone; the Exchange CVE still scored higher due to organization-wide impact.","multi":false},{"id":"1codkw6","q":"When no patch or upgrade exists for a vulnerable Apache Druid server, the report recommends:","a":"Compensating controls or other mitigations","why":"When remediation isn't possible (no update or platform can't run it), use compensating controls.","multi":false},{"id":"1jsyc7d","q":"Log4Shell (CVE-2021-44228) remediation per the course:","a":"Update Log4j to version 2.15.0 or higher","why":"Log4Shell is the Apache Log4j RCE; 2.15.0+ closes it.","multi":false},{"id":"9d0ckj","q":"The Exchange Server critical finding matters far less if:","a":"It is being decommissioned tomorrow","why":"Organizational context changes priority — imminent decommissioning makes the CVE moot.","multi":false},{"id":"159jc0z","q":"CVE details (impact, exploitation, mitigations) can be looked up at:","a":"cve.org","why":"cve.org (MITRE's CVE site) holds full vulnerability records.","multi":false},{"id":"n6z0im","q":"A capture shows one source sending SYNs to destination ports 80, 23, 22, 21, 443 in sequence. This is:","a":"An Nmap port scan","why":"Sequential SYN probes across many ports from one host = port scan reconnaissance.","multi":false},{"id":"1i0au5j","q":"Thousands of SYN packets from ONE source with no SYN-ACK or ACK replies completing the handshake indicate:","a":"A SYN flood denial-of-service attack (half-open connections)","why":"Incomplete three-way handshakes exhaust server resources = SYN flood DoS.","multi":false},{"id":"9emnh3","q":"3,500 packets in ~1.75 seconds hitting ONE destination from MANY different source IPs (192.168.1.101, .102, .103...) indicates:","a":"A distributed denial-of-service (DDoS) attack","why":"Many sources hammering one victim = DDoS, typically from a botnet.","multi":false},{"id":"lrw9h3","q":"Why must you record when a packet capture started?","a":"Packet timestamps are elapsed-time offsets, so the start time lets you correlate with SIEM logs","why":"Elapsed-time timestamps only become meaningful when anchored to the real start time.","multi":false},{"id":"1tu9l3h","q":"A firewall log shows one external IP stepping through destination ports 22, 80, 443, 8080 — all blocked. This is:","a":"A port scan blocked by the firewall","why":"One source probing multiple closed services = external port scan; the firewall did its job.","multi":false},{"id":"da0cn8","q":"In WAF logs, HTTP status 403 means:","a":"Forbidden — the server understood but refused the request (blocked)","why":"200 = OK; 403 = Forbidden — here, the WAF refusing a malicious request.","multi":false},{"id":"8otxrh","q":"A WAF log URI contains: /search?q=' DROP TABLE users --. This is:","a":"A destructive SQL injection attempt (blocked, we hope)","why":"DROP TABLE is a destructive SQL command — classic SQLi signature.","multi":false},{"id":"dxtvo8","q":"A URI containing a WAIT FOR DELAY pattern indicates:","a":"A time-based blind SQL injection","why":"Forced delays let attackers infer database responses blindly — time-based SQLi.","multi":false},{"id":"17f5b0r","q":"In the word-processor application log, which file was malicious?","a":"Q3-Financials.docx — its macro matched known malware and was quarantined","why":"Events 5400–5403 and 5409 all flag Q3-Financials.docx's macro.","multi":false},{"id":"1eny9mw","q":"The sequence 'macro execution attempt blocked → macro security alert → scan matches known malware → file quarantined' shows:","a":"Defense-in-depth catching a malicious macro before execution","why":"Layered controls detected, warned, identified, and isolated the malicious document.","multi":false},{"id":"6m3iuz","q":"In the endpoint log, setup.exe was a 'stage one dropper,' meaning it:","a":"Downloads the larger stage-two payload containing the real malicious code","why":"Stage 1 droppers fetch and launch the real payload (update.bin in the example).","multi":false},{"id":"66khjp","q":"The clearest sign of data exfiltration in the endpoint log chain was:","a":"Unusual outbound traffic following the malicious process and registry changes","why":"malproc.exe beaconing data out after disabling AV and modifying the registry = exfiltration.","multi":false},{"id":"1kag2x6","q":"Smart-card PIN attempts of 123456, 123457, 123458 every two seconds indicate:","a":"A brute-force attack","why":"Sequential incrementing guesses = brute force; random-looking guesses also fit.","multi":false},{"id":"xgqfbm","q":"Login attempts using puppy, baseball, cupcake, and loved indicate:","a":"A dictionary attack","why":"Common dictionary words (even leetspeak variants like b@seball) = dictionary attack.","multi":false},{"id":"1naztuk","q":"A log showing a 'blocking' action tells you this device is a(n):","a":"IPS","why":"Only an IPS (prevention) blocks inline; IDS only detects and alerts.","multi":false},{"id":"1fplfln","q":"Among six HIGH events, the top investigation priority is the one that was:","a":"Alerted (not blocked) — data exfiltration that may have succeeded","why":"Blocked highs were mitigated; the alerted exfiltration got through — find out what was taken.","multi":false},{"id":"1swognn","q":"A router log shows repeated ARP replies mapping IP 192.168.1.10 to two DIFFERENT MAC addresses within seconds. This indicates:","a":"Possible ARP spoofing (MAC flipping)","why":"One IP claiming multiple MACs rapidly = someone spoofing ARP responses.","multi":false},{"id":"19zaeck","q":"Outbound traffic to 8.8.8.8 over UDP port 53 in a router log is:","a":"Normal DNS queries to Google's public DNS","why":"8.8.8.8:53/UDP is Google's DNS — routine name resolution.","multi":false},{"id":"1l1kiii","q":"The most common way to block a known-malicious file network-wide using metadata is by its:","a":"MD5/SHA-256 checksum (digital fingerprint)","why":"Hashes uniquely identify the file (including its malware) regardless of name changes.","multi":false},{"id":"dqmayo","q":"A file named invoice.pdf whose true internal type is an executable is suspicious due to:","a":"An extension/type mismatch — .pdf hiding an .exe","why":"Windows trusts extensions; Linux/Mac inspect content bytes — a mismatch screams malware.","multi":false},{"id":"1vnbvb9","q":"Malware running from C:TEMP rather than a user's Documents folder is:","a":"A suspicious indicator often seen in malware behavior","why":"Temp-directory execution is a common malware indicator supporting IoC analysis.","multi":false},{"id":"166xb95","q":"The course calls 4.9 (using data sources to support an investigation) one of the hardest objectives because it requires:","a":"Reading a log snippet and deciding the attack type and remediation","why":"Scenario-based: interpret evidence in snippets (web logs, pcaps, firewall logs) and respond correctly.","multi":false},{"id":"1lx27yw","q":"Which log type records which websites users visited and which files outsiders touched on your web server?","a":"Web/proxy logs","why":"Web/proxy logs capture browsing and web server file access; DNS logs only show name resolutions.","multi":false},{"id":"ndyc7e","q":"A host crashes and writes its memory contents to disk for later analysis. That artifact is a:","a":"Dump file","why":"Crash dump files preserve memory contents and can be fed into analysis systems.","multi":false},{"id":"iy3klp","q":"A SIEM alert rule fires when an account reaches five failed logins. This is an example of:","a":"Alerting based on a threshold across aggregated data","why":"Threshold-triggered notifications to administrators = SIEM alerting.","multi":false},{"id":"181khlx","q":"The biggest reason NOT to send every possible event to the SIEM at maximum sensitivity is:","a":"Processing, bandwidth, and storage costs can overload the SIEM","why":"Balance visibility with cost — over-collection floods the very system you need for clarity.","multi":false},{"id":"1ei8mn9","q":"On a dashboard, 'network notables going down' most directly suggests:","a":"Improving network security posture","why":"Fewer notable events = better posture; rising trends (especially criticals/endpoint spikes) need drill-down.","multi":false},{"id":"19vzzbo","q":"An automated report's 'prepared by' field shows 'automated reporting system.' This tells you:","a":"The report was generated automatically, not written by a named analyst","why":"Automated reports list the system as author; analysts still must review and act.","multi":false},{"id":"cmr7j1","q":"A moderate alert shows a database server transferring a large volume to an IP flagged by threat intelligence feeds. Before declaring an incident, analysts should consider:","a":"Whether offsite cloud backups legitimately explain the outbound transfer","why":"Benign explanations (scheduled backups) must be ruled out — that's why connection review follows termination.","multi":false},{"id":"18l0i69","q":"Why did the course's RDP vulnerability (unauthenticated, arbitrary code) get a LOWER CVSS than the Exchange CVE (authenticated)?","a":"Impact scope differs — one desktop vs the entire organization's email server","why":"CVSS weighs impact: organization-wide Exchange compromise outranks single-workstation RDP.","multi":false},{"id":"1k8lrmw","q":"A 403 status on a request containing SELECT COUNT(*) FROM sysusers means the WAF:","a":"Blocked an information-gathering SQL injection attempt","why":"SELECT on system tables = SQLi reconnaissance; 403 shows the WAF refused it.","multi":false},{"id":"gp0tic","q":"The word-processor log sequence ends with an 'admin alert' event. Its purpose was to:","a":"Notify administrators that a malicious macro was detected and blocked in Q3-Financials.docx","why":"Event 5409 escalated the macro detection to admins for response.","multi":false},{"id":"1b3nsbb","q":"In the endpoint log, the user's MOST consequential mistake was:","a":"Overriding the antivirus alert and running setup.exe anyway","why":"Ignoring the AV warning let the stage-1 dropper execute — the pivot point of the whole infection.","multi":false},{"id":"e91thv","q":"Which THREE artifacts belong in a vulnerability scan report header/structure?","a":"Report ID and scan date/time;  Scanner version and definitions used;  Name of the person who ran the scan","why":"Header = ID, date, tool/definition versions, operator — then summary, findings by severity/host, recommendations.","multi":true},{"id":"1ml4d09","q":"Which THREE statements about reading vulnerability scan results are good practice?","a":"Verify each finding — scanners produce false positives;  Factor in your own mitigations and compensating controls;  Consider business context (e.g. imminent decommissioning)","why":"Analyst judgment + org context beats blind scanner ranking.","multi":true},{"id":"5fbkqj","q":"Which THREE clues in a router log point to ARP spoofing?","a":"Repeated ARP replies;  The same IP mapping to two different MAC addresses;  MAC addresses flipping within seconds","why":"Rapid IP→MAC reassignment is the ARP-spoof signature; DNS and SSH lines are routine.","multi":true},{"id":"1r0d4pd","q":"Which TWO file-metadata indicators can expose a malicious invoice.pdf?","a":"SHA-256 hash matching known malware;  Extension/type mismatch (.pdf that's really an executable)","why":"Hash-based blocking stops redistribution; type mismatches expose disguise. Dates/path (C:TEMP) add suspicion.","multi":true},{"id":"4l9p2v","q":"An analyst must decide whether a 10-line log snippet shows an attack. The course's recommended exam mindset is:","a":"Ask what the question is trying to show you — pick the most obvious supported conclusion","why":"Real analysts want more data, but the exam expects the best-supported reading of the snippet (e.g. many sources + one victim = DDoS).","multi":false},{"id":"pxmk50","q":"Which pairing of flow technology and characteristic is correct?","a":"sFlow — samples 1 of N packets (open standard)","why":"NetFlow=Cisco proprietary metadata; sFlow=sampled/open; IPFIX=IETF standard.","multi":false},{"id":"6csbsf","q":"A dashboard shows critical urgency notables at 10 while mediums run 800–2000. The executive takeaway should be:","a":"Criticals are few — but drive those specific 10 to zero while monitoring the rest","why":"Urgency tiers guide focus: small critical counts still deserve immediate remediation.","multi":false},{"id":"4mch81","q":"The internal-IP brute-force against the domain controller in the automated report was especially concerning because:","a":"Attacks from inside the perimeter imply an insider or an already-compromised internal host","why":"Perimeter defenses assume external threats; internal DC attacks signal deeper compromise.","multi":false},{"id":"co2k1p","q":"A scan report flags Log4Shell on an isolated legacy server with network controls already blocking access, scoring it 3.7. The analyst should conclude:","a":"Existing mitigations reduce real-world priority — still plan the Log4j 2.15.0+ update","why":"CVSS measures inherent severity; your compensating controls lower actual risk but patching remains the goal.","multi":false},{"id":"13jd9m4","q":"Which status code in WAF logs confirms a request SUCCEEDED and demands the fastest review?","a":"200 on an SQLi-pattern request","why":"A 200 means the malicious request went through — the WAF failed; 403s show blocks working.","multi":false},{"id":"x84o5v","q":"Time-based blind SQLi differs from classic SQLi in that it:","a":"Infers truth by forcing database delays (e.g. WAIT FOR DELAY) instead of seeing direct output","why":"When results aren't returned, attackers measure response delays to extract data blindly.","multi":false},{"id":"1y2ch9d","q":"The endpoint log shows the malicious process modified the registry. Most likely purpose:","a":"Persistence — surviving reboots and embedding the malware in the system","why":"Registry modification by malware typically establishes persistence or disables protections.","multi":false},{"id":"1e88rwl","q":"Which WAF log line is the most destructive if NOT blocked?","a":"GET /search?q=' DROP TABLE users --","why":"DROP TABLE destroys data — the most destructive of these SQLi payloads.","multi":false},{"id":"16iiqkb","q":"An IPS log 'blocking' action versus an IDS means your analysis priority shifts because blocked events are:","a":"Already mitigated — prioritize alerts/monitors that got through","why":"Prevention already handled blocks; investigate what slipped past (e.g. exfiltration alerts).","multi":false},{"id":"wu05fc","q":"Metadata analysis shows invoice.pdf was created in 2012, yet it arrived 'today' as an overdue bill. The best interpretation:","a":"A suspicious mismatch warranting malware analysis and hash-based blocking","why":"Implausible timestamps + phishing context + hash fingerprinting = treat as malicious until cleared.","multi":false},{"id":"1nfyfmo","q":"Why do exam logs often use 10.x, 172.x, or 192.x addresses even for 'external' attackers?","a":"To avoid labeling real companies' public IPs as malicious — treat them simply as source/destination","why":"The course's tip: don't get hung up on RFC-1918 ranges; analyze the behavior pattern.","multi":false},{"id":"1bscra9","q":"Select THREE valid actions after detecting repeated blocked attacks from the same external IP:","a":"Investigate who is behind the attempts;  Block the source IP at the perimeter;  Tune the IPS to strengthen coverage","why":"Blocked events still warrant source investigation, IP blocking, and defensive tuning.","multi":true},{"id":"2vwem2","q":"Which THREE are part of the course's incident data-collection checklist?","a":"Capture and hash system images (FTK Imager);  Capture screenshots of the machine as found;  Review network traffic captures and CCTV footage","why":"Also witness statements, volatility ordering, documentation review, and cost tracking.","multi":true},{"id":"6a3f6g","q":"Which THREE distinguish a DDoS from a plain DoS in a packet capture?","a":"Many different source IP addresses;  The same destination target throughout;  Half-open SYN floods exhausting the victim","why":"DDoS = distributed sources + one victim + resource exhaustion; single source = regular DoS.","multi":true},{"id":"1addxdp","q":"Which TWO file-hash practices were emphasized?","a":"Hash every acquired image and log it in the chain of custody;  Prefer SHA-1/SHA-256 because MD5 is weak","why":"Hashing proves integrity; MD5 alone is outdated — combine or upgrade to SHA.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
