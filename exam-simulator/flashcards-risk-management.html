  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }

  <script>
    var DECKS = [{"label":"Section 8 · Risk Management","cards":[{"id":"1hkc4ml","q":"A CISO finds that risks identified last year were never looked at again, and two new vendor-related threats emerged unnoticed. Which lifecycle step was most likely skipped or under-resourced?","a":"Risk monitoring","why":"Risk monitoring is the ongoing tracking of identified risks, watching residual risk, identifying NEW risks, and reviewing the effectiveness of the response plans. Skipping it leaves the process static — existing risks go stale and emerging ones (like the vendor threats) are missed until they cause damage.","multi":false},{"id":"17tdrh0","q":"An airline performs a full risk assessment the week after a volcanic-ash event grounds its fleet, and again two years later when a similar eruption occurs. Which assessment frequency does this demonstrate?","a":"Ad-hoc","why":"Ad-hoc assessments are triggered by specific events or situations (a disaster, regulatory change, new market) and may be repeated when similar circumstances arise — exactly this pattern. One-time would be tied to a single project and never repeated; recurring would follow a fixed calendar; continuous would be real-time.","multi":false},{"id":"16l8g05","q":"A hospital's ER system fails. Leadership states the service must be restored within 4 hours to avoid patient-safety consequences, and that backups every 30 minutes are sufficient. Which pair correctly labels these two requirements?","a":"RTO = 4 hours; RPO = 30 minutes","why":"RTO is the max acceptable DOWNTIME — restore within 4 hours. RPO is the max acceptable DATA LOSS in time — 30 minutes of backups means at most 30 minutes of data lost. MTTR/MTBF are repair-time and failure-frequency statistics, not recovery objectives.","multi":false},{"id":"1l818yg","q":"Over 12 months, a pump fails 3 times and each repair takes an average of 6 hours. Which statement is correct?","a":"MTTR is 6 hours and MTBF is about 4 months","why":"MTTR = average repair time = 6 hours (maintainability — lower is better). MTBF = average time between failures = 12 months ÷ 3 failures ≈ every 4 months (reliability — higher is better). The 3×6=18 figure is a distractor; MTBF counts intervals between failures, not total downtime.","multi":false},{"id":"1gkxvzu","q":"A risk committee documents a risk as: 'Datacenter flood — likelihood medium, impact high, outcome severe service outage, level high, estimated cost $2M, owner facilities director, KRI: monthly humidity sensor alerts.' Which element is the KRI?","a":"The monthly humidity sensor alerts","why":"Key risk indicators are predictive, forward-looking metrics that give an early signal of increasing risk exposure — like humidity sensor alerts trending up before a flood. Cost is the financial estimate, the level is impact×likelihood, and the facilities director is the risk OWNER (responsible for monitoring, mitigating, and updating the register).","multi":false},{"id":"1qk9gv","q":"A utility sets a policy that it will tolerate at most a 1-in-50-year catastrophic event without hedging, but its board actively seeks growth investments with elevated risk for higher returns. The 1-in-50 limit and the board's posture are, respectively:","a":"Risk tolerance; risk appetite","why":"Risk TOLERANCE is the maximum amount of risk the organization is prepared to ACCEPT while achieving objectives (a ceiling). Risk APPETITE is the amount and type of risk it's willing to PURSUE or retain for strategic objectives (its posture — here expansionary). Define both up front before categorizing risk levels.","multi":false},{"id":"16pya52","q":"A PMO scores risks with a 5×5 likelihood-impact matrix and expert workshops, producing a high/medium/low priority list with no dollar figures. Which analysis method is this?","a":"Qualitative risk analysis","why":"Categorical scales (high/medium/low), subjective ratings, and reliance on stakeholder expertise with no numerical monetary values = qualitative risk analysis. Quantitative would compute concrete values (EF, SLE, ARO, ALE). A BIA evaluates disruption effects on business functions; continuous assessment is a monitoring frequency, not an analysis method.","multi":false},{"id":"1irtvns","q":"A data center asset is valued at $500,000. A fire scenario would damage 40% of it, and such a fire is expected once every 25 years. What is the ALE?","a":"$8,000","why":"EF = 40%. SLE = $500,000 × 0.40 = $200,000. ARO = 1 ÷ 25 = 0.04. ALE = SLE × ARO = $200,000 × 0.04 = $8,000 per year. Chain the formulas: SLE = AV × EF, ALE = SLE × ARO.","multi":false},{"id":"7x38w0","q":"Using the same figures ($500,000 asset, ALE $8,000), a vendor proposes a fire suppression upgrade costing $100,000 that would prevent the fire entirely. The BEST risk-strategy assessment is:","a":"The $100,000 cost vastly exceeds the $8,000/year ALE, so paying for full prevention is poor value; consider cheaper mitigation or transfer","why":"Quantitative analysis exists for cost-benefit decisions: spending $100,000 to prevent an $8,000/year expected loss needs over 12 years to break even. The rational options are cheaper mitigations, transferring via insurance, or accepting — not an expensive control that costs far more than the risk it removes.","multi":false},{"id":"1dsiq5j","q":"A retail chain inserts a clause into its contractor agreement stating the contractor must compensate the chain for any damage caused during store fit-outs. Which risk strategy is this, and which concept applies?","a":"Transference, using a contract indemnity clause","why":"An indemnity clause is a contractual agreement where one party compensates the other for harm or loss arising from the contract — a classic risk TRANSFER mechanism alongside insurance. The financial burden shifts to the contractor, though the risk itself isn't eliminated and reputational exposure stays with the chain.","multi":false},{"id":"1vjbzdi","q":"A bank accepts a low-level risk of minor website defacement because fixing it would cost more than the damage it could cause, and documents this decision via the regulator's provision allowing small institutions to skip that specific control. This is risk acceptance implemented through:","a":"An exemption","why":"An EXEMPTION excludes a party from a rule or requirement entirely — the small bank is not subject to that control at all, freeing it from both the compliance burden and the rule's protection, and it accepts the associated risk. An exception would mean it's normally subject to the rule but can avoid it only under specific circumstances.","multi":false},{"id":"1w67cjd","q":"Six months after deploying a new web application firewall, the security team notices it now blocks a far smaller share of attacks as adversaries adapt. Monitoring quantified this decay. Which concept did the team measure?","a":"Control risk","why":"Control risk measures how much LESS effective a security control has become over time — the course's example is signature-based antivirus degrading as hackers obfuscate code. Here the WAF's effectiveness decayed. Residual risk is what remains after treatment; this measurement is about the treatment itself weakening.","multi":false},{"id":"lz7dln","q":"Which of the following are genuine risk assessment frequencies from the course? (Select FOUR.)","a":"Ad-hoc;  Recurring;  One-time;  Continuous","why":"The four frequencies: ad-hoc (event-driven, may repeat), recurring (scheduled intervals like annual/quarterly/monthly), one-time (project-specific, never repeated), and continuous (ongoing real-time, technology-enabled). 'Sporadic' and 'retrospective' sound plausible but are not course terms.","multi":true},{"id":"1vvdhv8","q":"Which items are the course's four BIA-related recovery/reliability metrics? (Select the THREE that belong, noting one option does not.)","a":"Recovery time objective (RTO);  Recovery point objective (RPO);  Mean time to repair (MTTR)","why":"The BIA lesson's four metrics: RTO (max tolerable downtime), RPO (max tolerable data loss in time), MTTR (average repair time — lower is better), and MTBF (average time between failures — higher is better). ALE belongs to quantitative risk ANALYSIS, a different step — the planted intruder.","multi":true},{"id":"3qhu0r","q":"Which elements belong in a risk register according to the course? (Select FOUR.)","a":"Risk description;  Risk likelihood;  Risk owner;  Key risk indicators","why":"A risk register (risk log) records each risk's description, impact, likelihood, outcome, level/threshold, and cost — plus the risk owner (who manages it) and key risk indicators (early-warning metrics). Calendars, salaries, and asset serial numbers belong to other documents entirely.","multi":true},{"id":"enyg4q","q":"Which statements correctly describe quantitative risk analysis? (Select THREE.)","a":"It assigns concrete numerical values to risk factors;  It provides a probabilistic, objective evaluation used for financial, safety, and scheduling decisions;  Its key components include EF, SLE, ARO, and ALE","why":"Quantitative analysis numerically estimates probability and impact — concrete values, probabilistic and objective, used for money/safety/schedule decisions. Formulas: SLE = AV × EF; ALE = SLE × ARO (multiply, not divide). The subjective descriptive-scales description fits QUALITATIVE analysis, and a lower ARO means the threat occurs LESS often.","multi":true},{"id":"1p9nzgp","q":"What is the correct order of the risk management lifecycle as taught in the course?","a":"Identification, analysis, treatment, monitoring, reporting","why":"The lifecycle: (1) identify risks, (2) analyze likelihood and impact, (3) treat them with a strategy, (4) monitor ongoing/residual risks, (5) report to stakeholders. You cannot treat a risk before analyzing it — analysis produces the prioritized list that guides treatment.","multi":false},{"id":"10p8n7z","q":"What does the risk analysis step produce?","a":"A prioritized list of risks based on their potential severity","why":"Risk analysis evaluates likelihood and impact of identified risks — qualitatively (categories/scales) or quantitatively (numerical values) — and its outcome is a prioritized list of risks by potential severity, which then guides the risk treatment process.","multi":false},{"id":"10qpyeh","q":"Risk treatment strategies include which of the following sets?","a":"Avoidance, reduction, sharing, acceptance","why":"Risk treatment means developing strategies to manage identified risks: avoidance, reduction (mitigation), sharing (transfer), and acceptance. The choice depends on the risk's potential impact and the organization's risk tolerance, with the goal of reducing potential impact to an acceptable level.","multi":false},{"id":"olbvcg","q":"Why is risk monitoring described as a crucial step?","a":"It keeps the risk management process dynamic and responsive to changes in the internal and external environment","why":"Risk monitoring is ongoing: tracking identified risks, monitoring residual risk, identifying new risks, and reviewing process effectiveness. This keeps the process dynamic and responsive — without it, the risk picture would go stale as the environment changes.","multi":false},{"id":"lqj0fz","q":"Risk reporting should be tailored to:","a":"The needs of the audience receiving it","why":"Risk reporting communicates risk information and process effectiveness to all relevant stakeholders. It can take many forms — dashboards, heat maps, detailed reports — and should be tailored to meet the needs of the audience, ensuring accountability and supporting informed decision making.","multi":false},{"id":"17c31vg","q":"A company launches a risk assessment specifically because a new regulation was announced last week. Which type of assessment is this?","a":"Ad-hoc","why":"Ad-hoc assessments are conducted as and when needed, often in response to a specific event or situation — a new product, a new market, a natural disaster, or (as here) a major regulatory change. Recurring assessments follow a fixed calendar instead.","multi":false},{"id":"100rzam","q":"A financial institution runs credit-risk, market-risk, and operational-risk assessments every quarter as part of standard operating procedure. This is an example of:","a":"Recurring assessment","why":"Recurring assessments are conducted at regular intervals — annually, quarterly, or monthly — as part of standard operating procedures, ensuring risks are continually identified, analyzed, and managed. A tech company scheduling regular penetration tests is another course example.","multi":false},{"id":"g8dl7p","q":"An organization assesses risk once, for the specific purpose of implementing a new IT system, and never repeats it. Which type of assessment is this?","a":"One-time","why":"One-time assessments are conducted for a specific purpose — a particular project or initiative like a new IT system, construction project, or organizational change — and are not repeated. Trap: ad-hoc sounds similar, but ad-hoc is event-driven and MAY be repeated if similar circumstances recur.","multi":false},{"id":"1v139e","q":"What is the key difference between ad-hoc and one-time risk assessments?","a":"One-time is tied to a specific project and never repeated; ad-hoc responds to an event and may be repeated if similar circumstances arise","why":"One-time assessments are associated with a specific project or initiative and are not repeated. Ad-hoc assessments respond to a specific event or situation and may be repeated if similar circumstances arise in the future. The distinction is repeatability and trigger, not cost or method.","multi":false},{"id":"q9fxls","q":"A SOC uses tooling that collects and analyzes threat and vulnerability data in real time so the team can respond quickly. Which assessment frequency does this represent?","a":"Continuous","why":"Continuous risk assessment involves ongoing monitoring and evaluation of risk — typically technology-enabled with real-time data collection and analysis. A cybersecurity team continuously monitoring threats and vulnerabilities to respond quickly is the course's flagship example.","multi":false},{"id":"1dtq6w4","q":"Which of these is NOT a technique the course lists for risk identification?","a":"Annualized loss expectancy","why":"Risk identification techniques include brainstorming, checklists, interviews, and scenario analysis. Annualized loss expectancy (ALE) belongs to quantitative risk ANALYSIS, not identification — a classic cross-step distractor.","multi":false},{"id":"n789pb","q":"A business impact analysis (BIA) does all of the following EXCEPT:","a":"Assign insurance premiums for each business function","why":"A BIA evaluates the potential effects of disruption: it identifies and prioritizes critical functions, assesses impact/risk on them, and determines recovery speed requirements. Insurance pricing is part of risk transference, not the BIA.","multi":false},{"id":"r2gr83","q":"An e-commerce site can be down for at most two hours before sales and customer satisfaction damage becomes severe. Which metric is defined here?","a":"RTO","why":"The recovery time objective (RTO) is the maximum acceptable length of time before the lack of a business function severely impacts the organization — the target time to RESTORE the function. Two hours of tolerable downtime is an RTO of two hours.","multi":false},{"id":"104yc8w","q":"A bank determines it can afford to lose at most 15 minutes of transaction data in a failure. What does this mean for its backup schedule?","a":"Backups must run at least every 15 minutes","why":"This is a recovery point objective (RPO) of 15 minutes — the maximum acceptable data loss measured in time. To meet it, systems must be backed up at least every 15 minutes. Trap: this says nothing about how fast systems must be restored (that's RTO).","multi":false},{"id":"1iedqts","q":"RPO and RTO differ in that:","a":"RPO is about data loss measured in time; RTO is about how quickly a function must be restored","why":"RPO = maximum acceptable DATA LOSS measured in time (drives backup frequency). RTO = maximum acceptable DOWNTIME — the target time to restore a business function. Both guide disaster recovery and business continuity planning, but they measure different things.","multi":false},{"id":"11oxwgv","q":"A machine broke down five times last year, and each repair took an average of four hours. What are its MTTR and MTBF?","a":"MTTR 4 hours; MTBF about 2.4 months","why":"MTTR = average repair time = 4 hours (lower is better — fast repair). MTBF = average time BETWEEN failures: five failures spread over a year ≈ every 2.4 months (~72 days) — higher is better, meaning it fails less often. The 5×4=20 hours is a distractor; MTBF measures intervals, not cumulative repair time.","multi":false},{"id":"1jxuqva","q":"Which statement about MTTR and MTBF is TRUE?","a":"Lower MTTR and higher MTBF are both desirable","why":"MTTR (mean time to REPAIR) measures maintainability — lower is better. MTBF (mean time BETWEEN failures) measures reliability — higher is better. A system you want: rarely fails (high MTBF) and is quick to fix when it does (low MTTR).","multi":false},{"id":"52ajtt","q":"A risk register is BEST described as:","a":"A document recording details about identified risks — description, impact, likelihood, and mitigation actions","why":"The risk register (a.k.a. risk log) records details about identified risks — description, impact, likelihood, and mitigation actions. It's a crucial communication tool for tracking and managing risks throughout the project lifecycle, may resemble a heat map risk matrix, and should be shared with shareholders.","multi":false},{"id":"468sn4","q":"In the risk register, the risk level (or threshold) is determined by combining:","a":"Impact and likelihood","why":"Risk level/threshold is determined by combining impact and likelihood. It categorizes risk as high, medium, or low and drives prioritization — which risks require immediate attention.","multi":false},{"id":"ztwnkq","q":"Key risk indicators (KRIs) are best described as:","a":"Predictive metrics that provide an early signal of increasing risk exposure","why":"KRIs are critical predictive metrics providing a forward-looking early signal of increasing risk exposure — a barometer of risk. Example: a sudden rise in loan defaults warns a bank of growing credit-default risk before it escalates. They're tied to risk appetite and organizational objectives.","multi":false},{"id":"11wp6nh","q":"The risk owner is responsible for:","a":"Monitoring the risk, implementing mitigation actions, and updating the risk register","why":"The risk owner is the person or group responsible for MANAGING the risk: monitoring it, implementing mitigation actions, and updating the risk register as necessary. Example: a construction project manager owns risks like weather delays and material cost overruns, and mitigates them (schedule dry-weather work, lock in prices early).","multi":false},{"id":"rxzu8j","q":"Risk appetite vs risk tolerance:","a":"Tolerance is the maximum risk you're prepared to accept while achieving objectives; appetite is the amount and type of risk you're willing to pursue or retain to achieve strategic objectives","why":"Risk tolerance/acceptance = the maximum amount of risk you're prepared to accept while achieving objectives (a ceiling — beyond it, countermeasures are mandatory). Risk appetite = the amount and TYPE of risk you're willing to pursue or retain for strategic objectives (your posture toward risk-taking). Identify BOTH up front, before categorizing risk levels.","multi":false},{"id":"ipksu6","q":"A startup aggressively pursues risky new markets for the chance of much higher returns. Its risk appetite is best described as:","a":"Expansionary","why":"Expansionary risk appetite = willing to take on MORE risk for potentially higher returns (aggressive growth businesses). Conservative = less risk, lower returns, prioritizing stability. Neutral = balanced risk and return, steady growth. 'Adversarial' is not a risk appetite type.","multi":false},{"id":"1dgay2w","q":"A bank is NOT subject to a certain reporting rule at all, freeing it from both the compliance burden and the rule's protection. This is an example of:","a":"A risk exemption","why":"An exemption is a provision that excludes a party from a rule or requirement entirely — the party is not subject to it, bears no compliance burden, and accepts the risk of operating without the rule's protection. An exception, by contrast, means you're normally subject to the rule but can avoid it under specific circumstances.","multi":false},{"id":"w0rvsi","q":"A company is normally subject to a data-protection rule, but the regulation allows it to process personal data without consent under specific, narrow circumstances. This provision is a(n):","a":"Exception","why":"An exception lets a party avoid a rule under specific circumstances — generally subject to the rule, but released from the associated risk when conditions apply. An exemption would mean the party is never subject to the rule at all.","multi":false},{"id":"ws61ep","q":"Which of these is NOT one of the six building blocks of a risk register entry covered in the course?","a":"Risk appetite type","why":"The six register blocks: risk description, impact, likelihood, outcome, level/threshold, and cost. Risk appetite (expansionary/conservative/neutral) is an organizational characteristic you define BEFORE categorizing risk levels — it influences the register but is not an entry field.","multi":false},{"id":"xo2twc","q":"Qualitative risk analysis is BEST characterized as:","a":"A subjective method rating risks as high, medium, or low based on likelihood and impact","why":"Qualitative analysis assesses risks using descriptive/categorical scales — high/medium/low — for likelihood and impact. It's subjective, relying on the expertise and experience of the project team and stakeholders, and deliberately avoids the complexity of the quantitative approach.","multi":false},{"id":"17zcovb","q":"In qualitative analysis, a HIGH impact rating means:","a":"Major damage — essential functions cannot be performed","why":"Impact scale: LOW = minor damage/loss, essential functions still operational. MEDIUM = significant damage or loss to assets. HIGH = major damage, essential functions cannot be performed. Match the wording — exam questions quote these tiers directly.","multi":false},{"id":"1ui4apv","q":"A project manager rates a key developer leaving mid-project as medium likelihood but high impact, then prioritizes cross-training and documentation. Which analysis method is being used?","a":"Qualitative risk analysis","why":"Rating likelihood and impact on descriptive scales (medium/high) and prioritizing based on expert judgment is qualitative analysis — the course's exact example. Quantitative would compute dollar figures (SLE/ALE); BIA evaluates disruption effects on business functions; continuous assessment is a monitoring frequency.","multi":false},{"id":"14gl3hc","q":"Likelihood in qualitative analysis is determined based on:","a":"Past experience, statistical analysis, or expert judgment","why":"Likelihood (probability) — the chance a risk occurs — is expressed qualitatively as low/medium/high and determined from past experience, statistical analysis, or expert judgment. Like impact, it's a subjective, judgment-based rating.","multi":false},{"id":"1qd5l04","q":"A flood would destroy 70% of headquarters assets. In quantitative risk analysis, this 70% is the:","a":"Exposure factor","why":"The exposure factor (EF) is the PROPORTION of an asset lost in an event, expressed as a percentage from 0 (no loss) to 100% (total loss). 70% of assets destroyed = EF of 70%. It's an input to the SLE calculation, not a monetary figure itself.","multi":false},{"id":"ynlx1c","q":"Assets worth $100,000 face an exposure factor of 70%. What is the single loss expectancy (SLE)?","a":"$70,000","why":"SLE = asset value × exposure factor = $100,000 × 70% = $70,000 — the monetary value expected to be lost in a single event. The formula chain to memorize: SLE = AV × EF, then ALE = SLE × ARO.","multi":false},{"id":"177gcw9","q":"A server crashes once every two years. What is its annualized rate of occurrence (ARO)?","a":"0.5","why":"ARO is the estimated frequency a threat occurs within a year. Once every two years = 1 ÷ 2 = 0.5. Trap: don't answer 2 — the ARO is a per-year rate, so a slower-occurring event has a LOWER ARO.","multi":false},{"id":"q21h8z","q":"A $10,000 server has an exposure factor of 50% and fails once every two years. What is the annualized loss expectancy (ALE)?","a":"$2,500","why":"Step by step: SLE = $10,000 × 50% = $5,000. ARO = 0.5 (once every 2 years). ALE = SLE × ARO = $5,000 × 0.5 = $2,500 per year. This is the course's worked example — expect exactly this style of calculation on the exam.","multi":false},{"id":"h1stua","q":"A redundant server would fail once every 10 years instead of once every two years, dropping the ALE from $2,500 to $500 — but it costs $40,000 extra with a 3-year life. What should the analysis conclude?","a":"Not worth it — it saves $2,000/year ($6,000 over 3 years) but costs $40,000 extra","why":"Quantitative analysis exists for exactly this decision: the new server saves $2,000/year × 3 years = $6,000, but costs $40,000 more. The mitigation is far more expensive than the expected loss it prevents — so it's not worth pursuing. Always compare control cost against ALE savings.","multi":false},{"id":"1qbcs4g","q":"Quantitative risk analysis differs from qualitative in that it:","a":"Uses numerical measurements and statistical techniques for an objective, probabilistic evaluation","why":"Quantitative analysis assigns concrete numerical values to risk factors, providing a probabilistic, objective evaluation — typically used for financial, safety, and scheduling decisions. Qualitative is the subjective, categorical one. 'Faster but less precise' describes qualitative, not quantitative.","multi":false},{"id":"6ftn64","q":"A company buys liability insurance so that if a lawsuit occurs, the insurer covers the financial loss up to the policy limit. Which risk strategy is this?","a":"Risk transference","why":"Risk transference (sharing) shifts the risk to another party — and insurance is by far the most common method: you pay a premium, and the insurance company carries the financial loss up to the policy limit. An indemnity clause in a contract is the other main transfer mechanism.","multi":false},{"id":"1n33pjw","q":"Which statement about risk transference is TRUE?","a":"It shifts the financial burden to another party, but reputation risk remains with the original party","why":"Transference does NOT eliminate risk — it shifts responsibility for the FINANCIAL consequences. If the event still occurs, your reputation still suffers. Contracts (indemnity clauses) transfer risk as well as insurance. The most common strategy overall is mitigation, not transfer.","multi":false},{"id":"186u7ez","q":"A company decides NOT to launch a product that could infringe a competitor's patent, eliminating the lawsuit risk completely. Which strategy is this?","a":"Avoidance","why":"Risk avoidance means changing plans or strategies to ELIMINATE the risk entirely — not launching the risky product, or not operating in a politically unstable country. It's chosen when the risk is too great to accept or transfer. Mitigation would reduce the risk; avoidance removes it.","multi":false},{"id":"12qnduk","q":"A manufacturer implements rigorous safety training to reduce the likelihood and impact of workplace accidents. Which strategy is this, and what makes it notable?","a":"Mitigation — the most common risk management strategy","why":"Mitigation reduces the likelihood or impact of a risk through controls, training, or safety measures — and the course flags it as the MOST COMMON risk management strategy. Avoidance eliminates risk entirely (e.g., canceling the hazardous activity), which is not what training does.","multi":false},{"id":"v4ijp3","q":"Risk acceptance is most appropriate when:","a":"The cost of managing the risk outweighs the potential loss, or the impact is unlikely to be significant","why":"Acceptance means acknowledging a risk and dealing with it if and when it occurs — the right call when prevention/mitigation costs more than the potential loss, or the impact is minor. It's a deliberate, documented strategy (implemented via exemption or exception), not negligence.","multi":false},{"id":"pivo19","q":"Residual risk is:","a":"The risk that remains after mitigation, transference, or acceptance has been applied to the inherent risk","why":"Residual risk = the likelihood and impact REMAINING after treatment measures have been applied to the inherent risk. Monitoring tracks this residue — how much risk is left — plus new risks and the effectiveness of the response plans.","multi":false},{"id":"1j7pnnm","q":"An antivirus that caught malware well by signature initially, but gets steadily worse as hackers obfuscate their code, illustrates:","a":"Control risk — a security control becoming less effective over time","why":"Control risk measures how much LESS effective a security control has become over time. The course's example: signature-based antivirus degrades as attackers hide their code. Residual risk is what's left after treatment; control risk is the decay of the treatment itself.","multi":false},{"id":"294v8c","q":"Which of these is NOT one of the four reasons the course gives for why risk monitoring and reporting are essential?","a":"Guaranteed elimination of all risks","why":"The four reasons: informed decision making (resources, timelines, strategy), risk mitigation (act before a growing risk becomes a problem), stakeholder communication (manage expectations, demonstrate control), and regulatory compliance (risk reporting is legally required in many industries). No process guarantees eliminating all risks.","multi":false},{"id":"73tnl3","q":"During risk analysis, a team decides whether to rate risks with descriptive scales or numerical values. These two choices correspond to:","a":"Qualitative vs quantitative analysis","why":"Risk analysis evaluates likelihood and impact — qualitatively using categories and scales (high/medium/low), or quantitatively using numerical values (EF, SLE, ARO, ALE). The outcome of either method is a prioritized list of risks by severity to guide treatment.","multi":false},{"id":"x2kot5","q":"A risk register entry reads: 'Risk: supplier insolvency. Impact: high. Likelihood: low. Outcome: production halt. Level: medium. Cost: $1.5M.' The risk LEVEL was derived from:","a":"Combining the impact and likelihood ratings","why":"Risk level (threshold) is determined by COMBINING impact and likelihood — here high impact × low likelihood = medium level. The level categorizes risk as high/medium/low and decides which risks need immediate attention. Cost is recorded separately.","multi":false},{"id":"11mr3g4","q":"A company that prioritizes stability and long-term sustainability prefers lower risk even at the cost of lower returns. Its risk appetite is:","a":"Conservative","why":"Conservative risk appetite = preferring less risk even if it means accepting lower returns — typical of stability-focused businesses. Expansionary = more risk for higher returns; neutral = balanced. 'Continuous' is an assessment frequency, not an appetite type.","multi":false},{"id":"1x1ho2n","q":"An IT manager asks: 'If this system dies at 9 AM, how far back could we restore data — and how long until we're back online?' Which two metrics answer these questions?","a":"RPO and RTO","why":"'How far back can we restore' = RPO — the recovery POINT, the maximum acceptable data loss in time. 'How long until back online' = RTO — the recovery TIME objective, maximum tolerable downtime. MTBF/MTTR describe failure and repair statistics; SLE/ALE/EF/ARO are quantitative loss-analysis terms.","multi":false},{"id":"u4tovt","q":"A PM rates a supply-chain delay as HIGH likelihood and HIGH impact for a skyscraper project, then secures multiple vendors, schedules deliveries early, and stocks buffer materials. The analysis and response are, respectively:","a":"Qualitative; risk mitigation","why":"Rating likelihood/impact qualitatively (high/high) based on judgment = qualitative analysis — the course's construction example. The response reduces likelihood and impact (more vendors, early scheduling, buffer stock) without eliminating the activity = risk MITIGATION, the most common strategy.","multi":false},{"id":"1jvzig9","q":"A warehouse asset worth $200,000 would suffer 25% damage in a flood expected once every 20 years. What is the single loss expectancy?","a":"$50,000","why":"SLE = asset value × exposure factor = $200,000 × 25% = $50,000 per event. (For completeness: ARO = 1/20 = 0.05, so ALE = $50,000 × 0.05 = $2,500/year — but the question asked for SLE.)","multi":false},{"id":"1u163zg","q":"An insurer charges $3,000/year to cover a risk with an ALE of $9,000, and the policy would cover the full loss. Buying the policy is BEST described as:","a":"Risk transference — shifting the financial burden for less than the expected annual loss","why":"Insurance is the most common risk TRANSFER mechanism: for a $3,000 premium, the insurer carries a loss whose expected annual cost (ALE) is $9,000 — financially rational transfer. Note it doesn't eliminate the risk itself or the reputational fallout; it shifts the monetary burden.","multi":false},{"id":"1rsavza","q":"A startup keeps operating with a known, minor risk because engineering a fix would cost ten times the potential damage, and it documents the decision for the board. Which strategy, and how is it properly formalized?","a":"Risk acceptance — a deliberate strategy used when mitigation cost outweighs potential loss","why":"Risk acceptance acknowledges the risk and deals with it if and when it occurs — appropriate when prevention cost exceeds potential loss or impact is minor. It's a deliberate, documented strategy (often implemented via exemption or exception), not negligence.","multi":false},{"id":"dzdqu4","q":"Which is a distinguishing feature of quantitative — not qualitative — risk analysis?","a":"It assigns concrete numerical values and supports cost-benefit decisions on controls","why":"Quantitative analysis assigns concrete values (EF, SLE, ARO, ALE) giving an objective, probabilistic evaluation — enabling precise decisions like 'this $40,000 control only saves $6,000, don't buy it.' All the other options describe the qualitative approach.","multi":false},{"id":"18ozt8x","q":"A risk report shared with executives shows the risk landscape, response actions, and their effectiveness. According to the course, this primarily supports:","a":"Informed decision making and stakeholder communication","why":"Risk reporting communicates risk-management activities to stakeholders. Two of its four core purposes: informed decision making (resources, timelines, strategy) and stakeholder communication (manage expectations, demonstrate effective management). The others: risk mitigation (act before risks grow) and regulatory compliance (reporting is legally required in many industries).","multi":false},{"id":"anjsy7","q":"After applying a mitigation plan, a company measures the risk that STILL remains. Which term describes what they measured, and what was it measured against?","a":"Residual risk; the risk remaining after treatment of the inherent risk","why":"Residual risk = the likelihood and impact remaining AFTER mitigation, transference, or acceptance has been applied to the inherent (pre-treatment) risk. Monitoring tracks residual risk over time. Control risk, by contrast, is how much the control itself has decayed.","multi":false},{"id":"pig8ab","q":"A risk register must be shared with shareholders primarily because it:","a":"Serves as a crucial communication tool so they better understand the risks in the work they manage","why":"The register is a crucial communication tool — sharing it with shareholders/stakeholders helps them understand the risks attached to the work they manage, and it supports tracking risks throughout the project lifecycle. It doesn't transfer risk or replace tailored risk reporting (dashboards, heat maps, reports).","multi":false},{"id":"w5jhd0","q":"Which of the following are the four risk treatment (management) strategies? (Select FOUR.)","a":"Risk transference;  Risk acceptance;  Risk avoidance;  Risk mitigation","why":"The four strategies: transference (shift to another party — insurance or indemnity clauses), acceptance (acknowledge and bear it), avoidance (change plans to eliminate it), and mitigation (reduce likelihood or impact — the most common). The other options are invented distractors that sound like plausible business terms.","multi":true},{"id":"1rcbjjb","q":"Which statements about risk tolerance and risk appetite are TRUE? (Select THREE.)","a":"Risk tolerance is the maximum amount of risk an organization is prepared to accept;  Risk appetite reflects the organization's approach toward risk-taking;  Both should be identified up front, before risk levels are categorized","why":"Tolerance = max acceptable risk while achieving objectives (the ceiling). Appetite = amount/type of risk willing to be pursued or retained for strategic objectives (the posture: expansionary/conservative/neutral). Both are defined BEFORE categorizing risk levels. Appetite applies to any organization; conservative means LESS risk for lower returns; the two terms are distinct.","multi":true},{"id":"19x91qm","q":"Which are valid likelihood scales or ratings mentioned in the course for qualitative analysis? (Select THREE.)","a":"Rare, unlikely, possible, likely, almost certain;  A 1-to-5 or 1-to-10 numerical scale;  Low, medium, high","why":"Likelihood is rated numerically (1–5 or 1–10) or descriptively on the rare → unlikely → possible → likely → almost certain scale; both impact and likelihood are also commonly expressed low/medium/high. 'Definitely/certainly' and color-only ratings are not the course's likelihood scales.","multi":true},{"id":"p9550d","q":"Which of the following are reasons risk monitoring and reporting are essential, per the course? (Select FOUR.)","a":"Informed decision making;  Risk mitigation — acting before a growing risk becomes a problem;  Stakeholder communication;  Regulatory compliance","why":"The four: informed decision making (allocation, timelines, strategy), risk mitigation (catch rising likelihood/impact early), stakeholder communication (expectations, demonstrating control), and regulatory compliance (required by law in many industries). No process eliminates all risk, and reporting complements — never replaces — the register.","multi":true},{"id":"fa3dd6","q":"A risk manager is drafting the annual plan and must schedule assessments for the year. Match the need to the WEAKEST frequency choice: which pairing is LEAST appropriate?","a":"Routine operations with no events or projects → ad-hoc only, replacing the annual assessment","why":"Ad-hoc assessments respond to specific events — they complement, never replace, baseline recurring assessments. Routine operations with no trigger event still warrant a scheduled (recurring) assessment; relying on ad-hoc alone means no assessment happens when nothing 'special' occurs — exactly when creeping risk accumulates.","multi":false},{"id":"1dcgg03","q":"A SaaS firm's database fails at 2 PM. The business can tolerate losing only 5 minutes of orders and must be selling again within 1 hour. An architect proposes backups every 30 minutes and a warm standby that restores in 90 minutes. What is the correct verdict?","a":"Both the RTO and RPO are violated","why":"RPO = 5 minutes max data loss, but 30-minute backups risk losing 30 minutes → VIOLATED. RTO = 1 hour max downtime, but the standby needs 90 minutes → VIOLATED. Tight RPOs demand frequent (often continuous/replicated) backups; tight RTOs demand hot or warm standby capable of faster recovery.","multi":false},{"id":"1psntbb","q":"A factory robot fails on average every 8 months, and each repair averages 3 hours. Management wants to improve service continuity. Which improvement target is logically consistent with the metrics?","a":"Raise the MTBF (fail less often) and lower the MTTR (repair faster)","why":"MTBF (8 months) measures reliability — higher means failures are rarer. MTTR (3 hours) measures maintainability — lower means faster repair. Continuity improves when failures happen less often (higher MTBF) AND are fixed faster (lower MTTR). Raising MTTR would mean slower repairs; lowering MTBF would mean more failures.","multi":false},{"id":"14mcs7a","q":"A risk workshop produces this entry: description clear, impact high, likelihood medium, outcome documented. Before the level can be set as high/medium/low, the facilitator insists on confirming two organizational characteristics. They are:","a":"Risk tolerance and risk appetite","why":"Before determining risk levels (high/medium/low) in the register, you must identify the organization's risk TOLERANCE (maximum acceptable risk) and risk APPETITE (expansionary/conservative/neutral posture). These calibrate where the level boundaries sit. Owners and KRIs are added to the register afterward; the other pairs are unrelated metrics.","multi":false},{"id":"1tlbixa","q":"An analyst computes: asset value $250,000; a breach would cause 60% damage; breaches of this type occur once every 5 years. The CFO asks for the expected yearly loss figure. It is:","a":"$30,000","why":"EF = 60%. SLE = $250,000 × 0.60 = $150,000 per breach. ARO = 1/5 = 0.2 per year. ALE = SLE × ARO = $150,000 × 0.2 = $30,000 per year. The $150,000 option is the SLE trap — the question asked for the ANNUALIZED figure.","multi":false},{"id":"wkknyh","q":"For that same risk (ALE $30,000), a security vendor proposes a control suite priced at $45,000/year that would cut the exposure factor from 60% to 20%. The BEST analysis-backed decision is:","a":"Reject — the new ALE would be $10,000, saving only $20,000/year, which does not cover the $45,000 annual cost","why":"New SLE = $250,000 × 20% = $50,000; new ALE = $50,000 × 0.2 = $10,000. Savings = $30,000 − $10,000 = $20,000/year against a $45,000/year control — the mitigation costs more than twice what it saves. Quantitative analysis says reject it (or negotiate a cheaper control / price).","multi":false},{"id":"1vob6sj","q":"A multinational suffers a data breach. Its cyber insurance pays out the full financial claim, yet the stock still drops 18% on the news. Which course concept does this outcome BEST illustrate?","a":"Transference shifts the financial burden, but reputation risk remains with the original party","why":"Risk transference does NOT eliminate a risk — it shifts responsibility for the financial consequences to another party (the insurer, up to policy limits). Non-financial consequences like reputational damage and customer trust stay with the organization, exactly as this scenario shows.","multi":false},{"id":"13xd9p5","q":"A firm may process personal data without consent ONLY when a user is in imminent danger, per the regulation. Normally the consent rule binds the firm. This provision is BEST classified as:","a":"An exception","why":"An EXCEPTION lets a party avoid a rule under specific circumstances while remaining subject to it generally — the firm follows the consent rule except in narrowly defined emergency conditions. An exemption would exclude it from the rule entirely. This distinction (exemption vs exception) is a favorite exam trap.","multi":false},{"id":"19unra5","q":"Two years ago a spam filter blocked 97% of phishing emails; testing now shows 71% as attackers evolved their techniques. The risk team formalizes this observation to justify filter updates. The measured 26-point decline is:","a":"Control risk — the control became less effective over time","why":"Control risk quantifies how much LESS effective a security control has become over time — the course's analogy is signature antivirus degrading as hackers obfuscate code. Here the spam filter's effectiveness decayed. Residual risk is what remains after treatment; the 26-point decline measures the treatment's own erosion.","multi":false},{"id":"ab73yz","q":"An organization defines risk appetite as neutral, yet its board keeps approving ventures far riskier than the stated posture. Which course recommendation addresses the mismatch?","a":"Revisit and align the stated risk appetite with actual strategic behavior, since appetite guides how risks are categorized and prioritized","why":"Risk appetite reflects the organization's real approach to risk-taking and is meant to guide categorization and prioritization. If actual behavior contradicts the stated appetite, the appetite statement must be revisited so resources align with strategy — otherwise every risk level derived from it is miscalibrated. Tolerance ≠ appetite, and 'accept everything' abandons the process.","multi":false},{"id":"1qoqkmq","q":"Which reporting format would BEST suit a monthly steering committee that needs to grasp the top risks at a glance without reading pages of detail?","a":"A heat map risk matrix on a dashboard, with the detailed report available for those who want depth","why":"Risk reporting should be tailored to the audience. Dashboards and heat maps give executives an at-a-glance view of the top risks; detailed reports serve those needing depth. Raw scan dumps, transcripts, and register exports are working documents — communication fails when the format ignores what the audience needs.","multi":false},{"id":"1woz6xn","q":"A risk owner accepts a medium-level risk and deploys a compensating control. Monitoring later shows the residual risk now exceeds the owner's tolerance. The correct course action is:","a":"Reassess and treat again (mitigate, transfer, or escalate), because monitoring exists to catch exactly this drift","why":"Monitoring tracks residual risk against tolerance over time. When residual risk drifts past tolerance — new threats, decaying controls, changed conditions — the loop returns to analysis and treatment. Rewriting tolerance to fit the risk inverts the logic, and deleting register entries destroys accountability.","multi":false},{"id":"1qfnw18","q":"Which statements about KRIs and risk owners are TRUE? (Select THREE.)","a":"KRIs are predictive, forward-looking metrics tied to risk appetite;  A sudden rise in a KRI prompts investigation before the risk escalates;  The risk owner monitors the risk, implements mitigation, and updates the register","why":"KRIs = forward-looking early-warning barometers (e.g., rising loan defaults signal credit risk), tied to appetite so thresholds mean something. The risk owner is the accountable person/group — often a project manager — who monitors, mitigates, and updates the register. KRIs exist to act BEFORE incidents; owners need not be executives; transfer is a strategy, not an owner duty.","multi":true},{"id":"1br8c49","q":"Which pairings of strategy to mechanism are CORRECT? (Select FOUR.)","a":"Transference — insurance premium shifts financial loss to the insurer;  Transference — contract indemnity clause makes the other party compensate for harm;  Acceptance — exemption excludes the party from a rule entirely;  Acceptance — exception avoids a rule under specific circumstances","why":"All four transfer/acceptance pairings are correct: insurance and indemnity clauses transfer; exemptions and exceptions are the two acceptance mechanisms. The last two are inverted — reducing likelihood/impact is MITIGATION, while eliminating the risk by cancelling the activity is AVOIDANCE. CompTIA swaps these constantly.","multi":true},{"id":"1woqtd2","q":"Which quantitative risk statements are TRUE? (Select THREE.)","a":"ALE = SLE × ARO;  SLE = asset value × exposure factor;  An exposure factor of 100% means total loss of the asset","why":"The formula chain: SLE = AV × EF; ALE = SLE × ARO. EF runs 0–100%, with 100% = total loss. ARO is a per-year rate — HIGHER means MORE frequent. ALE is an EXPECTED (probabilistic) average, not a guaranteed exact figure, and cost-benefit control decisions are precisely its main use.","multi":true},{"id":"1d0fqj0","q":"Which items belong to the risk MONITORING and REPORTING domain per the course? (Select FOUR.)","a":"Residual risk — what remains after treatment;  Control risk — a control becoming less effective over time;  Risk reports tailored for stakeholder decision making;  Regulatory compliance through regular risk reporting","why":"Monitoring covers residual and control risk plus new-risk identification and response-plan effectiveness; reporting delivers tailored risk information supporting decisions, stakeholder communication, and regulatory compliance. SLE and EF are quantitative ANALYSIS components; premium pricing is an insurance activity — all three are wrong-domain distractors.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
</div>
<script id="back-lib-script">
(function () {
  if (window.__backBtnInit) return; window.__backBtnInit = true;
  function lib() { return "../library.html"; }
  function resultVisible() {
    var rs = document.getElementById('result-screen');
    if (rs && !rs.classList.contains('hidden') && rs.offsetParent !== null) return true;
    var big = document.querySelector('.score-big');
    if (big) {
      var el = big;
      while (el && el !== document.body) {
        if (el.classList && el.classList.contains('hidden')) return false;
        el = el.parentElement;
      }
      return big.offsetParent !== null;
    }
    return false;
  }
  function ensure() {
    if (!resultVisible() || document.getElementById('back-lib-btn')) return;
    var a = document.createElement('a');
    a.id = 'back-lib-btn';
    a.href = lib();
    a.textContent = '\u2190 Back to Library';
    a.setAttribute('style', 'position:fixed;left:18px;bottom:18px;z-index:9999;' +
      'padding:11px 20px;border-radius:999px;font:600 14px/1 "Segoe UI",system-ui,sans-serif;' +
      'text-decoration:none;color:#fff;background:linear-gradient(135deg,#f0883e,#e36414);' +
      'box-shadow:0 4px 18px rgba(240,136,62,.45);border:1px solid rgba(255,255,255,.25);');
    document.body.appendChild(a);
  }
  setInterval(ensure, 400);
  if (document.readyState !== 'loading') ensure();
  else document.addEventListener('DOMContentLoaded', ensure);
})();
</script>
