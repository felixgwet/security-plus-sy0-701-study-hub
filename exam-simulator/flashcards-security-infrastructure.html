<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #f0883e; --accent-dim: rgba(240,136,62,.14);
    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .topbar .grow { flex: 1; }
  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }
  h1 { font-size: 24px; margin: 10px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }
</style>

  <h1>Section 15 · Security Infrastructure — Flashcards</h1>
  <p class="sub">Tap the card to flip it, then grade yourself honestly &mdash; the deck remembers what you know and will prioritize your weak cards.</p>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span>cards</span></div>
    <div class="stat"><b id="stKnown" style="color:var(--green)">0</b><span>known</span></div>
    <div class="stat"><b id="stLearn" style="color:var(--gold)">0</b><span>learning</span></div>

      <div class="card-face card-back"><span class="face-tag">Answer</span><div class="card-text" id="back"></div><div class="why" id="why"></div><span class="flip-hint">tap to flip back</span></div>
    </div>

    <div style="text-align:center;"><button class="btn" id="again">Go again</button></div>
  </div>
  <script>
    var DECKS = [{"label":"Section 15 · Security Infrastructure","cards":[{"id":"vlzq3o","q":"A firewall administrator writes an ACL: rule 1 permits TCP any→any port 443; rule 2 denies TCP any→any port 23; no other rules. What happens to inbound Telnet attempts on this device?","a":"Denied — the device should end every ACL with an explicit deny all; traffic matching no permit is dropped","why":"Not every device implements an implied deny, so best practice is an explicit deny all at the end. Unmatched traffic is dropped — here Telnet matches no permit, so it's denied (and the action should be logged).","multi":false},{"id":"1endm8c","q":"An organization must stop SQL injection and cross-site scripting against its public web applications. Traffic must actually be blocked. Which deployment satisfies this?","a":"A WAF installed inline between the network firewall and the web servers","why":"A WAF has the right rulesets (XSS/SQLi). Out-of-band placement can only alert — it cannot block. Inline placement blocks live attacks, at the cost of some latency and possible false positives.","multi":false},{"id":"1ugtq3q","q":"A security engineer places a network IPS inline directly behind the edge firewall, and a NIDS on a SPAN port off the backbone switch. Why this arrangement?","a":"The IPS sits in the traffic path so it can block what the firewall lets through; the NIDS gets a passive copy of all traffic for detection without disrupting flows","why":"IPS = inline (must be in-path to stop traffic) right behind the firewall where everything funnels. NIDS = passive on a mirror port seeing copies of all traffic. Detection without disruption.","multi":false},{"id":"g57he","q":"Which statement about signature-based and anomaly-based detection is correct?","a":"Anomaly-based compares traffic to a baseline of normal behavior and can catch unknown attacks, but produces more false positives","why":"Signatures = known patterns, frequent updates, weak on zero-days. Anomaly/behavioral = baseline deviation, catches unknowns at the cost of false positives. Five anomaly types: statistical, protocol, traffic, rule/heuristic, application-based.","multi":false},{"id":"1qh2xgc","q":"A company suffers an outage: its consolidated security appliance died and the organization lost firewall, IPS, AV and content filtering all at once. Which device type caused this, and what is the architectural lesson?","a":"UTM — consolidating the entire security stack into one appliance creates a single point of failure","why":"The UTM trade-off: one cheap, easy box... and one failure takes down the whole security stack. NGFWs use a single efficient engine (faster); UTMs use separate engines per function.","multi":false},{"id":"643lvf","q":"An admin connects to a hardened gateway server first, then from it manages switches and servers in a restricted zone. All sessions are logged. This device is a:","a":"Jump server (jump box)","why":"Jump box = the controlled, monitored intermediary admins use to cross security zones — shrinking the attack surface and creating an audit trail that speeds incident response.","multi":false},{"id":"14r61rt","q":"Which port/transport pairing would you open on a firewall to allow secure email retrieval from a mail server, while keeping unencrypted retrieval blocked?","a":"995 TCP (POP3S) and 993 TCP (IMAPS)","why":"Secure retrieval = POP3S (995) and IMAPS (993), both TCP. The plain versions (110/143) stay blocked; 25 is for sending, not retrieving.","multi":false},{"id":"qnqcpn","q":"Branch office users complain that all their cloud traffic hairpins through headquarters over the WAN, killing performance. HQ security still matters. Which solution best addresses this?","a":"SD-WAN — centralized software control routes application traffic intelligently across broadband/5G/MPLS without the HQ hairpin","why":"SD-WAN decouples control from hardware and picks the best path per application across any transport — fixing the traditional star/hairpin bottleneck while keeping centralized policy.","multi":false},{"id":"19dvyn9","q":"A financial data center's inline firewall must never pass uninspected traffic, even if it means an outage when the device fails. The correct configuration is:","a":"Fail-closed, because protecting sensitive financial data outweighs continuity","why":"Fail-closed = block everything on failure (security over availability) — right for sensitive data. Fail-open would keep the business running but unprotected. Guest Wi-Fi would be the opposite case.","multi":false},{"id":"1ep1m1r","q":"Which EAP variant requires a digital certificate on both the client and the server, providing mutual authentication?","a":"EAP-TLS","why":"EAP-TLS = certificates both sides = true mutual authentication, immune to password attacks. TTLS/PEAP use a server cert plus client password; MD5 is one-way password only.","multi":false},{"id":"stlqul","q":"During an IPSec VPN session, which component provides confidentiality by encrypting the packet payload?","a":"ESP (Encapsulating Security Payload)","why":"ESP encrypts the payload (confidentiality) plus authentication, integrity, anti-replay. AH provides integrity/authentication/anti-replay but no encryption.","multi":false},{"id":"1uwckpd","q":"A security team choosing a central authentication protocol for a mixed-vendor network (Cisco, Juniper, Aruba) should pick:","a":"RADIUS, because it is cross-platform (UDP 1812/1813); TACACS+ is Cisco-proprietary","why":"RADIUS works across vendors. TACACS+ (TCP, separates authn/authz/accounting) is the pick only in all-Cisco environments. LEAP is also Cisco-only.","multi":false},{"id":"bo1adp","q":"Which ports use UDP as their (or a) transport? (Choose THREE.)","a":"TFTP (69);  SNMP (161);  Syslog (514)","why":"TFTP, SNMP, and Syslog are UDP. HTTPS and RDP are TCP. (DNS famously uses both.)","multi":true},{"id":"1uu7bkg","q":"Which statements about VPN tunneling choices are true? (Choose THREE.)","a":"Full tunnel routes all traffic through the VPN and is more secure;  Split tunnel is riskier on untrusted networks because an attacker could pivot through the laptop;  Transport mode is preferred for client-to-site VPNs because it does not grow the packet","why":"Full tunnel = security (all traffic via HQ); split = performance but pivot risk on open networks — use full tunnel on hotel/café Wi-Fi. Transport mode adds no header (client-to-site, MTU-safe). Option 3 reverses split tunnel; DTLS is the faster UDP variant.","multi":true},{"id":"1xt269h","q":"Which functions belong to an NGFW rather than a basic stateful firewall? (Choose THREE.)","a":"Application awareness — distinguishing traffic by application;  Integrated signature-based intrusion prevention when inline;  Full-stack visibility with granular control via custom signatures","why":"NGFW = application-aware, single deep inspection, inline IPS capabilities, full-stack visibility. No firewall guarantees zero-day immunity, and separate engines per function describes a UTM.","multi":true},{"id":"e3u1ga","q":"Which controls reduce an organization's attack surface? (Choose THREE.)","a":"Closing unnecessary open ports;  Removing unneeded services and features;  Patching outdated software","why":"Attack surface = all entry points and weaknesses. Minimize by eliminating/configuring vulnerabilities: close ports, remove services, patch. Adding unmanaged devices and excessive privileges expands it.","multi":true},{"id":"t7p3ro","q":"Which port does HTTPS use, and with which transport protocol?","a":"443, TCP","why":"HTTPS = HTTP over SSL/TLS on port 443 TCP. Port 80 is plain HTTP; 445 is SMB; 636 is LDAPS.","multi":false},{"id":"89ko2l","q":"A company still allows Telnet for managing network devices. Which port should be closed and what should replace it?","a":"Port 23 closed; replace with SSH on port 22","why":"Telnet (23) is unencrypted and insecure — the classic exam fix is close 23, open SSH (22).","multi":false},{"id":"3ca6mm","q":"Which port range is reserved for dynamic/private ports used by clients for temporary outbound connections?","a":"49,152–65,535","why":"Dynamic/private = 49,152–65,535 — the random high ports clients open for outbound sessions. 0–1023 well-known; 1024–49,151 registered.","multi":false},{"id":"qjibvv","q":"Microsoft SQL Server communicates over which registered port?","a":"1433","why":"MS SQL = 1433 TCP. 3389 is RDP, 389 LDAP, 514 Syslog.","multi":false},{"id":"1u07po6","q":"Which pairing of protocol and transport is correct?","a":"Kerberos — UDP","why":"TFTP (69) and SNMP (161) and Syslog (514) are UDP; Kerberos (88) is UDP; DNS uses BOTH TCP and UDP.","multi":false},{"id":"143ulkw","q":"RADIUS authentication is most commonly associated with which ports?","a":"1645/1646 over TCP, or 1812/1813 over UDP","why":"RADIUS: TCP 1645/1646 or (more commonly) UDP 1812/1813.","multi":false},{"id":"ho7cp9","q":"A packet-filtering firewall makes decisions based on:","a":"The packet header — source/destination IP and port number","why":"Packet filters inspect only the header (IP + port) = Layer 4 firewall. Fastest type, but blind to payload attacks.","multi":false},{"id":"1m3f8yy","q":"Which firewall type remembers outbound requests and automatically permits the corresponding return traffic?","a":"Stateful","why":"Stateful firewalls track connection state — they know you asked for the web page, so the reply is allowed in.","multi":false},{"id":"86ed4c","q":"An application-level proxy firewall is also known as a:","a":"Layer 7 firewall","why":"Application-level proxies do deep per-application inspection at Layer 7 (e.g. HTTP filtered differently than FTP).","multi":false},{"id":"1p3wubc","q":"The biggest single drawback of a UTM (Unified Threat Management) device is:","a":"It becomes a single point of failure for the entire security stack","why":"UTM consolidates firewall, IPS, AV, VPN, filtering, DLP in one box — lose the box, lose everything. Lower cost is the trade-off benefit.","multi":false},{"id":"yxq933","q":"A Web Application Firewall's rule sets primarily defend against:","a":"Cross-site scripting and SQL injection","why":"WAFs inspect HTTP/HTTPS and use rulesets against web app attacks like XSS and SQLi.","multi":false},{"id":"1lf6inz","q":"A WAF installed out-of-band on a mirrored port can do what?","a":"Only monitor and alert — it cannot block traffic","why":"Out-of-band = sees a copy of traffic (like an IDS): can alert but not block. Inline WAFs block but add latency and can false-positive.","multi":false},{"id":"164vmu","q":"Which firewall type performs full inspection of every packet layer while minimizing performance impact, and is called a fifth-generation firewall?","a":"Kernel proxy firewall","why":"Kernel proxy = fifth-gen: inspects every layer with minimal performance hit; place close to the protected system.","multi":false},{"id":"1ujbvda","q":"ACL rules on a firewall are processed:","a":"Top-down, first match wins — so specific rules go first, generic near the bottom","why":"Top-down order, first match applies and processing stops. Specific permits/denies on top; always end with an explicit deny all (implied deny isn't guaranteed).","multi":false},{"id":"1f6yx30","q":"A complete ACL rule specifies:","a":"Traffic type, source, destination, and the action to take","why":"Rules = type of traffic + source + destination + action (permit/deny). Log all actions, including denies.","multi":false},{"id":"1txs3mr","q":"The key difference between an IDS and an IPS is that an IPS:","a":"Takes action — blocking traffic, stopping applications, or kicking devices off the network","why":"IDS = detect/log/alert only. IPS = detect AND react (block, prevent, disconnect).","multi":false},{"id":"12kljco","q":"A NIDS is typically connected:","a":"To a SPAN/mirrored port on the backbone switch, receiving a copy of all traffic","why":"NIDS = passive, on a mirror/SPAN port so it sees copies of everything without affecting flow. A NIPS goes inline behind the firewall where it can block.","multi":false},{"id":"sb63f2","q":"Signature-based IDS is weak against which attack class?","a":"Zero-day attacks it has never seen before","why":"Signatures only match known attacks in the database — zero-days have no signature yet. Anomaly/behavioral detection covers them (at the cost of more false positives).","multi":false},{"id":"1mg7yzg","q":"Pattern-matching vs stateful-matching: which is more common in host-based IDSs?","a":"Stateful-matching (baseline of the system, report state changes)","why":"Stateful-matching (compare to known system baseline) is common in HIDS; pattern-matching is common in NIDS/WIDS.","multi":false},{"id":"1joh493","q":"A WIDS is specifically tuned to detect:","a":"Wireless attacks like deauthentication frames, disassociation attacks, and authentication flooding","why":"WIDS watches the wireless domain: DoS attempts, deauth/disassociation floods, evil twin activity.","multi":false},{"id":"qg9ri7","q":"An advanced load balancer that adds SSL termination, HTTP compression and content caching is called:","a":"An application delivery controller (ADC)","why":"ADC = load balancer plus SSL termination, compression, caching.","multi":false},{"id":"noa1mc","q":"A jump server's main security purpose is:","a":"A single hardened, monitored gateway through which admins reach devices in other security zones","why":"Jump boxes concentrate admin access into one controlled, logged entry point — reducing attack surface and aiding forensic review.","multi":false},{"id":"r5r4il","q":"Which appliance masks internal endpoints from attackers so DDoS and direct attacks hit it instead of the real servers?","a":"Proxy server","why":"The proxy's intermediary role hides true internal endpoints — attacks point at the proxy layer. Proxies also cache content and filter requests.","multi":false},{"id":"jxwosb","q":"MAC flooding attacks a switch by:","a":"Overflowing the CAM table with randomized MACs until the switch fails open and behaves like a hub","why":"Flood random MACs → CAM table overflows → switch fails open, rebroadcasting all traffic to every port (hub mode), losing its privacy advantage.","multi":false},{"id":"c1h66m","q":"Sticky MAC (persistent MAC learning) does what?","a":"Dynamically learns the first MAC seen on a port and treats it as the authorized address","why":"Sticky MAC auto-learns the first device on a port as authorized — saving admins from manually entering every MAC.","multi":false},{"id":"ytpz8j","q":"802.1x defines which three roles?","a":"Supplicant, authenticator, authentication server","why":"Supplicant = device requesting access; authenticator = switch/WAP/VPN concentrator; authentication server = RADIUS/TACACS+.","multi":false},{"id":"1btlebo","q":"EAP-TLS is considered the strongest common EAP variant because it:","a":"Uses digital certificates on both the client and the server, providing mutual authentication and immunity to password attacks","why":"EAP-TLS = certs both sides = mutual auth. EAP-TTLS = server cert + client password. EAP-MD5 = one-way password (weakest). LEAP = Cisco proprietary.","multi":false},{"id":"xybenh","q":"RADIUS vs TACACS+: which statement is true?","a":"RADIUS is cross-platform (usually UDP 1812/1813); TACACS+ is Cisco-only, TCP-based, and separates authentication, authorization and accounting","why":"Mixed-vendor network → RADIUS. All-Cisco → TACACS+ (TCP, slower, separates AAA functions).","multi":false},{"id":"1i3asxi","q":"A split tunnel VPN:","a":"Sends only corporate-bound traffic through the VPN and the rest directly to the Internet","why":"Split tunnel = performance (Internet traffic goes direct) at the cost of security. On untrusted networks, use full tunnel instead.","multi":false},{"id":"1gv5bun","q":"DTLS differs from TLS in that DTLS:","a":"Runs over UDP, providing the same security with less overhead — good for streaming","why":"DTLS = Datagram TLS, the UDP flavor: same security level as TLS but faster — ideal for video/voice streaming.","multi":false},{"id":"hctqhm","q":"In IPSec, IKE Phase 1 is responsible for:","a":"Authenticating the parties and establishing a secure channel for negotiation (the ISAKMP tunnel)","why":"5 steps: key-exchange request → IKE Phase 1 (authenticate + secure negotiation channel) → IKE Phase 2 (negotiate SAs, establish tunnel) → data transfer → termination.","multi":false},{"id":"1rj3mvx","q":"Tunneling mode vs transport mode: which pairing is correct?","a":"Transport = client-to-site (original header, no size increase); tunneling = site-to-site (new header encapsulates whole packet)","why":"Transport keeps the original IP header (client-to-site, MTU-friendly). Tunneling wraps the entire packet in a new header (site-to-site) — watch the 1,500-byte MTU.","multi":false},{"id":"798nt","q":"The IPSec Authentication Header (AH) provides integrity and origin authentication but NOT:","a":"Confidentiality (it carries no encryption)","why":"AH = integrity + authentication + anti-replay, no confidentiality. ESP adds payload encryption (confidentiality).","multi":false},{"id":"oeytjl","q":"SD-WAN's main advantage over traditional WAN for a multi-branch company is:","a":"Centralized software control intelligently routes per-application traffic across any mix of transports, removing the hairpin-through-HQ bottleneck","why":"SD-WAN virtualizes the WAN: control in software, any transport (broadband, cellular, MPLS, microwave), intelligent per-app routing from a central point.","multi":false},{"id":"2qiqyv","q":"SASE combines which elements into a cloud-native service?","a":"Networking (SD-WAN) plus security services like firewall, secure web gateway, ZTNA, CASB and VPN","why":"SASE = network + security convergence in the cloud: FW, SWG, VPN, ZTNA, CASB + SD-WAN, policy-driven for users anywhere.","multi":false},{"id":"1occbnw","q":"For the SY0-701 exam, the modern term for a DMZ is:","a":"Screened subnet","why":"Devices may still say DMZ, but the exam term is screened subnet — a buffer hosting public services between the untrusted Internet and the trusted internal network.","multi":false},{"id":"b8yyw3","q":"An inline IPS fails and begins passing all traffic uninspected. It is configured as:","a":"Fail-open","why":"Fail-open = traffic keeps flowing without inspection on failure (continuity over security). Fail-closed = all traffic blocked on failure (security over availability).","multi":false},{"id":"u8mp95","q":"A network tap/monitor differs from an inline device because a tap:","a":"Sits out of the traffic path and only listens/captures copies — no disruption risk, but no blocking ability","why":"Taps/monitors passively observe copies of traffic (like a NIDS); inline devices can influence/block but introduce a failure point.","multi":false},{"id":"yb14u5","q":"The attack surface of a network is:","a":"The sum of all points where an attacker could enter or extract data — every device, app, open port and weak control","why":"Attack surface = all potential entry/exit and vulnerability points; it grows with every added device/app/service — minimize it continuously.","multi":false},{"id":"8wl1ia","q":"Which is NOT one of the five key control-selection principles from the course?","a":"Security through obscurity","why":"The five: least privilege, defense in depth, risk-based approach, lifecycle management, open design. Obscurity is the opposite of open design.","multi":false},{"id":"1in7j0h","q":"The control-selection methodology sequence taught is:","a":"Assess current state → gap analysis → set objectives → benchmarking → cost-benefit analysis → stakeholder involvement → monitoring and feedback loops","why":"Structured methodology: know your baseline, find the gaps, set objectives, benchmark against industry, weigh costs, involve stakeholders, then monitor and loop.","multi":false},{"id":"1xzlp9h","q":"Risk assessments in control selection should be:","a":"A recurring process repeated whenever the infrastructure or business changes significantly","why":"Best practice: recurring risk assessments, aligned to frameworks (NIST CSF/RMF, ISO), customized to the org, with stakeholder engagement and training.","multi":false},{"id":"162l7z","q":"Why does a stateful firewall allow the reply when you browse to diontraining.com, while a packet-filtering firewall might block it?","a":"The stateful firewall tracks connection state — it remembers your outbound request and permits the matching return traffic","why":"Stateful = connection tracking: outbound request recorded, return traffic recognized as part of that conversation. A pure packet filter only matches header rules and has no memory of the request.","multi":false},{"id":"11rvpp8","q":"A SOHO router blocks games by letting the admin block outbound TCP/UDP port 666 for a range of LAN IPs. Inbound, everything not explicitly allowed is dropped. This inbound behavior is an example of:","a":"Implicit deny — anything not permitted is blocked by default","why":"The router explicitly allows inbound entries (e.g. port-forward to .50); everything else is denied by default = implicit deny. Best practice still says write the explicit deny all and log it.","multi":false},{"id":"gkf09v","q":"An attacker on the LAN floods a switch with randomized source MACs, and soon all ports receive all traffic. Which defense would have stopped this, and what is the resulting switch state called?","a":"Port security; the switch has failed open into hub-like behavior after its CAM table overflowed","why":"MAC flooding overflows the CAM table → the switch fails open and floods all frames like a hub. Port security / MAC filtering limits MACs per port and defeats the flood (though MAC spoofing still needs 802.1x/EAP).","multi":false},{"id":"trpo7r","q":"Which EAP variant is the right choice when a company wants mutual authentication but cannot deploy client-side certificates to every device?","a":"EAP-TTLS or PEAP — server certificate plus client password achieves mutual authentication without client certs","why":"TTLS/PEAP = server-side certificate + password-based client auth inside the encrypted tunnel — mutual auth without managing client certs. MD5 is one-way only; TLS needs certs both sides; LEAP is Cisco-proprietary.","multi":false},{"id":"13mrx0x","q":"Site-to-site VPN users at a branch complain they cannot reach a local network printer while the VPN is up. What is the cause, and the fix if local access is required?","a":"Full tunnel routes all traffic through HQ, isolating the client from local LAN resources; a split tunnel would send only corporate traffic via HQ","why":"Full tunnel makes the remote host part of the HQ network — local resources vanish. Split tunnel keeps HQ-bound traffic encrypted while local/Internet traffic goes direct. Trade security for convenience deliberately.","multi":false},{"id":"8iy1i9","q":"IPSec tunneling mode is preferred for site-to-site VPNs, but it can push packets past the 1,500-byte MTU. Which mitigation does the course recommend?","a":"Use jumbo frames on your own LAN (up to 9,000 bytes) or lower the inner MTU to ~1,400 to leave room for the extra header","why":"Tunneling adds a new header. Options: jumbo frames on LANs you control, or drop the inner MTU (~1,400) so the encapsulated packet stays under 1,500 and avoids fragmentation.","multi":false},{"id":"1f6z2lm","q":"A CISO asks which IPSec component guarantees the data was not modified in transit. The correct answer is:","a":"Integrity — hash digests checked before transmission and after receipt","why":"Integrity = hash digest comparison at both ends proves no modification. Confidentiality hides content; anti-replay stops retransmission of captured packets; IKE Phase 1 authenticates the peers.","multi":false},{"id":"n2glb8","q":"SASE most directly solves which modern business problem?","a":"Securing a distributed workforce — users, branches and cloud apps get consistent policy-based access via one cloud-native framework (FW, SWG, ZTNA, CASB, VPN + SD-WAN)","why":"SASE converges network + security for anywhere-access: firewalls, secure web gateways, zero-trust access, CASBs and VPN delivered with SD-WAN from the cloud.","multi":false},{"id":"z39uw9","q":"Which device attribute pairing is correct for a NIPS deployed to stop attacks in real time?","a":"Active and inline — in the traffic path with the power to block","why":"Blocking requires the device to be inline (in the path) and active (alters flows). A passive tap-based device observes without disruption but cannot stop anything.","multi":false},{"id":"1c2okk4","q":"Under the control-selection methodology, what comes immediately AFTER assessing the current state?","a":"A gap analysis — compare current posture to the desired posture","why":"Sequence: assess current state → gap analysis → objectives → benchmarking → cost-benefit → stakeholder involvement → monitoring/feedback. The gap analysis measures the distance between where you are and where you must be.","multi":false},{"id":"kvgquq","q":"A firewall rule base has 'allow TCP any any 443' at the TOP and 'deny TCP 10.1.1.0/24 any 443' below it. A host in 10.1.1.0/24 tries HTTPS. Result?","a":"Allowed — rules process top-down, first match wins, and the broad permit is hit first","why":"Top-down, first-match-wins: the any-any-443 permit sits above the subnet deny, so it matches first and the deny never evaluates. Ordering specific rules above generic ones is the fix.","multi":false},{"id":"1syw9g9","q":"Which port pairing correctly separates secure from unsecure directory and mail services?","a":"LDAP 389 ↔ LDAPS 636; IMAP 143 ↔ IMAPS 993; POP3 110 ↔ POP3S 995","why":"The pattern: secure version = plain + SSL/TLS on a new port — LDAP 389→636, IMAP 143→993, POP3 110→995, SMTP 25→465/587, HTTP 80→443.","multi":false},{"id":"aofree","q":"Which are the three 802.1x roles? (Choose THREE.)","a":"Supplicant — the device requesting access;  Authenticator — the switch/WAP/concentrator it connects through;  Authentication server — RADIUS or TACACS+","why":"802.1x trio: supplicant, authenticator, authentication server. The other two are unrelated infrastructure concepts.","multi":true},{"id":"w8mpgp","q":"Which firewall types perform deep or multi-layer inspection? (Choose FOUR.)","a":"Stateful firewall;  Application-level (Layer 7) proxy;  Kernel proxy (fifth-generation);  Next-generation firewall (NGFW)","why":"Stateful tracks connection state; Layer 7 proxies inspect payload per application; kernel proxies inspect all layers; NGFWs do application-aware deep inspection. Packet filters look at headers only — no deep inspection.","multi":true},{"id":"1y02btr","q":"Which statements about RADIUS and TACACS+ are true? (Choose THREE.)","a":"RADIUS is cross-platform; TACACS+ is Cisco-proprietary;  TACACS+ uses TCP and separately handles authentication, authorization and accounting;  RADIUS commonly uses UDP ports 1812 and 1813","why":"RADIUS = cross-platform, UDP 1812/1813 (or TCP 1645/1646). TACACS+ = Cisco-only, TCP (slower, more secure), AAA separated. Options 4/5 reverse the facts.","multi":true},{"id":"1brx5xa","q":"Which are anomaly-based (behavioral) IDS detection subtypes named in the course? (Choose THREE.)","a":"Statistical;  Protocol;  Traffic","why":"The five anomaly types: statistical, protocol, traffic, rule/heuristic, application-based. Pattern-matching and stateful-matching are the signature-based subtypes.","multi":true},{"id":"3t1zry","q":"Scenario: An organization's only internet-facing defenses are a packet-filtering firewall and a stateful firewall in sequence. An attacker exfiltrates data by fragmenting packets so no single fragment matches a deny rule. Which limitation of these devices is being exploited?","a":"They cannot perform deep packet inspection, so fragmentation and TCP-handshake attacks slip past header-only checks","why":"Packet filters inspect headers only and explicitly cannot prevent IP spoofing, packet fragmentation attacks, or TCP handshake attacks. Deep inspection requires application-layer (L7) capability.","multi":false},{"id":"gesg3e","q":"A company deploys an inline WAF, a NIDS on a SPAN port, and an out-of-band WAF. During a live SQL injection attack, which device(s) can actually stop it?","a":"Only the inline WAF — the NIDS and out-of-band WAF see copies of traffic and can only alert","why":"Blocking requires an in-path (inline) device. SPAN/mirror-port deployments (NIDS, out-of-band WAF) are passive: detection and alerting only.","multi":false},{"id":"9hl6il","q":"Which design gives the best combination of detection coverage and blocking where it matters, per the course's placement guidance?","a":"NIPS inline immediately behind the firewall (all traffic funnels through it); NIDS on a SPAN port off the backbone switch for passive full visibility","why":"NIPS inline at the border blocks as needed; NIDS passively sees a copy of all backbone traffic for detection/forensics without being a failure point.","multi":false},{"id":"1wbe3s5","q":"An anomaly-based IDS flags a sudden flood of data requests from an unknown IP as a possible DDoS. Which anomaly subtype is most directly at work, and what is the known cost of this detection family?","a":"Traffic anomaly detection; behavioral detection catches unknown attacks but raises more false positives than signature matching","why":"Traffic anomaly = deviation from historical traffic patterns. Anomaly/behavioral detection's strength is unknown-attack detection; its price is a higher false-positive rate than signatures.","multi":false},{"id":"1balbmn","q":"A helpdesk report says: 'The switch in the lobby suddenly started sending everyone's traffic to every port.' Which attack and which failed-open defense pairing explains this?","a":"MAC flooding overflowing the CAM table; the switch degraded into hub-like rebroadcasting","why":"MAC flood → CAM table overflow → switch acts like a hub. Port security (MAC limiting/filtering) is the defense; 802.1x adds identity so MAC spoofing alone is not enough.","multi":false},{"id":"1r72hao","q":"Which EAP selection is correct for each scenario? (Certs unavailable on clients, mixed-vendor network, no Cisco-only gear.)","a":"PEAP or EAP-TTLS — server certificate plus client password, mutual auth, cross-platform","why":"PEAP/TTLS deliver mutual authentication with only a server cert. MD5 = one-way (no mutual). LEAP = Cisco-only. TLS requires client certs — not available here.","multi":false},{"id":"12w6som","q":"During IKE, which phase establishes the ISAKMP tunnel, and what is its purpose?","a":"Phase 1 — authenticates both parties and creates the secure channel used to negotiate everything else","why":"IKE Phase 1 = authenticate peers + build the protected negotiation channel (ISAKMP SA). Phase 2 negotiates the IPsec SAs inside that protection. Then data flows, then teardown.","multi":false},{"id":"hl2y1d","q":"A network architect must guarantee that even if the VPN concentrator dies mid-session, no sensitive financial data can leak. Which IPSec mode/component combination supports this in a site-to-site design?","a":"Tunneling mode with ESP — the whole original packet including headers is encrypted behind a new header, and the device pair is configured fail-closed","why":"Tunnel mode hides internal source/destination entirely (ESP encrypts payload; new outer header covers transit). Fail-closed on the protecting devices stops leaks on failure. AH alone would leave data readable.","multi":false},{"id":"p1ue5m","q":"Which statement about SD-WAN vs SASE is accurate?","a":"SD-WAN optimizes WAN connectivity across mixed transports via centralized software control; SASE folds security services (FW, SWG, ZTNA, CASB, VPN) and SD-WAN into one cloud-native offering","why":"SD-WAN = connectivity virtualization. SASE = SD-WAN + full security stack, delivered from the cloud with unified policy for users anywhere.","multi":false},{"id":"qlcqjc","q":"A guest Wi-Fi firewall should keep serving visitors even if the device fails; the cardholder-data segment firewall must shut everything down on failure. Which pairings are right?","a":"Guest = fail-open (continuity, nothing sensitive); cardholder = fail-closed (security first)","why":"Failure mode follows data criticality: guest network has no sensitive assets → fail-open for availability; financial data → fail-closed to prevent uninspected passage.","multi":false},{"id":"k3nbww","q":"Which port-blocking scenario on a stateful firewall would break secure web browsing while leaving everything else working?","a":"Blocking TCP 443","why":"HTTPS = TCP 443. Block it and secure web dies. DNS (53), SNMP (161) and RDP (3389) are unrelated to browsing. The exam loves this applied port knowledge.","multi":false},{"id":"98pn11","q":"Under the open design principle, why are security mechanisms published and scrutinized rather than hidden?","a":"Transparency and accountability — rigorous public testing proves controls are effective and implemented securely","why":"Open design = the opposite of security through obscurity: controls withstand scrutiny, creating verifiable trust. It is one of the five control-selection principles.","multi":false},{"id":"z9mtz5","q":"Which items are TRUE about UTM devices? (Choose FOUR.)","a":"They combine firewall, IPS, AV/antispam, VPN concentration, content filtering, load balancing and DLP in one appliance;  They reduce upfront cost, maintenance and power consumption;  Their biggest drawback is a single point of failure for the security stack;  They run a separate engine per function, making them less efficient than an NGFW","why":"UTM = all-in-one (cheap, easy, low power) with one fatal flaw (single point of failure) and per-function engines (less efficient). NGFWs use a single efficient engine — so the speed claim is backwards.","multi":true},{"id":"4iiogt","q":"Which statements correctly distinguish AH and ESP? (Choose THREE.)","a":"AH provides integrity, origin authentication and anti-replay;  AH provides no confidentiality;  ESP provides confidentiality by encrypting the payload","why":"AH = integrity/authn/anti-replay, no encryption. ESP = authentication + integrity + anti-replay + payload encryption. In tunnel mode the entire original packet is hidden behind the new header.","multi":true},{"id":"ford7h","q":"Which are listed benefits of proxy servers? (Choose THREE.)","a":"Content caching for faster local retrieval and lower bandwidth use;  Masking internal endpoints so DDoS/direct attacks hit the proxy layer;  Routing traffic to satisfy data-sovereignty/geographic requirements","why":"Proxy benefits: caching, endpoint masking, request filtering, login management, sovereignty routing. SSL termination is the ADC's role; RADIUS/TACACS+ is the auth server.","multi":true},{"id":"14j21qv","q":"Which control-selection items are best practices named in the course? (Choose THREE.)","a":"Conduct recurring risk assessments, refreshed on significant change;  Align control selection to established frameworks like NIST CSF/RMF or ISO;  Customize frameworks to the organization's specific risk profile and operations","why":"Best practices: recurring risk assessments, framework alignment (NIST/ISO), customization, and stakeholder engagement + training. Set-and-forget and stakeholder exclusion are anti-patterns.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
