<style>
  :root {

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }

  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }
  h1 { font-size: 24px; margin: 10px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }
</style>

  <script>
    var DECKS = [{"label":"Section 12 · Audits and Assessments","cards":[{"id":"1grkcdy","q":"A retailer's own audit team reviews whether employees follow the company's data protection policy and whether that policy is current with regulations. Quarterly, the same team must also verify PCI DSS controls because card industry rules require it. Which statement is correct?","a":"This is an internal audit — the organization's own team evaluates controls and compliance, and regulations can legally require internal audits on a set cadence","why":"Internal audits are performed by the organization's own audit team, evaluating control effectiveness and regulatory compliance — and some regulations/industry rules legally REQUIRE internal audits quarterly or annually. External requires an independent third party; cadence doesn't change the audit/assessment type.","multi":false},{"id":"9ekju8","q":"Before launching a new web application, a security team follows a four-step flow: identifying threats like SQL injection, scanning for known vulnerabilities, weighing likelihood and impact, then recommending fixes. Which sequence is it following?","a":"Threat modeling → vulnerability assessment → risk assessment → mitigation recommendations","why":"The course's internal assessment flow: (1) threat modeling — identify potential threats (SQLi, XSS, DoS); (2) vulnerability assessment — automated tools + manual testing for known weaknesses; (3) risk assessment — likelihood, damage, cost of controls; (4) recommend mitigation strategies (code fixes, new controls, architecture changes).","multi":false},{"id":"sucpij","q":"During an internal access-control audit, the team finds an account belonging to an employee who left six months ago still has VPN access. Which audit-check category caught this, and which two best practices does it violate?","a":"User access review; least privilege and prompt revocation when employment ends","why":"The access rights examination checks whether rights align with job responsibilities and whether they are PROMPTLY REVOKED when employees leave or change roles. A stale account violates least privilege (excessive/unnecessary access) and the revocation process — a favorite exam finding because former-employee access is a real breach vector.","multi":false},{"id":"ahp37i","q":"A county government uses a cybersecurity self-assessment checklist with yes/no questions. Several items get 'No' answers, and the assessor writes action items — but nobody is named for any of them. What is wrong?","a":"Every action item must be assigned to a specific individual or group so someone is responsible for follow-up and implementation","why":"Assignment creates accountability: each action item goes to a named individual or group who owns the follow-through. Unowned action items are effectively unplanned fixes. The checklist format (yes/no + comments + action items + assignees) is standard — the missing piece is the assignee column.","multi":false},{"id":"axn7gi","q":"A startup must prove to enterprise customers that it handles data securely, and those customers' contracts demand independent validation. Internal self-assessments aren't convincing them. Which activity directly addresses this need?","a":"An independent third-party audit that validates security measures and builds trust with customers and regulators","why":"Independent third-party audits provide the unbiased validation external parties trust — the course notes they help build trust with customers, stakeholders, and regulatory bodies, and many regulations (GDPR, PCI DSS) require them. Internal work, however thorough, cannot provide the independence outsiders demand.","multi":false},{"id":"1br6kh0","q":"An energy company operating a nuclear facility undergoes a review every few years that examines its networks, ICS/SCADA equipment, and operational procedures — and also requires every employee to pass knowledge-based exams to keep their operating authority. What is this review called?","a":"An examination","why":"This is an examination: like an assessment for infrastructure, but it ADDS standardized testing of key personnel (knowledge exams, certification currency). Nuclear facilities face examinations every 1–5 years. The personnel-testing element is what separates examinations from typical assessments — most industries never face one.","multi":false},{"id":"1c7v5dz","q":"A healthcare firm facing HIPAA, a payment arm facing PCI DSS, and an EU customer base under GDPR wants one control framework instead of three parallel compliance programs. What does the course recommend?","a":"Adopt a consolidated, harmonized control set — e.g., the NIST Cybersecurity Framework as the umbrella, with each regulation's controls implemented inside it","why":"Organizations increasingly use consolidated, harmonized compliance controls to meet many regulations at once — the NIST Cybersecurity Framework as the main mechanism, with each individual regulatory control set implemented within the larger framework. One control set, mapped to many rules.","multi":false},{"id":"1nzh19v","q":"A tester gathers domain registration details and employee names from public sources without sending a single packet to the target company. Which technique is this, and what is its main limitation?","a":"Passive reconnaissance; stealthy but yields less information than direct engagement","why":"Passive reconnaissance collects information WITHOUT directly engaging the target — OSINT, WHOIS lookups, public databases, observing traffic. The trade-off: less likely to be detected, but yields less information. Active recon (port scans, pings) gathers richer data but risks detection and traceback.","multi":false},{"id":"5ctwn4","q":"In a penetration test, the client hands the testers network diagrams, IP ranges, application details, and valid credentials before the engagement starts. Which environment is this, and how much reconnaissance is typically needed?","a":"Known environment; little to no reconnaissance — the focus is evaluating vulnerabilities in known assets","why":"Providing detailed infrastructure information (diagrams, IPs, apps, OS versions, even credentials) makes this a known environment test — simulating an insider threat. Testers may already have everything needed, so recon is minimal; the objective is thoroughly evaluating how known assets can be exploited and what damage could result.","multi":false},{"id":"1jgvp4b","q":"A red team exploits a critical vulnerability and presents the full attack chain to the board, which immediately approves the previously-rejected security budget. Which benefit of offensive penetration testing does this demonstrate?","a":"Using results to garner funding and support by demonstrating how vulnerable current systems are","why":"A distinctive benefit of offensive (red team) testing: concrete demonstrations of exploitation — especially of the most critical vulnerabilities — justify investment by showing real, not hypothetical, risk. The other options describe defensive testing benefits or unrelated outcomes.","multi":false},{"id":"1vn5ih6","q":"A Metasploit user loads exploit/windows/smb/ms17_010_psexec, sets RHOST to the target, and runs it — but nothing happens because no payload was selected. Which statement best explains the failure?","a":"An exploit delivers a payload — without one selected, there is nothing to run after the vulnerability is triggered, so the attempt fails","why":"Exploitation alone accomplishes nothing — the payload defines what code executes afterward (a shell, elevated permissions, etc.). The demo showed exactly this failure: run without a payload errors out; after 'set payload cmd/unix/bind_perl', the exploit opened a working bind shell. The fix is 'show payloads' then 'set payload'.","multi":false},{"id":"50lwgr","q":"After a compliance-driven penetration test, the firm presents detailed logs and live exploit demonstrations to prove the findings are real, then supplies a formal letter the client can show regulators as official proof the test occurred. What are these two deliverables?","a":"Attestation of findings with evidence, and a letter of attestation","why":"Attestation of findings = formal validation that the test occurred and findings are valid, backed by evidence (logs, data, exploit demonstrations — shown but sensitive exploit code not left behind). For compliance reasons (GLBA, HIPAA, SOX, PCI DSS), a letter of attestation serves as the official record the client shows third parties. The report, by contrast, lists findings and remediation without necessarily revealing exploitation methods.","multi":false},{"id":"h1vtov","q":"Which statements correctly distinguish audits from assessments? (Select THREE.)","a":"Audits systematically evaluate controls for efficiency and effectiveness;  Assessments identify vulnerabilities and risks and propose mitigation;  Audits are typically conducted by an independent entity for an unbiased view","why":"The core three distinctions: audits = systematic control-effectiveness evaluations (by independent entities for unbiased views); assessments = detailed analyses finding vulnerabilities/risks with mitigation proposals. Option 3 inverts it — certification of compliance is audit territory; and audits are scheduled/proactive, not post-breach-only.","multi":true},{"id":"16ww6ok","q":"Which are responsibilities of an audit committee? (Select FOUR.)","a":"Reviewing financial reporting processes and internal controls;  Overseeing the performance of internal and external audits;  Ensuring compliance with legal and regulatory requirements;  Reviewing and addressing issues raised by auditors","why":"The audit committee — typically board members — oversees audit and compliance: financial reporting and internal controls review, audit performance oversight, legal/regulatory compliance assurance, and acting on auditor-raised issues. Technical tasks like exploit development and firewall configuration belong to security engineers, not the committee.","multi":true},{"id":"1qwzwqx","q":"Which statements about penetration testing types are TRUE? (Select FOUR.)","a":"Physical pentesting can involve tailgating and access-card cloning;  Offensive (red) testing proactively exploits vulnerabilities like a real attacker;  Defensive (blue) testing strengthens detection and improves incident response;  Integrated (purple) testing has red and blue teams collaborate in one engagement","why":"All four are course facts: physical tests attack locks/badges/cameras (tailgating, cloning); red = proactive offense; blue = reactive defense improving response times; purple = red and blue working together — red escalates when detected, teaches blue when not. The remaining options are nonsense distractors.","multi":true},{"id":"1l6or0p","q":"Which are genuine Metasploit module categories from the course? (Select FOUR.)","a":"Exploits;  Auxiliary;  Payloads;  Encoders","why":"The seven Metasploit module types: exploits, auxiliary, post, payloads, encoders, nops, and evasion. Exploits deliver attacks; auxiliary covers scanners/sniffers/fuzzers/spoofers; payloads are what runs post-exploitation; encoders get payloads past defenses undetected. Firewalls and antivirus engines are not Metasploit module categories.","multi":true},{"id":"14hc24y","q":"What is an audit, as defined in the course?","a":"A systematic evaluation of information systems, applications, and security controls to ascertain their efficiency and effectiveness","why":"Audits are systematic evaluations of systems, applications, and controls to ascertain efficiency and effectiveness — typically by an independent entity for an unbiased view. Option 2 describes an assessment; option 3 is penetration testing; option 4 is attestation.","multi":false},{"id":"1pb7mfa","q":"What is the primary goal of an assessment?","a":"To identify vulnerabilities and risks, and propose mitigation strategies","why":"Assessments perform a detailed analysis of systems to identify vulnerabilities and risks, and they propose mitigation strategies. They are often done before implementing new systems or making significant changes — the focus is understanding risk, not certifying control effectiveness (that's the audit's job).","multi":false},{"id":"1ex6xq2","q":"Into which three categories can assessments be divided?","a":"Risk assessments, vulnerability assessments, and threat assessments","why":"Assessments are categorized as risk assessments, vulnerability assessments, and threat assessments — each focusing on a different aspect of security. The other groupings describe audit sources (internal/external), team types (red/blue/purple), or safeguard categories.","multi":false},{"id":"16lpcr9","q":"Which exam objective does the Audits and Assessments section map to?","a":"OBJ 5.5","why":"This section maps to objective 5.5: explain the types and purposes of audits and assessments. It sits in Domain 5 (Security Program Management & Oversight), the same domain as risk management and compliance.","multi":false},{"id":"12w7ld3","q":"Why are audits typically conducted by an independent entity?","a":"To provide an unbiased view of the organization's security posture","why":"Independence exists to remove bias: an external evaluator has no stake in the outcome, so the view of the security posture is objective. Internal audits still exist (done by the org's own team), but the unbiased perspective is the defining advantage of external audits.","multi":false},{"id":"1qntnht","q":"A bank hires an outside firm to check whether its credit card handling meets PCI DSS. Is this an audit or an assessment, and why?","a":"An audit, because it is a systematic evaluation of controls against a regulatory standard by an independent entity","why":"Evaluating compliance with a regulatory standard (PCI DSS) by checking security controls is the textbook external audit — systematic, independent, compliance-focused. The bank isn't asking the firm to find and rank vulnerabilities; it's verifying that required controls exist and work.","multi":false},{"id":"1a717iw","q":"Who conducts an internal audit?","a":"The organization's own audit team","why":"Internal audits are conducted by the organization's own audit team, evaluating internal controls, regulatory compliance, and the integrity of systems and processes. External audits are the ones performed by independent third parties.","multi":false},{"id":"1ecs2hy","q":"An internal audit team uses a limited-permission account to try accessing resources beyond its designated permissions. What is this technique testing?","a":"The effectiveness of access controls","why":"This is direct effectiveness testing of access controls: if a limited account can reach resources beyond its permissions, the access control implementation has a weakness. The course describes this as part of a user access control audit, alongside policy review and rights examination.","multi":false},{"id":"shtwbl","q":"What is an audit committee?","a":"A group, typically of board members, that oversees the organization's audit and compliance activities","why":"The audit committee — typically members of the board of directors — oversees audit and compliance: reviews financial reporting and internal controls, oversees internal/external audit performance, ensures legal/regulatory compliance, and addresses issues raised by auditors.","multi":false},{"id":"1p4kzhi","q":"How do internal assessments differ from internal audits?","a":"Assessments are in-depth analyses identifying and evaluating potential risks and vulnerabilities, often before new systems or major changes","why":"Internal assessments are in-depth analyses to identify/evaluate risks and vulnerabilities — typically performed BEFORE implementing new systems or significant changes, to catch issues early. Audits evaluate control effectiveness and compliance. This timing distinction (assess = before, audit = ongoing verification) is a classic exam angle.","multi":false},{"id":"ii9fom","q":"What is a self-assessment in this context?","a":"An internal evaluation conducted by the organization itself to assess compliance with specific standards or regulations","why":"Self-assessments are internal evaluations the organization performs on itself against specific standards — valuable for identifying compliance gaps and preparing for formal audits. Most internal assessments take this form; large enterprises may also field a dedicated internal assessment group.","multi":false},{"id":"19owwr6","q":"A security team launching a new web application begins by identifying potential threats like SQL injection and XSS. Which assessment step is this?","a":"Threat modeling","why":"Identifying potential threats to the application (SQLi, XSS, DoS) is threat modeling — the FIRST step of the internal assessment flow: threat modeling → vulnerability assessment → risk assessment → mitigation recommendations.","multi":false},{"id":"24eqxh","q":"In the internal assessment flow, what does the risk assessment step evaluate?","a":"Likelihood of exploitation, potential damage, and cost of implementing security measures","why":"Risk assessment evaluates the potential impact of identified threats and vulnerabilities: likelihood of exploitation, potential damage, and the cost of security measures. This analysis feeds the final step — recommending mitigation strategies (code fixes, additional controls, architecture changes).","multi":false},{"id":"1nnaaos","q":"What format do the self-assessment checklist questions take?","a":"Yes or no questions with comments, action items, and assignees","why":"The MCIT Cybersecurity Self-Assessment Checklist uses yes/no questions, with columns for comments, action items to be performed, and who each action is assigned to. The format gives a quick overview of the organization's current risk posture.","multi":false},{"id":"70r1xk","q":"Why must every action item on a self-assessment checklist be assigned to a specific individual or group?","a":"So someone is responsible for following up and ensuring the corrective action is properly performed and implemented","why":"Assignment creates accountability for follow-through. An action item with no owner is an action item that never gets done — the assignee is responsible for seeing the corrective action performed and implemented. The course stresses that someone must be responsible for following up with designees.","multi":false},{"id":"15tzziz","q":"Who should work on the self-assessment checklist together?","a":"People from across the organization — administration, IT staff, and cybersecurity professionals","why":"Cross-functional participation ensures risks across the whole organization are well understood. Administration brings business context, IT knows the infrastructure, and security professionals assess the risks — one silo alone cannot see the full picture.","multi":false},{"id":"1xaz6tm","q":"Which items appeared in the first five questions of the MCIT self-assessment checklist?","a":"Cybersecurity incidents in the past 12 months, incident response plan, business continuity plan, antivirus on every device, and mobile device policy","why":"The sample questions: (1) any cybersecurity incident in the past 12 months with deficiencies addressed, (2) a data security incident response plan, (3) a business continuity plan including vital-operations inventory and third-party agreements, (4) antivirus/anti-malware installed and updated on every device, (5) a mobile device policy with staff training. Broad, quick-overview questions about risk posture.","multi":false},{"id":"1rkc5m0","q":"What is the overarching purpose of a self-assessment checklist?","a":"To identify and address potential risks and vulnerabilities so the organization is prepared to mitigate them over time","why":"Checklists help identify and address data/cybersecurity exposures — some of the largest potential loss drivers for organizations — so the org can mitigate and remediate over time. They prepare you for formal audits; they do not replace them or certify anything.","multi":false},{"id":"q0crwm","q":"What is the key advantage of an external audit over an internal audit?","a":"It provides an objective, unbiased perspective on the organization's true security posture","why":"External audits by independent entities provide objectivity — an unbiased view of the true security posture, free from internal politics or assumptions. This is why regulations like GDPR and PCI DSS require regular independent third-party audits.","multi":false},{"id":"xzrzjx","q":"What is regulatory compliance?","a":"The goal of being aware of and taking steps to comply with relevant laws, policies, and regulations","why":"Regulatory compliance is the organizational goal of knowing and following relevant laws, policies, and regulations — via specific security controls, maintained policies/procedures, and regular audits and assessments. It can involve industry-specific rules (HIPAA, PCI DSS) or general ones (GDPR).","multi":false},{"id":"uglw7s","q":"How are organizations increasingly achieving regulatory compliance across many regulations at once?","a":"By adopting consolidated, harmonized control sets such as the NIST Cybersecurity Framework as an umbrella mechanism","why":"Organizations use consolidated, harmonized control frameworks — the course's example is the NIST Cybersecurity Framework as the main compliance mechanism, with each individual regulation's controls implemented within that larger framework. One control set, many regulations mapped onto it.","multi":false},{"id":"bm9lko","q":"What distinguishes an examination from a typical assessment?","a":"Examinations may also include standardized testing of key personnel — checking knowledge and certifications","why":"Examinations inspect security infrastructure like an assessment, but additionally test key personnel with standardized knowledge exams and certification checks. Example: nuclear power plants face examinations every 1–5 years covering networks, ICS/SCADA equipment, procedures, AND employee knowledge exams required to maintain operating authority.","multi":false},{"id":"vdp1uq","q":"How often are nuclear power facilities subject to examinations, per the course?","a":"Every 1 to 5 years","why":"Nuclear power generation facilities are subject to examinations every one to five years — covering computer networks, ICS and SCADA equipment, operational procedures, and knowledge-based exams for all employees in their work roles. It's the course's marquee example of an 'examination' vs a typical assessment.","multi":false},{"id":"8ldtri","q":"Why do many regulations (GDPR, PCI DSS) require independent third-party audits?","a":"They provide unbiased validation of security measures and build trust with customers, stakeholders, and regulators","why":"Independent audits catch weaknesses internal teams overlook and provide credible validation — a third party's stamp builds trust with customers, stakeholders, and regulatory bodies. That credibility is why compliance frameworks mandate them.","multi":false},{"id":"1lc5mqb","q":"In the HIPAA external assessment demo, how must each checklist question be answered?","a":"Yes or No, plus a link to evidence (a file) demonstrating the requirement is met","why":"For each HIPAA checklist item you answer Yes or No and provide a link to evidence — a file on the organization's share drive or an external portal (Dropbox, Google Drive, OneDrive). The evidence trail is what makes the external assessment verifiable.","multi":false},{"id":"88he9n","q":"Which HIPAA checklist item required only identifying guidance, with no documentation to provide?","a":"Identifying any applicable industry guidance (studies, practices, regulations) used to develop policies and procedures","why":"The 'identify applicable industry guidance' items explicitly state 'no need to provide this documentation; simply identify' — you name the studies, practices, regulations, or reference material used to develop the policies. Other items (security officer contact info, risk assessments, access logs) require actual evidence files.","multi":false},{"id":"vcberm","q":"What does HITECH stand for, and what was it created to do?","a":"Health Information Technology for Economic and Clinical Health — to motivate implementation of electronic health records and supporting technologies","why":"HITECH = Health Information Technology for Economic and Clinical Health Act, created to motivate implementation of electronic health records and supporting technologies in the US. The checklist's HITECH section asks about breach notification processes and entity-level risk assessment capabilities.","multi":false},{"id":"1f9ybgh","q":"Which categories appeared in the HIPAA Security checklist section?","a":"Administrative, Physical, and Technical Safeguards","why":"The HIPAA Security section covers Administrative Safeguards (entity-level risk assessment, risk management policy), Physical Safeguards (physical security policies, data destruction/media reuse procedures, role-based access lists), and Technical Safeguards (encryption policies, internal audit policies on IT safeguards, system-generated user access listings).","multi":false},{"id":"7dytkk","q":"What is the true function of external audits and assessments, according to the course?","a":"They validate that you meet a compliance level and minimize attack surface — they do not fix anything","why":"Audits and assessments are a VALIDATION function — they prove you meet a certain compliance level and are prepared to defend against known threats. They identify nothing gets fixed by the audit itself; remediation is the organization's job afterward.","multi":false},{"id":"i4up0b","q":"What is penetration testing?","a":"A simulated cyber attack against a computer system to check for exploitable vulnerabilities","why":"Penetration testing (pentesting, ethical hacking) is a simulated cyber attack against a system, network, or web application to identify vulnerabilities that could be exploited by real attackers. The goal is to find and fix vulnerabilities before malicious actors exploit them — not to cause damage.","multi":false},{"id":"nztavh","q":"What does a physical penetration test involve?","a":"Testing physical security measures — locks, access cards, cameras — e.g., tailgating or badge cloning","why":"Physical pentesting attacks the facility layer: bypassing locks, access cards, security cameras — by tailgating behind employees or cloning access cards. Benefits: identify physical vulnerabilities, improve security awareness, prevent unauthorized access to sensitive areas.","multi":false},{"id":"37oca8","q":"Offensive penetration testing is also known as what?","a":"Red Teaming","why":"Offensive penetration testing = Red Teaming: actively seeking vulnerabilities and exploiting them using the same techniques as a real attacker. It's proactive and aggressive. A side benefit the exam likes: results can be used to garner more funding by demonstrating how vulnerable current systems are.","multi":false},{"id":"l2o3s4","q":"Which penetration testing type is reactive, focusing on strengthening systems, detecting and responding to attacks, and improving incident response times?","a":"Defensive (Blue Team)","why":"Defensive penetration testing = Blue Teaming: the reactive approach — monitoring for unusual activity, mitigating damage, strengthening systems, and improving incident response times. It enhances detection capabilities so defenders respond faster to real attacks.","multi":false},{"id":"1p5zlzd","q":"In Purple Teaming, what happens when the blue team fails to detect the red team's attack?","a":"The red team walks the blue team through the attack process and how to configure network sensors to detect it in the future","why":"Integrated (Purple) testing runs red offense and blue defense together. If blue detects the attack, red escalates to more advanced techniques; if blue misses it, red walks blue through the attack and teaches them how to configure sensors to catch it next time. Both teams learn from each other — promoting collaboration is the point.","multi":false},{"id":"1y9fr9g","q":"An organization wants to demonstrate to its board how vulnerable current systems are to justify a bigger security budget. Which pentest approach directly serves this goal?","a":"Offensive testing that identifies and exploits the most critical vulnerabilities","why":"Offensive pentest results — showing actual exploitation of the organization's most critical vulnerabilities — demonstrate real risk in concrete terms, which the course notes can be used to garner funding and support for proposed cybersecurity investments.","multi":false},{"id":"ecpyse","q":"What is reconnaissance in penetration testing?","a":"The initial phase where the attacker gathers as much information as possible about the target system to plan the attack","why":"Reconnaissance is the initial information-gathering phase — IP addresses, domain details, mail servers, detection systems — used to identify potential vulnerabilities and plan the attack for a higher success rate. The course compares it to a thief casing a home before robbing it.","multi":false},{"id":"b823jk","q":"Which is an active reconnaissance technique?","a":"Using Nmap to scan the target for open ports","why":"Active reconnaissance directly engages the target: pinging it, scanning ports, establishing connections. Nmap port scanning is the course's example — it yields lots of information but carries a higher risk of detection, and defenders may trace the source. WHOIS, OSINT research, and public databases are passive.","multi":false},{"id":"18xt48d","q":"What is the trade-off between active and passive reconnaissance?","a":"Active yields more information but risks detection; passive is stealthy but yields less information","why":"Active recon (direct engagement like port scans) gathers richer data but alerts defenders — higher detection risk. Passive recon (OSINT, WHOIS, observing traffic, public databases) avoids touching the target so it is much harder to detect, but the information yield is lower. Choosing between them is a core trade-off question.","multi":false},{"id":"vwagsg","q":"A known environment penetration test most closely simulates which threat?","a":"An insider threat — testers receive detailed information like diagrams, IPs, and even credentials","why":"In a known environment (white box) test, testers get detailed target information — network diagrams, IP addresses, application details, OS versions, even credentials. It resembles the insider threat scenario: the attacker already knows the environment, so the objective is evaluating vulnerabilities in known assets and their potential damage — not discovering assets.","multi":false},{"id":"1u3pk9","q":"Which environment type requires the most extensive reconnaissance?","a":"Unknown environment — the tester may only get the company name or domain and must discover assets, vulnerabilities, and exploit paths","why":"Unknown environment (black box) tests start with minimal to no information — perhaps just a company name or domain — simulating a real-world external attacker. They begin with extensive reconnaissance to discover related assets, then identify vulnerabilities and exploit paths. Known tests may need almost no recon; partially known needs recon to fill gaps.","multi":false},{"id":"j71f5p","q":"What unique value does a partially known (gray box) test provide?","a":"Beyond known vulnerabilities, it uncovers hidden or forgotten assets that might be vulnerable","why":"The partially known hybrid gives testers limited info (some IP ranges or endpoints) — simulating an attacker with partial insider knowledge, perhaps from a prior breach. Recon fills the knowledge gaps, and the test uncovers not only known-asset vulnerabilities but also hidden or forgotten assets that might be vulnerable.","multi":false},{"id":"7dz7qu","q":"What is Metasploit?","a":"A multipurpose penetration testing framework covering reconnaissance, exploitation, and post-exploitation","why":"Metasploit is the most widely used penetration testing framework — a multipurpose tool covering reconnaissance through exploitation to post-exploitation. It comes preinstalled on Kali Linux and Parrot Linux, the penetration testing distributions, and is launched with msfconsole.","multi":false},{"id":"1f6ixfq","q":"In Metasploit, what is an auxiliary module?","a":"A non-exploit feature such as scanners, sniffers, fuzzers, and spoofers","why":"Auxiliary modules are the non-exploit features: scanners, sniffers, fuzzers, spoofers. You can even use them instead of Nmap for port scanning. The other module categories: exploits (attack code), post (post-exploitation tasks), payloads (delivered code), encoders, nops, evasion.","multi":false},{"id":"ljtlp0","q":"What are encoders used for in Metasploit?","a":"Ensuring payloads reach their destination intact and undetected, bypassing IDS, firewalls, and ACLs","why":"Encoders ensure payloads make it to their destination in one piece and undetected — encoding/encrypting to bypass intrusion detection systems, firewalls, and router ACLs. Related: nops (non-operations) keep payload sizes consistent across exploit attempts and also aid evasion.","multi":false},{"id":"1l88tek","q":"What is the difference between RHOST and LHOST in Metasploit options?","a":"RHOST is the target's address; LHOST is your local machine's address","why":"RHOST/RPORT = remote host and port (the target); LHOST/LPORT = local host and port (your attack machine, e.g., where a reverse shell connects back to). You set them with the 'set' command, e.g., 'set RHOST 192.168.1.2'.","multi":false},{"id":"1y93sw8","q":"Why did the exploit fail on the first run in the demo, before the payload was set?","a":"An exploit without a selected payload does nothing — the payload defines what runs after exploitation","why":"Exploiting a vulnerability is only half the job — you must define what code runs afterward. The demo's first run failed with 'no payload selected.' After 'show payloads' and 'set payload cmd/unix/bind_perl', the exploit opened a bind shell. Exploit delivers; payload executes.","multi":false},{"id":"avap3k","q":"The demo exploit ms17_010_psexec targets which famous vulnerability?","a":"EternalBlue — the vulnerability at the core of the WannaCry ransomware","why":"ms17_010_psexec targets Windows SMB using the flaw patched by Microsoft in March 2017 — EternalBlue, which made up the core of the WannaCry ransomware outbreak. The module name encodes type/platform/service: exploit/windows/smb/ms17_010_psexec.","multi":false},{"id":"liu2oh","q":"In the demo, which tool was used to discover the vulnerable machine and fingerprint its services?","a":"Nmap — a subnet scan to find the host, then an -sV service scan to identify versions","why":"The demo used Nmap twice: a subnet scan (172.16.218.0/24) to locate the vulnerable host among 254 addresses, then 'nmap -sV' against the specific IP to fingerprint services and versions — revealing the vulnerable UnrealIRCd on port 6667. Tool-to-purpose mapping is what the exam expects from this lesson.","multi":false},{"id":"p7cfle","q":"What does Metasploit's session capability allow a tester to do?","a":"Run multiple concurrent shells — chaining exploits across multiple systems — with Ctrl+Z to background and 'sessions' to list/switch","why":"Metasploit sessions let you run multiple command shells concurrently — for parallel attacks or chaining exploits across systems. Ctrl+Z backgrounds the current session, 'sessions -l' lists all sessions, and 'sessions \u003cn>' switches to one. The demo ended with 'whoami' returning root on the compromised IRC server.","multi":false},{"id":"xyutt7","q":"What is attestation of findings?","a":"A formal validation confirming the penetration test occurred and that the findings are valid based on presented evidence","why":"Attestation of findings formally proves two things: the pentest actually happened, and the findings are valid — backed by evidence, not just the tester's word. For compliance-driven tests (GLBA, HIPAA, Sarbanes-Oxley, PCI DSS), a letter of attestation from the testing firm is required as the official record.","multi":false},{"id":"tmob3x","q":"What is the key difference between attestation of findings and the pentest report?","a":"Attestation includes evidence demonstrating the exploits actually worked; the report presents findings and remediation without necessarily showing how exploitation was done","why":"Attestation includes EVIDENCE — detailed reports, data, logs, explanations, even exploit code shown in the attestation meeting. The report lists findings and recommended remediation but not necessarily the exploitation method. Sensitive material like custom exploit code may be shown but not left with the organization.","multi":false},{"id":"z8hxms","q":"When is a letter of attestation typically required?","a":"When the penetration test is conducted for compliance or regulatory reasons — e.g., GLBA, HIPAA, Sarbanes-Oxley, or PCI DSS","why":"If the org ordered the test for its own reasons, attestation may not be required. But compliance/regulatory-driven tests need a letter of attestation as an official record proving the assessment occurred — the organization can show it to third parties. The letter includes a summary of findings plus proof of testing during a given period.","multi":false},{"id":"1h4nrsv","q":"A TPM storing hardware/firmware measurements checked at boot is an example of what?","a":"Hardware attestation","why":"Hardware attestation validates hardware integrity — a Trusted Platform Module (TPM) stores measurements of the computer's hardware and firmware configurations and checks them at boot to detect tampering. Software attestation = verifying code integrity (e.g., a signed update); system attestation = validating a system's security posture (e.g., SOC 2 / ISO 27001 claims).","multi":false},{"id":"1ei76d3","q":"A cloud provider claiming its services meet ISO 27001 and SOC 2 standards is performing which attestation type?","a":"System attestation — validating the security posture of the system for customers","why":"System attestation validates the security posture of a system — the cloud provider attests that its services meet standards like ISO 27001 or SOC 2, giving customers confidence their data is handled securely. Distinguish from software (code integrity) and hardware (TPM) attestation.","multi":false},{"id":"8nqfzw","q":"What three things does attestation strengthen within an organization, according to the course?","a":"Trust, transparency, and accountability","why":"Attestation strengthens trust (stakeholders can rely on the information), transparency (operations are openly validated), and accountability (the organization is held responsible for its actions). It is a foundation for asserting the reliability and integrity of data, systems, and processes in both internal and external audits.","multi":false},{"id":"qzaggy","q":"An e-commerce firm brings in an outside auditor to verify its cardholder data environment — firewalls, encryption, access controls — against PCI DSS. Which term best describes this engagement?","a":"External audit","why":"An independent third party systematically evaluating the organization's controls against a regulatory standard (PCI DSS) is an external audit. Internal assessments are done by the org itself; red teaming is offensive exploitation; self-assessments are internal pre-audit preparation.","multi":false},{"id":"1esh1sk","q":"Why does the course say internal assessments are 'proactive' measures?","a":"They identify and evaluate risks and vulnerabilities before new systems launch or major changes occur","why":"Internal assessments are proactive because they happen BEFORE implementation — catching risks in a new web app or major change before it reaches production, when fixes are cheapest. Audits verify what already exists; assessments surface problems early.","multi":false},{"id":"gvzqiq","q":"A hospital must answer a HIPAA external assessment checklist. One line asks it to 'identify applicable industry guidance used to develop your policies.' What response does this item expect?","a":"A Yes or No, plus naming the studies, practices, or regulations used — no documentation file is required for this item","why":"This checklist item explicitly says no documentation is needed — simply identify the guidance. Other items demand evidence files (risk assessments, access logs, encryption policies) with Yes/No plus a file link. Reading what each line actually asks for is part of external assessment discipline.","multi":false},{"id":"1vwl7lx","q":"Which organization creates the audit committee, and what is its composition?","a":"The organization's leadership/governance; typically members of the board of directors","why":"The audit committee is formed at the governance level — typically board members — precisely because oversight of financial reporting, audits, and compliance requires authority above management. It reviews internal controls, oversees audit performance, ensures regulatory compliance, and addresses auditor-raised issues.","multi":false},{"id":"1iaruwr","q":"A tester wants to learn which mail servers and contact addresses a target uses for a planned phishing simulation, using only public records without touching the target's systems. Which technique and tool fit?","a":"Passive reconnaissance with WHOIS lookups","why":"WHOIS queries public domain registration data — points of contact, mail servers — without any direct engagement with the target, making it passive reconnaissance. The course cites exactly this use case: gathering points of contact for an upcoming phishing campaign. Nmap would be active and detectable.","multi":false},{"id":"1vm58x5","q":"During a purple team engagement, the blue team catches the red team's simulated attack within minutes. What happens next, per the course?","a":"The red team is informed and tries a more advanced type of attack to avoid detection","why":"In integrated (purple) testing, detection is a signal to escalate: when blue identifies the attack, red is informed so it can attempt more advanced techniques. When blue misses, red walks blue through the attack and teaches sensor configuration. The iterative push-pull is what sharpens both teams.","multi":false},{"id":"1as42w2","q":"What is the role of 'post' modules in Metasploit?","a":"Post-exploitation tasks on a compromised host — maintaining persistence, covering tracks, and similar actions","why":"Post = post-exploitation: everything you do AFTER breaking in — persistence, track-covering, further information gathering, lateral movement setup. The name is short for post-exploitation, and there were about 400 such modules in the demo version.","multi":false},{"id":"1kg515x","q":"A compliance officer asks: 'Our vendor's penetration test report says they exploited our domain controller. How do we know it really happened?' Which artifact answers this?","a":"Attestation of findings, which includes evidence such as logs and exploit demonstrations proving the findings are valid","why":"Attestation of findings differs from the report by including EVIDENCE — detailed logs, data, explanations, even exploit code shown in the attestation meeting — proving the test occurred and findings are valid. A report states findings and remediation advice, which the reader must otherwise take on faith.","multi":false},{"id":"1vgh2g3","q":"An organization must comply with both HIPAA and PCI DSS and wants to avoid maintaining two entirely separate control programs. Which approach does the course describe?","a":"Use a consolidated, harmonized set of compliance controls as an umbrella (e.g., NIST CSF), implementing each regulation's controls within it","why":"Regulatory compliance is increasingly achieved through consolidated, harmonized controls — the NIST Cybersecurity Framework as the umbrella mechanism, with each individual regulatory control set implemented within the larger framework. This avoids duplicate parallel programs for overlapping requirements.","multi":false},{"id":"1djscl2","q":"Which reconnaissance environment classification best simulates an external attacker who knows nothing about the target beyond its name?","a":"Unknown environment — starts with extensive reconnaissance to discover assets, vulnerabilities, and exploit paths","why":"Unknown (black box) testing gives testers minimal to no information — perhaps just a company name or web domain — mimicking a real-world external attacker. It begins with extensive reconnaissance and reveals how the organization's external security posture appears to the outside world.","multi":false},{"id":"1tkwsub","q":"What is the stated purpose of nops (non-operations) in Metasploit?","a":"They keep payload sizes consistent across different exploit attempts and assist with evasion","why":"Nops are non-operation instructions used to keep payload sizes consistent across exploit attempts — a size-stable layout helps reliability — and they are also useful as part of evasion. Encoding is the payload-obfuscation job; log deletion is post-exploitation; host discovery is the scanner's job.","multi":false},{"id":"1tx2avx","q":"Which pentest engagement type combines offense and defense in a single test so both teams improve by working together?","a":"Integrated penetration testing, better known as purple teaming","why":"Integrated (purple) testing runs the red team's offense and blue team's defense as one collaborative engagement — red attacks while blue detects and responds, each learning from the other. It promotes collaboration and is useful for comprehensive security assessments.","multi":false},{"id":"axf4w9","q":"Which items appeared among the first five questions of the MCIT Cybersecurity Self-Assessment Checklist? (Select THREE.)","a":"Any cybersecurity incident in the past 12 months, with deficiencies identified and addressed;  A data security incident response plan covering responsibilities through recovery and business continuity;  A business continuity plan including an inventory of vital operations and essential IT hardware/software","why":"The checklist's opening questions cover recent incidents and remediation, the incident response plan (responsibilities, identification, triage, notification, investigation, removal, recovery, continuity), and business continuity planning (vital operations inventory, essential hardware/software inventory, third-party agreements). Also in the first five: antivirus on every device and mobile device policy with training.","multi":true},{"id":"11vjvqm","q":"Which regulations and standards does the course tie to audits and assessments? (Select FOUR.)","a":"GDPR — General Data Protection Regulation;  HIPAA — healthcare data protection;  PCI DSS — card payment security;  HITECH — electronic health records incentive act","why":"GDPR (EU data protection), HIPAA (US healthcare), PCI DSS (card industry), and HITECH (motivating EHR adoption; appearing in the HIPAA assessment checklist) all appear in this section's regulatory landscape. The others are a game license and a Wi-Fi standard — nonsense distractors.","multi":true},{"id":"8as27p","q":"Which statements about active vs passive reconnaissance are TRUE? (Select THREE.)","a":"Active recon directly engages the target — pings, port scans, connections;  Active recon carries a higher risk of detection and possible traceback;  Passive recon uses OSINT, public databases, and traffic observation without alerting the target","why":"Active = direct engagement (Nmap scans), richer results but detectable. Passive = no direct contact (WHOIS, OSINT, public records), stealthier but thinner data. WHOIS is the course's passive example; claiming passive yields more information reverses the trade-off.","multi":true},{"id":"18eb5bp","q":"A letter of attestation for a compliance-driven penetration test should include which elements? (Select THREE.)","a":"A summary of the findings;  Proof that the security assessment was conducted during a given period;  Sufficient formality to serve as an official record shown to third parties","why":"The letter of attestation summarizes findings and proves the assessment happened in a given timeframe, serving as an official record the organization presents to regulators or other third parties. Sensitive exploit code may be DEMONSTRATED at the attestation meeting but is not left behind, and no document can guarantee future security.","multi":true},{"id":"1j7s4ik","q":"A CISO must choose the right evaluation for each goal: (1) verify the company's access controls match PCI DSS before the annual deadline; (2) find weaknesses in a new app BEFORE it launches; (3) prove to enterprise customers that security claims are independently validated. Which mapping is correct?","a":"1 = audit, 2 = assessment, 3 = independent third-party audit","why":"Verifying existing controls against a regulation is an audit. Analyzing a not-yet-launched system for vulnerabilities and mitigation is an assessment (done before implementation). Convincing external parties requires an INDEPENDENT third-party audit — internal work cannot provide the objectivity outsiders demand. Attestation proves a pentest occurred; examinations add personnel testing; red teaming is offensive exploitation.","multi":false},{"id":"1qa074c","q":"An auditor testing access controls logs in with a limited account and browses to the finance file share — which opens. Which conclusion and recommendation are correct?","a":"The access controls are ineffective — the account exceeded its designated permissions, indicating excessive access; recommend remediation of permissions and review of provisioning/revocation processes","why":"This is the course's own access-control audit test: attempt access beyond the account's designated permissions. Success = a control weakness. The finding feeds recommendations covering least privilege (excessive rights), provisioning errors, and possibly stale authorization — precisely the audit's purpose of identifying gaps in controls.","multi":false},{"id":"14cg2bl","q":"A multinational maps GDPR, HIPAA, and PCI DSS requirements onto a single control framework so one implementation satisfies all three. Which framework does the course name as the umbrella mechanism for this harmonization?","a":"The NIST Cybersecurity Framework","why":"The course describes organizations adopting consolidated, harmonized control sets — using the NIST Cybersecurity Framework as the main regulatory compliance mechanism, with each individual regulation's controls implemented within the larger framework. ISO 9001 is quality management, COBIT is IT governance, ITIL is service management — none named here.","multi":false},{"id":"dcoxdm","q":"A power plant's review covers ICS and SCADA equipment, network systems, and operational procedures — but uniquely, every operator must also pass knowledge-based exams to keep operating authority. A colleague calls this 'just a vulnerability assessment.' Why is the colleague wrong?","a":"Because this is an examination — it adds standardized testing of key personnel (knowledge exams, certification currency) to the infrastructure inspection","why":"Examinations resemble assessments for the infrastructure but uniquely add standardized PERSONNEL testing — knowledge-based exams and certification checks — which this scenario explicitly includes (operators maintaining authority to operate). That human-testing element is the defining difference; nuclear facilities undergo examinations every 1–5 years.","multi":false},{"id":"su6q17","q":"A company answers 'No' on a HIPAA checklist item about entity-level risk assessments. Which follow-through best matches the course's guidance on self-assessment checklists?","a":"Record the deficiency as an action item assigned to a specific individual or group, with follow-up to ensure implementation","why":"Checklists drive remediation through accountability: each gap becomes an action item assigned to a named individual or group, and someone follows up to verify the corrective action is performed and implemented. Unowned findings are unfixed findings — assignment is what turns a checklist from documentation into improvement.","multi":false},{"id":"1ohoxn4","q":"A tester planning a gray-box engagement knows two server IP ranges from a prior breach but nothing else. Which reconnaissance plan fits the course's model?","a":"Reconnaissance to fill knowledge gaps — discovering what software runs, versions, and configurations — which may also uncover hidden or forgotten assets","why":"Partially known (gray box) tests simulate attackers with partial insider knowledge — e.g., from a previous breach. Recon here fills the gaps: what software and versions run, what configurations exist. A bonus the course emphasizes: this approach also uncovers HIDDEN or FORGOTTEN assets that purely known-asset testing would miss.","multi":false},{"id":"p158cd","q":"Which sequence of Metasploit commands correctly arms and fires an exploit against 10.0.0.5's vulnerable IRC daemon on port 6667 with a bind shell payload?","a":"use exploit/unix/irc/unrealircd3281backdoor → set RHOST 10.0.0.5 → set RPORT 6667 → set payload cmd/unix/bind_perl → run","why":"The demo's exact flow: load the module with 'use', configure target options (RHOST/RPORT), select a compatible payload with 'set payload' (after 'show payloads' if needed), then 'run'. Payload syntax uses spaces (set payload cmd/unix/...) unlike module syntax (use exploit/...). Running without a payload fails — option 4 proves that.","multi":false},{"id":"1twjv5p","q":"During attestation, a pentester demonstrates custom exploit code to prove a finding, then declines to leave a copy with the client. Which statement captures this correctly?","a":"Proper — sensitive exploit material may be shown at the attestation meeting as evidence without being left behind; the report itself may not even detail the exploitation method","why":"Attestation includes evidence — logs, data, demonstrations, sometimes exploit code — to prove findings are valid. Sensitive custom tooling can be demonstrated without leaving copies, protecting the firm's methods while still proving the finding. This evidence-dimension is the key difference from the report, which gives findings and remediation advice but not necessarily the exploitation path.","multi":false},{"id":"z6d1pq","q":"A firm wants to test whether employees resist tailgating and whether badge readers are properly configured, plus evaluate how well the SOC detects a simulated intrusion. Which combination of pentest types covers both goals?","a":"Physical penetration testing for the facility controls, and defensive (blue) or integrated (purple) testing for the SOC detection capability","why":"Two distinct targets need two types: physical pentesting covers locks, access cards, cameras, tailgating, and badge cloning; detection/response capability is the blue team's domain, best sharpened through integrated (purple) exercises where red attacks and blue must catch them. Red alone tests offense but doesn't train the defenders.","multi":false},{"id":"1uaq8ok","q":"An organization skimps on reconnaissance because 'the scanners will find everything anyway.' Which course principle refutes this most directly?","a":"Reconnaissance identifies potential vulnerabilities and informs attack planning — better information means better planning, higher success, and lower detection risk; skipping it invites failure","why":"Recon exists to plan: more target knowledge → better-planned attacks → higher success rate and reduced risk of detection and failure. The thief-casing-the-house analogy: skipping recon means attacking blind. Scanners are one recon TOOL (active), not a substitute for the intelligence-gathering phase itself.","multi":false},{"id":"1gpui7s","q":"Which deliverable proves to a regulator that a penetration test actually occurred during a specific period, and who issues it?","a":"The letter of attestation, issued by the penetration testing firm","why":"The letter of attestation comes FROM the pentest firm — it summarizes findings and proves the security assessment occurred during a given period, serving as the official record shown to regulators and third parties. It is required when testing is compliance-driven (GLBA, HIPAA, SOX, PCI DSS); an internally-produced document cannot independently prove the engagement happened.","multi":false},{"id":"1i12ykm","q":"A blue team detects an attack only because a junior analyst manually noticed odd IRC traffic. Which defensive-testing outcome does this finding primarily support improving?","a":"Detection capabilities and incident response times — so defenders respond more quickly and effectively to future attacks","why":"Manual flukes are not a detection program. Defensive (blue) testing exists to enhance detection capabilities (configure sensors to catch attacks systematically — like the purple-team lesson where red teaches blue exactly this) and improve incident response times to minimize damage. The goal is repeatable, fast detection — not luck.","multi":false},{"id":"17i8v26","q":"Which activities belong to the internal audit function as described in the course? (Select FOUR.)","a":"Reviewing whether password policies align with best practices like complexity and rotation;  Verifying only authorized individuals hold access to sensitive systems;  Testing access controls by attempting to exceed a limited account's permissions;  Reviewing data protection, network security, and incident response procedures","why":"Internal audits evaluate control effectiveness and compliance: password policy adherence, access-rights verification (least privilege, segregation of duties, prompt revocation), hands-on access-control testing, and reviews of data protection, network security, and incident response. Marketing is unrelated, and attestation letters come from external pentest firms.","multi":true},{"id":"1yjrg7g","q":"Which describe the three penetration testing ENVIRONMENTS and their recon needs? (Select THREE.)","a":"Known: testers get detailed info and may need little to no recon — insider-threat simulation;  Partially known: limited info; recon fills gaps and can uncover hidden assets;  Unknown: minimal info; extensive recon discovers assets, vulnerabilities, and exploit paths","why":"The mapping: known (white box) = insider scenario, detailed info, minimal recon. Partially known (gray box) = partial knowledge, gap-filling recon, hidden-asset discovery. Unknown (black box) = external attacker, extensive recon from almost nothing. Options 4 and 5 invert the known/unknown properties.","multi":true},{"id":"1bq07tp","q":"Which statements about attestation are TRUE? (Select FOUR.)","a":"Attestation of findings proves the pentest occurred and that findings are valid based on evidence;  Attestation includes evidence such as logs, data, and demonstrations — unlike the report;  A letter of attestation is typically required for compliance/regulatory-driven tests (GLBA, HIPAA, SOX, PCI DSS);  Software, hardware, and system attestation are integrity-checking concepts beyond pentest reporting","why":"All four are course facts: dual proof (occurred + valid), evidence-dimension vs the report, regulatory letter requirements for named frameworks, and the broader integrity-attestation family (signed updates, TPM, SOC 2/ISO 27001 claims). Sensitive exploit code is shown, NOT left behind, and attestation complements rather than replaces audits.","multi":true},{"id":"1vf6muj","q":"Which are genuine Metasploit module categories, and which descriptions fit? (Select THREE.)","a":"Auxiliary — scanners, sniffers, fuzzers, spoofers;  Post — post-exploitation tasks like persistence and covering tracks;  Nops — non-operations keeping payload sizes consistent across exploit attempts","why":"The seven real categories: exploits, auxiliary, post, payloads, encoders, nops, evasion. Auxiliary handles non-exploit work; post covers post-exploitation; nops stabilize payload size and aid evasion. Firewalls and antivirus are defenses, not Metasploit module types.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
</div>
<script id="back-lib-script">
(function () {
  if (window.__backBtnInit) return; window.__backBtnInit = true;
  function lib() { return "../library.html"; }
  function resultVisible() {
    var rs = document.getElementById('result-screen');
    if (rs && !rs.classList.contains('hidden') && rs.offsetParent !== null) return true;
    var big = document.querySelector('.score-big');
    if (big) {
      var el = big;
      while (el && el !== document.body) {
        if (el.classList && el.classList.contains('hidden')) return false;
        el = el.parentElement;
      }
      return big.offsetParent !== null;
    }
    return false;
  }
  function ensure() {
    if (!resultVisible() || document.getElementById('back-lib-btn')) return;
    var a = document.createElement('a');
    a.id = 'back-lib-btn';
    a.href = lib();
    a.textContent = '\u2190 Back to Library';
    a.setAttribute('style', 'position:fixed;left:18px;bottom:18px;z-index:9999;' +
      'padding:11px 20px;border-radius:999px;font:600 14px/1 "Segoe UI",system-ui,sans-serif;' +
      'text-decoration:none;color:#fff;background:linear-gradient(135deg,#f0883e,#e36414);' +
      'box-shadow:0 4px 18px rgba(240,136,62,.45);border:1px solid rgba(255,255,255,.25);');
    document.body.appendChild(a);
  }
  setInterval(ensure, 400);
  if (document.readyState !== 'loading') ensure();
  else document.addEventListener('DOMContentLoaded', ensure);
})();
</script>
