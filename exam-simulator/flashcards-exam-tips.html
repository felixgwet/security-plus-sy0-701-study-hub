<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #f0883e; --accent-dim: rgba(240,136,62,.14);
    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .topbar .grow { flex: 1; }
  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }
  h1 { font-size: 24px; margin: 10px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }
</style>
</head>

  <h1>Section 0 · Exam Tips — Flashcards</h1>
  <p class="sub">Tap the card to flip it, then grade yourself honestly &mdash; the deck remembers what you know and will prioritize your weak cards.</p>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span>cards</span></div>
    <div class="stat"><b id="stKnown" style="color:var(--green)">0</b><span>known</span></div>
    <div class="stat"><b id="stLearn" style="color:var(--gold)">0</b><span>learning</span></div>
    <div class="stat"><b id="stPos">0/0</b><span>position</span></div>
  </div>
  <div class="controls">
    <label class="chk"><input type="checkbox" id="shuffle"> Shuffle</label>
    <label class="chk"><input type="checkbox" id="weakOnly"> Weak cards only</label>
    <button class="btn ghost" id="restart" style="margin:0;padding:8px 16px;font-size:13px;">Restart deck</button>
  </div>
  <div class="deck" id="deck" style="display:none;">
    <div class="card" id="card" tabindex="0" role="button" aria-label="flashcard — tap to flip">
      <div class="card-face card-front"><span class="face-tag">Question</span><div class="card-text" id="front"></div><span class="flip-hint">tap to flip</span></div>
      <div class="card-face card-back"><span class="face-tag">Answer</span><div class="card-text" id="back"></div><div class="why" id="why"></div><span class="flip-hint">tap to flip back</span></div>
    </div>
    <div class="grade">

    <div class="score-big" id="donePct"></div>
    <p class="sub" id="doneMsg" style="text-align:center;"></p>
    <div style="text-align:center;"><button class="btn" id="again">Go again</button></div>
  </div>
  <script>
    var DECKS = [{"label":"Section 0 · Exam Tips","cards":[{"id":"13btdi2","q":"Which statement reflects the instructor’s MOST important exam-tip principle?","a":"There are no trick questions — read each question multiple times and answer exactly what is asked","why":"Every question is precisely worded to match the course material. Confusion means misreading, not trickery — reread the stem.","multi":false},{"id":"1gbu35u","q":"Which techniques does the instructor recommend for multiple-choice questions? (Select TWO.)","a":"Identify and eliminate the planted distractor(s);  Read the question multiple times before answering","why":"Eliminating distractors and careful re-reading are the two core tactics. The book answer beats workplace terminology every time.","multi":true},{"id":"1q29cve","q":"When a word in a question is bold, italicized, or in ALL CAPS, it means:","a":"The test writers deliberately emphasized it as critical to the answer","why":"Emphasis is an intentional signal. The emphasized word usually changes what the question is asking — anchor on it.","multi":false},{"id":"hv9jsj","q":"Your employer calls penetration tests \"security probes\" and handles risk differently than the textbook. On the exam you should:","a":"Always select the book answer — the exam tests CompTIA vocabulary and frameworks","why":"The exam never tests your specific workplace — it tests the CompTIA course/textbook framework. Book answer, always.","multi":false},{"id":"58cpoe","q":"A question asks which control BEST ensures a file was not altered in transit. Your association chain should be:","a":"Alteration concern → integrity → hashing","why":"\"Not altered\" = integrity = hashing (hashes/digests verify change). Train the keyword→CIA→association reflex.","multi":false},{"id":"1t562or","q":"Which question formats appear on SY0-701? (Select TWO.)","a":"Multiple-choice (single answer);  Multiple-selection (choose all that apply)","why":"Only multiple-choice and multiple-selection appear. No fill-in-the-blank or essays — recognition, not recitation.","multi":true},{"id":"a97n9b","q":"Because there are no fill-in-the-blank questions, the required knowledge level is:","a":"Recognition — pick the correct concept out of the answer choices","why":"Certification = recognize; school = regurgitate. Study with self-tests using choices rather than passive re-reading.","multi":false},{"id":"gthgnu","q":"Regarding Nmap and similar tools, the exam requires you to know:","a":"What it is used for — network mapping/reconnaissance during vulnerability assessments and penetration tests","why":"Vendor-neutral exam: define the tool and its purpose. Syntax is explicitly not required — \"define it and you know it 99% of the time.\"","multi":false},{"id":"1eouvp3","q":"Why does the instructor cap the study timeline at 90 days maximum?","a":"Early-course knowledge fades — beyond ~60-90 days you forget the beginning before test day","why":"Retention decay is the enemy. Concentrated study (40 hours over 30-60 days) retains; a year-long smear does not.","multi":false},{"id":"1vpynij","q":"A working professional with a family can study about 45 minutes per day. Their realistic timeline is:","a":"About 60 days with consistent daily study","why":"30-60 min/day supports the 60-day plan (~40 total hours). Consistency matters more than session length.","multi":false},{"id":"1f6sbj6","q":"An example calculation: 300 lessons, 30-day target. What daily pace INCLUDING practice-exam buffer should you plan?","a":"About 10/day plus 2-4 extra lessons/day to bank 1-2 practice-exam days","why":"300 ÷ 30 = 10/day; the extra 2-4/day creates protected practice-exam and review days before the real exam.","multi":false},{"id":"1x9bxyy","q":"Which of these is a DISTRACTOR-elimination benefit the instructor cites?","a":"Eliminating even one planted distractor exponentially increases your odds of guessing correctly","why":"From four options to three, your random-guess odds jump from 25% to 33% — and usually you can eliminate more than one.","multi":false},{"id":"1p33w7b","q":"The instructor says students who use the provided study plans:","a":"Pass at a much faster rate than students who study without a plan","why":"The plan operationalizes the deadline, daily pace, and protected practice days — the instructor credits it for faster passing.","multi":false},{"id":"132frib","q":"Which approach to studying tool knowledge is BEST aligned with the exam?","a":"Learn what each named tool is used for and when you would choose it;  Practice defining tools in one sentence, recognition-style","why":"Define-and-purpose is the tested bar. Flags and syntax are wasted effort; ignoring tools fails the ~tool questions that do appear.","multi":true},{"id":"hmzm0b","q":"According to the instructor, what is the most important thing to remember about SY0-701 exam questions?","a":"There are no trick questions — every question is precisely worded to match the course/textbook material","why":"The instructor stresses: no trick questions. If a question seems tricky, you misread it — read it again and answer exactly what is asked.","multi":false},{"id":"1t8vo3z","q":"What should you do when a question seems confusing or tricky on the real exam?","a":"Take the time to read the question multiple times until you understand exactly what is being asked","why":"Because questions are precisely worded (not tricky), confusion means misreading. Reading each stem multiple times is the instructor's top tactic.","multi":false},{"id":"kt4h7m","q":"A 'distractor' or 'red herring' is:","a":"An answer option written to distract you from the correct answer — usually at least one of the four options is one","why":"Usually at least one of four options is a planted distractor. Identifying and eliminating it exponentially increases your chance of picking the correct answer.","multi":false},{"id":"az5niy","q":"If a word in a question appears in bold, italics, or ALL UPPER CASE, you should:","a":"Pay very close attention to it — the test writers marked it as important to the answer","why":"Emphasis is a deliberate signal from the test writers. The emphasized word is critical to determining the correct answer.","multi":false},{"id":"1jk4b8k","q":"When your personal workplace experience conflicts with the course material on a question, you should:","a":"Always select the book answer — the exam tests CompTIA terminology and frameworks, not your employer's habits","why":"Workplaces often use different terminology for the same concepts. The exam tests mastery of CompTIA's vocabulary — the book answer wins every time.","multi":false},{"id":"adnnqj","q":"Complete the association: Confidentiality → ___","a":"Encryption","why":"The instructor's keyword trio: confidentiality always makes you think of encryption; integrity of hashing; availability of redundancy and resiliency.","multi":false},{"id":"mjsfl0","q":"Complete the association: Integrity → ___","a":"Hashing","why":"Integrity = hashing. If a question asks which control verifies data has not been altered, think hashing/digests.","multi":false},{"id":"1bhtqu8","q":"Complete the association: Availability → ___","a":"Redundancy and resiliency","why":"Availability = redundancy and resiliency (and fault tolerance). This trio unlocks dozens of exam questions.","multi":false},{"id":"10auoqv","q":"Which question types appear on the SY0-701 exam?","a":"Multiple choice and multiple selection only","why":"Multiple-choice and multiple-response only. No fill-in-the-blank, no essays — you recognize answers, you never type them.","multi":false},{"id":"1iw37w1","q":"Because the exam has no fill-in-the-blank questions, what level of memorization do you need?","a":"The ability to RECOGNIZE terms and concepts from the answer choices","why":"Certification exams test recognition, not recitation — the opposite of most school exams. Know concepts well enough to pick them out of a list.","multi":false},{"id":"qruqef","q":"Regarding tools like Nmap, the exam expects you to know:","a":"What the tool is used for — Nmap is a network-mapping/reconnaissance tool for vulnerability assessments and penetration tests","why":"Everything is vendor-neutral: know what a tool is FOR, not how to operate it. If you can define the tool and its purpose, you have the right knowledge 99% of the time.","multi":false},{"id":"1v5i15c","q":"The instructor's rule of thumb for tool questions is:","a":"If you can define the tool and what it is used for, you have the right level of knowledge 99% of the time","why":"Define-and-purpose is the exam's knowledge bar for tools. Syntax and operation are explicitly NOT required.","multi":false},{"id":"1a8pbx2","q":"What is the recommended MAXIMUM timeframe for your exam target date?","a":"90 days","why":"Do not go beyond 90 days — students who study longer than ~60-90 days forget the early material by test day. Concentrated study wins.","multi":false},{"id":"1264jyu","q":"Why does the instructor warn against studying over 6-12 months?","a":"You will forget key information from the early lessons by the time you reach the end","why":"Retention decays. The same ~40 hours spread over a year means relearning the beginning; concentrated over 30-60 days it sticks.","multi":false},{"id":"1nmeuaj","q":"Roughly how many TOTAL study hours does the instructor estimate are needed to pass?","a":"40 hours","why":"About 40 hours total. At 1-2 hours/day that is ~30 days; at 30-60 min/day, ~60 days.","multi":false},{"id":"1fhelft","q":"Backward planning means:","a":"Starting from the exam date and dividing lessons across the remaining days, plus buffer days for practice exams","why":"Pick your date, count backward: total lessons ÷ days = daily pace, then add buffer for practice exams and final review.","multi":false},{"id":"1kl01iv","q":"If you have 300 lessons and a 30-day target, approximately what daily pace should you plan — including practice-exam buffer?","a":"10 lessons/day, plus 2-4 extra to bank practice-exam days","why":"300 ÷ 30 = 10/day; add 2-4 more so you bank 1-2 days for practice exams before the real thing.","multi":false},{"id":"1d0aojt","q":"The instructor's example 30-day plan structure is:","a":"2 sections/day for 2 weeks, then a week of practice exams, then final review days before the exam","why":"Content sprint -> practice-exam week -> final review buffer -> exam. The buffer absorbs weak spots discovered in practice.","multi":false},{"id":"n2qqz8","q":"How much daily study time supports a 30-day certification timeline?","a":"1-2 focused hours per day","why":"1-2 hours/day -> ~30 days. Only 30-60 min/day available? Plan ~60 days. Consistency every day beats sporadic marathons.","multi":false},{"id":"17qw5tp","q":"Students who use a written study plan, according to the instructor:","a":"Pass certification exams at a much faster rate than those who study without a plan","why":"Planned students pass faster — the plan forces the backward calculation, daily pace, and protected practice-exam days.","multi":false},{"id":"9v84sy","q":"When you see a question asking for the BEST control to protect data at rest from unauthorized disclosure, your first association should be:","a":"Encryption, because confidentiality is the concern being described","why":"'Unauthorized disclosure' = confidentiality = encryption. Mapping the scenario's key word to the CIA triad, then to the association, is the instructor's core technique.","multi":false},{"id":"kx36kz","q":"Which is the BEST first move on a multiple-choice question where you are unsure of the answer?","a":"Identify and eliminate the planted distractor(s), then choose from what remains","why":"Eliminating even one distractor exponentially improves your odds. Answer elimination is the core multiple-choice skill for this exam.","multi":false},{"id":"1lwm822","q":"The instructor provides both a 30-day and a 60-day study plan as downloadable PDFs. Who is the 60-day plan aimed at?","a":"People working full-time jobs or with family commitments who can study 30-60 minutes daily","why":"Less daily time available -> longer timeline. The 60-day plan assumes ~30-60 focused minutes per day done consistently.","multi":false},{"id":"1bcrjs7","q":"'Certification exams test recognition rather than recitation' means:","a":"You need to recognize the correct concept from answer choices — not reproduce it from memory","why":"No essays or fill-in-the-blanks exist, so deep recall is unnecessary. Train by testing yourself with choices, not by re-reading notes.","multi":false},{"id":"1sn6mvt","q":"The instructor’s single most important exam principle is:","a":"There are no trick questions — questions are precisely worded; read each one multiple times","why":"Precise wording, no tricks. Confusion = misreading. Read the stem as many times as needed and answer exactly what is asked.","multi":false},{"id":"1jdac0s","q":"A \"distractor\" or \"red herring\" refers to:","a":"An option deliberately written to pull you away from the correct answer","why":"At least one of the four options is usually a planted distractor. Eliminating it exponentially improves your odds.","multi":false},{"id":"19668sy","q":"When a question emphasizes a word in bold, italics, or ALL CAPS, you should:","a":"Treat that word as critically important to the answer","why":"The test writers deliberately emphasize words that matter. Anchor your interpretation on them.","multi":false},{"id":"kjbnp","q":"If your workplace uses different terminology than the textbook, which answer do you pick on the exam?","a":"The book answer — always","why":"The exam tests CompTIA’s vocabulary and frameworks, never your employer’s habits. Book answer wins every time.","multi":false},{"id":"5s9x4b","q":"Confidentiality is BEST associated with:","a":"Encryption","why":"The instructor’s trio: confidentiality→encryption, integrity→hashing, availability→redundancy/resiliency.","multi":false},{"id":"mkc4xw","q":"Integrity is BEST associated with:","a":"Hashing","why":"Integrity questions resolve to hashing — digests verify data has not been altered.","multi":false},{"id":"1pjtu8w","q":"Availability is BEST associated with:","a":"Redundancy and resiliency","why":"Availability = redundancy and resiliency (fault tolerance, clustering). Memorize the trio — it unlocks many questions.","multi":false},{"id":"wocv0d","q":"Which question types does SY0-701 use?","a":"Multiple-choice and multiple-selection only","why":"Only multiple-choice and multiple-selection. No fill-in-the-blank, no essays — recognition, not recitation.","multi":false},{"id":"1v29dko","q":"Because the exam is recognition-based, you should study by:","a":"Testing yourself with choice-based questions until you can recognize the correct concept","why":"Certification = recognize the right answer among choices; school = regurgitate. Practice recognition with self-quizzing.","multi":false},{"id":"1bid23g","q":"For tools like Nmap, the exam expects:","a":"Knowing what the tool is used for — reconnaissance/network mapping in assessments and pentests","why":"Vendor-neutral: define the tool and its purpose. \"Define it and you know it 99% of the time\" — syntax is never required.","multi":false},{"id":"17v645p","q":"The recommended MAXIMUM study timeline is:","a":"90 days","why":"Beyond ~60-90 days, early material fades before test day. Concentrated study beats long timelines.","multi":false},{"id":"sgjyh7","q":"Estimated total study time to pass is roughly:","a":"40 hours","why":"About 40 total hours — 1-2 hrs/day for ~30 days, or 30-60 min/day for ~60 days.","multi":false},{"id":"ywqzbh","q":"\"Backward planning\" means:","a":"Starting from your target exam date and dividing lessons across remaining days, plus buffer for practice exams","why":"Set the date, count backward: lessons ÷ days = daily pace, and deliberately bank practice-exam days.","multi":false},{"id":"mebk4i","q":"With 300 lessons and a 30-day target, the suggested pace including buffer is:","a":"10/day plus 2-4 extra to bank practice-exam days","why":"300 ÷ 30 = 10/day; the extra 2-4/day creates 1-2 protected practice-exam days before the real exam.","multi":false},{"id":"1idjxkg","q":"The instructor’s example 30-day structure is:","a":"2 sections/day for 2 weeks, practice exams in week 3, final review before the exam","why":"Content sprint → practice-exam week → final review buffer. The buffer absorbs whatever the practice exams expose.","multi":false},{"id":"1awpar0","q":"Students who follow a written study plan:","a":"Pass certification exams much faster than those without a plan","why":"The instructor states planned students pass faster — the plan forces deadline math, daily pace, and protected review days.","multi":false},{"id":"1nff1db","q":"A question asks for the BEST control to prevent unauthorized reading of data. Your chain is:","a":"Unauthorized reading → confidentiality → encryption","why":"\"Unauthorized reading/disclosure\" = confidentiality = encryption. Map the scenario keyword to CIA, then to the association.","multi":false},{"id":"4ttjcc","q":"Why avoid a 6-12 month study timeline?","a":"You forget early lessons by the end — retention decay makes long timelines inefficient","why":"The same 40 hours spread over a year means relearning forgotten material; concentrated over 30-60 days it sticks.","multi":false},{"id":"1inwvf1","q":"45 minutes of daily study supports which timeline?","a":"About 60 days with consistency","why":"30-60 focused minutes/day → the 60-day plan. Consistency every day beats occasional long sessions.","multi":false},{"id":"1vgcn92","q":"The best first move on an unsure multiple-choice question is to:","a":"Identify and eliminate the planted distractor(s), then choose from the rest","why":"Removing one distractor moves random odds from 25% to 33%; usually you can remove two. Elimination is the core MC skill.","multi":false},{"id":"18vpaje","q":"If asked which association fits \"the file must not be altered in transit,\" the answer family is:","a":"Hashing (integrity)","why":"\"Not altered\" = integrity = hashing. The CIA→control reflex is the instructor’s most repeated exam tactic.","multi":false},{"id":"10y9lw","q":"Which set of statements accurately captures the instructor’s exam-taking principles? (Select THREE.)","a":"There are no trick questions — read each stem multiple times;  Eliminate the planted distractor(s) before choosing;  Always select the book answer over workplace terminology","why":"Precise wording, elimination, and book-over-workplace are the core principles. Emphasized words are signals to heed, and verbatim memorization is unnecessary — recognition suffices.","multi":true},{"id":"hr6w6e","q":"A question reads: \"Which control BEST protects the CONFIDENTIALITY of data at rest?\" The emphasized word triggers which association?","a":"Confidentiality → encryption","why":"Bold/caps words are deliberate signals. \"Confidentiality\" maps to encryption — the emphasized word steers you to the right family before you read the options.","multi":false},{"id":"7z9b65","q":"Your company calls vulnerability scans \"health checks\" and treats them quarterly rather than continuously. A question asks about vulnerability SCANNING best practice. You should:","a":"Answer from the course/textbook framework — the exam tests CompTIA terminology and practice","why":"Workplace habits are irrelevant on the exam. The book answer reflects CompTIA’s framework, which is what is scored.","multi":false},{"id":"8xijak","q":"Which are legitimate implications of the exam being recognition-based? (Select TWO.)","a":"No fill-in-the-blank or essay preparation is needed;  Self-testing with answer choices is the most efficient study format","why":"Recognition-only formats mean practice questions beat re-reading, and verbatim recall is wasted effort. Recitation is never required.","multi":true},{"id":"1ef2m28","q":"Regarding tools (e.g., Nmap), which knowledge level does the exam demand?","a":"Purpose — Nmap performs network mapping/reconnaissance during vulnerability assessments and penetration tests","why":"Vendor-neutral exam: define the tool and its purpose. The instructor: \"define it and you know it 99% of the time.\"","multi":false},{"id":"12hfj27","q":"A candidate says: \"I studied 6 months slowly and now I’m failing practice exams on early topics.\" The instructor’s diagnosis would be:","a":"Retention decay — early material faded; the fix is concentrated restudy within a ≤90-day window before booking","why":"The instructor explicitly warns against 6-12 month timelines because early knowledge fades. Concentration, not duration, is the fix.","multi":false},{"id":"1lodgu5","q":"Which statements about distractors are TRUE? (Select TWO.)","a":"Usually at least one of four options is a planted distractor;  Eliminating one distractor raises random-guess odds from 25% to 33%","why":"Distractors are deliberate and common; elimination math is the practical payoff. Their length or question type is not a reliable tell.","multi":true},{"id":"1xt2zu2","q":"A candidate has 1.5 hours available daily and wants the fastest realistic timeline. The best match is:","a":"The 30-day plan (~40 hours at 1-2 hrs/day)","why":"1-2 focused hours/day supports the 30-day plan. Consistency plus adequate daily time = fastest path.","multi":false},{"id":"6orcwr","q":"Why does the instructor say emphasized formatting (bold/italic/caps) deserves attention?","a":"Test writers deliberately mark words they consider critical to answering correctly","why":"Emphasis is intentional signaling of importance — not an answer giveaway, but a pointer to what the question hinges on.","multi":false},{"id":"1yx948n","q":"Which pairing of study behavior → exam-alignment reason is CORRECT? (Select TWO.)","a":"Quizzing with answer choices → trains recognition, which is all the exam tests;  Learning tool purposes rather than syntax → the exam is vendor-neutral","why":"Choice-based self-quizzing matches recognition formats; purpose-over-syntax matches vendor neutrality. The other two describe skills the exam explicitly does not test.","multi":true},{"id":"15v6bpk","q":"A question seems to have two plausible answers. The instructor’s recommended resolution is to:","a":"Re-read the stem (especially emphasized words) for the precise ask, eliminate distractors, and choose the option that matches the concept exactly","why":"Two \"plausible\" options usually mean one is a distractor and the precise wording (or emphasis) breaks the tie. Careful re-reading resolves it.","multi":false},{"id":"18rn0md","q":"The instructor guarantees that identifying the key concept in each question will:","a":"Really help increase your score","why":"\"Understand the key concept being asked\" is the instructor’s core skill — it directs you to the right association (e.g., confidentiality→encryption) and the right answer family.","multi":false},{"id":"1lbync6","q":"Which summary BEST captures this lesson?","a":"Read precisely, eliminate distractors, honor emphasis signals;  Book answers beat workplace answers; recognition beats recitation","why":"The lesson’s two halves: exam-taking tactics (reading, elimination, emphasis) and study philosophy (book answers, recognition, concentrated planning).","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
</div>
</body>
</html>
