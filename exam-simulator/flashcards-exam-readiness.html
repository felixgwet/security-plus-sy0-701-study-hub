<title>Section 27 · Exam Readiness — Flashcards</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #f0883e; --accent-dim: rgba(240,136,62,.14);
    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .topbar .grow { flex: 1; }
  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }
  h1 { font-size: 24px; margin: 10px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }
</style>

<body>
<div class="container">

  <div class="topbar">
    <a href="../flashcards.html">&larr; All decks</a>
    <span class="grow"></span>
    <select id="deckSel" style="display:none;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;">
      <option value="0">Section 27 · Exam Readiness (75 cards)</option>
    </select>
  </div>
  <h1>Section 27 · Exam Readiness — Flashcards</h1>
  <p class="sub">Tap the card to flip it, then grade yourself honestly &mdash; the deck remembers what you know and will prioritize your weak cards.</p>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span>cards</span></div>
    <div class="stat"><b id="stKnown" style="color:var(--green)">0</b><span>known</span></div>
    <div class="stat"><b id="stLearn" style="color:var(--gold)">0</b><span>learning</span></div>
    <div class="stat"><b id="stPos">0/0</b><span>position</span></div>
  </div>
  <div class="controls">
    <label class="chk"><input type="checkbox" id="shuffle"> Shuffle</label>
    <label class="chk"><input type="checkbox" id="weakOnly"> Weak cards only</label>
    <button class="btn ghost" id="restart" style="margin:0;padding:8px 16px;font-size:13px;">Restart deck</button>
  </div>
  <div class="deck" id="deck" style="display:none;">
    <div class="card" id="card" tabindex="0" role="button" aria-label="flashcard — tap to flip">
      <div class="card-face card-front"><span class="face-tag">Question</span><div class="card-text" id="front"></div><span class="flip-hint">tap to flip</span></div>
      <div class="card-face card-back"><span class="face-tag">Answer</span><div class="card-text" id="back"></div><div class="why" id="why"></div><span class="flip-hint">tap to flip back</span></div>
    </div>
    <div class="grade">
      <button class="btn g-learn" id="btnLearn">Still learning</button>
      <button class="btn g-know" id="btnKnow">Know it</button>
    </div>
  </div>
  <div class="deckdone" id="deckDone" style="display:none;">
    <div class="score-big" id="donePct"></div>
    <p class="sub" id="doneMsg" style="text-align:center;"></p>
    <div style="text-align:center;"><button class="btn" id="again">Go again</button></div>
  </div>
  <script>
    var DECKS = [{"label":"Section 27 · Exam Readiness","cards":[{"id":"o0gwew","q":"A student has finished all course content and is deciding whether to schedule the SY0-701 exam. Which approach to the readiness assessment gives the most trustworthy result?","a":"Take it timed, closed-book, in one sitting, mimicking exam conditions","why":"The assessment exists to predict real-exam performance. Only exam-conditions timing and closed-book honesty produce a score you can make a booking decision on.","multi":false},{"id":"1rigjsg","q":"Per the official CompTIA SY0-701 objectives, which domain weighting is CORRECT?","a":"General Security Concepts 12%, Threats/Vulns/Mitigations 22%, Security Architecture 18%, Security Operations 28%, Program Management 20%","why":"Official weights: 1.0 General Security Concepts 12%, 2.0 Threats/Vulnerabilities/Mitigations 22%, 3.0 Security Architecture 18%, 4.0 Security Operations 28%, 5.0 Program Management and Oversight 20%.","multi":false},{"id":"1qa2kxs","q":"Which pairs of domain → weight are correct? (Select TWO.)","a":"Security Operations → 28%;  General Security Concepts → 12%","why":"Security Operations is 28% (largest) and General Security Concepts is 12% (smallest). Threats/Vulns/Mitigations is 22%, and Program Management is 20%.","multi":true},{"id":"seie1r","q":"An assessment shows: overall 82%, but Security Operations 58% and General Security Concepts 95%. What should the student do FIRST?","a":"Restudy Security Operations before booking, since it is 28% of the real exam and currently the weakest domain","why":"Readiness is about domain balance weighted by exam share. A 58% in the 28% domain predicts failure even with a strong total. Fix the biggest-weighted weakness first.","multi":false},{"id":"bxaviy","q":"Which activities belong in the final week between the readiness assessment and the real exam? (Select THREE.)","a":"Targeted repair of weak domains the assessment flagged;  One or two full timed practice exams to validate and build pacing;  Tapering study and resting before test day","why":"The final week is for gap repair, validation under timed conditions, and rest. New domains create confusion, and burnout cramming degrades performance.","multi":true},{"id":"qljgf8","q":"Why does memorizing a single practice bank inflate readiness scores misleadingly?","a":"The real exam tests the same concepts with novel wording — memorized recognition does not transfer to understanding","why":"Recognition of memorized items is not conceptual readiness. On the real exam, differently-worded questions exposing the same gap will be answered wrong.","multi":false},{"id":"1hf377s","q":"Which facts about the SY0-701 exam itself are TRUE? (Select TWO.)","a":"Up to 90 minutes long;  Passing score is 750 on a 100-900 scaled scale","why":"The exam allows up to 90 minutes, uses multiple-choice and multiple-response questions, and requires a scaled score of 750/900. No essays, no open book.","multi":true},{"id":"fjl5h5","q":"A candidate asks: \"I scored 84% on one full practice exam. Am I ready?\" Which response is BEST?","a":"Not yet — check domain balance and repeat under timed conditions; readiness is a trend, not one score","why":"A single score is a snapshot. Confirm domain balance (especially the 28% and 22% domains) and consistency across 2-3 timed attempts before booking.","multi":false},{"id":"h9is7q","q":"Which of these is a legitimate sign of genuine readiness?","a":"Finishing practice exams far under the time limit with stable domain scores","why":"Comfortable pacing plus balanced domain scores across varied question sources indicates real understanding — not memorization luck.","multi":false},{"id":"t10lrf","q":"A candidate discovers the retake policy has a waiting period between attempts. Why is checking this BEFORE scheduling valuable?","a":"It lets you plan a realistic fallback timeline so one bad day does not derail your certification goal","why":"Knowing retake terms upfront turns a potential failure into a planned contingency rather than a schedule disaster.","multi":false},{"id":"wcwvu3","q":"Which of the following should you verify as part of exam-day logistics before declaring yourself \"ready\"? (Select THREE.)","a":"ID requirements and test-center arrival time (or online proctoring requirements);  The exam format: multiple-choice and multiple-response, up to 90 minutes;  Current retake policy terms","why":"ID, format, timing, and retake terms are knowable in advance and reduce test-day stress. Seat numbers and proctor names are not things you can or need to confirm.","multi":true},{"id":"d1mr51","q":"What does a readiness assessment contribute that simply rewatching lectures does not?","a":"An objective measurement of which specific domains and objectives are weak, directing limited study time","why":"Passive review feels productive but hides gaps. The assessment measures actual performance and points each miss back to a domain for targeted repair.","multi":false},{"id":"pp3hw7","q":"Which domain pair together makes up exactly 50% of the SY0-701 exam, and therefore should never contain your weakest subject at booking time?","a":"Security Operations + Threats, Vulnerabilities, and Mitigations","why":"Security Operations (28%) + Threats/Vulnerabilities/Mitigations (22%) = 50%. Half your exam rides on these two domains.","multi":false},{"id":"cqni17","q":"A candidate can study one hour per day. Per the course guidance, what total study volume and timeframe best fits their exam preparation?","a":"About 40 total hours, concentrated within roughly 60 days","why":"The course recommends ~40 total study hours in a concentrated window (30 days at 1-2 hrs/day, 60 days at 30-60 min/day). Long timelines cause early-domain forgetting.","multi":false},{"id":"jm0u6k","q":"What is the PRIMARY purpose of the course's readiness assessment?","a":"To evaluate your exam preparedness and identify areas for improvement before test day","why":"The assessment is a targeted diagnostic: it highlights your current knowledge and identifies areas for improvement before you commit to a test date.","multi":false},{"id":"vidsyw","q":"Under what conditions should you take a readiness assessment to get an honest result?","a":"Timed, closed-book, with no pausing — mimicking real exam conditions","why":"An untimed, open-book score overstates readiness. Exam conditions produce a score you can actually trust as a go/no-go signal.","multi":false},{"id":"qg114x","q":"Which SY0-701 domain carries the largest weight on the real exam?","a":"Security Operations","why":"Security Operations is 28% of the exam — the largest single domain. It covers monitoring, incident response, vulnerability management, and alerting.","multi":false},{"id":"10pdzdk","q":"The Threats, Vulnerabilities, and Mitigations domain accounts for what percentage of the SY0-701 exam?","a":"22%","why":"Domain 2.0 is 22%, second only to Security Operations (28%). Together these two domains are half the exam.","multi":false},{"id":"tibq4x","q":"Why is an overall readiness score of 78% potentially misleading?","a":"It can hide a very weak domain — e.g., 50% in a domain worth 28% of the real exam","why":"Domain balance matters as much as the total. A weak Security Operations result is far more damaging than the same weakness in a 12% domain.","multi":false},{"id":"12hsvq7","q":"What is the commonly cited comfort threshold for scheduling the real exam, based on full practice exams under timed conditions?","a":"85%","why":"Consistently scoring around 85% or better across multiple timed full practice exams is the standard signal that you're ready to book.","multi":false},{"id":"4uxe6f","q":"A student scores 92% on a practice exam by memorizing the exact questions from one bank. Why is this a false positive?","a":"Readiness means answering NOVEL questions on the concepts — recognition of memorized items doesn't transfer","why":"The real exam will ask differently-worded questions testing the same concepts. Memorized answers without conceptual understanding collapse under novelty.","multi":false},{"id":"1g3jaas","q":"When in your study plan should the readiness assessment sit?","a":"In the final week — after content review, alongside or just before full practice exams","why":"It belongs at the end: take it after content study, fix the gaps it reveals, then validate with full timed practice exams before the real test.","multi":false},{"id":"18zsxil","q":"Which of these is NOT part of confirming your exam-day readiness?","a":"Memorizing every CompTIA command-line tool syntax","why":"The exam is vendor-neutral — you need to know what tools are for, not their syntax. The other items are real logistics you should confirm.","multi":false},{"id":"bcyfvz","q":"How many attempts should you use to judge readiness from assessments?","a":"The trend across 2–3 attempts under exam conditions","why":"A single result is a snapshot subject to luck and mood. The trend across repeated timed attempts is the reliable readiness signal.","multi":false},{"id":"1q7sjrl","q":"What should you do with every question you miss on the readiness assessment?","a":"Map it back to its domain and objective, then restudy that topic","why":"The assessment's job is gap-finding. Each miss is a pointer to a domain/objective to restudy — that feedback loop is the whole point.","multi":false},{"id":"1kho87d","q":"General Security Concepts is what percentage of the SY0-701 exam?","a":"12%","why":"Domain 1.0 is 12% — the smallest domain, but its topics (CIA triad, controls, zero trust) underpin questions across every other domain.","multi":false},{"id":"s2k9pq","q":"Security Program Management and Oversight accounts for what share of the exam?","a":"20%","why":"Domain 5.0 is 20% — governance, compliance, risk management, audits, and third-party/vendor risk.","multi":false},{"id":"1gcbisv","q":"Why should you weight your restudy time by domain percentage?","a":"A point recovered in a 28% domain helps more than a point in a 12% domain","why":"Time is limited; improving your weakest HIGH-WEIGHT domain yields the most exam points. Security Operations and Threats/Vulnerabilities are half the exam.","multi":false},{"id":"1uyxc1k","q":"Which two domains together make up exactly half of the SY0-701 exam?","a":"Security Operations + Threats, Vulnerabilities, and Mitigations","why":"Security Operations (28%) + Threats, Vulnerabilities, and Mitigations (22%) = 50%. These two must be your strongest before test day.","multi":false},{"id":"evrhfs","q":"What does a readiness assessment add that a full practice exam does not?","a":"A quick, targeted diagnostic of specific weak areas before committing exam time","why":"The readiness assessment is short and targeted — built to find gaps fast. Full exams test stamina and pacing. Use both, they answer different questions.","multi":false},{"id":"1kz7hiv","q":"Before scheduling the exam, which retake consideration should you verify?","a":"CompTIA's retake policy includes a waiting period between attempts — check current terms so a bad day doesn't derail your plan","why":"Knowing the current retake terms (waiting period and cost) removes scheduling anxiety and lets you plan a fallback before you book.","multi":false},{"id":"vfeg89","q":"A readiness result shows 88% overall but 55% in Security Operations. What is the best response?","a":"Delay booking; restudy Security Operations first, then retest under conditions","why":"The weak 28% domain is exactly what the assessment exists to expose. Fix it first; the overall average hides a failing profile.","multi":false},{"id":"1sdwbd7","q":"How long is the SY0-701 exam?","a":"90 minutes maximum","why":"Up to 90 minutes, with multiple-choice and multiple-response questions. Pacing practice in full timed exams matters because of this constraint.","multi":false},{"id":"133pmzy","q":"What is the passing score for SY0-701?","a":"750 on a scale of 900","why":"CompTIA reports a scaled score from 100–900, and 750 is required to pass. You don't need perfection — you need roughly solid performance across all domains.","multi":false},{"id":"1bcxmx5","q":"Which of these is a sign you are NOT ready despite decent practice scores?","a":"Your scores drop sharply on questions worded differently from your study bank","why":"Performance that collapses on novel wording means recognition without understanding — the real exam will expose it. Seek variety in question sources.","multi":false},{"id":"sbtfex","q":"What is the best use of the days BETWEEN the readiness assessment and the real exam?","a":"Targeted repair of flagged weak areas, then 1–2 full timed practice exams, then rest","why":"The final stretch is for gap repair and validation under conditions — not new content or burnout. Taper into the exam rested.","multi":false},{"id":"17pqns0","q":"Why does the course recommend against stretching exam preparation beyond 90 days?","a":"Early material fades from memory — concentrated study within ~60 days retains more","why":"Retention decays. Students who study over 6–12 months forget the early domains; ~40 concentrated hours within 30–60 days is the recommended pattern.","multi":false},{"id":"1pe3bjy","q":"Which statement about question types on the real SY0-701 exam is TRUE?","a":"It is multiple-choice plus multiple-response — you recognize answers rather than recalling them","why":"No fill-in-the-blank or essays: recognition, not regurgitation. Practice should train answer-elimination and concept recognition.","multi":false},{"id":"ovwzdv","q":"Where does the readiness assessment fit relative to full-length practice exams in the final study week?","a":"First — its results tell you what to repair, then full exams validate the repair","why":"Sequence: readiness assessment (find gaps) → targeted restudy → full timed exams (validate + build pacing) → real exam.","multi":false},{"id":"h20ef3","q":"What is the primary purpose of the course readiness assessment linked in Section 28?","a":"To evaluate your exam preparedness and identify areas needing improvement before test day","why":"The assessment is a targeted diagnostic: it highlights current knowledge and identifies improvement areas before you commit to a test date.","multi":false},{"id":"14790y5","q":"A readiness assessment should be taken under which conditions to be meaningful?","a":"Timed, closed-book, in a single sitting matching real exam conditions","why":"Only exam-conditions timing produces a score that predicts real-exam performance. Anything else flatters you at booking time and fails you on test day.","multi":false},{"id":"1v5iaij","q":"Which domain is weighted most heavily on the SY0-701 exam?","a":"Security Operations","why":"Security Operations is 28% of the exam — monitoring, incident response, vulnerability management, and alerting. It deserves the most review time.","multi":false},{"id":"1rjg2un","q":"The official weight of the Threats, Vulnerabilities, and Mitigations domain is:","a":"22%","why":"Domain 2.0 is 22%. Combined with Security Operations (28%), these two domains make up exactly half the exam.","multi":false},{"id":"u8znyu","q":"A candidate scores 86% overall on a readiness assessment but only 55% in Security Operations. The best interpretation is:","a":"Not ready — the weak 28% domain will sink the real exam; restudy Security Operations first","why":"Domain balance weighted by exam share is what matters. A 55% in a 28% domain predicts failure regardless of a strong average.","multi":false},{"id":"udz9ow","q":"What scaled score is required to pass SY0-701, and what is the scale?","a":"750 out of 900","why":"CompTIA uses a 100-900 scaled scale with 750 required to pass. You do not need perfection — solid, balanced performance suffices.","multi":false},{"id":"1wcky42","q":"How long is the SY0-701 exam appointment, and which question types appear?","a":"Up to 90 minutes; multiple-choice and multiple-response","why":"Up to 90 minutes with multiple-choice and multiple-response questions. No essays, no fill-in-the-blank — recognition, not recitation.","multi":false},{"id":"u5t4b6","q":"Why is a high score achieved by memorizing one practice bank considered a false positive?","a":"The real exam asks novel questions on the same concepts; memorized recognition does not transfer","why":"Readiness means answering differently-worded questions that test the same concepts. Memorized answers collapse under novel phrasing.","multi":false},{"id":"12rtjm0","q":"What is the recommended comfort threshold before scheduling the real exam?","a":"Consistent scores around 85%+ on full timed practice exams","why":"Consistent ~85% or better across multiple full-length timed practice exams is the standard go-signal. One score, however high, is just a snapshot.","multi":false},{"id":"t1knp5","q":"Where does the readiness assessment fit in the final study week?","a":"First — its results direct targeted repair, then full timed exams validate before the real test","why":"Sequence: readiness assessment (diagnose) -> targeted restudy (repair) -> full timed practice exams (validate and pace) -> taper -> real exam.","multi":false},{"id":"1nofizi","q":"Which two domains together account for 50% of the SY0-701 exam?","a":"Security Operations and Threats, Vulnerabilities, and Mitigations","why":"Security Operations (28%) + Threats/Vulnerabilities/Mitigations (22%) = 50%. Half the exam lives in these two domains.","multi":false},{"id":"qf2wj2","q":"A candidate's domain scores are balanced and strong except a 60% in General Security Concepts (12% domain). Compared with a 60% in Security Operations (28% domain), this is:","a":"Less damaging, because the domain carries less exam weight — though foundational concepts still underpin other questions","why":"Points matter by domain weight: a weakness in a 12% domain costs fewer exam points than the same weakness in a 28% domain. Still fix it — Domain 1 concepts reappear inside other domains' questions.","multi":false},{"id":"u5jbai","q":"What is the best response to missing a question on the readiness assessment?","a":"Map the miss to its domain/objective and restudy that topic","why":"Each miss is a diagnostic pointer. The assessment exists to convert misses into a targeted repair list.","multi":false},{"id":"m04ey6","q":"Which of the following should be confirmed as part of exam-day logistics BEFORE booking? (Select the best single answer.)","a":"ID requirements, arrival time (or online-proctoring requirements), exam format, and the current retake policy","why":"ID, format, timing, and retake terms are knowable in advance and remove test-day surprises. The other options are not things you can confirm.","multi":false},{"id":"mlq72w","q":"Why do the course and CompTIA guidance favor concentrated study (30-60 days) over a 6-12 month preparation?","a":"Retention decays — early domains are forgotten by test day when preparation is stretched too long","why":"About 40 total hours, concentrated, beats the same hours smeared across a year. Spacing beyond ~90 days causes early-material forgetting.","multi":false},{"id":"1n3izcy","q":"What distinguishes a genuine readiness signal from a lucky one?","a":"The trend across 2-3 attempts under timed, closed-book conditions, with balanced domains","why":"Trends under honest conditions filter out luck and memorization. Feelings and flashcard counts are not measurements.","multi":false},{"id":"196zsez","q":"A candidate has completed content study. What is the correct NEXT step?","a":"Take the readiness assessment under exam conditions and act on its domain-level results","why":"Content completion is not readiness. The assessment measures actual performance and directs the final repair phase before booking.","multi":false},{"id":"1yqemum","q":"Which statement about interpreting readiness results is TRUE?","a":"Domain-level breakdown weighted by official percentages is the decision-relevant view","why":"A 78% with a 50% in Security Operations is a failing profile. Domain balance under official weights — not the average — predicts exam outcome.","multi":false},{"id":"1ufy5l3","q":"In the days immediately before the real exam, what does the course-style approach recommend?","a":"Taper study, rest, and confirm logistics","why":"Tapering into the exam keeps you sharp. Last-minute new content creates confusion, and exhaustion destroys recall you already have.","multi":false},{"id":"18uyvg8","q":"Which of these is a legitimate reason to DELAY scheduling your exam after a readiness assessment?","a":"Consistent sub-threshold or highly uneven domain scores that targeted restudy can still fix","why":"Delay for a fixable performance gap; never delay over logistics you can plan around. The assessment tells you which case you are in.","multi":false},{"id":"11sxvsx","q":"A candidate has completed all course content and takes the readiness assessment open-book over three evenings, scoring 90%. Which statement BEST evaluates this result?","a":"Unreliable — the conditions inflated the score; a timed, closed-book single sitting is needed before any booking decision","why":"The assessment only predicts exam performance when taken under exam conditions. Open-book multi-sitting results systematically overstate readiness.","multi":false},{"id":"1tit2ob","q":"Which of the following domain-to-weight mappings match the official SY0-701 objectives? (Select THREE.)","a":"General Security Concepts — 12%;  Threats, Vulnerabilities, and Mitigations — 22%;  Security Operations — 28%","why":"Official weights: 12 / 22 / 18 / 28 / 20. Security Architecture is 18% (not 30%), and Program Management is 20% (not 5%).","multi":true},{"id":"42jw76","q":"An assessment reports: Total 81%, Security Operations 60%, Threats/Vulns 88%, Architecture 85%, Program Management 90%, General Concepts 90%. What is the BEST course of action?","a":"Delay and restudy Security Operations; the weakest domain is also the largest at 28%, making this a failing profile despite the strong total","why":"A 21-point hole in the 28% domain predicts roughly 6 lost exam percentage points from that domain alone. Domain balance beats the average; repair first.","multi":false},{"id":"jjryt3","q":"Which facts about the real SY0-701 exam are correct? (Select TWO.)","a":"Maximum appointment length of 90 minutes;  Passing scaled score of 750 on a 100-900 scale","why":"90 minutes, multiple-choice and multiple-response only, 750/900 to pass, closed book. Recognition-based — you never type answers.","multi":true},{"id":"18b8jll","q":"A student has taken three full timed practice exams: 84%, 86%, 85%, with all domain scores at 80% or better. What should they do?","a":"Schedule the exam — the consistent trend across balanced domains meets the readiness bar","why":"Consistency at ~85%+ with balanced domains across multiple timed attempts IS the readiness signal. Additional months of study risk forgetting early material.","multi":false},{"id":"1hdvo8y","q":"Why does the course warn against study timelines longer than about 90 days?","a":"Retention decay — early domains fade before test day; ~40 concentrated hours in 30-60 days is more effective","why":"Memory decays. Spacing the same ~40 hours over 6-12 months means relearning the early sections by the end. Concentration beats duration.","multi":false},{"id":"mqc8hx","q":"Which items are legitimate exam-day logistics to verify BEFORE scheduling? (Select THREE.)","a":"Government ID requirements and arrival-time rules (or online-proctoring room and ID checks);  Current CompTIA retake policy and waiting period;  Exam format and time limit (multiple-choice/multiple-response, up to 90 minutes)","why":"ID, timing, format, and retake terms are knowable and remove test-day stress. Workstation specifics and proctor identity are not confirmable or needed.","multi":true},{"id":"1ybexjb","q":"A candidate asks whether rewatching lectures is a substitute for the readiness assessment. The best answer is:","a":"No — only a measured, closed-book attempt reveals actual performance gaps; review then targets what the assessment flags","why":"Passive review feels productive and measures nothing. The assessment converts study time into a prioritized repair list.","multi":false},{"id":"1jtsuu9","q":"Which statement about readiness thresholds is TRUE?","a":"The ~85% figure is a commonly used comfort heuristic based on consistent timed practice — CompTIA publishes no official readiness score","why":"85% is community/course practice wisdom, not a CompTIA standard. What matters is consistent, balanced performance under honest conditions.","multi":false},{"id":"2loa5m","q":"A candidate consistently scores 88% on full timed exams but only using questions from the course they studied. What is the most important additional validation?","a":"Take practice questions from a DIFFERENT source to test transfer against novel wording;  Verify domain balance across attempts","why":"Same-source high scores may reflect familiarity. Different sources test true concept transfer; domain balance confirms no hidden weakness.","multi":true},{"id":"165uf17","q":"Which is a VALID reason to delay an already-booked exam?","a":"Practice scores under honest conditions have collapsed far below the readiness bar and restudy can fix it","why":"Reschedule for a measured performance collapse with a credible repair path. Weather and lobby size are logistics; finishing early is not a problem.","multi":false},{"id":"1sb2xxm","q":"In the final 48 hours before the exam, which activities are recommended? (Select TWO.)","a":"Light review of condensed notes and flagged weak points;  Rest, sleep, and logistics confirmation (ID, route, arrival time)","why":"Taper means consolidation and rest, not new content or exhaustion. You are protecting stored knowledge, not building it.","multi":true},{"id":"1fnkris","q":"What does the readiness assessment contribute that a full-length practice exam cannot?","a":"A quick, targeted diagnostic that pinpoints weak domains early enough to repair them","why":"The assessment is the fast diagnostic; full exams measure stamina and validate. They are complementary tools used in sequence.","multi":false},{"id":"3w0lxm","q":"Which interpretation of \"balanced domain performance\" is correct?","a":"No domain — especially high-weight ones — scoring dramatically below your overall average","why":"Balance means no domain falls dramatically behind, with extra scrutiny on the 28% and 22% domains. Equal raw percentages are neither achievable nor required.","multi":false},{"id":"hidhlh","q":"A working parent can study 45 minutes per day. Applying the course guidance, what is their realistic plan?","a":"Certification in about 60 days with consistent daily study (~40 total hours), keeping the timeline concentrated","why":"At 30-60 minutes/day, the 60-day plan fits (~40 hours total). Concentration matters: consistent daily beats sporadic marathon sessions.","multi":false},{"id":"14wq9v0","q":"Which is the WORST reason to schedule your exam immediately after content study, before any assessment?","a":"Confidence without measurement is unreliable; untested domains can hide failure-level gaps","why":"Feeling ready and being measurably ready are different. The assessment exists precisely because confidence cannot detect blind spots.","multi":false}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
</div>
<script id="back-lib-script">
(function () {
  if (window.__backBtnInit) return; window.__backBtnInit = true;
  function lib() { return "../library.html"; }
  function resultVisible() {
    var rs = document.getElementById('result-screen');
    if (rs && !rs.classList.contains('hidden') && rs.offsetParent !== null) return true;
    var big = document.querySelector('.score-big');
    if (big) {
      var el = big;
      while (el && el !== document.body) {
        if (el.classList && el.classList.contains('hidden')) return false;
        el = el.parentElement;
      }
      return big.offsetParent !== null;
    }
    return false;
  }
  function ensure() {
    if (!resultVisible() || document.getElementById('back-lib-btn')) return;
    var a = document.createElement('a');
    a.id = 'back-lib-btn';
    a.href = lib();
    a.textContent = '\u2190 Back to Library';
    a.setAttribute('style', 'position:fixed;left:18px;bottom:18px;z-index:9999;' +
      'padding:11px 20px;border-radius:999px;font:600 14px/1 "Segoe UI",system-ui,sans-serif;' +
      'text-decoration:none;color:#fff;background:linear-gradient(135deg,#f0883e,#e36414);' +
      'box-shadow:0 4px 18px rgba(240,136,62,.45);border:1px solid rgba(255,255,255,.25);');
    document.body.appendChild(a);
  }
  setInterval(ensure, 400);
  if (document.readyState !== 'loading') ensure();
  else document.addEventListener('DOMContentLoaded', ensure);
})();
</script>
