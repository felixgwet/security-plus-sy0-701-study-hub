  <script>
    var DECKS = [{"label":"Section 14 · Security Architecture","cards":[{"id":"1c90rpp","q":"A finance firm wants to run its own OS, middleware and applications in the cloud while leaving physical hardware, power and the hypervisor to the provider. Which model and responsibility split fits?","a":"IaaS — provider manages infrastructure only; the customer manages the OS and everything above it","why":"IaaS gives the customer control from the OS upward while the provider owns hardware, network, power and virtualization layers. SaaS would hand over the application too; serverless abstracts even the runtime.","multi":false},{"id":"m56903","q":"An analyst warns that a legacy application in the cloud cannot receive a security patch because the patch is incompatible with the app's old version. This cloud consideration is known as:","a":"Inability to patch","why":"Patch availability = the provider regularly ships patches the customer receives automatically. Inability to patch = the customer cannot apply them, typically due to compatibility or lack of control — exactly this scenario.","multi":false},{"id":"h0it3x","q":"During a cloud VM's live migration from Host A to Host B, an attacker on the network captures the VM's memory as it crosses the wire unencrypted. Which virtualization vulnerability is being exploited?","a":"Live migration interception — an adversary-in-the-middle attack","why":"Live migration moves a running VM host-to-host over the network; an attacker positioned between the hosts captures unencrypted migration traffic (adversary-in-the-middle). VM escape instead means breaking out of a VM to the hypervisor.","multi":false},{"id":"9o0lma","q":"A Type 1 hypervisor outperforms a Type 2 hypervisor primarily because it:","a":"Runs directly on the hardware without spending resources on a host desktop OS first","why":"Type 1 (bare-metal: ESXi, Hyper-V, XenServer) acts as a streamlined, specialized OS on the hardware itself. Type 2 (VirtualBox, Workstation) runs inside a full host OS, which consumes resources first.","multi":false},{"id":"x5d14c","q":"A DevOps team wants application code that provisions identical servers every run regardless of the starting state, eliminating one-off configurations. Which concept and practice deliver this?","a":"IaC with idempotent scripts","why":"Infrastructure as Code provisions through machine-readable files, and idempotence guarantees the same result on every execution — killing 'snowflake' systems.","multi":false},{"id":"yepl2n","q":"In an SDN, a centralized controller dictates traffic flow for the entire network. Which plane does the controller represent?","a":"Control plane — the brain that decides where traffic is sent","why":"The control plane is the network's brain and is centralized in SDN. The data (forwarding) plane merely moves packets; the application plane hosts apps that instruct the controller.","multi":false},{"id":"145uo73","q":"A company segments its smart thermostats, cameras and voice assistants onto a dedicated network away from servers and workstations. This practice addresses which dominant IoT risk set?","a":"Weak default credentials and poorly configured network services","why":"IoT devices ship with guessable defaults and exposed services (open ports, unencrypted comms). Isolating them on a separate network contains compromise — the course's top IoT recommendation.","multi":false},{"id":"10vi55f","q":"A pacemaker runs software that must respond within strict, predictable timing windows with no buffering delays. What kind of operating system does it use?","a":"A real-time operating system (RTOS)","why":"RTOS executes processes in a timely, predictable manner without buffer delays — essential for medical devices, flight navigation and data transfer systems.","multi":false},{"id":"gfl46i","q":"An e-commerce platform is being redesigned. Which architecture lets the team scale the payment service independently during sales, deploy updates to it alone, and survive its failure without taking down the storefront?","a":"Microservices architecture","why":"Microservices = small autonomous services scaled and deployed independently with isolation — one failing service doesn't sink the system. A monolith scales and fails as one unit.","multi":false},{"id":"14tfedj","q":"A hospital isolates its classified research network by removing every direct and indirect connection, including Wi-Fi and Bluetooth adapters. Which statement is MOST accurate?","a":"This air gap is the strongest protection available, though attacks like Stuxnet proved it is not infallible","why":"Physical separation (air gap) is the most secure method when strict physical security accompanies it — but Stuxnet demonstrated air-gapped systems can still be breached. Immunity claims are wrong; VLANs are logical, not physical.","multi":false},{"id":"17nx1zu","q":"A multi-tenant cloud customer deletes files, but investigators later recover residual data from the storage layer. Which cloud security weakness is this, and what is the primary fix?","a":"Data remnants — use secure deletion methods that overwrite the data and verify removal","why":"Data remnants = recoverable residue left by deletion processes. Fix with secure deletion that overwrites, secure backup management, and verification that data is truly gone.","multi":false},{"id":"7us8nr","q":"A startup runs short event-triggered code snippets that execute only when needed, with no server management and no charges while idle — but worries its provider's proprietary APIs will make future migration painful. Which pairing is correct?","a":"Serverless/FaaS — and the migration pain is vendor lock-in","why":"Event-triggered functions that run on demand with pay-per-use pricing = serverless (Function as a Service, e.g. AWS Lambda). Its flagship risk is vendor lock-in from proprietary interfaces.","multi":false},{"id":"4mcc84","q":"Which of the following are virtualization-specific vulnerabilities covered in this section? (Choose THREE.)","a":"VM escape;  Privilege elevation on the hypervisor;  Live migration interception","why":"The virtualization vulnerability set: VM escape, privilege elevation (catastrophic on the hypervisor), live VM migration interception, resource reuse and VM sprawl. Phishing and shoulder surfing are social-engineering attacks, not virtualization flaws.","multi":true},{"id":"1cuqjyb","q":"A cloud security review flags weaknesses on a customer account. Which three are among the eight classic cloud security issues? (Choose THREE.)","a":"Shared physical server vulnerabilities;  Single point of failure;  Data remnants","why":"The eight: shared physical server vulnerabilities, inadequate virtual environment security, user access management, lack of up-to-date security measures, single point of failure, weak authentication/encryption, unclear policies, and data remnants. Air gapping and idempotence are unrelated concepts.","multi":true},{"id":"13dk39e","q":"Which controls help secure virtual machines? (Choose THREE.)","a":"Keep the hypervisor patched with vendor security updates;  Encrypt the files that host the VMs;  Minimize connections between VMs and shared resources to preserve isolation","why":"VM security mirrors physical server security: patch OS/apps/hypervisor, AV + software firewall per VM, strong passwords, minimize inter-VM/shared-resource connections and remove unneeded features, and encrypt VM files. Sprawl and feature bloat increase attack surface.","multi":true},{"id":"1umriux","q":"Embedded-system security strategies discussed in the course include which of the following? (Choose THREE.)","a":"Network segmentation;  Wrappers such as IPsec for data in transit;  Firmware code control with secure boot and cryptographic signatures","why":"The four embedded strategies: network segmentation, wrappers (IPsec so interceptors see only entry/exit points), firmware code control (secure boot, signatures), and dealing with the inability to patch (e.g. over-the-air updates). Physical patch visits and sensor-disabling are not course strategies.","multi":true},{"id":"xp3wnw","q":"What does the term 'security architecture' refer to?","a":"The design, structure and behavior of an organization's information security environment","why":"Security architecture = the design, structure and behavior of the security environment, encompassing hardware, software, processes and people.","multi":false},{"id":"10zj47b","q":"Which two exam objectives does the Security Architecture section map to?","a":"3.1 and 4.1","why":"OBJ 3.1 = compare/contrast security implications of architecture models; OBJ 4.1 = apply common security techniques to computing resources.","multi":false},{"id":"lxd8qe","q":"In an IaaS responsibility matrix, which component does the CUSTOMER manage?","a":"The operating system and everything above it (middleware, runtime, data, applications)","why":"In IaaS the provider manages the infrastructure only; the customer handles the OS, middleware, runtime, data and applications.","multi":false},{"id":"1bn0amo","q":"A healthcare org hosts patient records on-premise for HIPAA control but uses the cloud for email and data analysis. This is an example of:","a":"A hybrid solution","why":"Hybrid = on-premise + private cloud + public cloud combined, moving workloads by sensitivity and need.","multi":false},{"id":"1krwjbr","q":"Which of these is NOT one of the key considerations when choosing between cloud and on-premise?","a":"Stock price of the provider","why":"The course's consideration list: availability, resilience, cost, responsiveness, scalability, ease of deployment, risk transference, ease of recovery, patch availability, inability to patch, power, compute.","multi":false},{"id":"ixeqg8","q":"A company moves its CRM to a SaaS vendor. Which risk statement is most accurate?","a":"Some risk transfers to the provider, but the customer is still responsible for securing their own data, user access and configurations","why":"Risk transference is partial — the provider takes infrastructure/maintenance risk; the customer keeps responsibility for its data and access security.","multi":false},{"id":"1kjbvro","q":"Availability and resilience are related but distinct. Which pairing is correct?","a":"Availability = be accessible when needed; resilience = recover from failures and continue functioning","why":"Availability = accessible when needed (SLA/uptime); resilience = recover from failure and keep functioning.","multi":false},{"id":"64go16","q":"In a multi-tenant cloud, one tenant's compromised data could affect others on the same physical server. This cloud weakness is called:","a":"Shared physical server vulnerabilities","why":"Shared physical server vulnerability — mitigated with hypervisor protection and secure multi-tenancy isolation.","multi":false},{"id":"1v8aosf","q":"Residual data that remains recoverable after a deletion process is known as:","a":"A data remnant","why":"Data remnants = residual data left after deletion; can be recovered by attackers. Fix: secure deletion that overwrites, secure backup handling, verify removal.","multi":false},{"id":"y9fg6","q":"Which set of controls best addresses inadequate user access management in the cloud?","a":"Strong password policy, MFA, least-privilege permissions, user activity monitoring","why":"Access management failures come from weak passwords and excessive permissions; counter with strong auth, MFA, least privilege and monitoring.","multi":false},{"id":"1nwr66k","q":"To reduce lateral movement between cloud VMs, the course recommends:","a":"Network segmentation to isolate VMs from each other","why":"Network segmentation isolates VMs, reducing an attacker's ability to move laterally after compromising one.","multi":false},{"id":"ph7xal","q":"Which is a Type 1 (bare-metal) hypervisor?","a":"VMware ESXi","why":"ESXi, Hyper-V and XenServer run directly on hardware (Type 1). VirtualBox/Workstation run inside a host OS (Type 2).","multi":false},{"id":"k4w6r3","q":"Why is a Type 1 hypervisor generally faster than a Type 2?","a":"It does not spend host resources running a full desktop OS first — it acts as a streamlined, specialized OS","why":"Bare-metal hypervisors allocate physical resources directly instead of through a host operating system.","multi":false},{"id":"hy8s4d","q":"Containers differ from VMs because containers:","a":"Share the host's OS kernel while isolating the application and its dependencies","why":"Containers = isolated user spaces sharing one OS kernel; each includes the app + dependencies. That's why they're lightweight.","multi":false},{"id":"15grxpo","q":"An attacker who breaks out of an isolated VM to interact directly with the hypervisor has performed:","a":"VM escape","why":"VM escape = breaking out of the VM to reach the hypervisor, from where other VMs on the same host can be attacked. Very difficult, but a real concern.","multi":false},{"id":"1nuhkms","q":"To mitigate VM escape risk, the course recommends hosting VMs on the same physical server based on:","a":"Network segment and classification (like-with-like)","why":"Group VMs of the same classification/segment together so an escape only reaches equally-classified systems.","multi":false},{"id":"jxsfrn","q":"During a live VM migration between two physical hosts, an attacker positioned between the hosts can capture unencrypted VM data. This is a:","a":"Adversary-in-the-middle attack","why":"Live migration traffic crosses the network; an adversary-in-the-middle between the two hosts can capture it if unencrypted.","multi":false},{"id":"12ay0ab","q":"Memory assigned to a new cloud customer still contains the previous tenant's data because it was never cleared. This is a:","a":"Resource reuse vulnerability","why":"Resource reuse = resources not cleared/reset before reassignment, leaking prior-task data — especially dangerous in multi-tenant clouds.","multi":false},{"id":"1bf5pj2","q":"VM sprawl is best described as:","a":"VMs created and deployed without proper oversight, becoming unpatched and untracked","why":"Sprawl = loss of oversight over VMs; they go unpatched and forgotten. Track, patch, and encrypt VM files.","multi":false},{"id":"1u68rhz","q":"Serverless computing means:","a":"The provider dynamically manages server allocation and provisioning while developers focus on writing code","why":"'Serverless' is a misnomer — servers exist, but the provider manages them; developers deploy individual functions.","multi":false},{"id":"1o3zks9","q":"Serverless architectures operate on which model?","a":"Function as a Service (FaaS)","why":"FaaS: developers write functions triggered by events that run only when needed (AWS Lambda, Google Cloud Functions).","multi":false},{"id":"y1fv5v","q":"What is the most significant risk of serverless computing highlighted in the course?","a":"Vendor lock-in from proprietary provider interfaces","why":"Vendor lock-in makes switching providers or going multi-provider hard; best practices are also still maturing.","multi":false},{"id":"1kxpg0m","q":"Which is a key cost benefit of serverless?","a":"You only pay for the computing time you consume — no charge when code is not running","why":"Pay-per-execution pricing: idle code costs nothing, and scaling is automatic and precise with workload.","multi":false},{"id":"rkw84c","q":"Microservices are best described as:","a":"An application structured as a collection of small autonomous services, each performing a specific business function","why":"Microservice architecture breaks a large app into small, independent, self-contained services communicating over lightweight mechanisms.","multi":false},{"id":"fdaan8","q":"Compared with a monolithic architecture, a microservices architecture gives which resilience benefit?","a":"If one service fails, it does not affect the entire system","why":"Service isolation means a single failure doesn't take down the whole system — unlike a monolith, where components are interdependent.","multi":false},{"id":"1qoatar","q":"Which of these is a CHALLENGE of microservices, not a benefit?","a":"Data consistency across services that each have their own database","why":"Challenges: complexity, data management/consistency, network latency, and a larger attack surface (security).","multi":false},{"id":"18ilc6e","q":"Physically disconnecting a system from all other networks — including Wi-Fi and Bluetooth — is called:","a":"Air gapping","why":"Air gap = physical separation; no direct or indirect connections. The strongest isolation if strict physical security is maintained.","multi":false},{"id":"wzwu7j","q":"Which attack famously demonstrated that air-gapped systems can still be compromised?","a":"Stuxnet","why":"Stuxnet crossed an air gap into Iranian nuclear facility systems, proving physical separation is not infallible.","multi":false},{"id":"16ufsrx","q":"HR and Marketing share one physical network, but HR traffic cannot reach Marketing devices. This logical separation is achieved with:","a":"VLANs (with firewall/policy rules)","why":"VLANs segregate traffic on shared physical infrastructure per department — logical separation via rules and policies.","multi":false},{"id":"mg67mc","q":"Which statement correctly compares physical vs logical separation?","a":"Physical (air gap) is the most secure but less flexible; logical is easier to implement and more flexible but not as secure if misconfigured","why":"Air gap = strongest isolation, inflexible; VLANs/firewalls = flexible and easy, but misconfiguration can open holes.","multi":false},{"id":"ok0t2","q":"In SDN, the plane that MOVES data packets from place to place is the:","a":"Data (forwarding) plane","why":"The data/forwarding plane handles the actual sending and receiving of packets through switches and routers.","multi":false},{"id":"19bu0b2","q":"The 'brain' of an SDN that makes decisions about where traffic is sent is the:","a":"Control plane — centralized in SDN, unlike traditional networks where each router has its own","why":"The control plane decides traffic flow. In SDN it is centralized: one controller dictates flow across the entire network.","multi":false},{"id":"bbasda","q":"In SDN, network applications that instruct the controller reside in the:","a":"Application plane","why":"The application plane houses apps that tell the controller what to do; the controller then manipulates the network.","multi":false},{"id":"1ccip1f","q":"Infrastructure as Code means:","a":"Managing and provisioning IT infrastructure through machine-readable definition files rather than manual configuration","why":"IaC defines servers, storage and networks in code files (YAML, JSON, HCL) that can be versioned, tested and audited.","multi":false},{"id":"1cv3avb","q":"A script that produces an identical infrastructure every time it runs, regardless of the starting state, demonstrates:","a":"Idempotence","why":"Idempotence = the operation produces the same results no matter how many times it executes. Core IaC concept.","multi":false},{"id":"1bqyvb5","q":"The main goal of IaC is to eliminate:","a":"Snowflake systems — one-off, inconsistent configurations that introduce risk","why":"Snowflakes = unique, inconsistent builds. IaC makes every environment identical, repeatable and auditable.","multi":false},{"id":"9nyixm","q":"Which is listed as a challenge/ risk of IaC?","a":"Sensitive data exposed in code files or insecure configurations introduced","why":"Challenges: learning curve, growing complexity, and security risks (secrets in files, insecure configs). Auditability and consistency are benefits.","multi":false},{"id":"12s82bx","q":"The biggest risk unique to a centralized architecture is:","a":"A single point of failure — if the central server fails or is compromised, everything is at risk","why":"Centralized = one authority: great control and consistency, but one failure or compromise affects the entire network.","multi":false},{"id":"1sc0nmf","q":"Decentralized architectures are valued chiefly for:","a":"Resiliency (a node failure doesn't stop the system), scalability and flexibility for distributed teams","why":"Decentralized benefits: resiliency, easy scaling by adding nodes, and flexibility. Their weaknesses: security exposure per node, management complexity, data inconsistency.","multi":false},{"id":"j4sabr","q":"An organization prioritizing data accuracy and tight resource control would most likely choose:","a":"A centralized architecture","why":"Centralized systems give control, single-source consistency and cost-effective maintenance — at the cost of a single point of failure.","multi":false},{"id":"1abfa6x","q":"In an IoT ecosystem, the component that acts as the central connection point, collecting and processing data from devices and sending commands back, is the:","a":"Hub / control system","why":"The hub (Amazon Echo, Google Home, or an app) connects all IoT devices and orchestrates them.","multi":false},{"id":"eqk2t3","q":"The 'eyes and ears' of the IoT that detect environmental changes and convert them into data are:","a":"Sensors","why":"Sensors measure temperature, motion, pressure, light etc. and feed the ecosystem.","multi":false},{"id":"69opm","q":"The most common IoT security risks called out in the course are:","a":"Weak default credentials and poorly configured network services (open ports, unencrypted communication, unnecessary services)","why":"Defaults like admin/admin and exposed services make IoT an easy entry point — hence the recommendation to isolate IoT on a separate network.","multi":false},{"id":"1yepp1r","q":"The single most recommended network practice for IoT devices is:","a":"Keep them on a separate network/segment","why":"Segregating IoT devices contains the damage when (not if) one is compromised.","multi":false},{"id":"arwxa1","q":"An embedded system is:","a":"A dedicated computer designed for one or two specific functions inside a larger device","why":"Embedded systems are single-purpose: engine control, ABS, airbags, pacemakers, insulin pumps, microwaves, industrial robots.","multi":false},{"id":"19z825o","q":"A real-time operating system (RTOS) is critical for embedded systems because it:","a":"Executes processes in a timely, predictable manner without buffer delays — essential for flight navigation and medical equipment","why":"RTOS guarantees predictable, buffer-free timing — life-critical in navigation and medical gear.","multi":false},{"id":"olxsu6","q":"Using IPsec to protect data moving between secure networks across an untrusted one, so interceptors only see the wrapper's entry and exit points, is an example of:","a":"A wrapper","why":"Wrappers (e.g. IPsec) tunnel/encapsulate embedded-system data so attackers only see the wrapper header showing network entry and exit points.","multi":false},{"id":"u4gujs","q":"Why are embedded systems hard to patch?","a":"Downtime is unacceptable, devices may be physically unreachable, and many were never designed with update mechanisms","why":"Long lifespans + no update design = outdated, vulnerable systems. Over-the-air updates help but need careful security planning.","multi":false},{"id":"kct9k3","q":"Secure boot mechanisms and cryptographic signatures on embedded devices support which security strategy?","a":"Firmware code control — ensuring only authorized, verified firmware runs","why":"Firmware code control = secure coding, reviews, automated testing, secure boot and signatures so only verified firmware executes.","multi":false},{"id":"17ok7i7","q":"Which cloud computing trait lets an e-commerce site add capacity automatically during a flash sale and release it afterward?","a":"Responsiveness and scalability — resources adapt quickly to demand changes","why":"Responsiveness = speed of adapting to demand change; scalability = handling increased workloads. Together they describe cloud elasticity — the flash-sale scenario.","multi":false},{"id":"he5mt5","q":"Why is privilege elevation especially dangerous in a virtualized environment?","a":"Elevation on the hypervisor can grant the attacker reach into every guest OS the hypervisor hosts","why":"A hypervisor compromise is catastrophic: the VMware flaw cited in the course let a user escalate into ANY guest OS on that hypervisor. Defense: stay current on hotfixes and service packs.","multi":false},{"id":"1wxx3is","q":"Containers share which component with each other and the host?","a":"The host OS kernel — which is why one kernel exploit endangers every container on it","why":"Containers isolate apps in user spaces but share the host kernel (plus usually binaries/libraries). That shared kernel is the container-specific risk: exploit it and all hosted apps are exposed.","multi":false},{"id":"1itc6kt","q":"Which is NOT one of the benefits of microservices listed in the course?","a":"Guaranteed elimination of all security risks","why":"Microservices benefits: scalability, flexibility, resilience, faster deployment. Security is actually a CHALLENGE — many networked services mean a bigger attack surface.","multi":false},{"id":"1u7mhd3","q":"A firewall screen subnet holding external-facing servers, logically separated from the internal network, is an example of:","a":"Logical separation","why":"A screen/DMZ-style subnet created by firewall rules = logical separation. It stops an attacker who breaches the exposed services from easily reaching the internal network.","multi":false},{"id":"1jmzj83","q":"Idempotence in Infrastructure as Code guarantees that:","a":"The operation produces the same result no matter how many times it is executed","why":"Idempotent scripts build identical infrastructure every run regardless of initial state — the consistency engine behind IaC.","multi":false},{"id":"1ruhdqu","q":"A distributed team spread across continents keeps working when one office's node fails, but struggles to keep records synchronized across nodes. This describes which architecture and trade-off?","a":"Decentralized — resilient and flexible, but prone to data inconsistency","why":"Decentralized = no single point of control, survives node failures, supports distributed teams — at the cost of management complexity and data inconsistency/synchronization problems.","multi":false},{"id":"1lhwupl","q":"In the cloud responsibility matrix, which task ALWAYS remains the customer's regardless of model?","a":"Securing their own data and user access","why":"Cloud security is a shared responsibility: the provider secures the underlying structure, but customers always own their data security, access management and configurations.","multi":false},{"id":"1a231r3","q":"Which list correctly names the three SDN planes?","a":"Data, control, application","why":"SDN separates the data (forwarding) plane, control plane (centralized brain) and application plane (apps that instruct the controller).","multi":false},{"id":"1nt60l7","q":"A smart factory's ICS network is kept physically disconnected from the corporate LAN and the internet to prevent attacks that could cause real-world damage. The security property being maximized is:","a":"Physical isolation (air gap) of critical infrastructure","why":"Critical infrastructure ICS networks are air-gapped so cyber attacks can't cascade into physical damage — the classic physical-separation use case.","multi":false},{"id":"13m5ipc","q":"A company suffers an outage because its single cloud region held its only copy of a critical service. Which of the eight classic cloud security issues does this illustrate?","a":"Single point of failure — fixed with redundancy and failover across multiple servers, data centers or providers","why":"Relying on one resource/process that can take everything down = single point of failure. Fix: redundant systems across providers/data centers plus tested failover.","multi":false},{"id":"1lftoai","q":"Which strategy lets an embedded device receive security patches remotely despite being physically unreachable — while warning that the process itself needs strong safeguards?","a":"Over-the-air updates","why":"Over-the-air updates deliver and install patches remotely, solving the inability-to-patch problem for unreachable devices — but require careful planning so the update channel doesn't introduce new vulnerabilities.","multi":false},{"id":"1jmz18v","q":"Which items belong on the course's key-considerations list for cloud vs on-premise decisions? (Choose THREE.)","a":"Ease of deployment;  Risk transference;  Inability to patch","why":"The consideration set: availability, resilience, cost, responsiveness, scalability, ease of deployment, risk transference, ease of recovery, patch availability, inability to patch, power, compute.","multi":true},{"id":"1rrl7w7","q":"Which are benefits of centralized architectures? (Choose THREE.)","a":"Efficiency and control over resources;  Data consistency from a single store;  Lower maintenance cost — only one system to maintain","why":"Centralized benefits: control/efficiency, consistency, cost-effectiveness. The single point of failure and scalability ceiling are its risks — the last two options describe decentralized strengths.","multi":true},{"id":"hbzbrs","q":"Which statements about containers vs virtual machines are true? (Choose THREE.)","a":"Containers are a lightweight alternative to full machine virtualization;  Containers share the host OS kernel;  Popular container technologies include Docker and Kubernetes","why":"Containers package app + dependencies in isolated user spaces sharing one kernel — lighter than VMs. Docker/Kubernetes/OpenShift are the named technologies. Full guest OS per container describes VMs, not containers.","multi":true},{"id":"12ks4is","q":"Which two are named risks or challenges of serverless computing? (Choose TWO.)","a":"Vendor lock-in;  Immaturity of best practices","why":"Serverless risks: vendor lock-in (proprietary interfaces) and immature best practices. The other options are backwards — serverless removes server management, charges nothing when idle, and scales automatically.","multi":true},{"id":"he7irl","q":"Scenario: A SaaS contract states the vendor 'manages all layers of the stack.' Six months later a tenant's data is breached due to the tenant's own misconfigured sharing settings. Who bears responsibility for this breach, and why?","a":"The tenant — cloud security is shared; the responsibility matrix always leaves the customer accountable for securing their own data and access configurations, regardless of how much the provider manages","why":"No model transfers data-security accountability. Even 'fully managed' SaaS leaves the customer responsible for how they configure access and share their own data. This is the single most-tested cloud concept on SY0-701.","multi":false},{"id":"1y8qrqx","q":"An auditor finds that a VM's virtual disk still contains blocks of a former tenant's database after the VM was reprovisioned. Which vulnerability is this, and which cloud property makes it especially likely?","a":"A resource reuse vulnerability — enabled by the multi-tenant nature of cloud computing where physical resources are shared","why":"Resource reuse = resources not cleared before reassignment. It's 'particularly relevant in multi-tenant environments like cloud computing where resources are shared among multiple users.' (Data remnants is about deletion residue; this scenario is reassignment without sanitization.)","multi":false},{"id":"hrd586","q":"A security engineer must place a new card-processing VM. The host also runs a public file-sharing VM and a domain-controller VM. Per the course's VM-escape mitigation guidance, the LEAST acceptable arrangement is:","a":"Co-locating it with the public file-sharing VM — an escape from that low-trust guest could expose cardholder data","why":"The guidance: host VMs with like classification together so an escape only reaches equal-trust systems. Co-locating high-value card data beside a public-facing, higher-risk guest maximizes blast radius. Option 1 is the correct practice; options 3/4 are both bad but 3 is the least acceptable (internet-exposed neighbor).","multi":false},{"id":"ho1dl0","q":"Which statement BEST captures the architectural difference between Type 1 and Type 2 hypervisors in security terms?","a":"Type 1 presents a smaller, specialized attack surface running directly on hardware, while Type 2 inherits the entire host OS's attack surface on top of its own","why":"Type 1 runs a streamlined, specialized OS directly on hardware (smaller surface, better performance). Type 2 sits inside a full consumer OS — every host OS weakness becomes part of the hypervisor's risk profile.","multi":false},{"id":"ekzwbe","q":"A DevSecOps lead rejects a colleague's plan to keep infrastructure configuration 'as wiki documentation plus manual steps.' Her primary architectural objection should be:","a":"Manual builds produce snowflake systems — inconsistent, unauditable, unrepeatable configurations that introduce risk; code-defined infrastructure is versioned, testable and idempotent","why":"Eliminating snowflakes is the stated main goal of IaC: identical, versioned, auditable environments every time — the opposite of manual one-off builds.","multi":false},{"id":"1j7yahn","q":"An organization wants one network where a compromised IoT camera can never reach HR databases, but where the cameras and HR PCs can both reach the internet through shared switches. Which design satisfies this MOST flexibly?","a":"Logical separation with VLANs and firewall policies on shared physical infrastructure","why":"VLANs + policies give per-segment boundaries on shared hardware — cameras can't reach HR, both reach the internet, no duplicate hardware. Physical separation would be more secure but is inflexible and costly; a flat network offers no isolation.","multi":false},{"id":"1tqqnlf","q":"In SDN, an application that dynamically reroutes traffic around congestion is instructing the network through which path?","a":"Application plane → controller (control plane) → programmable flow rules → data plane forwarding devices","why":"SDN's separation of concerns: applications in the application plane express intent to the centralized control plane, which programs the data plane's forwarding behavior. Direct per-device programming is the old model SDN replaces.","multi":false},{"id":"13wqhqb","q":"Which pairing of IoT component and role is WRONG?","a":"Smart devices — dumb terminals with no computing capability","why":"Smart devices are everyday objects ENHANCED with computing capability and connectivity — they sense, process and act without human intervention. 'No computing capability' contradicts the definition.","multi":false},{"id":"1610ptq","q":"A power plant's embedded controllers run firmware the vendor signs cryptographically, and the devices boot only verified code. This primarily defends against:","a":"Unauthorized or malicious firmware executing on the device","why":"Secure boot + cryptographic signatures = firmware code control: only authorized, verified firmware runs. It does nothing for heat, latency or backup residue.","multi":false},{"id":"uu4upn","q":"Which scenario BEST justifies choosing a decentralized architecture despite its drawbacks?","a":"A global organization needing to keep operating when any single office fails, with teams joining and leaving the network constantly","why":"Decentralized wins on resiliency, scale-by-adding-nodes, and flexibility for distributed teams. The bank/archive scenarios favor centralized consistency/control; cheapest single-system maintenance is also a centralized strength.","multi":false},{"id":"1u51a8m","q":"A company adopts serverless functions for image resizing. Which risk should its security plan address FIRST, given the architecture?","a":"Vendor lock-in — the functions are built on proprietary provider triggers and APIs that complicate migration","why":"Serverless removes OS patching, idle cost, and server provisioning from the customer's plate. What remains (and the course's lead serverless risk) is vendor lock-in via proprietary interfaces.","multi":false},{"id":"1u3agou","q":"Which is the BEST answer for protecting data transiting between two secure embedded networks across an untrusted network, per the course?","a":"Use a wrapper such as IPsec so interceptors see only the wrapper header showing where data enters and exits the network","why":"Wrappers (IPsec) encapsulate embedded-system data for travel across untrusted networks; the interceptor sees only wrapper entry/exit points. Cleartext and compression are not protection; manual couriers don't scale.","multi":false},{"id":"yhpu46","q":"Which items appear on the course's list of key considerations when evaluating cloud versus on-premise? (Choose FOUR.)","a":"Availability;  Ease of recovery;  Power and compute;  Responsiveness","why":"The twelve considerations: availability, resilience, cost, responsiveness, scalability, ease of deployment, risk transference, ease of recovery, patch availability, inability to patch, power, compute.","multi":true},{"id":"vtute6","q":"An attacker is chaining virtualization weaknesses against a cloud tenant. Which three attacks belong to the virtualization vulnerability family? (Choose THREE.)","a":"Escaping a guest OS to reach the hypervisor;  Intercepting unencrypted traffic between hosts during a live migration;  Reading a previous tenant's data from memory that was never cleared","why":"VM escape, live-migration interception, and resource reuse are all virtualization-specific. Phishing and tailgating are social/physical techniques from other domains.","multi":true},{"id":"lzp90k","q":"Which are documented benefits of Infrastructure as Code? (Choose THREE.)","a":"Speed and efficiency of provisioning;  Auditability and compliance through versioned, reviewable code;  Consistency and standardization across environments","why":"IaC benefits: speed, consistency/standardization, scalability, cost savings, auditability. Security is explicitly a *risk* if secrets land in files — nothing is guaranteed, and skills remain essential.","multi":true},{"id":"1sf6196","q":"Which measures does the course recommend for securing cloud user access? (Choose THREE.)","a":"Enforcing strong password policies;  Multi-factor authentication;  Limiting permissions per least privilege","why":"The access-management controls: strong passwords, MFA, least privilege, and monitoring for suspicious behavior. Shared accounts and disabled monitoring are anti-patterns.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
</div>
