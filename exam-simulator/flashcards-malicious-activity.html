<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;

    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }

  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }

  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }

  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }

  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }

  .why:empty { display: none; }

  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }

  <script>
    var DECKS = [{"label":"Section 18 · Malicious Activity","cards":[{"id":"h4e7qx","q":"A firewall shows thousands of inbound SYN packets from random spoofed IP addresses; the server's connection table is full of half-open sessions and legitimate users cannot connect. Which attack and mitigation pair is correct?","a":"SYN flood — deploy flood guards and set short timeouts on half-open connections","why":"Never-completed three-way handshakes from spoofed sources are the SYN flood signature. Flood guards, half-open timeouts, and IPS detection are the defenses.","multi":false},{"id":"9r77zy","q":"An ISP's mitigation console shows all traffic from 400 attacking IP addresses being routed to a null interface, and the attack stops. Two days later the same attack resumes from new IPs. Which technique was used, and what is its key limitation?","a":"Blackholing/sinkholing — effective but temporary, since attackers can move to new IP addresses","why":"Blackholing drops attacker traffic at the boundary, but botnets can rotate IPs, so it buys time rather than solving the problem.","multi":false},{"id":"18jqdio","q":"Which denial-of-service variant physically destroys a device's ability to boot by overwriting its firmware?","a":"A permanent denial of service (PDoS)","why":"PDoS re-flashes firmware so the device cannot reboot; recovery requires a full firmware reload.","multi":false},{"id":"12zs4u8","q":"A single compromised host spawns processes that double repeatedly until the CPU is exhausted. Why is this classified as denial of service rather than a worm?","a":"It does not infect programs and does not use the network to spread — it only consumes the resources of the single attacked machine","why":"A fork bomb consumes one machine's CPU by forking processes; self-replication alone does not make it a worm.","multi":false},{"id":"1fsm09r","q":"NetFlow data shows many small DNS queries leaving the network with a spoofed internal IP as the source, followed by huge inbound DNS responses. Which attack is in progress?","a":"DNS amplification","why":"Spoofed small queries triggering large resolver responses aimed at the victim = amplification. Rate-limiting response size and traffic mitigates it.","multi":false},{"id":"ux1r8r","q":"Security analysts notice long, encoded strings inside outbound DNS TXT lookups to a strange domain, always on port 53. Which attack should they suspect first?","a":"DNS tunneling for command-and-control or data exfiltration","why":"Because DNS is usually allowed through firewalls uninspected, attackers tunnel other protocols inside it. Review DNS logs for unusual patterns.","multi":false},{"id":"1jsnzj2","q":"Customers who type the bank's correct URL are sent to a pixel-perfect fake site that steals credentials. Investigation shows the ISP's resolver cache holds a bogus record. Which attack occurred, and which control prevents it?","a":"DNS cache poisoning — DNSSEC","why":"Corrupted resolver cache data redirecting users to attacker IPs is cache poisoning/spoofing; DNSSEC's digital signatures verify DNS authenticity and integrity.","multi":false},{"id":"13lyurg","q":"A proxy log contains: GET /download?file=../../../../Windows/system32/cmd.exe%00. The %00 is significant because it:","a":"Inserts a null character that truncates the appended extension so cmd.exe can be requested instead of a forced .php","why":"The URL-encoded null byte terminates the string, defeating filters that append their own file extension. The ../ path signals a directory traversal / local file inclusion.","multi":false},{"id":"pb1yxt","q":"After clicking a spear-phishing link, a receptionist's workstation runs attacker code that grants the attacker local administrator rights. Which term describes this path?","a":"Vertical privilege escalation via arbitrary code execution","why":"User-level to admin-level is vertical escalation. The injected code took the privileges available on the machine.","multi":false},{"id":"9yvk8h","q":"Which statement about rootkits and protection rings is correct?","a":"A kernel-mode rootkit at ring 0 has the most privileged access and is more dangerous than a user-mode rootkit","why":"Ring 0 = kernel. Kernel-mode rootkits gain complete control; user-mode rootkits persist via OS features like the registry and Task Scheduler.","multi":false},{"id":"mcekyw","q":"Captured wireless traffic shows an authentication handshake being rebroadcast to the AP minutes later, granting the attacker network access. Which attack is this, and what best prevents it?","a":"Replay — use modern protocols like WPA3 with per-session protections","why":"Rebroadcasting a captured valid transmission is a replay attack; WPA3 and unique session values (tokens, rotating one-time codes via MFA) defeat it.","multi":false},{"id":"41hmcu","q":"A security review finds session tokens generated as MD5(username + hour-of-day). The primary risk is:","a":"Session prediction — predictable tokens allow hijacking of authenticated sessions","why":"Deterministic tokens can be guessed. Tokens must be truly random, non-predictable, reveal nothing about the client, and be one-time use per session.","multi":false},{"id":"1526g5j","q":"Which THREE are listed indicators of compromise? (Choose THREE.)","a":"Account lockouts from repeated failed logins;  Impossible travel between distant logins;  Missing logs or unexplained log gaps","why":"Course IoCs: account lockouts, concurrent sessions, blocked content, impossible travel, resource consumption, resource inaccessibility, out-of-cycle logging, missing logs, publicized breaches. Policy and routine maintenance are not IoCs.","multi":true},{"id":"kbp3d3","q":"Which THREE techniques can establish an on-path (man-in-the-middle) position? (Choose THREE.)","a":"ARP poisoning;  DNS poisoning;  Introducing a rogue wireless access point","why":"On-path enablers include ARP poisoning, DNS poisoning, rogue APs, and rogue switches. Floods, PDoS, and fork bombs are denial-of-service, not interception.","multi":true},{"id":"tpx3t8","q":"Which TWO statements correctly distinguish replay from relay in on-path attacks? (Choose TWO.)","a":"Replay captures valid data and repeats it immediately or later;  Relay inserts the attacker as a proxy who can read or modify traffic between the hosts","why":"Replay = rebroadcasting captured data. Relay = live proxying between the two parties with read/modify ability. Replay is common on wireless but works on wired too; strong encryption like TLS 1.3 blocks both.","multi":true},{"id":"ww9n5x","q":"Which TWO correctly describe defenses against injection attacks? (Choose TWO.)","a":"Input validation and sanitization defend against LDAP and command injection just as they do against SQL injection;  Least privilege and endpoint security configured to block injection behavior sequences help against process injection","why":"Validation/sanitization is the universal injection defense; process injection additionally calls for least privilege, kernel security modules, and endpoint behavior blocking.","multi":true},{"id":"4e1w5x","q":"Which attack floods a target with more packets than it can handle, exhausting its resources?","a":"Flood attack","why":"A flood attack is a specialized DoS that overwhelms a single server or host with traffic.","multi":false},{"id":"wbsg9v","q":"An attacker sends thousands of ICMP echo requests to overwhelm a server. This is a:","a":"Ping flood","why":"A ping flood uses ICMP echo requests (pings). Many organizations simply drop echo replies at the firewall.","multi":false},{"id":"e97jz8","q":"Which attack starts many TCP sessions but never completes the three-way handshake, leaving the server holding half-open connections?","a":"SYN flood","why":"The SYN flood sends SYNs (often from spoofed IPs) and never answers the SYN-ACK, exhausting the server's connection table.","multi":false},{"id":"mgn5sx","q":"Which device or feature detects a SYN flood and blocks the requests at the network boundary?","a":"A flood guard","why":"Flood guards (standalone devices or router/firewall features) detect and block flood attacks; half-open timeouts and IPS detection also help.","multi":false},{"id":"s6out6","q":"An attack re-flashes a router's firmware so it can never boot again, requiring a full firmware reload. This is:","a":"A permanent denial of service (PDoS)","why":"PDoS permanently bricks the device by overwriting its firmware — a reboot does not recover it.","multi":false},{"id":"tuh0ua","q":"Why is a fork bomb NOT considered a worm?","a":"It does not use the network or infect programs — it only consumes resources on a single machine","why":"Fork bombs self-replicate only inside one processor (forking processes); they do not infect programs or spread over a network.","multi":false},{"id":"qlt252","q":"Hundreds of compromised zombie machines in a botnet simultaneously attack one target. This is:","a":"A DDoS attack","why":"DDoS = distributed — many machines (bots/zombies) attack a single victim at once. GitHub 2018 peaked at ~1.35 Tbps.","multi":false},{"id":"dkppc9","q":"Blackholing (sinkholing) defends against DDoS by:","a":"Routing attacking IP addresses to a null interface so their traffic is dropped","why":"Blackholing redirects attacker IPs to a non-existent server (null interface). It is temporary — attackers can switch IPs.","multi":false},{"id":"jec8vt","q":"Which mitigation rides out a large DDoS by absorbing/filtering attack traffic through providers such as Cloudflare or Akamai?","a":"A specialized DDoS-protection/content-distribution service with web application filtering","why":"Elastic cloud scaling works but is costly; Cloudflare/Akamai add WAF filtering and content distribution layers designed to absorb huge attacks.","multi":false},{"id":"1ushdez","q":"An attacker corrupts a DNS resolver's cache so bank customers are redirected to a fake website. This is:","a":"DNS cache poisoning (DNS spoofing)","why":"Cache poisoning inserts false records into a resolver's cache, redirecting users to attacker-controlled IPs.","multi":false},{"id":"q64q4v","q":"Which control adds digital signatures to DNS data to defeat cache poisoning?","a":"DNSSEC","why":"DNSSEC (Domain Name System Security Extensions) authenticates the integrity and origin of DNS records.","multi":false},{"id":"w0v16a","q":"An attacker sends small DNS queries with a spoofed victim IP to open resolvers, and the large responses flood the victim. This is:","a":"DNS amplification","why":"DNS amplification abuses the asymmetry: tiny query, huge response, spoofed source IP — the victim gets flooded. Rate-limiting response size/traffic mitigates it.","multi":false},{"id":"bpk053","q":"Malware is seen exfiltrating data inside DNS queries on port 53 to bypass the firewall. This technique is:","a":"DNS tunneling","why":"DNS tunneling encapsulates non-DNS traffic (HTTP/SSH) over port 53, evading firewall inspection for C2 and exfiltration. Watch DNS logs for anomalies.","multi":false},{"id":"1skpeov","q":"An attacker changes the registration of a company's domain without permission, seizing control of the website. This is:","a":"Domain hijacking (domain theft)","why":"Domain hijacking = unauthorized change of domain registration. Defenses: secure the registrar account and use domain registry lock services.","multi":false},{"id":"g86bom","q":"An attacker pretending to be an authorized server requests a copy of an entire DNS zone to map the target's infrastructure. This is:","a":"A DNS zone transfer attack","why":"Zone transfer attacks steal the complete zone file (all records) for reconnaissance. Restrict zone transfers to authorized servers only.","multi":false},{"id":"92jyp","q":"A proxy log shows a request for site.com/../../../../etc/shadow. This indicates:","a":"A directory (path) traversal attack","why":"The ../ sequences climb above the web document root to reach files like /etc/shadow. Seeing ../ means directory traversal or local file inclusion.","multi":false},{"id":"1qc0a9y","q":"Which encoded string equals ../ and may be used to hide a traversal attempt from filters?","a":"%2e%2e%2f","why":"%2e = dot, %2f = forward slash. Attackers URL-encode ../ (%2e%2e%2f) to evade naive filters.","multi":false},{"id":"6s7n6y","q":"A vulnerable app loads and executes a script hosted at an attacker's remote URL via a parameter. This is:","a":"A remote file inclusion (RFI)","why":"RFI makes the app include/execute a file from a remote location (e.g., ?user=http://evil/malicious.php). LFI uses files already on the server.","multi":false},{"id":"1far7sc","q":"In an LFI attempt, what is the purpose of appending %00 to the request?","a":"It inserts a null character to truncate appended extensions (like a forced .php) so the intended file executes","why":"The URL-encoded null byte (%00) terminates the string, bypassing mechanisms that append their own extension.","multi":false},{"id":"s5eqrb","q":"What is the difference between arbitrary code execution and remote code execution?","a":"Arbitrary = run attacker's code on the target; remote = do it over the network from a distant host","why":"RCE is a network-delivered form of arbitrary code execution: load my software on your machine (arbitrary) vs. doing it over the internet (remote).","multi":false},{"id":"vsl8lx","q":"An attacker exploits a flaw to go from a standard user account to full administrator rights. This is:","a":"Vertical privilege escalation","why":"Vertical escalation = moving UP privilege levels (user to admin/root). Domain admin is the holy grail.","multi":false},{"id":"14opzaq","q":"A user exploits an app to read another user's files on a shared drive, both having the same permission level. This is:","a":"Horizontal privilege escalation","why":"Horizontal escalation = accessing someone else's same-level resources (e.g., George's files, or running as George).","multi":false},{"id":"p19gpq","q":"Why does compromising a service that runs as SYSTEM matter so much?","a":"Injected code inherits the privileges of the process it runs in — SYSTEM-level code execution","why":"Code executes with the hosting process's identity. Breaking a system-account service means your arbitrary code runs as SYSTEM.","multi":false},{"id":"1qh8ve4","q":"Which malware class modifies system files, often at the kernel level, to hide its presence and maintain persistence?","a":"A rootkit","why":"Rootkits conceal themselves in the OS (often the kernel), survive reboots/logoffs, and can install further malware.","multi":false},{"id":"v726x9","q":"Which type of rootkit is the MOST dangerous and why?","a":"Kernel mode — it lives at ring 0 with the most privileged access, giving complete control","why":"Ring 0 is the kernel — the center of the system. Kernel-mode rootkits gain complete control; user-mode rootkits persist via OS features like the registry and Task Scheduler.","multi":false},{"id":"1pqit6s","q":"Which attack captures a valid data transmission and fraudulently retransmits it later to gain unauthorized access?","a":"A replay attack","why":"Replay = rebroadcast/repeat/delay of valid data. Unlike session hijacking, the attacker does not modify traffic in real time — they reuse captured data later.","multi":false},{"id":"4ui4bo","q":"Which TWO controls most directly defeat credential replay attacks?","a":"Session tokens and MFA with rotating one-time codes","why":"Per-session tokens make captured sessions invalid, and MFA one-time codes (30–60 s rotation) make replayed credentials useless. WPA3 also helps on wireless.","multi":false},{"id":"5sh06k","q":"Session hijacking most commonly occurs through:","a":"Theft or modification of session cookies","why":"Stealing or modifying the session cookie lets the attacker take over the authenticated session and impersonate the user.","multi":false},{"id":"1kx2aus","q":"Which cookie type is deleted automatically when the browser instance closes?","a":"A session (non-persistent) cookie","why":"Session cookies live in memory only; persistent cookies stay in the browser cache until expiry or manual deletion.","multi":false},{"id":"j3akgb","q":"Modifying a cookie's contents after it was issued to exploit the web application is called:","a":"Cookie poisoning","why":"Cookie poisoning tampers with the cookie to exploit the app. Defenses: input validation, encrypting cookies in transit and at rest, and deleting them when the session ends.","multi":false},{"id":"1o1kvji","q":"Which attack places the attacker's workstation logically between two hosts to transparently capture, monitor, and relay their communications?","a":"An on-path attack","why":"On-path (MITM) puts the attacker between client and server. Enablers: ARP poisoning, DNS poisoning, rogue wireless APs, rogue switches.","multi":false},{"id":"1tjdrlx","q":"An on-path attacker tricks a browser into using plain HTTP instead of HTTPS so traffic can be read. This is:","a":"SSL stripping","why":"SSL stripping downgrades the connection from HTTPS to HTTP, exposing plaintext. A downgrade attack instead negotiates a weaker-but-compatible encryption (e.g., SSL 2.0 instead of TLS 1.3).","multi":false},{"id":"1il4ut8","q":"Entering a wildcard (*) into a login field of an LDAP-backed application dumps all user accounts. This is:","a":"An LDAP injection","why":"LDAP injection fabricates directory search statements from user input, e.g., a * wildcard returning every user. Prevention: input validation and sanitization.","multi":false},{"id":"ki535m","q":"A web form pings a user-supplied host. An attacker enters host.com && hostname and the server also runs hostname. This is:","a":"A command injection","why":"Command injection appends arbitrary shell commands to a legitimate command via a vulnerable app. Validate input — only allow the expected format.","multi":false},{"id":"xbsmfq","q":"Process injection's biggest advantage to an attacker is that it:","a":"Runs code under a legitimate live process, inheriting its resources/privileges and evading detection","why":"Injecting into another process (DLL injection, process hollowing, doppelganging, APCs) masks execution under a trusted process and may inherit elevated privileges.","multi":false},{"id":"1bo0v2j","q":"An account logs in from New York and then London 30 minutes later. Which IoC is this?","a":"Impossible travel","why":"Impossible travel = logins from geographically distant locations within a timeframe physical travel cannot bridge — a strong compromise indicator.","multi":false},{"id":"1ku74r9","q":"A workstation shows 90% GPU usage while the user is only browsing the web. What is the most likely IoC?","a":"The machine is a crypto-mining zombie","why":"Abnormal resource consumption (CPU/memory/bandwidth/GPU spikes) can indicate malware, DDoS participation, or crypto-mining.","multi":false},{"id":"1a5evfd","q":"Log entries show administrative activity every night at 3:00 AM when the office is closed. This IoC is called:","a":"Out-of-cycle logging","why":"Out-of-cycle logging = activity at unusual times (nights/weekends), suggesting attackers hiding in off-hours. Missing logs/gaps suggest tampering to cover tracks.","multi":false},{"id":"febfth","q":"A user suddenly cannot open any files and finds a ransom note. Which IoC and attack does this indicate?","a":"Resource inaccessibility — ransomware","why":"Resource inaccessibility (files/databases suddenly unreachable) with a ransom note is the classic ransomware IoC.","multi":false},{"id":"1ncoaax","q":"A system log has a gap of two days with no entries at all. What does this suggest?","a":"Missing logs — an attacker may have deleted them to cover their tracks","why":"Missing logs or gaps indicate tampering; attackers delete logs to frustrate investigation. Verify against other sources before concluding a breach.","multi":false},{"id":"10mc6p2","q":"Which statement about indicators of compromise is TRUE?","a":"IoCs are hints that require investigation — they can be false positives from errors or legitimate activity","why":"IoCs are clues, not proof. Analysts spend much of their time in event logs deciding whether an indicator is a true compromise or a false positive.","multi":false},{"id":"f5uxf8","q":"Which combination most effectively survives a massive DDoS aimed at a public web application?","a":"A specialized DDoS-absorption provider (e.g., Cloudflare/Akamai) fronting the application with elastic capacity","why":"Elastic scaling plus providers designed for WAF filtering and content distribution can ride out huge attacks; blackholing is temporary and ping-flood defenses do not touch volumetric DDoS.","multi":false},{"id":"106rp85","q":"A company discovers its domain now resolves to a competitor's server and the registrar contact email was changed. Which attack is this and which control would have prevented it?","a":"Domain hijacking — a domain registry lock service and a secured registrar account","why":"Unauthorized change of domain registration is domain hijacking; registry locks stop unapproved changes and a secured account blocks the takeover path.","multi":false},{"id":"xdyfq3","q":"In a directory traversal, what does the sequence ../ accomplish on a Linux web server?","a":"It jumps to the parent directory, climbing above the web document root toward sensitive system files","why":"Each ../ moves up one directory level; stacked sequences escape the web root to reach files like /etc/shadow. Windows/IIS often accepts both slash styles.","multi":false},{"id":"19lc0d4","q":"Which distinction between vertical and horizontal privilege escalation is correct?","a":"Vertical = gaining higher privilege levels (user to admin); horizontal = accessing another user's same-level resources","why":"Vertical moves UP the privilege ladder (admin/root/domain admin is the goal); horizontal stays at the same level but crosses into someone else's resources.","multi":false},{"id":"1ew8gq6","q":"An attacker injects a malicious DLL into a running trusted process so the code executes under that process's identity. This is:","a":"Process injection — it inherits the process's memory, resources, and privileges while hiding under a legitimate name","why":"Process injection (DLL injection, hollowing, doppelganging, APCs) executes arbitrary code in another live process's address space, evading detection and inheriting privileges.","multi":false},{"id":"1tydisg","q":"Which defense set best counters process injection?","a":"Endpoint security blocking common attack-behavior sequences, kernel security modules, and least privilege","why":"Behavior-blocking endpoint tools, kernel-level security modules, and least privilege (so even injected code has minimal rights) are the listed mitigations.","multi":false},{"id":"shb69j","q":"An analyst captures a login request on the wireless network and replays it 10 minutes later, gaining access without knowing the password. Which single improvement makes this replay worthless?","a":"Unique, per-session values (session tokens / one-time rotating codes) that are invalid the second time","why":"Replay attacks reuse valid captured data; freshness mechanisms — unique session tokens, MFA codes rotating every 30–60 seconds, WPA3 — make captured material expire.","multi":false},{"id":"un6wj0","q":"How does an on-path downgrade attack differ from SSL stripping?","a":"Downgrade keeps encryption but negotiates a weaker, crackable protocol version; SSL stripping removes encryption entirely by forcing HTTP","why":"SSL stripping = HTTPS-to-HTTP (no encryption). Downgrade = still encrypted, but a weak backwards-compatible mode (e.g., SSL 2.0 vs TLS 1.3), so the lock icon still appears.","multi":false},{"id":"g22eek","q":"Which user-mode rootkit trait distinguishes it from a kernel-mode rootkit?","a":"It relies on OS features like the registry or Task Scheduler for persistence rather than embedding in the kernel","why":"User-mode rootkits typically hold admin privileges and persist through OS mechanisms; kernel-mode rootkits sit at ring 0 with total control, making them more dangerous.","multi":false},{"id":"18xqx10","q":"A web app includes user input directly in an operating system command. An attacker submits 10.0.0.1 && cat /etc/passwd. Which attack is this and what is the fix?","a":"Command injection — validate input so only the expected format (an IP or hostname) is accepted","why":"Appending shell commands with && after legitimate input is command injection. Strict input validation — only an IP/hostname passes — closes it.","multi":false},{"id":"1kjnmar","q":"Multiple employees report being locked out of their accounts after a holiday weekend. Logs show thousands of failed logins per account. Which IoC is this, and what does it suggest?","a":"Account lockouts — a brute-force attack was attempted against those accounts","why":"Mass failed attempts triggering lockouts indicate password guessing. Lockout thresholds must still balance security against user inconvenience.","multi":false},{"id":"vn3t9i","q":"Which IoC pair are most likely seen TOGETHER when an attacker is actively using a stolen account?","a":"Impossible travel and concurrent session usage","why":"A hijacked account often shows simultaneous sessions from distant places — impossible travel plus concurrent session usage frequently occur together.","multi":false},{"id":"xr8cty","q":"An attacker's public post on a hacker forum claims responsibility for breaching a retailer, and the retailer's site is found defaced with the group's name. This is best described as:","a":"An IoC — a published/disclosed breach confirming the compromise","why":"Attackers sometimes publicize breaches (forums, social media, defaced websites) to boast or damage reputation — itself a recognized indicator of compromise.","multi":false},{"id":"m37pre","q":"An organization wants to stop an on-path attacker from reading relayed traffic between a branch office and headquarters. Which measure is MOST effective?","a":"Strong end-to-end encryption such as TLS 1.3 between the hosts","why":"The big challenge for replay/relay is enforced encryption; TLS 1.3 makes intercepted traffic unreadable and unforgeable.","multi":false},{"id":"v2t8jx","q":"Which THREE are valid defenses against DoS/DDoS attacks? (Choose THREE.)","a":"Blackholing/sinkholing attacker IP addresses;  Elastic cloud infrastructure that scales under load;  Specialized providers such as Cloudflare or Akamai","why":"Blackholing is a quick temporary measure; elasticity and dedicated absorption providers handle large volumetric attacks. The other options increase exposure.","multi":true},{"id":"1jo6jky","q":"Which THREE are indicators of compromise? (Choose THREE.)","a":"A sudden jump in server CPU from 20% to 90%;  Repeated attempts to download blocked content;  Log entries showing activity at 3:00 AM on a Sunday","why":"Resource spikes, blocked-content attempts, and out-of-cycle logging are all listed IoCs; routine admin and normal logins are baseline noise.","multi":true},{"id":"1h6z4ny","q":"Which TWO attacks abuse the DNS protocol? (Choose TWO.)","a":"DNS tunneling — encapsulating data in DNS to evade firewalls;  DNS amplification — flooding a victim with oversized resolver responses","why":"Both abuses ride the DNS protocol itself — one hides traffic, the other weaponizes responses. The others are unrelated attack classes.","multi":true},{"id":"18lrhnp","q":"Which TWO statements about cookies are correct? (Choose TWO.)","a":"Session cookies are non-persistent and deleted when the browser closes;  Cookies holding confidential data should be encrypted in transit and in storage","why":"HTTP is stateless; session cookies live in memory, persistent ones in cache. Encrypt sensitive cookies, validate them against tampering, and delete them at session end.","multi":true},{"id":"a8r8jx","q":"An incident responder sees a web log entry: GET /view?doc=..%2f..%2f..%2fetc%2fshadow HTTP/1.1 followed moments later by GET /view?doc=....Windowssystem32driversetchosts. What can be concluded about the target and attacker?","a":"The attacker tried encoded traversal against a Unix-style path, then Windows-style traversal with backslashes — IIS and many Windows servers accept both slash styles","why":"%2f is an encoded slash (../). Windows/IIS commonly accepts both / and  separators, so traversal works in both dialects. Any ../ family = directory traversal / LFI.","multi":false},{"id":"158apkz","q":"Which pairing of attack → mitigation is CORRECT?","a":"DNS cache poisoning → DNSSEC with signed records","why":"DNSSEC cryptographically validates DNS responses. SYN floods need flood guards/timeouts, hijacking needs token randomness and encryption, command injection needs input validation.","multi":false},{"id":"1j57e2g","q":"A SOC analyst correlates: 90% GPU at idle, outbound connections to an unknown mining pool, and the host answering pings from a known botnet C2 list. Which conclusion is BEST supported?","a":"The host is likely a zombie enrolled in a botnet and crypto-mining — resource consumption plus C2 contact","why":"Resource consumption (especially anomalous GPU load) plus botnet C2 indicators strongly suggest the machine is compromised and mining for the attacker.","multi":false},{"id":"1tlgo7d","q":"An on-path attacker on a coffee-shop network forces a victim's HTTPS banking session down to HTTP and reads the credentials in transit. Which technique is this, precisely?","a":"SSL stripping — replacing HTTPS with plaintext HTTP","why":"SSL stripping specifically removes encryption by steering the connection to HTTP. A downgrade attack keeps encryption but weakens the negotiated protocol version.","multi":false},{"id":"16c2336","q":"Why can MFA with a rotating one-time code defeat a replay of a captured login session?","a":"The captured session lacks the second factor's current one-time value, which changes every 30–60 seconds and is valid exactly once","why":"Replay reuses old credentials; a time-based one-time code is stale by the time it is replayed. Session tokens add per-session uniqueness on top.","multi":false},{"id":"it7tt3","q":"Which statement about RFI versus LFI is TRUE?","a":"RFI pulls a file from a remote URL into the app; LFI pulls a file already present on the server — both are file-inclusion forms of directory traversal","why":"Remote file inclusion executes attacker-hosted scripts; local file inclusion reads/executes local files (e.g., ../../Windows/system32/cmd.exe), often with %00 truncation.","multi":false},{"id":"urjd2l","q":"A red teamer gets arbitrary code executed inside a service running as a domain service account. What does this grant, and which escalation could follow?","a":"Code running with the service account's privileges; the attacker can pivot toward domain admin — vertical privilege escalation","why":"Injected code inherits the host process's identity. Compromising a privileged service is a standard path to vertical escalation, with domain admin as the ultimate prize.","multi":false},{"id":"p06r73","q":"Which IoC most specifically suggests an attacker is trying to HIDE their activity rather than merely gain access?","a":"Missing logs / log gaps and out-of-cycle logging","why":"Deleting logs (gaps) and operating at 3 AM (out-of-cycle) are anti-forensic behaviors — the attacker already has access and is covering tracks.","multi":false},{"id":"1m20yf1","q":"An enterprise must choose a control to protect DNS resolution integrity between its resolver and clients. Which option is designed specifically for this?","a":"DNSSEC","why":"DNSSEC adds digital signatures to DNS data so resolvers can verify authenticity and integrity — the designed answer to cache poisoning/spoofing.","multi":false},{"id":"11gqn4u","q":"Which attack chain correctly orders on-path exploitation steps?","a":"ARP poison → position between hosts → relay/modify traffic → SSL strip or downgrade if encryption interferes","why":"The on-path playbook: establish position (ARP/DNS poisoning, rogue AP/switch), relay or replay traffic, then attack encryption via stripping or downgrade if needed.","multi":false},{"id":"27acqp","q":"A company's web forms pass user input into an LDAP search filter. Which input would an attacker use to dump all directory users, and which defense applies?","a":"A wildcard * in the search field — input validation and sanitization","why":"An unescaped * wildcard in an LDAP filter returns every entry. Like SQLi and command injection, the defense is validating and sanitizing input.","multi":false},{"id":"46xgrg","q":"Which statement best summarizes why indicators of compromise require analyst judgment?","a":"IoCs are hints, not proof — they can result from errors, legitimate behavior, or false positives, so each must be investigated","why":"The course stresses that an IoC signals POTENTIAL malicious activity; distinguishing a true compromise from noise is a core analyst duty.","multi":false},{"id":"5mxgck","q":"Which THREE accurately describe a SYN flood? (Choose THREE.)","a":"It exploits the TCP three-way handshake by never completing it;  Made-up (spoofed) source IPs cause the server to wait on replies that never arrive;  Half-open connection timeouts and flood guards mitigate it","why":"SYN floods drown the server in half-open sessions. Spoofed IPs keep it waiting; timeouts, flood guards, and IPS response are the mitigations.","multi":true},{"id":"65fahz","q":"Which THREE are valid mitigations for session hijacking and cookie abuse? (Choose THREE.)","a":"Truly random, non-predictable session tokens;  One-time-use tokens scoped to a single session;  Encrypting cookies in transit and at rest, deleting them at session end","why":"Randomness defeats prediction; one-time use defeats replay of the token; encryption and deletion defeat cookie theft and poisoning. The other options increase exposure.","multi":true},{"id":"kvxbzb","q":"Which TWO scenarios describe horizontal privilege escalation? (Choose TWO.)","a":"An employee reading a coworker's files on a shared drive without permission;  Running code as another standard user (not an admin) to access that user's data","why":"Horizontal = same privilege level, different victim's resources. Moving to admin/root is vertical; flooding and firmware attacks are DoS.","multi":true},{"id":"vnzzlo","q":"Which TWO are true about DDoS compared to DoS? (Choose TWO.)","a":"DDoS uses many machines (botnet zombies) attacking simultaneously;  DDoS traffic often comes from uncompromised-looking machines whose owners are unaware","why":"Distribution across hundreds/thousands of bots is the defining difference; the bots are usually infected unwitting participants.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
