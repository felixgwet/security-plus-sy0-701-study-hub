  .btn:hover { filter: brightness(1.12); }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }

  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }

  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }

  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }
</style>

  <script>
    var DECKS = [{"label":"Section 10 · Governance and Compliance","cards":[{"id":"1qnfyzo","q":"A new CISO finds the organization has policies and standards, but nothing documents the actual steps administrators follow for daily backups and account creation. Which governance element is missing?","a":"Procedures — the step-by-step instructions for specific tasks","why":"Procedures are the detailed step-by-step instructions that ensure consistency and compliance with policies and standards. Policies set high-level intent, standards set mandatory rules, and procedures operationalize both — backups and account provisioning are classic procedures.","multi":false},{"id":"v9t95w","q":"An organization drafts a document outlining its commitment to protecting customer data and its intentions regarding ethical conduct. It sets no specific technical rules. Which document type is this?","a":"A policy","why":"Policies are high-level guidelines outlining an organization's commitments and intentions (data protection, ethical conduct). The specific mandatory rules that flow from it would be standards, and the step-by-step tasks would be procedures.","multi":false},{"id":"zqk8cw","q":"A multinational adopts a remote-work model after a cultural shift in its industry, and updates its policies, secure-access procedures, and IT systems accordingly. Which governance activity does the update represent?","a":"Revision of the governance framework in response to cultural change","why":"Governance must adapt to three change drivers: technology, regulations, and industry culture. Updating the framework (policies, procedures, systems) after identifying gaps is revision — remote work here is the cultural driver.","multi":false},{"id":"1d09pok","q":"Which pairing of access control model and characteristic is correct?","a":"MAC uses labels or classifications and is common in government/military settings","why":"MAC = Mandatory Access Control, using labels/classifications (government/military). DAC = owner discretion. RBAC = role-based assignment. Swapping these characteristics is a standard exam trap.","multi":false},{"id":"1017k7h","q":"To prevent any single administrator from having complete control over the payroll system, a company splits configuration, approval, and audit rights across three people. Which standard principle is this?","a":"Separation of duties","why":"Separation of duties prevents any single individual from having complete control over a critical process or system, reducing insider-threat risk. Least privilege limits each person's access to the minimum needed — related, but the splitting of control described here is separation of duties.","multi":false},{"id":"wofawj","q":"An admin must deploy a major software update to production servers. Per the change management procedure, what should happen BEFORE the change goes live?","a":"The change should be tested, a rollback plan prepared, and deployment scheduled in a maintenance window","why":"Significant changes should be tested first; every change needs a backup/rollback plan; and potentially disruptive changes are scheduled in a designated maintenance window. The procedure then continues with staged implementation and a post-change review.","multi":false},{"id":"o7nnq7","q":"A SOC analyst grabs the documented checklist that specifies exactly how to detect, triage, and respond to a ransomware outbreak. What is this checklist called?","a":"A playbook","why":"A playbook is a checklist of actions to perform to detect and respond to a specific type of incident — a step-by-step guide ensuring consistency and speed regardless of who performs the tasks.","multi":false},{"id":"txmu2s","q":"A European retailer stores customer data of EU citizens. A separate California office serves state residents. Which TWO regulatory frameworks must it navigate, and at what levels?","a":"GDPR at the global level and CCPA at the regional level","why":"GDPR is a global consideration — it binds any company processing EU citizens' data regardless of where the company is based. CCPA is a regional (state) consideration granting Californians rights to know, delete, and opt out of sale of their data.","multi":false},{"id":"rgu0b","q":"Before expanding overseas, a firm researches the target country's business regulations; it then trains its staff on those regulations and hires a local legal advisor. Which pair labels these two activities correctly?","a":"Due diligence, then due care","why":"Researching the laws to IDENTIFY compliance risks = due diligence (the exhaustive review). The mitigation steps that follow — training employees, hiring local legal advice = due care. Reversing them is the classic exam trap.","multi":false},{"id":"1fc4vyu","q":"After building a new application, the lead developer signs a formal statement that all required data-security protocols were followed during development. What is this signed statement?","a":"Attestation — a formal declaration that processes and controls are compliant","why":"Attestation is a formal declaration by a responsible party that processes and controls ARE compliant. Acknowledgement is the separate act of recognizing/accepting the requirements (signing the compliance agreement).","multi":false},{"id":"hn2s6z","q":"Under GDPR, regulators may fine a company up to €20 million or 4% of annual global turnover — whichever is higher. Which consequence category do such penalties belong to?","a":"Fines — monetary penalties imposed by regulatory bodies","why":"Fines are monetary penalties imposed by regulatory bodies for non-compliance — GDPR's €20M/4% ceiling is the headline example, with British Airways' £183M penalty (2019, 500,000 customers affected) as the real-world case.","multi":false},{"id":"nzrknw","q":"A healthcare provider deploys a system that automatically flags any unauthorized access to patient records so HIPAA violations can be caught immediately. Which compliance trend does this demonstrate?","a":"Automation — real-time compliance monitoring with streamlined accuracy","why":"Automated compliance systems streamline data collection, improve accuracy, and provide real-time monitoring — like auto-flagging unauthorized patient-record access (HIPAA) or auto-generating money-laundering transaction reports for banks.","multi":false},{"id":"1flz6yv","q":"Which of the following are genuine policy types from the course? (Select FOUR.)","a":"Acceptable use policy;  Business continuity policy;  Incident response policy;  Change management policy","why":"The course's seven policy areas: AUP, information security, business continuity, disaster recovery, incident response, SDLC, and change management. Cafeteria, plant, and parking policies are invented distractors.","multi":true},{"id":"16f8flz","q":"Which statements about governance structures are correct? (Select THREE.)","a":"Boards of directors are elected by shareholders;  Committees are board subgroups with specific focus areas, such as audit or cybersecurity;  Government entities like the FTC establish laws organizations must comply with","why":"Boards are shareholder-elected; committees (audit, governance, cybersecurity) are focused subgroups; government entities (FTC) set binding rules. The last two options are reversed — centralized concentrates authority at the top, decentralized distributes it.","multi":true},{"id":"1m36eoe","q":"Which items are elements of password standards per the course? (Select FOUR.)","a":"Minimum length of 8 to 12 characters;  Mix of uppercase, lowercase, numbers, and special characters;  Regular changes, typically every 60 to 90 days;  Hashing and salting to protect stored passwords","why":"Password standards: 8–12+ character minimums, character-mix complexity, 60–90 day rotation with reuse prohibited, and hashing/salting so a compromised password database still doesn't expose passwords. The other options are exactly what standards exist to prevent.","multi":true},{"id":"ged36p","q":"Which consequences of non-compliance are listed in the course, with correct examples? (Select THREE.)","a":"Fines — GDPR's €20M or 4% of global turnover ceiling; British Airways' £183M penalty;  Reputational damage — Equifax's stock dropped over 30% after its 147-million-person breach;  Loss of license — New York DFS revoked a Bitcoin company's license in 2016","why":"The five consequences: fines (GDPR ceilings, BA's £183M), sanctions (China 2017: warnings, fines, confiscated income), reputational damage (Equifax: 147M exposed, stock −30%), loss of license (NY DFS vs. Bitcoin firm 2016), and contractual impacts (lawsuits, termination). The last two options are nonsense distractors.","multi":true},{"id":"1v84plm","q":"What does governance refer to in an IT organization?","a":"The overall management of the organization's IT infrastructure, policies, procedures, and operations","why":"Governance is the overall management of IT infrastructure, policies, procedures, and operations — establishing a strategic framework aligned with the organization's objectives and regulatory requirements.","multi":false},{"id":"1nqtdl7","q":"In the GRC triad, what do the letters G, R, and C stand for?","a":"Governance, Risk, and Compliance","why":"GRC = Governance, Risk, and Compliance — and governance is the first component of the triad, providing strategic leadership, structures, and processes.","multi":false},{"id":"185jr2c","q":"Which of the following is NOT one of the key decision areas governance involves?","a":"Choosing each employee's desk location","why":"Governance involves making key decisions about risk management, resource allocation, and performance measurement — not individual workplace logistics.","multi":false},{"id":"17suri7","q":"In the document hierarchy shaped by governance, which type is described as NOT mandatory and providing a recommended approach?","a":"Guidelines","why":"Guidelines are not mandatory — they provide a recommended approach to handling various situations. Policies are high-level commitments, standards are specific often-mandatory rules, and procedures are detailed steps.","multi":false},{"id":"18a8pc5","q":"How do standards differ from policies?","a":"Standards are more specific, often mandatory rules that must be followed to adhere to a policy","why":"Policies are high-level commitments and intentions; standards are more specific, often mandatory rules that must be followed to adhere to a policy — typically defined by industry or regulatory bodies.","multi":false},{"id":"riymhz","q":"What does the 'monitoring' of a governance framework involve?","a":"Regularly reviewing and assessing the framework's effectiveness to identify gaps or weaknesses","why":"Monitoring means regularly reviewing and assessing the effectiveness of the governance framework, helping identify gaps or weaknesses caused by changes in technology, regulations, or industry culture.","multi":false},{"id":"1m6wauh","q":"TechFirm revised its governance framework three times: when adopting cloud services, when new data-protection regulations appeared, and when remote work became common. What three change types do these represent?","a":"Technological, regulatory, and cultural","why":"Cloud adoption = technological change; new regulations = regulatory change; the remote-work shift = cultural change. Governance must be monitored and revised as all three evolve.","multi":false},{"id":"yn3vx","q":"What does 'revision' of a governance framework mean?","a":"Updating the framework to address identified gaps or weaknesses","why":"Revision = updating the governance framework to address gaps or weaknesses — possibly updating policies, standards, procedures, or making infrastructure and operational changes.","multi":false},{"id":"gyc2xw","q":"Who elects the board of directors, and what is the board responsible for?","a":"Shareholders elect it; it sets strategic direction, establishes policies, and makes significant decisions","why":"A board of directors is elected by shareholders to oversee management — responsible for the company's strategic direction, policies, and significant decisions.","multi":false},{"id":"abo7z7","q":"What does an audit committee do?","a":"Oversees the organization's financial reporting process","why":"Committees are board subgroups with specific focus — the audit committee oversees financial reporting, while a governance committee ensures the board itself functions effectively.","multi":false},{"id":"1kmqxrj","q":"Which government entity enforces laws related to consumer protection and competition in the United States?","a":"The Federal Trade Commission (FTC)","why":"The FTC enforces laws related to consumer protection and competition, which can significantly impact an organization's governance practices.","multi":false},{"id":"rqmyf5","q":"What is a key drawback of a centralized governance structure?","a":"It can be slow to respond to local or departmental needs","why":"Centralized structures concentrate decision-making at the top — consistent decisions and clear authority, but slow to respond to local or departmental needs. Decentralized structures are the opposite trade-off.","multi":false},{"id":"mj59sq","q":"A tech startup distributes decision-making authority throughout the organization to encourage innovation and agility. Which structure is this, and what risk does it carry?","a":"Decentralized — quicker and more responsive, but can lead to inconsistencies","why":"Decentralized governance distributes authority for quicker decisions and local responsiveness (good for startups) — but it can lead to inconsistencies across the organization.","multi":false},{"id":"qwv7zx","q":"What does an acceptable use policy (AUP) do?","a":"Outlines the do's and don'ts for users interacting with the organization's IT systems and resources","why":"An AUP sets boundaries for appropriate use of IT resources — prohibiting dangerous websites, unauthorized software, or personal use for gain — protecting the organization from legal issues and security threats.","multi":false},{"id":"gqh7ze","q":"Which policy focuses on how an organization will continue its critical operations during and after a disruption?","a":"Business continuity policy","why":"Business continuity = keeping critical operations running during/after a disruption (power outages, hardware failures, natural disasters). Disaster recovery is the related but distinct IT-systems-and-data restoration piece.","multi":false},{"id":"1x9gq7h","q":"What is the primary focus of a disaster recovery policy?","a":"Recovering IT systems and data after a disaster — backups, restoration, alternative processing locations","why":"Disaster recovery focuses on IT recovery: data backup and restoration steps, hardware/software recovery, and alternative processing locations — e.g., regular offsite backups that are tested.","multi":false},{"id":"1vh4lf5","q":"Which policy includes steps for detecting, reporting, assessing, responding to, and learning from security incidents?","a":"Incident response policy","why":"An incident response policy plans for security incidents: who gets notified in a breach, how it's contained and investigated, and how to prevent similar incidents — learning from each incident.","multi":false},{"id":"1pdarqx","q":"What does an SDLC policy govern?","a":"All stages of software development from requirements gathering to maintenance, including secure-coding standards and code reviews","why":"An SDLC policy guides the full lifecycle — requirements, design, coding, testing, deployment, maintenance — and includes standards for secure coding practices, code reviews, and software testing.","multi":false},{"id":"lzj85x","q":"What is the aim of a change management policy?","a":"To ensure changes to IT systems and processes are implemented in a controlled and coordinated manner","why":"Change management policy governs how IT changes are handled — with procedures for requesting, approving, implementing, and reviewing changes — minimizing the risk of disruptions.","multi":false},{"id":"lgnlih","q":"Which password standard elements does the course recommend? (All apply — pick the BEST single answer.)","a":"Minimum 8–12 characters with mixed case, numbers, special characters; changes every 60–90 days; no reuse; hashing and salting","why":"Password standards: 8–12+ characters, mix of upper/lowercase, numbers, special characters; enforced changes every 60–90 days; reuse prohibited; and hashing/salting so a compromised password database doesn't expose actual passwords.","multi":false},{"id":"1yueb71","q":"In Discretionary Access Control (DAC), who decides who can access a resource?","a":"The owner of the information or resource","why":"DAC allows the OWNER of the information or resource to decide who can access it. MAC uses labels/classifications (government/military), and RBAC assigns access by organizational role.","multi":false},{"id":"1y4i0gb","q":"Mandatory Access Control (MAC) determines access using:","a":"Labels or classifications — often used in government or military settings","why":"MAC uses labels or classifications to determine access — typical of government/military environments, unlike DAC (owner discretion) or RBAC (roles).","multi":false},{"id":"12m2175","q":"What does the principle of least privilege ensure?","a":"Users only have the minimal levels of access required to perform their duties","why":"Least privilege = users only get the minimal access needed for their duties. Separation of duties complements it: no single individual has complete control over a critical process, reducing insider-threat risk.","multi":false},{"id":"1ctg8pd","q":"According to the course, which encryption standard is often used for data at rest, and which for secure communication?","a":"AES for data at rest; RSA for secure communication","why":"AES is used for data at rest (strong security, efficient performance); RSA is common for secure communication because of its public-key infrastructure nature.","multi":false},{"id":"10f8jd6","q":"Which of these is an environmental control under physical security standards?","a":"Fire suppression and HVAC controls","why":"Physical security standards include perimeter controls (fences, gates, guards), surveillance (CCTV), access mechanisms (biometrics, keycards), and environmental controls: fire suppression, HVAC, and power redundancy.","multi":false},{"id":"6hiy6d","q":"What is the correct first stage of the change management procedure?","a":"Identify the need for change and assess the potential impacts","why":"The change management procedure: (1) identify the need and assess impacts, (2) develop a plan (who, what resources), (3) implement — often in stages, (4) review the change and capture lessons learned.","multi":false},{"id":"1xmye1o","q":"Why should significant changes be tested first, and what must every change have?","a":"Testing catches issues safely, and every change needs a backup/rollback plan in case of negative results","why":"Significant changes should be tested first, and every change should have a backup plan so it can be rolled back if it leads to negative or unexpected results. Disruptive changes are scheduled in maintenance windows.","multi":false},{"id":"dhfcns","q":"Which tasks belong to employee offboarding?","a":"Retrieving company property, disabling access to systems, and conducting exit interviews","why":"Offboarding covers retrieving company property, disabling system access, and exit interviews (gathering feedback). Onboarding covers orientation, training, and integration.","multi":false},{"id":"1i3wqvq","q":"What is a playbook?","a":"A checklist of actions to perform in order to detect and respond to a specific type of incident","why":"A playbook is a checklist of actions for detecting and responding to a specific incident type — a step-by-step guide ensuring tasks are performed consistently and efficiently regardless of who performs them.","multi":false},{"id":"15fdpdp","q":"Which regulation, implemented by the European Union, significantly impacts how organizations collect, store, and use the personal data of EU citizens — even for companies based outside the EU?","a":"GDPR","why":"The GDPR is the EU's data-protection regulation with global reach: any company collecting or processing EU citizens' data must comply. Non-compliance brings severe penalties including fines and sanctions.","multi":false},{"id":"w9k52d","q":"What rights does the California Consumer Privacy Act (CCPA) provide to state residents?","a":"The right to know what personal data is collected, to delete it, and to opt out of its sale","why":"CCPA (a regional consideration) grants California residents: the right to KNOW what personal data is collected, the right to DELETE personal data held by businesses, and the right to OPT OUT of the sale of their data.","multi":false},{"id":"1bbzdon","q":"The Americans with Disabilities Act (ADA) is which level of governance consideration, and what does it require?","a":"National — reasonable accommodations for employees and accessibility for customers with disabilities","why":"The ADA is a national consideration: US businesses must provide reasonable accommodations for employees with disabilities and ensure accessibility for customers with disabilities.","multi":false},{"id":"unmsgy","q":"Why might an organization that ignores Agile methodologies in software development suffer, even though no law requires Agile?","a":"Industry standards shape customer, partner, and regulator expectations — non-adoption creates competitive disadvantage","why":"Industry considerations aren't legally binding but influence expectations of customers, partners, and regulators. Agile (Scrum/Kanban) became a software industry standard; ignoring such standards can leave an organization at a competitive disadvantage.","multi":false},{"id":"9ival1","q":"What is the 'conflict of laws' issue organizations face under global considerations?","a":"Data-protection laws vary widely between jurisdictions, and an organization must navigate the differences to ensure compliance","why":"Globally, laws like the GDPR apply extraterritorially while other jurisdictions differ — the conflict of laws requires a deep understanding of each jurisdiction's legal landscape and a flexible governance approach.","multi":false},{"id":"nb4kcc","q":"Internal compliance reporting is typically conducted by:","a":"An internal audit team or compliance department","why":"Internal compliance reporting collects and analyzes data to ensure adherence to internal policies — typically by an internal audit team or compliance department (e.g., reporting on transactions that required compliance-officer approval).","multi":false},{"id":"1u5w1rk","q":"A pharmaceutical company must submit regular reports to the FDA detailing adherence to good manufacturing practices (GMP). Which type of compliance reporting is this?","a":"External compliance reporting — mandated by law","why":"External compliance reporting demonstrates compliance to regulatory bodies, auditors, or customers and is often mandated by law or contract — exactly like FDA/GMP reports.","multi":false},{"id":"p7ot2n","q":"A company researches a foreign country's business laws before expanding there. What compliance activity is this, and what would training employees on those laws be?","a":"Due diligence; due care","why":"Due diligence = the exhaustive review that identifies potential compliance risks (researching foreign laws). Due care = the steps taken to mitigate them (training employees, hiring a local legal advisor).","multi":false},{"id":"nw53bb","q":"Software developers formally declare that they followed all required data-security protocols when building an application. What is this declaration called?","a":"Attestation","why":"Attestation = a formal declaration by a responsible party that processes and controls are compliant. Acknowledgement is the separate step of accepting/recognizing the requirements — e.g., signing a compliance agreement.","multi":false},{"id":"1hvlwcn","q":"A company undergoes a third-party audit to verify it meets ISO 9001 quality management standards. Which monitoring type is this?","a":"External monitoring","why":"External monitoring = third-party reviews or audits verifying compliance with external regulations or standards (e.g., ISO 9001). Internal monitoring reviews the organization's own operations against internal policies.","multi":false},{"id":"9lk7e1","q":"How do automated compliance systems help an organization?","a":"They streamline data collection, improve accuracy, and provide real-time compliance monitoring","why":"Automation streamlines data collection, improves accuracy, and enables real-time monitoring — e.g., auto-flagging unauthorized access to patient records (HIPAA) or generating suspicious-transaction reports for anti-money-laundering.","multi":false},{"id":"hkkb1t","q":"Under GDPR, companies can be fined up to what amount for serious data breaches?","a":"€20 million or 4% of annual global turnover, whichever is higher","why":"GDPR fines can reach €20 million or 4% of annual global turnover — whichever is higher. British Airways was fined £183 million in 2019 by the UK's ICO for a breach affecting 500,000 customers.","multi":false},{"id":"e7i3q7","q":"Equifax's 2017 breach, which exposed personal information of 147 million people, is the course's example of which non-compliance consequence?","a":"Reputational damage — its stock dropped more than 30% in weeks","why":"Equifax suffered massive reputational damage: widespread criticism and a stock-price drop of more than 30% in the weeks after the breach — the reputational-damage consequence of non-compliance.","multi":false},{"id":"br7p9j","q":"In 2016, the New York State Department of Financial Services revoked a small Bitcoin company's license for failing to meet cybersecurity requirements. Which consequence is this?","a":"Loss of license to operate","why":"Loss of license: non-compliance can cost a company its license to operate entirely — especially in industries requiring certifications or licenses, like this Bitcoin company under NY DFS cybersecurity rules.","multi":false},{"id":"1q5osea","q":"A software firm fails to comply with data-protection regulations, putting it in breach of its client contracts. Which consequence category covers the clients suing for damages and terminating contracts?","a":"Contractual impacts","why":"Contractual impacts: non-compliance can put a company in breach of contract, leading to legal disputes, financial penalties, or contract termination — clients can sue for damages, terminate, or both.","multi":false},{"id":"smp5xd","q":"Compliance in the IT world refers to:","a":"Adherence to laws, regulations, standards, and policies that apply to the organization's operations","why":"Compliance = adherence to laws, regulations, standards, and policies; in IT it means ensuring systems and processes meet required security standards and regulations.","multi":false},{"id":"2rdeuz","q":"Which of these is NOT a reason compliance matters, per the course?","a":"Guaranteeing the company never suffers any incident","why":"Compliance matters for legal obligations, trust/reputation, data protection, and business continuity — but no compliance program can guarantee zero incidents.","multi":false},{"id":"1op1qdh","q":"A large corporation uses a governance structure to ensure consistent policies across the whole organization, accepting slower local responses. Which structure is it using?","a":"Centralized","why":"Large corporations typically centralize decision-making to keep policies consistent and authority clear — trading away speed of local response, which is the decentralized model's strength.","multi":false},{"id":"tizw25","q":"When should changes that might disrupt the system or workflow be scheduled?","a":"During a designated maintenance window","why":"Potentially disruptive changes should be scheduled carefully, often during a designated maintenance window, so business impact is minimized.","multi":false},{"id":"1fsqmmk","q":"A city has zoning laws preventing manufacturing facilities in residential areas. Which level of governance consideration is this?","a":"Local","why":"Local considerations include city ordinances — like zoning laws that prohibit certain business operations in certain areas. Regional would be state/province level (e.g., CCPA), national would be country law (e.g., ADA), global would be extraterritorial regulation (e.g., GDPR).","multi":false},{"id":"49b9g4","q":"Separation of duties reduces which risk?","a":"Insider threats — by preventing any single individual from having complete control over a critical process or system","why":"Separation of duties prevents any single individual from having complete control over a critical process or system — directly reducing insider-threat risk, alongside least privilege.","multi":false},{"id":"1vqu4k4","q":"An information security policy might specify that sensitive data must be encrypted both in transit and at rest, with access limited to authorized personnel. Which areas does such a policy cover?","a":"Data classification, access control, encryption, and physical security","why":"Information security policies are the cornerstone of the security posture, covering data classification, access control, encryption, and physical security — essential for confidentiality, integrity, and availability.","multi":false},{"id":"12nuabl","q":"Developers sign a compliance agreement showing they recognize and accept the data-security protocols they must follow. What is this acceptance called?","a":"Acknowledgement","why":"Acknowledgement = recognition and acceptance of compliance requirements by all relevant parties (signing the agreement). Attestation is the formal declaration that controls ARE compliant — the two are a classic pair of exam lookalikes.","multi":false},{"id":"155jazb","q":"In 2017, the Chinese government sanctioned companies for non-compliance with its new cybersecurity law — imposing warnings, fines, and confiscation of illegal income. Which consequence category is this?","a":"Sanctions","why":"Sanctions are strict measures taken by regulatory bodies to enforce compliance, ranging from restrictions on business operations to outright bans — including warnings, fines, and confiscation of illegal income.","multi":false},{"id":"3ih3hz","q":"Strategic alignment in governance means:","a":"Ensuring the organization's IT strategy aligns with its overall business objectives","why":"Strategic alignment means ensuring the IT strategy aligns with overall business objectives — one of the key reasons governance is crucial, alongside risk management, resource management, and performance measurement.","multi":false},{"id":"1as2kfp","q":"A tech company creates a board subgroup focused on managing cybersecurity risks. What is this subgroup?","a":"A cybersecurity committee","why":"Committees are board subgroups with specific focus — audit committee handles financial reporting, governance committee handles board effectiveness, and a cybersecurity committee focuses on managing cybersecurity risks.","multi":false},{"id":"13865ww","q":"Role-Based Access Control (RBAC) ensures users:","a":"Only have access to the resources necessary for their job functions","why":"RBAC assigns access based on roles within the organization — users only get resources necessary for their job functions, naturally supporting least privilege.","multi":false},{"id":"1d3wrio","q":"What is the goal of employee onboarding?","a":"Ensuring new employees are productive and engaged as quickly as possible through orientation, training, and integration","why":"Onboarding integrates new employees via orientation, training, and integration activities — the goal is productivity and engagement as quickly as possible. Offboarding handles departures smoothly and gathers feedback.","multi":false},{"id":"203oqx","q":"Which exam objectives does this section map to?","a":"OBJ 5.1 (security governance) and OBJ 5.4 (security compliance)","why":"This section is entirely Domain 5: OBJ 5.1 = summarize elements of effective security governance; OBJ 5.4 = summarize elements of effective security compliance.","multi":false},{"id":"165e1hh","q":"What is the main difference between governance and compliance?","a":"Governance is the strategic management of IT toward business objectives; compliance is adherence to laws, regulations, standards, and policies","why":"Governance = overall strategic management of IT (framework, rules, responsibilities) aligned with business objectives. Compliance = adherence to external and internal requirements — laws, regulations, standards, and policies.","multi":false},{"id":"hqrtwu","q":"Why is performance measurement a key part of governance?","a":"It puts mechanisms in place to monitor and measure the performance of IT processes","why":"Governance is crucial for risk management, strategic alignment, resource management, and performance measurement — the last meaning mechanisms that monitor and measure how well IT processes perform.","multi":false},{"id":"d3y7ns","q":"What does strategic alignment mean in governance?","a":"Ensuring the organization's IT strategy aligns with its overall business objectives","why":"Strategic alignment = ensuring IT strategy aligns with overall business objectives — a core reason governance exists, alongside risk management, resource management, and performance measurement.","multi":false},{"id":"lrtwg1","q":"An audit committee, a governance committee, and a cybersecurity committee are all examples of:","a":"Committees — subgroups of the board with specific focus areas","why":"Committees are subgroups of the board of directors, each with a specific focus — audit (financial reporting), governance (board effectiveness), cybersecurity (managing cyber risk) — allowing detailed attention to complex areas.","multi":false},{"id":"vs40pg","q":"A company's disaster recovery policy specifies that data is regularly backed up to a secure offsite location and that restores are tested. What is the relationship between this policy and business continuity?","a":"Disaster recovery is the IT-systems-and-data recovery piece that supports the broader business continuity goal","why":"Business continuity keeps critical operations running during/after disruption; disaster recovery focuses specifically on recovering IT systems and data (backups, restoration, alternative processing) — the IT subset that makes continuity possible.","multi":false},{"id":"lr7orx","q":"Which standard protects passwords even if the password database itself is compromised?","a":"Hashing and salting — so stored credentials remain secure","why":"Password standards emphasize hashing and salting: even if a password database is compromised, the actual passwords remain secure. Plaintext storage and shared credentials are precisely what standards prohibit.","multi":false},{"id":"hgn7ot","q":"An organization assigns database access so analysts can read only the tables their jobs require. Which two principles does this implement?","a":"RBAC with least privilege","why":"Access assigned by job function = RBAC; limiting users to the minimum access needed for their duties = least privilege. DAC would be owner-granted, MAC would use classification labels, and separation of duties is about splitting control, not limiting scope.","multi":false},{"id":"nkkfzg","q":"Which encryption standard does the course associate with data at rest, and why?","a":"AES — strong security with efficient performance on stored data","why":"AES is used for data at rest due to its strong security and efficient performance; RSA's public-key (PKI) nature makes it common for secure communication in transit.","multi":false},{"id":"1c6tins","q":"What should happen after a change is fully implemented, per the change management procedure?","a":"Its effects are evaluated, and the entire process is reviewed and recorded for lessons learned","why":"After implementation, the change's effects should be evaluated and the whole process reviewed and recorded — capturing lessons learned for future change projects is an explicit step of the procedure.","multi":false},{"id":"q7bpsz","q":"Secure areas such as server rooms and data centers warrant which treatment under physical security standards?","a":"Additional measures — stricter access controls and surveillance beyond the organizational baseline","why":"Physical security standards call for secure areas housing sensitive information or systems to have additional measures — stricter access controls and surveillance — beyond standard perimeter, CCTV, and keycard/biometric controls.","multi":false},{"id":"7z2la6","q":"Litigation from other businesses, customers, or employees over matters like breach of contract or product liability falls under which governance consideration?","a":"Legal considerations","why":"Legal considerations encompass contract law, intellectual property, corporate law, and employment law — with litigation (breach of contract, product liability, employment disputes) a significant legal risk requiring robust legal strategies.","multi":false},{"id":"13zjwps","q":"A compliance department generates a report listing every transaction above a set threshold and whether it was properly reviewed and approved. Which type of compliance reporting is this?","a":"Internal compliance reporting against internal policy","why":"Internal compliance reporting ensures adherence to the organization's own policies — here an internal rule requiring compliance-officer review of large transactions, reported by the internal compliance department. External reporting goes to regulators, auditors, or customers.","multi":false},{"id":"1yzve6m","q":"Which of the following are reasons compliance matters to an organization? (Select FOUR.)","a":"Legal obligations — avoiding fines and sanctions;  Trust and reputation with customers and partners;  Data protection — preventing breaches and protecting privacy;  Business continuity — resilience through disasters","why":"Compliance matters for legal obligations, trust and reputation, data protection, and business continuity (disaster-recovery and continuity standards). It cannot guarantee zero incidents, replace governance, or cut costs — inflated claims that make easy distractors.","multi":true},{"id":"1c3kutj","q":"Which statements about the GRC triad and governance are correct? (Select THREE.)","a":"Governance is the first component of the GRC triad;  Governance establishes a strategic framework aligned with objectives and regulatory requirements;  Governance directly influences guidelines, policies, standards, and procedures","why":"GRC = governance, risk, compliance — governance first. It builds the strategic framework and directly shapes every document layer below it. It must be monitored and revised as technology, regulations, and culture change, and it applies to any organization.","multi":true},{"id":"l2q3bo","q":"Which physical security elements does the course list under physical security standards? (Select FOUR.)","a":"Perimeter security such as fences, gates, and guards;  Surveillance systems like CCTV;  Access control mechanisms such as biometric scanners and keycards;  Environmental controls like fire suppression, HVAC, and power redundancy","why":"Physical security standards span perimeter (fences, gates, guards), surveillance (CCTV), access mechanisms (biometrics, keycards), and environmental controls (fire suppression, HVAC, power redundancy) — with extra rigor for server rooms and data centers. Password rules belong to a different standard category.","multi":true},{"id":"11ga63n","q":"Which activities belong to employee onboarding, and which to offboarding? Choose the THREE onboarding items. (Select THREE.)","a":"Orientation introducing the new employee to the organization;  Training to equip them with necessary skills;  Integration activities to help them become part of the team","why":"Onboarding = orientation, training, integration — aimed at fast productivity. Retrieving property, disabling access, and exit interviews are all offboarding tasks. Mixing the two lists is a favorite exam trick.","multi":true},{"id":"y36n4b","q":"An organization writes a recommended (non-binding) approach for handling phishing suspicions, a high-level commitment to data protection, mandatory password complexity rules, and step-by-step backup instructions. Which sequence names these four documents in order?","a":"Guideline, policy, standard, procedure","why":"Guidelines recommend without mandating; policies state high-level commitments; standards impose the specific often-mandatory rules that enforce a policy; procedures give the step-by-step execution. That descending hierarchy of abstraction is the course's core governance model.","multi":false},{"id":"ryn442","q":"A regulator's enforcement action restricts a company's business operations and confiscates its illegal income after a cybersecurity-law violation. Which consequence category is this, and why is it distinct from a fine?","a":"Sanction — sanctions are strict enforcement measures ranging from operational restrictions to outright bans, not merely monetary penalties","why":"Fines are monetary penalties; sanctions are broader strict measures — restrictions on operations, bans, warnings, confiscation of illegal income (China 2017 example). Keeping the two categories apart is a frequent exam discriminator.","multi":false},{"id":"p11qjh","q":"Which governance structure pairing correctly matches structure to organizational profile?","a":"A large corporation seeking consistent policies org-wide: centralized; a tech startup seeking agility and innovation: decentralized","why":"Centralized structures serve large organizations needing consistent policies and clear authority, at the cost of local responsiveness. Decentralized structures suit startups valuing quick decisions and innovation, at the cost of possible inconsistency. The choice depends on the organization, its goals, and its size.","multi":false},{"id":"lsb6a4","q":"Under an SDLC policy, which combination of controls would the course expect to find?","a":"Secure coding standards, code reviews, and software testing across requirements-to-maintenance","why":"An SDLC policy guides all stages — requirements, design, coding, testing, deployment, maintenance — and includes standards for secure coding practices, code reviews, and software testing, ensuring software is high-quality, secure, and meets user needs.","multi":false},{"id":"f68q3z","q":"A security architect must choose an access control model for a military system where data sensitivity labels — not individual owners — must decide every access. Which model is required?","a":"MAC — labels or classifications determine access","why":"MAC uses labels or classifications to determine access and is the model associated with government and military settings where data sensitivity outranks ownership. DAC gives the resource owner discretion; RBAC assigns by role.","multi":false},{"id":"tckyif","q":"An organization must demonstrate to a regulator, by law, that its manufacturing meets good manufacturing practices — while separately proving to its own management that internal spending-approval rules were followed. Which reporting types are these, in order?","a":"External compliance reporting; internal compliance reporting","why":"External reporting demonstrates compliance to regulatory bodies, auditors, or customers and is often mandated by law or contract (FDA/GMP). Internal reporting demonstrates adherence to the organization's own policies, conducted by the internal audit team or compliance department.","multi":false},{"id":"op0eqc","q":"Which scenario correctly demonstrates ACKNOWLEDGEMENT rather than attestation?","a":"Employees sign a compliance agreement recognizing and accepting the data-security protocols they must follow","why":"Acknowledgement = recognition and acceptance of compliance requirements by relevant parties — signing the agreement. Attestation = the formal declaration that controls ARE compliant (the CISO statement). The other options are a fine and due diligence.","multi":false},{"id":"j5ybn","q":"A US company with no EU offices is fined after processing the personal data of EU residents through its app. Which governance consideration makes this possible, and what broader challenge does it illustrate?","a":"Global consideration — GDPR applies extraterritorially; the broader challenge is conflict of laws across jurisdictions","why":"GDPR is a global consideration: even companies outside the EU must comply when they collect or process EU citizens' data. Navigating such extraterritorial laws against differing local regimes is the conflict-of-laws challenge.","multi":false},{"id":"12at6mz","q":"Which non-compliance consequence is BEST illustrated by a data breach so damaging that a credit bureau's stock price falls more than 30% within weeks?","a":"Reputational damage","why":"Equifax (2017): 147 million people exposed, widespread criticism, and a stock-price drop over 30% in the weeks following — the textbook reputational-damage case. Fines would be monetary penalties; license loss would end the right to operate.","multi":false},{"id":"1ria1k5","q":"A company signs a document expressing mutual intent to explore a future partnership — broad strokes, no binding specifics. Which document is it, and which document would later formalize who is responsible for what?","a":"An MOU now; an MOA later","why":"An MOU is the less binding declaration of mutual intent; an MOA is the formal document outlining specific responsibilities and roles once the parties commit. NDA/SLA and MSA/SOW pairs serve confidentiality/service and umbrella/project purposes respectively.","multi":false},{"id":"6r7kd6","q":"Which automated compliance capability does the course describe for a bank?","a":"Automatically generating reports detailing suspicious transactions for anti-money-laundering compliance","why":"Automation streamlines collection, improves accuracy, and enables real-time monitoring — the course's banking example is automatically generating reports on suspicious transactions, simplifying the compliance reporting process.","multi":false},{"id":"glcmu","q":"A board is so large that detailed attention to financial reporting and to cybersecurity risk suffers. Which governance mechanism addresses this, and how?","a":"Committees — board subgroups (e.g., audit committee, cybersecurity committee) focus on specific complex areas","why":"Committees are subgroups of the board, each with a specific focus — audit committee oversees financial reporting, a cybersecurity committee manages cyber risk — allowing detailed attention to complex areas the full board can't cover deeply.","multi":false},{"id":"13gpd8","q":"Which statements about the change management procedure are correct? (Select FOUR.)","a":"The need for change is identified and impacts assessed first;  A plan is developed covering implementation, participants, and resources;  Significant changes should be tested before implementation;  Every change should have a rollback plan, and disruptive changes go in maintenance windows","why":"The procedure: identify/assess → plan → implement in stages (after testing, with rollback ready, inside maintenance windows when disruptive) → review and record lessons. The last three options describe exactly the failures change management exists to prevent.","multi":true},{"id":"btpnga","q":"Which items does the course associate with encryption and password standards? (Select THREE.)","a":"AES for data at rest due to strong security and efficient performance;  RSA for secure communication owing to its public-key infrastructure nature;  Hashing and salting so compromised password databases don't expose passwords","why":"Encryption standards: AES at rest (strong + efficient), RSA in transit (PKI). Password standards: hashing and salting protect stored credentials. Plaintext storage and shared passwords are anti-patterns the standards explicitly prohibit.","multi":true},{"id":"17cmjf3","q":"Which are genuine non-compliance consequences with correct real-world anchors from the course? (Select FOUR.)","a":"Fines — GDPR ceiling of €20M or 4% of global turnover;  Sanctions — China's 2017 actions: warnings, fines, confiscated illegal income;  Reputational damage — Equifax, 147M people, stock down over 30%;  Loss of license — NY DFS revoked a Bitcoin company's license in 2016","why":"The five consequences: fines, sanctions, reputational damage, loss of license, and contractual impacts. The four real anchors are the GDPR ceiling, China's sanctions, Equifax's reputational collapse, and the NY DFS license revocation. The last two options are invented nonsense.","multi":true},{"id":"yj2uwk","q":"Which statements distinguish attestation from acknowledgement correctly? (Select THREE.)","a":"Attestation is a formal declaration by a responsible party that processes and controls are compliant;  Acknowledgement is the recognition and acceptance of compliance requirements by all relevant parties;  A developer attesting they followed security protocols differs from that developer signing the compliance agreement acknowledging the protocols","why":"Attestation = declaring compliance exists (formal, after the fact). Acknowledgement = accepting the requirements (signing the agreement). The developer example shows one person doing both. They are not interchangeable, and acknowledgement certifies nothing about test results.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
</div>
<script id="back-lib-script">
(function () {
  if (window.__backBtnInit) return; window.__backBtnInit = true;
  function lib() { return "../library.html"; }
  function resultVisible() {
    var rs = document.getElementById('result-screen');
    if (rs && !rs.classList.contains('hidden') && rs.offsetParent !== null) return true;
    var big = document.querySelector('.score-big');
    if (big) {
      var el = big;
      while (el && el !== document.body) {
        if (el.classList && el.classList.contains('hidden')) return false;
        el = el.parentElement;
      }
      return big.offsetParent !== null;
    }
    return false;
  }
  function ensure() {
    if (!resultVisible() || document.getElementById('back-lib-btn')) return;
    var a = document.createElement('a');
    a.id = 'back-lib-btn';
    a.href = lib();
    a.textContent = '\u2190 Back to Library';
    a.setAttribute('style', 'position:fixed;left:18px;bottom:18px;z-index:9999;' +
      'padding:11px 20px;border-radius:999px;font:600 14px/1 "Segoe UI",system-ui,sans-serif;' +
      'text-decoration:none;color:#fff;background:linear-gradient(135deg,#f0883e,#e36414);' +
      'box-shadow:0 4px 18px rgba(240,136,62,.45);border:1px solid rgba(255,255,255,.25);');
    document.body.appendChild(a);
  }
  setInterval(ensure, 400);
  if (document.readyState !== 'loading') ensure();
  else document.addEventListener('DOMContentLoaded', ensure);
})();
</script>
</body>
