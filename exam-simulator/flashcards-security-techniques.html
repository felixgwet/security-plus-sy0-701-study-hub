<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #f0883e; --accent-dim: rgba(240,136,62,.14);
    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .topbar .grow { flex: 1; }
  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }
  h1 { font-size: 24px; margin: 10px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }
</style>

  <div class="topbar">

    <span class="grow"></span>

  <p class="sub">Tap the card to flip it, then grade yourself honestly &mdash; the deck remembers what you know and will prioritize your weak cards.</p>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span>cards</span></div>

  <script>
    var DECKS = [{"label":"Section 20 · Security Techniques","cards":[{"id":"16bxtur","q":"A site survey reveals strong Wi-Fi signal in the company parking lot. Which remediation set is BEST?","a":"Relocate WAPs toward the center, lower transmit power, and use unidirectional antennas aimed inward","why":"Signal leaking past the walls enables parking-lot attacks. Central placement, reduced power, and inward-aimed unidirectional antennas keep coverage inside.","multi":false},{"id":"slrl51","q":"An attacker captures a WPA3 authentication exchange and tries to crack the password offline. Why does this fail?","a":"SAE's Diffie-Hellman-based key establishment means captured handshake data cannot be used for offline password guessing","why":"SAE replaces the WPA2 four-way handshake. Even with a weak password, captured data yields nothing for an offline dictionary attack.","multi":false},{"id":"vg8vxv","q":"A hotel offers free open Wi-Fi with no password. Which WPA3-era technology encrypts each guest's traffic without requiring authentication?","a":"Enhanced Open (OWE)","why":"OWE provides individualized encryption between client and AP on open networks, defeating passive eavesdropping — without adding a password requirement.","multi":false},{"id":"1nacj98","q":"Which statement about PEAP vs. EAP-TTLS is correct?","a":"EAP-TTLS requires a certificate only on the server, while PEAP requires certificates on both server and client","why":"Both wrap authentication in a TLS tunnel. PEAP = mutual (dual-sided) certificates; EAP-TTLS = server certificate only, carrying a second protocol inside.","multi":false},{"id":"1onj531","q":"A developer wants to find SQL injection flaws by examining the source code before release. Which technique applies?","a":"Static code analysis (SAST)","why":"SAST reviews source pre-execution for injection flaws, missing validation, buffer overflows, XSS. DAST/fuzzing/stress test the running app instead.","multi":false},{"id":"ecstb1","q":"Which cookie attribute should be set to reduce the risk of a successful cross-site request forgery attack?","a":"SameSite","why":"SameSite restricts which origins may send the cookie, blunting CSRF. Secure = HTTPS-only; HttpOnly = blocks script access (XSS protection).","multi":false},{"id":"1yafce9","q":"A company downloads a vendor's program and wants proof it is genuine and unmodified since the vendor built it. Which mechanism provides this?","a":"Code signing — the vendor's private-key signature verifies with the shipped public key certificate","why":"Signing proves authenticity and integrity (not bug-freeness). The OS verifies the signature before trusting the executable.","multi":false},{"id":"s07nae","q":"A visitor plugs a laptop into a corporate ethernet jack. NAC places it in an isolated subnet where it can only fetch antivirus updates and patches. Why?","a":"It failed the health inspection and is in quarantine until remediated","why":"Failed devices go to a screened quarantine subnet for remediation — they can receive fixes but cannot communicate with the rest of the network.","multi":false},{"id":"1bpsg1o","q":"Which email protocol lets a domain owner publish a policy instructing receivers to REJECT messages that fail SPF or DKIM checks?","a":"DMARC","why":"DMARC builds on SPF/DKIM and enforces the domain owner's disposition policy. It is the minimum anti-phishing/BEC control for every email server.","multi":false},{"id":"eyz5oy","q":"An EDR platform automatically cuts an infected laptop off from the network to stop spread, then supplies the analyst a timeline of endpoint activity. Which EDR steps are these?","a":"Response (isolation) and investigation (forensic timeline)","why":"EDR detects, then alerts or takes automated playbook actions (isolation), and provides investigation tooling (activity timelines, forensic data) before remediation.","multi":false},{"id":"1s418hz","q":"Which solution correlates events across email, endpoints, servers, cloud workloads, AND network in a single platform?","a":"XDR","why":"XDR integrates multiple protection layers into one correlated platform. EDR covers endpoints only; FIM watches file hashes; NAC controls admission.","multi":false},{"id":"a03zj3","q":"A UBA system flags a user who only ever reads data but is suddenly modifying and deleting records at 2 AM. This illustrates which UBA benefit?","a":"Early/anomalous behavior detection of a potentially compromised account, enabling rapid response","why":"UBA baselines normal behavior and flags deviations — late-night activity and new data-modification patterns suggest compromise (or insider threat).","multi":false},{"id":"1982eot","q":"Which THREE statements about WPA3 are true? (Choose THREE.)","a":"SAE protects against offline dictionary attacks;  Enhanced Open (OWE) encrypts traffic on open networks;  It replaces AES-CCMP with AES-GCMP and protects management frames","why":"WPA3's four features: SAE, Enhanced Open, AES-GCMP (with a 192-bit enterprise option), and management frame protection. TKIP and WEP are legacy.","multi":true},{"id":"140rm97","q":"Which THREE are types of web filtering? (Choose THREE.)","a":"Agent-based filtering;  URL scanning against known-malicious databases;  Reputation-based filtering using third-party scores","why":"Web filtering types: agent-based, centralized proxies, URL scanning, content categorization, block rules, and reputation-based. The others are unrelated techniques.","multi":true},{"id":"1lxqfdy","q":"Which TWO port assignments are correct? (Choose TWO.)","a":"IMAPS — 993;  SMTPS — 587","why":"Secure mail/web: SMTPS 587, POP3S 995, IMAPS 993, HTTPS 443. The distractors pair secure protocols with insecure ports.","multi":true},{"id":"5w3q8d","q":"Which TWO correctly distinguish static from dynamic code analysis? (Choose TWO.)","a":"SAST reviews source code before execution;  DAST analyzes the application while it is running and finds runtime errors and memory leaks","why":"SAST = pre-run source review; DAST = running-app testing (fuzzing, stress testing). They complement each other.","multi":true},{"id":"rhixmj","q":"Where should wireless access points be placed to balance coverage and security?","a":"At the center of the facility, away from windows and external walls, mounted high","why":"Central placement keeps the signal inside the building. WAPs near windows/walls leak coverage into the parking lot where attackers can sit and attack.","multi":false},{"id":"1rcc9bb","q":"If a WAP must be installed on an exterior wall, which antenna type should be used?","a":"Unidirectional — aims the signal inward toward the facility","why":"Unidirectional antennas focus the signal into the building instead of broadcasting it outside where attackers could use it.","multi":false},{"id":"olyjbq","q":"Which 2.4 GHz channels should be used because they do not overlap?","a":"1, 6, and 11","why":"Each 2.4 GHz channel is 22 MHz wide with only 100 MHz total. Channels 1, 6, and 11 are the only non-overlapping set; anything else causes adjacent-channel interference.","multi":false},{"id":"1772cyy","q":"What is the purpose of a wireless site survey?","a":"To plan the network: test RF interference and identify optimal AP locations before installation","why":"A site survey scans the airwaves for existing networks and interference, then determines where APs should go for required coverage and capacity.","multi":false},{"id":"155m1wp","q":"A heat map shows strong signal strength leaking into the company parking lot. What should be done?","a":"Reposition the WAPs, reduce signal strength, or aim unidirectional antennas inward","why":"Signal leaking outside the walls lets attackers in the parking lot attack the network. Reposition, lower power, or direct antennas inward.","multi":false},{"id":"b7zuv6","q":"Why is WEP considered insecure?","a":"It relies on weak RC4 with a 24-bit initialization vector — modern laptops can crack it in about three minutes","why":"WEP's static key system and weak RC4/24-bit IV allow key reconstruction from traffic analysis. Never use WEP.","multi":false},{"id":"1n46dg8","q":"What did WPA add over WEP, and why is it still insecure?","a":"TKIP, which dynamically generates a new 128-bit key per packet, but it inherited WEP weaknesses and lacks sufficient integrity checks","why":"WPA was an interim patch for WEP hardware. TKIP fixed key reuse but retained fundamental weaknesses; WPA2 (AES+CCMP) replaced it in 2004.","multi":false},{"id":"biisb9","q":"Which WPA3 feature protects against offline dictionary attacks even when the password is weak?","a":"SAE (Simultaneous Authentication of Equals)","why":"SAE replaces the WPA2 four-way handshake with a Diffie-Hellman-based protocol — captured handshake data cannot be used offline to guess the password.","multi":false},{"id":"v3seuo","q":"Enhanced Open (OWE) improves security for which type of network?","a":"Open (password-less) public Wi-Fi — it adds individualized encryption without adding authentication","why":"OWE encrypts each client's traffic to the AP on open networks, defeating passive eavesdropping. It is not full authentication security.","multi":false},{"id":"1sdn59h","q":"WPA3 protects management frames primarily to:","a":"Prevent eavesdropping, forging, and tampering with frames like deauthentications that were previously sent unprotected","why":"Management frame protection (required in WPA3) stops deauth-style attacks that disrupted connections in WPA2.","multi":false},{"id":"1ylt7ov","q":"Which statement comparing RADIUS and TACACS+ is correct?","a":"TACACS+ separates authentication, authorization, and accounting for granular control, uses TCP, and encrypts the entire authentication process","why":"RADIUS combines AAA over UDP; TACACS+ splits the three functions, runs over TCP, and encrypts the full authentication payload — better for device administration.","multi":false},{"id":"9jvu8m","q":"What is the key difference between PEAP and EAP-TTLS?","a":"EAP-TTLS requires a certificate only on the server; PEAP requires certificates on both server and client","why":"Both tunnel auth inside TLS. PEAP = mutual certificates (dual-sided); EAP-TTLS = server-side certificate only, carrying a second auth protocol inside the tunnel.","multi":false},{"id":"1ymwlug","q":"EAP-FAST was developed by Cisco to replace which vulnerable protocol?","a":"LEAP (Lightweight EAP)","why":"EAP-FAST uses Protected Access Credentials (PAC) to build a TLS tunnel, allowing secure re-authentication while roaming — a secure LEAP replacement.","multi":false},{"id":"vxbvjv","q":"Why is back-end input validation still required when front-end validation exists?","a":"Front-end validation alone can be bypassed by an attacker — the server must re-check data before use","why":"Validation rules (format, length, character sets) must be enforced on the server; client-side checks are only a convenience layer that attackers bypass.","multi":false},{"id":"1unlenj","q":"Which cookie attribute prevents client-side scripts from reading the cookie (helping stop XSS cookie theft)?","a":"HttpOnly","why":"HttpOnly keeps the cookie out of the DOM. Secure = HTTPS-only transmission; SameSite restricts cross-origin requests, reducing CSRF. Also: never use persistent cookies for session verification.","multi":false},{"id":"o7kf6d","q":"Static code analysis (SAST) is best described as:","a":"Reviewing the source code before the program runs to find vulnerabilities like SQLi and missing validation","why":"SAST examines source code pre-execution; the tool must support the language. Human review = manual code review by a different programmer.","multi":false},{"id":"p2mx5v","q":"Fuzzing is a dynamic testing technique that:","a":"Injects massive amounts of random/malformed data to make the system crash and expose errors or memory leaks","why":"Fuzzing and stress testing are the two common DAST methods — fuzzing hunts crashes via malformed input; stress testing pushes extreme load.","multi":false},{"id":"161o63h","q":"What does a valid code signature guarantee?","a":"That the software is genuinely from the claimed author and has not been altered since signing","why":"Signing = hash the file, encrypt the hash with the developer's private key. Receivers verify with the public key — authenticity and integrity, NOT bug-free code.","multi":false},{"id":"1r9yk9x","q":"What is the purpose of sandboxing?","a":"To isolate untrusted/running programs, limiting the resources they can access and changes they can make","why":"Browsers sandbox web code; sandboxes can also host different OSes for safe testing — more comprehensive than anti-malware alone.","multi":false},{"id":"mz7sh8","q":"Under NAC, what happens to a device that fails the security inspection?","a":"It is placed into a quarantine/screened subnet for remediation and cannot communicate with the rest of the network","why":"Failing devices go to a digital quarantine area where they can receive AV updates and patches but are logically isolated until they pass inspection.","multi":false},{"id":"12o89n8","q":"Which NAC agent type suits a BYOD campus where users connect their own laptops?","a":"Non-persistent agent — downloaded via captive portal, scans the device, then deletes itself","why":"Non-persistent agents work for devices the org doesn't own: connect to Wi-Fi, click the portal link, agent scans and self-deletes. Persistent agents fit corporate-managed devices.","multi":false},{"id":"wwgooa","q":"Which IEEE standard provides port-based network access control and underpins most NAC solutions?","a":"802.1x","why":"802.1x is the port-based NAC standard; modern NAC products build additional features on top of it.","multi":false},{"id":"kdia0m","q":"A NAC rejects a user's laptop attempting to join the server-management subnet because user devices are not authorized there. Which NAC method is this?","a":"Role-based (adaptive NAC) — re-evaluating authorization based on what the device tries to do","why":"Adaptive/role-based NAC re-evaluates when a device attempts a new function — a user laptop joining a server subnet is rejected, a domain-joining server is allowed.","multi":false},{"id":"185b8r9","q":"Which web filtering method is most effective for remote and mobile workers?","a":"Agent-based filtering — the policy follows the device on any network","why":"Agents enforce policy on the device itself, so filtering works on corporate Wi-Fi, public hotspots, and home networks alike.","multi":false},{"id":"3uifei","q":"How does DNS filtering block access to a website?","a":"The DNS server refuses to translate the blocked domain name into an IP address","why":"DNS filtering stops name resolution for blocked domains — without an IP, the browser cannot reach the site. Web filtering inspects HTTP/content instead.","multi":false},{"id":"vvjlsk","q":"Reputation-based filtering decides whether to allow a website based on:","a":"A third-party reputation score reflecting the site's history of hosting malware or phishing","why":"Third-party reputation services score domains by history; low-reputation sites (past phishing/malware) get blocked.","multi":false},{"id":"tgzzs7","q":"Which email authentication method adds a digital signature to message headers that receivers verify against a public key in the sender's DNS?","a":"DKIM","why":"DKIM signs headers; the public key published in DNS validates origin and that content was not modified in transit.","multi":false},{"id":"x1z95z","q":"SPF prevents email spoofing by:","a":"Checking the sender's IP address against a list of authorized IPs published in the sender domain's DNS records","why":"SPF lists which servers may send for a domain. Email from an IP not in the SPF record is marked spam or rejected.","multi":false},{"id":"1ynimol","q":"What does DMARC add beyond DKIM and SPF?","a":"A published domain-owner policy telling receivers how to handle messages that fail SPF/DKIM checks (e.g., reject them)","why":"DMARC ties DKIM/SPF results to an enforced policy — reject/quarantine failures — and is the minimum anti-BEC/phishing protection every mail server should have.","multi":false},{"id":"m9htzj","q":"Which function is an email gateway responsible for?","a":"Routing, security scanning for spam/phishing/malware, policy enforcement, and email encryption/decryption","why":"The gateway is the entry/exit point for all mail: SMTP-based routing, malicious-content scanning, blocking sensitive outbound mail, and encrypting/decrypting messages.","multi":false},{"id":"whhfxn","q":"What is the FIRST step in the EDR process?","a":"Data collection from endpoints — processes, registry changes, memory usage, network traffic","why":"EDR's six steps: collect → consolidate centrally → detect (signature + behavior) → alert/respond (e.g., isolate endpoint) → investigate (timelines, forensics) → remediate (remove malware, restore baseline).","multi":false},{"id":"o61joy","q":"File integrity monitoring detects tampering by:","a":"Hashing critical files and comparing them against a database of known-good baseline hashes","why":"FIM agents continuously hash critical files (binaries, configs); any unauthorized change vs. the known-good baseline raises an alert. Often included in EDR/XDR.","multi":false},{"id":"3ckhwq","q":"How does XDR differ from EDR?","a":"XDR correlates data across multiple layers — email, endpoint, network, servers, cloud workloads — in one integrated platform","why":"EDR is endpoint-focused. XDR extends detection and response across all security layers with automatic correlation, replacing separate siloed tools.","multi":false},{"id":"ose3nb","q":"UBA systems primarily detect threats by:","a":"Using machine learning to baseline normal user behavior and flag anomalies (late-night logins, unusual file access, bulk downloads)","why":"UBA/UEBA baselines behavior and alerts on deviations — catching insider threats and compromised credentials that signature tools miss.","multi":false},{"id":"k5b7za","q":"What does the E in UEBA add?","a":"Monitoring of entities such as routers, servers, and endpoints in addition to user accounts","why":"UEBA = User and Entity Behavior Analytics — entities (non-user devices) are monitored alongside accounts.","multi":false},{"id":"zuw7hw","q":"Which secure protocol should replace Telnet for remote command-line administration?","a":"SSH — encrypted with strong password/public-key authentication","why":"Telnet sends credentials in plaintext. SSH encrypts everything; always select SSH instead of Telnet.","multi":false},{"id":"1qtrhfv","q":"Which port does SMTPS use?","a":"587","why":"SMTP 25 (plaintext), SMTPS 587 (encrypted); POP3 110 / POP3S 995; IMAP 143 / IMAPS 993; HTTP 80 / HTTPS 443.","multi":false},{"id":"5xf6xb","q":"Which transport method should be chosen when data accuracy matters most, such as web or email?","a":"TCP — connection-oriented with acknowledgements, retransmission, and sequencing","why":"TCP guarantees error-free, in-order delivery. UDP trades reliability for speed — best for streaming/gaming where lost frames don't matter.","multi":false},{"id":"h9zzj6","q":"Running a web server on port 8888 instead of 80 primarily provides:","a":"Obscurity — services are less predictable to attackers, but it is no substitute for encryption and authentication","why":"Non-standard ports add a thin obscurity layer; attackers target well-known ports. Never treat port changes as real security — document carefully if used.","multi":false},{"id":"ed3ueb","q":"Which port range is reserved for well-known system services?","a":"0–1023","why":"Well-known 0–1023; registered 1024–49151 (applications); dynamic/private 49152–65535 (randomly assigned client-side). Apply least privilege: open only necessary ports.","multi":false},{"id":"dtitc9","q":"Stress testing evaluates an application by:","a":"Simulating extreme loads (thousands/millions of users) to find bottlenecks and test recovery","why":"Stress testing checks stability under intense load and failure recovery; fuzzing hunts crashes via malformed input. Both are dynamic analysis.","multi":false},{"id":"1dnvr5y","q":"Which attack demonstrated that WPA2 was vulnerable despite AES?","a":"KRACK (2016) — key reinstallation attacks against the WPA2 handshake","why":"KRACK attacked the WPA2 four-way handshake itself, prompting the move to WPA3's SAE.","multi":false},{"id":"19inims","q":"Which practice directly counters the risk of parking-lot wireless attacks after a heat map shows signal leakage?","a":"Repositioning access points centrally and reducing transmit power so coverage stays within the facility","why":"Heat maps reveal leaks; remediation is physical: move APs away from exterior walls/windows, lower power, or aim unidirectional antennas inward.","multi":false},{"id":"1l7uaus","q":"Which EAP method was created by Cisco to let users re-authenticate securely while roaming without a full authentication each time?","a":"EAP-FAST with Protected Access Credentials","why":"EAP-FAST uses PACs to establish a TLS tunnel for fast re-authentication; it replaced the vulnerable Lightweight EAP (LEAP).","multi":false},{"id":"1fj128y","q":"An organization wants filtering that follows laptops off the corporate network. Which web filtering method fits?","a":"Agent-based web filtering installed on each device","why":"Agents enforce policy on the device itself — corporate network, public Wi-Fi, or home. Proxies and gateway filters only see on-network traffic.","multi":false},{"id":"1vmrkjb","q":"Which statement about NAC agents is TRUE?","a":"Non-persistent agents download via a captive portal, scan, and delete themselves — suited to unmanaged/BYOD devices","why":"Persistent agents live on managed corporate devices; non-persistent agents run from a portal link and vanish — the campus/BYOD model.","multi":false},{"id":"1fgt8sx","q":"Which email DNS record type authorizes which mail servers may send on behalf of a domain?","a":"SPF record","why":"SPF publishes authorized sending IPs in DNS. DKIM publishes a public key for signature verification; DMARC publishes the failure-handling policy.","multi":false},{"id":"j9n9x2","q":"A read-only employee account suddenly starts modifying records at odd hours and accessing HR data it never touches. Which tool flags this FIRST?","a":"User behavior analytics (UBA/UEBA)","why":"UBA baselines normal behavior via machine learning and alerts on deviations — insider threats and compromised accounts that signature tools miss.","multi":false},{"id":"i5rkv5","q":"Which deployment model for an email gateway gives the organization the MOST control (at the cost of self-maintenance)?","a":"On-premise","why":"On-premise = full control, you maintain it. Cloud = scalability and less maintenance but the provider's security limits apply. Hybrid balances both.","multi":false},{"id":"29lnla","q":"FIM alerts on a changed system binary. Which method produced the alert?","a":"Comparing the file's current hash to a known-good baseline hash","why":"File integrity monitoring hashes critical files and compares them against stored known-good digests — any unauthorized change triggers an alert.","multi":false},{"id":"ycb3rg","q":"Which pair is matched correctly for secure remote administration?","a":"SSH — encrypted sessions with public-key authentication, replacing plaintext Telnet","why":"SSH encrypts credentials and data; Telnet, FTP, and HTTP are plaintext equivalents. Always pick the encrypted variant.","multi":false},{"id":"1jzl895","q":"Why do enterprises manage patches through a central update server instead of letting endpoints self-update via Windows Update?","a":"Central management allows testing patches before deployment — automatic endpoint updates bypass organizational testing","why":"The update server (e.g., MECM/WSUS model) enforces the test-then-deploy discipline; endpoints with Windows Update enabled would install untested patches immediately.","multi":false},{"id":"1xj2qel","q":"Which cookie practice BEST prevents session hijacking?","a":"Generating a fresh session cookie at each authentication and never using persistent cookies for session verification","why":"Fresh per-authentication cookies limit theft windows. Add Secure (HTTPS-only), HttpOnly (no script access), and SameSite (CSRF reduction).","multi":false},{"id":"qfsvac","q":"Which statement about port numbers is TRUE?","a":"Well-known ports 0–1023 identify system services; registered 1024–49151 serve applications; dynamic 49152–65535 are randomly assigned to clients","why":"Know the three ranges. Least privilege applies: open only required ports; non-default ports add obscurity, not security.","multi":false},{"id":"bnuled","q":"A company wants to force all web traffic to encrypted connections. Which firewall change accomplishes this?","a":"Open port 443 and close/block port 80","why":"To force HTTPS, allow 443 and block 80 — the insecure channel disappears, and all traffic must use encryption.","multi":false},{"id":"1laps69","q":"Manual code review differs from SAST in that it:","a":"Is performed by a human — ideally a different programmer than the author — to catch mistaken assumptions and knowledge gaps","why":"SAST = automated source analysis; manual code review = human inspection, best done by someone other than the original author.","multi":false},{"id":"1b84n7l","q":"Which THREE are features introduced in WPA3? (Choose THREE.)","a":"Simultaneous Authentication of Equals (SAE);  Enhanced Open / Opportunistic Wireless Encryption;  Management frame protection","why":"WPA3 adds SAE, Enhanced Open, AES-GCMP, and management frame protection. TKIP/RC4/static keys are WEP/WPA-era legacy.","multi":true},{"id":"l1mghi","q":"Which THREE are functions of an email gateway? (Choose THREE.)","a":"Scanning incoming and outgoing mail for spam, phishing, and malware;  Enforcing policy, such as blocking sensitive outbound attachments;  Encrypting outgoing and decrypting incoming email","why":"The gateway handles routing, security scanning, policy enforcement, and encryption/decryption — the entry/exit point for all enterprise email.","multi":true},{"id":"1c5d5qz","q":"Which TWO are methods of dynamic application security testing? (Choose TWO.)","a":"Fuzzing — random/malformed input to force crashes;  Stress testing — extreme simulated load to find bottlenecks","why":"DAST tests running software; its two common methods are fuzzing and stress testing. SAST and manual review are static; signing is integrity.","multi":true},{"id":"1widw7v","q":"Which TWO are NAC access-decision factors beyond device health? (Choose TWO.)","a":"Time-based schedules (deny logins outside approved windows);  Role-based adaptive checks (reject a user laptop joining a server subnet)","why":"NAC decisions can use time, location (geo-IP/GPS), role (adaptive), and rule-based logic — plus the base health policy.","multi":true},{"id":"7n02qb","q":"A consultant is hired to secure a new office's wireless. Which sequence of activities is correct?","a":"Conduct a site survey first (scan for existing networks/interference, pick optimal AP locations), install, then produce a heat map to verify coverage and leaks","why":"Survey before install (plan placement), heat map after (verify). The heat map then drives fixes: reposition APs, lower power, or aim unidirectional antennas inward.","multi":false},{"id":"1g6cpyn","q":"Two nearby WAPs on the same channel cause collisions and constant retransmissions, slowing the network. This is:","a":"Co-channel interference — overlapping coverage on the same frequency forces retransmission","why":"Same channel + overlapping coverage = co-channel interference. Channels too close together (e.g., 1/3/6) = adjacent channel interference. In 2.4 GHz, stick to 1, 6, 11.","multi":false},{"id":"20urkp","q":"An attacker deauthenticates users by forging management frames, which were sent unprotected in WPA2. Which WPA3 feature directly addresses this?","a":"Management frame protection — the frames critical to maintaining connections can no longer be eavesdropped, forged, or tampered with","why":"WPA3 requires protected management frames, killing deauth-based disruption. SAE fixes the handshake; OWE fixes open networks; GCMP upgrades the cipher.","multi":false},{"id":"1n39la0","q":"Which statement about RADIUS and TACACS+ is TRUE?","a":"TACACS+ uses TCP, encrypts the entire authentication process, and separates authentication, authorization, and accounting for granular control","why":"RADIUS (UDP) bundles AAA and encrypts only the password field. TACACS+ (TCP) separates AAA and encrypts everything — preferred for device admin.","multi":false},{"id":"15mfhx8","q":"A security team needs to validate that a web app survives 50,000 concurrent users without bottlenecks and recovers cleanly from failure. Which DAST method applies?","a":"Stress testing","why":"Stress testing evaluates stability and recovery under extreme load and validates load balancing. Fuzzing instead injects malformed data hunting crashes.","multi":false},{"id":"1rnvmaz","q":"Which combination of cookie settings BEST protects a session cookie?","a":"Fresh cookie issued per authentication, with Secure, HttpOnly, and SameSite attributes","why":"Never use persistent cookies for session verification; regenerate at each login. Secure = HTTPS-only, HttpOnly = no script access, SameSite = CSRF mitigation.","multi":false},{"id":"10u62p5","q":"A signed application from a breached vendor (their signing keys stolen) must be blocked immediately across the fleet. Which AppLocker-style rule enables this fastest?","a":"A publisher rule blocking that vendor's certificate","why":"Publisher rules key on the code-signing certificate: everything signed by that vendor is blocked in one move. Hash rules need every file's digest; path rules are bypassable.","multi":false},{"id":"1s8rd18","q":"Which email defense-in-depth stack correctly orders authentication mechanisms from signature to policy?","a":"DKIM signs/verifies content origin, SPF authorizes sending IPs, DMARC publishes the enforcement policy for failures","why":"DKIM = cryptographic signature verified via DNS public key; SPF = authorized sender IP list in DNS; DMARC = domain-owner policy (reject/quarantine) applied when the first two fail.","multi":false},{"id":"gtqv7m","q":"An XDR platform's core advantage over separate EDR + email gateway + network tools is:","a":"Automatic correlation of data across all security layers, so threats spanning email→endpoint→network are detected faster with simpler response","why":"XDR's value is cross-layer correlation — a campaign visible in one layer alone looks benign; correlated, it's obvious. EDR alone is endpoint-limited.","multi":false},{"id":"p21tr0","q":"A NAC rule states: 'If a device is a user laptop AND it attempts to join the server-management VLAN, deny; if it is a domain-joining server, allow.' Which NAC method is this?","a":"Rule-based NAC — complex admission logic of if/then statements","why":"Explicit if/then logical statements = rule-based NAC. (Role-based adaptive NAC re-evaluates by device role; this scenario is phrased as pure rules.)","multi":false},{"id":"resxx4","q":"Which UBA/UEBA capability is MOST valuable against insider threats?","a":"Detecting deviations from an individual's established behavior baseline, such as accessing sensitive data the user never touches","why":"Insiders pass every perimeter control; UBA catches them when their behavior departs from their own baseline — accessing HR/financial data or bulk-downloading files.","multi":false},{"id":"b1e5cj","q":"Which secure-protocol recommendation is CORRECT for protecting file transfers against on-path eavesdropping?","a":"Use SFTP, which tunnels transfers through an encrypted SSH connection","why":"SFTP encrypts via SSH. FTP and Telnet are plaintext; a non-standard port is obscurity, not encryption.","multi":false},{"id":"13uixl4","q":"Which THREE are true about WPA3's SAE? (Choose THREE.)","a":"It replaces the WPA2 pre-shared-key four-way handshake;  It is based on the Diffie-Hellman key agreement;  Captured handshake data cannot be used for an offline dictionary attack","why":"SAE = Simultaneous Authentication of Equals: Diffie-Hellman-based, replaces the 4-way handshake, and protects even weak passwords from offline guessing.","multi":true},{"id":"sxtmhf","q":"Which THREE are indicators that a NAC deployment is functioning as intended? (Choose THREE.)","a":"Connecting devices are placed in a holding area while scanned;  Failing devices are quarantined in a screened subnet and can only receive remediation updates;  Devices regain full access only after passing inspection","why":"NAC flow: hold → inspect → admit or quarantine. Quarantine must be logically isolated (no payroll access), and VPN devices are also subject to inspection.","multi":true},{"id":"weuitg","q":"Which TWO correctly pair a protocol with its secure replacement? (Choose TWO.)","a":"Telnet → SSH;  FTP → SFTP","why":"Always upgrade toward the encrypted variant: SSH over Telnet, SFTP over FTP, HTTPS/SMTPS/IMAPS over their plaintext counterparts.","multi":true},{"id":"y5m439","q":"Which TWO statements about UEBA are correct? (Choose TWO.)","a":"It uses machine learning to build a baseline of normal behavior;  UEBA extends monitoring to entities like routers, servers, and endpoints — not just user accounts","why":"UBA/UEBA learns per-user/entity baselines and flags deviations; anomalies may be benign (working late) and need analyst review.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
</div>
