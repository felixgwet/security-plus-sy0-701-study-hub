  <script>
    var DECKS = [{"label":"Section 13 · Cyber Resilience","cards":[{"id":"1i5ox3q","q":"A streaming service must stay online through hardware failures and traffic surges. Architects deploy a load balancer across three web servers AND a cluster that keeps the application running if a server dies. Which statement captures the division of labor?","a":"The load balancer optimizes resource use under normal conditions; the cluster ensures continuity when a component fails — together they eliminate both overload and single points of failure","why":"Load balancing = distribution (performance, no overload). Clustering = multiple devices as one system surviving hardware failure (no single point of failure). Combined: the balancer manages normal traffic; clustering takes over on component failure. Swapping their roles (option 1) is the classic trap.","multi":false},{"id":"t6rnv1","q":"A CISO demands 'six nines' availability for a new payment platform. How much yearly downtime does that permit, and what does it imply about patch windows?","a":"About 31 seconds per year — meaning systems must be architected for maintenance without takedowns (load balancing, clustering, redundancy)","why":"Six nines = 99.9999% ≈ 31 seconds of downtime per year — versus five nines (99.999%) at ~5 minutes. At that level you cannot take systems offline for patching or drive swaps; architecture must absorb maintenance through load balancing, clustering, and redundancy.","multi":false},{"id":"1e0bdvr","q":"A video editor needs maximum throughput for raw 4K footage and keeps finished projects on separate volumes. Which RAID layout fits, and why?","a":"RAID 0 for the scratch volume (striping = speed, and regenerable footage needs no redundancy) and RAID 1 for finished projects (mirroring protects irreplaceable data)","why":"Match RAID strengths to data value: RAID 0 striping doubles speed for the scratch drive — its lack of fault tolerance is acceptable because raw footage is regenerable. RAID 1 mirroring protects the irreplaceable finished products with an always-ready copy. The demo used exactly this split (drives D and R).","multi":false},{"id":"btlwmz","q":"A file server runs RAID 5 with four disks. One drive fails at 2 p.m. Which sequence keeps the server serving data, and what is the performance impact until rebuild completes?","a":"Hot swap the failed drive while the server runs; the array rebuilds onto the new disk, operating slower until the rebuild finishes because missing data is calculated from parity on the fly","why":"RAID 5 survives one disk failure: the surviving disks reconstruct data from parity, so service continues — but reads are slower because missing data is calculated on the fly. A hot swap replaces the failed drive without shutdown, and the array rebuilds the data onto it. RAID 5 tolerates exactly one loss.","multi":false},{"id":"fjw76i","q":"A hospital wants disk redundancy that survives TWO simultaneous drive failures with no downtime. Min four disks, which option fits at the lowest complexity?","a":"RAID 6 — striping with double parity across 4+ disks, tolerating two simultaneous failures","why":"RAID 6 stores two parity blocks (min 4 disks) and rebuilds after losing two devices — the course's 'one better than RAID 5.' RAID 1 loses tolerance after one failure; RAID 5 dies at two; RAID 0 has no tolerance at all.","multi":false},{"id":"4welcl","q":"An e-commerce firm loses its primary payment processor for two days. Because of its BCP, revenue continues uninterrupted via a pre-configured secondary processor, with a tertiary contract held in reserve. Which BCP characteristic does this demonstrate?","a":"Primary, secondary, and tertiary action planning for business functions — including non-technical ones like payment processing","why":"The course's own BCP example: plan primary, secondary, and tertiary actions to continue operations — and note this is a BUSINESS function (payments), proving BCP covers non-technical disruptions. DRP would address facility-destroying disasters; this is continuity of a business process.","multi":false},{"id":"b76kfd","q":"A data center's rack UPS batteries keep servers alive for 12 minutes, but the diesel generators take 30–60 seconds to start after a grid failure. Which component bridges the gap, and how?","a":"The UPS batteries carry the load from the instant grid power fails until the generators come up to speed, then the PDC transitions power seamlessly","why":"The layered power design: grid → PDC (conditioning/distribution) → rack UPS (battery, 10–15 min runtime) → servers. When grid power fails, UPS batteries carry the load instantly; permanently installed generators auto-start in 30–60 seconds; the PDC integrates both so the transition is seamless. Line conditioners fix voltage quality, they don't generate power.","multi":false},{"id":"s30v3o","q":"During a storm, facility voltage drops from 120V to 75V and stays there for 40 minutes. Which condition is this, what happens to the systems, and which device handles it?","a":"An undervoltage (brownout) event — voltage too low to operate, systems go offline; only long-term backup power (UPS/generator) addresses it, since line conditioners can't sustain major undervoltage","why":"A deep, sustained drop (120V→70–80V for an extended period) is an undervoltage event/brownout — too low to run systems, so they power down. Line conditioners only correct minor fluctuations (sags/small surges); significant undervoltage or full loss requires UPS/generator backup.","multi":false},{"id":"1tpfiaj","q":"A backup admin argues daily backups are enough because 'the RTO is 4 hours.' The CISO corrects them. What is the error?","a":"RTO governs acceptable DOWNTIME; backup frequency is governed by the RPO — how much data loss (in time) is acceptable. RTO says nothing about backup cadence","why":"RPO (recovery point objective) sets backup frequency — it defines maximum acceptable data loss in time. RTO (recovery time objective) sets how quickly services must be RESTORED — it drives recovery infrastructure, not backup scheduling. Conflating RPO with RTO is a classic exam trap.","multi":false},{"id":"ybfysj","q":"A company replicates its production database to a second server in real time, while also taking nightly encrypted backups to an offsite cloud vault. A ransomware attack corrupts the live data — and minutes later the replica too. Which protection still saves them, and why?","a":"The offsite backups — replication copies corruption in near-real-time (garbage in, garbage out), while point-in-time backups/snapshots let them roll back to a clean pre-attack state","why":"Replication is continuity, not history: it mirrors live data, so corruption propagates to the replica within minutes. Backups and snapshots capture PAST clean states, enabling rollback to before the attack — which is why the 3-2-1 style strategy pairs replication (availability) with versioning (recoverability).","multi":false},{"id":"ynj2fk","q":"Which method verifies that a SECONDARY system can handle production processing without disrupting day-to-day operations?","a":"Parallel processing — running primary and secondary simultaneously to check the secondary's reliability and stability","why":"Parallel processing replicates data and processes to the secondary and runs BOTH at once — the only method that validates the secondary under live load with zero-disruption goals. A failover test switches over outright; a tabletop is discussion only; snapshots are backup artifacts.","multi":false},{"id":"4msn1y","q":"A security team spins up a cloud replica of the corporate network, assigns a red team to attack it, and tasks defenders with detecting and isolating the intrusions while observers take notes. Which testing method is this?","a":"A simulation — responders perform real actions in an artificial environment, evaluating staff under realistic chaos with feedback afterward","why":"Simulations give incident responders and sysadmins a virtualized environment to perform REAL response actions — red attacks, blue detects/responds/isolates — evaluating people (not just the plan) under realistic pressure, followed by observer feedback. Tabletops only discuss; failovers cut over production.","multi":false},{"id":"rbnq9k","q":"Which statements about RAID levels are TRUE? (Select FOUR.)","a":"RAID 0 provides striping with no fault tolerance;  RAID 1 mirrors data across two disks with 50% capacity overhead;  RAID 5 requires at least three disks and survives one failure via parity;  RAID 6 keeps two parity blocks and survives two simultaneous failures","why":"All four are correct: RAID 0 stripes with zero redundancy; RAID 1 mirrors (two disks → one logical, 50% overhead); RAID 5 stripes with parity across 3+ disks, losing one; RAID 6 doubles parity (4+ disks), losing two. RAID 10 is the opposite of option 4's distractor — it's a STRIPE of MIRRORED sets — and RAID 0 is the LEAST redundant.","multi":true},{"id":"t12w9p","q":"Which are elements of capacity planning? (Select THREE.)","a":"People — right skills, hiring, training forecasts;  Technology — can current systems scale to projected demand;  Processes — workflows that withstand demand fluctuations via automation/outsourcing","why":"The four capacity elements are people, technology, infrastructure, and processes — three are listed (infrastructure is the fourth: physical space, power, heat). Marketing budgets and stock prices are business concerns but not capacity planning elements.","multi":true},{"id":"1k6bayd","q":"Which statements about data center power are TRUE? (Select FOUR.)","a":"A spike is a short transient overvoltage often caused by lightning;  A UPS provides 15–60 minutes of battery power plus line conditioning;  Permanently installed generators auto-start and can run a building for days on fuel reserves;  A PDC distributes power with circuit protection, monitoring, and load balancing","why":"All four are course facts: spikes are transient (lightning-caused); UPS = short battery runtime + conditioning; permanent generators = automatic, long-duration; PDC = protected, monitored, load-balanced distribution. Line conditioners CANNOT sustain systems through major undervoltage or full loss, and power restoration can cause damaging spikes.","multi":true},{"id":"1if370r","q":"Which statements correctly distinguish the testing methods? (Select THREE.)","a":"Tabletop = discussion only, no resource deployment, lowest cost;  Failover test = real cutover to backup components, needs a rollback plan;  Simulation = responders act inside a virtualized environment under attack","why":"Tabletop = scenario discussion (storytelling with an exercise inject), cheapest, no deployment. Failover = actual transition to secondary with rollback ready. Simulation = hands-on in an artificial environment (red vs blue). Parallel processing = running both systems simultaneously (the distractor misdefines it), and tabletops never touch production.","multi":true},{"id":"kybru4","q":"What is cyber resilience?","a":"The entity's ability to continuously deliver the intended outcome despite adverse cyber events","why":"Cyber resilience = continuously delivering the intended outcome despite adverse cyber events — surviving and operating through attacks and failures, not just preventing them. Redundancy (option 3) is one of the key mechanisms that enables resilience.","multi":false},{"id":"j6o0wx","q":"What is redundancy?","a":"Having additional systems, equipment, or processes to ensure continued functionality if the primary ones fail","why":"Redundancy = additional systems, equipment, or processes ensuring continued functionality when primaries fail. It reduces the chance of total system failure because backups can take over — it is the backbone of both resilience and high availability designs.","multi":false},{"id":"91uvvb","q":"Which exam objective does the Cyber Resilience and Redundancy section map to?","a":"OBJ 3.4","why":"This section maps to objective 3.4: explain the importance of resilience and recovery in security architecture. It sits in Domain 3 (Security Architecture), covering HA, RAID, capacity planning, power, backups, continuity plans, redundant sites, and resilience testing.","multi":false},{"id":"qsmi4e","q":"Why does redundancy play a big role in cyber resilience?","a":"The chances of a total system failure are significantly reduced because backups can take over when the primary system fails","why":"With backup systems in place, a single component failure no longer means total failure — operations switch to the redundant component. This is how organizations swiftly recover and continue operations even in the face of attacks or technical failures.","multi":false},{"id":"f7aa34","q":"Which topics are covered under resilience and recovery in this section?","a":"High availability, RAID, capacity planning, power, backups, continuity plans, redundant sites, resilience testing","why":"The section roadmap: high availability (load balancing vs clustering), data redundancy (RAID), configuring RAID, capacity planning (people/technology/infrastructure/processes), powering data centers (generators, UPS, line conditioners, PDCs), data backups (onsite/offsite, snapshots, replication, journaling), continuity of operations plans, redundant site considerations (hot/warm/cold/mobile/virtual, platform diversity), and resilience/recovery testing.","multi":false},{"id":"14s6wjt","q":"What does 'five nines of availability' mean?","a":"99.999% uptime — a maximum of about five minutes of downtime per year","why":"Five nines = 99.999% uptime ≈ 5 minutes of downtime per year — the gold standard. Six nines (99.9999%) ≈ 31 seconds/year, which some cloud networks target. Exam questions love swapping these two figures as distractors.","multi":false},{"id":"lxmv4j","q":"What is load balancing?","a":"Distributing workloads across multiple computing resources to optimize resource use and prevent overloading any single resource","why":"Load balancing distributes incoming requests across multiple servers so no single resource is overloaded — optimizing use, maximizing throughput, minimizing response time. All requests go to the load balancer first, which redirects them (e.g., three web servers taking turns for a popular blog).","multi":false},{"id":"188fxid","q":"What is the key difference between load balancing and clustering?","a":"Load balancing distributes traffic for performance; clustering provides redundancy so an application survives hardware failure with no single point of failure","why":"Load balancing = performance/distribution of excess traffic. Clustering = multiple devices working as a single system to keep an application available through hardware failure — eliminating single points of failure. They combine: the balancer optimizes under normal conditions; clustering takes over on component failure.","multi":false},{"id":"1wvp0na","q":"Redundant hardware for everything would double costs. What does the course suggest doing instead for some redundancy needs?","a":"Achieve the desired redundancy using software or cloud-based services instead of duplicated hardware","why":"The course notes that fully redundant hardware is prohibitively expensive, so design decisions should weigh whether redundancy for a given component requires hardware duplication or can be met with software/cloud services — balancing cost against availability requirements.","multi":false},{"id":"1kdy3r6","q":"What is provider diversity?","a":"Using two or more service providers for a critical service so operations continue if one provider has an outage","why":"Provider diversity = two or more providers for critical external services (ISPs, payment processors). The course's example: Stripe as primary card processor with a secondary processor configured and ready if Stripe has a catastrophic outage. Two domain controllers (primary/secondary) follow the same principle.","multi":false},{"id":"p6jske","q":"Which benefits does a multi-cloud architecture provide?","a":"Avoids vendor lock-in and allows workload transition if one provider has an outage","why":"Multi-cloud distributes data, apps, and services across several cloud environments: single-point-of-failure mitigation, rapid transition during outages, cost optimization (pick cheapest provider per service), flexibility for scaling, and avoidance of vendor lock-in (leverage when negotiating terms). Caveat: requires proper data management, unified threat management, and consistent policy enforcement across clouds.","multi":false},{"id":"1no8fn4","q":"A sysadmin must patch a domain controller without disrupting user logins. Which design makes this possible?","a":"Two domain controllers as primary and secondary — patch one while the other maintains services","why":"Redundant servers/services configured as primary and secondary let one be restarted for patching while the other continues serving users — the course's own example of server redundancy. This is redundancy in action: no service interruption despite planned maintenance on one node.","multi":false},{"id":"i0gf44","q":"What does RAID stand for?","a":"Redundant Array of Independent Disks","why":"RAID = Redundant Array of Independent Disks — combines multiple physical storage devices into a single logical storage device recognized by the operating system.","multi":false},{"id":"1r3jwds","q":"Which keyword identifies RAID 0?","a":"Striping","why":"RAID 0 = striping — data split evenly across two or more disks for performance. It is the ONLY RAID with no redundancy or fault tolerance: lose one disk and all data is gone. Use it when you need speed and don't care about fault tolerance (e.g., video-editing scratch drives).","multi":false},{"id":"1qqbrqr","q":"Which keyword identifies RAID 1, and what is its storage overhead?","a":"Mirroring; 50% overhead — two disks provide one disk's worth of capacity","why":"RAID 1 = mirroring — identical data on two disks. It provides the least downtime (a complete copy is always ready) but only two physical devices producing one logical device — a 50% capacity sacrifice. It can lose one disk and keep operating without data loss.","multi":false},{"id":"1ab9hlh","q":"How many disks can RAID 5 lose, and what is a hot swap?","a":"One disk; replacing the failed drive while the server continues to operate, then rebuilding the data","why":"RAID 5 (striping with parity, min 3 disks) survives ONE disk failure — the other disks reconstruct data from parity, albeit slower. A hot swap means removing the failed drive and inserting a replacement while the server keeps running; the array then rebuilds the missing data onto the new drive.","multi":false},{"id":"1vd0c8t","q":"Why is RAID 6 described as 'one better than RAID 5'?","a":"It stores two identical pieces of parity (min 4 disks), so it can lose two disks and still rebuild","why":"RAID 6 = striping with DOUBLE parity — two parity blocks instead of one, requiring at least four disks. The payoff: it survives the simultaneous failure of TWO storage devices without downtime or data loss, versus one for RAID 5.","multi":false},{"id":"1fnuidb","q":"How is RAID 10 constructed, and which two-disk-loss scenario does it survive?","a":"RAID 1 + RAID 0: stripe across two mirrored sets; survives losing one disk from each mirror, but not both disks in the same mirrored pair","why":"RAID 10 = a striped array of mirrored arrays (RAID 1 sets first, then RAID 0 striping across them; min 4 disks). It survives losing up to two disks — but only if they are in DIFFERENT mirrored pairs. Lose both disks of one mirror and the data is gone; after one-per-mirror losses it still runs but with no fault tolerance left, so replace failed drives fast.","multi":false},{"id":"1jyf212","q":"Which RAID levels are considered disaster-tolerant, and why?","a":"RAID 1 and RAID 10, because their full mirrors give two independent zones always holding all the data","why":"Disaster tolerance requires two independent zones with full access to all data — full mirrors. RAID 1 and RAID 10 qualify because every byte exists complete on at least one device. Failure-resistant (mirroring: RAID 1/10) \u003c fault-tolerant (no downtime: 1/5/6/10) \u003c disaster-tolerant (independent full-access zones: 1/10).","multi":false},{"id":"1tu282k","q":"In the Windows RAID demo, what did 'New Striped Volume' create and what was the capacity result?","a":"A RAID 0 with two 800GB disks combined into one ~1.6TB logical drive","why":"In Windows Disk Management, 'New Striped Volume' across Disk 1 and Disk 2 created a RAID 0 — two 800GB drives working in tandem became drive D at ~1.6TB (100% free). Striping gives full combined capacity but zero redundancy: if either disk fails, drive D is gone.","multi":false},{"id":"136c3kn","q":"In the demo, the mirrored volume (drive R) showed only one disk's worth of capacity. Why?","a":"One disk acts as primary and one as backup, both holding identical data — the 50% capacity sacrifice buys fault tolerance","why":"The RAID 1 mirror writes identical data to both disks, so the logical drive holds only one disk's capacity — a deliberate 50% overhead. The payoff: if either disk goes offline, the other keeps serving a full, current copy. The demo's trade-off line: performance and double space (RAID 0) versus redundancy and half space (RAID 1).","multi":false},{"id":"18wryd9","q":"The demo creator set up both a striped drive D and a mirrored drive R. Which workloads went where, and why?","a":"D (RAID 0) as the fast scratch drive for video editing; R (RAID 1) as the redundant store for finished products","why":"Match the RAID to the need: RAID 0's speed suits active video-editing scratch work (regenerable data, no redundancy needed); RAID 1's mirror protects irreplaceable finished products. This 'choose both' approach uses each RAID's strength for the right data.","multi":false},{"id":"16h9mrd","q":"What is capacity planning?","a":"A strategic planning effort ensuring the organization is adequately equipped to meet future demands at the right time and in the most cost-effective manner","why":"Capacity planning = strategic preparation for future demand, cost-effectively and at the right time. It spans four elements — people, technology, infrastructure, and processes — balancing current operational requirements against future projections.","multi":false},{"id":"1w6jbs7","q":"Which four main aspects of capacity does the course identify?","a":"People, technology, infrastructure, and processes","why":"The four capacity elements: PEOPLE (skills, hiring, training), TECHNOLOGY (can current systems handle projected growth?), INFRASTRUCTURE (physical space, power, heat in data centers), and PROCESSES (workflows that withstand demand fluctuations, via automation or outsourcing).","multi":false},{"id":"kk289f","q":"A call center must onboard 500 seasonal employees at once. Manual account creation would take days. Which capacity element addresses this, and how?","a":"Processes — automate the account-creation workflow to handle 500 simultaneous creations, eliminating the bottleneck","why":"This is process capacity planning: streamlining workflows and using automation (or third-party outsourcing) so processes withstand demand fluctuations. Automating simultaneous bulk account creation removes the onboarding bottleneck — the technology exists; the process redesign unlocks it.","multi":false},{"id":"twuebk","q":"An e-commerce site crashes during a flash sale because it cannot scale. Which capacity element failed, and what modern solution does the course cite?","a":"Technology — the platform couldn't scale to demand; cloud services allow increasing storage/bandwidth during high demand and reducing it afterward","why":"This is technology capacity planning: understanding concurrent-user limits and investing in scalable solutions. Cloud services let organizations add capacity during promotions and automatically scale back down during low-demand periods to control costs — precisely the elasticity the crashed site lacked.","multi":false},{"id":"ah1v4f","q":"A data center team rejects proposed server installs that could be hosted in the cloud, keeping scarce rack space for low-latency workloads. Which capacity element is this?","a":"Infrastructure capacity planning — managing physical space, power consumption, and heat","why":"Infrastructure capacity planning covers physical space and utilities. The theater NOC example: finite square footage meant tracking each server's power draw and heat output, and judiciously declining on-prem installs that cloud hosting could handle — reserving local capacity for workloads that genuinely needed low latency.","multi":false},{"id":"h0jc81","q":"A lightning strike drives the line voltage from 120V to 175V for an instant. Which power condition is this, and what protects against it?","a":"A spike; a surge protector or line conditioner","why":"A spike is a short transient voltage surge — typically from lightning, short circuits, tripped breakers, or outages — which can push 120V to 150V or 175V+. Surge protectors and line conditioners remove power above the normal level. (A surge is only a small, sustained increase like 125–130V — the exam tests the difference.)","multi":false},{"id":"v3oamn","q":"How does a sag differ from an undervoltage (brownout) event?","a":"A sag is a small, short voltage decrease near normal levels (120V→115V); an undervoltage event is a longer, deeper reduction (120V→70–80V) that forces systems offline","why":"A sag = small unexpected decrease (e.g., 120V to 115–117V), short-lived — systems usually stay online but hardware can degrade over time. An undervoltage event (brownout) = voltage reduced to much lower levels for a longer period (e.g., 70–80V) — too low to operate, so systems power down. Line conditioners can fix sags but not deep undervoltage or full outages.","multi":false},{"id":"simqcx","q":"What is the realistic runtime role of a UPS during a complete power failure?","a":"About 15–60 minutes (rack units ~10–15 minutes) — enough to prevent data loss or damage during short outages and bridge to generators, not a long-term solution","why":"UPS units provide emergency battery power plus line conditioning when normal input fails — but most only run 15–60 minutes (rack-mounted units roughly 10–15 minutes). They bridge short outages and protect against sudden power loss while generators start; they are not designed for long-term outages.","multi":false},{"id":"x5tl51","q":"Which generator type is 'the backbone of a data center's emergency power architecture' and why?","a":"Permanently installed (diesel/propane/natural gas) — large, auto-starts in a power loss, can power the whole building for hours, days, or weeks depending on fuel reserves","why":"Permanently installed generators (diesel, propane, natural gas) are directly integrated into the data center's electrical setup and designed to kick in automatically during power loss — powering an entire building for extended periods based on fuel reserves. Portables are small/noisy/manual; battery inverters only bridge the gap until long-term generators come online.","multi":false},{"id":"1wl3v1j","q":"What is the best role for a battery inverter generator in data center power design?","a":"Bridging the gap quietly until a longer-term solution (diesel/propane/natural gas generator) comes online","why":"Battery inverter generators (lead-acid, NiCd, lithium-ion) are quiet and low-maintenance but provide minimum wattage or short-duration power — so they bridge the gap until permanent generators start (generators take ~30–60 seconds). Power DISTRIBUTION is the PDC's job, not the inverter's.","multi":false},{"id":"fmyr8r","q":"What is a power distribution center (PDC)?","a":"A centralized hub receiving power and distributing it to all systems with integrated circuit protection, monitoring, and load balancing; integrates with UPS and generators for seamless backup transition","why":"A PDC is far more than a power strip: it centrally receives and distributes power with circuit protection, monitoring, and load balancing to avoid overloading circuits, and integrates with large UPS units and permanently installed generators so backup power transitions seamlessly during grid loss.","multi":false},{"id":"stsxs6","q":"After a complete power loss, what hidden risk exists when power is restored?","a":"Restoration can cause a power spike that damages systems","why":"The course warns that when power is restored after a full loss event, it can cause a power spike — which can damage systems too. This is why surge protection/line conditioning belongs in the power chain, not just for the outage but for the recovery.","multi":false},{"id":"ujnw0z","q":"Why is an onsite-only backup strategy risky?","a":"The backups are destroyed along with everything else if the facility suffers a fire, flood, or other disaster","why":"Onsite backups are convenient and fast to restore from — but they share the facility's fate. If the building and equipment are destroyed, onsite backups die with it. Offsite backups (geographically separate, cloud or shipped media) exist precisely to survive physical disasters and ensure data continuity.","multi":false},{"id":"1lvyx3v","q":"An organization can tolerate losing at most one hour of data. What backup schedule and metric drive this?","a":"Backups at least hourly, driven by the RPO (recovery point objective)","why":"The RPO defines maximum acceptable data loss in time — an RPO of one hour means backups must run at least once per hour to keep loss under the threshold. RTO governs downtime (restore speed), not data loss. The driving question for frequency: 'how much data am I willing to lose?'","multi":false},{"id":"r64gd7","q":"Which two encryption protections should backups use?","a":"Data-at-rest encryption (on the storage device) and data-in-transit encryption (while moving to/from the backup destination)","why":"Backups need BOTH data-at-rest encryption (data encrypted as written to storage, so stolen media stays unreadable) and data-in-transit encryption (data protected while moving across networks or the system bus, preserving confidentiality and integrity). Encrypting backups ensures leaked media doesn't become a breach.","multi":false},{"id":"1fr49io","q":"How do snapshots differ from traditional backups?","a":"Snapshots are point-in-time copies recording only changes since the previous snapshot — more efficient, quicker, and ideal for rolling databases back to a known-good state","why":"Snapshots capture a consistent frozen-in-time state but record only the changes since the last snapshot — reducing storage, speeding backup, and enabling frequent captures. They're especially valuable for databases and file servers where you can roll back to a specific point after corruption or accidental deletion.","multi":false},{"id":"1fqy8td","q":"What is the best-practice frequency for practicing data recovery?","a":"At least once per month","why":"Backups are useless if you cannot recover from them when disaster strikes — so practicing recovery at least once per month is the course's best practice. Regular recovery testing identifies issues and bottlenecks before a real incident, and recovery plans must be well-defined AND thoroughly tested.","multi":false},{"id":"sq9jnl","q":"How does replication differ from a periodic backup?","a":"Replication makes real-time or near-real-time copies so data lives in two places simultaneously — if one server crashes, the other continues without interruption","why":"Backups are periodic snapshots; replication is continuous — real-time or near-real-time copies keeping data in two places at once. If one server crashes, the other carries on seamlessly. Replication suits high-availability architectures that cannot afford downtime or interruption, providing seamless data continuity.","multi":false},{"id":"1s2mmh4","q":"What is journaling, and where is it particularly valuable?","a":"Maintaining a meticulous record of every change to data over time — valuable in databases and critical systems for granular point-in-time rollback and audit trails","why":"Journaling (change tracking/logging) records every data modification, enabling precise recovery to a specific point and individual-change rollback — crucial for legal proceedings, compliance audits, and audit trails. Effective journaling requires choosing tracking granularity, managing journal size and retention, and securing the journal against tampering.","multi":false},{"id":"3y6dnh","q":"Place the data recovery steps in order: (1) validate data integrity, (2) select the right backup, (3) document and report, (4) initiate the recovery, (5) test/validate the process, (6) notify stakeholders.","a":"2 → 4 → 1 → 5 → 3 → 6","why":"Recovery order: choose the appropriate backup copy (snapshot, offsite, onsite) → initiate restoration → validate the restored data's integrity and consistency → test the recovery process for bottlenecks → document steps/time/challenges for compliance and improvement → notify relevant stakeholders. You can't restore before choosing WHAT to restore, and validation must precede declaring success.","multi":false},{"id":"oygj64","q":"What is the relationship between a business continuity plan and a disaster recovery plan?","a":"The DRP is a subset of the BCP — the BCP covers responses to disruptive events broadly, while the DRP focuses on resuming operations after disasters","why":"The BCP covers plans/processes for ANY disruptive event — including non-technical ones like a cancelled merchant account or street protests blocking the office. The DRP specifically addresses disasters (hurricanes, fires, floods) and how to resume operations quickly — a subset of the BCP. Often managed together as BC/DR. The event type decides which plan you follow.","multi":false},{"id":"kclli6","q":"Who is responsible for driving business continuity plan development?","a":"Senior management — they set goals, determine risk acceptance, and appoint the business continuity coordinator","why":"BCP development is senior management's responsibility — without their support it stalls and fails. They set BC/DR goals, determine acceptable risk based on the organization's risk appetite and tolerance, appoint the business continuity coordinator, and define scope. The committee they charter includes technology, legal, security, communications — not just IT.","multi":false},{"id":"qg5ifc","q":"Why must the business continuity committee include more than just IT staff?","a":"Continuity covers the entire business, not just technology — legal, security, communications and other departments all have continuity roles","why":"The committee needs representatives from technology, legal, security, communications, and other departments because business continuity covers EVERYTHING in the business — the course's BCP examples (backup payment processors, riot/protest plans) are business problems, not IT problems. The committee sets recovery priorities, prioritizes continuity-critical systems, and reports to senior management.","multi":false},{"id":"117kynh","q":"A training company in hurricane-prone Orlando hosts all infrastructure on AWS spread across multiple regions and availability zones. Which continuity strategy does this exemplify?","a":"Using cloud geographic dispersion for continuity — the business continues even if a severe local disaster strikes","why":"Hosting services across multiple AWS regions and AZs provides continuity even if a hurricane devastates Orlando — geographic dispersion of systems. Combined with staff split across Florida, the US, and the Philippines (who cover for each other during local floods/outages), it shows continuity planning for both systems and people.","multi":false},{"id":"iw1zfg","q":"Which risk-management concepts does senior management apply when defining BCP scope?","a":"Risk appetite and risk tolerance — determining the level of risk the organization is willing to accept","why":"Senior management determines the level of risk they're willing to accept based on the organization's RISK APPETITE and RISK TOLERANCE thresholds — this drives scope definition and prevents scope creep. Large organizations may split plans by business function or geography, but all pieces must operate coherently during a crisis.","multi":false},{"id":"rxrgbg","q":"Rank hot, warm, and cold sites by switchover speed and cost.","a":"Hot: instant/most expensive; warm: days/middle; cold: weeks-to-months/cheapest","why":"Hot = fully equipped and running continuously — near-instant switchover, but requires 'two of everything' (most expensive; usually reserved for mission-critical functions). Warm = fundamentals (power, phones, network) but equipment bought after disaster — operational in days, moderate cost. Cold = an empty shell (the course example: leased building with bathrooms and furniture but no network/computers) — operational in 1–2 months, cheapest.","multi":false},{"id":"1fhte3b","q":"What is a mobile site in redundant-site planning?","a":"Independent portable units — trailers or tents delivered to your location and connected to power and internet; can be configured as hot, warm, or cold","why":"Mobile sites use portable units (trailers/tents) delivered to the affected location — fully contained with power, connectivity, and technicians. The US military's DJC2 (Deployable Joint Command and Control) is the marquee example: deliverable anywhere in ~72 hours, functional in 24 hours, full services in up to 7 days, supporting ~200 people — deployed to Haiti for 2010 earthquake recovery.","multi":false},{"id":"26o8s3","q":"What is a virtual cold site?","a":"Critical data and configurations stored in the cloud, with resources activated only in response to a disaster to minimize ongoing operational costs","why":"Virtual sites are cloud-based equivalents: virtual hot = fully replicated, instantly accessible; virtual warm = partially replicated, quickly scaled up; virtual cold = data/config stored but resources activated only when disaster strikes — minimizing ongoing cost. Cloud virtual sites offer rapid scalability, cost-effectiveness, and easy maintenance.","multi":false},{"id":"1tm0p44","q":"What is platform diversity, and what risk does it mitigate?","a":"Diversifying operating systems, network equipment, and cloud providers at redundant sites so a single-vendor vulnerability or outage cannot take down both primary and backup","why":"Platform diversity = different OSes, network gear, or cloud providers at redundant sites. Same-platform redundancy is easier to support — but a vulnerability affecting all Cisco networks, say, would hit primary AND hot site together. Diverse platforms remain immune to single-vendor flaws; the trade-off is more complex configuration and support. Senior leaders weigh risk vs reward.","multi":false},{"id":"14s0anv","q":"Why do most companies NOT run their entire business from a hot site?","a":"Hot sites require two of everything, making full-business hot sites prohibitively expensive — so they're reserved for mission-critical functions (e.g., 50 essential staff of 500)","why":"A true hot site means duplicating everything — servers AND desks, chairs, phones for every employee. The cost of a 500-person hot site is enormous, so organizations typically hot-site only mission-critical functions and handle everyone else later via warm/cold arrangements or telework. Cloud makes hot DATA cheap, but not hot PEOPLE.","multi":false},{"id":"10mwcq3","q":"What is the difference between resilience testing and recovery testing?","a":"Resilience testing assesses withstanding and adapting to disruptive events; recovery testing evaluates restoring normal operations afterward","why":"Resilience testing = can the system WITHSTAND and ADAPT to disruptive events? Recovery testing = can it RESTORE normal operations afterward? Together they act as a fire drill for enterprise networks and operations — testing against power loss, natural disasters, ransomware, or data breaches.","multi":false},{"id":"oqeik2","q":"What happens in a tabletop exercise?","a":"Key stakeholders discuss a simulated scenario around a table — a facilitator announces an exercise inject (e.g., a compromised domain controller) and teams walk through their responses; no real resources are deployed","why":"A tabletop exercise is a scenario-based DISCUSSION among key stakeholders: the facilitator injects a hypothetical event ('your domain controller was compromised by a nation-state actor') and each team explains its response. Low cost, highly engaging, reveals gaps that become SOPs/playbooks — and doubles as team building.","multi":false},{"id":"um83bg","q":"Which testing method involves actually cutting operations over from a primary data center to a backup site?","a":"A failover test — verifying the seamless real-world transition from primary to secondary components, with a rollback plan ready","why":"A failover test is a controlled experiment that performs the REAL cutover (e.g., East Coast DC → West Coast hot site) to prove the plan works — costing more resources, time, and energy than a tabletop. The course's DC-area organization ran one yearly, flying a team to the hot site, always with a rollback plan to return operations while issues were investigated.","multi":false},{"id":"nee0zf","q":"How does a simulation differ from a tabletop exercise?","a":"A simulation puts responders inside a virtualized/simulated environment (e.g., a cloud replica of the corporate network) where a red team attacks and the blue team responds in real time","why":"Tabletop = discussion on paper. Simulation = responders perform real actions in a virtual environment: spin up a cloud replica of the corporate network, let a red team attack while blue team detects, responds, and isolates — testing people under realistic chaos, with observer feedback afterward. Simulations evaluate the staff, not just the plan.","multi":false},{"id":"9i2xro","q":"What is parallel processing in resilience/recovery testing?","a":"Replicating data and processes to a secondary system and running BOTH primary and secondary simultaneously to verify the secondary handles processing without disrupting operations","why":"Parallel processing runs primary and secondary systems TOGETHER to prove the secondary can carry the processing load with zero disruption — requiring meticulous planning and flawless execution. It tests resilience (handling multiple simultaneous failure scenarios like network outages, hardware failures, data corruption) and recovery efficiency from multiple failure points.","multi":false},{"id":"1nrwk4o","q":"What does the course say about the frequency of resilience and recovery testing?","a":"Testing must be routine and ongoing: regularly test, adapt, and improve plans as threats and vulnerabilities evolve","why":"Resilience is 'an ongoing, ever-continuing journey towards continual improvement,' not a checkbox. Plans must be tested routinely and evolved in response to the changing threat environment and emerging vulnerabilities — plan, test the plan, and assure stakeholders it will really work when disaster strikes.","multi":false},{"id":"1cnaadf","q":"A startup's only copy of customer data lives on one server with RAID 5. The owner says 'RAID is our backup.' Which risk remains completely unaddressed?","a":"RAID protects against drive failure but not accidental deletion, corruption, ransomware, or site destruction — those need versioned backups (onsite AND offsite)","why":"RAID = availability against hardware failure only. Deletions, corruption, and ransomware propagate across the array instantly, and a site-level disaster kills the whole thing. Backups — with point-in-time versions, kept onsite and offsite — cover what RAID cannot. 'RAID is not a backup' is a fundamental exam principle.","multi":false},{"id":"caqm7l","q":"An online retailer does 90% of annual revenue in November–December. Which capacity planning move matches the course's retail example?","a":"Hire seasonal workers around October 1, then offboard them after January 1 when demand falls — matching workforce capacity to forecast demand","why":"This is people capacity planning: the course's retailer hires ~20 seasonal/part-time employees on October 1 for the November–December surge, then offboards them after January 1 to minimize costs until the next fourth quarter. Right number of people, right skills, right time.","multi":false},{"id":"su1amx","q":"A sysadmin configures two power supplies inside one server and connects the facility to two separate power grids. Which redundancy types are in play?","a":"Power supply redundancy at the device level AND facility-level power source redundancy — a failure of one source does not affect continuity","why":"Redundant PSUs inside the server = device-level power redundancy. Two grid connections (plus UPS/generator options) = facility-level power source redundancy. Both ensure a single power source failure cannot take down services — distinct from network path redundancy or provider diversity.","multi":false},{"id":"ehsw8y","q":"Why does the course recommend cable AND wireless network connections for critical systems?","a":"Multiple connection types prevent a single point of failure from disrupting network connectivity","why":"Network redundancy means maintaining multiple pathways — multiple cabled connections, or a cable plus wireless combination — so no single cut, failure, or outage type kills connectivity. Redundancy's purpose is always the same: eliminate single points of failure.","multi":false},{"id":"1hsbqyx","q":"A database corrupts at 3:12 p.m. The team restores to a 3:00 p.m. snapshot and replays the journal to reconstruct the final 12 minutes. Which two backup concepts combined here?","a":"Snapshots (point-in-time rollback to a known-good state) and journaling (record of every change enabling granular reconstruction)","why":"Snapshots roll back to a frozen point-in-time state; the journal's meticulous change record lets you replay or roll forward individual changes after that point. Together they give minute-level recovery — the course highlights journaling's value for exactly this kind of granular recovery in databases.","multi":false},{"id":"9zy6th","q":"A warm site's defining trade-off is best described as:","a":"Fundamentals (power, phone lines, network) pre-positioned, but equipment must be acquired and installed after disaster — operational in days instead of hours, at substantially lower cost than a hot site","why":"Warm = the middle tier: infrastructure exists (building, power, connectivity, maybe desks) but computers/phones are NOT installed — bought and deployed after the disaster, taking days. Cheaper than hot (no 'two of everything'), far faster than cold (no months-long buildout).","multi":false},{"id":"1puadjc","q":"An org runs identical Cisco gear at its primary site and hot site for 'consistency.' A pen test warns a single vendor-specific vulnerability could destroy both simultaneously. Which strategy addresses the warning?","a":"Platform diversity — use different network equipment/OS/cloud providers at the redundant site so a single-vulnerability or provider outage cannot hit both","why":"Platform diversity diversifies OSes, network equipment, and cloud providers across sites. Identical platforms are easier to support but share a common failure mode — one Cisco-specific vulnerability kills primary AND backup. Diverse platforms cost more in complexity but survive single-vendor events.","multi":false},{"id":"14fxk4q","q":"A facilitator tells assembled department leads: 'A nation-state actor has compromised your domain controller. What does each team do?' Nobody touches a keyboard. Which exercise is this, and what is the announced scenario called?","a":"A tabletop exercise; the announced event is an exercise inject","why":"Discussion only, no deployment, stakeholders responding to a facilitator's hypothetical = tabletop exercise. The injected scenario detail ('domain controller compromised by a nation-state actor') is the exercise inject. Gaps found become SOPs and playbooks — plus it's team building.","multi":false},{"id":"17mdvm5","q":"Which disaster recovery testing method consumes the most resources and absolutely requires a rollback plan?","a":"A failover test — it performs the real cutover to the backup site, taking more time, energy, and resources, and needs a way back if it goes wrong","why":"Failover tests execute the actual transition (the DC-area org ran one yearly, flying a team to the hot site 1,500 miles away). Real cutovers consume real resources — and the course stresses having a rollback plan to return operations to the main facility while failures are investigated.","multi":false},{"id":"ex2t2z","q":"A company wants a redundant site but cannot justify 'two of everything' even for critical staff. Their workloads run fine on cloud infrastructure. Which approach gives hot-site readiness without the physical price tag?","a":"Virtual hot/warm/cold sites in the cloud — e.g., a virtual hot site as a fully replicated, instantly accessible cloud environment","why":"Virtual sites deliver cloud-based equivalents: virtual hot = fully replicated, instantly accessible environment; virtual warm = partially replicated, quickly scaled; virtual cold = data/config stored, resources activated only on disaster. Cloud gives rapid scalability, cost-effectiveness, and easy maintenance — hot readiness without duplicating physical offices.","multi":false},{"id":"144l71l","q":"Every Friday night, a script copies changed files to an encrypted cloud vault three states away. What two backup principles does this single practice satisfy?","a":"Offsite storage (geographic separation from the primary data source) and encryption (data protected even if media falls into the wrong hands)","why":"Geographically separate cloud storage = offsite backup, surviving facility-level disasters. Encryption (at rest in the vault and in transit) keeps stolen data unintelligible. It's periodic (weekly) rather than replicated, and a copy rather than a journal — the other options describe different mechanisms.","multi":false},{"id":"1nts4tn","q":"What is the correct order of RAID tolerance classifications from narrowest to broadest protection?","a":"Failure-resistant (withstand malfunctions via mirroring) → fault-tolerant (no downtime via mirroring or parity) → disaster-tolerant (two independent zones with full data access)","why":"Failure-resistant = survives hardware malfunctions without data loss (mirroring: RAID 1/10). Fault-tolerant = continues with NO downtime and rebuilds (RAID 1/5/6/10). Disaster-tolerant = survives catastrophic events via two independent full-access zones (RAID 1/10). Each tier builds on the previous.","multi":false},{"id":"15svfs2","q":"Which statements about offsite backups are TRUE? (Select THREE.)","a":"They store copies geographically separate from the primary data source;  They protect against physical disasters like fires and floods that would destroy onsite copies;  They can be cloud-based or physically shipped media (tapes, drives)","why":"Offsite = geographic separation (cloud transfer or shipped tapes/drives — the course's war example shipped weekly tapes 1,000 miles away). They survive facility destruction. The last two options overreach: offsite restores CAN be fast with cloud links, and best practice keeps BOTH onsite (quick restores) and offsite (disaster survival) copies.","multi":true},{"id":"6j2w76","q":"Which power protection devices and their roles are correctly matched? (Select FOUR.)","a":"Surge protector — removes overvoltage above normal levels;  Line conditioner — smooths sags and small surges into clean power;  UPS — battery emergency power (15–60 min) plus line conditioning;  Generator — mechanical-to-electrical conversion for long outages","why":"Four correct matches: surge protectors strip overvoltage; line conditioners normalize minor fluctuations; UPSs bridge short outages with battery + conditioning; generators produce long-term power. A PDC DISTRIBUTES power (with protection/monitoring/load balancing) — it doesn't cool — and battery inverters only bridge short gaps, not weeks.","multi":true},{"id":"1kjkvzn","q":"Which statements about the business continuity committee are TRUE? (Select THREE.)","a":"Senior management appoints the business continuity coordinator who leads it;  It should include representatives from technology, legal, security, communications, and other departments;  It determines recovery priorities and identifies/prioritizes systems needed for continuity, reporting to senior management","why":"The committee is chartered by senior management, led by the appointed coordinator, and deliberately cross-functional — continuity covers the whole business (payments, staffing, facilities), not just IT. It sets recovery priorities, prioritizes continuity-critical systems, and reports to SENIOR MANAGEMENT. IT-only membership is exactly what the course warns against.","multi":true},{"id":"1xhts1r","q":"Which scenarios correctly match a RAID level to a use case? (Select THREE.)","a":"RAID 0 — high-end video editing scratch volume where speed matters and data is regenerable;  RAID 1 — finished projects needing an always-online copy with the least downtime;  RAID 6 — archive that must survive two simultaneous drive failures","why":"RAID 0 suits regenerable scratch data (the demo's editing volume); RAID 1 gives finished work an instant mirror; RAID 6 survives two simultaneous failures for critical archives. RAID 0 as a sole copy of irreplaceable data is precisely what NOT to do, and RAID 5 tolerates exactly ONE failure, not three.","multi":true},{"id":"eunrhs","q":"An architect must design storage for: (1) a 24/7 order database that cannot lose more than one disk and needs continuous uptime; (2) a research scratch volume where speed is everything and data is disposable; (3) an archive where two simultaneous disk failures must not cause loss. Budget is secondary. Which RAID per workload is correct?","a":"1=RAID 5 (or 6), 2=RAID 0, 3=RAID 6","why":"Continuous uptime with one-disk tolerance = RAID 5 (parity, hot swap) or RAID 6. Pure speed with disposable data = RAID 0 striping — the only RAID with no redundancy. Two simultaneous failures = RAID 6's double parity. RAID 0 is never right for irreplaceable data, and blanket RAID 10 wastes money where RAID 0 suffices.","multi":false},{"id":"hs8bg1","q":"A company achieves 99.999% measured uptime, then suffers angry customer complaints after a 4-minute outage during peak season. What is the most likely explanation?","a":"Five nines permits 5 minutes of downtime per year — the outage simply exceeded the annual budget, and customers feel outages regardless of percentage targets","why":"Five nines = 99.999% = roughly five minutes of downtime PER YEAR. A single 4-minute outage consumes nearly the entire annual allowance. Availability percentages describe yearly budgets, not per-event immunity — and user experience depends on WHEN the outage lands, not just its total.","multi":false},{"id":"rhuxkn","q":"During a failover test, operations successfully cut over to the hot site — but reverting takes six hours because data synchronization back to the primary was never planned. Which omitted artifact does the post-mortem identify?","a":"A rollback plan — the course requires planning how to shift operations BACK while any failover issues are resolved","why":"The course's failover-test example explicitly includes a rollback plan to return operations to the main facility while failures are investigated. Testing the cutover forward without planning the reverse path leaves you stranded at the backup site — failover tests must be two-way plans.","multi":false},{"id":"muf16q","q":"A RAID 10 array with four disks loses Disk 1 (in mirror set A) and Disk 3 (in mirror set B) at once. What is the array's state?","a":"It keeps operating — one loss per mirrored pair is survivable — but fault tolerance is now exhausted, so the failed disks must be replaced urgently","why":"RAID 10 survives one disk in EACH mirror (its two-loss tolerance is conditional). One loss per pair keeps every stripe readable, but with both mirrors degraded there is zero remaining tolerance — a third failure kills data. The course stresses replacing failed disks immediately after such a scenario.","multi":false},{"id":"1jwbkl0","q":"A CISO asks: 'If our generator fuel runs out on day three of a blackout, what keeps us alive?' The architect answers correctly with which layered design?","a":"Battery inverter generators or UPS banks bridge short gaps, but long-term survival requires fuel logistics for permanently installed generators — plus grid reconnection as a tertiary source","why":"Generator duration is bounded by fuel reserves (course: hours, days, or weeks 'depending on how much fuel your system has in its reserve tanks'). Architectures therefore layer sources — the course's real-world example chains solar → batteries → generators → grid reconnection — so no single source's limits are fatal.","multi":false},{"id":"nxkh69","q":"A hospital must choose between: same-platform redundant sites (easy support, one skillset) and diverse platforms (different vendors/OSes). The deciding factor, per the course, is:","a":"Senior decision makers weigh the risks and rewards: identical platforms simplify support but share a common vulnerability; diverse platforms resist single-vendor failures at the cost of complexity","why":"The course presents this as a genuine judgment call for senior leaders: same platform = easier support, lower maintenance, known skillset — but a single vendor-specific vulnerability (e.g., an exploit hitting all Cisco gear) could take down primary AND hot site. Diversity = resilience against that, with more complex configuration and support. Either can be right depending on the situation.","multi":false},{"id":"1fjcmql","q":"A backup system creates snapshots every 15 minutes and full offsite backups nightly. At 2:07 p.m. a fat-fingered admin deletes a critical table that was last snapshotted at 2:00 p.m. Which recovery path loses the LEAST data?","a":"Roll back to the 2:00 p.m. snapshot — losing at most 7 minutes — then use journaling to replay the legitimate changes up to 2:07 if needed","why":"Snapshots minimize the rollback window (7 minutes vs 12 hours), and journaling can replay post-snapshot legitimate transactions to narrow loss further. RAID cannot help (deletion isn't a hardware failure — parity holds the deletion too), and replication propagates the delete. Tiered recovery exists precisely for this granularity.","multi":false},{"id":"rsmkj1","q":"Which sequence correctly orders the resilience/recovery testing methods by increasing realism and resource commitment?","a":"Tabletop exercise → simulation → parallel processing → failover test","why":"Tabletop = discussion only (cheapest, no deployment). Simulation = hands-on in a virtual environment. Parallel processing = live secondary running alongside production (zero-disruption demands). Failover test = actual production cutover (most resources, needs rollback). The exam may shuffle the middle pair, but tabletop-first and failover-last anchor the scale.","multi":false},{"id":"vnt22x","q":"An org's RPO is 15 minutes, but backups run nightly. During a 6 p.m. outage they lose 20 hours of work. Which statement is correct?","a":"The backup strategy violates its own RPO — with a 15-minute RPO, backups (or equivalent snapshots/replication points) must occur at least every 15 minutes","why":"RPO is the maximum acceptable data LOSS measured in time — it dictates backup frequency, full stop. A 15-minute RPO demands recovery points at least every 15 minutes (via backups, snapshots, or journaling). Nightly backups imply a 24-hour RPO; either the cadence or the stated RPO was wrong — and RPO is a business decision, not something you shrink to match bad tooling.","multi":false},{"id":"u29p9","q":"A BCP committee drafts plans covering ransomware, hurricanes, and payment-processor failure, then keeps adding scenarios endlessly. Which BCP development principle is being violated?","a":"Scope definition — senior management must define the plan's scope (based on risk appetite and tolerance) to prevent scope creep; large orgs may split plans by function or geography, but pieces must remain coherent","why":"The course warns that without a defined scope, BCP efforts face SCOPE CREEP. Senior management defines scope and acceptable risk per the org's risk appetite/tolerance. Plans may be segmented by business function or geography in large organizations — but every piece must operate coherently during a crisis.","multi":false},{"id":"1g71b2n","q":"Why does the course call multi-cloud adoption a redundancy strategy rather than merely a cost strategy?","a":"Distributing workloads across several cloud providers mitigates single-provider outage risk — the workload transitions to another provider with minimal disruption if one fails — while ALSO enabling cost optimization and avoiding vendor lock-in","why":"Multi-cloud's resilience role: a single provider's outage no longer means YOUR outage — workloads shift rapidly to another provider. Cost optimization (pick the cheapest provider per service) and vendor-lock-in avoidance are real but secondary benefits. The course adds the caveat: you must maintain proper data management, unified threat management, and consistent policy enforcement across all clouds.","multi":false},{"id":"1lllvgd","q":"A facility experiences a voltage sag every afternoon (120V → 116V) but nothing ever crashes. Why does the course still recommend a line conditioner?","a":"Repeated sags degrade hardware components over time even though systems stay online — the line conditioner restores the expected voltage and prevents cumulative damage","why":"Sags are small, brief voltage drops near normal levels — systems keep running, so the risk is invisible day to day. The course warns they 'could damage your hardware components over time,' which is exactly what a line conditioner prevents by normalizing the power signal. Cheap insurance against slow hardware death.","multi":false},{"id":"1t8tk0d","q":"Which statements about clustering are TRUE? (Select FOUR.)","a":"Clustering uses multiple computers, storage devices, or connections working together as a single system;  It provides higher availability, reliability, and scalability;  Its core purpose is eliminating single points of failure during hardware failure;  It can be combined with load balancing for a more robust architecture","why":"Clustering = many devices as ONE system (availability, reliability, scalability), focused on surviving hardware failures with no single point of failure. It composes with load balancing: balancer optimizes normally, cluster absorbs failures. Option 5 defines load balancing alone, and clusters have no fixed node count.","multi":true},{"id":"12fjuhh","q":"Which are the five power conditions the course names? (Select THREE of them — any three.)","a":"Surges;  Spikes;  Sags","why":"The five power conditions: surges (small rises), spikes (short transients — lightning), sags (small brief drops), undervoltage events/brownouts (deep sustained drops), and power loss events/blackouts (total loss — whose restoration can spike!). Solar flares and 'voltage graffiti' are fabricated distractors.","multi":true},{"id":"13dbnf4","q":"Which statements about resilience and recovery testing are TRUE? (Select FOUR.)","a":"Tabletop exercises use exercise injects to drive scenario discussion among stakeholders;  Failover tests verify real transitions to backup components and require rollback plans;  Simulations let responders act inside virtualized environments (e.g., red vs blue in a cloud replica);  Parallel processing runs primary and secondary simultaneously to validate the secondary under live load","why":"All four methods are real and distinct: tabletop (talk with injects), failover (real cutover + rollback), simulation (hands-on virtual environment), parallel processing (both systems live). The course's closing point demolishes the last two options: testing is NOT one-time — 'regularly test, adapt, and improve' because resilience is an ongoing journey.","multi":true},{"id":"1k06qto","q":"A disaster destroys the primary data center. Which design elements determine how fast the organization is back? (Select THREE.)","a":"The redundant site type — hot (instant), warm (days), or cold (weeks-plus);  Whether data was replicated or restorable from offsite backups at the recovery site;  Whether the continuity plan was tested and the failover path proven","why":"Recovery speed = site readiness (hot/warm/cold) + data availability at the site (replication/offsite restores) + proven transition (tested failover/DR plans). This is why the course pairs redundant-site design with backup strategy AND testing — untested plans and missing data make even a hot site useless.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
</div>
