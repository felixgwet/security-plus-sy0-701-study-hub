<style>

  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }

  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }

  .grade { display: flex; gap: 12px; margin-top: 16px; }

  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }

  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }

  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }

  <h1>Section 3 · Physical Security — Flashcards</h1>
  <p class="sub">Tap the card to flip it, then grade yourself honestly &mdash; the deck remembers what you know and will prioritize your weak cards.</p>

  <script>
    var DECKS = [{"label":"Section 3 · Physical Security","cards":[{"id":"k01uzc","q":"A city hall wants to stop a vehicle from being driven into its lobby during public hours, but keep pedestrian access open. Which control BEST meets this requirement?","a":"Steel bollards spaced along the building frontage","why":"Bollards are short, sturdy vertical posts designed specifically to stop vehicular threats while allowing people to walk freely. Fencing targets people/perimeter threats, sensors only detect, and a vestibule controls entry — none of them stop a moving vehicle.","multi":false},{"id":"1beppyn","q":"A security review flags an organization's fence line. The threat model includes intruders digging a tunnel beneath it. Which countermeasure directly addresses this?","a":"An underground fence portion or buried mesh","why":"Digging under is countered by extending the barrier below ground — an underground portion or buried mesh. Electrification and barbed wire target climbers; robust materials + monitoring target cutters. Match the countermeasure to the attack vector.","multi":false},{"id":"dn10jb","q":"Which rating describes a bollard that stops a 15,000-lb vehicle traveling 30 mph with less than 1 meter of penetration past the barrier?","a":"ASTM F2656-07 M30 P1","why":"ASTM F2656-07 M30 P1 is the crash-rating: M30 = 15,000-lb vehicle at 30 mph, P1 = penetration under 1 meter. The other standards are an infosec management standard, a cryptographic module standard, and an ingress-protection rating.","multi":false},{"id":"1w3dg5c","q":"A security operations center is reviewing video after a break-in. The camera system did nothing to stop the intruder — it only recorded the activity. Which type of control is video surveillance in this role?","a":"Detective","why":"Video surveillance is a detective control: it observes, records, and lets you review what happened. Deterrence is a side effect (visible cameras may discourage attempts), but the system's core function here is detection after the fact.","multi":false},{"id":"oflues","q":"An organization needs motion detection that works in complete darkness across a loading dock. Which sensor type is the BEST fit?","a":"Infrared — it detects warm bodies and works in low light or darkness","why":"Infrared sensors detect heat (warm bodies), so darkness doesn't affect them — ideal for low-light areas. Ultrasonic uses echolocation indoors; pressure needs weight on a mat; photoelectric beams are a visible-light tripwire, not the course's sensor list.","multi":false},{"id":"ihokv7","q":"A facilities manager notices a lobby camera lens has been carefully covered with a sticker and tape. No wires were cut and nothing was smashed. How should this be categorized?","a":"Visual obstruction","why":"Stickers, tape, spray paint, foam, balloons, and umbrellas over a lens are all forms of visual obstruction — defeating the camera without damaging it. Physical tampering involves damaging or cutting (e.g., cutting wires); EMI targets wireless signals.","multi":false},{"id":"1ceqa2r","q":"During an after-hours walkthrough, guards find an interior room deliberately overheated. Later review shows an infrared sensor failed to trigger during the intrusion. What was the attacker doing?","a":"Blinding the infrared sensor by raising the room temperature","why":"Infrared sensors detect warm bodies against a cooler background. Heating the room removes that contrast, so the intruder's body heat blends in — attacking the physical environment to blind the sensor.","multi":false},{"id":"1qwd56p","q":"An attacker dresses as a courier, walks up to a secure door with arms full of packages, and an employee politely holds the door open by badging in. Which attack occurred, and what key element defines it?","a":"Piggybacking — the authorized employee knowingly allowed an unauthorized person in","why":"The dividing line is complicity: piggybacking means an authorized person intentionally (or negligently) allows the unauthorized person in — here via courtesy social engineering with the courier disguise. If the employee hadn't noticed the follower, it would be tailgating.","multi":false},{"id":"vlbvww","q":"A data center's fingerprint lock is tuned so sensitively that the administrator herself is rejected about half the time. Which rate is being experienced, and why is it still a problem?","a":"False Rejection Rate — authorized users are being denied, disrupting operations just as seriously","why":"The FRR is the rate at which the system denies users who SHOULD have access. Chasing FAR down to zero by cranking sensitivity pushes FRR up — authorized staff locked out half the time is a real operational problem, not a win.","multi":false},{"id":"9jdyvn","q":"When evaluating two competing fingerprint door locks, which specification should a security architect compare to judge overall biometric effectiveness?","a":"The Crossover Error Rate — lower is better","why":"The CER (where FAR equals FRR) is the industry measure of a biometric system's effectiveness. A lower CER means a better balance of security and convenience; storage, speed, and battery specs don't capture accuracy.","multi":false},{"id":"4xd5is","q":"An attacker brushes past an employee in an elevator with a concealed reader in a backpack and later enters the building using the copied credential. Which attack is this, and how close did the attacker need to get?","a":"Badge cloning — roughly 1–2 inches for NFC or 2–10 inches for RFID","why":"This is access badge cloning: a handheld reader captures RFID/NFC data discreetly without contact, but the attacker still needs proximity — about 1–2 inches for NFC, 2–10 inches for RFID (a stronger antenna roughly doubles that). The clone then works like the original.","multi":false},{"id":"94v8yx","q":"A company already requires badge-plus-PIN at every door. An auditor still wants a detective control that would reveal a cloned badge in use. Which option fits best?","a":"Regular monitoring and auditing of access logs for anomalous or impossible usage","why":"Access-log monitoring and auditing is the detective layer: patterns like a badge being used while its owner is elsewhere expose clones. Shielding is preventive, frequency upgrades alone don't stop cloning, and guards at every door is a preventive posture, not detection.","multi":false},{"id":"1ihn3b1","q":"Which of the following are purposes of fencing? (Select THREE.)","a":"Serving as a visual deterrent and boundary;  Acting as a physical barrier;  Delaying intruders to allow detection and response","why":"Fencing deters, blocks, and delays PEOPLE along a perimeter. Stopping heavy vehicles and dissipating blast energy is the bollard family's job; identity verification belongs to badges, PINs, and biometrics.","multi":true},{"id":"j15ptp","q":"Which items appear on the course's list of PHYSICAL brute-force attack forms? (Select THREE.)","a":"Forcible entry, including glass cutting;  Tampering with security devices;  Confronting security personnel","why":"The four brute-force forms are forcible entry, tampering with security devices, confronting security personnel, and ramming barriers with vehicles. Badge cloning is a separate 2.4 attack; heating a room and wire-cutting are bypass techniques from the surveillance-defeat lesson.","multi":true},{"id":"1jbfeuj","q":"A security architect wants layered defenses against surveillance-defeat techniques. Which countermeasures does the course recommend? (Select THREE.)","a":"Tamper alarms on cameras and sensors;  UPS and backup power for security systems;  Encrypted frequency hopping for wireless links","why":"The course's countermeasure trio: tamper alarms (detect obstruction/tampering), UPS/backup power (defeat power-supply attacks), and encrypted frequency hopping (defeat jamming/eavesdropping). Single-type sensor fleets are weaker — redundancy across sensor types is the defense.","multi":true},{"id":"fahuq8","q":"Which of the following are defenses against access badge cloning? (Select THREE.)","a":"Advanced encryption of badge data;  Multifactor authentication, such as badge plus PIN;  Shielded wallets or sleeves for RFID badges","why":"Course defenses: encrypt badge data, add MFA so clones alone don't work, update keys/protocols regularly, educate users, shield badges in transit, and audit logs for impossible usage. Static keys and disabled audits make cloning easier, and printing codes on badges hands them to attackers.","multi":true},{"id":"1p0ponp","q":"What is a bollard?","a":"A short, sturdy vertical post used to control vehicle access","why":"Bollards are short, sturdy vertical posts (steel or concrete) that control vehicle access — keeping cars and vehicle-borne threats away from a building. Buried mesh is a fence defense, the double-door system is an access control vestibule, and the warm-body sensor is infrared.","multi":false},{"id":"1rwcw06","q":"In physical security terms, what does 'brute force' mean?","a":"Forcible entry: breaking in, tampering with security devices, confronting guards, or ramming barriers","why":"Physical brute force means forcible entry — breaking down doors or cutting glass, tampering with security devices, confronting security personnel, and ramming barriers with vehicles. Trying every combination is the digital/crypto meaning of brute force, and badge cloning is a separate attack.","multi":false},{"id":"1v76amh","q":"What is an access control vestibule?","a":"A double-door system where only one door can be open at a time","why":"An access control vestibule is a double-door system, electronically controlled so only one door opens at a time. A person who fails verification is held in the intermediate space between the untrusted outside and the trusted inside until security personnel intervene.","multi":false},{"id":"eaerod","q":"An authorized employee intentionally badges in a delivery driver carrying boxes who has no authorization. What is this called?","a":"Piggybacking","why":"Piggybacking involves two people, with the authorized one intentionally allowing the unauthorized person in — usually after social engineering (the delivery-driver-with-boxes ruse is the course's classic example). Tailgating is following someone WITHOUT their knowledge or consent.","multi":false},{"id":"t0t4nw","q":"An unauthorized person slips through a turnstile immediately behind an employee who badge-swiped, without the employee noticing. What is this?","a":"Tailgating","why":"Tailgating is the covert, opportunistic act of closely following an authorized person through a checkpoint without their knowledge or consent — the turnstile scenario is the course's example. Piggybacking requires the authorized person's complicity or negligence.","multi":false},{"id":"1j3jwzv","q":"Which of the following is NOT one of the three purposes of fencing?","a":"Dissipating the energy of a ramming vehicle","why":"Fencing deters, blocks, and delays PEOPLE. Absorbing or dissipating vehicle impact energy is the job of bollards and reinforced barriers — the vehicular-threat counterpart to fencing.","multi":false},{"id":"q4orjd","q":"To defend a fence against someone CLIMBING it, which countermeasures does the course recommend?","a":"A taller fence, electrification, or barbed wire","why":"Climbing is countered by making the climb harder or painful: taller fences, electrification, barbed wire. Robust materials + monitoring answer CUTTING; buried mesh answers DIGGING; bollards address vehicles, not climbers.","multi":false},{"id":"ummm3a","q":"Which fence countermeasure pair correctly matches 'cutting' and 'digging under'?","a":"Cutting → robust materials and monitoring; digging → an underground fence portion or buried mesh","why":"Cutting is defeated with robust materials and monitoring; digging under is defeated by extending the fence underground or burying mesh. Taller/electrified/barbed-top fences are the anti-climbing measures.","multi":false},{"id":"59c5lb","q":"Why did bollards become widespread after 9/11?","a":"As an anti-terrorism measure keeping vehicle bombs outside a building's blast radius","why":"Post-9/11, bollards were deployed as anti-terrorism measures: by keeping vehicles (and vehicle-borne IEDs) away from buildings, any blast stays outside the blast radius. They also stop ram raiding of storefronts.","multi":false},{"id":"dfgrec","q":"What does the ASTM F2656-07 rating 'M30 P1' tell you about a bollard?","a":"It stops a 15,000-lb vehicle traveling 30 mph with less than 1 meter of penetration","why":"M30 P1 means the bollard stops a 15,000-lb vehicle at 30 mph with P1-level penetration — less than 1 meter past the barrier. Bollards address the primary threat of direct vehicle impact.","multi":false},{"id":"1w6kykp","q":"In its digital sense, how many combinations must an attacker try to guarantee cracking a 4-digit PIN by brute force?","a":"10,000","why":"A 4-digit PIN ranges 0000–9999, which is 10,000 possible combinations. Brute force in the cyber sense means trying every possibility until one works.","multi":false},{"id":"mx03xh","q":"Which set completely covers the course's four forms of PHYSICAL brute force?","a":"Forcible entry, tampering with security devices, confronting security personnel, ramming barriers with vehicles","why":"The four physical brute-force forms: forcible entry (including glass cutting), tampering with security devices, confronting security personnel, and ramming barriers with vehicles. The other lists are social-engineering, wireless-fraud, and intrusion techniques respectively.","multi":false},{"id":"6g6o08","q":"According to the course, what is the weakest point of a door?","a":"The lock","why":"The lock is the door's weakest point. Defenses therefore focus on high-strength doors, deadbolts, metal frames, and solid-core construction to resist forcible entry.","multi":false},{"id":"u741p6","q":"An intruder throws a heavy rug over the barbed wire topping a fence and climbs over. Which brute-force form is this?","a":"Climbing/cutting the fence — a form of forcible entry","why":"Fences can be climbed, cut, or rammed — the rug-over-barbed-wire trick is a forcible-entry technique against the fence itself. Nothing was rammed and no guard was confronted, and the barbed wire wasn't disabled in advance, so it isn't tampering with security devices.","multi":false},{"id":"1as5zmd","q":"Which defenses does the course recommend against forcible entry through glass?","a":"Reinforced or laminated windows","why":"Glass cutting is a forcible-entry technique, and the defense is reinforced or laminated windows that resist cutting and breaking. For doors: high-strength construction, deadbolts, metal frames, solid cores.","multi":false},{"id":"bti3wx","q":"Which of the four surveillance categories is described as the most flexible and adaptable?","a":"Security guards","why":"Security guards are the most flexible and adaptable control — they can detect unusual behavior, make judgment calls, respond immediately, and act as a visual deterrent. Cameras, lights, and sensors all do fixed jobs.","multi":false},{"id":"9anbrp","q":"What does PTZ stand for in camera systems, and where are PTZ cameras typically operated?","a":"Pan-Tilt-Zoom — from a central guard-operated monitoring station","why":"PTZ = Pan-Tilt-Zoom. These cameras can be remotely aimed and zoomed, and are typically operated by guards at a central monitoring station covering entrances/exits of critical infrastructure.","multi":false},{"id":"novu39","q":"What is the main trade-off of WIRELESS surveillance cameras compared with wired ones?","a":"They are easier to install but susceptible to jamming and interference","why":"Wireless cameras are easier to install (no cabling run), but their signals can be jammed or interfered with — the classic convenience-vs-security trade-off. Wired cameras are cabled directly to the monitoring station.","multi":false},{"id":"pmmhik","q":"Which sensor works by echolocation — emitting sound waves and measuring their reflection, like a bat?","a":"Ultrasonic","why":"Ultrasonic sensors use echolocation (the course's bat analogy) and are common in automated doors and indoor spaces. Infrared senses heat, pressure senses weight, and microwave emits pulses that measure reflection over large areas.","multi":false},{"id":"t49591","q":"A warehouse needs motion sensing across a very large open area, but managers are warned about false alarms. Which sensor fits, and what is the caveat?","a":"Microwave sensors — they cover large areas but are prone to false alarms at high sensitivity","why":"Microwave sensors emit pulses and measure reflection, covering large areas — but at high sensitivity they produce false alarms. Infrared actually excels in low light; pressure needs contact/weight; ultrasonic is best indoors.","multi":false},{"id":"1h7dvw6","q":"A night-shift camera review shows a lens covered in spray paint and foam, with stickers taped around the housing. Which bypass category is this?","a":"Visual obstruction","why":"Spray paint, foam, and stickers/tape over a lens are textbook visual obstruction (balloons and umbrellas over a lens are the other course examples). It only becomes 'physical tampering' if wires are cut or the device is damaged.","multi":false},{"id":"l5hqxh","q":"How can an attacker blind an INFRARED motion sensor?","a":"Heat up the room so the sensor can no longer distinguish body heat","why":"Infrared sensors detect warm bodies, so raising the room's temperature masks a person's heat signature. Lasers blind cameras visually; loud music interferes with acoustics; cutting the cable is physical tampering.","multi":false},{"id":"13klfno","q":"Which countermeasure protects wireless systems against both jamming and eavesdropping?","a":"Encrypted frequency hopping","why":"Encrypted frequency hopping defeats attempts to jam or eavesdrop on wireless communications by constantly changing frequencies and encrypting the traffic. The other options address visibility, forcible entry, and power loss respectively.","multi":false},{"id":"1qzsurg","q":"An attacker unplugs a camera's power cable and later sabotages an outdoor transformer. Which two bypass categories are involved?","a":"Attacking the physical environment and physical tampering","why":"Killing the power supply — unplugging devices, tampering with power boxes, sabotaging transformers — is attacking the physical environment; crude wire-cutting up close is physical tampering. Both are defeated by UPS/backup power and tamper alarms.","multi":false},{"id":"19es28c","q":"Which defense set does the course pair with the bypass methods in this lesson?","a":"Tamper alarms, UPS/backup power, and encrypted frequency hopping","why":"The lesson's countermeasures are tamper alarms (detect obstruction/tampering), UPS and backup power (defeat power-supply attacks), and encrypted frequency hopping (defeat wireless jamming/eavesdropping). The other sets are physical-barrier, biometric, and badge-cloning defenses.","multi":false},{"id":"129upzn","q":"Why does a single-person-sized access control vestibule help prevent piggybacking and tailgating?","a":"There is simply not enough room for two people to pass together","why":"Many vestibules are only large enough for one person, so a second person physically cannot slip in with or behind an authorized user. It's a space design control, not a weighing, imaging, or jamming control.","multi":false},{"id":"1d7w4rk","q":"A visitor enters the outer door of a vestibule, which locks behind them. Their badge check fails. What happens next?","a":"They remain trapped in the vestibule until security personnel intervene","why":"A failed verification leaves the person stuck in the intermediate space between untrusted outside and trusted inside until security decides to let them in or send them back out the outer door. That's the whole point of only one door opening at a time.","multi":false},{"id":"1jcsf8n","q":"Besides acting as a visual deterrent, what two checkpoint roles do security guards serve at vestibules?","a":"Verification assistance (e.g., badge system down, visitors) and immediate response to breaches","why":"Guards verify identity when electronic badging fails or visitors arrive (issuing temporary badges per policy), and provide immediate response — confronting an intruder or initiating emergency protocols. The human element backs up the technology.","multi":false},{"id":"x40mez","q":"Every time an employee badges through a checkpoint, the action is logged. What is the primary security value of this?","a":"It creates an audit trail that can be reviewed if a security breach occurs","why":"Badge-use logging builds an audit trail — who passed which checkpoint and when — that investigators can review after a breach. It's also the same log that later catches cloned-badge 'impossible travel' usage.","multi":false},{"id":"f9mrql","q":"Which statement correctly distinguishes piggybacking from tailgating?","a":"Piggybacking involves complicity or negligence by an authorized person; tailgating happens without the authorized person's knowledge or consent","why":"Piggybacking = the authorized person intentionally (or negligently) lets the attacker in — typically via social engineering. Tailgating = opportunistically following an authorized person through a checkpoint without their knowledge or consent. The victim's complicity is the dividing line.","multi":false},{"id":"1cu3pr7","q":"Why does the course say all perimeter defenses become useless at some point? When is that point?","a":"The moment somebody has entered the building and can roam the halls","why":"Fences, bollards, cameras, and lobby guards all protect the boundary. Once a person is inside and walking the halls, interior protections — above all door locks on server rooms, network closets, and offices — are what protect sensitive data.","multi":false},{"id":"vgoaf9","q":"Which two tools does a lock picker use to defeat a basic pin-and-tumbler padlock in about 15 seconds?","a":"A lock pick and a tension wrench","why":"The course demo uses a lock pick (single tooth to move pins up and down) plus a tension wrench applying constant turning pressure. Basic padlocks use a pin-and-tumbler system that is easy to defeat this way.","multi":false},{"id":"1mfzjx5","q":"What is a cipher lock?","a":"A mechanical locking mechanism with numbered push buttons requiring the correct combination","why":"A cipher lock is an older mechanical lock: numbered push buttons, correct combination required. Cipher locks are used on server rooms, network closets, and other high-security areas; they cost more than office locks but give higher protection.","multi":false},{"id":"a302c3","q":"In biometrics, the False Acceptance Rate (FAR) is the rate at which the system:","a":"Accepts a user who should NOT have been granted access","why":"FAR = the system authenticates someone as valid even though they should not be granted access — a security failure. (Denying an authorized user is the False Rejection Rate, a usability failure.) Ideally FAR goes to zero as sensitivity rises — but that raises FRR.","multi":false},{"id":"e8u4sj","q":"What does the Crossover Error Rate (CER) measure, and what should a buyer look for?","a":"The point where FAR equals FRR — a lower CER means a better biometric system","why":"The CER (aka Equal Error Rate) is where False Acceptance and False Rejection Rates intersect. It's the standard effectiveness measure for biometric systems — the lower the CER, the better the balance of security and convenience.","multi":false},{"id":"xslpx","q":"Place the access badge cloning attack in the course's correct order of steps.","a":"Scanning, data extraction, writing to a new card or device, using the clone","why":"The four steps: (1) scan/read the badge with a handheld RFID/NFC reader, (2) extract the identifier/credentials from the capture, (3) write them to a blank card or device, (4) use the clone, which behaves exactly like the original.","multi":false},{"id":"184cfv3","q":"Which cloning ranges does the course give for NFC and RFID badges (with a normal reader)?","a":"NFC 1–2 inches; RFID 2–10 inches","why":"Attackers must get close: about 1–2 inches for NFC and 2–10 inches for RFID. A stronger antenna can roughly double those ranges, but the attacker still needs proximity — which is why shielded wallets work as a defense.","multi":false},{"id":"fc7bm0","q":"In the course demonstration, which device reads a 125 kHz RFID tag, stores the code, and then either emulates the badge or writes it to a blank tag?","a":"The Flipper Zero","why":"The Flipper Zero is the course's cloning tool of choice: compact, stores many scanned codes, reads 125 kHz RFID, then either emulates the badge at the reader or writes the code to a blank RFID tag.","multi":false},{"id":"3b70kh","q":"Which defense makes a cloned badge useless even after a perfect copy has been made?","a":"Multifactor authentication — the badge plus a PIN, password, or biometric","why":"MFA is the control that neutralizes an already-cloned badge: the attacker still needs the second factor (e.g., the victim's 8-digit PIN). Shielding prevents cloning, and log audits detect cloning — but only MFA defeats the clone at the door.","multi":false},{"id":"u0fdjo","q":"A badge is used to enter the office at 9:04 a.m., but the badge owner is verified to be at a conference across the country. Which control should have flagged this, and what does it indicate?","a":"Access-log monitoring and auditing — impossible usage indicating a cloned badge","why":"Regular review of access logs catches anomalies like 'impossible travel' — the badge being used while the owner is elsewhere — a strong indicator of cloning. It's the detective control; MFA and shielding are the preventive ones.","multi":false},{"id":"30wjn8","q":"A retailer wants to protect its storefront from smash-and-grab vehicle attacks while keeping the entrance visually appealing. Which option achieves both goals?","a":"Concrete planters and decorative spheres placed as disguised bollards","why":"Bollards don't have to look like bollards — cement planters and decorative spheres (the course cites Target's red balls) stop ram raiding while blending into the scenery. Fences, carts, and mats do nothing against a moving vehicle.","multi":false},{"id":"1fu38h0","q":"An attacker defeats a wired alarm by generating interference on the facility's wireless camera network. Which bypass category does this fall under, and what is the recommended countermeasure?","a":"Electromagnetic interference — counter with encrypted frequency hopping","why":"Jamming wireless setups, EMI generators, and targeting the Wi-Fi band are all electromagnetic interference. The course's countermeasure is encrypted frequency hopping, which defeats both jamming and eavesdropping on the wireless link.","multi":false},{"id":"xfyxvz","q":"Which statement about WIRED versus WIRELESS surveillance cameras is correct?","a":"Wireless cameras are easier to install but susceptible to jamming and interference","why":"Wireless wins on installation convenience (no cable runs) but its signals can be jammed or interfered with. Wired cameras are cabled to the monitoring station — harder to disrupt. Both can support night vision, motion detection, and facial recognition.","multi":false},{"id":"sf2mck","q":"A museum gallery uses floor mats that trigger an alert when someone steps on them after hours. Which sensor technology is at work?","a":"Pressure","why":"Pressure sensors detect weight on a floor area or mat — exactly this use case. Infrared senses heat, microwave floods a large area with pulses, and ultrasonic uses echolocation.","multi":false},{"id":"gjveug","q":"Guards on patrol find a fence gate forced open and several camera lenses sprayed with paint on the same night. Together, these actions are BEST described as:","a":"Brute force (tampering with security devices) to defeat multiple layers of detection","why":"Forcing a gate open and blinding cameras/sensors with paint are both forms of tampering with security devices — one of the four physical brute-force forms. Hitting several controls in one night shows deliberate layering defeat; the defense is redundancy and multiple layers.","multi":false},{"id":"1r9lpam","q":"Why are motion-activated lights considered a two-for-one security control?","a":"They serve as a deterrent when they snap on AND alert occupants that something is moving","why":"Motion-activated lighting is both a deterrent (light suddenly revealing an area) and an alert (the light coming on signals movement). Lighting also improves video quality and removes hiding spots — but its signature dual role is deterrent + alert.","multi":false},{"id":"4b485g","q":"An unauthorized researcher follows an employee through an open turnstile two seconds after the employee badges in — the employee never notices. Which term applies?","a":"Tailgating, because entry was gained without the authorized person's knowledge or consent","why":"Tailgating = closely following an authorized person through a checkpoint without their knowledge or consent — opportunistic and covert. Piggybacking requires the authorized person's complicity or negligence; neither is present here.","multi":false},{"id":"1b8dsk1","q":"A vestibule's badge reader goes offline during a power glitch. A visitor without a badge arrives. According to the course, what should happen at a staffed checkpoint?","a":"The security guard verifies the visitor's identity and grants limited access with a temporary badge per policy","why":"Guards provide verification assistance when electronic systems fail — checking a visitor's identity and issuing a temporary badge under organizational policy. The human element exists precisely to back up the technology.","multi":false},{"id":"1y7w57j","q":"Which authentication-factor pairing does the course describe for turnstiles in an open lobby?","a":"Badge plus PIN — something you have plus something you know","why":"The lobby-turnstile design is badge (something you HAVE) + PIN (something you KNOW) — true multifactor authentication. The area between the front door and the turnstiles is itself an access control vestibule.","multi":false},{"id":"1iklgr","q":"A security manager must choose a lock for a network closet. The requirement: mechanical, no batteries or network, combination entry, higher protection than a standard office lock. Which lock fits?","a":"A cipher lock","why":"A cipher lock is a mechanical push-button combination lock used on server rooms, network closets, and high-security areas. It costs more than an office lock but provides a higher level of protection — and needs no power or network.","multi":false},{"id":"1t3nwvb","q":"An organization wants to shorten how long a cloned badge remains usable if cloning occurs anyway. Which mitigation directly targets that window?","a":"Regularly updating encryption keys and authentication protocols","why":"Periodically rotating encryption keys and authentication mechanisms limits how long a cloned badge works — the clone ages out. Shielding prevents cloning, training helps people protect badges, and guards add a preventive layer, but key rotation is the one that shortens the clone's useful life.","multi":false},{"id":"rl1q8p","q":"Why does the course call access badge cloning a 'stealthy' attack?","a":"The attacker never needs to possess the original badge — data is copied quietly and reused without raising suspicion","why":"Cloning is stealthy because the original badge stays in the victim's pocket — a concealed reader copies the data in passing, and the clone is used without touching or alerting the owner. Combined with cheap, easy tooling, that makes it a widespread physical-security threat.","multi":false},{"id":"11tupf1","q":"Which behaviors correctly describe PIGGYBACKING rather than tailgating? (Select THREE.)","a":"The authorized person intentionally allows the unauthorized person in;  Social engineering is commonly used to gain the authorized person's cooperation;  The authorized person acts through complicity or negligence","why":"Piggybacking's signature is the authorized person's involvement — intentional allowance, typically won through social engineering (the delivery-driver-with-boxes ruse), constituting complicity or negligence. Unawareness defines TAILGATING; no badge theft or cloning is involved; and it works on ordinary doors too.","multi":true},{"id":"1ry7rjm","q":"Which capabilities does the course attribute to security GUARDS as a surveillance and control measure? (Select THREE.)","a":"Detecting unusual behavior and making judgment calls;  Responding immediately to an incident;  Serving as a visual deterrent by their presence","why":"Guards are the most flexible, adaptable control: they notice unusual behavior, exercise judgment, respond immediately, and deter by presence. Tireless recording is the camera's trait; encryption and automated logging are system functions, not guard functions.","multi":true},{"id":"1bn4wgy","q":"A company is hardening doors against forcible entry. Which measures does the course recommend? (Select THREE.)","a":"High-strength doors;  Deadbolts;  Metal frames with solid-core construction","why":"Against forcible entry, the course prescribes high-strength doors, deadbolts, and metal frames/solid cores — because the lock is the door's weakest point. Glass sidelights invite glass cutting; privacy locks and basic padlocks are defeated in seconds to a minute.","multi":true},{"id":"9c2jtu","q":"Which are valid performance metrics for a biometric door lock? (Select THREE.)","a":"False Acceptance Rate (FAR);  False Rejection Rate (FRR);  Crossover Error Rate (CER)","why":"Biometric effectiveness is measured by FAR (accepting impostors), FRR (rejecting legitimate users), and the CER where the two curves cross — lower CER is better. FPS, RPM, and BPS belong to cameras, motors, and networks.","multi":true},{"id":"14risut","q":"Scenario: A regional bank is designing a new branch. Threat modeling identifies (1) hostile surveillance of the ATM vestibule, (2) a vehicle-borne IED risk from the adjacent street, and (3) after-hours roof access via the alley. The board demands ONE control per threat, matched correctly. Which mapping does the architect propose?","a":"ATM vestibule → CCTV with recording and review; vehicle risk → ASTM F2656-07-rated bollards; roof access → robust fencing with monitoring against cutting","why":"Match control to threat: surveillance of people/space = video (a detective control that records and reviews); vehicle-borne threat = crash-rated bollards keeping blasts outside the blast radius; roof/perimeter access against cutting = robust fence materials with monitoring. The distractor mappings each pair a control with the wrong threat class.","multi":false},{"id":"ejh3ii","q":"Scenario: At 02:15, a museum's cameras go dark, the lobby lights snap on, and a microwave sensor floods the gallery with alerts — but nothing is moving. Ten minutes later an infrared sensor in the same gallery is silent during an actual intrusion. Which sequence BEST explains the night?","a":"Heating the gallery blinded the infrared sensor first, and the microwave false alarms came from its sensitivity being set too high","why":"Two independent facts from the lesson: microwave sensors cover large areas but are prone to FALSE ALARMS at high sensitivity (explains 02:15), and heating a room masks body heat so INFRARED sensors miss intruders (explains the silent gallery). Wire-cutting would be physical tampering; nothing indicates cameras were sprayed or an EMI generator was used.","multi":false},{"id":"npje55","q":"A CISO asks: 'We tuned our fingerprint locks until impostors are never accepted. Now executives are complaining they can't reliably enter their own offices. Which metric did we minimize, which did we inflate, and what specification should we have compared when buying?'","a":"We minimized FAR, inflated FRR, and should have compared the Crossover Error Rate","why":"Cranking sensitivity drives the False Acceptance Rate toward zero — but inflates the False Rejection Rate, locking out legitimate users (here, executives). The right buying criterion is the Crossover Error Rate, where FAR and FRR intersect: lower CER = better system. Battery life, speed, and capacity don't measure accuracy.","multi":false},{"id":"1eaxp73","q":"Scenario: An employee badges into the data center at 08:58. The same badge is presented at the loading dock at 09:07 — while that employee is on a video call, visibly at their desk. No tailgating is observed. Which conclusion and response pair is BEST?","a":"A cloned badge is likely in use; review access logs for anomalies and enforce MFA so the clone alone cannot work","why":"Simultaneous use in two places is the classic 'impossible usage' pattern that access-log auditing exists to catch — it indicates a cloned badge (likely copied earlier by a concealed reader). Detective response: log review; preventive hardening: MFA (badge + PIN) so the clone alone is useless, plus key rotation to age it out.","multi":false},{"id":"1cia0cq","q":"An attacker defeats a facility's no-wireless policy by broadcasting on its cameras' frequency band, then holds a bright light against a door camera's lens while forcing a service gate. Which THREE categories — in order: wireless disruption, camera defeat, gate entry — did the attacker use?","a":"Electromagnetic interference; blinding sensors/cameras; brute force (forcible entry)","why":"Broadcasting on the target band = electromagnetic interference (the no-wireless facility scenario from the lesson). A bright light held to the lens = blinding sensors/cameras. Forcing the gate = physical brute force. The exam rewards precise category names: jamming is EM interference, not 'tampering,' and a forced gate isn't tailgating.","multi":false},{"id":"18965h5","q":"LEAST appropriate: A jewelry store in a shared mall corridor wants to stop smash-and-grab robbers who drive into storefronts. Which control is the LEAST appropriate primary defense?","a":"An underground mesh extension beneath the storefront","why":"The threat is vehicular. Bollards — disguised or rated — exist precisely for vehicle impact (ram raiding and blast standoff). Underground mesh defeats DIGGING under a fence; it does nothing against a moving vehicle, making it the least appropriate primary control here.","multi":false},{"id":"12512w1","q":"Scenario: A hospital's newborn ward uses a vestibule. A nurse badges in; seconds later a man in scrubs follows her through the inner door before it closes. The nurse never saw him. Which statement is MOST accurate?","a":"This is tailgating — covert following without the authorized person's knowledge — and a single-person vestibule is the design-level defense","why":"The nurse was unaware and did not consent — that makes it tailgating regardless of how many badge reads occurred. The structural fix is a vestibule sized for one person (no room to follow) plus guards. Scrubs are a disguise detail, but the attack on the door control is tailgating, not impersonation of a specific identity.","multi":false},{"id":"qpyqt7","q":"A consultant must brief executives on why a $50 padlock was rejected for the network closet. Which explanation is MOST accurate?","a":"Basic pin-and-tumbler padlocks can be picked by a skilled attacker in about 15 seconds using a lock pick and tension wrench","why":"The course's point is concrete: pin-and-tumbler padlocks are easy to defeat — about 15 seconds with a pick and tension wrench. Better choices for a closet: cipher locks, electronic PIN or biometric locks, ideally combined as MFA. Integration and lightning are irrelevant distractors.","multi":false},{"id":"11fyn76","q":"Scenario: A concert venue's perimeter fence was climbed, then cut in a second attempt, then tunneled under in a third. After each breach, the venue added the matching countermeasure. Which set did they end up with?","a":"Barbed wire and taller fence; robust materials and monitoring; underground fence portion or buried mesh","why":"Anti-climb: taller fence, electrification, barbed wire. Anti-cut: robust materials plus monitoring. Anti-dig: underground portion or buried mesh. Option A scrambles the pairings (electrification vs. robust materials vs. buried mesh map to climb/cut/dig in order). Options C and D are interior/vehicle controls, not fence countermeasures.","multi":false},{"id":"1ofbocv","q":"An organization wants guards, cameras, and sensors to keep working through a targeted power-supply attack on its security systems. Which design BEST achieves this?","a":"UPS and backup power for the security systems, with tamper alarms to detect power-box interference","why":"The lesson pairs power attacks (unplugging, power-box tampering, transformer sabotage) with UPS/backup power, and detection of the tampering itself with tamper alarms. Frequency hopping answers jamming; redundancy answers sensor defeat; tamper alarms alone don't keep systems powered.","multi":false},{"id":"1hjx9ew","q":"Scenario: Penetration testers, hired by a bank, stand near the entrance 'reading a map' with a concealed reader in a shoulder bag. Employees badge through the turnstile nearby all morning. By afternoon the testers open a side door with a cloned card. Which statement BEST captures why this attack succeeded and the primary control that would have stopped it?","a":"The testers cloned badges within RFID/NFC proximity; MFA requiring a PIN after the badge would have made the clones useless at the door","why":"The scenario describes cloning: a concealed reader captured badges within 1–2 inches (NFC) or 2–10 inches (RFID), and a written clone opened the door. MFA (badge + PIN) is the control that defeats an already-made clone. No following, lock-picking, or jamming occurred.","multi":false},{"id":"1rqt2sj","q":"BEST answer: A data center manager wants the front-door control to provide (a) identity verification against a central database, (b) per-person audit trails, (c) resistance to defeated-badge scenarios, and (d) a fallback when electronics fail. Which single design satisfies all four BEST?","a":"Badge-plus-PIN turnstile vestibule with security personnel stationed at the checkpoint","why":"The turnstile vestibule with badge + PIN delivers verification against the central database, per-person logging (audit trail), MFA resistance to cloned badges, and — with stationed guards — a human fallback for badge-system failures and visitors. Cipher locks lack logging; fingerprint-only is a single factor with FAR/FRR tradeoffs; lighting is not an entry control.","multi":false},{"id":"1qcimhe","q":"Scenario review: An intruder hits a facility in stages — loud music near an acoustic sensor, bright lights aimed at two cameras, and the server room warmed well above normal. Which THREE lesson categories cover these actions? (Select THREE.)","a":"Interfering with acoustics;  Blinding sensors/cameras;  Attacking the physical environment (temperature manipulation)","why":"Loud music = acoustic interference; lights aimed at lenses = blinding sensors/cameras; heating the server room = attacking the physical environment (and incidentally blinding infrared sensors). No paint, wire-cutting, or badge copying occurred — the exam often lists six actions where only three match the asked categories.","multi":true},{"id":"p3zya0","q":"Which defenses does the course recommend AGAINST access badge cloning? (Select THREE.)","a":"Encrypting badge data with advanced algorithms;  Requiring a second factor such as a PIN alongside the badge;  Rotating encryption keys and updating authentication protocols regularly","why":"The six course mitigations include: advanced encryption (basic systems often have none), MFA (badge + PIN/password/biometric), and regular protocol/key updates that age out clones — plus user education, shielded wallets/sleeves, and access-log auditing. Printing identifiers and extending read ranges both help attackers; disabling logging destroys the detective control.","multi":true},{"id":"dv0x49","q":"A guard force is being evaluated as a physical control. Which capabilities can guards provide that fixed technology cannot? (Select THREE.)","a":"Making judgment calls about unusual behavior;  Verifying visitors and issuing temporary badges when the badge system is offline;  Providing an immediate response — confronting an intruder or initiating emergency protocols","why":"Guards are the most flexible, adaptable control: judgment, identity verification with a human fallback (including visitor handling per policy), and immediate physical response. Recording is the camera's job; fingerprint matching is the lock's; automated jam detection is a technical control.","multi":true},{"id":"4tffn9","q":"Which statements about bollards are TRUE per the course? (Select THREE.)","a":"They became widespread after 9/11 as an anti-terrorism measure;  They keep vehicles away so IED blasts stay outside a building's blast radius;  They can be disguised as cement planters or decorative spheres","why":"Bollards' story: post-9/11 anti-terrorism deployment, blast-radius standoff for vehicle bombs, anti-ram-raid protection, and real-world disguises like planters and Target's red balls. Their known weakness: temporary/removable models can be tampered with or removed. Fence cutting is answered by robust materials + monitoring.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>

<script id="back-lib-script">
(function () {
  if (window.__backBtnInit) return; window.__backBtnInit = true;
  function lib() { return "../library.html"; }
  function resultVisible() {
    var rs = document.getElementById('result-screen');
    if (rs && !rs.classList.contains('hidden') && rs.offsetParent !== null) return true;
    var big = document.querySelector('.score-big');
