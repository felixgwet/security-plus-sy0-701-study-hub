<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #f0883e; --accent-dim: rgba(240,136,62,.14);
    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .topbar .grow { flex: 1; }
  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }
  h1 { font-size: 24px; margin: 10px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }
</style>

  <p class="sub">Tap the card to flip it, then grade yourself honestly &mdash; the deck remembers what you know and will prioritize your weak cards.</p>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span>cards</span></div>

  <script>
    var DECKS = [{"label":"Section 1 · Security Fundamentals","cards":[{"id":"177vhez","q":"An ISP ships home routers with a long random Wi-Fi password printed on the device, and most customers immediately change it to something simple like 'magic2912'. What security principle does this illustrate?","a":"Security and usability are always at odds, and users bypass controls that are too painful","why":"The core tension of security: make something more secure and it becomes less usable; make it more convenient and it becomes less secure. Users will actively bypass painful controls, so you design for the sweet spot.","multi":false},{"id":"lh9lnu","q":"A company encrypts its customer database so the data itself stays protected no matter which device holds it. Which discipline is this?","a":"Information security","why":"Information security protects the data/information itself. Information system security protects the systems (servers, network devices) that hold and process the data. Encryption of the data = information security.","multi":false},{"id":"1epqddf","q":"An unpatched flaw in a web server allows an attacker to take it over. In risk terms, the unpatched flaw is the ______ and the attacker is the ______.","a":"vulnerability; threat","why":"A vulnerability is a weakness that could be exploited. A threat is any activity or event with the potential to cause harm. The threat exploits the vulnerability, creating risk.","multi":false},{"id":"1m02ai2","q":"Which of the following are methods of achieving confidentiality? (Select THREE.)","a":"Encryption;  Data masking;  Physical security controls","why":"The course's five confidentiality methods: encryption, access controls, data masking, physical security, and training/awareness. Load balancing and redundant power support availability, not confidentiality.","multi":true},{"id":"s8kmck","q":"A software vendor publishes a file along with its SHA-256 value so customers can verify the download was not altered. Which pillar of security (and which method) does this serve?","a":"Integrity — hashing","why":"A hash fingerprint proves the file was not changed or corrupted — that is integrity. Hashing, digital signatures, checksums, access controls, and audits are the five integrity methods.","multi":false},{"id":"1d0jp5k","q":"A cloud provider advertises 'five nines' of availability. Approximately how much downtime per year does that allow?","a":"5.26 minutes","why":"Five nines = 99.999% uptime = about 5.26 minutes of downtime per year. (Three nines = 8.76 hours; four nines = 52.56 minutes.)","multi":false},{"id":"oub6tj","q":"An organization maintains a fully equipped second data center in another city that can take over operations if the primary site fails. Which type of redundancy is this?","a":"Geographic (site) redundancy","why":"A second site in a different location is geographic/site redundancy. The four types are geographic, hardware, software, and data redundancy.","multi":false},{"id":"1v14nfl","q":"A digitally signed email is the classic example of which security concept?","a":"Non-repudiation","why":"Non-repudiation guarantees an action took place and cannot be denied by the parties involved — the sender cannot deny sending a digitally signed message. It relies on integrity (the signature) to work.","multi":false},{"id":"12tjzhr","q":"Which of the following are valid authentication factors? (Select THREE.)","a":"Something you know;  Something you have;  Something you are","why":"The five factors: something you know (password/PIN), something you have (smart card/token/phone), something you are (biometrics), something you do (behavior), and somewhere you are (location). 'Approve' and 'configure' are not factors.","multi":true},{"id":"1f7jkp6","q":"A user logs in with a password and then types a code sent to their phone. Which statement is correct?","a":"This is MFA because it combines two different factor categories — something you know and something you have","why":"MFA requires two or more factors from DIFFERENT categories. Password (know) + phone code (have) = two categories = MFA. Two things from the same category (password + security question) would not be.","multi":false},{"id":"7zf44j","q":"On a file server, the owner of a shared folder decides who else may read and write it. Which authorization model is in use?","a":"Discretionary Access Control (DAC)","why":"In DAC the resource OWNER decides who gets access. In MAC the system labels decide (users cannot change permissions); in RBAC permissions attach to roles; rule-based rules apply to everyone.","multi":false},{"id":"1rl8i5d","q":"A hospital assigns permissions to job functions — 'Nurse', 'Physician', 'Billing' — and every account inherits the permissions of its assigned function. Which model is this?","a":"RBAC","why":"Role-Based Access Control attaches permissions to roles; joining a role grants its permissions. It simplifies administration when many users share the same job function.","multi":false},{"id":"1hccbck","q":"Which tools are commonly used for accounting — tracking user activity and resource utilization? (Select TWO.)","a":"Syslog;  SIEM","why":"The course's accounting tools: Syslog (centralized logs), Wireshark (packet analysis), and SIEM (log correlation and alerting). A firewall is a preventive control and antivirus is detection/correction — not accounting tools.","multi":true},{"id":"1qlqhta","q":"In a Zero Trust architecture, which component sits in the DATA plane and makes the allow/deny decision at the resource itself?","a":"The policy enforcement point (PEP)","why":"The data plane consists of the subject/system and the policy enforcement point, which executes the decision at the resource. The policy engine and policy administrator belong to the control plane, which defines the policies.","multi":false},{"id":"pvl99j","q":"A factory cannot upgrade a legacy controller to support modern encryption, so it tunnels all its traffic through a VPN instead. The VPN tunnel is an example of which control type?","a":"Compensating","why":"A compensating control is the alternative measure used when the primary control is not feasible — here, the VPN compensates for the legacy system's inability to do modern encryption.","multi":false},{"id":"1vl8z7o","q":"Throughout the course, the instructor returns to one 'delicate balance' that security professionals constantly manage. What is it?","a":"Security vs. usability (convenience)","why":"People want things easy and convenient; as convenience increases, the security posture loosens. Tighten security too much and users find ways around it. The sweet spot is convenient for users but hard for threat actors.","multi":false},{"id":"1hg68s7","q":"Your colleague says her team is responsible for protecting the servers, network devices, and smartphones that hold company data. Which term describes this focus?","a":"Information system security","why":"Information system security protects the systems that hold and process critical data (computers, servers, network devices, smartphones). Information security, by contrast, is about protecting the data itself.","multi":false},{"id":"h0o274","q":"The CIA triad has grown into 'CIANA' — described as a pentagon rather than a triad. Which two elements were added?","a":"Non-repudiation and authentication","why":"In recent years the classic Confidentiality-Integrity-Availability triad gained an N and an A: Non-repudiation and Authentication, giving five pillars — C.I.A.N.A.","multi":false},{"id":"u5eucj","q":"Which statement about threats and vulnerabilities is TRUE?","a":"Risk exists where a threat and a matching vulnerability intersect","why":"Risk lies where threats and vulnerabilities intersect. A threat with no matching vulnerability = no risk, and a vulnerability with no matching threat = no risk. Vulnerabilities are internal weaknesses we can control; threats (like natural disasters or attackers) are largely external.","multi":false},{"id":"15dpcub","q":"A company decides to buy cyber insurance instead of fixing every weakness in its legacy systems. Which risk management option is this?","a":"Transfer","why":"The four ways to handle risk are mitigate, transfer, avoid, or accept. Shifting the financial impact to an insurance company is risk transfer.","multi":false},{"id":"7ckgd7","q":"A support agent's screen shows a customer's credit card as **** **** **** 4821 — the first 12 digits are hidden but the record stays usable. Which confidentiality method is this?","a":"Data masking","why":"Data masking obscures specific data within a database so it's inaccessible to unauthorized users while retaining the real data's authenticity for authorized users — e.g., showing only the last 4 of 16 card digits.","multi":false},{"id":"nbrkue","q":"The instructor wants you to mentally link confidentiality with one method above all others. Which one?","a":"Encryption","why":"When you hear confidentiality, think 'protecting data from being seen by unauthorized users' — most commonly achieved with encryption. (Hashing and checksums belong to integrity; redundancy to availability.)","multi":false},{"id":"hiyjoj","q":"A hash digest is best described as which of the following for a piece of data?","a":"A digital fingerprint","why":"Hashing converts data into a fixed-size value; even a tiny change produces a dramatically different hash. The result — the hash digest — acts like a digital fingerprint proving integrity.","multi":false},{"id":"rfg7il","q":"To digitally sign a file, what happens to the file's hash digest?","a":"It is encrypted with the user's private key","why":"Digital signatures use encryption to ensure integrity and authenticity: the file is hashed, then the hash digest is encrypted with the user's private key. Any alteration changes the hash and invalidates the signature.","multi":false},{"id":"11l2j4q","q":"Your provider advertises 'three nines' of availability. What does that allow in a 365-day year?","a":"About 8.76 hours of downtime","why":"Three nines = 99.9% uptime. With 8,760 hours in a year, that permits up to 8.76 hours of downtime. (Five nines — the gold standard — allows only ~5.26 minutes, while 99% allows over 3.5 days.)","multi":false},{"id":"1ky15zh","q":"An office has a microwave link, a cable modem, and a cellular modem that automatically take over for each other during outages. This is an example of which redundancy type?","a":"Network redundancy","why":"Network redundancy ensures that if one network path fails, data can still travel another route. (Server redundancy = load balancing/failover servers; data redundancy = multiple storage sites/RAID; power redundancy = generators and UPS systems.)","multi":false},{"id":"p9gqp8","q":"A stockbroker receives a digitally signed email instructing him to sell all shares. Why can the sender not later deny sending it?","a":"Only the sender possesses the private key that created the signature","why":"A digital signature is an encrypted hash digest created with the sender's private key. Since only the sender has that private key, the signature is undeniable proof of origin — non-repudiation.","multi":false},{"id":"1plob8o","q":"In the medieval analogy, a king's signet ring pressed into wax is the historical equivalent of what modern mechanism?","a":"A digital signature","why":"Like a signet ring seal, a digital signature is unique to each user and provides undeniable evidence that a document or transaction is authentic and came from that specific person.","multi":false},{"id":"11alz1m","q":"Unlocking your laptop with a fingerprint reader is which type of authentication factor?","a":"Inherence factor","why":"'Something you are' is the inherence factor — a unique physical or behavioral characteristic, commonly called biometrics (fingerprints, facial recognition).","multi":false},{"id":"1j0j4t4","q":"A door unlocks only when your phone is within 20 feet of the house. Which factor is at work?","a":"Location factor","why":"'Somewhere you are' is the location factor — access is granted based on the user being in a certain geographic location (geofencing).","multi":false},{"id":"1vs9b6y","q":"Password + one-time text message code to your smartphone is considered true multi-factor authentication because…","a":"It combines two different factor types (knowledge + possession)","why":"MFA requires two or more different factor types: something you know (password — knowledge), something you have (phone — possession), something you are (inherence), something you do (action), or somewhere you are (location). Two of the SAME type (e.g., two passwords) is not MFA.","multi":false},{"id":"quqc7b","q":"Which statement best separates authentication from authorization?","a":"Authentication verifies who you are; authorization decides what you're allowed to do","why":"Authentication = verifying identity (e.g., swiping an access card to enter the building). Authorization = determining what that identity may access (which rooms or floors you may enter). The system says: 'Now that I know who you are, here's what you're allowed to do.'","multi":false},{"id":"1ud309j","q":"After a breach, your team uses detailed event logs to reconstruct what happened, how it happened, and how to prevent it. This is an accounting benefit known as…","a":"Forensic analysis","why":"Accounting (logging/monitoring) supports five goals: audit trail, regulatory compliance, forensic analysis, resource optimization, and user accountability. Reconstructing a breach from logs is forensic analysis.","multi":false},{"id":"15jhi0k","q":"Which tool provides real-time analysis of security alerts generated by hardware and software across the organization?","a":"A SIEM system","why":"A SIEM (Security Information and Event Management) system provides real-time analysis of security alerts. Syslog servers aggregate logs, and network analyzers like Wireshark capture traffic — but real-time alert analysis is the SIEM's job.","multi":false},{"id":"dxlqrl","q":"Before migrating to cloud storage, management conducts a risk assessment and updates security policies. Which control category is this?","a":"Managerial (administrative)","why":"Managerial controls cover strategic planning and governance: risk assessments, security policies, training programs, and incident response strategies. Technical = hardware/software (firewalls, antivirus); operational = day-to-day procedures (90-day password changes, backups); physical = tangible measures (locks, guards, cameras).","multi":false},{"id":"1y3k85g","q":"In the instructor's home example, the yard sign warning of surveillance and an alarm system is which control type? (Hint: the sign itself, not the alarm.)","a":"Deterrent","why":"Deterrent controls discourage attackers by making the effort seem less appealing — like warning signs and banners. The sign deters; the alarm/cameras prevent and detect.","multi":false},{"id":"t6l7kt","q":"Your organization's Acceptable Use Policy (AUP), which sets standards for how employees may use company IT assets, is which control type?","a":"Directive","why":"Directive controls guide, inform, or mandate actions and are rooted in policy or documentation. Rule of thumb from the course: if it's a policy, it's a directive control.","multi":false},{"id":"1rb9jxl","q":"A legacy system can't support WPA3, so you run WPA2 plus a VPN from the endpoint to internal servers. The VPN layer is which control type?","a":"Compensating","why":"Compensating controls are alternative measures used when the primary (ideal) control isn't feasible or effective — here, adding a VPN on top of weaker WPA2 to make up for the lack of WPA3.","multi":false},{"id":"4bmcxe","q":"How does the Zero Trust mantra go beyond Reagan's 'Trust but verify'?","a":"'Trust nothing and verify everything'","why":"Zero Trust demands verification for every device, every user, and every transaction within the network regardless of origin — 'Trust nothing and verify everything' — whether the request comes from inside the office or remotely.","multi":false},{"id":"1llhduo","q":"In a Zero Trust architecture, where is the final access grant/deny decision actually executed?","a":"The policy enforcement point","why":"The control plane sets policy (adaptive identity, threat scope reduction, policy-driven access control, secured zones), with the policy engine as the 'rule book' and the policy administrator managing policies. The data plane's policy enforcement point is the gatekeeper that executes the final allow/deny decision.","multi":false},{"id":"14td9xa","q":"Put the gap analysis steps in the correct order.","a":"Define scope → gather data → analyze for gaps → develop a plan","why":"The sequence is: (1) define the scope and desired outcome, (2) gather data on the current state via surveys/interviews, (3) analyze the data to identify where current performance falls short of desired, (4) develop a plan — with goals, objectives, and a timeline — to bridge the gap.","multi":false},{"id":"132t4q0","q":"Weekly vulnerability scans produce more findings than your team can fix at once. Which document outlines the specific remediation measures, resource allocations, and timelines?","a":"A POA&M (Plan of Action and Milestones)","why":"A POA&M (Plan of Action and Milestones) outlines the specific measures to address each vulnerability, allocates resources, and sets timelines — an actionable path from the current state to the desired state identified by the gap analysis.","multi":false},{"id":"5gchbb","q":"Ensuring information is accessible only to authorized parties defines which pillar of the CIA triad?","a":"Confidentiality","why":"Confidentiality = only authorized parties can access the information. Integrity = data stays accurate/unaltered. Availability = accessible when needed. Non-repudiation sits outside the classic triad.","multi":false},{"id":"gopue1","q":"Which are methods of ensuring integrity? (Select THREE.)","a":"Hashing;  Digital signatures;  Checksums","why":"Integrity methods: hashing, digital signatures, checksums, access controls (who may modify), and audits. Masking and tokenization are confidentiality methods.","multi":true},{"id":"1eojyzv","q":"A service level of 99.9% ('three nines') allows roughly how much downtime per year?","a":"8.76 hours","why":"Three nines = 99.9% = 8.76 hours/year. Four nines = 52.56 minutes; five nines = 5.26 minutes; two nines = 3.65 days.","multi":false},{"id":"l5gbnt","q":"RAID arrays, spare power supplies, and hot-swappable drives are all examples of which redundancy type?","a":"Hardware redundancy","why":"Spare physical components ready to take over are hardware redundancy. RAID also provides fault tolerance for disks specifically.","multi":false},{"id":"v4nxxa","q":"A company posts a warning that premises are monitored 24/7. The WARNING SIGN itself is which type of control?","a":"Deterrent","why":"The sign discourages an attack from being attempted — a deterrent. (The alarm behind it would be the detective control.) Course trap: sign = deterrent, alarm = detective.","multi":false},{"id":"ltxvva","q":"After detecting an infection, antivirus software isolates the malicious file so it can do no further harm. Isolating/quarantining the file is which control type?","a":"Corrective","why":"Corrective controls restore or fix after an incident. Quarantining an infected file is the course's example of a corrective control.","multi":false},{"id":"es2b26","q":"An acceptable use policy (AUP) telling employees what they may and may not do on company systems is which control type?","a":"Directive","why":"Directive controls direct or guide behavior — policies, signage, procedures. (AUP is the course's example. 'Managerial' is a category, not a type.)","multi":false},{"id":"s7jead","q":"Which control type describes an alternative safeguard used when the primary control cannot be implemented?","a":"Compensating","why":"Compensating controls stand in for the primary control when it isn't feasible — e.g., a VPN tunnel protecting a legacy system that can't do modern encryption.","multi":false},{"id":"1rvunfw","q":"Which of the following are recognized authorization models? (Select THREE.)","a":"Mandatory Access Control (MAC);  Discretionary Access Control (DAC);  Role-Based Access Control (RBAC)","why":"The five models: MAC (system labels), DAC (owner decides), RBAC (permissions attach to roles), ABAC (attributes), and rule-based. 'Reputational' and 'time-based' are made up.","multi":true},{"id":"944cod","q":"In the correct order, the AAAs of security are:","a":"Authentication → Authorization → Accounting","why":"First verify WHO you are (authentication), then decide WHAT you may do (authorization), then track WHAT you did (accounting).","multi":false},{"id":"wngfxf","q":"The modern extension of the CIA triad is the C.I.A.N.A pentagon. What do the two extra letters stand for?","a":"Non-repudiation and Authentication","why":"C.I.A.N.A = Confidentiality, Integrity, Availability, Non-repudiation, Authentication. The AAAs flow directly from this model.","multi":false},{"id":"1tu4mb4","q":"The final deliverable of a gap analysis — the document listing what will be fixed, by whom, and by when — is called a:","a":"Plan of Action & Milestones (POA&M)","why":"A POA&M is the remediation plan produced by a gap analysis: current state vs desired state, the identified gaps, and the milestones to close them.","multi":false},{"id":"yyshsw","q":"Scenario: A healthcare network needs to guarantee that a physician who issues a medication order cannot later deny issuing it, and that the order cannot be altered in transit. Which solution BEST satisfies both requirements?","a":"Digitally sign each order","why":"A digital signature provides non-repudiation (the signer cannot deny it) built on integrity (any alteration invalidates the signature). Encryption alone protects confidentiality; MFA proves identity at login but does not bind the sender to the message.","multi":false},{"id":"k962l7","q":"Scenario: Your SLA commits to 99.99% uptime for a customer portal. Over a full year, what is the MAXIMUM total downtime you can experience without breaching the SLA?","a":"About 52.56 minutes","why":"Four nines (99.99%) = 52.56 minutes per year. Know the table: 99% = 3.65 days, 99.9% = 8.76 hours, 99.99% = 52.56 minutes, 99.999% = 5.26 minutes.","multi":false},{"id":"4ejng1","q":"Scenario: A plant's legacy controller cannot support modern encryption and cannot be replaced this year. As a workaround, the security team routes all controller traffic through an encrypted VPN tunnel. How should this VPN be classified?","a":"A compensating control, because it substitutes for the control the legacy system cannot implement","why":"When the primary control (modern encryption on the device) is not feasible, the alternative safeguard is compensating — the course's own example.","multi":false},{"id":"1qt76l4","q":"Scenario: During a Zero Trust rollout review, an architect asks where the policy enforcement point (PEP) lives and what it does. Which answer is correct?","a":"It sits in the data plane and executes the allow/deny decision at the resource","why":"The data plane = subject/system + the PEP, which enforces the decision. The control plane (adaptive identity, threat scope reduction, policy-driven access control, secured zones) uses the policy engine and policy administrator to DECIDE.","multi":false},{"id":"z7aymf","q":"Scenario: A bank requires a password plus a fingerprint scan to open its vault application. Which statement BEST analyzes this design?","a":"It is MFA because it combines something you know with something you are — two different factor categories","why":"Password = something you know; fingerprint = something you are. Two different categories = MFA. (Something you DO — typing cadence — would be the behavioral factor.)","multi":false},{"id":"12fuyxq","q":"Scenario: When an employee moves from the Sales department to Engineering, her access changes automatically because permissions belong to departmental roles rather than to her account. Which authorization model is the company using, and what is the main benefit?","a":"RBAC — permissions attach to roles, so access follows the job function and administrative effort drops","why":"Role-Based Access Control assigns permissions to roles; switching roles switches permissions automatically, which is exactly the administration-simplification scenario described.","multi":false},{"id":"1thqwgr","q":"Scenario: After a suspected insider incident, a security manager pulls centralized logs and correlates them across the network to reconstruct exactly what a specific user account did, minute by minute. Which AAA is the manager performing, and which tool category is most appropriate?","a":"Accounting — a SIEM","why":"Tracking what users did is accounting. A SIEM aggregates and correlates logs (Syslog feeds, etc.) to reconstruct activity — far more practical than reading individual logs by hand.","multi":false},{"id":"1tohhkk","q":"Scenario: An auditor measures your current security posture against industry baselines, compares it to the posture your regulator expects, and hands you a prioritized list of missing controls with owners and deadlines. Which process produced this deliverable?","a":"A gap analysis ending in a POA&M","why":"Document current state vs baseline, define the desired state, identify gaps, and produce a Plan of Action & Milestones — the four steps of a gap analysis.","multi":false},{"id":"qh5nno","q":"Scenario: A user downloads a vendor's installer, computes its hash, and finds it does not match the hash published on the vendor's site. Which security concern has the hash check revealed, and which pillar does it protect?","a":"An integrity failure — the file differs from what the vendor published and must not be installed","why":"A changed hash means the file's contents changed — the integrity pillar. Hashing is one of the five integrity methods; it says nothing about who can read the file.","multi":false},{"id":"1fm8eoi","q":"Scenario: A support dashboard displays customer card numbers, but policy says agents only ever need the last four digits. The team updates the dashboard to show only 'XXXX-XXXX-XXXX-4821'. Which confidentiality method is this?","a":"Data masking","why":"Showing only part of the data (last 4 digits) is data masking — one of the five confidentiality methods alongside encryption, access controls, physical security, and training.","multi":false},{"id":"17zhsib","q":"Scenario: A warehouse wants to discourage break-ins without spending on a monitoring team. Which controls are DETERRENTS? (Select THREE.)","a":"A sign warning that the site is alarmed;  Perimeter lighting;  A fence with barbed wire","why":"Deterrents discourage the attempt: warning signs, lighting, fences, visible guards/cameras. The IDS is detective; the generator supports availability.","multi":true},{"id":"1pvu9fd","q":"Scenario: A flood takes your primary data center offline, but services fail over to a fully equipped second site in another region within minutes and customers notice nothing. Which two concepts does this demonstrate?","a":"Geographic redundancy and availability","why":"A second site in another region = geographic (site) redundancy; seamless continued service = availability. Redundancy is one of the key availability mechanisms alongside fault tolerance, RAID, clustering, and load balancing.","multi":false},{"id":"bc86l0","q":"Scenario: A startup wants to maximize the availability of its flagship web application. Which measures directly support availability? (Select FOUR.)","a":"Load balancing across multiple servers;  Data backups;  Fault-tolerant hardware with RAID;  A UPS with a backup generator","why":"Availability mechanisms: the four redundancy types, fault tolerance, RAID, clustering, load balancing, backups, and clean power (UPS/generator). Masking is confidentiality; an AUP is a directive control.","multi":true},{"id":"ft5zc","q":"Scenario: An employee receives a convincing email asking them to wire money to a 'vendor' and, busy and distracted, complies. No malware was involved. How should this incident be categorized at the highest level?","a":"An intentional (man-made) threat executed through social engineering","why":"Threats are natural, intentional, or unintentional. A deliberate attacker tricking a human is an intentional/man-made threat — the human weakness the attacker exploited is the vulnerability.","multi":false},{"id":"1f1e4mg","q":"Scenario: In a Zero Trust design review, a colleague says: 'Once the subject's identity is verified, the component that cross-references the access request against the organization's predefined policies is the ______.' Fill in the blank.","a":"policy engine","why":"The policy engine works like a rule book, checking each request against predefined policies; the policy administrator manages those policies. Both serve the control plane; the PEP in the data plane executes the outcome.","multi":false}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
</div>
<script id="back-lib-script">
(function () {
  if (window.__backBtnInit) return; window.__backBtnInit = true;
  function lib() { return "../library.html"; }
  function resultVisible() {
    var rs = document.getElementById('result-screen');
    if (rs && !rs.classList.contains('hidden') && rs.offsetParent !== null) return true;
    var big = document.querySelector('.score-big');
    if (big) {
      var el = big;
      while (el && el !== document.body) {
        if (el.classList && el.classList.contains('hidden')) return false;
        el = el.parentElement;
      }
      return big.offsetParent !== null;
    }
    return false;
  }
  function ensure() {
    if (!resultVisible() || document.getElementById('back-lib-btn')) return;
    var a = document.createElement('a');
    a.id = 'back-lib-btn';
    a.href = lib();
    a.textContent = '\u2190 Back to Library';
    a.setAttribute('style', 'position:fixed;left:18px;bottom:18px;z-index:9999;' +
      'padding:11px 20px;border-radius:999px;font:600 14px/1 "Segoe UI",system-ui,sans-serif;' +
      'text-decoration:none;color:#fff;background:linear-gradient(135deg,#f0883e,#e36414);' +
      'box-shadow:0 4px 18px rgba(240,136,62,.45);border:1px solid rgba(255,255,255,.25);');
    document.body.appendChild(a);
  }
  setInterval(ensure, 400);
  if (document.readyState !== 'loading') ensure();
  else document.addEventListener('DOMContentLoaded', ensure);
})();
</script>
