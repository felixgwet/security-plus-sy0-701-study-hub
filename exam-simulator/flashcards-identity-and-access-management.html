<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #f0883e; --accent-dim: rgba(240,136,62,.14);
    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .topbar .grow { flex: 1; }
  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }
  h1 { font-size: 24px; margin: 10px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }

  <p class="sub">Tap the card to flip it, then grade yourself honestly &mdash; the deck remembers what you know and will prioritize your weak cards.</p>

  <script>
    var DECKS = [{"label":"Section 16 · Identity and Access Management","cards":[{"id":"j26wub","q":"A login system accepts a password and then asks for the name of your first pet. Security-wise, this setup is:","a":"Single-factor — password and security answer are both knowledge-based factors from the same category","why":"MFA requires factors from DIFFERENT categories. Password + security question = two knowledge factors = single-factor. The exam tests this exact trap.","multi":false},{"id":"14gi69h","q":"Which attack tries a SMALL number of common passwords against MANY accounts specifically to stay under per-account lockout thresholds?","a":"Password spraying","why":"Spraying inverts brute force: few passwords, many accounts, no single account locked. Defeated by unique passwords and MFA.","multi":false},{"id":"1vw8ibk","q":"In the SAML-based SSO flow, what does the service provider actually do with the user's credentials?","a":"Nothing — the SP never sees credentials; it receives and verifies an assertion from the trusted identity provider","why":"SAML decouples services from identity providers: the IdP authenticates, the SP trusts the assertion. The SP never handles passwords — that is the point.","multi":false},{"id":"10op2w2","q":"A hospital labels patient records 'Restricted' and staff clearances 'Level 3'; only staff at or above a record's level may open it, with no exceptions granted by file owners. Which model is this?","a":"MAC — mandatory access control using security labels","why":"Labels on both subjects and objects, central authority, no owner override = MAC. DAC would let owners share freely; RBAC keys off roles, not clearance levels.","multi":false},{"id":"1u5mx1","q":"Which PAM component grants a DBA administrative rights on a database only for the two hours of a maintenance window, revoking them automatically afterward?","a":"Just-in-time permissions","why":"JIT = privilege granted when needed for the task period, then revoked — no standing admin rights. Temporal accounts are whole accounts that expire; vaulting stores credentials.","multi":false},{"id":"n4wldu","q":"Why does NIST no longer recommend forced 90-day password expiration in most organizations?","a":"Forced rotation pushes users into predictable patterns (Summer2024 → Summer2025) or reuse, weakening security unless password managers enforce unique passphrases","why":"Expiration breeds keyboard-walking and incremental passwords. NIST's guidance: long unique passwords via managers; change only on evidence of compromise.","multi":false},{"id":"mqyagg","q":"Federation's six-step login flow puts the generation of the assertion at step 4. What happens immediately AFTER?","a":"The user is redirected back to the service provider carrying the assertion","why":"Flow: initiate → redirect to IdP → authenticate → generate assertion → return to SP with assertion → SP verifies and grants access.","multi":false},{"id":"vt78od","q":"An auditor finds a developer still holds billing-system rights from a prior support role, on top of current dev rights. The cleanest fix, per the course, is:","a":"Revoke the old role's permissions at the transition and run periodic attestation reviews to catch permission creep","why":"Permission creep violates least privilege. Fix at role change (deprovision old rights) plus recurring attestation reviews.","multi":false},{"id":"1ndrhed","q":"A phishing-resistant, passwordless scheme where the secret never leaves the user's device and the website breach exposes nothing usable describes:","a":"Passkeys — public-key cryptography with the private key on the device and only the public key on the server","why":"Passkeys: server stores public keys only, so breaches leak nothing; keys are service-unique, defeating phishing. SMS codes and magic links are phishable.","multi":false},{"id":"rtl5j8","q":"Which authentication factor is 'somewhere you are'?","a":"An IP address or GPS location check restricting logins to expected geography","why":"Location-based factors verify where the user is connecting from (IP, GPS, specific network). Fingerprint = inherence; token = possession; password = knowledge.","multi":false},{"id":"1943la9","q":"OAuth's core promise compared to handing a third-party app your password is:","a":"Token-based access — apps get scoped access tokens (JWTs) without ever seeing the user's password","why":"OAuth separates authorization from credentials: the user approves scopes, the authorization server issues a signed JWT, and the resource server honors the token — password never shared.","multi":false},{"id":"1yeqmzp","q":"Under ABAC, which combination could legitimately drive an access decision?","a":"User role + time of access + resource sensitivity label","why":"ABAC fuses user attributes (role, clearance), environment attributes (time, location, threat level) and resource attributes (owner, sensitivity, creation date) into one decision.","multi":false},{"id":"xehxt0","q":"Which are the three PAM components? (Choose THREE.)","a":"Just-in-time permissions;  Password vaulting;  Temporal accounts","why":"PAM = JIT (privilege on demand), vaulting (secure credential storage with checkout logs), temporal accounts (auto-expiring). Spraying is an attack; time-of-day is an access restriction.","multi":true},{"id":"ct48vr","q":"Which defenses mitigate online password attacks? (Choose FOUR.)","a":"Long, complex, unique passwords;  Account lockout / limiting login attempts;  MFA;  CAPTCHAs","why":"The course's mitigation set for brute force/dictionary/spraying: length+complexity, attempt limits, MFA, CAPTCHAs. Publicizing policies doesn't stop attacks.","multi":true},{"id":"gi30hc","q":"Which statements about password policy settings are correct? (Choose THREE.)","a":"Password history prevents recycling recently used passwords;  Minimum password age stops rapid cycling to defeat history;  Length adds more strength per character than any other characteristic","why":"History + minimum age work as a pair; length is the strongest lever. NIST dropped forced expiration, and complexity means mixed character sets, not dictionary words.","multi":true},{"id":"1uaoc1a","q":"Which are valid passwordless authentication methods per the course? (Choose THREE.)","a":"Biometrics;  One-time passwords;  Magic links","why":"Passwordless options: biometrics, hardware tokens, OTPs, magic links, passkeys. Written-down and shared passwords are anti-patterns.","multi":true},{"id":"dnedzm","q":"The four main IAM processes, in order, are:","a":"Identification, authentication, authorization, accounting","why":"Identify (claim) → authenticate (verify) → authorize (permissions) → account/audit (track). The classic order matters.","multi":false},{"id":"19q8bng","q":"A user typing their username at a login prompt is performing:","a":"Identification — claiming an identity","why":"Entering a username = claiming an identity (identification). Verifying the password = authentication.","multi":false},{"id":"7ac2sj","q":"Removing a departing employee's access rights is called:","a":"Deprovisioning","why":"Deprovisioning removes access when no longer needed — crucial to stop ex-employee insider threats. Provisioning = creating accounts.","multi":false},{"id":"cy53ef","q":"Verifying a user's real-world identity with a driver's license or passport BEFORE creating their account is:","a":"Identity proofing","why":"Identity proofing happens before account creation, checking personal details against trusted sources.","multi":false},{"id":"5tdayc","q":"Regular reviews confirming that user accounts hold only the minimal access their role requires is called:","a":"Attestation","why":"Attestation = validating accounts and access rights are correct and up to date via periodic reviews/audits.","multi":false},{"id":"zyagji","q":"A fingerprint scan is which authentication factor category?","a":"Something you are (inherence)","why":"Biometrics = inherence ('something you are'). Possession = something you have; knowledge = something you know; location = somewhere you are.","multi":false},{"id":"167wv9g","q":"Typing speed and keystroke dynamics as an authentication input belong to:","a":"Something you do (behavior-based)","why":"Behavior patterns like keystroke dynamics, mouse movement and gait = 'something you do' — usually a secondary factor.","multi":false},{"id":"6atlnw","q":"A user logs in with a password, then answers a security question. This is:","a":"Still single-factor — password and security question are both knowledge factors","why":"Factors must come from DIFFERENT categories. Password + security question = two knowledge items = single-factor. Real 2FA pairs knowledge with possession or inherence.","multi":false},{"id":"6o1vc","q":"A government employee inserts a smart card and enters a PIN to unlock their laptop. This is:","a":"Two-factor: smart card = possession, PIN = knowledge","why":"Smart card (something you have) + PIN (something you know) = classic 2FA.","multi":false},{"id":"1vq70zk","q":"Hardware token key fobs typically rotate their codes every:","a":"30 to 60 seconds","why":"Time-based tokens change every 30–60 seconds; SMS one-time codes stay valid 3–10 minutes.","multi":false},{"id":"4rfizj","q":"Why are passkeys more resistant to server breaches than passwords?","a":"They use public-key cryptography — the private key never leaves the device; the server only stores the public key, so a breach exposes no usable secret","why":"Passkeys: private key on device (guarded by biometrics/PIN), public key on server. No server-side secret to steal, and each passkey is unique per service → phishing-resistant.","multi":false},{"id":"1fo1vjo","q":"Which password characteristic provides the greatest increase in resistance to brute-force cracking?","a":"Length — every added character multiplies the search space exponentially","why":"Length is the strongest driver: 4-digit PIN = 10,000 combos; 8 digits = 100 million. Recommend 12–16+ characters.","multi":false},{"id":"17edxzl","q":"NIST's current position on forced password expiration is:","a":"It is no longer recommended for most organizations unless password managers are mandated, because forced rotation breeds weak patterns like password1→2→3","why":"Forced expiration causes keyboard-walking and predictable patterns. NIST dropped it unless the org enforces password managers for unique long passwords.","multi":false},{"id":"d55crj","q":"The purpose of a MINIMUM password age is to:","a":"Prevent users from rapidly cycling password changes to defeat password history and return to an old password","why":"Min age (e.g. 3 days) + password history (e.g. 24) stops the change-it-five-times trick to recycle an old, possibly-already-cracked password.","multi":false},{"id":"19cn6aw","q":"Which passwordless method sends a single-use link that logs the user in when clicked?","a":"Magic link","why":"Magic links: emailed single-use, short-validity login links. OTPs are codes; passkeys use device-held private keys.","multi":false},{"id":"7rtlsv","q":"Which is a key feature of password managers?","a":"Secure sharing that lets someone log in without ever seeing the password","why":"Managers generate unique strong passwords, autofill, share without revealing, and sync cross-platform — one encrypted vault behind a master password.","multi":false},{"id":"1diepb3","q":"Trying every possible character combination until the password is found defines a:","a":"Brute force attack","why":"Brute force = exhaustive. Dictionary = common-password list. Spraying = few passwords across many accounts. Hybrid = dictionary + generated variations.","multi":false},{"id":"17c71ji","q":"An attacker tries 'Password123' against every user account in the company to avoid account lockout. This is:","a":"Password spraying — a few common passwords across many accounts","why":"Spraying reverses brute force: many accounts, few passwords, staying under per-account lockout thresholds. Defeated by unique passwords and MFA.","multi":false},{"id":"1x21oft","q":"A cracking tool starts from a dictionary word and appends brute-forced numbers (word000000–word999999). This is a:","a":"Hybrid attack — dictionary base plus brute-force variation","why":"Hybrid = dictionary word + dynamically generated variations. When the variation lives inside the list itself it's a dictionary attack; generated on the fly = true hybrid.","multi":false},{"id":"1wfdfu8","q":"Adding a random string to each password before hashing, defeating lookup tables, is called:","a":"Salting","why":"Salts prevent rainbow/lookup table attacks (the John the Ripper demo cracked an unsalted MD5 instantly). Store passwords with strong hashes like SHA-256 + salt — never plain MD5.","multi":false},{"id":"6cqfpk","q":"In SSO, the system that creates, maintains and manages identity information and provides authentication services to relying applications is the:","a":"Identity provider (IdP)","why":"The IdP authenticates the user once; applications with a trusted relationship query it and accept its assertion.","multi":false},{"id":"1gwvnw2","q":"Which SSO protocol is an open standard for token-based authorization that lets third-party apps access account data WITHOUT exposing the password, using JSON Web Tokens?","a":"OAuth","why":"OAuth = token-based (JWT, Base64, signed). SAML = XML assertions for session-based login. LDAP = directory lookups.","multi":false},{"id":"1pdfie7","q":"SAML's main contribution to SSO is:","a":"Logging users into applications based on their authenticated session in another context — the service provider trusts the IdP's assertion instead of authenticating directly","why":"SAML decouples services from identity providers: redirect to IdP, IdP verifies, SAML response/assertion returns, service grants access.","multi":false},{"id":"a8wqom","q":"Which statement about LDAP is correct?","a":"It accesses and maintains distributed directory information and can serve as the central repository for authentication and group/role authorization data; use LDAPS to encrypt credential traffic","why":"LDAP = directory protocol (users, groups, printers, certs); supports SSO and authorization data. Plain LDAP can transmit cleartext → LDAPS/StartTLS for credentials.","multi":false},{"id":"drnwuh","q":"Federation differs from plain SSO in that federation:","a":"Lets users authenticate with their HOME organization's credentials to access systems run by DIFFERENT organizations, based on pre-established trust","why":"Federation = cross-organization identity sharing (partners, suppliers, customers trust each other's authentication). SSO is often within one org.","multi":false},{"id":"l2ih1y","q":"In the federation login flow, the artifact the IdP creates after authenticating the user — containing identity, authentication status and attributes — is the:","a":"Assertion (e.g., a SAML or OpenID Connect token)","why":"Six steps: initiate login → redirect to IdP → authenticate → generate assertion → return to service provider → SP verifies assertion and grants access.","multi":false},{"id":"1xly68m","q":"PAM's three key components are:","a":"Just-in-time permissions, password vaulting, and temporal accounts","why":"JIT = grant admin rights only when needed; vaulting = MFA-protected credential store with checkout logging; temporal accounts = time-limited accounts auto-deleted (e.g., contractors).","multi":false},{"id":"18a0a2a","q":"A contractor account that automatically deactivates when a project ends exemplifies:","a":"A temporal (temporary) account","why":"Temporal accounts are created for a specific purpose and automatically disabled/deleted after a set period.","multi":false},{"id":"n47sid","q":"A military system where a Secret-cleared user can read Secret, Confidential and Unclassified files but NOT Top Secret is using:","a":"MAC — mandatory access control with security labels/clearances","why":"MAC: central authority assigns labels to users AND resources; access requires user level ≥ resource level. Everything not expressly allowed is forbidden. Complex/costly — high-security only.","multi":false},{"id":"q3n3np","q":"The owner of a file personally deciding which coworkers may open it is:","a":"DAC — discretionary access control based on the resource owner","why":"DAC = owner discretion, identity/need-to-know based — flexible but hard to govern at scale.","multi":false},{"id":"s2f80j","q":"An org with high turnover assigns permissions to department groups (Accounting, HR, nested Employees) so access follows the job, not the person. This is:","a":"RBAC — role-based access control implemented with groups","why":"RBAC via groups mirroring the org chart: join the role, inherit permissions; leave, lose them. Ideal for turnover.","multi":false},{"id":"ah88zk","q":"Firewall and router ACLs that apply the same policy to every user on a segment are an example of:","a":"Rule-based access control","why":"Rule-based = administrator-defined rules applied network-wide to all users, changeable quickly. Distinct from role-based despite the shared RBAC abbreviation.","multi":false},{"id":"1jwixfz","q":"An access decision combining the user's role, the time of access, their location, and the data's sensitivity label is:","a":"ABAC — attribute-based access control","why":"ABAC evaluates user, environment AND resource attributes together (role, time, location, threat level, file owner, sensitivity).","multi":false},{"id":"11mexdu","q":"An employee who keeps old permissions from three previous departments after moving roles illustrates:","a":"Permission (authorization) creep","why":"Creep = accumulating rights across moves. Fix: revoke old permissions at transition + periodic attestation reviews.","multi":false},{"id":"893jtw","q":"Windows User Account Control (UAC) exists to:","a":"Ensure actions requiring administrative rights are explicitly authorized — minimizing malware gaining admin privileges","why":"UAC = the checkpoint prompt for admin-level actions (shield icon = will prompt). Least privilege on endpoints: work as standard user; elevate deliberately.","multi":false},{"id":"9wayav","q":"For everyday computing, which account type should users normally use, per least privilege?","a":"Standard user — administrator only when needed","why":"Standard users can't change system settings and are confined to their own storage; admin rights are elevated only for specific tasks via UAC.","multi":false},{"id":"13y3vi8","q":"Setting a folder's permissions so they apply to everything inside it mirrors which hotel-key concept from the lesson?","a":"A key that opens a room and everything declared usable inside it","why":"Folder-level permissions inherit to all contents — like granting a guest everything in a room. Grant read/write/execute/full control deliberately, erring toward fewer rights.","multi":false},{"id":"199w5n","q":"A company requires smart card + PIN + fingerprint for the data center. Categorizing each factor correctly:","a":"Possession, knowledge, inherence — three different categories = true MFA","why":"Smart card = something you have; PIN = something you know; fingerprint = something you are. Three distinct categories = multifactor. The exam loves factor classification.","multi":false},{"id":"1lz5wtq","q":"Which password attack is MOST likely to succeed against an account named 'admin' protected by 'P@$$w0rd123' yet still evade a five-attempt lockout policy?","a":"Password spraying across thousands of accounts with a handful of leet-speak dictionary entries","why":"Spraying spreads a few guesses (including leet variants) across many accounts, never tripping any single account's lockout. Online brute force on one account would lock out.","multi":false},{"id":"17liiqy","q":"John the Ripper instantly cracked a demo hash via a wordlist lookup. Which defense would have forced real computation instead of a table lookup?","a":"Salting — the random string defeats precomputed hash/lookup tables","why":"Salts make every hash unique, so precomputed tables fail and attackers must compute per-hash. (Length still raises that computation time.) Use SHA-256 + salt rather than bare MD5.","multi":false},{"id":"cezayq","q":"A firm wants single sign-on across internal apps using an existing employee directory, with credential lookups encrypted in transit. Best fit:","a":"LDAP over SSL/TLS (LDAPS) against the directory","why":"LDAP is the directory protocol for user/group lookups and SSO; plain LDAP can pass credentials cleartext, so LDAPS/StartTLS is required for sensitive traffic.","multi":false},{"id":"1apbdik","q":"'Log in with Google' on a third-party training site, where the site receives a signed token but never the password, is an example of:","a":"OAuth — token-based authorization via JWT without password exposure","why":"OAuth issues scoped access tokens (JWTs) after user approval — third party gets capability, not credentials. SAML would be XML assertions between IdP and SP.","multi":false},{"id":"zlgb4y","q":"Deprovisioning matters most to security because it:","a":"Removes access for departed users — cutting off a potential insider-threat path the moment employment ends","why":"Stale accounts of ex-employees are a classic breach vector. Deprovisioning promptly denies the 'revenge access' scenario the course describes.","multi":false},{"id":"78qcnv","q":"An air-gapped SCADA network needs device authentication before any switch port carries traffic. The correct framework and its transport layer are:","a":"802.1x — port-based authentication operating at Layer 2 for wired and wireless","why":"802.1x authenticates devices at the port (Layer 2) before network access, using EAP methods against RADIUS/TACACS+ — ideal for stopping rogue devices.","multi":false},{"id":"odcvtp","q":"Which EAP method fits: mutual authentication required, no client certificate infrastructure available, Active Directory in place?","a":"PEAP — server certificate plus AD-backed password authentication inside a protected tunnel","why":"PEAP/TTLS give mutual auth with only a server cert; MD5 is one-way; TLS needs client certs; LEAP is Cisco-only.","multi":false},{"id":"tl654c","q":"Attestation in IAM primarily involves:","a":"Regular reviews/audits validating that accounts and access rights remain correct, current and minimal","why":"Attestation = periodic validation of accounts and rights — the process that catches permission creep and orphaned access.","multi":false},{"id":"cy2580","q":"A helpdesk wants fewer password-reset tickets while improving security. Which technology serves both goals, and why?","a":"SSO — one credential set means fewer forgotten passwords, and users can finally memorize one strong unique password instead of reusing weak ones","why":"SSO cuts reset volume and enables stronger single passwords (less reuse) — the course lists UX, productivity, support cost and security as the four benefits.","multi":false},{"id":"11xgtxb","q":"Under MAC, a user with a 'Confidential' label attempts to write to a 'Secret' file. Result?","a":"Denied — MAC requires the user's level to equal or exceed the resource's level for access","why":"MAC is label-driven with no owner override: Confidential \u003c Secret → blocked. Owner approval is a DAC concept.","multi":false},{"id":"111yomz","q":"A Windows user clicks an installer and sees a consent prompt requiring admin approval. This mechanism is:","a":"UAC — enforcing least privilege by requiring explicit authorization for administrative actions","why":"User Account Control intercepts privilege-escalation attempts (shield icon = will prompt) so malware can't silently gain admin rights.","multi":false},{"id":"990zou","q":"Which are knowledge-based ('something you know') factors? (Choose THREE.)","a":"Password;  PIN;  Security question answer","why":"Password, PIN and security answers are all knowledge. Smart card = possession; fingerprint = inherence. Mixing two knowledge items is still single-factor.","multi":true},{"id":"1v6c4wt","q":"Which statements about passkeys are true? (Choose THREE.)","a":"The private key is stored on the user's device;  Only the public key sits on the server, so server breaches expose no login secret;  Each passkey is unique to its service, resisting phishing","why":"Passkeys use device-bound private keys and server-side public keys, service-unique by design — no shared secret ever transits or rests on the server.","multi":true},{"id":"1maxjb7","q":"Which are among the five password policy characteristics? (Choose THREE.)","a":"Password length;  Password complexity;  Password reuse (history enforcement)","why":"The five: length, complexity, reuse/history, expiration, age (minimum). Hardware settings are unrelated.","multi":true},{"id":"1eopf9g","q":"Which benefits does federation provide? (Choose THREE.)","a":"Simplified user experience — one home credential set;  Reduced administrative overhead — no partner account management;  Improved security — less password reuse and insecure storage","why":"Federation benefits: UX, reduced admin overhead, better security posture. It does not eliminate phishing, nor does it affect link speed.","multi":true},{"id":"1ajxu0t","q":"Scenario: An attacker harvests 10,000 corporate email addresses and tries 'Winter2025!' against each exactly once, twice a week. No account locks out; three users used that password. Which attack is this, and which control would have stopped it most directly?","a":"Password spraying — stopped by unique passwords per account plus MFA","why":"Few passwords × many accounts at low per-account rates = spraying. Salting defends offline hash cracking, not live logins; uniqueness and MFA are the cited mitigations.","multi":false},{"id":"fpqap8","q":"A CISO must pick an access model where file owners in R&D can freely share datasets with project partners, but finance records must follow strict clearance labels with zero owner override. The correct hybrid is:","a":"DAC for R&D sharing, MAC for finance — discretionary where flexibility wins, mandatory where central control is non-negotiable","why":"DAC grants owners discretion (R&D collaboration). MAC enforces label-based central authority with no override (regulated finance). Models can coexist per data class.","multi":false},{"id":"148556l","q":"Which statement about 2FA vs MFA is MOST accurate per the course?","a":"2FA is a specific subset of MFA — any two different factor categories count as both","why":"MFA = two or more factors from different categories; 2FA is MFA with exactly two. Knowledge+knowledge (password+question) never qualifies.","multi":false},{"id":"1wbntjk","q":"An IdP breach in a federated ecosystem is uniquely damaging because:","a":"The IdP is the trust anchor — compromising it can undermine authentication across every relying party in the federation","why":"Federation concentrates trust: one IdP authenticates users for many SPs. Its compromise cascades across the trust relationship — the flip side of convenience.","multi":false},{"id":"18w8h2j","q":"A contractor needs server access for a 6-week migration, after which access must end automatically without admin action. The BEST PAM construct is:","a":"A temporal account set to auto-disable at project end","why":"Temporal accounts exist for a defined period and self-destruct — exactly the contractor pattern. JIT grants privilege per task; here the whole account must expire.","multi":false},{"id":"17lgn6e","q":"Which pairing of EAP variant to characteristic is WRONG?","a":"EAP-MD5 — mutual authentication with certificates","why":"EAP-MD5 is one-way password authentication with no mutual auth and no certificates — the weakest listed. The others pair correctly.","multi":false},{"id":"iqlip","q":"A firm's SharePoint shows different content to the same user logging in from the office vs. home, based on role, location and document sensitivity. This is:","a":"ABAC — user, environment and resource attributes combine in the decision","why":"Attribute-driven decisions (role + location + sensitivity) = ABAC. Rule-based would be one-size-fits-all ACLs; MAC/DAC don't evaluate environmental attributes.","multi":false},{"id":"otot96","q":"Why does the course call the username+password+security-question login 'single-factor' rather than 'multifactor'?","a":"All three items are knowledge-category factors; MFA requires independent categories (know/have/are/do/location)","why":"Categories, not count, define factors. Two or more knowledge items are still one category — a layered defense needs categorically distinct factors.","multi":false},{"id":"yi6nni","q":"A password manager's 'secure sharing' feature helps security because it:","a":"Lets an assistant log in on the owner's behalf without ever revealing the password itself","why":"Delegation without disclosure: the vault performs the login; the delegate never sees the secret. Plaintext email and unencrypted storage would do the opposite.","multi":false},{"id":"a1ql05","q":"Which control-selection principle directly argues AGAINST buying one monolithic 'does-everything' security appliance?","a":"Defense in depth — multiple independent layers so one failure doesn't collapse protection","why":"Defense in depth = layered, independent controls. A single all-in-one stack (like a UTM) contradicts it — one failure = total loss, exactly the UTM drawback.","multi":false},{"id":"1lp3jd6","q":"Time-of-day restrictions primarily defend against:","a":"Insider threats operating in irregular hours — no legitimate user has access when most malicious activity occurs","why":"Blocking 2 AM logins in an 8–6 business removes the cover of off-hours misuse; it layers onto other models and targets insider patterns.","multi":false},{"id":"pf0o1t","q":"OAuth vs SAML — which assignment to a scenario is correct?","a":"OAuth for API/third-party delegated access with tokens (JWT); SAML for browser-based enterprise SSO assertions between IdP and SP","why":"OAuth = delegated authorization with access tokens (JWT) — the 'Sign in with X' pattern. SAML = XML assertions for enterprise session-based SSO. Different protocols, different jobs.","multi":false},{"id":"1kiuk3x","q":"Which practices reduce password attack success? (Choose FOUR.)","a":"Unique long complex passwords via a password manager;  MFA everywhere feasible;  Salting stored hashes with strong algorithms (SHA-256);  Login attempt limits / lockouts and CAPTCHAs","why":"All four are course-endorsed. Forced rotation without managers is the anti-pattern NIST warns about — it breeds predictable increments.","multi":true},{"id":"1nx7jcj","q":"Which statements accurately describe SAML-based SSO? (Choose THREE.)","a":"The user authenticates at the identity provider, not the application;  The service provider consumes an assertion rather than verifying passwords itself;  It enables session-based login decoupled from the IdP","why":"SAML: redirect → IdP auth → assertion → SP verification → access. Passwords never reach the SP, and SAML rides application-layer protocols, not Layer 2.","multi":true},{"id":"dtj499","q":"Which are valid possession ('something you have') factors? (Choose THREE.)","a":"Smart card;  Hardware token / USB security key;  Phone receiving an SMS or authenticator-app code","why":"Possession = smart cards, key fobs, USB keys, phones with apps/SMS. Fingerprint = inherence; keystroke dynamics = behavior.","multi":true},{"id":"mzonkh","q":"Which describe UAC's role on Windows endpoints? (Choose THREE.)","a":"Prompts for explicit authorization before admin-level actions;  Reduces malware's chance of silently gaining administrative privileges;  Supports least privilege by separating standard use from elevation","why":"UAC = the elevation checkpoint (shield icon marks prompt-requiring actions). It does not encrypt disks (BitLocker) nor remove standard accounts — it complements them.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
