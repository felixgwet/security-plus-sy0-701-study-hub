<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #f0883e; --accent-dim: rgba(240,136,62,.14);
    --green: #3fb950; --red: #f85149; --gold: #d29922; --blue: #58a6ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 90px; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .topbar .grow { flex: 1; }
  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,136,62,.4); border-radius: 999px; padding: 4px 14px; font-size: 12px; }
  h1 { font-size: 24px; margin: 10px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
  .btn { display: inline-block; background: var(--accent); color: #0d1117; font-weight: 600; font-size: 14px; border: none; border-radius: 8px; padding: 10px 22px; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; flex: 1; min-width: 74px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .deck { perspective: 1200px; }
  .card { position: relative; width: 100%; min-height: 300px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; outline: none; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }
  .card-back { transform: rotateY(180deg); border-top: 3px solid var(--green); }
  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }
  .card-back .card-text { color: var(--green); font-weight: 600; }
  .why { font-size: 13.5px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; max-height: 130px; overflow-y: auto; }
  .why:empty { display: none; }
  .flip-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 10px; }
  .grade { display: flex; gap: 12px; margin-top: 16px; }
  .grade .btn { flex: 1; margin: 0; padding: 14px; font-size: 15px; }
  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .g-know { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }
  .g-know:hover { background: rgba(63,185,80,.12); filter: none; }
  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }
</style>

  <h1>Section 23 · Incident Response — Flashcards</h1>
  <p class="sub">Tap the card to flip it, then grade yourself honestly &mdash; the deck remembers what you know and will prioritize your weak cards.</p>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span>cards</span></div>
    <div class="stat"><b id="stKnown" style="color:var(--green)">0</b><span>known</span></div>

  <script>
    var DECKS = [{"label":"Section 23 · Incident Response","cards":[{"id":"1wy82kv","q":"Which CompTIA incident response phase includes building encrypted out-of-band communication paths and creating incident response kits?","a":"Preparation","why":"Preparation hardens systems, writes policies/procedures, sets up comms, trains staff, and builds kits.","multi":false},{"id":"z27zu6","q":"An analyst disconnects an infected laptop from the network so malware cannot spread. This action belongs to which phase?","a":"Containment","why":"Containment limits scope/magnitude — stopping spread comes before removal.","multi":false},{"id":"6kru9i","q":"Restoring servers from known-good backups and patching exploited vulnerabilities occurs in which phase?","a":"Recovery","why":"Recovery restores systems to a normal SECURED state and monitors for lingering threats.","multi":false},{"id":"gk02y8","q":"The seven CompTIA IR phases, in order, are:","a":"Preparation, Detection, Analysis, Containment, Eradication, Recovery, Post-Incident Activity","why":"Prep → Detect → Analyze → Contain → Eradicate → Recover → Post-incident (RCA, lessons learned, after-action report).","multi":false},{"id":"1cs8x04","q":"The central premise of threat hunting is:","a":"Assuming existing detection rules failed to alert on something malicious and searching for it","why":"Hunters proactively look for what signatures and queries missed.","multi":false},{"id":"s21nkw","q":"Threat hunters turn newly published vendor information about TTPs into action using:","a":"Advisories and bulletins fused with SIEM log data","why":"Advisories describe new TTPs before signatures exist; hunters correlate them with internal telemetry.","multi":false},{"id":"1lqarlx","q":"Step two of the four-step root cause analysis is:","a":"Determine the causal relationships that led to the incident","why":"RCA order: define/scope → causal relationships → effective solution → implement/track.","multi":false},{"id":"jrrij8","q":"The after-action report should contain:","a":"The root cause analysis and lessons-learned improvement recommendations","why":"It formally collects what happened, why, and how to improve — technical or executive-summary format.","multi":false},{"id":"12x95vu","q":"A discussion-based IR exercise where experts talk through a breach scenario without touching live systems is a:","a":"Tabletop exercise (TTX)","why":"Tabletops are cheap, theoretical scenario walk-throughs — often red vs blue discussion rounds.","multi":false},{"id":"az1rzt","q":"Before any penetration test begins, the team MUST agree on:","a":"A clear methodology and rules of engagement","why":"Pentests are goal-driven scenarios bound by agreed rules — e.g. DDoS attacks are typically excluded.","multi":false},{"id":"1lezocn","q":"Which phase of digital forensics focuses on securing the scene and determining the scope of evidence?","a":"Identification","why":"Identification = scene safety, contamination prevention, documentation, evidence scope.","multi":false},{"id":"1vpqh4y","q":"For an enterprise internal forensic investigation, who must authorize evidence collection?","a":"A high-level executive such as the CIO, CSO, or CEO","why":"Law enforcement uses warrants; enterprises need executive authorization to keep evidence admissible.","multi":false},{"id":"1khn1mb","q":"Select THREE actions that belong to the post-incident activity phase:","a":"Root cause analysis;  Lessons learned process;  After-action report","why":"Post-incident = RCA + lessons learned + after-action report. Quarantine/imaging happen during response.","multi":true},{"id":"1tz7lsr","q":"Which THREE roles belong on an incident response team?","a":"Team leader (skilled incident responder);  Legal counsel;  Human resources and public relations","why":"IR team = leader + SMEs + IT support + legal + HR + PR, with management funding and decision authority.","multi":true},{"id":"i7q125","q":"Which THREE are part of the forensic code of ethics?","a":"Avoiding bias;  Repeatable actions anyone can reproduce;  Preservation of evidence","why":"Unbiased, reproducible, preservation-focused work stands up to court scrutiny.","multi":true},{"id":"1v6tw3k","q":"Which TWO statements about order of volatility are correct?","a":"Collect the most volatile data first;  Memory (registers/cache/RAM) precedes mass storage","why":"NIST 800-86: memory → system state → storage → network logs → remote archives.","multi":true},{"id":"1etc7uc","q":"In incident response terms, an 'incident' is defined as:","a":"An act of violating an explicit or implied security policy","why":"Incidents are policy violations — unauthorized access, malware, credential misuse, etc.","multi":false},{"id":"axn2vs","q":"The primary goal of incident response is to:","a":"Minimize impact, reduce identification/containment time, and recover swiftly","why":"IR exists to contain damage and restore operations quickly — not to point fingers.","multi":false},{"id":"crdbv7","q":"NIST SP 800-61 defines how many incident response phases?","a":"Four","why":"NIST = 4 phases (Preparation; Detection & Analysis; Containment/Eradication/Recovery; Post-Incident). CompTIA expands to 7.","multi":false},{"id":"ulayfp","q":"For the SY0-701 exam, the incident response cycle has how many phases?","a":"Seven","why":"CompTIA splits detection/analysis and containment/eradication/recovery into 7 phases.","multi":false},{"id":"o79p2p","q":"Which phase includes hardening systems, writing policies, and setting up encrypted out-of-band communication paths?","a":"Preparation","why":"Preparation gets the organization ready before an incident: hardening, policies, comms plan, training, IR kits.","multi":false},{"id":"oqsyia","q":"Triage analysts categorizing and assessing the severity of a potential incident occurs in which phase?","a":"Detection","why":"Detection determines whether an incident occurred and triages its category/severity.","multi":false},{"id":"yox8np","q":"Understanding the scope and impact of an incident and notifying stakeholders happens in which phase?","a":"Analysis","why":"Analysis = deep examination of scope/impact + stakeholder notification + initial response actions.","multi":false},{"id":"otbye7","q":"Disconnecting an infected client from the network to stop malware spread is an act of:","a":"Containment","why":"Containment limits scope/magnitude — stop the spread before removal.","multi":false},{"id":"kc2t34","q":"Reinstalling a known-good image to fully remove malware is part of:","a":"Eradication","why":"Eradication removes the malicious activity from the system once contained.","multi":false},{"id":"tr2lx3","q":"Restoring systems from known-good backups, installing patches, and monitoring for lingering threats describes:","a":"Recovery","why":"Recovery returns systems to a normal SECURED state and watches for reinfection.","multi":false},{"id":"1aahhnk","q":"Which statement about the incident response process is TRUE?","a":"It often loops — new findings send you back to detection/analysis","why":"IR is iterative; discovering something new mid-response cycles you back.","multi":false},{"id":"olytiz","q":"The three major post-incident actions are:","a":"Root cause analysis, lessons learned, after-action report","why":"Post-incident activity = RCA + lessons learned process + after-action report.","multi":false},{"id":"14uzog7","q":"Threat hunting is best described as:","a":"A proactive search for threats that bypassed normal monitoring","why":"Hunters assume existing rules failed and actively look for what signatures miss.","multi":false},{"id":"icdsyg","q":"Threat hunting begins with:","a":"A hypothesis from threat modeling combined with threat intelligence","why":"Model who would attack, how, and impact; fuse with threat intel to form a hypothesis.","multi":false},{"id":"14jxspo","q":"What fundamentally distinguishes threat hunting from normal SOC monitoring?","a":"It assumes existing detection rules failed to alert on something malicious","why":"Monitoring reacts to known-signature alerts; hunting searches for what those rules missed.","multi":false},{"id":"z79k7u","q":"Vendor and researcher publications about newly discovered TTPs that hunters act on are called:","a":"Advisories and bulletins","why":"Advisories/bulletins describe new TTPs/vulns before signatures exist — prime hunting input.","multi":false},{"id":"xdil86","q":"Intelligence fusion in threat hunting means:","a":"Correlating external IoC/TTP threat feeds with your SIEM's internal logs","why":"Fusing external threat data with internal SIEM telemetry produces actionable intelligence.","multi":false},{"id":"ujjw3a","q":"The first step of the four-step root cause analysis process is to:","a":"Define/scope the incident","why":"RCA: ① define/scope → ② determine causal relationships → ③ identify effective solution → ④ implement and track.","multi":false},{"id":"1ho8uyj","q":"A 'no-blame' RCA approach, like the NTSB's, is important because it:","a":"Encourages open reporting and reveals systemic weaknesses instead of scapegoating","why":"No-blame cultures surface the real (often systemic) causes and prevent recurrence.","multi":false},{"id":"1tk7erh","q":"After RCA finds one vulnerable Windows 10 machine, checking how MANY other Windows 10 machines share the weakness demonstrates:","a":"RCA's network-wide prevention benefit","why":"RCA value = identifying the cause AND all similarly vulnerable systems to mitigate at scale.","multi":false},{"id":"ejux80","q":"Training differs from testing in that training is:","a":"Education so people understand processes, procedures, and priorities","why":"Training teaches what to do; testing proves you can do it.","multi":false},{"id":"12ml1ru","q":"Which exercise is discussion-based, inexpensive, but lacks hands-on experience?","a":"Tabletop exercise (TTX)","why":"Tabletops walk scenarios verbally around a table — cheap and theoretical.","multi":false},{"id":"14t1bqo","q":"In a red team vs blue team exercise, the blue team represents:","a":"The defenders","why":"Red = attackers, Blue = defenders; they trade moves to test controls and responses.","multi":false},{"id":"1fard9j","q":"A penetration test must always have:","a":"An agreed methodology and rules of engagement tied to a threat-modeling scenario","why":"Pentests are goal-driven (e.g. reach the database), scenario-based, and bound by agreed rules — DDoS is usually out of scope.","multi":false},{"id":"vb9le0","q":"Which set of tools/OSes did the course flag as penetration testing tools defenders should recognize on a network?","a":"Metasploit, Cobalt Strike, Kali Linux, ParrotOS, Commando OS","why":"These offensive tools on a network signal a pentest — or an attacker using the same tools.","multi":false},{"id":"lwb31d","q":"Simulation exercises differ from tabletops in that simulations:","a":"Provide realistic hands-on scenarios that test decisions under pressure and communication","why":"Simulations run authentic multi-stage scenarios (phishing to full breach) in a controlled environment.","multi":false},{"id":"bmk5nk","q":"The four phases of digital forensic procedures are:","a":"Identification, collection, analysis, reporting","why":"Identify (secure scene/scope) → Collect (authorized, volatility order, chain of custody) → Analyze → Report.","multi":false},{"id":"10blmex","q":"In an enterprise internal investigation, evidence collection authorization typically comes from:","a":"The CIO, CSO, CEO, or other high-level executive","why":"Law enforcement needs a warrant; internal investigations need executive authorization.","multi":false},{"id":"1trlvzj","q":"A legal hold is best described as:","a":"A formal instruction to preserve all potentially relevant data once litigation is reasonably expected","why":"Legal holds freeze electronic information — destroying covered data carries severe legal consequences.","multi":false},{"id":"h2pxar","q":"E-discovery refers to:","a":"Electronic discovery — identifying, collecting, and producing electronically stored information for litigation","why":"E-discovery sifts emails, documents, and databases to meet disclosure obligations.","multi":false},{"id":"x1rwq9","q":"The three key principles of the forensic code of ethics are:","a":"Avoiding bias, repeatable actions, preservation of evidence","why":"Ethics: unbiased analysis, reproducible methods, and never altering evidence.","multi":false},{"id":"p8cga9","q":"According to NIST SP 800-86, which should be collected FIRST?","a":"System memory including CPU cache and RAM","why":"Order of volatility: memory/system state first, archives last.","multi":false},{"id":"1525pun","q":"In the order of volatility, remotely stored archive data (backups, cloud) ranks:","a":"Last — least volatile","why":"Archives change rarely; collect them last after memory, storage, network logs.","multi":false},{"id":"793r0e","q":"Chain of custody is:","a":"A documented, verifiable record tracking evidence handling from collection to court","why":"Every handler documents transfers/actions; a broken chain can render evidence inadmissible.","multi":false},{"id":"1uipdnw","q":"The Windows registry area that exists ONLY in memory and should be captured via memory dump is:","a":"HKLMHardware (the HARDWARE hive)","why":"HKLMHardware is memory-resident; it logs every disk ever attached — analyze from a dump first.","multi":false},{"id":"11o8py9","q":"Data acquisition is defined as:","a":"Methods and tools used to create a forensically sound copy of data from a source device","why":"Acquisition = forensic copies of memory/disk with legal right to seize established first.","multi":false},{"id":"9dmxma","q":"BYOD (bring your own device) complicates data acquisition because:","a":"The organization may not legally own the device or have the right to search/seize it","why":"Consent/ownership questions can make evidence collected from employee-owned devices inadmissible.","multi":false},{"id":"9ah4be","q":"Disk imaging means:","a":"Creating a bit-by-bit copy of a storage device including deleted files and unallocated space","why":"A forensic image preserves everything; analysts work on the copy so the original stays pristine.","multi":false},{"id":"1xvtzn9","q":"In the FTK Imager lab, the raw image format usable by ANY forensic tool is:","a":"DD (raw)","why":"DD is universal; E01 is EnCase-specific and AFF is FTK-specific.","multi":false},{"id":"xzisd5","q":"File carving is used to:","a":"Extract files and fragments without relying on the file system — useful when metadata is missing or corrupt","why":"Carving recovers data by content signatures when the file system can't help.","multi":false},{"id":"7078w1","q":"After imaging a USB drive in Linux with dd, the lab demonstrated hashing with:","a":"md5sum (noting MD5 is weak — also use SHA-1/SHA-256)","why":"Hashes are logged as part of the chain of custody; MD5 alone is considered weak today.","multi":false},{"id":"1rmrqq4","q":"Why analyze a disk image instead of the original drive?","a":"Working on the original could modify evidence (e.g. change swap file contents)","why":"Any command run on the original can alter data; the image preserves evidentiary integrity.","multi":false},{"id":"drsg5s","q":"An employee uses a found password to log into a coworker's account. In IR terms this is:","a":"An incident — it violates the organization's security policy","why":"An incident = any violation of explicit or implied security policy, malware or not.","multi":false},{"id":"ruyd6w","q":"Triage analysts determining whether an incident occurred and rating its severity are performing which phase?","a":"Detection","why":"Detection = determining occurrence + categorizing and assessing severity.","multi":false},{"id":"8p7mzt","q":"Mid-response, the team finds additional suspicious activity and returns to examining logs. This shows the IR process is:","a":"Iterative — phases loop as new findings emerge","why":"IR commonly cycles back to detection/analysis when new evidence appears.","multi":false},{"id":"f0q2r6","q":"A 'lessons learned' session identifies that emergency change approvals were too slow. The proper outcome is to:","a":"Document the improvement and update processes (e.g. faster emergency approval paths)","why":"Lessons learned capture what to improve — like streamlining emergency change approvals during incidents.","multi":false},{"id":"1rxeus2","q":"Smaller organizations without dedicated IR teams typically:","a":"Form temporary ad-hoc teams as an additional duty for IT staff","why":"Small orgs assemble temporary teams per incident; outsourcing is the expensive alternative.","multi":false},{"id":"1pj5q1b","q":"When outsourcing incident response, a cited drawback is that external teams:","a":"Must spend time learning your network before they can respond effectively","why":"Outsourced IR is specialized but costly and unfamiliar with your enterprise at first.","multi":false},{"id":"9hovqg","q":"A hunter reads an advisory about new malware with no signatures yet and hunts for outbound C2 traffic. This hunter activity is fueled by:","a":"Advisories and bulletins plus threat intelligence fusion with SIEM data","why":"New-TTP advisories + IoC feeds correlated with internal logs drive hypothesis-based hunting.","multi":false},{"id":"hth3st","q":"End-user incident response training should primarily teach users to:","a":"Recognize and report suspected incidents (e.g. phishing) — with remedial training after mistakes","why":"Users are the reporters of incidents; clickers get remedial training to avoid repeats.","multi":false},{"id":"536vvq","q":"A red team's goal in a penetration test is defined by:","a":"A specific scenario derived from threat modeling (e.g. reaching the database)","why":"Pentests emulate a modeled adversary pursuing a defined objective under agreed rules.","multi":false},{"id":"1kt7mwd","q":"Seeing Kali Linux and Metasploit activity on the corporate network should make a defender think:","a":"Penetration testing — or an attacker using the same open-source tools","why":"Recognizing offensive tools (Kali, ParrotOS, Cobalt Strike, Commando) flags possible pentests or intrusions.","multi":false},{"id":"19ibom7","q":"During evidence identification at a potentially dangerous scene, the examiner's FIRST priority is to:","a":"Secure the scene for everyone's safety (e.g. with police) before preserving evidence","why":"Life safety first, then scene security, contamination prevention, documentation, and scoping.","multi":false},{"id":"1uk7pgw","q":"Forensic experts separate 'digital media collectors' from 'digital forensic examiners' mainly to:","a":"Reduce bias — examiners analyze without knowing victim/attacker details","why":"Analysts removed from case context rely only on evidence, minimizing bias (ethics principle #1).","multi":false},{"id":"y1ynq2","q":"Which THREE items were in the course's data-collection checklist during incident response?","a":"Capture and hash system images with FTK Imager;  Capture screenshots of the machine as found;  Review network traffic logs/captures and CCTV","why":"Also: witness statements, volatility ordering, licensing/docs review, and tracking man-hours/costs.","multi":true},{"id":"1vp76ao","q":"Which THREE phases belong to digital forensic procedures?","a":"Identification;  Collection;  Analysis","why":"Plus Reporting — identify, collect, analyze, report.","multi":true},{"id":"1r2yyvc","q":"Which TWO are reasons to document every forensic action (time, command, result, screenshot)?","a":"Repeatability — others can reproduce identical results;  Court defensibility against defense challenges","why":"Repeatable, documented methods keep findings admissible and withstand cross-examination.","multi":true},{"id":"dql9jn","q":"Which TWO statements about disk imaging are true?","a":"The image includes deleted files and unallocated space;  Analysis is performed on the image, never the original","why":"Bit-by-bit copies preserve everything; originals stay untouched to maintain integrity.","multi":true},{"id":"24nkog","q":"During the Analysis phase, which actions occur? (Choose the best single answer.)","a":"Examining scope/impact, notifying stakeholders, and initiating initial response actions","why":"Analysis = thorough examination of scope and impact + stakeholder notification + initial response.","multi":false},{"id":"khpk9h","q":"An IR plan's communication path should be encrypted and out-of-band primarily because:","a":"Attackers may have compromised in-band systems (email/phone) during the incident","why":"Preparation includes out-of-band comms so response coordination survives compromise of normal channels.","multi":false},{"id":"puvs9h","q":"The NTSB investigation of the Boeing 737 MAX crashes was cited to illustrate:","a":"A meticulous, independent, no-blame root cause analysis examining the whole chain of events","why":"NTSB's no-blame, systemic RCA is the model — findings grounded all 737 MAX jets until fixed.","multi":false},{"id":"oagtnm","q":"A threat hunter's final step after identifying how malware executed on infected hosts is typically to:","a":"Block the attack vector (e.g. application allowlisting or a blocklist) and create new IPS signatures/IoCs","why":"Hunting converts findings into new detections and preventive controls.","multi":false},{"id":"1toa0js","q":"Full-scale multi-site breach simulations can cost hundreds of thousands of dollars, yet organizations run them because they:","a":"Prove every participant can execute their role in a realistic crisis and expose plan gaps","why":"Simulations validate real-world execution, decision-making under pressure, and coordination across sites.","multi":false},{"id":"o9ej8f","q":"An executive's incident response training should focus on:","a":"Risk-versus-reward decision making and communication with law enforcement and media","why":"Role-based training: execs need managerial decision-making and comms skills, not technical forensics.","multi":false},{"id":"72d0kt","q":"During a forensic collection, a junior analyst reboots the suspect server to 'speed things up.' The primary damage is:","a":"Loss of volatile evidence (memory, running processes) that existed only while powered on","why":"Power cycling destroys volatile data; some evidence exists only on live systems — know your volatility order.","multi":false},{"id":"1is4wsv","q":"Why does the course recommend hashing evidence with SHA-1/SHA-256 in addition to MD5?","a":"MD5 is considered weak/collision-prone by modern standards","why":"The dd lab used md5sum but explicitly noted MD5's weakness — stronger hashes protect the chain of custody.","multi":false},{"id":"10zpu55","q":"In FTK Imager, image files are split into ~1.5 GB chunks mainly because:","a":"It is the software's default packaging; the tool reassembles them when loaded","why":"Chunking aids storage/handling; FTK reads 001+002 as one image — hashes still verify the whole.","multi":false},{"id":"lw0e16","q":"A defense attorney challenges forensic findings. The BEST protection the analyst has is:","a":"Strict adherence to documented, repeatable procedures with preserved original evidence","why":"Repeatability + preserved evidence + documentation = findings that survive legal scrutiny.","multi":false},{"id":"b6fpl1","q":"Organizations should appoint a legal liaison for forensic work primarily to:","a":"Keep evidence handling lawful when cooperating with law enforcement and courts","why":"A counsel-connected liaison keeps searches, seizures, and disclosures on the right side of the law.","multi":false},{"id":"1oy6flg","q":"Litigation becomes reasonably expected. The organization must immediately:","a":"Issue a legal hold preserving all potentially relevant electronic data","why":"Legal holds freeze electronic information; deleting covered data brings severe legal consequences.","multi":false},{"id":"wd5wm7","q":"Select THREE characteristics of the Preparation phase:","a":"Hardening systems and networks;  Writing policies and procedures;  Creating the communication plan with encrypted out-of-band paths","why":"Preparation also covers training/testing/exercising staff and building IR kits — all pre-incident work.","multi":true},{"id":"1pdcmh3","q":"Which THREE are true about threat hunting?","a":"It is proactive rather than reactive;  It assumes existing rules failed to generate alerts;  It uses the SIEM to correlate logs, processes, file systems, and registry changes","why":"Hunting targets NEW/unknown TTPs without signatures — complementing, not replacing, IR.","multi":true},{"id":"wf7a0","q":"Which THREE statements about penetration tests are correct?","a":"They follow a specific scenario based on threat modeling;  They require agreed methodology and rules of engagement;  DDoS attacks are usually outside the rules of engagement","why":"Authorized, goal-driven, rules-bound — the opposite of random unattacked testing.","multi":true},{"id":"1i607xz","q":"Which THREE practices preserve evidence integrity per the forensic ethics code?","a":"Analyzing the disk image, not the original;  Documenting every action for reproducibility;  Preventing bias by using analysts removed from the case","why":"Preservation + repeatability + no bias; touching originals or leaking evidence violates all three.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>

    var rs = document.getElementById('result-screen');
    if (rs && !rs.classList.contains('hidden') && rs.offsetParent !== null) return true;
    var big = document.querySelector('.score-big');
    if (big) {
      var el = big;
      while (el && el !== document.body) {
        if (el.classList && el.classList.contains('hidden')) return false;
        el = el.parentElement;
      }
      return big.offsetParent !== null;
    }
    return false;
  }
  function ensure() {
    if (!resultVisible() || document.getElementById('back-lib-btn')) return;

    a.id = 'back-lib-btn';
    a.href = lib();
    a.textContent = '\u2190 Back to Library';
    a.setAttribute('style', 'position:fixed;left:18px;bottom:18px;z-index:9999;' +
      'padding:11px 20px;border-radius:999px;font:600 14px/1 "Segoe UI",system-ui,sans-serif;' +

      'box-shadow:0 4px 18px rgba(240,136,62,.45);border:1px solid rgba(255,255,255,.25);');
    document.body.appendChild(a);
  }
  setInterval(ensure, 400);
  if (document.readyState !== 'loading') ensure();

})();
