  .btn:hover { filter: brightness(1.12); }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }

  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 14px; color: var(--muted); }

  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .card-front { border-top: 3px solid var(--accent); }

  .face-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .card-text { font-size: 16.5px; line-height: 1.6; flex: 1; overflow-y: auto; }

  .why:empty { display: none; }

  .g-learn { background: transparent; border: 1px solid var(--gold); color: var(--gold); }

  .g-learn:hover { background: rgba(210,153,34,.12); filter: none; }

  .deckdone { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 36px 22px; text-align: center; }
  .score-big { font-size: 56px; font-weight: 700; color: var(--green); margin: 6px 0; }
  @media (max-width: 600px) { .card { min-height: 340px; } .card-text { font-size: 15.5px; } }

  <h1>Section 2 · Threat Actors — Flashcards</h1>
  <p class="sub">Tap the card to flip it, then grade yourself honestly &mdash; the deck remembers what you know and will prioritize your weak cards.</p>
  <div class="stats">

      <div class="card-face card-back"><span class="face-tag">Answer</span><div class="card-text" id="back"></div><div class="why" id="why"></div><span class="flip-hint">tap to flip back</span></div>
    </div>

  <script>
    var DECKS = [{"label":"Section 2 · Threat Actors","cards":[{"id":"26sh3c","q":"A security analyst reviews an incident in which an attacker copied a database of customer PII and trade secrets to an external server over several weeks. Which motivation BEST describes the attacker?","a":"Data exfiltration","why":"Data exfiltration is the unauthorized transfer of data out of an organization. Its prime targets are intellectual property, PII, and trade secrets — exactly what was taken here.","multi":false},{"id":"142eyya","q":"An actor breaks into systems purely to cause mayhem and 'watch the world burn,' with no interest in money or ideology. Which motivation is this?","a":"Disruption and chaos","why":"Disruption/chaos-motivated hackers — unauthorized hackers, not ethical ones — simply enjoy causing mayhem. Unlike hacktivists they have no cause; unlike criminals they want no profit.","multi":false},{"id":"xdw9ql","q":"A contractor uses her legitimate access badge and intimate knowledge of the network to download proprietary data and hand it to a competitor. Which attribute classification does she have, and why?","a":"Internal, because her threat stems from her relationship to the organization and her legitimate (misused) access","why":"Internal vs. external is decided by the actor's relationship to the organization — not location. Anyone within the organization (employees, contractors, business associates) with legitimate access used in an unauthorized way is an internal threat actor.","multi":false},{"id":"v83lq4","q":"Which description matches an actor with LOW sophistication and capability?","a":"Relies on widely available tools and techniques such as common malware or phishing","why":"Low-sophistication actors use off-the-shelf tools and common techniques (the course's example is script kiddies). Custom malware, zero-days, long dwell times, and state funding all belong to the high end — nation-states and APT groups.","multi":false},{"id":"15yqmpt","q":"A group launches DDoS attacks and doxxes executives to protest what it calls censorship and human rights abuses by the target company. Which type of threat actor is MOST likely responsible?","a":"Hacktivists","why":"Hacktivists use cyber attacks — defacement, DDoS, doxxing, data leaks — to advance a political or social cause rather than for personal gain. Their signature technique list and cause-driven targeting distinguish them from profit-driven organized crime.","multi":false},{"id":"1kqbdob","q":"A criminal syndicate with clearly assigned roles, custom ransomware, and operations across six countries is MOST strongly motivated by:","a":"Financial gain","why":"Organized cybercrime groups are structured like traditional crime syndicates and exist almost entirely for financial gain — via data breaches, identity theft, online fraud, and ransomware. They may take political contracts, but only as paid mercenaries.","multi":false},{"id":"djcleq","q":"Malware used in an attack is deliberately crafted to look like the work of a well-known hacking group from another country, confusing attribution investigators. What is this technique?","a":"A false flag attack","why":"A false flag attack is orchestrated to appear as though it came from a different source than the real perpetrator, misleading investigators. Nation-states use it (with proxies for plausible deniability) — e.g., the 2018 Olympics malware mimicking North Korea but traced to Russia.","multi":false},{"id":"llp6jb","q":"An intruder gains access to a utilities network and remains undetected for eight months, quietly monitoring operations and stealing data without causing outages. This behavior is BEST described as:","a":"An advanced persistent threat (APT)","why":"An APT is a prolonged, targeted attack in which the intruder remains undetected for an extended period to steal data or monitor activity rather than cause immediate damage. APTs are typically nation-state sponsored or, increasingly, sophisticated organized crime.","multi":false},{"id":"3vs9ck","q":"A receptionist with a basic user account causes far more damage than an entry-level sysadmin with elevated privileges, because she knows exactly which files matter and how to reach them. What determines an insider's capability?","a":"Both the individual's role/level of access and their own level of knowledge","why":"Insider capability is determined by two factors: the role and access level they hold, AND their personal knowledge/skill. A skilled insider with minimal privileges can out-damage an unskilled admin with higher access.","multi":false},{"id":"19n96gs","q":"The IT department discovers employees have been sharing project files through a personal cloud storage service that security never approved or monitors. This is BEST described as:","a":"Shadow IT","why":"Shadow IT is the use of IT systems, devices, software, applications, or services without explicit organizational approval. Personal cloud storage for work data is a classic example — and IT cannot secure what it doesn't know exists.","multi":false},{"id":"ae48u","q":"An attacker phones an employee, claims to be from the company's bank, and pressures her into reading out a one-time verification code. Which threat vector is in use?","a":"Vishing (voice call-based)","why":"Voice call-based threat vectors — also known as vishing — use phone calls to trick victims into revealing sensitive information, often by impersonating a trusted entity like a bank or service provider.","multi":false},{"id":"13xylib","q":"An administrator is deploying a honeypot that must be reachable by potential attackers over the internet, yet isolated from production assets. Where should it be placed?","a":"Within a screened subnet or an isolated network segment","why":"A honeypot should be located within a screened subnet or an isolated segment of the network that is still easily accessible over the internet. That gives attackers a convincing target while protecting real production systems from anything that escapes the decoy.","multi":false},{"id":"4ka3ty","q":"Which of the following appear on the course's list of threat actor MOTIVATIONS? (Select THREE.)","a":"Data exfiltration;  Revenge;  Espionage","why":"The ten motivations: data exfiltration, blackmail, espionage, service disruption, financial gain, philosophical/political beliefs, ethical reasons, revenge, disruption/chaos, and war. Access control is a security mechanism; load balancing and non-repudiation are availability/integrity concepts.","multi":true},{"id":"11r3qct","q":"Which of the following are techniques commonly used by HACKTIVISTS? (Select THREE.)","a":"Website defacement;  Distributed denial of service attacks;  Doxxing","why":"The hacktivist toolkit: website defacement (electronic graffiti/vandalism), DDoS, doxxing (public release of private info), and leaking sensitive data. Ransom/sextortion is blackmail or organized crime; ATM cash-outs are the Carbanak organized crime group; air-gap USB crossing was Stuxnet's nation-state trick.","multi":true},{"id":"6kzf6n","q":"A company wants to REDUCE its attack surface. Which actions will help? (Select THREE.)","a":"Restricting access to systems and data;  Removing unnecessary software;  Disabling unused protocols","why":"An attack surface is minimized by restricting access, removing unnecessary software, and disabling unused protocols. Adding communication channels, removable devices, or unsecured wireless all EXPAND the attack surface.","multi":true},{"id":"h4dnb5","q":"Which of the following are deception technologies covered in the course? (Select FOUR.)","a":"Honeypots;  Honeynets;  Honeyfiles;  Honeytokens","why":"The four deception technologies: honeypots (decoy systems), honeynets (networks of honeypots), honeyfiles (decoy files), and honeytokens (fake data like bogus credentials). An evil twin is an ATTACK technique, and load balancers are availability infrastructure.","multi":true},{"id":"opl86b","q":"Which distinction does the course draw between motivation and intent?","a":"Motivation is the underlying reason; intent is the desired outcome of the action","why":"Motivation is the 'why' behind an attack (money, ideology, revenge); intent is the 'what' — the specific outcome the actor wants from an action, like data theft or service disruption. Exams often describe both and ask for one.","multi":false},{"id":"qlxjsd","q":"An attacker steals a company's product designs, customer PII, and trade secrets and quietly transfers them to an external server. Which motivation best describes this?","a":"Data exfiltration","why":"Data exfiltration is the unauthorized transfer of data out of an organization. Its prime targets are intellectual property, PII, and trade secrets.","multi":false},{"id":"h2y0a5","q":"A threat actor threatens to publish a victim's private photos unless payment is sent in Bitcoin. Which motivation — and which form of it — is at work?","a":"Blackmail, in the form of sextortion","why":"Blackmail means threatening to expose or damage unless demands are met, and payment is typically demanded in cryptocurrency like Bitcoin. Its forms include ransomware, doxxing, and sextortion.","multi":false},{"id":"1iqe2a5","q":"Which motivation is MOST commonly associated with nation-state actors?","a":"Espionage","why":"Espionage — spying to steal secrets — is mostly the domain of nation-state actors. (North Korea is the famous exception, hacking banks and crypto exchanges for revenue.)","multi":false},{"id":"cs7o9l","q":"A penetration tester is hired to attack a company's network with written authorization, then reports every weakness found. Which motivation drives this actor?","a":"Ethical reasons","why":"Actors motivated by ethical reasons are the 'good guys': penetration testers and bug bounty hunters, who are authorized to attack systems to find and report vulnerabilities.","multi":false},{"id":"1plpiiy","q":"An employee who was just fired logs in on his last day and deletes critical project files. Which motivation is the MOST likely driver?","a":"Revenge","why":"Revenge-motivated attacks come from disgruntled or fired employees aiming to harm the organization over a perceived wrong — like taking or destroying sensitive data on the way out.","multi":false},{"id":"8gj9gy","q":"Which attribute pair classifies a threat actor based on their relationship to the targeted organization?","a":"Internal vs. external","why":"The internal vs. external classification is based on the actor's relationship to the organization — not their physical location. Internal actors (employees, contractors, business associates) have legitimate access they misuse; external actors start with no authorized access.","multi":false},{"id":"1nlx9hr","q":"Why are internal threat actors often more damaging than external ones?","a":"They possess intimate knowledge of the infrastructure and its vulnerabilities","why":"Internal actors already know the network layout, security processes, and weak points — like a disgruntled employee with a working badge and knowledge of the building. That intimate knowledge makes them potentially more damaging than an outsider.","multi":false},{"id":"18cmmtc","q":"When rating threat actors from low to high sophistication, which traits mark the HIGH end of the scale?","a":"Custom-developed malware, zero-day exploits, and advanced evasion techniques","why":"High-sophistication actors have advanced technical skills, use custom malware and zero-day exploits, and can evade detection — like nation-state groups and APTs, which can dwell undetected in well-defended networks for extended periods.","multi":false},{"id":"9enhxg","q":"What BEST defines a script kiddie?","a":"An individual with limited technical knowledge who uses pre-made tools and scripts created by others","why":"Script kiddies lack the technical knowledge to develop their own tools or exploits, so they rely on scripts and programs built by others — often without understanding how they work.","multi":false},{"id":"1dfqryu","q":"A teenager downloads a ready-made tool, types in a target's IP address, and clicks a button to flood it with traffic. Which tool — and which motivation — fit this scenario?","a":"The Low Orbit Ion Cannon, motivated by recognition or the thrill of disruption","why":"The Low Orbit Ion Cannon (LOIC) is the classic point-and-click DDoS tool for unskilled attackers. Script kiddies are typically motivated by recognition, the thrill of disruption, or curiosity — not money or ideology — and they attack easy targets opportunistically.","multi":false},{"id":"v20tmz","q":"A group defaces a corporation's website with political slogans, then leaks internal emails to the press — all to protest the company's environmental record. What are they?","a":"Hacktivists","why":"Hacktivists use hacking to promote a political or social cause rather than personal gain. Their toolkit includes website defacement (electronic graffiti/vandalism), DDoS, doxxing, and leaking sensitive data.","multi":false},{"id":"aopi45","q":"What is doxxing?","a":"The public release of private information about an individual or organization to provoke real-world action against them","why":"Doxxing involves publicly releasing private information — name, home address, phone number, email — in hopes someone takes real-world action against the victim. It's a classic hacktivist technique and a form of blackmail.","multi":false},{"id":"9kj7le","q":"Which hacktivist group launched 'Operation Payback' with DDoS attacks against anti-piracy organizations like the MPAA and RIAA?","a":"Anonymous","why":"Anonymous — a loosely affiliated collective — launched Operation Payback in 2010 against organizations involved in digital anti-piracy, including the MPAA and RIAA. LulzSec ran '50 Days of Lulz' in 2011 against Sony, the CIA, and the FBI.","multi":false},{"id":"y3dxeo","q":"What is the PRIMARY motivation of organized cybercrime groups?","a":"Financial gain","why":"Organized cybercrime groups are motivated almost entirely by financial gain — via data breaches, identity theft, online fraud, and ransomware. Unlike hacktivists or nation-states, they aren't driven by ideology (though governments can hire them as 'hired guns').","multi":false},{"id":"1bfjd6c","q":"FIN7 and the Carbanak group are cited in the course as examples of which threat actor type?","a":"Organized cybercrime groups","why":"FIN7 is a sophisticated cybercrime syndicate known for advanced phishing against retail and hospitality; the Carbanak group reportedly stole over $1 billion from banks worldwide using its custom Carbanak malware to move money and dispense ATM cash remotely.","multi":false},{"id":"1v2yk2k","q":"Why are transnational organized cybercrime groups especially difficult to prosecute?","a":"Their operations cross national borders, creating legal complexity for law enforcement","why":"Operating across national borders gives these groups anonymity and global reach while increasing complexity for law enforcement trying to investigate and prosecute them.","multi":false},{"id":"1y74oiu","q":"Which statement about nation-state actors is TRUE?","a":"They may operate as independent entities with state-backed resources so the country keeps plausible deniability","why":"Nation-state actors usually belong to intelligence or military organizations but may operate as independent entities with state backing — giving the country plausible deniability. They pursue long-term strategic goals (intelligence, disruption, influence), not quick profit, and they can even cross air gaps, as Stuxnet showed.","multi":false},{"id":"1s7uexe","q":"Investigators find malware whose code mimics a known North Korean tool, but deeper analysis reveals it was actually built by Russian actors trying to frame North Korea. What is this called?","a":"A false flag attack","why":"A false flag attack is orchestrated to appear as if it originated from a different source or group than the actual perpetrators, misleading investigators and attribution — like the 2018 Winter Olympics malware that mimicked North Korean tools but was traced to Russia.","multi":false},{"id":"1evvtch","q":"Stuxnet is a landmark nation-state attack because it…","a":"Caused physical damage to Iranian nuclear centrifuges by crossing an air gap on USB drives and exploiting Windows zero-days","why":"Attributed to the US and Israeli governments, Stuxnet sabotaged Iran's nuclear program by physically damaging enrichment centrifuges. It used multiple Windows zero-days, spread undetected, and crossed the facility's air gap by infecting USB drives.","multi":false},{"id":"4k714g","q":"Which nation-state is the notable EXCEPTION that conducts cyber operations primarily for financial gain?","a":"North Korea","why":"Most nation-states pursue strategic goals, not money. But due to its isolated economy and international sanctions, North Korea's state actors target banks, cryptocurrency exchanges, and financial institutions to fund the regime.","multi":false},{"id":"1aqt2z0","q":"Which statement best defines an advanced persistent threat (APT)?","a":"A prolonged, targeted attack in which an intruder stays undetected for an extended period to steal data or monitor activity rather than cause immediate damage","why":"An APT is a prolonged and targeted cyberattack where the intruder gains unauthorized access and remains undetected for an extended period to steal data or monitor the network. The term once meant nation-state specifically, but highly sophisticated organized crime groups are now also called APTs.","multi":false},{"id":"2q3u3h","q":"Edward Snowden's 2013 leak of classified NSA material and the 2020 Twitter Bitcoin scam both illustrate which threat type?","a":"Insider threats","why":"Snowden was an NSA contractor with legitimate access whose intimate knowledge let him gather data undetected; the 2020 Twitter attack involved an external attacker collaborating with two insiders. Both are textbook insider threat cases.","multi":false},{"id":"nys7a9","q":"An untrained employee clicks a phishing link and unknowingly lets malware into the corporate network. How is this BEST classified?","a":"An unintentional insider threat caused by carelessness or lack of awareness","why":"Insider threats aren't always malicious — they can be unintentional, the result of carelessness or poor security awareness, like an untrained user clicking a phishing link. Insider threats originate from within (current/former employees, contractors, associates) and can also facilitate external attacks by planting backdoors.","multi":false},{"id":"1vh741g","q":"Which set of measures does the course recommend to mitigate insider threats?","a":"Zero Trust architecture, robust access controls, regular audits, and employee security awareness programs","why":"The course's mitigation package: implement a Zero Trust architecture, employ robust access controls, conduct regular audits, and provide effective employee security awareness training.","multi":false},{"id":"1xqmfam","q":"An employee stores work documents in a personal Dropbox account and installs an unapproved browser plugin — both without telling IT. What is this called?","a":"Shadow IT","why":"Shadow IT is the use of IT systems, devices, software, applications, or services without explicit organizational approval (also called stealth IT or client IT). Personal cloud storage and unapproved plugins are classic examples.","multi":false},{"id":"bkto4z","q":"What does the course identify as a root cause of shadow IT?","a":"Organizations set their security posture too high or too complex for business operations to function smoothly","why":"Shadow IT often exists because the security posture is set too high or is too complex for business to operate — like a 45-day approval process for a $100 monitor, which drives employees to buy and connect their own. Convenience and cloud/BYOD trends also fuel it.","multi":false},{"id":"1yjvccl","q":"Why is shadow IT considered so dangerous?","a":"IT cannot secure hardware, software, or services it doesn't know exist","why":"If the technology department doesn't know a device, app, or cloud service is in use, it cannot secure it — unknown posture, no lifecycle management, no patching. That opens the door to data breaches, non-compliance, and disruption.","multi":false},{"id":"1vde1or","q":"Which statement correctly separates a threat vector from an attack surface?","a":"Threat vector = the means or pathway of attack; attack surface = all the points where an unauthorized user could enter or extract data","why":"Think 'vector = how, surface = where.' A threat vector is the pathway used to deliver a payload or unwanted action; the attack surface is the sum of all potential entry points and vulnerabilities. Shrink it by restricting access, removing unneeded software, and disabling unused protocols.","multi":false},{"id":"16lhq73","q":"In the Stegano attack (2017), cyber criminals embedded malicious code where — and how did it execute?","a":"Within the pixels of banner ads on popular websites; it executed when a vulnerable Internet Explorer browser loaded the image","why":"Stegano was a large-scale image-based attack: malicious code was hidden inside the pixels of banner ads. When a user visited a site carrying the ad, vulnerable versions of Internet Explorer executed the code and redirected the user to an exploit kit that silently installed malware.","multi":false},{"id":"1u2lvuh","q":"An attacker leaves malware-infected USB drives in a company's parking lot, hoping curious employees will plug them in. What is this technique called?","a":"Baiting","why":"Baiting is the classic removable-device technique: leave an infected USB drive where a target will find it (parking lot, lobby) and let curiosity do the rest. An alternative is social-engineering a way into the building to connect the device directly.","multi":false},{"id":"190aqoo","q":"An attacker sets up a rogue Wi-Fi access point named 'Airport_Free_WiFi' that mimics a legitimate network, then intercepts the traffic of users who connect. What is this?","a":"An evil twin attack","why":"An evil twin is a rogue access point that imitates a legitimate Wi-Fi network. Users who connect have their data intercepted, captured, and possibly modified. It's the signature wireless threat vector.","multi":false},{"id":"cpttxh","q":"Which pairing of Bluetooth attacks is correct?","a":"BlueBorne = a set of vulnerabilities letting attackers take over devices, spread malware, or run on-path attacks without user interaction; BlueSmack = a DoS that crashes devices via oversized L2CAP packets","why":"BlueBorne is a family of Bluetooth vulnerabilities that lets an attacker seize devices, spread malware, or intercept communications — with no user interaction. BlueSmack is a denial-of-service attack that exhausts a device's resources with a specially crafted L2CAP packet until it crashes.","multi":false},{"id":"1qfvh4j","q":"What is the PRIMARY purpose of a honeypot?","a":"To gather information about attackers' methods, motives, and TTPs","why":"A honeypot is a decoy system with attractive fake vulnerabilities. It is NOT designed to block attacks — it logs everything so defenders can study methods, motives, and tactics/techniques/procedures (TTPs). It should sit in a screened subnet or isolated segment.","multi":false},{"id":"v5621f","q":"What makes a honeynet a 'double-edged sword'?","a":"An attacker who discovers it can study it and learn how the organization's production systems are configured","why":"A honeynet is a whole network of honeypots mimicking servers, routers, and switches. It logs successful and failed attacks — but if attackers realize what it is, they can learn about your real production configuration from it, which cuts both ways.","multi":false},{"id":"1rbdivc","q":"A security team creates a fake user account named 'Admin' that no legitimate user would ever touch. Any login attempt with it triggers an alert. What is this?","a":"A honeytoken","why":"A honeytoken is a piece of data with no legitimate value — a fake account, bogus URL, or dummy database record — that is monitored for access. Since no one should ever use it, any interaction signals a likely breach. Honeytokens are especially good at catching insider threats and tracing data-leak pathways.","multi":false},{"id":"1uweffm","q":"How is a honeyfile different from a honeytoken?","a":"A honeyfile is a decoy file that looks valuable and contains fake data with watermarks; a honeytoken is fake data itself, like a bogus credential or dummy record","why":"A honeyfile is a decoy FILE (any type) planted under looser defenses, containing fake data plus hidden watermarks/identifiers, and it raises an alert when opened. A honeytoken is a piece of fake DATA — an account, URL, or record — where any use at all is inherently suspicious.","multi":false},{"id":"vhwwto","q":"An attacker encrypts a hospital's patient records and demands $250,000 in Bitcoin to restore access. The course places this attack under which motivation — and which of its named forms?","a":"Blackmail, in the form of ransomware","why":"Blackmail means threatening harm unless demands are met, and ransomware is one of its three named forms (alongside doxxing and sextortion). Payment is typically demanded in cryptocurrency such as Bitcoin.","multi":false},{"id":"juwnd0","q":"A help-desk contractor works fully remotely but holds a legitimate admin account. He abuses that access to sabotage the ticketing system. How is he classified, and what decides it?","a":"Internal, because classification follows his relationship to the organization and his legitimate (misused) access","why":"Internal vs. external is based on the actor's relationship to the targeted organization — not physical location. Employees, contractors, and business associates with legitimate access used in an unauthorized way are internal threat actors, whether they sit in the office or at home.","multi":false},{"id":"1fxwwn6","q":"Which group carried out '50 Days of Lulz' in 2011, hitting targets including Sony, the CIA, and the FBI — and what actor type were they?","a":"LulzSec — hacktivists","why":"LulzSec — the name combines 'lulz' and 'security' — ran the 50 Days of Lulz campaign against Sony, the CIA, and the FBI. Motivated partly by chaos and partly by opposition to censorship and surveillance, they are a classic hacktivist group. Anonymous ran Operation Payback in 2010.","multi":false},{"id":"1klamcy","q":"A criminal group uses self-developed malware to infiltrate banking networks, transfer money between accounts, and force ATMs to dispense cash — reportedly stealing over $1 billion. Which group, and which actor type?","a":"Carbanak — organized cybercrime","why":"The Carbanak group is an organized cybercrime operation that reportedly stole over $1 billion from banks worldwide using its custom Carbanak malware to move funds and dispense ATM cash remotely. FIN7, another organized crime group, is known for phishing campaigns against retail and hospitality.","multi":false},{"id":"1xwk7m7","q":"Which nation-state's actors are the documented exception that conducts cyber operations primarily to generate revenue — targeting banks and cryptocurrency exchanges?","a":"North Korea","why":"Most nation-state actors pursue strategic goals, not money. But due to its isolated economy and international sanctions, North Korea's state actors target banks, cryptocurrency exchanges, and financial institutions to fund the regime's objectives.","multi":false},{"id":"qd1xqw","q":"From his employer's perspective, the US government classified Edward Snowden as an insider threat because he…","a":"Used his legitimate access and system knowledge to gather and leak classified data undetected","why":"Snowden was an NSA contractor — an insider — whose intimate knowledge of the systems and his access privileges let him collect a huge volume of data without detection before leaking it in 2013. His case shows how damaging a trusted insider can be, regardless of how history judges his motives.","multi":false},{"id":"nv43xf","q":"At one company, getting a second monitor approved takes 45 days — so employees buy their own and plug them in. The course uses this to explain the ROOT CAUSE of what phenomenon?","a":"Shadow IT","why":"Shadow IT often arises when an organization's security posture is set too high or too complex for business to function smoothly. The 45-day monitor example shows how friction pushes employees to bring in unapproved technology — which IT then cannot secure or manage.","multi":false},{"id":"q2512t","q":"An employee downloads a 'cracked' version of a video game from a website; the installer turns out to be laced with malware. Which threat vector delivered this attack?","a":"File-based","why":"File-based threat vectors use malicious files disguised as legitimate documents or software — transferred as email attachments, through file-sharing services, or hosted on malicious websites. Pirated software is the classic delivery vehicle.","multi":false},{"id":"ay0pyk","q":"An attacker exploits Bluetooth vulnerabilities to take over nearby devices, spread malware, and position for an on-path attack — all without any user interaction. Which attack is this?","a":"BlueBorne","why":"BlueBorne is a set of Bluetooth vulnerabilities that lets an attacker seize devices, spread malware, or establish an on-path attack to intercept communications — with no user interaction required. BlueSmack, by contrast, is a Bluetooth denial-of-service attack.","multi":false},{"id":"8edgk7","q":"A defender deploys a Windows user account named 'Route' that no legitimate person will ever use. The instant anyone tries to authenticate with it, an alarm fires. Which technology is this, and what is it especially good at detecting?","a":"A honeytoken — insider threats and data-leak pathways","why":"A honeytoken is fake data with no legitimate value — like a fabricated 'Admin' or 'Route' account. Because no real user would ever touch it, any interaction signals a likely breach. Honeytokens are particularly effective at detecting insider threats and tracing data-leak pathways.","multi":false},{"id":"1o9mte","q":"Security teams deploy deception systems mainly so they can observe attackers and learn their:","a":"TTPs — tactics, techniques, and procedures","why":"Deception technologies (honeypots, honeynets, honeyfiles, honeytokens) log and monitor attackers so defenders can learn their TTPs — the specific methods and patterns of activity associated with a particular threat actor or group — and develop effective countermeasures.","multi":false},{"id":"14axor3","q":"The course names three forms of blackmail. Which of the following are they? (Select THREE.)","a":"Ransomware;  Doxxing;  Sextortion","why":"Blackmail's three forms: ransomware (encrypt/block until paid), doxxing (threatening to release private information), and sextortion (threatening to expose intimate material). Payment is typically demanded in cryptocurrency like Bitcoin.","multi":true},{"id":"u94u1r","q":"Which of the following EXPAND an organization's attack surface, according to the course? (Select THREE.)","a":"Adopting email and instant messaging for communications;  Allowing removable devices on the network;  Permitting connections to unsecured networks","why":"Email/IM gives attackers phishing avenues, removable devices introduce vulnerabilities, and unsecured networks can be exploited — all of which widen the attack surface. Restricting access, removing unneeded software, and disabling unused protocols SHRINK it.","multi":true},{"id":"3g29xg","q":"Which of the following are examples of shadow IT? (Select THREE.)","a":"An employee storing work documents in a personal Dropbox account;  An employee installing an unapproved browser plugin;  A self-purchased USB drive connected to a work PC","why":"Shadow IT = any IT used without explicit organizational approval: personal cloud storage for work files, unapproved software/plugins, and self-bought peripherals. Anything IT deployed, approved, and manages is not shadow IT — by definition, IT can't secure what it doesn't know exists.","multi":true},{"id":"jbyklf","q":"Which of the following are DISRUPTION strategies named in the course for outsmarting threat actors? (Select FOUR.)","a":"Bogus DNS entries;  Decoy directories;  Dynamic page generation;  Port triggering","why":"The course's disruption strategies: bogus DNS entries (send attackers to non-existent domains), decoy directories (fake folders that raise alerts), dynamic page generation (confuse web crawlers), port triggering (ports closed until an outbound pattern is seen), and spoofed fake telemetry (report a fake OS fingerprint during scans). MAC cloning and VLAN hopping are wired-network ATTACK techniques.","multi":true},{"id":"cbe16g","q":"During attribution analysis of an attack on an Asian telecom, investigators find malware whose code closely mimics a documented North Korean implant. However, subtle artifacts in the build toolchain and compile timestamps point to a Russian development environment. Which conclusion is MOST accurate?","a":"The attackers likely staged a false flag — deliberately framing another group — and reliable attribution requires looking deeper than surface indicators","why":"A false flag attack is orchestrated to appear as if it came from a different source, misleading investigators. The course's example is the 2018 Winter Olympics malware, which mimicked North Korean tools but was traced to Russian actors. Surface resemblance is exactly what a false flag plants; solid attribution demands deeper analysis.","multi":false},{"id":"1wy5y1b","q":"An incident report states: 'The threat actor's underlying driver was financial gain, while their immediate objective was coercing payment by encrypting the victim's file shares.' Which mapping of the course's terminology is correct?","a":"'Driver' is the actor's motivation (financial gain); 'objective' is the actor's intent (forcing payment via encryption)","why":"Motivation is the underlying reason (why: money, ideology, revenge); intent is the desired outcome of the specific action (what: coercing payment, stealing data, disrupting service). The stem describes both — the exam may ask for either.","multi":false},{"id":"boh2q2","q":"Two insiders occupy the same system: a highly skilled intern with a basic user account, and an entry-level system administrator with far broader default privileges. Who is capable of causing more damage, and what principle explains it?","a":"The intern, because individual skill can outweigh access level — insider capability is a function of BOTH role/access AND personal knowledge","why":"Insider capability is determined by two factors: the individual's role and level of access, AND their own level of knowledge. A skilled attacker with a regular user account can cause as much or more damage than an unskilled admin with higher privileges.","multi":false},{"id":"18vps7o","q":"Malware is spreading through a company's network, but the help desk cannot identify the infection's origin or scope. Investigation reveals several employees installed an unsanctioned utility weeks earlier — software IT never knew existed. Which consequence of shadow IT does this BEST illustrate?","a":"Because IT lacks awareness of unsanctioned technology, incidents become significantly harder to investigate and resolve","why":"When problems arise from unsanctioned technology, they are harder to resolve precisely because the IT department lacks awareness or understanding of the technology deployed. The course's example: malware hidden in an unknown user-installed program is nearly impossible to trace. The root issue: IT cannot secure what it doesn't know exists.","multi":false},{"id":"qng8ls","q":"Which characteristic MOST clearly distinguishes an advanced persistent threat (APT) from an opportunistic intrusion such as a script kiddie's attack?","a":"The APT actor maintains unauthorized access undetected for an extended period to steal data or monitor activity, rather than seeking immediate damage","why":"An APT is defined by prolonged, targeted presence: the intruder stays undetected for an extended period to steal data or monitor the network — not to cause immediate damage. Opportunistic attacks by unskilled actors are typically quick, noisy, and tool-driven.","multi":false},{"id":"ts2uch","q":"A red team leader warns that deploying a honeynet carries risk for the very environment it protects. What is she referring to?","a":"An attacker who realizes they're inside a honeynet can study it and infer how the organization's production systems are configured","why":"A honeynet mimics an entire network of systems. It logs valuable attack data, but it's a double-edged sword: attackers can use the honeynet to learn how your production systems are configured, turning your own deception against you.","multi":false},{"id":"1ixypei","q":"A security engineer creates a spreadsheet named '2026-Salaries.xlsx', fills it with fabricated figures, embeds unique invisible identifiers, and drops it in a folder with weaker permissions than real financial data. When a copy of the file surfaces on a leak site months later, the team knows exactly which copy was taken. What is this?","a":"A honeyfile","why":"A honeyfile is a decoy FILE that appears to contain valuable data but holds fake content, hidden metadata, and watermarks/unique identifiers that help track it if stolen or copied. A honeytoken is fake DATA (a credential, URL, or record), not a document.","multi":false},{"id":"1bkvj9g","q":"An administrator wants certain services to stay invisible to attackers scanning for open ports, yet instantly available to legitimate users when needed. She configures the services to remain closed until a specific outbound traffic pattern is observed, at which point the port opens temporarily. Which technique is this?","a":"Port triggering","why":"Port triggering keeps ports closed until a specific outbound traffic pattern is detected, then opens the port temporarily. Services stay invisible and inaccessible to scanners while remaining available to legitimate users — one of the course's named disruption strategies.","multi":false},{"id":"11c2211","q":"A security appliance detects an attacker fingerprinting the network. It responds to the scan by reporting that the scanned host runs Windows 11 — when it actually runs macOS — causing the attacker's Windows-only exploit to fail. Which disruption strategy is in use?","a":"Spoofing fake telemetry data","why":"Spoofing fake telemetry means responding to a detected network scan with fabricated data — like reporting a different OS — so the attacker mis-targets exploits and can't identify genuine vulnerabilities or the real network layout.","multi":false},{"id":"9275v2","q":"In the Stegano image-based attack, victims experienced which combination of events, entirely without any visible indication that an attack occurred?","a":"They browsed sites with malicious banner ads; their vulnerable browser executed code hidden in the image pixels, redirected them to an exploit kit, which silently installed malware","why":"Stegano (2017) embedded malicious code within the pixels of banner ads. When a vulnerable Internet Explorer browser loaded the image, the code executed, redirected the user to an exploit-kit site, and the kit downloaded and installed malware — all with no visible sign anything happened.","multi":false},{"id":"1413nzs","q":"A defense team wants the earliest possible warning that sensitive customer records are being copied or leaked from inside the company. They deploy something that has NO legitimate value or use, so that any interaction with it is inherently suspicious. Which solution BEST meets this requirement?","a":"A honeytoken — fake data such as a bogus account or dummy database record, where any access signals a likely breach","why":"A honeytoken is data with no legitimate value — a fake account, bogus URL, or dummy record — that is monitored for access. Because no legitimate user would ever touch it, any interaction indicates a likely breach, making honeytokens ideal for insider-threat detection and early warning of data-leak pathways.","multi":false},{"id":"bv1peu","q":"Which threat actor is MOST likely to scan the internet for systems with unpatched, publicly known vulnerabilities and attack them using ready-made tools they didn't write — prioritizing easy targets over high-value ones?","a":"An unskilled attacker (script kiddie)","why":"Unskilled attackers lack the skill to develop their own tools, so they use ready-made exploits against unpatched known vulnerabilities. They are opportunistic rather than targeted — focusing on easier targets instead of higher-value ones — though their sheer numbers can still cause serious problems.","multi":false},{"id":"x0gk5u","q":"A CISO wants to reduce the risk of insider threats. Which of the following measures does the course recommend? (Select FOUR.)","a":"Implement a Zero Trust architecture;  Employ robust access controls;  Conduct regular audits;  Provide effective employee security awareness programs","why":"The course's insider-threat mitigation package: Zero Trust architecture, robust access controls, regular audits, and effective security awareness training. Password length alone and perimeter-only thinking both contradict the course's 'trust nothing, verify everything' direction — insiders are already inside the perimeter.","multi":true},{"id":"vntsj0","q":"Which of the following are characteristic of TYPICAL nation-state threat actors? (Select THREE.)","a":"They may operate through proxies so the sponsoring country keeps plausible deniability;  They conduct false flag attacks to mislead attribution;  They employ zero-day exploits and custom-developed malware","why":"Nation-state actors use proxies for plausible deniability, stage false flags, and wield zero-days with custom malware in pursuit of long-term strategic goals. Immediate profit (the North Korean exception), easy-target opportunism, and borrowed scripts describe other actor types.","multi":true},{"id":"1adurmm","q":"A security awareness program covers attacks that trick people into handing over access or information. Which of the following are SOCIAL-ENGINEERING-based threat vectors? (Select FOUR.)","a":"A phishing email with a malicious attachment;  An SMS text luring the victim to a credential-harvesting site (smishing);  A vishing call impersonating a bank;  A baited USB drive planted in a parking lot","why":"Phishing (email), smishing (SMS), vishing (voice), and baiting (planted removable media) all manipulate people into cooperating. BlueSmack and VLAN hopping are pure technical attacks against protocols — no human persuasion involved.","multi":true},{"id":"ppcms3","q":"Which of the following are documented RISKS that shadow IT introduces into an organization? (Select THREE.)","a":"Potential data breaches from unmonitored services;  Non-compliance with regulations;  System disruption and a lack of standardization across the network","why":"Shadow IT risks: data breaches, regulatory non-compliance, system disruption, and a lack of standardization that complicates management, planning, and incident resolution. Unsanctioned systems can also boost productivity — which is why it persists — but they degrade rather than improve patching and monitoring coverage.","multi":true}]}];
    var KEY = 'secplus_cards_v1';
    var deckIdx = 0, order = [], pos = 0, flipped = false;
    function loadState(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
    function saveState(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
    function deck(){ return DECKS[deckIdx]; }
    function state(){ var s = loadState(); return s[deck().label] || {}; }
    function setState(st){ var s = loadState(); s[deck().label] = st; saveState(s); }
    function isWeak(c){ return state()[c.id] !== 'known'; }
    function buildOrder(){
      var cards = deck().cards.slice();
      if (document.getElementById('weakOnly').checked) {
        cards = cards.filter(isWeak);
        if (!cards.length) cards = deck().cards.slice();
      }
      if (document.getElementById('shuffle').checked) {
        for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
      } else {
        cards.sort(function(a, b){ return (state()[a.id] === 'known') - (state()[b.id] === 'known'); });
      }
      order = cards; pos = 0;
    }
    function paintStats(){
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      document.getElementById('stTotal').textContent = deck().cards.length;
      document.getElementById('stKnown').textContent = k;
      document.getElementById('stLearn').textContent = deck().cards.length - k;
      document.getElementById('stPos').textContent = order.length ? (pos + 1) + '/' + order.length : '0/0';
    }
    function show(){
      flipped = false;
      var card = document.getElementById('card');
      card.classList.remove('flipped');
      if (pos >= order.length) { finish(); return; }
      document.getElementById('deck').style.display = '';
      document.getElementById('deckDone').style.display = 'none';
      var c = order[pos];
      document.getElementById('front').textContent = c.q;
      document.getElementById('back').textContent = c.a;
      document.getElementById('why').textContent = c.why || '';
      paintStats();
    }
    function finish(){
      document.getElementById('deck').style.display = 'none';
      document.getElementById('deckDone').style.display = '';
      var st = state(), k = 0;
      deck().cards.forEach(function(c){ if (st[c.id] === 'known') k++; });
      var pct = deck().cards.length ? Math.round(100 * k / deck().cards.length) : 0;
      document.getElementById('donePct').textContent = pct + '%';
      document.getElementById('donePct').style.color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      document.getElementById('doneMsg').textContent = pct >= 80 ? 'Deck mastered — well done. Come back before exam day to keep it fresh.' : pct >= 50 ? 'Good progress. Run "Weak cards only" until this hits 80%.' : 'Keep drilling — mark honestly and the deck will carry you.';
      paintStats();
    }
    function flip(){ flipped = !flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
    function grade(known){
      var st = state();
      st[order[pos].id] = known ? 'known' : 'learning';
      setState(st);
      pos++;
      show();
    }
    document.getElementById('card').addEventListener('click', flip);
    document.getElementById('card').addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    document.getElementById('btnKnow').addEventListener('click', function(){ grade(true); });
    document.getElementById('btnLearn').addEventListener('click', function(){ grade(false); });
    document.getElementById('shuffle').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('weakOnly').addEventListener('change', function(){ buildOrder(); show(); });
    document.getElementById('restart').addEventListener('click', function(){ pos = 0; show(); });
    document.getElementById('again').addEventListener('click', function(){ buildOrder(); show(); });
    document.getElementById('deckSel').addEventListener('change', function(){ deckIdx = parseInt(this.value, 10); buildOrder(); show(); });
    document.addEventListener('keydown', function(e){ if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } if (e.key === 'ArrowRight') grade(true); if (e.key === 'ArrowLeft') grade(false); });
    buildOrder(); show();
  </script>
